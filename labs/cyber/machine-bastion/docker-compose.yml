# Machine « Bastion » : deux conteneurs isolés sur un réseau interne.
#  - attaquant : poste Kali (terminal du lab), image partagée « tdm-kali-attaquant » ;
#  - cible     : serveur vulnérable, joignable seulement depuis « attaquant » (hôte « cible »).
# Rien n'est publié vers l'hôte : tout reste dans le réseau du lab.
services:
  attaquant:
    image: tdm-kali-attaquant:latest
    build: ../_attaquant
    command: ["sleep", "infinity"]
    networks: [bastion]
    depends_on: [cible]

  cible:
    build: ./cible
    networks: [bastion]
    # pas de ports: la cible n'est accessible que par le conteneur attaquant

networks:
  bastion:
    internal: true   # aucun accès à l'extérieur : le lab est confiné
