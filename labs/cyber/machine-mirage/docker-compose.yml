# Machine « Mirage » : deux conteneurs isolés sur un réseau interne.
#  - attaquant : poste d'où l'on travaille (terminal du lab) ;
#  - cible     : serveur vulnérable, joignable seulement depuis « attaquant » (hôte « cible »).
# Rien n'est publié vers l'hôte : tout reste dans le réseau du lab.
services:
  attaquant:
    build: ./attaquant
    command: ["sleep", "infinity"]
    networks: [mirage]
    depends_on: [cible]

  cible:
    build: ./cible
    networks: [mirage]
    # pas de ports: la cible n'est accessible que par le conteneur attaquant

networks:
  mirage:
    internal: true   # aucun accès à l'extérieur : le lab est confiné
