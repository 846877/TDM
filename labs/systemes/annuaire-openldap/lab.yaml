title: Annuaire OpenLDAP
level: avance
order: 9
tags: [ldap, openldap, annuaire, ldif, acl, nss, nslcd]
summary: Démarrer slapd, structurer l'annuaire en OU, créer utilisateurs, groupes et compte de service en LDIF, modifier, protéger par ACL, brancher un poste Linux et sauvegarder.
compose: docker-compose.yml
service: admin
shell: bash
workdir: /root
description: |
  **Contexte.** *Ateliers Durand* veut un **annuaire central** pour ses comptes Linux et ses applications
  (intranet, wiki, VPN...), sans attendre le projet Active Directory. Tu mets en place **OpenLDAP** :
  structure de l'annuaire, comptes, groupes, droits d'accès, raccordement d'un poste Linux et sauvegarde.

  | Machine | Adresse | Rôle |
  |---|---|---|
  | `admin` | 10.175.0.5 | outils LDAP (`ldapsearch`, `ldapadd`...) — terminal du lab |
  | `srv-ldap` | 10.175.0.10 | slapd préconfiguré pour **`dc=durand,dc=lan`** (base vide), **non démarré** |
  | `poste` | 10.175.0.20 | poste Linux, client `nslcd` installé mais non configuré |

  | Élément | Valeur |
  |---|---|
  | Administrateur de l'annuaire | `cn=admin,dc=durand,dc=lan` / `AdminLdap2026!` |
  | Utilisateurs à créer | `amartin` (Alice Martin, `Alice2026!`, UID 10001), `bleroy` (Bruno Leroy, `Bruno2026!`, UID 10002) |

  - `ssh srv-ldap` et `ssh poste` (root, par clé). Pas de systemd :
    `slapd -h "ldap:/// ldapi:///" -u openldap -g openldap` démarre l'annuaire, `nslcd` le client du poste.
  - Sur srv-ldap, root administre la configuration (`cn=config`) sans mot de passe :
    `ldapmodify -Y EXTERNAL -H ldapi:///`.

  Réponses à écrire dans `/root/reponses.txt` d'admin, au format `cle=valeur`.
cours: |
  ## Qu'est-ce qu'un annuaire LDAP ?

  Un **annuaire** est une base optimisée pour la lecture, organisée en **arbre**, qui décrit les personnes,
  groupes, machines et services d'une organisation. **LDAP** (port 389, 636 en LDAPS) est le protocole pour
  l'interroger. Active Directory, OpenLDAP, 389 Directory Server ou FreeIPA parlent tous LDAP : les
  applications (intranet, VPN, wiki, messagerie, supervision) s'y authentifient.

  ```
  dc=durand,dc=lan                         ← racine (le suffixe, tiré du domaine)
  ├── cn=admin                             ← administrateur de l'annuaire
  ├── ou=utilisateurs
  │   ├── uid=amartin                      ← DN : uid=amartin,ou=utilisateurs,dc=durand,dc=lan
  │   └── uid=bleroy
  ├── ou=groupes
  │   └── cn=compta
  └── ou=services
      └── cn=lecteur                       ← compte technique des applications
  ```

  Chaque **entrée** a un nom unique, le **DN** (*distinguished name*), et des **attributs** définis par ses
  **classes d'objets** (`objectClass`) : `inetOrgPerson` (personne : `cn`, `sn`, `mail`...),
  `posixAccount` (compte Unix : `uidNumber`, `gidNumber`, `homeDirectory`, `loginShell`), `posixGroup`
  (groupe Unix : `gidNumber`, `memberUid`), `organizationalUnit` (dossier).

  ## Le format LDIF

  ```
  dn: uid=amartin,ou=utilisateurs,dc=durand,dc=lan
  objectClass: inetOrgPerson
  objectClass: posixAccount
  uid: amartin
  cn: Alice Martin
  sn: Martin
  uidNumber: 10001
  gidNumber: 10000
  homeDirectory: /home/amartin
  loginShell: /bin/bash
  userPassword: {SSHA}...                  ← produit par slappasswd
  ```

  Pour modifier une entrée existante :

  ```
  dn: uid=amartin,ou=utilisateurs,dc=durand,dc=lan
  changetype: modify
  replace: telephoneNumber
  telephoneNumber: 04 72 10 20 11
  ```

  ## Les commandes

  | Besoin                         | Commande                                                     |
  |--------------------------------|--------------------------------------------------------------|
  | Chercher                       | `ldapsearch -x -H ldap://srv -b dc=durand,dc=lan '(uid=amartin)' cn mail` |
  | S'authentifier (bind)          | `-D cn=admin,dc=durand,dc=lan -w motdepasse` (ou `-W` pour le demander) |
  | Ajouter / modifier / supprimer | `ldapadd -f fichier.ldif`, `ldapmodify -f`, `ldapdelete <dn>` |
  | Tester un mot de passe         | `ldapwhoami -x -H ldap://srv -D <dn> -w <mdp>`               |
  | Hacher un mot de passe         | `slappasswd -s 'motdepasse'`                                 |
  | Configuration (cn=config)      | `ldapmodify -Y EXTERNAL -H ldapi:///` (root sur le serveur)  |
  | Sauvegarde                     | `slapcat -n 0` (configuration), `slapcat -n 1` (données)     |

  Les filtres de recherche s'écrivent entre parenthèses : `(uid=amartin)`, `(objectClass=posixGroup)`,
  `(&(objectClass=inetOrgPerson)(mail=*))` (ET), `(|(uid=a*)(uid=b*))` (OU).

  ## Les ACL d'OpenLDAP

  Les droits sont des règles `olcAccess` sur la base, évaluées dans l'ordre :

  ```
  olcAccess: {0}to attrs=userPassword by self write by anonymous auth by * none
  olcAccess: {1}to * by users read by * none
  ```

  `self` = l'entrée elle-même, `users` = tout compte authentifié, `anonymous` = connexion sans
  identifiant, `auth` = le droit de vérifier un mot de passe sans le lire.

  ## Pièges courants

  - Lignes LDIF avec des espaces en fin de ligne ou une ligne vide au milieu d'une entrée : erreurs
    obscures (`invalid format`).
  - Mots de passe en clair dans l'annuaire : toujours `{SSHA}` (ou mieux, `{ARGON2}` si disponible).
  - Annuaire lisible anonymement : n'importe qui récupère la liste des salariés et des comptes.
  - LDAP en clair sur le réseau : en production, LDAPS ou StartTLS obligatoire.

  ## Bonnes pratiques en entreprise

  - Arborescence simple (OU par type d'objet plutôt que par service, qui change souvent).
  - Un compte de service en lecture seule par application, jamais `cn=admin`.
  - Réplication (au moins deux serveurs), sauvegarde quotidienne avec `slapcat`, restauration testée.
  - Procédure d'arrivée et de départ : le compte LDAP est la clé de tous les services.
