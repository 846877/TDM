    url: https://www.openldap.org/doc/admin26/
  - title: ldapsearch(1) - interroger un annuaire (Ubuntu 24.04)
    url: https://manpages.ubuntu.com/manpages/noble/man1/ldapsearch.1.html
  - title: slapd.access(5) - ACL d'OpenLDAP (Ubuntu 24.04)
    url: https://manpages.ubuntu.com/manpages/noble/man5/slapd.access.5.html
