title: Active Directory - contrôleur de domaine Samba
level: avance
order: 1
tags: [active directory, samba, ad dc, kerberos, dns, ou, gpo, stratégie de mot de passe]
summary: Créer le domaine DURAND.LAN avec Samba AD - DNS intégré, OU, utilisateurs, groupes, stratégie de mots de passe, Kerberos, cycle de vie des comptes et sauvegarde.
compose: docker-compose.yml
service: admin
shell: bash
workdir: /root
description: |
  **Contexte.** *Ateliers Durand* passe d'un réseau « groupe de travail » à un **domaine Active
  Directory** pour centraliser comptes, mots de passe et droits. Pour des raisons de budget, le
  contrôleur de domaine est un **Samba AD DC** sous Linux : il est compatible avec les outils et les postes
  Windows (RSAT, jonction au domaine, GPO, Kerberos).

  **Machines** (réseau `10.60.0.0/24`) :

  | Machine | Adresse    | Rôle                                                                 |
  |---------|------------|----------------------------------------------------------------------|
  | `admin` | 10.60.0.5  | ton poste (`kinit`, `smbclient`, `dig`) ; son DNS est 10.60.0.10      |
  | `dc1`   | 10.60.0.10 | futur contrôleur de domaine, `ssh dc1` (root par clé) ; Samba installé, rien n'est provisionné |

  **Paramètres du domaine** :

  | Paramètre                  | Valeur              |
  |----------------------------|---------------------|
  | Domaine DNS / royaume Kerberos | `durand.lan` / `DURAND.LAN` |
  | Nom NetBIOS                | `DURAND`            |
  | Mot de passe Administrator | `Durand@dmin2024`   |

  Les commandes `samba-tool` se lancent sur **dc1** (en root, elles accèdent directement à l'annuaire ;
  pour les commandes réseau comme `samba-tool dns`, ajoute `-U administrator%'Durand@dmin2024'`).
  Démarrer le contrôleur : `samba` ; l'arrêter : `pkill samba`. Journaux : `samba -i -d 2` au premier plan.
cours: |
  ## Du groupe de travail au domaine

  En **groupe de travail**, chaque poste a ses propres comptes : changer un mot de passe ou retirer un
  accès oblige à passer sur chaque machine. Un **domaine Active Directory** centralise l'identité : un
  compte, un mot de passe, valables sur tous les postes et serveurs, avec des stratégies (GPO) appliquées
  à tout le parc.

  ## Les briques d'Active Directory

  ```
                    ┌───────────── contrôleur de domaine (DC) ─────────────┐
   poste Windows ──▶│ DNS        : trouve les DC (enregistrements SRV)       │
                    │ Kerberos   : authentification, tickets (port 88)       │
                    │ LDAP       : annuaire des objets (port 389 / 636)      │
                    │ SMB        : partages SYSVOL/NETLOGON (GPO, scripts)   │
                    └────────────────────────────────────────────────────────┘
  ```

  | Notion                 | Rôle                                                             |
  |------------------------|------------------------------------------------------------------|
  | **Domaine**            | frontière d'administration : `durand.lan` (DNS), `DURAND` (NetBIOS) |
  | **Royaume Kerberos**   | le domaine en majuscules : `DURAND.LAN`                          |
  | **Forêt**              | ensemble de domaines qui se font confiance                       |
  | **OU**                 | dossier d'objets pour organiser, **déléguer** et appliquer des GPO |
  | **Groupe de sécurité** | porte les droits (partages, délégations)                         |
  | **Compte ordinateur**  | chaque machine jointe a son compte et son mot de passe           |
  | **SYSVOL**             | partage répliqué entre DC : GPO et scripts                        |

  Un objet est désigné par son **DN** (*distinguished name*), lu de droite à gauche :
  `CN=Marie Dupont,OU=Compta,OU=Utilisateurs,OU=Durand,DC=durand,DC=lan`.

  ## Kerberos en une image

  ```
  1. kinit tbernard ──────────────▶ KDC (sur le DC) : « voici mon identité » (AS-REQ)
     ◀── TGT (ticket pour obtenir des tickets), valable ~10 h
  2. accès à //dc1/netlogon ──────▶ KDC : « un ticket pour cifs/dc1 » (TGS-REQ)
     ◀── ticket de service
  3. présentation du ticket au serveur : authentifié, sans mot de passe sur le réseau
  ```

  Kerberos impose des horloges synchronisées (**5 minutes** d'écart maximum) et un DNS correct : la
  plupart des pannes AD sont en réalité des pannes de DNS ou d'heure.

  ## Samba AD DC

  Samba 4 implémente un contrôleur de domaine compatible : les postes Windows le rejoignent comme un DC
  Microsoft, et les consoles RSAT (« Utilisateurs et ordinateurs Active Directory », « Gestion des
  stratégies de groupe ») l'administrent.

  | Besoin                      | Commande samba-tool                                         |
  |-----------------------------|-------------------------------------------------------------|
  | Créer le domaine            | `samba-tool domain provision ...`                           |
  | Niveau et rôles FSMO        | `samba-tool domain level show`, `samba-tool fsmo show`      |
  | OU                          | `samba-tool ou create 'OU=Compta,OU=Durand'`                |
  | Utilisateurs                | `samba-tool user create/list/show/disable/setexpiry/setpassword` |
  | Groupes                     | `samba-tool group add/addmembers/listmembers`               |
  | DNS                         | `samba-tool dns add/query/zonecreate`                       |
  | Stratégie de mots de passe  | `samba-tool domain passwordsettings show/set`               |
  | Sauvegarde                  | `samba-tool domain backup offline/online`                   |
  | Santé de la réplication     | `samba-tool drs showrepl`                                   |

  Équivalents PowerShell (module ActiveDirectory) : `New-ADUser`, `New-ADGroup`, `Add-ADGroupMember`,
  `New-ADOrganizationalUnit`, `Disable-ADAccount`, `Set-ADDefaultDomainPasswordPolicy`.

  ## La méthode AGDLP

  Recommandation Microsoft pour les droits : **A**ccounts dans des groupes **G**lobaux (par métier :
  `GG_Compta`), placés dans des groupes **D**omaine **L**ocal (par ressource : `DL_Partage_Compta_RW`), qui
  reçoivent les **P**ermissions. On ne donne jamais un droit directement à un utilisateur.

  ## Pièges courants

  - Le DC doit se résoudre **lui-même** correctement (son nom → son adresse) et les postes doivent utiliser
    **uniquement** les DC comme DNS (pas la box, pas 8.8.8.8).
  - Choisir un domaine en `.local` (conflit avec mDNS) ; préférer un sous-domaine d'un domaine possédé
    (`ad.durand.fr`) ou `.lan` en interne.
  - Un seul DC : sa panne arrête toutes les connexions. Toujours au moins **deux** DC.
  - Restaurer un DC par une simple copie de VM ancienne : risque de réplication incohérente (USN rollback).

  ## Bonnes pratiques en entreprise

  - Arborescence d'OU pensée pour la délégation et les GPO, documentée.
  - Comptes d'administration séparés des comptes de bureautique (`tbernard` / `adm-tbernard`).
  - Stratégie de mots de passe et de verrouillage, désactivation (pas suppression immédiate) des partants.
  - Sauvegarde de l'état système des DC et procédure de restauration testée.
