title: Heure et journaux centralisés (chrony, rsyslog)
level: intermediaire
order: 3
tags: [ntp, chrony, rsyslog, syslog, journalisation, logrotate]
summary: Serveur NTP interne, synchronisation des serveurs, serveur rsyslog central, transfert fiable des journaux, filtrage et investigation.
compose: docker-compose.yml
service: admin
shell: bash
workdir: /root
description: |
  **Contexte.** Après un incident, impossible de reconstituer la chronologie : chaque serveur d'*Ateliers
  Durand* garde ses journaux localement et leurs horloges ne sont pas d'accord. Tu mets en place une
  **source de temps interne** et un **serveur de journaux central** sur `srv-log`, puis tu y raccordes les
  serveurs.

  **Machines** (réseau `10.40.0.0/24`, accès `ssh <machine>` en root par clé depuis admin) :

  | Machine   | Adresse    | Rôle                                   |
  |-----------|------------|----------------------------------------|
  | `admin`   | 10.40.0.5  | ton poste                              |
  | `srv-log` | 10.40.0.10 | futur serveur NTP et syslog central    |
  | `srv-web` | 10.40.0.20 | serveur intranet (client)              |
  | `srv-bdd` | 10.40.0.30 | serveur de base de données (client)    |

  `chrony` et `rsyslog` sont installés partout mais ni configurés ni démarrés.

  **Particularités des conteneurs :** un conteneur ne peut pas régler l'horloge de l'hôte. Démarre
  chrony avec **`chronyd -x`** (il mesure et sert l'heure sans toucher à l'horloge système). Redémarrage :
  `pkill chronyd; sleep 1; chronyd -x`. Pour rsyslog : `rsyslogd -N1` (vérifier la configuration), `rsyslogd`
  (démarrer), `pkill rsyslogd; sleep 1; rsyslogd` (redémarrer). rsyslog s'exécute sous l'utilisateur
  `syslog` : les dossiers où il écrit doivent lui appartenir.
cours: |
  ## Pourquoi l'heure compte autant

  Sans horloges synchronisées, impossible de corréler les journaux de plusieurs machines lors d'un
  incident. Et beaucoup de services **cassent** : Kerberos (donc Active Directory) refuse les tickets au-delà
  de **5 minutes** d'écart, les certificats TLS paraissent « pas encore valides », les sauvegardes
  incrémentales se trompent.

  ## NTP et les strates

  ```
  strate 0   horloges de référence (GPS, atomique)
  strate 1   serveurs reliés directement (ntp.obspm.fr...)
  strate 2   pools publics (fr.pool.ntp.org)
  strate 3   srv-log : serveur de temps interne de l'entreprise
  strate 4   srv-web, srv-bdd, postes (synchronisés sur srv-log)
  ```

  La **strate** indique la distance à la référence. NTP (UDP **123**) mesure le délai aller-retour et le
  décalage, puis corrige l'horloge progressivement (**slew**, sans saut) ou d'un coup (**step**, au
  démarrage). En entreprise, seuls un ou deux serveurs internes interrogent Internet ; tout le parc se
  synchronise sur eux. Dans un domaine Active Directory, c'est le contrôleur de domaine **émulateur PDC**
  qui joue ce rôle.

  ## chrony

  ```
  # /etc/chrony/chrony.conf (serveur interne)
  pool fr.pool.ntp.org iburst      # sources (commentées dans le lab : pas d'Internet)
  allow 10.40.0.0/24               # sert l'heure à ce réseau
  local stratum 8                  # continue de servir même sans source (horloge locale)

  # client
  server srv-log iburst            # iburst : 4 requêtes rapides au démarrage
  ```

  | Commande                 | Usage                                                     |
  |--------------------------|-----------------------------------------------------------|
  | `chronyc sources -v`     | sources et état (`^*` = sélectionnée, `^?` = injoignable)  |
  | `chronyc tracking`       | décalage, strate, source de référence                     |
  | `chronyc clients`        | clients servis (côté serveur)                             |
  | `timedatectl`            | état de l'heure et du fuseau (systemd)                    |
  | `w32tm /query /status`   | équivalent Windows                                        |

  ## Syslog : le format universel des journaux

  Chaque message syslog porte une **facility** (origine) et une **sévérité** (gravité) :

  | Sévérité | Nom      | Exemple                      |
  |----------|----------|------------------------------|
  | 0        | emerg    | système inutilisable          |
  | 1        | alert    | action immédiate             |
  | 2        | crit     | condition critique           |
  | 3        | err      | erreur                       |
  | 4        | warning  | avertissement                |
  | 5        | notice   | normal mais significatif     |
  | 6        | info     | information                  |
  | 7        | debug    | débogage                     |

  Facilities courantes : `auth`/`authpriv` (authentifications), `cron`, `daemon`, `kern`, `mail`, `user`,
  `local0` à `local7` (libres pour les applications et équipements réseau).

  ## rsyslog : recevoir, filtrer, ranger, transférer

  ```
  srv-web ──┐  TCP 514 (file d'attente si coupure)
  srv-bdd ──┼──────────────▶ srv-log : imtcp/imudp → ruleset "distant"
  switchs ──┘  UDP 514                     ├─ /var/log/central/%HOSTNAME%/%PROGRAMNAME%.log
                                           └─ alertes.log si sévérité <= 4
  ```

  ```
  # Sélecteur classique : facility.sévérité (la sévérité indiquée et plus grave)
  auth,authpriv.*        /var/log/auth.log
  *.err                  /var/log/erreurs.log

  # Syntaxe moderne (RainerScript)
  template(name="ParHote" type="string" string="/var/log/central/%HOSTNAME%/%PROGRAMNAME%.log")
  ruleset(name="distant") {
      action(type="omfile" dynaFile="ParHote")
  }
  input(type="imtcp" port="514" ruleset="distant")
  ```

  - **UDP** : simple, mais les messages perdus le sont définitivement (pas d'accusé de réception).
  - **TCP** + **file d'attente sur disque** : les messages sont conservés pendant une coupure et envoyés au
    retour du serveur. Pour la confidentialité, rsyslog sait aussi chiffrer en TLS (port 6514).
  - `rsyslogd -N1` valide la configuration ; `logger -p local3.err -t appli "texte"` génère un message de test.

  ## journald et rsyslog

  Sur les systèmes systemd, **journald** collecte d'abord tous les messages (`journalctl`) et les passe
  à rsyslog, qui les écrit en fichiers texte et les transfère. Les deux cohabitent.

  ## Pièges courants

  - Dossiers de destination non accessibles à l'utilisateur `syslog` : rien n'est écrit, sans erreur visible.
  - Oublier que l'ordre des règles compte : un `stop` placé trop tôt écarte des messages voulus.
  - Pare-feu qui bloque UDP 123 ou TCP/UDP 514.
  - Rotation sans `postrotate` : rsyslog continue d'écrire dans le fichier renommé.

  ## Bonnes pratiques en entreprise

  - Deux serveurs NTP internes, synchronisés sur des sources publiques fiables ou un boîtier GPS.
  - Journaux centralisés sur une machine dédiée, aux accès restreints : un attaquant qui compromet un
    serveur ne peut pas effacer les traces déjà transmises.
  - Durées de conservation définies (souvent 6 mois à 1 an pour les journaux de connexion) et alertes sur
    les messages graves. À plus grande échelle : Graylog, ELK/OpenSearch, Loki.
