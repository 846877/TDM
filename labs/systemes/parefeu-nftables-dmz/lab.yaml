title: Pare-feu nftables - LAN, DMZ et WAN
level: avance
order: 4
tags: [pare-feu, nftables, nat, dnat, dmz, sécurité, journalisation]
summary: Routeur-pare-feu Linux à trois zones - politique par défaut, filtrage par service, NAT, publication en DMZ, redirection de port, liste noire et journalisation.
compose: docker-compose.yml
service: admin
shell: bash
workdir: /root
description: |
  **Contexte.** *Ateliers Durand* remplace sa box par un **routeur-pare-feu Linux** à trois pattes : le
  **LAN** des utilisateurs, une **DMZ** qui héberge le site web public, et le **WAN** (Internet). Tu écris
  sa politique de filtrage avec **nftables**, en partant du principe « tout ce qui n'est pas explicitement
  autorisé est interdit ».

  **Topologie.**

  ```
   LAN 192.168.1.0/24          DMZ 172.16.10.0/24          WAN 203.0.113.0/24
   admin  .5  ┐                ┌ srv-web .10 (HTTP, SSH)    ┌ externe .50 (client et serveur web « Internet »)
   poste  .10 ┴── lan ─ fw ─ dmz ┘               fw ─ wan ──┼ pirate  .66
                    .254      .254                    .2    ┘
  ```

  Interfaces du pare-feu : `lan`, `dmz`, `wan` et `mgmt`. Toutes les machines sont aussi reliées à
  admin par un **réseau d'administration hors bande** `mgmt` (10.99.1.0/24) : `ssh fw`, `ssh poste`,
  `ssh externe`... passent par lui. **Le pare-feu doit toujours tout accepter sur l'interface `mgmt`**,
  sinon tu perds la main (et les vérifications aussi).

  Le pare-feu route déjà (`ip_forward=1`) mais n'a **aucune règle**. Travaille dans un fichier
  (`/root/pare-feu.nft` sur fw) que tu charges avec `nft -f`, en commençant par `flush ruleset`.
  Pour tester sans risque : `nft -c -f fichier` vérifie la syntaxe sans rien appliquer.
cours: |
  ## Architecture à trois pattes

  ```
                 ┌──────────── pare-feu ────────────┐
   LAN ── lan ──▶│ input   : trafic VERS le pare-feu │◀── wan ── Internet
  (postes)       │ forward : trafic TRAVERSANT       │
   DMZ ── dmz ──▶│ output  : trafic émis PAR lui     │
  (serveurs publics)                                 │
                 └────────────────────────────────────┘
  ```

  La **DMZ** héberge ce qui doit être joignable depuis Internet (site web, relais de messagerie). Si un de
  ces serveurs est compromis, l'attaquant reste enfermé : la DMZ n'a pas le droit d'initier de connexion
  vers le LAN.

  Principe directeur : **politique par défaut `drop`** et liste blanche des flux autorisés, documentée
  dans une **matrice des flux** (source, destination, port, justification).

  ## Le chemin d'un paquet (netfilter)

  ```
  entrée ─▶ prerouting (DNAT) ─▶ décision de routage ─┬─▶ input ─▶ processus local ─▶ output ─┐
                                                      └─▶ forward ──────────────────────────────┴─▶ postrouting (SNAT, masquerade) ─▶ sortie
  ```

  - Le **DNAT** (publication d'un service, redirection de port) se fait en `prerouting`, **avant** le
    routage : la chaîne `forward` voit donc l'adresse **interne** de destination.
  - Le **SNAT / masquerade** (sortie Internet des adresses privées) se fait en `postrouting`.
  - Le **suivi de connexion** (conntrack) reconnaît les réponses : une seule règle
    `ct state established,related accept` autorise tous les retours.

  ## Structure nftables

  ```
  flush ruleset
  table inet filtre {
      set liste_noire { type ipv4_addr; }
      chain input {
          type filter hook input priority 0; policy drop;
          ip saddr @liste_noire drop
          iif lo accept
          ct state established,related accept
          icmp type echo-request accept
          iifname "lan" ip saddr 192.168.1.5 tcp dport 22 accept
          log prefix "FW-DROP " group 0
      }
      chain forward { type filter hook forward priority 0; policy drop; ... }
      chain output  { type filter hook output priority 0; policy accept; }
  }
  table ip nat {
      chain prerouting  { type nat hook prerouting priority dstnat; iifname "wan" tcp dport 80 dnat to 172.16.10.10; }
      chain postrouting { type nat hook postrouting priority srcnat; oifname "wan" masquerade; }
  }
  ```

  Les règles d'une chaîne sont évaluées **dans l'ordre** ; la première action terminale (`accept`, `drop`)
  décide. Les familles : `ip` (IPv4), `ip6`, `inet` (les deux), `bridge`, `arp`.

  ## Mémo des commandes

  | Besoin                           | Commande                                            |
  |----------------------------------|-----------------------------------------------------|
  | Tester un fichier sans appliquer | `nft -c -f /root/pare-feu.nft`                      |
  | Charger un fichier               | `nft -f /root/pare-feu.nft`                         |
  | Tout afficher (avec numéros)     | `nft -a list ruleset`                               |
  | Ajouter un élément à un set      | `nft add element inet filtre liste_noire { 1.2.3.4 }` |
  | Supprimer une règle              | `nft delete rule inet filtre input handle 12`       |
  | Connexions suivies               | `conntrack -L` (paquet conntrack)                   |
  | Persistance                      | `/etc/nftables.conf` + service `nftables`           |

  Tester les flux depuis les machines : `nc -zv hôte port`, `curl`, `ping`, et regarder les compteurs
  (`counter` dans une règle) ou les journaux.

  ## Pièges courants

  - Se couper l'accès en appliquant `policy drop` sans règle pour sa propre session SSH (ici : interface
    `mgmt`). En production : console de secours, ou commande d'annulation programmée
    (`sleep 60 && nft flush ruleset &`) pendant le test.
  - Oublier les réponses (`established,related`) : rien ne marche dans un sens.
  - Autoriser le DNAT en `prerouting` mais oublier la règle `forward` correspondante (ou l'inverse).
  - Ouvrir DNS en UDP seulement : les grosses réponses passent en TCP.
  - Règles chargées à la main mais pas enregistrées : perdues au redémarrage.

  ## Bonnes pratiques en entreprise

  - Matrice des flux validée, chaque règle commentée (`comment "ticket 1234"`), revue régulière.
  - Journaliser les refus (avec limitation de débit) et centraliser les journaux.
  - Filtrer aussi en **sortie** : un serveur de DMZ n'a besoin que de ses mises à jour.
  - Les pare-feu du marché (pfSense/OPNsense, Fortinet, Stormshield) reprennent exactement ces notions :
    zones, NAT, règles ordonnées, objets et groupes d'adresses.
