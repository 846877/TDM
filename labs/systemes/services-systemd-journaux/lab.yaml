title: Services systemd et journaux
level: debutant
order: 5
tags: [linux, systemd, systemctl, journalctl, services, timers]
summary: État des services, démarrage et activation, dépannage par le journal, redémarrage automatique, création d'un service et d'un timer, journal persistant.
build: .
privileged: true
command: []
shell: bash
workdir: /root
description: |
  **Contexte.** Le serveur de l'atelier d'*Ateliers Durand* a redémarré cette nuit et plusieurs choses ne
  vont pas : l'export comptable n'est pas parti, le lecteur de badges de l'entrée tombe régulièrement, un
  service inutile tourne encore, et le journal est perdu à chaque redémarrage. Tu dois aussi mettre en
  service le planning de l'atelier et automatiser un nettoyage.

  **Machine.** Serveur Ubuntu où **systemd** est le processus n°1, comme sur une vraie machine (conteneur
  privilégié). Terminal `root`.

  | Unité | Rôle |
  |---|---|
  | `export-compta.service` | export vers la comptabilité (au démarrage) |
  | `badge.service` | lecteur de badges de l'entrée |
  | `capteur.service` | relevé des sondes de température |
  | `imprimante-ancienne.service` | pilote d'une imprimante retirée en 2024 |
  | `nginx.service` | serveur web (installé, non activé) |

  Réponses à écrire dans `/root/reponses.txt`, au format `cle=valeur`.

  Outils : `systemctl status|start|stop|restart|enable|disable|mask|edit|daemon-reload`,
  `systemctl --failed`, `systemctl list-timers`, `journalctl -u <unité>`, `journalctl -p err -b`.
cours: |
  ## systemd, le chef d'orchestre

  Sur Ubuntu, Debian, Red Hat et la plupart des distributions actuelles, **systemd** est le premier
  processus lancé par le noyau (PID 1). Il démarre les services dans le bon ordre, les surveille, les
  relance si besoin et centralise leurs journaux. Tout ce qu'il gère est une **unité** :

  | Type d'unité | Exemple                  | Rôle                                         |
  |--------------|--------------------------|----------------------------------------------|
  | `.service`   | `nginx.service`          | un programme (démon) ou une tâche ponctuelle |
  | `.timer`     | `logrotate.timer`        | déclenche un service à heure fixe (remplace cron) |
  | `.target`    | `multi-user.target`      | groupe d'unités, équivalent des « niveaux » de démarrage |
  | `.socket`, `.mount`, `.path` | `ssh.socket` | activation sur connexion, montage, surveillance de fichier |

  ## Démarré ≠ activé

  Deux notions indépendantes, source de nombreuses confusions :

  ```
              maintenant                  au prochain démarrage
  start  ───▶ active (running)     enable  ───▶ enabled (lien dans multi-user.target.wants/)
  stop   ───▶ inactive (dead)      disable ───▶ disabled
                                   mask    ───▶ masked (impossible à démarrer, même par dépendance)
  ```

  `systemctl enable --now <unité>` fait les deux d'un coup. Après un redémarrage, un service démarré mais
  non activé ne revient pas.

  ## Mémo systemctl et journalctl

  | Besoin                               | Commande                                     |
  |--------------------------------------|----------------------------------------------|
  | État détaillé (+ dernières lignes du journal) | `systemctl status nginx`            |
  | Tous les services en échec           | `systemctl --failed`                         |
  | Démarrer / arrêter / redémarrer      | `systemctl start|stop|restart nginx`         |
  | Relire la configuration sans couper  | `systemctl reload nginx`                     |
  | Activer / désactiver au démarrage    | `systemctl enable|disable nginx`             |
  | Contenu d'une unité (avec surcharges)| `systemctl cat nginx`                        |
  | Surcharger proprement une unité      | `systemctl edit nginx` (crée un *drop-in*)   |
  | Après modification d'un fichier d'unité | `systemctl daemon-reload`                 |
  | Journal d'une unité                  | `journalctl -u nginx` (`-e` fin, `-f` suivi) |
  | Erreurs depuis le démarrage          | `journalctl -p err -b`                       |
  | Depuis une heure                     | `journalctl --since "1 hour ago"`            |
  | Programmations                       | `systemctl list-timers`                      |

  ## Écrire une unité de service

  ```ini
  # /etc/systemd/system/planning.service
  [Unit]
  Description=Planning de l'atelier
  After=network.target

  [Service]
  User=planning
  ExecStart=/usr/bin/python3 -m http.server 8085 --directory /srv/planning
  Restart=on-failure

  [Install]
  WantedBy=multi-user.target
  ```

  Les unités fournies par les paquets sont dans `/lib/systemd/system/` : on ne les modifie **jamais**
  (une mise à jour écraserait la modification). On écrit ses propres unités dans `/etc/systemd/system/`,
  et on surcharge celles des paquets avec un **drop-in** : `/etc/systemd/system/<unité>.d/override.conf`.

  ## Le journal

  `journald` collecte tout ce que les services écrivent sur leur sortie, avec l'heure, l'unité et une
  **priorité** (0 `emerg` à 7 `debug` ; 3 = `err`, 4 = `warning`, 6 = `info`). Par défaut sur certaines
  installations, il est conservé en mémoire (`/run/log/journal`) et perdu au redémarrage ; avec
  `Storage=persistent`, il est écrit dans `/var/log/journal`.

  ## Pièges courants

  - Oublier `daemon-reload` après avoir modifié un fichier d'unité : systemd utilise l'ancienne version.
  - Démarrer un service sans l'activer (ou l'inverse).
  - Modifier un fichier dans `/lib/systemd/system` au lieu de faire un drop-in.
  - Lire seulement `systemctl status` (10 lignes) : `journalctl -u <unité>` montre tout l'historique.
  - `Restart=always` sur un service mal configuré : il redémarre en boucle et remplit le journal.

  ## Bonnes pratiques en entreprise

  - Faire tourner chaque service sous un compte dédié sans privilèges (`User=`).
  - Désactiver et masquer les services inutiles : moins de surface d'attaque, démarrage plus rapide.
  - Journal persistant et limité en taille, idéalement envoyé aussi vers un serveur central.
  - Superviser l'état `systemctl is-system-running` (`degraded` = au moins une unité en échec).
