options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    dnssec-validation no;
    allow-transfer { none; };
};

zone "lyon.durand.lan" {
    type primary;
    file "/etc/bind/db.lyon.durand.lan";
};

zone "fournisseur.example" {
    type primary;
    file "/etc/bind/db.fournisseur.example";
};
