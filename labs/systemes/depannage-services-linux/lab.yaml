title: Dépannage de services Linux – le serveur applicatif hérité
level: expert
order: 2
tags: [dépannage, linux, nginx, cron, ssh, logrotate, droits, nsswitch, lsof, méthodologie]
summary: Huit pannes réelles sur un serveur repris d'un prestataire (web, disque fantôme, cron, compte, droits, résolution, rotation, SSH) à diagnostiquer par les journaux et à corriger sans réinstaller.
build: .
shell: bash
workdir: /root
description: |
  **Contexte.** *Ateliers Durand* reprend en interne le serveur applicatif `srv-appli`, jusqu'ici géré par
  un prestataire (« JPL »). Il a été livré « fonctionnel »… Rien ne marche. Pour chaque ticket :
  **observe** (journaux, `systemctl` n'existe pas ici : regarde les processus et les fichiers),
  **formule une hypothèse**, **corrige à la source**, **vérifie**. Pas de réinstallation, pas de `chmod 777`.

  **Machine.** Serveur Ubuntu sans systemd, terminal `root`. Les services se lancent à la main :
  `nginx` (`nginx -t`, `nginx -s reload`), `/usr/sbin/sshd` (`sshd -t`), `cron`.

  Réponses à écrire dans `/root/reponses.txt`, au format `cle=valeur`.

  Boîte à outils : `ps auxf`, `ss -ltnp`, `lsof`, `fuser`, `df -h`, `du -sh`, `journaux dans /var/log`,
  `file`, `cat -A`, `dos2unix`, `getent`, `chage -l`, `namei -l`, `stat`, `logrotate -d`, `sshd -t`,
  `runuser -u <compte> -- <commande>`.
cours: |
  ## La démarche de dépannage d'un service

  ```
  1. OBSERVER      symptôme exact, message d'erreur, depuis quand, qui est touché
  2. LOCALISER     le processus tourne-t-il ? écoute-t-il ? que dit son journal ?
  3. HYPOTHÈSE     une cause précise, vérifiable
  4. TESTER        une seule modification à la fois, réversible (copie .bak)
  5. VÉRIFIER      du point de vue de l'utilisateur, puis noter dans le ticket
  ```

  Sur une machine avec systemd, le point de départ est `systemctl status <service>` puis
  `journalctl -u <service> -e`. Ici, sans systemd, on remonte aux sources : processus, ports, fichiers
  journaux, droits.

  ## Les questions et leurs commandes

  | Question                                   | Commandes                                           |
  |--------------------------------------------|-----------------------------------------------------|
  | Le processus tourne-t-il ? avec quel compte ? | `ps auxf`, `pgrep -a nginx`                     |
  | Qui écoute sur le port ?                   | `ss -ltnp`, `fuser 80/tcp`, `lsof -i :80`           |
  | La configuration est-elle valide ?         | `nginx -t`, `sshd -t`, `visudo -c`, `logrotate -d`, `testparm` |
  | Que dit le journal ?                       | `tail -n 50 /var/log/<service>/error.log`, `journalctl` |
  | Le compte peut-il lire ce chemin ?         | `namei -l /chemin/complet`, `runuser -u <compte> -- cat <f>` |
  | Pourquoi le compte est-il refusé ?         | `chage -l`, `passwd -S`, `getent passwd` (shell), droits du dossier perso |
  | Où est passé l'espace disque ?             | `df -h` vs `du -sh /*`, `lsof +L1`                   |
  | Ce script est-il « propre » ?              | `file`, `cat -A` (fins de ligne `^M$` = Windows), `bash -x` |
  | Un nom se résout-il ?                      | `getent hosts`, `/etc/hosts`, `/etc/nsswitch.conf`  |

  ## Fichiers supprimés mais ouverts

  ```
  $ df -h /           → 85 % utilisés
  $ du -sh /*         → la somme ne fait que 60 %
  $ lsof +L1          → journal-appli  412  ...  /var/log/appli/debug.log (deleted)
  ```

  Un fichier n'est réellement effacé que lorsque plus aucun processus ne le garde ouvert. Solutions :
  redémarrer le processus, ou vider le fichier par son descripteur (`: > /proc/<pid>/fd/<n>`). Pour éviter
  le problème, on vide un journal avec `truncate -s 0` au lieu de le supprimer, et on utilise `copytruncate`
  dans logrotate pour les applications qui ne savent pas rouvrir leurs fichiers.

  ## Pièges des fichiers venus de Windows

  Un script édité sous Windows a des fins de ligne **CRLF** : la première ligne devient `#!/bin/sh\r` et
  le noyau cherche un interpréteur nommé `sh\r` (« bad interpreter » ou rien du tout sous cron).
  `dos2unix` corrige ; `file script.sh` signale « with CRLF line terminators ».

  ## cron : les exigences de /etc/cron.d

  | Exigence                                        | Conséquence si non respectée          |
  |-------------------------------------------------|---------------------------------------|
  | un champ **utilisateur** après les 5 champs de date | ligne ignorée (erreur dans le journal) |
  | fichier appartenant à root, non modifiable par le groupe ou les autres | fichier entier ignoré |
  | nom sans point ni extension                     | fichier ignoré                        |
  | script exécutable, chemins absolus              | commande en échec silencieux          |

  ## Les droits minimum

  Un service doit avoir **juste** les droits nécessaires : lire sa configuration (groupe du service,
  `640`), écrire dans son dossier de données (propriétaire ou groupe), rien d'autre. `chmod 777` ou
  `chmod 666` « réparent » en apparence mais ouvrent la porte : tout compte (ou un service compromis)
  peut alors lire le mot de passe ou remplacer les fichiers.

  ## Pièges courants

  - Modifier une configuration sans la tester (`-t`) puis recharger : le service s'arrête.
  - Corriger la première cause et déclarer le ticket résolu : les pannes sont souvent **empilées**.
  - Supprimer un journal ouvert pour « faire de la place ».
  - Oublier qu'un compte peut être bloqué de plusieurs façons (expiration, shell, verrouillage, droits du
    dossier personnel).

  ## Bonnes pratiques en entreprise

  - Sauvegarder un fichier avant de le modifier (`cp -a fichier fichier.bak-$(date +%F)`), ou le versionner.
  - Ticket complet : symptôme, diagnostic (commandes et résultats), cause racine, correction, vérification.
  - Après un transfert de prestataire : inventaire des services, comptes, tâches planifiées et
    configurations, puis remise aux normes documentée.
docs:
