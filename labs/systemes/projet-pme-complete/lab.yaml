title: Projet de synthèse – l'infrastructure complète d'une PME
level: expert
order: 4
tags: [projet, dhcp, dns, nat, nftables, dnat, samba, ssh, sauvegarde, rsync, cron]
summary: Construire de bout en bout le réseau d'une PME de 15 personnes, passerelle DHCP/DNS/NAT/pare-feu, publication web, serveur de fichiers, SSH durci, sauvegarde automatique, puis recette finale.
compose: docker-compose.yml
service: admin
shell: bash
workdir: /root
description: |
  **Contexte.** *PME Durand* (15 salariés) emménage dans de nouveaux locaux. Le câblage est fait et les
  machines sont installées, **mais rien n'est configuré**. Tu es le prestataire : à la fin de la journée,
  les postes doivent obtenir leur adresse, résoudre les noms internes, sortir sur Internet, partager des
  fichiers, et le serveur doit être protégé et sauvegardé. Le cahier des charges est donné exercice par
  exercice ; à toi de choisir les commandes.

  | Machine    | LAN 192.168.100.0/24 | Serveurs 10.100.0.0/24 | WAN 203.0.113.0/24 | Rôle |
  |------------|----------------------|------------------------|--------------------|------|
  | `admin`    | .5                   |                        |                    | ton poste |
  | `poste`    | .20 + adresse DHCP   |                        |                    | poste d'un salarié (client DHCP, publie son bail sur `http://192.168.100.20/bail.txt`) |
  | `gw`       | .254                 | .254                   | .2 (IP publique)   | passerelle : nftables, dnsmasq installés |
  | `srv`      |                      | .10                    |                    | serveur : nginx (site public), Samba installé |
  | `nas`      |                      | .20                    |                    | NAS de sauvegarde (compte `sauvegarde`) |
  | `internet` |                      |                        | .80                | « Internet » : `http://203.0.113.80` renvoie l'IP source vue de l'extérieur |

  - `ssh <machine>` depuis admin (root, par clé) passe par le réseau d'administration **10.99.6.0/24**
    (interface `mgmt` de chaque machine) : ne le coupe jamais, les vérifications l'utilisent.
  - Les interfaces de gw s'appellent `lan`, `serveurs`, `wan` et `mgmt`. Le routage IP y est activé.
  - Pas de systemd : `dnsmasq` (`pkill dnsmasq; dnsmasq`), `nft -f /etc/nftables.conf`, `smbd`,
    `kill -HUP $(cat /run/sshd.pid)`.
cours: |
  ## Monter l'infrastructure d'une PME : l'ordre compte

  Une petite entreprise a besoin des mêmes briques qu'une grande, en plus simple. On les monte dans
  l'ordre des **dépendances** : sans adresse, pas de nom ; sans nom, pas de service confortable ; sans
  pare-feu, pas de publication sur Internet.

  ```
                      Internet (WAN 203.0.113.0/24)
                               │ .2 (IP publique)
                      ┌────────┴────────┐
                      │       gw        │  DHCP + DNS (dnsmasq), NAT, DNAT, pare-feu (nftables)
                      └──┬───────────┬──┘
           lan .254      │           │    serveurs .254
     192.168.100.0/24    │           │    10.100.0.0/24
        ┌──────┬─────────┘           └──────┬──────────┐
      admin  poste                         srv        nas
                                   (web, Samba, SSH)  (sauvegardes)
  ```

  | Étape | Brique              | Question à laquelle elle répond                         |
  |-------|---------------------|---------------------------------------------------------|
  | 1     | DHCP                | comment un poste obtient-il son adresse ?               |
  | 2     | DNS interne         | comment trouve-t-il `srv.pme.lan` ?                     |
  | 3     | NAT (masquerade)    | comment sort-il sur Internet avec une adresse privée ?  |
  | 4     | Pare-feu            | qui a le droit de parler à qui ?                        |
  | 5     | DNAT                | comment Internet atteint-il le site hébergé en interne ? |
  | 6     | Partage de fichiers | où les salariés rangent-ils leurs documents ?           |
  | 7     | Durcissement SSH    | comment l'administration reste-t-elle sûre ?            |
  | 8     | Sauvegarde          | que se passe-t-il si le serveur meurt ?                 |
  | 9     | Recette             | tout cela survit-il à un redémarrage ? est-ce documenté ? |

  ## Une passerelle Linux : les quatre chaînes utiles

  ```
  paquet entrant ─▶ prerouting (DNAT) ─▶ routage ─┬─▶ input   (vers gw lui-même)
                                                  └─▶ forward (traverse gw) ─▶ postrouting (SNAT/masquerade) ─▶ sortie
  ```

  ```
  flush ruleset
  table ip nat {
    chain prerouting  { type nat hook prerouting priority dstnat; ... }
    chain postrouting { type nat hook postrouting priority srcnat; oifname "wan" masquerade }
  }
  table inet filtre {
    chain input   { type filter hook input priority filter; policy drop; ... }
    chain forward { type filter hook forward priority filter; policy drop; ... }
  }
  ```

  Une politique `drop` par défaut impose de **lister ce qui est permis** : la règle
  `ct state established,related accept` en tête laisse passer toutes les réponses, puis chaque flux
  autorisé est décrit par interface d'entrée, de sortie, protocole et port. C'est la **matrice des flux**
  du cahier des charges traduite en règles.

  ## Mémo des vérifications

  | Brique      | Test                                                       |
  |-------------|------------------------------------------------------------|
  | DHCP        | bail du poste, `/var/lib/misc/dnsmasq.leases` sur gw       |
  | DNS         | `dig @192.168.100.254 srv.pme.lan`, `dig -x 10.100.0.10`   |
  | NAT         | `curl http://203.0.113.80` (renvoie l'IP source vue d'Internet) |
  | Pare-feu    | `nft list ruleset`, tests autorisés **et** interdits        |
  | DNAT        | `ssh internet curl http://203.0.113.2/`                    |
  | Samba       | `testparm -s`, `smbclient //10.100.0.10/commun -U alice`   |
  | SSH         | `sshd -t`, `sshd -T \| grep -i passwordauth`               |
  | Sauvegarde  | lancer le script à la main, comparer source et NAS         |

  ## Pièges courants

  - Se couper l'accès : un pare-feu `policy drop` appliqué sans règle pour SSH sur `mgmt`, ou un
    `sshd_config` invalide rechargé sans `sshd -t`.
  - Tester seulement ce qui doit marcher : un pare-feu se recette aussi par ce qui doit **échouer**.
  - Laisser dnsmasq répondre sur le WAN : un résolveur ouvert sur Internet sert aux attaques par
    amplification.
  - Une sauvegarde par cron qui bloque sur « Are you sure you want to continue connecting? ».
  - Configurer en mémoire et oublier les fichiers : tout disparaît au redémarrage.

  ## Bonnes pratiques en entreprise

  - Un **dossier d'exploitation** remis au client : plan d'adressage, schéma, matrice des flux,
    comptes de service, procédure de sauvegarde et de restauration, contacts.
  - Une recette formelle signée : liste des tests, résultat attendu, résultat obtenu.
  - Règle 3-2-1 pour les sauvegardes, et un test de restauration planifié.
  - Comptes nominatifs, mots de passe dans un coffre, et pas de mot de passe par défaut.
