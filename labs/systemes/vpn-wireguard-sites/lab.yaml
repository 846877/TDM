title: VPN WireGuard - site à site et nomades
level: avance
order: 5
tags: [vpn, wireguard, site à site, nomade, chiffrement, nftables]
summary: Relier le siège et une agence par un tunnel WireGuard, router les deux LAN, raccorder un nomade en split tunnel, filtrer l'accès Internet et révoquer un pair.
compose: docker-compose.yml
service: admin
shell: bash
workdir: /root
description: |
  **Contexte.** *Ateliers Durand* ouvre une agence. Plutôt qu'une liaison louée hors de prix, les deux
  sites seront reliés par un **VPN WireGuard** à travers Internet. Les commerciaux en déplacement se
  connecteront aussi au siège par WireGuard.

  **Topologie.**

  ```
   SIÈGE 10.10.0.0/24                 INTERNET 198.51.100.0/24               AGENCE 10.20.0.0/24
   pc-siege .10 ── lan  gw-siege  internet ──────────────── internet  gw-agence  lan ── pc-agence .10
   (intranet web)       .254    .10         nomade .30            .20    .254
  ```

  | Machine     | Tunnel `wg0`         | Rôle                                      |
  |-------------|----------------------|-------------------------------------------|
  | `gw-siege`  | 10.200.0.1/24        | passerelle VPN du siège, écoute UDP 51820 |
  | `gw-agence` | 10.200.0.2/24        | passerelle VPN de l'agence                |
  | `nomade`    | 10.200.0.10/32       | portable d'un commercial                  |

  Les passerelles routent déjà (`ip_forward=1`) et les postes les ont comme passerelle par défaut.
  Accès : `ssh gw-siege`, `ssh gw-agence`, `ssh nomade`, `ssh pc-siege`, `ssh pc-agence` (réseau
  d'administration hors bande). Outils : `wg genkey`, `wg pubkey`, `wg show`, `wg-quick up|down wg0`
  (configuration dans `/etc/wireguard/wg0.conf`). Si le noyau n'a pas le module WireGuard, `wg-quick`
  bascule automatiquement sur **wireguard-go** (implémentation en espace utilisateur).
cours: |
  ## À quoi sert un VPN

  Un **VPN** crée un tunnel chiffré à travers un réseau non fiable (Internet). Deux usages en entreprise :

  - **site à site** : deux passerelles relient les LAN de deux sites, les postes ne voient rien ;
  - **nomade** (*road warrior*) : un portable rejoint le réseau de l'entreprise depuis n'importe où.

  Alternatives connues : IPsec (standard historique entre équipements de marques différentes),
  OpenVPN (TLS), et les VPN SSL des pare-feu commerciaux. **WireGuard** est récent, intégré au noyau
  Linux, très simple et rapide.

  ## Principes de WireGuard

  ```
  pc-agence ─▶ gw-agence ══ UDP 51820 chiffré sur Internet ══▶ gw-siege ─▶ pc-siege
   10.20.0.10   wg0 10.200.0.2                                  wg0 10.200.0.1   10.10.0.10
  ```

  - Chaque pair a une **paire de clés** (Curve25519) : la clé privée reste sur la machine, la clé publique
    est donnée aux autres. Pas de certificats, pas de mot de passe.
  - **AllowedIPs** joue un double rôle (*cryptokey routing*) :
    - en **sortie** : les paquets vers ces adresses partent vers ce pair (et `wg-quick` crée les routes) ;
    - en **entrée** : seuls les paquets dont l'adresse source est dans cette liste sont acceptés de ce pair.
  - **Endpoint** : adresse publique et port où joindre le pair (au moins un des deux côtés doit le connaître).
  - **PersistentKeepalive** : envoie un paquet régulier pour garder ouverte la traduction NAT d'une box.
  - WireGuard est silencieux : il ne répond à rien sans clé valide, il n'apparaît pas à un scan.

  ```ini
  # /etc/wireguard/wg0.conf (gw-siege, droits 600)
  [Interface]
  PrivateKey = <clé privée de gw-siege>
  Address = 10.200.0.1/24
  ListenPort = 51820

  [Peer]                       # agence
  PublicKey = <clé publique de gw-agence>
  Endpoint = 198.51.100.20:51820
  AllowedIPs = 10.200.0.2/32, 10.20.0.0/24
  ```

  ## Split tunnel ou full tunnel

  | Mode           | AllowedIPs côté nomade         | Effet                                         |
  |----------------|--------------------------------|-----------------------------------------------|
  | split tunnel   | réseaux de l'entreprise        | seul le trafic interne passe par le VPN       |
  | full tunnel    | `0.0.0.0/0`                    | tout passe par l'entreprise (filtrage, proxy) |

  ## Mémo des commandes

  | Besoin                       | Commande                                                  |
  |------------------------------|-----------------------------------------------------------|
  | Générer une paire de clés    | `umask 077; wg genkey \| tee privatekey \| wg pubkey > publickey` |
  | Monter / démonter            | `wg-quick up wg0` / `wg-quick down wg0`                   |
  | État, poignées de main       | `wg show`                                                 |
  | Ajouter un pair à chaud      | `wg set wg0 peer <clé> allowed-ips 10.200.0.10/32`        |
  | Retirer un pair à chaud      | `wg set wg0 peer <clé> remove`                            |
  | Recharger sans couper        | `wg syncconf wg0 <(wg-quick strip wg0)`                   |
  | Au démarrage (systemd)       | `systemctl enable --now wg-quick@wg0`                     |

  ## Dépannage méthodique

  1. `wg show` : y a-t-il un *latest handshake* récent ? Sinon : clés, endpoint, port UDP filtré.
  2. Handshake OK mais pas de trafic : **AllowedIPs** (des deux côtés), routes (`ip route`), `ip_forward`.
  3. `tcpdump -ni wg0` (trafic en clair dans le tunnel) et `tcpdump -ni <interface Internet> udp port 51820`
     (paquets chiffrés).
  4. Pare-feu de la passerelle : chaîne `forward` entre `wg0` et le LAN.

  ## Pièges courants

  - Deux sous-réseaux identiques sur les deux sites (`192.168.1.0/24` partout) : impossible de router.
    Le plan d'adressage doit être pensé pour tous les sites.
  - Oublier une adresse dans AllowedIPs : les paquets sont silencieusement rejetés.
  - Clé privée lisible par tous ou envoyée par mail.
  - Retirer un pair à chaud mais pas du fichier : il revient au redémarrage.

  ## Bonnes pratiques en entreprise

  - Une paire de clés par appareil, inventoriée (propriétaire, date), révoquée en cas de perte.
  - Sur Internet, la passerelle n'expose que le port UDP du VPN.
  - Pour les nomades : clés protégées sur le poste, et idéalement une solution de gestion centralisée
    (Netbird, Headscale, ou le VPN du pare-feu avec authentification AD et double facteur).
