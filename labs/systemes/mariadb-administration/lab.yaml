title: Administration de bases MariaDB
level: intermediaire
order: 11
tags: [mariadb, mysql, sql, utilisateurs, droits, sauvegarde, restauration]
summary: Démarrer et sécuriser MariaDB, importer une base, requêtes SQL, comptes applicatifs et droits, index, sauvegarde planifiée, restauration et journal des requêtes lentes.
compose: docker-compose.yml
service: admin
shell: bash
workdir: /root
description: |
  **Contexte.** Le logiciel de gestion commerciale d'*Ateliers Durand* utilise une base **MariaDB**
  (compatible MySQL). Le serveur vient d'être installé à partir d'une vieille procédure : il faut le
  sécuriser, importer les données, créer les comptes de l'application et de la comptabilité, mettre en
  place les sauvegardes et restaurer une base supprimée par erreur.

  | Machine | Adresse | Rôle |
  |---|---|---|
  | `admin` | 10.174.0.5 | ton poste, qui joue aussi le serveur d'application (client `mariadb`) — terminal du lab |
  | `srv-bdd` | 10.174.0.10 | MariaDB installé, **non démarré** ; `/root/gestion.sql`, `/srv/sauvegardes/` |

  - `ssh srv-bdd` (root, par clé). Sur srv-bdd, root se connecte à MariaDB sans mot de passe (`mariadb`),
    grâce à l'authentification par socket Unix.
  - Pas de systemd : `service mariadb start|stop|restart`.

  Réponses à écrire dans `/root/reponses.txt` d'admin, au format `cle=valeur`.
cours: |
  ## MariaDB en bref

  **MariaDB** est un serveur de bases de données relationnelles, issu de MySQL et compatible avec lui. Il
  stocke les données de nombreuses applications métier (gestion, sites web, GLPI, Nextcloud...). Une
  **base** contient des **tables** ; chaque table a des colonnes typées et des lignes. On l'interroge en
  **SQL**.

  ```
  application (admin) ── TCP 3306 ──▶ mariadbd (srv-bdd) ── /var/lib/mysql (fichiers InnoDB)
  root sur srv-bdd    ── socket Unix /run/mysqld/mysqld.sock ──▶ (authentification unix_socket)
  ```

  | Fichier / commande                          | Rôle                                         |
  |---------------------------------------------|----------------------------------------------|
  | `/etc/mysql/mariadb.conf.d/50-server.cnf`   | configuration du serveur (`bind-address`...) |
  | `/var/log/mysql/`                           | journaux (erreurs, requêtes lentes)          |
  | `mariadb` (ou `mysql`)                      | client en ligne de commande                  |
  | `mariadb-dump`, `mariadb-admin`             | sauvegarde, administration                   |

  ## SQL : le minimum vital

  ```sql
  SHOW DATABASES;  USE gestion;  SHOW TABLES;  DESCRIBE clients;
  SELECT nom, ville FROM clients WHERE ville = 'Lyon' ORDER BY nom;
  SELECT COUNT(*) FROM clients;
  SELECT c.nom, SUM(o.montant) FROM clients c JOIN commandes o ON o.client_id = c.id GROUP BY c.nom;
  INSERT INTO clients (nom, ville) VALUES ('Nouveau client', 'Lyon');
  UPDATE clients SET ville = 'Lyon' WHERE id = 7;      -- toujours avec un WHERE !
  DELETE FROM commandes WHERE id = 30;
  ```

  ## Comptes et droits

  Un compte MariaDB est un couple **utilisateur + hôte d'origine** : `'appli'@'10.174.0.%'` n'est pas le
  même compte que `'appli'@'localhost'`.

  ```sql
  CREATE USER 'appli'@'10.174.0.%' IDENTIFIED BY 'motdepasse';
  GRANT SELECT, INSERT, UPDATE, DELETE ON gestion.* TO 'appli'@'10.174.0.%';
  GRANT SELECT ON gestion.commandes TO 'compta'@'10.174.0.%';   -- droit sur une seule table
  SHOW GRANTS FOR 'appli'@'10.174.0.%';
  REVOKE DELETE ON gestion.* FROM 'appli'@'10.174.0.%';
  DROP USER 'ancien'@'%';
  ```

  | Niveau        | Exemple                     |
  |---------------|-----------------------------|
  | global        | `ON *.*` (administrateurs seulement) |
  | base          | `ON gestion.*`              |
  | table         | `ON gestion.commandes`      |
  | colonne       | `GRANT SELECT (nom) ON gestion.clients` |

  ## Sauvegarde et restauration

  | Besoin                         | Commande                                                     |
  |--------------------------------|--------------------------------------------------------------|
  | Sauvegarde logique cohérente   | `mariadb-dump --single-transaction gestion \| gzip > gestion.sql.gz` |
  | Toutes les bases               | `mariadb-dump --all-databases --single-transaction`          |
  | Restaurer une base             | `zcat sauvegarde.sql.gz \| mariadb` (ou `mariadb base < fichier.sql`) |
  | Sauvegarde physique à chaud    | `mariadb-backup --backup --target-dir=...`                   |

  `--single-transaction` produit une image cohérente des tables InnoDB sans bloquer l'application. Une
  sauvegarde n'est valable que si l'on a déjà **testé sa restauration**.

  ## Pièges courants

  - Laisser des comptes anonymes ou la base `test` (installations anciennes) : `mariadb-secure-installation`.
  - Écouter sur toutes les interfaces sans filtrer : le port 3306 ne doit être joignable que des serveurs
    d'application.
  - Donner `ALL PRIVILEGES ON *.*` à une application : une injection SQL devient une catastrophe.
  - Un `UPDATE` ou `DELETE` sans `WHERE`.
  - Copier les fichiers de `/var/lib/mysql` serveur démarré : sauvegarde incohérente.

  ## Bonnes pratiques en entreprise

  - Un compte par application, avec le minimum de droits et une origine précise.
  - Sauvegardes quotidiennes automatisées, copiées hors du serveur, restauration testée régulièrement.
  - Journal des requêtes lentes et index adaptés pour les performances.
  - Mises à jour de sécurité et supervision (connexions, espace disque, réplication).
