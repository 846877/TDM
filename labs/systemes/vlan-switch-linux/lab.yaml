title: VLAN, switch Linux et routage inter-VLAN
level: intermediaire
order: 6
tags: [vlan, 802.1q, switch, bridge, trunk, router-on-a-stick, netns, nftables]
summary: Construire un switch VLAN-aware avec un bridge Linux, ports d'accès et trunk 802.1Q, routeur « router-on-a-stick », VLAN d'administration et filtrage inter-VLAN.
build: .
privileged: true
shell: bash
workdir: /root
description: |
  **Contexte.** *Ateliers Durand* segmente son réseau : comptabilité, RH et serveurs ne doivent plus être
  sur le même domaine de diffusion. Faute de switch administrable disponible, tu montes un **switch
  Linux** : un bridge avec filtrage VLAN (`vlan_filtering`), exactement les mêmes notions que sur un switch
  Cisco (`switchport mode access`, `switchport trunk allowed vlan`...).

  **Le câblage est fait.** Chaque poste est un **espace de noms réseau** (`ip netns`), relié par un câble
  virtuel (paire veth) à un port `sw-pN` de ta machine, qui jouera le rôle du switch :

  | Port    | Poste (netns)  | Adresse           | Passerelle      | VLAN cible       |
  |---------|----------------|-------------------|-----------------|------------------|
  | `sw-p1` | `pc-compta1`   | 192.168.10.11/24  | 192.168.10.254  | 10 (COMPTA)      |
  | `sw-p2` | `pc-compta2`   | 192.168.10.12/24  | 192.168.10.254  | 10 (COMPTA)      |
  | `sw-p3` | `pc-rh1`       | 192.168.20.11/24  | 192.168.20.254  | 20 (RH)          |
  | `sw-p4` | `srv-fichiers` | 192.168.30.10/24  | 192.168.30.254  | 30 (SERVEURS)    |
  | `sw-p5` | `pc-nouveau`   | 192.168.10.13/24  | 192.168.10.254  | 20 (bureau RH)   |
  | `sw-p6` | `pc-invite`    | 192.168.40.10/24  | 192.168.40.254  | 40 (INVITÉS)     |
  | `sw-p7` | `prise-reunion`| 192.168.10.99/24  | 192.168.10.254  | aucun (prise libre) |
  | `sw-p8` | `routeur`      | à configurer      |                 | trunk 10,20,30,99 |

  Commandes : `ip netns exec pc-compta1 ping 192.168.10.12` (ou `ip -n pc-compta1 addr`),
  `bridge link`, `bridge vlan show`, `bridge vlan add/del dev <port> vid <n> [pvid] [untagged]`, et
  `vlans-port sw-p1` qui résume les VLAN d'un port (`10PU` = VLAN 10 natif non étiqueté, `20T` = étiqueté).
cours: |
  ## Pourquoi des VLAN

  Sur un switch non configuré, tous les ports forment **un seul domaine de diffusion** : un broadcast
  (ARP, DHCP) atteint tout le monde, et n'importe quel poste peut parler directement à n'importe quel autre.
  Un **VLAN** découpe un switch physique en plusieurs switchs logiques étanches : segmentation par service,
  réduction des broadcasts, et surtout contrôle des flux entre segments (qui passent obligatoirement par un
  routeur ou un pare-feu).

  ## Ports d'accès et trunk

  ```
                           switch sw0
   pc-compta1 ──[p1 accès VLAN 10]──┐
   pc-compta2 ──[p2 accès VLAN 10]──┤
   pc-rh1     ──[p3 accès VLAN 20]──┼──[p8 TRUNK 10,20,30 étiquetés]══▶ routeur
   srv-fichiers─[p4 accès VLAN 30]──┘                                    eth0.10 192.168.10.254
                                                                         eth0.20 192.168.20.254
                                                                         eth0.30 192.168.30.254
  ```

  - Un **port d'accès** appartient à un VLAN ; le poste envoie des trames **normales** (non étiquetées),
    le switch les place dans le VLAN du port (PVID).
  - Un **trunk** transporte plusieurs VLAN sur un même câble : chaque trame porte une **étiquette 802.1Q**
    de 4 octets insérée dans l'en-tête Ethernet, avec le numéro de VLAN (12 bits : 1 à 4094).
  - Le **VLAN natif** d'un trunk circule sans étiquette : on évite d'y mettre du trafic (attaques par
    double étiquetage), d'où la suppression du VLAN 1.

  ```
  | MAC dest | MAC src | 802.1Q : TPID 0x8100 | PCP | DEI | VID=10 | type | données | FCS |
  ```

  ## Correspondance Cisco / Linux

  | Cisco IOS                                         | Linux (bridge VLAN-aware)                          |
  |---------------------------------------------------|----------------------------------------------------|
  | `vlan 10` / `name COMPTA`                         | implicite                                          |
  | `switchport mode access` + `switchport access vlan 10` | `bridge vlan add dev sw-p1 vid 10 pvid untagged` |
  | `switchport mode trunk` + `allowed vlan 10,20,30` | `bridge vlan add dev sw-p8 vid 10` (étiqueté)     |
  | `interface vlan 99` + `ip address`                | `ip link add link sw0 name sw0.99 type vlan id 99` |
  | `interface Gi0/0.10` + `encapsulation dot1Q 10`   | `ip link add link eth0 name eth0.10 type vlan id 10` |
  | `show vlan brief`, `show interfaces trunk`         | `bridge vlan show`                                |
  | `show mac address-table`                          | `bridge fdb show`                                  |
  | `shutdown`                                        | `ip link set sw-p7 down`                           |

  ## Routage inter-VLAN

  Deux postes de VLAN différents sont dans des **réseaux IP différents** : il leur faut une passerelle.
  Deux architectures :

  - **router-on-a-stick** : un routeur relié par un trunk, une sous-interface par VLAN (ce lab) ; simple,
    mais tout le trafic inter-VLAN passe par un seul câble ;
  - **switch de niveau 3** : le switch route lui-même via des interfaces VLAN (SVI), bien plus performant ;
    c'est la norme dans les réseaux d'entreprise.

  C'est au point de routage qu'on **filtre** (ACL, pare-feu) : la segmentation n'a d'intérêt que si les
  flux entre VLAN sont limités au strict nécessaire.

  ## Mémo des commandes

  | Besoin                         | Commande                                              |
  |--------------------------------|-------------------------------------------------------|
  | Créer le switch                | `ip link add sw0 type bridge vlan_filtering 1`        |
  | Brancher un port               | `ip link set sw-p1 master sw0`                        |
  | Voir les VLAN des ports        | `bridge vlan show`                                    |
  | Retirer le VLAN 1              | `bridge vlan del dev sw-p1 vid 1`                     |
  | Commande dans un poste         | `ip netns exec pc-rh1 ping 192.168.20.254`            |
  | Capture avec étiquettes        | `tcpdump -i sw-p8 -e -nn`                             |

  ## Pièges courants

  - Oublier `vlan_filtering 1` : le bridge ignore les VLAN et tout communique.
  - Laisser le VLAN 1 sur les ports d'accès : le poste reste joignable dans deux VLAN.
  - VLAN autorisé sur le port d'accès mais pas sur le trunk (ou l'inverse) : « le poste ne joint pas sa
    passerelle ».
  - Croire qu'une adresse IP du « bon » sous-réseau suffit : au niveau 2, le VLAN prime.

  ## Bonnes pratiques en entreprise

  - Un plan VLAN documenté : numéros, noms, sous-réseaux, passerelles (souvent VLAN = 3e octet).
  - Un VLAN d'administration dédié pour les équipements réseau, des VLAN séparés pour serveurs, ToIP,
    imprimantes, invités, caméras.
  - Ports inutilisés éteints et placés dans un VLAN « parking » ; 802.1X pour l'affectation dynamique.
  - VLAN invités sans aucun accès interne, sortie Internet uniquement.
