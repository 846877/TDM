    url: https://manpages.ubuntu.com/manpages/noble/man8/bridge.8.html
  - title: ip-netns(8) - espaces de noms réseau
    url: https://manpages.ubuntu.com/manpages/noble/man8/ip-netns.8.html
  - title: Wikipédia - Réseau local virtuel (VLAN)
    url: https://fr.wikipedia.org/wiki/R%C3%A9seau_local_virtuel
  - title: Wikipédia - IEEE 802.1Q
    url: https://fr.wikipedia.org/wiki/IEEE_802.1Q
exercises:
  - id: switch
    title: Créer le switch
    cours: |
      Sous Linux, un **bridge** est un switch logiciel : les interfaces qu'on lui rattache deviennent ses
      ports. Avec l'option `vlan_filtering 1`, il gère les VLAN 802.1Q port par port, comme un switch
      administrable.

      - `ip link add <nom> type bridge vlan_filtering 1` crée le bridge ;
      - `ip link set <port> master <bridge>` branche un port ;
      - `ip link set <interface> up` active une interface ;
      - `bridge link` liste les ports branchés.

      Par défaut, chaque port est placé dans le VLAN 1, natif et non étiqueté : tout le monde communique
      tant qu'on n'a rien configuré.
    description: |
      Crée le bridge `sw0` **avec le filtrage VLAN activé** (`vlan_filtering 1`), branche-lui les ports
      `sw-p1` à `sw-p5` et `sw-p8`, et active-le.

      Sans autre configuration, tous les ports sont dans le VLAN 1 : `pc-compta1` doit déjà pouvoir pinguer
      `pc-compta2`.
    hint: "ip link add sw0 type bridge vlan_filtering 1 ; for p in sw-p1 sw-p2 sw-p3 sw-p4 sw-p5 sw-p8; do ip link set $p master sw0; done ; ip link set sw0 up"
    checks:
      - desc: sw0 est un bridge avec vlan_filtering 1
        run: ip -d link show sw0 | grep -q 'vlan_filtering 1'
      - desc: Les six ports sont branchés sur sw0
        run: for p in sw-p1 sw-p2 sw-p3 sw-p4 sw-p5 sw-p8; do ip link show $p | grep -q 'master sw0' || exit 1; done
      - desc: pc-compta1 joint pc-compta2
        run: ip netns exec pc-compta1 ping -c2 -W1 192.168.10.12 >/dev/null

  - id: acces
    title: Ports d'accès
    cours: |
      Un **port d'accès** ne porte qu'un VLAN, et les trames y circulent **sans étiquette** :

      - `bridge vlan add dev <port> vid <n> pvid untagged` : `pvid` (VLAN natif) place dans le VLAN `n` les
        trames non étiquetées reçues du poste, `untagged` retire l'étiquette des trames envoyées au poste ;
      - `bridge vlan del dev <port> vid 1` retire le VLAN par défaut.

      `bridge vlan show` liste les VLAN de chaque port ; l'outil du lab `vlans-port <port>` les résume
      (`P` = PVID, `U` = non étiqueté, `T` = étiqueté).
    description: |
      Configure les ports d'accès (l'équivalent de `switchport mode access` + `switchport access vlan`) :
      chaque port porte **un seul VLAN**, natif (`pvid`) et non étiqueté (`untagged`), et le VLAN 1 par
      défaut doit être **retiré** :
      - `sw-p1`, `sw-p2` → VLAN 10 ;
      - `sw-p3` → VLAN 20 ;
      - `sw-p4` → VLAN 30.
    hint: "bridge vlan del dev sw-p1 vid 1 ; bridge vlan add dev sw-p1 vid 10 pvid untagged"
    checks:
      - desc: sw-p1 et sw-p2 en accès VLAN 10
        run: test "$(vlans-port sw-p1)" = 10PU && test "$(vlans-port sw-p2)" = 10PU
      - desc: sw-p3 en accès VLAN 20, sw-p4 en accès VLAN 30
        run: test "$(vlans-port sw-p3)" = 20PU && test "$(vlans-port sw-p4)" = 30PU
      - desc: Les deux postes de la compta communiquent toujours
        run: ip netns exec pc-compta1 ping -c2 -W1 192.168.10.12 >/dev/null

  - id: nouveau-poste
    title: Un poste dans le mauvais VLAN
    cours: |
      Un VLAN est un domaine de **niveau 2** : deux postes dans des VLAN différents ne se voient pas, même
      s'ils ont des adresses du même sous-réseau. Inversement, un poste qui change de VLAN doit souvent
      changer d'adressage, car chaque VLAN correspond en général à un sous-réseau IP.

      Commandes dans un espace de noms : `ip -n <netns> addr flush dev eth0` efface les adresses,
      `ip -n <netns> addr add ...` en ajoute une, `ip -n <netns> route add default via ...` fixe la passerelle.
      Dans la vraie vie, le DHCP du nouveau VLAN s'en chargerait.
    description: |
      Le poste `pc-nouveau` est installé dans le bureau RH (port `sw-p5`) mais a été préparé avec une
      adresse de la compta.
      1. Mets `sw-p5` en accès dans le **VLAN 20**. Constate que `pc-nouveau` ne joint plus la compta, bien
         que son adresse soit dans le même sous-réseau : les VLAN isolent au niveau 2.
      2. Corrige son adressage : `192.168.20.12/24`, passerelle `192.168.20.254`.
    hint: "ip -n pc-nouveau addr flush dev eth0 ; ip -n pc-nouveau addr add 192.168.20.12/24 dev eth0 ; ip -n pc-nouveau route add default via 192.168.20.254"
    checks:
      - desc: sw-p5 en accès VLAN 20
        run: test "$(vlans-port sw-p5)" = 20PU
      - desc: pc-nouveau a l'adresse 192.168.20.12/24 et la bonne passerelle
        run: ip -n pc-nouveau -4 addr show eth0 | grep -q 'inet 192.168.20.12/24' && ip -n pc-nouveau route show default | grep -q 'via 192.168.20.254'
      - desc: pc-nouveau joint pc-rh1 dans le VLAN 20
        run: ip netns exec pc-nouveau ping -c2 -W1 192.168.20.11 >/dev/null

  - id: trunk
    title: Lien trunk vers le routeur
    cours: |
      Un **trunk** transporte plusieurs VLAN sur un même lien : chaque trame porte une étiquette 802.1Q avec
      son numéro de VLAN. Côté bridge Linux, un VLAN ajouté **sans** `pvid` ni `untagged` est transporté
      étiqueté.

      Bonne pratique : n'autoriser sur un trunk que les VLAN nécessaires (`allowed vlan` chez Cisco) et ne
      laisser aucun VLAN natif utilisé, pour éviter les fuites entre VLAN et les attaques par double
      étiquetage. Une boucle shell `for v in ...; do ...; done` évite les répétitions.
    description: |
      Le port `sw-p8` relie le switch au routeur. Configure-le en **trunk 802.1Q** transportant les VLAN
      **10, 20 et 30 étiquetés** (`switchport mode trunk` + `switchport trunk allowed vlan 10,20,30`), et
      retire le VLAN 1 (aucun VLAN non étiqueté sur ce lien).
    hint: "bridge vlan del dev sw-p8 vid 1 ; for v in 10 20 30; do bridge vlan add dev sw-p8 vid $v; done"
    checks:
      - desc: sw-p8 transporte 10, 20 et 30 étiquetés, sans VLAN 1 ni VLAN natif
        run: |
          v=" $(vlans-port sw-p8) "
          for x in 10T 20T 30T; do echo "$v" | grep -q " $x " || exit 1; done
          ! echo "$v" | grep -Eq 'U | 1T | 1P'

  - id: router-on-a-stick
    title: Routage inter-VLAN (router-on-a-stick)
    cours: |
      Pour router entre VLAN avec un seul lien, le routeur crée une **sous-interface VLAN** par VLAN sur son
      interface trunk : elle reçoit et émet les trames étiquetées avec son numéro, et porte l'adresse de
      passerelle du sous-réseau.

      - `ip link add link <parent> name <parent>.<vid> type vlan id <vid>` crée la sous-interface ;
      - l'adresse s'ajoute avec `ip addr add`, l'interface s'active avec `ip link set ... up` ;
      - un système Linux ne route que si `net.ipv4.ip_forward` vaut 1 (`sysctl -w`).

      Toutes ces commandes sont à lancer **dans** l'espace de noms du routeur (`ip -n routeur ...` ou
      `ip netns exec routeur ...`).
    description: |
      Dans l'espace de noms `routeur`, crée sur `eth0` une **sous-interface VLAN** par VLAN (comme
      `interface Gi0/0.10` + `encapsulation dot1Q 10` sur un routeur Cisco), nommées `eth0.10`, `eth0.20` et
      `eth0.30`, avec l'adresse `.254` de chaque sous-réseau, puis active le routage
      (`net.ipv4.ip_forward=1`) **dans** cet espace de noms.

      Les postes de la compta et des RH doivent alors joindre `srv-fichiers`.
    hint: "ip -n routeur link add link eth0 name eth0.10 type vlan id 10 ; ip -n routeur addr add 192.168.10.254/24 dev eth0.10 ; ip -n routeur link set eth0.10 up ; ip netns exec routeur sysctl -w net.ipv4.ip_forward=1"
    checks:
      - desc: Les trois sous-interfaces 802.1Q existent avec leur adresse
        run: |
          for v in 10 20 30; do
            ip -n routeur -d link show eth0.$v 2>/dev/null | grep -q "802.1Q id $v " || exit 1
            ip -n routeur -4 addr show eth0.$v | grep -q "inet 192.168.$v.254/24" || exit 1
          done
      - desc: Le routage est activé dans le routeur
        run: test "$(ip netns exec routeur sysctl -n net.ipv4.ip_forward)" = 1
      - desc: pc-compta1 et pc-rh1 joignent srv-fichiers
        run: ip netns exec pc-compta1 ping -c2 -W1 192.168.30.10 >/dev/null && ip netns exec pc-rh1 ping -c2 -W1 192.168.30.10 >/dev/null

  - id: vlan-admin
    title: VLAN d'administration du switch
    cours: |
      Le switch lui-même a besoin d'une adresse pour être administré (SSH, SNMP, supervision). On la place
      dans un **VLAN d'administration** dédié, que les utilisateurs ne peuvent pas joindre.

      Sur un bridge Linux, le bridge est aussi un « port » vers la machine hôte : `bridge vlan add dev sw0 vid
      <n> self` l'ajoute au VLAN, puis une interface VLAN créée **sur le bridge** (`sw0.<n>`) porte l'adresse.
      Le VLAN doit aussi être autorisé sur le trunk pour atteindre le routeur.
    description: |
      Un switch administrable possède une adresse dans un **VLAN d'administration** (`interface vlan 99`).
      Fais de même :
      1. autorise le VLAN 99 étiqueté sur le trunk `sw-p8` et sur le bridge lui-même
         (`bridge vlan add dev sw0 vid 99 self`) ;
      2. crée l'interface `sw0.99` (VLAN 99 sur `sw0`) avec l'adresse `192.168.99.2/24` ;
      3. crée côté routeur la sous-interface `eth0.99` en `192.168.99.254/24`.

      Le switch (ta machine) doit pinguer `192.168.99.254`.
    hint: "bridge vlan add dev sw-p8 vid 99 ; bridge vlan add dev sw0 vid 99 self ; ip link add link sw0 name sw0.99 type vlan id 99 ; ip addr add 192.168.99.2/24 dev sw0.99 ; ip link set sw0.99 up"
    checks:
      - desc: sw0.99 a l'adresse 192.168.99.2/24
        run: ip -4 addr show sw0.99 2>/dev/null | grep -q 'inet 192.168.99.2/24'
      - desc: Le VLAN 99 est étiqueté sur le trunk
        run: echo " $(vlans-port sw-p8) " | grep -q ' 99T '
      - desc: Le switch joint le routeur dans le VLAN 99
        run: ping -c2 -W1 192.168.99.254 >/dev/null

  - id: capture-trunk
    title: Observer les trames étiquetées
    cours: |
      Par défaut, `tcpdump` n'affiche pas les en-têtes Ethernet. L'option `-e` les montre, avec l'étiquette
      802.1Q (`vlan 10, p 0, ethertype IPv4`). `-nn` désactive toute résolution de noms et de ports.

      Un paquet routé entre deux VLAN traverse le trunk **deux fois** : du switch vers le routeur avec
      l'étiquette du VLAN source, puis du routeur vers le switch avec celle du VLAN de destination. C'est la
      limite du router-on-a-stick : le trunk transporte deux fois le trafic inter-VLAN.
    description: |
      Capture le trafic du port trunk `sw-p8` **avec les en-têtes Ethernet** dans `/root/trunk.pcap`
      pendant que `pc-compta1` pingue `srv-fichiers`. Relis-la avec `tcpdump -enr /root/trunk.pcap` : chaque
      paquet traverse le trunk deux fois, avec l'étiquette du VLAN d'origine puis celle du VLAN de
      destination.
    hint: "tcpdump -i sw-p8 -e -nn -w /root/trunk.pcap &  ip netns exec pc-compta1 ping -c3 192.168.30.10 ; kill %1"
    checks:
      - desc: La capture montre l'ICMP étiqueté VLAN 10 et VLAN 30
        run: |
          tcpdump -enr /root/trunk.pcap 2>/dev/null > /tmp/trunk.txt
          grep -q 'vlan 10,.*ICMP' /tmp/trunk.txt && grep -q 'vlan 30,.*ICMP' /tmp/trunk.txt

  - id: vlan-filtrage
    title: Filtrer entre les VLAN
    cours: |
      nftables s'organise en **tables** (famille `inet` = IPv4 + IPv6), **chaînes** (attachées à un hook :
      `input`, `forward`, `output`) et **règles**. Le hook `forward` voit les paquets **routés** par la machine,
      donc le trafic entre VLAN.

      - une chaîne de base se crée avec `{ type filter hook forward priority 0; policy drop; }` (pense aux
        guillemets dans le shell) ;
      - `ct state established,related accept` laisse passer les réponses des connexions autorisées ;
      - `iifname` / `oifname` désignent les interfaces d'entrée et de sortie (ici les sous-interfaces VLAN).

      `nft list ruleset` affiche toute la configuration.
    description: |
      Router tous les VLAN entre eux annule une partie de l'intérêt de la segmentation. Sur le **routeur**,
      avec nftables (`ip netns exec routeur nft ...`), crée une table `inet filtre` avec une chaîne
      `forward` (hook forward, **politique drop**) qui :
      - accepte les connexions établies ou relatives (`ct state established,related accept`) ;
      - autorise la compta (VLAN 10) et les RH (VLAN 20) à joindre les serveurs (VLAN 30) ;
      - et c'est tout : la compta et les RH ne doivent plus se joindre.
    hint: "ip netns exec routeur nft add table inet filtre ; ... add chain inet filtre forward '{ type filter hook forward priority 0; policy drop; }' ; ... add rule inet filtre forward ct state established,related accept ; ... add rule inet filtre forward iifname \"eth0.10\" oifname \"eth0.30\" accept"
    checks:
      - desc: La chaîne forward a une politique drop
        run: ip netns exec routeur nft list chain inet filtre forward 2>/dev/null | grep -q 'policy drop'
      - desc: compta et RH joignent toujours srv-fichiers
        run: ip netns exec pc-compta1 ping -c2 -W1 192.168.30.10 >/dev/null && ip netns exec pc-rh1 ping -c2 -W1 192.168.30.10 >/dev/null
      - desc: compta et RH ne se joignent plus
        run: "! ip netns exec pc-compta1 ping -c2 -W1 192.168.20.11 >/dev/null 2>&1 && ! ip netns exec pc-rh1 ping -c2 -W1 192.168.10.11 >/dev/null 2>&1"

  - id: vlan-table-mac
    title: Lire la table MAC du switch
    cours: |
      Un switch **apprend** les adresses MAC : quand une trame arrive sur un port, il note « cette MAC source
      est derrière ce port, dans ce VLAN ». Il peut ensuite envoyer les trames destinées à cette MAC sur ce
      seul port, au lieu de les diffuser partout.

      - `bridge fdb show br <bridge>` affiche la table (MAC, port, VLAN) ;
      - les entrées `permanent` correspondent aux interfaces du bridge lui-même ;
      - les entrées apprises expirent après quelques minutes sans trafic.

      En dépannage, la table MAC répond à la question « sur quelle prise est branché ce poste ? ».
    description: |
      Un switch apprend sur quel port se trouve chaque adresse MAC (table **FDB** : *forwarding database*,
      `show mac address-table` chez Cisco). Fais pinguer `srv-fichiers` par `pc-compta1`, puis consulte la
      table avec `bridge fdb show br sw0`.

      Ajoute à `/root/reponses.txt` :
      - `port_srv_fichiers=` le port derrière lequel le switch a appris la MAC de `srv-fichiers`
        (sa MAC : `ip -n srv-fichiers link show eth0`) ;
      - `vlan_srv_fichiers=` le VLAN dans lequel elle a été apprise.
    hint: "ip -n srv-fichiers link show eth0 | grep ether ; bridge fdb show br sw0 | grep <mac>"
    checks:
      - desc: Port et VLAN de srv-fichiers
        run: |
          grep -Eqi '^port_srv_fichiers *= *sw-p4 *$' /root/reponses.txt && grep -Eqi '^vlan_srv_fichiers *= *30 *$' /root/reponses.txt

  - id: vlan-port-inutilise
    title: Désactiver une prise libre
    cours: |
      Un port de switch actif et dans un VLAN de production est une porte ouverte : n'importe qui peut y
      brancher un portable et obtenir un accès au réseau.

      Mesures classiques : éteindre les ports inutilisés (`shutdown`), les placer dans un VLAN « parking »
      sans routage, et activer 802.1X ou la sécurité de port (limitation des adresses MAC).

      Sous Linux, `ip link set <port> down` éteint une interface ; `ip link set <port> nomaster` la débranche
      d'un bridge. Le drapeau `UP` disparaît alors de `ip link show`.
    description: |
      La prise murale de la salle de réunion (port `sw-p7`) n'est attribuée à personne, mais quelqu'un y a
      branché un appareil (`prise-reunion`). Bonne pratique : un port inutilisé est **éteint** et n'appartient
      à aucun VLAN de production (`shutdown` chez Cisco).

      **Éteins** le port `sw-p7` et assure-toi qu'il n'est pas branché sur le switch ou, s'il l'est, qu'il ne
      porte aucun VLAN.
    hint: ip link set sw-p7 down
    checks:
      - desc: Le port sw-p7 est éteint
        run: "! ip -o link show sw-p7 | grep -q '[<,]UP[,>]'"
      - desc: sw-p7 ne porte aucun VLAN
        run: test -z "$(vlans-port sw-p7)"

  - id: vlan-invites
    title: VLAN invités isolé
    cours: |
      Un VLAN invités suit le même modèle que les autres : port d'accès, VLAN autorisé sur le trunk,
      sous-interface et adresse de passerelle sur le routeur.

      Sa particularité est le **filtrage** : les invités ne doivent atteindre qu'Internet (ici, rien d'autre
      que leur passerelle). Une chaîne `forward` en politique `drop` bloque déjà tout ce qui n'est pas
      explicitement autorisé : c'est l'intérêt de la liste blanche, un nouveau réseau est isolé par défaut.

      Le ping vers la passerelle n'est pas concerné par la chaîne `forward` : il s'adresse au routeur lui-même
      (chaîne `input`).
    description: |
      La salle d'attente reçoit un VLAN **40 (INVITÉS)** : `192.168.40.0/24`, passerelle `192.168.40.254`.
      1. Branche `sw-p6` sur le switch en accès VLAN 40.
      2. Ajoute le VLAN 40 étiqueté sur le trunk `sw-p8`.
      3. Crée la sous-interface `eth0.40` du routeur en `192.168.40.254/24`.

      Le poste `pc-invite` doit joindre sa passerelle, mais **aucun** réseau interne (le pare-feu de
      l'exercice précédent s'en charge si tu n'y ajoutes rien pour le VLAN 40).
    hint: "ip link set sw-p6 master sw0 ; bridge vlan del dev sw-p6 vid 1 ; bridge vlan add dev sw-p6 vid 40 pvid untagged ; bridge vlan add dev sw-p8 vid 40 ; ip -n routeur link add link eth0 name eth0.40 type vlan id 40 ..."
    checks:
      - desc: sw-p6 en accès VLAN 40 sur sw0
        run: ip link show sw-p6 | grep -q 'master sw0' && test "$(vlans-port sw-p6)" = 40PU
      - desc: Le trunk transporte le VLAN 40 étiqueté
        run: echo " $(vlans-port sw-p8) " | grep -q ' 40T '
      - desc: pc-invite joint sa passerelle
        run: ip netns exec pc-invite ping -c2 -W1 192.168.40.254 >/dev/null
      - desc: pc-invite ne joint ni les serveurs ni la compta
        run: "! ip netns exec pc-invite ping -c2 -W1 192.168.30.10 >/dev/null 2>&1 && ! ip netns exec pc-invite ping -c2 -W1 192.168.10.11 >/dev/null 2>&1"
