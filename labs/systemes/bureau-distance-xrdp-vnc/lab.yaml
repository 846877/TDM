title: Bureaux à distance - RDP (xrdp) et VNC
level: intermediaire
order: 5
tags: [rdp, xrdp, vnc, tigervnc, bureau à distance, tls, ssh]
summary: Mettre en service un serveur RDP (xrdp) restreint à un groupe, avec certificat TLS et bureau XFCE, puis un VNC accessible seulement par tunnel SSH.
compose: docker-compose.yml
service: admin
shell: bash
workdir: /root
description: |
  **Contexte.** Les commerciaux d'*Ateliers Durand* doivent accéder à un bureau Linux depuis leur PC
  Windows avec le client **Connexion Bureau à distance** (RDP, port 3389). Le support veut aussi pouvoir
  prendre la main en **VNC**, mais uniquement à travers SSH.

  **Machines.**

  | Machine  | Rôle                                                                     |
  |----------|--------------------------------------------------------------------------|
  | `admin`  | ton poste (`root`) ; `ssh bureau` ouvre une session root par clé          |
  | `bureau` | serveur de bureaux : `xrdp`, `xorgxrdp`, TigerVNC et XFCE installés, rien n'est configuré |

  Le port RDP du serveur est publié sur **le port 9489 de ta machine** : une fois l'exercice 4 réussi, tu
  peux ouvrir `mstsc` (Windows) ou Remmina (Linux) vers `localhost:9489`.

  xrdp n'a pas de systemd ici : démarrage avec `xrdp-sesman` puis `xrdp` ; arrêt avec
  `pkill xrdp; pkill xrdp-sesman`. Journaux : `/var/log/xrdp.log` et `/var/log/xrdp-sesman.log`.
cours: |
  ## Deux familles de bureau à distance

  | Protocole | Port  | Principe                                                         | Usage typique                     |
  |-----------|-------|------------------------------------------------------------------|-----------------------------------|
  | **RDP**   | 3389  | le serveur crée une **session** dédiée à l'utilisateur ; envoie des ordres de dessin compressés, son, presse-papiers, imprimantes, lecteurs | bureaux distants, serveurs Windows (RDS), clients légers |
  | **VNC**   | 5900+N| partage d'un **écran** (framebuffer) sous forme d'images         | prise en main, assistance         |

  RDP est le protocole de Microsoft (client `mstsc`, « Connexion Bureau à distance ») ; sous Linux, le
  serveur **xrdp** le parle, ce qui permet aux postes Windows de se connecter sans logiciel supplémentaire.
  Côté Windows Server, le rôle **Services Bureau à distance (RDS)** joue le même rôle à grande échelle, avec
  des licences d'accès client (CAL RDS).

  ## Architecture de xrdp

  ```
  mstsc / Remmina ──RDP/TLS 3389──▶ xrdp ──▶ xrdp-sesman ──▶ authentification PAM
                                     │          └─ démarre Xorg (xorgxrdp) + startwm.sh
                                     └──────────────── relie l'écran de la session au client
  ```

  | Fichier                    | Rôle                                                          |
  |----------------------------|---------------------------------------------------------------|
  | `/etc/xrdp/xrdp.ini`       | écoute, sécurité (TLS), certificat, apparence de l'écran de connexion |
  | `/etc/xrdp/sesman.ini`     | sessions : qui a le droit, limites, délais                    |
  | `/etc/xrdp/startwm.sh`     | script lancé à l'ouverture de session (ou `~/.xsession`)       |
  | `/var/log/xrdp*.log`       | journaux                                                      |

  ```
  ; xrdp.ini [Globals]
  port=3389
  security_layer=tls        ; rdp (ancien, faible) | tls | negotiate
  crypt_level=high
  certificate=/etc/xrdp/cert.pem
  key_file=/etc/xrdp/key.pem

  ; sesman.ini [Security]
  AllowRootLogin=false
  TerminalServerUsers=tsusers
  AlwaysGroupCheck=true
  ```

  ## Certificat TLS

  Le client affiche l'empreinte du certificat à la première connexion : avec un certificat auto-signé,
  l'utilisateur doit comparer l'empreinte (comme pour SSH). En entreprise, on utilise un certificat signé
  par l'**autorité de certification interne** (ADCS sous Windows), déployée sur les postes : plus aucun
  avertissement, et une alerte réelle en cas d'usurpation.

  ```bash
  openssl req -x509 -newkey rsa:2048 -nodes -days 730 -subj '/CN=bureau.durand.lan' \
      -keyout key.pem -out cert.pem
  openssl x509 -in cert.pem -noout -subject -dates -fingerprint -sha256
  ```

  ## VNC : à ne jamais exposer tel quel

  Le mot de passe VNC est limité à **8 caractères** et le flux n'est pas chiffré par défaut. La règle :
  écouter **uniquement sur la boucle locale** (`-localhost yes`) et passer par un **tunnel SSH**.

  ```
  admin:5901 ══ tunnel SSH chiffré ══▶ bureau ──▶ 127.0.0.1:5901 (Xvnc)
  ssh -f -N -L 5901:127.0.0.1:5901 support@bureau      puis client VNC → 127.0.0.1:5901
  ```

  | Commande TigerVNC                  | Usage                               |
  |------------------------------------|-------------------------------------|
  | `vncpasswd`                        | définir le mot de passe VNC         |
  | `vncserver :1 -geometry 1280x800 -localhost yes` | démarrer l'affichage :1 (port 5901) |
  | `vncserver -list` / `-kill :1`     | lister / arrêter                    |
  | `~/.vnc/xstartup`                  | programme lancé dans la session     |

  ## Pièges courants

  - Ouvrir 3389 sur Internet : c'est l'un des vecteurs d'attaque les plus exploités (force brute,
    rançongiciels). On passe par un **VPN** ou une **passerelle RD Gateway** (RDP dans HTTPS).
  - Un utilisateur déjà connecté localement à l'écran ne peut souvent pas ouvrir de session xrdp en même
    temps (une seule session graphique par utilisateur sur certains bureaux).
  - Clé privée du certificat illisible par xrdp : connexion refusée, message dans `xrdp.log`.
  - Écran noir à la connexion : session (`startwm.sh`, `~/.xsession`) qui ne démarre pas.

  ## Bonnes pratiques en entreprise

  - Restreindre l'accès à un **groupe** dédié, jamais à root.
  - Imposer TLS (ou NLA côté Windows), avec un certificat de l'autorité interne.
  - Fixer des limites de sessions et de déconnexion pour libérer les ressources.
  - Pour la prise en main des postes utilisateurs, demander l'accord de l'utilisateur (outils avec
    acceptation explicite) et tracer les interventions.
