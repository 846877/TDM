exercises:
  - id: comptes
    title: Comptes et groupe autorisé
    cours: |
      L'accès RDP sera réservé à un **groupe**, comme le groupe « Utilisateurs du Bureau à distance » sous
      Windows. On crée donc d'abord le groupe, puis les comptes :

      - `groupadd <groupe>` ;
      - `useradd -m -s /bin/bash -c "<Nom>" -G <groupe> <login>` (dossier personnel indispensable pour une
        session graphique) ;
      - `chpasswd` pour fixer le mot de passe dans un script.

      xrdp authentifie les utilisateurs par **PAM**, c'est-à-dire avec les comptes du système (ou d'un
      annuaire LDAP/AD si le serveur y est joint).
    description: |
      Sur `bureau`, crée :
      - le groupe `tsusers` (utilisateurs autorisés à ouvrir une session RDP) ;
      - l'utilisatrice `lgarnier` (Lucie Garnier, commerciale), mot de passe `Commercial2024!`, membre de
        `tsusers` ;
      - l'utilisateur `support` (mot de passe `Support2024!`), **non** membre de `tsusers`.
    hint: "groupadd tsusers ; useradd -m -s /bin/bash -c 'Lucie Garnier' -G tsusers lgarnier ; echo 'lgarnier:Commercial2024!' | chpasswd"
    checks:
      - desc: lgarnier est membre de tsusers
        run: ssh bureau 'id -nG lgarnier' | grep -qw tsusers
      - desc: support existe sans être dans tsusers
        run: ssh bureau 'id support' >/dev/null && ! ssh bureau 'id -nG support' | grep -qw tsusers
      - desc: Mot de passe de lgarnier
        run: |
          ssh bureau "h=\$(awk -F: '\$1==\"lgarnier\"{print \$2}' /etc/shadow); perl -e 'exit(crypt(\$ARGV[0],\$ARGV[1]) eq \$ARGV[1] ? 0 : 1)' 'Commercial2024!' \"\$h\""

  - id: rdp-certificat
    title: Certificat TLS du serveur RDP
    cours: |
      `openssl req -x509` génère en une commande une clé et un certificat **auto-signé** :

      - `-newkey rsa:2048` crée une nouvelle clé RSA de 2048 bits ; `-nodes` la laisse non chiffrée (le
        service doit pouvoir la lire au démarrage) ;
      - `-days` fixe la durée de validité ;
      - `-subj '/CN=<nom>'` évite les questions interactives ;
      - `-keyout` et `-out` désignent les fichiers de la clé et du certificat.

      `openssl x509 -noout -subject -dates` relit un certificat. La clé privée est le secret du serveur :
      lisible par root et par le groupe du service seulement (`chown`, `chmod`).
    description: |
      Par défaut, xrdp utilise un certificat générique (« snakeoil »). Génère un certificat auto-signé
      propre au serveur, valable **2 ans**, avec le CN `bureau.durand.lan` et une clé RSA **2048** bits :
      `/etc/xrdp/cert.pem` et `/etc/xrdp/key.pem`. La clé doit être lisible par root et par le groupe
      `ssl-cert` seulement (xrdp en fait partie) : propriétaire `root:ssl-cert`, droits `640`.
    hint: "openssl req -x509 -newkey rsa:2048 -nodes -days 730 -subj '/CN=bureau.durand.lan' -keyout /etc/xrdp/key.pem -out /etc/xrdp/cert.pem"
    checks:
      - desc: Certificat avec le CN bureau.durand.lan
        run: ssh bureau 'openssl x509 -in /etc/xrdp/cert.pem -noout -subject' | grep -q 'CN *= *bureau.durand.lan'
      - desc: La clé correspond au certificat
        run: |
          ssh bureau 'test "$(openssl x509 -in /etc/xrdp/cert.pem -noout -pubkey | openssl sha256)" = "$(openssl pkey -in /etc/xrdp/key.pem -pubout | openssl sha256)"'
      - desc: Clé en 640, root:ssl-cert
        run: test "$(ssh bureau stat -c %a:%U:%G /etc/xrdp/key.pem)" = 640:root:ssl-cert

  - id: configuration
    title: Configurer xrdp et le gestionnaire de sessions
    cours: |
      Les fichiers de xrdp sont au format **INI** : des sections `[Nom]` et des lignes `clé=valeur`.

      - dans `xrdp.ini`, la section `[Globals]` règle l'écoute et la sécurité : `security_layer=tls` refuse
        l'ancien chiffrement RDP natif, `crypt_level` fixe le niveau, `certificate`/`key_file` les fichiers ;
      - dans `sesman.ini`, la section `[Security]` décide qui peut ouvrir une session.

      `sed -i 's/^clé=.*/clé=valeur/' fichier` modifie une valeur existante ; vérifie ensuite avec `grep`.
      Attention à ne pas modifier une clé du même nom dans une autre section.
    description: |
      1. Dans `/etc/xrdp/xrdp.ini` (section `[Globals]`) : port `3389`, `security_layer=tls` (on refuse
         l'ancienne sécurité RDP native), `crypt_level=high`, `certificate` et `key_file` pointant vers tes
         fichiers.
      2. Dans `/etc/xrdp/sesman.ini` (section `[Security]`) : `AllowRootLogin=false`,
         `TerminalServerUsers=tsusers` et `AlwaysGroupCheck=true`, pour que **seuls** les membres de
         `tsusers` puissent ouvrir une session.
    hint: "sed -i 's/^security_layer=.*/security_layer=tls/' /etc/xrdp/xrdp.ini (idem pour les autres clés)"
    checks:
      - desc: xrdp.ini - TLS, chiffrement élevé, certificat
        run: |
          ssh bureau cat /etc/xrdp/xrdp.ini > /tmp/xrdp.ini
          grep -Eq '^security_layer *= *tls' /tmp/xrdp.ini && grep -Eq '^crypt_level *= *high' /tmp/xrdp.ini &&
          grep -Eq '^certificate *= */etc/xrdp/cert.pem' /tmp/xrdp.ini && grep -Eq '^key_file *= */etc/xrdp/key.pem' /tmp/xrdp.ini &&
          grep -Eq '^port *= *(3389|tcp://:3389)' /tmp/xrdp.ini
      - desc: sesman.ini - restriction au groupe tsusers, root interdit
        run: |
          ssh bureau cat /etc/xrdp/sesman.ini > /tmp/sesman.ini
          grep -Eq '^AllowRootLogin *= *(false|no|0)' /tmp/sesman.ini && grep -Eq '^TerminalServerUsers *= *tsusers' /tmp/sesman.ini &&
          grep -Eq '^AlwaysGroupCheck *= *(true|yes|1)' /tmp/sesman.ini

  - id: rdp-demarrage
    title: Démarrer le service RDP
    cours: |
      xrdp se compose de deux démons : **xrdp-sesman** (authentification et création des sessions) et
      **xrdp** (le serveur RDP lui-même). Le gestionnaire de sessions doit être démarré en premier.

      - `ss -ltnp | grep 3389` vérifie l'écoute ;
      - `/var/log/xrdp.log` et `/var/log/xrdp-sesman.log` expliquent les refus (certificat illisible, groupe
        manquant, mot de passe faux).

      Une connexion RDP commence par une **négociation** (trame X.224) où le client propose des protocoles de
      sécurité et où le serveur en choisit un : c'est ce que la vérification observe.
    description: |
      Démarre `xrdp-sesman` puis `xrdp` sur `bureau`. Le serveur doit répondre à une négociation RDP en
      choisissant **TLS**. La vérification envoie elle-même une demande de connexion RDP (trame X.224) et
      analyse la réponse.

      Depuis ta machine, connecte-toi à `localhost:9489` avec `lgarnier` (accepte le certificat, compare
      son empreinte), puis essaie avec `support` : la session doit être refusée.
    hint: "ssh bureau 'xrdp-sesman && xrdp' ; ss -ltnp | grep 3389"
    checks:
      - desc: xrdp et xrdp-sesman tournent
        run: ssh bureau 'pgrep -x xrdp >/dev/null && pgrep -x xrdp-sesman >/dev/null'
      - desc: Le serveur répond à la négociation RDP en choisissant TLS
        run: |
          set -- $( (printf '\003\000\000\023\016\340\000\000\000\000\000\001\000\010\000\003\000\000\000'; sleep 2) | nc -w3 bureau 3389 | od -An -tx1 -v )
          test "$1" = 03 && test "$6" = d0 && test "${12}" = 02 && test "${16}" = 01

  - id: session-xfce
    title: Ouvrir un bureau XFCE
    cours: |
      À l'ouverture de session, xrdp exécute `/etc/xrdp/startwm.sh`. Ce script lance la session définie par
      l'utilisateur dans `~/.xsession` si elle existe, sinon la session par défaut du système.

      - `startxfce4` démarre l'environnement XFCE, léger et adapté aux bureaux distants ;
      - le fichier `~/.xsession` doit appartenir à l'utilisateur.

      Modifier `startwm.sh` agit pour tous les utilisateurs ; `~/.xsession` permet un choix par utilisateur.
      `ps -u <login>` montre les processus de la session une fois connectée.

      Si la session se ferme aussitôt ouverte, le fichier `~/.xsession-errors` de l'utilisateur donne presque toujours la raison.
    description: |
      À la connexion, xrdp lance `/etc/xrdp/startwm.sh`, qui démarre par défaut la session système. Pour que
      chaque utilisateur obtienne un bureau **XFCE**, crée pour `lgarnier` le fichier `~/.xsession`
      contenant `startxfce4` (ou modifie `startwm.sh` pour lancer `startxfce4`).

      Connecte-toi en RDP : tu dois voir le bureau XFCE. Côté serveur, `ps -u lgarnier` montre alors
      `xfce4-session`.
    hint: "echo startxfce4 > /home/lgarnier/.xsession && chown lgarnier: /home/lgarnier/.xsession"
    checks:
      - desc: La session de lgarnier lance XFCE
        run: ssh bureau 'grep -qs startxfce4 /home/lgarnier/.xsession || grep -q "^[^#]*startxfce4" /etc/xrdp/startwm.sh'

  - id: vnc
    title: Serveur VNC pour le support
    cours: |
      TigerVNC fournit un serveur X virtuel (`Xtigervnc`) lancé par `vncserver`.

      - `vncpasswd`, exécuté **par l'utilisateur concerné**, enregistre son mot de passe VNC dans `~/.vnc/` ;
      - `vncserver :<N>` démarre l'affichage N, qui écoute sur le port **5900 + N** ;
      - `-geometry` fixe la résolution ; `-localhost yes` limite l'écoute à 127.0.0.1.

      `su - <login> -c '<commande>'` exécute une commande avec l'identité et l'environnement d'un autre
      utilisateur. Sans `-localhost`, le port serait accessible à tout le réseau, avec un chiffrement faible.
    description: |
      Pour le support, configure TigerVNC pour l'utilisateur `support` :
      1. mot de passe VNC (`vncpasswd`, en tant que support) ;
      2. démarre le serveur sur l'affichage **:1** (port 5901), résolution `1280x800`, en écoutant
         **uniquement sur la boucle locale** (`-localhost yes`) : VNC chiffre mal, il passera par SSH.

      Le serveur doit exiger une authentification (pas de `SecurityTypes None`).
    hint: "su - support -c 'vncpasswd' puis su - support -c 'vncserver :1 -geometry 1280x800 -localhost yes'"
    checks:
      - desc: Un serveur VNC de support écoute sur 127.0.0.1:5901
        run: ssh bureau 'pgrep -u support -f "Xtigervnc|Xvnc" >/dev/null && nc -z 127.0.0.1 5901'
      - desc: Le serveur VNC exige une authentification
        run: |
          ssh bureau '(printf "RFB 003.008\n"; sleep 2) | nc -w3 127.0.0.1 5901 | od -An -tx1 -v' > /tmp/rfb.txt
          set -- $(cat /tmp/rfb.txt)
          test "$1" = 52 || exit 1
          shift 12; n=$((0x$1)); shift
          test "$n" -ge 1 || exit 1
          t=" $* "; echo "$t" | grep -q ' 01 ' && exit 1
          echo "$t" | grep -Eq ' (02|13|12) '
      - desc: Le port 5901 n'est pas joignable depuis le réseau
        run: "! nc -z -w2 bureau 5901"

  - id: tunnel-vnc
    title: Prise en main VNC à travers SSH
    cours: |
      Un **tunnel local** SSH (`-L <port_local>:<hôte>:<port>`) fait écouter un port sur ton poste et
      transporte les connexions à travers SSH ; l'hôte de destination est vu **depuis le serveur** :
      `127.0.0.1` y désigne donc le serveur lui-même, là où VNC écoute.

      `-f` passe en arrière-plan après l'authentification et `-N` n'exécute aucune commande distante. Le
      client VNC (Remmina, TigerVNC Viewer...) se connecte ensuite sur le port local, et tout le trafic est
      chiffré par SSH.

      Le serveur VNC peut alors n'écouter que sur `localhost` : il devient injoignable directement depuis le réseau, seul le tunnel y mène.
    description: |
      Depuis admin, ouvre en arrière-plan un tunnel SSH (`-f -N -L`) avec le compte `support` (mot de passe
      `Support2024!`) pour que le port **5901 local d'admin** mène au VNC de bureau. Un client VNC
      pointant sur `127.0.0.1:5901` d'admin atteindrait alors la session, chiffrée par SSH.
    hint: ssh -f -N -L 5901:127.0.0.1:5901 support@bureau
    checks:
      - desc: Le port 5901 d'admin mène au serveur VNC
        run: |
          (sleep 2) | nc -w3 127.0.0.1 5901 | head -c 12 | grep -q 'RFB 003'

  - id: rdp-limites-sessions
    title: Limiter et nettoyer les sessions
    cours: |
      La section `[Sessions]` de `sesman.ini` règle la vie des sessions :

      | Clé                     | Rôle                                                      |
      |-------------------------|-----------------------------------------------------------|
      | `MaxSessions`           | nombre maximum de sessions simultanées                    |
      | `KillDisconnected`      | fermer les sessions déconnectées                          |
      | `DisconnectedTimeLimit` | délai (secondes) avant de fermer une session déconnectée  |
      | `IdleTimeLimit`         | délai d'inactivité avant déconnexion                      |

      Une session « déconnectée » continue de tourner (programmes ouverts) : l'utilisateur peut la
      retrouver. C'est confortable, mais sur un serveur partagé, la mémoire s'épuise. Windows RDS propose les
      mêmes réglages par stratégie de groupe.
    description: |
      Des commerciaux ferment la fenêtre RDP sans se déconnecter : leurs sessions restent ouvertes et
      consomment de la mémoire. Dans la section `[Sessions]` de `/etc/xrdp/sesman.ini` :
      - `MaxSessions=10` (sessions simultanées maximum sur le serveur) ;
      - `KillDisconnected=true` et `DisconnectedTimeLimit=3600` : une session déconnectée est fermée au bout
        d'une heure.

      Redémarre ensuite `xrdp-sesman` pour appliquer.
    hint: "sed -i 's/^MaxSessions=.*/MaxSessions=10/' /etc/xrdp/sesman.ini (idem pour les deux autres clés)"
    checks:
      - desc: MaxSessions=10, KillDisconnected activé, délai 3600 s
        run: |
          ssh bureau cat /etc/xrdp/sesman.ini > /tmp/sesman2.ini
          grep -Eq '^MaxSessions *= *10 *$' /tmp/sesman2.ini && grep -Eq '^KillDisconnected *= *(true|yes|1) *$' /tmp/sesman2.ini &&
          grep -Eq '^DisconnectedTimeLimit *= *3600 *$' /tmp/sesman2.ini
      - desc: xrdp-sesman tourne
        run: ssh bureau 'pgrep -x xrdp-sesman >/dev/null'

  - id: vnc-xstartup
    title: Bureau XFCE dans la session VNC
    cours: |
      `vncserver` exécute le script `~/.vnc/xstartup` de l'utilisateur pour peupler l'écran virtuel. S'il
      n'existe pas, un script par défaut est utilisé, souvent inadapté.

      Le script est un shell script ordinaire : `#!/bin/sh` en première ligne, puis la commande de session.
      `exec` remplace le shell par le programme : quand la session se termine, le serveur VNC le sait.
      Retirer la variable `SESSION_MANAGER` évite des conflits avec une autre session.

      Il doit être **exécutable** et appartenir à l'utilisateur. `vncserver -kill :1` arrête l'affichage.
    description: |
      Sans configuration, la session VNC de `support` affiche un écran vide ou un bureau minimal. Crée pour
      lui le script `~/.vnc/xstartup` (exécutable, appartenant à `support`) qui lance XFCE avec
      `exec startxfce4`, puis redémarre son serveur VNC (`vncserver -kill :1` puis relance comme à
      l'exercice VNC).
    hint: "printf '#!/bin/sh\\nunset SESSION_MANAGER\\nexec startxfce4\\n' > /home/support/.vnc/xstartup ; chmod 755 ; chown support:"
    checks:
      - desc: ~/.vnc/xstartup de support est exécutable et lance XFCE
        run: ssh bureau 'f=/home/support/.vnc/xstartup; test -x $f && grep -q "startxfce4" $f && test "$(stat -c %U $f)" = support'
      - desc: Le serveur VNC de support tourne toujours
        run: ssh bureau 'pgrep -u support -f "Xtigervnc|Xvnc" >/dev/null'

  - id: rdp-dossier-commercial
    title: Dossier partagé des commerciaux
    cours: |
      Un dossier partagé entre membres d'un groupe se construit toujours de la même façon : propriétaire
      `root`, groupe du service, droits `2770` (le setgid fait hériter le groupe aux nouveaux fichiers).

      Les environnements de bureau affichent sur le bureau le contenu du dossier `~/Bureau` (ou `~/Desktop`
      selon la langue, réglé par `xdg-user-dirs`). Un **lien symbolique** (`ln -s <cible> <nom>`) y fait
      apparaître un raccourci vers le dossier partagé.

      Les dossiers créés par root dans un dossier personnel doivent être rendus à l'utilisateur (`chown`).
    description: |
      Les commerciaux veulent un dossier commun visible sur leur bureau XFCE.
      1. Crée `/srv/commercial` : propriétaire `root:tsusers`, droits `2770`.
      2. Crée dans le dossier personnel de `lgarnier` un **lien symbolique** `Bureau/Commercial` (ou
         `Desktop/Commercial`) vers `/srv/commercial` : XFCE affiche le contenu de ce dossier sur le bureau.
         Le dossier `Bureau` doit appartenir à lgarnier.
    hint: "mkdir -p /srv/commercial && chown root:tsusers /srv/commercial && chmod 2770 /srv/commercial ; mkdir -p /home/lgarnier/Bureau ; ln -s /srv/commercial /home/lgarnier/Bureau/Commercial"
    checks:
      - desc: /srv/commercial en 2770, root:tsusers
        run: test "$(ssh bureau stat -c %a:%U:%G /srv/commercial)" = 2770:root:tsusers
      - desc: Le raccourci du bureau de lgarnier pointe vers /srv/commercial
        run: |
          ssh bureau 'for d in Bureau Desktop; do l=/home/lgarnier/$d/Commercial; if test -L $l && test "$(readlink -f $l)" = /srv/commercial && test "$(stat -c %U /home/lgarnier/$d)" = lgarnier; then exit 0; fi; done; exit 1'
      - desc: lgarnier peut écrire dans le dossier, support non
        run: ssh bureau 'runuser -u lgarnier -- touch /srv/commercial/.verif && rm -f /srv/commercial/.verif && ! runuser -u support -- touch /srv/commercial/.verif2 2>/dev/null'
