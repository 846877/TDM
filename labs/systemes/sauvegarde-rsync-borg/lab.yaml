  - title: Documentation de BorgBackup
    url: https://borgbackup.readthedocs.io/
  - title: rsync(1) - toutes les options (Ubuntu 24.04)
    url: https://manpages.ubuntu.com/manpages/noble/man1/rsync.1.html
  - title: Wikipédia - Sauvegarde
    url: https://fr.wikipedia.org/wiki/Sauvegarde_(informatique)
exercises:
  - id: miroir-local
    title: Miroir local avec rsync
    cours: |
      `rsync` copie et synchronise des arborescences en ne transférant que ce qui a changé.

      - `-a` (archive) conserve droits, propriétaires, dates et liens symboliques ;
      - `--delete` supprime de la destination ce qui n'existe plus dans la source : le miroir devient exact ;
      - le `/` final de la source signifie « le contenu du dossier ».

      `diff -r <dossier1> <dossier2>` compare deux arborescences (aucune sortie = identiques). `stat -c %Y`
      affiche la date de modification en secondes, utile pour vérifier qu'elle est conservée.
    description: |
      Sur srv-fichiers, crée un miroir de `/srv/donnees/` dans `/backup/miroir/` avec rsync (mode archive :
      droits, propriétaires et dates conservés). Le miroir doit être **exact** : un fichier supprimé de la
      source doit disparaître du miroir (`--delete`).
    hint: "mkdir -p /backup/miroir && rsync -a --delete /srv/donnees/ /backup/miroir/"
    checks:
      - desc: Le miroir est identique à la source
        run: ssh srv-fichiers 'diff -r /srv/donnees /backup/miroir'
      - desc: Les dates de modification sont conservées
        run: ssh srv-fichiers 'test "$(stat -c %Y /srv/donnees/compta/bilan-2025.txt)" = "$(stat -c %Y /backup/miroir/compta/bilan-2025.txt)"'

  - id: miroir-distant
    title: Miroir distant par SSH
    cours: |
      rsync sait copier à travers SSH : une destination de la forme `utilisateur@hôte:/chemin/` suffit.

      Pour une tâche automatique (cron), la connexion doit se faire **sans mot de passe** : une clé SSH sans
      passphrase, générée pour root sur le serveur source, autorisée sur un compte **dédié** et peu privilégié
      du serveur de sauvegarde (jamais root). `ssh-copy-id` installe la clé ; `-z` compresse le transfert.

      Avec `--delete`, une erreur de chemin peut vider la destination : un `--dry-run` d'abord.

      Utilise une clé SSH dédiée à la sauvegarde, limitée dans `authorized_keys`, plutôt que la clé personnelle de l'administrateur.
    description: |
      1. Sur srv-fichiers, génère une clé SSH pour root (`/root/.ssh/id_ed25519`, sans passphrase : elle
         servira à des tâches automatiques) et autorise-la pour le compte `miroir` de srv-sauvegarde.
      2. Synchronise `/srv/donnees/` vers `miroir@srv-sauvegarde:/srv/rsync/srv-fichiers/` en mode archive,
         compressé, avec `--delete`.
    hint: "ssh-keygen -t ed25519 -N '' -f /root/.ssh/id_ed25519 ; ssh-copy-id miroir@srv-sauvegarde ; rsync -az --delete /srv/donnees/ miroir@srv-sauvegarde:/srv/rsync/srv-fichiers/"
    checks:
      - desc: root de srv-fichiers se connecte par clé au compte miroir
        run: ssh srv-fichiers 'ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new miroir@srv-sauvegarde true'
      - desc: Le miroir distant contient les données
        run: ssh srv-sauvegarde 'grep -q "RH-2023-117" /srv/rsync/srv-fichiers/rh/contrats/contrat-dupont.txt && test -f /srv/rsync/srv-fichiers/compta/bilan-2025.txt'

  - id: depot-borg
    title: Dépôt Borg chiffré et clé restreinte
    cours: |
      Un dépôt Borg est un dossier contenant des blocs chiffrés et dédupliqués. On l'initialise une fois avec
      `borg init` en choisissant un mode de chiffrement : `repokey` stocke la clé (protégée par la phrase de
      passe) dans le dépôt lui-même.

      Côté serveur, la ligne d'`authorized_keys` du compte borg peut **imposer** une commande : avec
      `command="borg serve --restrict-to-path <dossier>"`, la clé ne sert qu'à parler à Borg, dans ce seul
      dossier, et `restrict` interdit le reste (tunnels, terminal).

      `borg key export` produit une copie de la clé à conserver hors du serveur.
    description: |
      1. Autorise la clé de root (srv-fichiers) pour le compte `borg` de srv-sauvegarde, **restreinte** à
         Borg : dans `/home/borg/.ssh/authorized_keys`, préfixe la clé par
         `command="borg serve --restrict-to-path /srv/borg",restrict`. Même volée, cette clé ne donnera
         jamais de shell.
      2. Depuis srv-fichiers, initialise le dépôt `ssh://borg@srv-sauvegarde/srv/borg/srv-fichiers`
         chiffré en mode `repokey` avec la phrase de passe `Sauvegarde2024!`.
      3. Exporte la clé du dépôt dans `/root/cle-borg.txt` (`borg key export`) : sans elle et la phrase de
         passe, les sauvegardes sont illisibles.
    hint: "export BORG_PASSPHRASE='Sauvegarde2024!' ; borg init --encryption=repokey ssh://borg@srv-sauvegarde/srv/borg/srv-fichiers ; borg key export ssh://borg@srv-sauvegarde/srv/borg/srv-fichiers /root/cle-borg.txt"
    checks:
      - desc: La clé du compte borg est restreinte à borg serve
        run: ssh srv-sauvegarde 'grep -q "command=\"borg serve --restrict-to-path /srv/borg\"" /home/borg/.ssh/authorized_keys'
      - desc: Cette clé ne donne pas de shell
        run: "! ssh srv-fichiers 'ssh -o BatchMode=yes borg@srv-sauvegarde cat /etc/hostname' 2>/dev/null | grep -q srv-sauvegarde"
      - desc: Le dépôt est chiffré (repokey) et accessible avec la phrase de passe
        run: |
          ssh srv-fichiers 'export BORG_PASSPHRASE="Sauvegarde2024!" BORG_RSH="ssh -o BatchMode=yes"; borg info ssh://borg@srv-sauvegarde/srv/borg/srv-fichiers' | grep -qi 'Encrypted: Yes'
      - desc: La clé du dépôt est exportée
        run: ssh srv-fichiers 'grep -q "BORG_KEY" /root/cle-borg.txt'

  - id: premiere-archive
    title: Première sauvegarde avec exclusions
    cours: |
      `borg create` prend un nom d'archive (après `::`) et des chemins à sauvegarder :

      - `{now:%Y-%m-%d_%H%M}` est remplacé par la date et l'heure : chaque archive a un nom unique ;
      - `--compression zstd` (rapide et efficace) ou `lz4`, `zlib`, `lzma` ;
      - `--exclude '<motif>'` écarte des fichiers (motif entre guillemets pour que le shell ne l'interprète
        pas) ; plusieurs `--exclude` sont possibles ;
      - `--stats` affiche la taille originale, compressée et dédupliquée.

      Avec `BORG_REPO` exporté, `::nom` suffit à désigner l'archive.
    description: |
      Crée une archive nommée `srv-fichiers-{now:%Y-%m-%d_%H%M}` de `/srv/donnees`, **compressée en zstd**,
      en **excluant** les fichiers temporaires `*.tmp` et le dossier `/srv/donnees/cache` (inutiles et
      volumineux). Affiche les statistiques (`--stats`).
    hint: "borg create --stats --compression zstd --exclude '*.tmp' --exclude /srv/donnees/cache ::srv-fichiers-{now:%Y-%m-%d_%H%M} /srv/donnees"
    checks:
      - desc: Au moins une archive srv-fichiers-* existe
        run: |
          ssh srv-fichiers 'export BORG_PASSPHRASE="Sauvegarde2024!" BORG_RSH="ssh -o BatchMode=yes"; borg list --short ssh://borg@srv-sauvegarde/srv/borg/srv-fichiers' | grep -q '^srv-fichiers-'
      - desc: La dernière archive contient les contrats mais ni .tmp ni cache
        run: |
          ssh srv-fichiers 'export BORG_PASSPHRASE="Sauvegarde2024!" BORG_RSH="ssh -o BatchMode=yes"; R=ssh://borg@srv-sauvegarde/srv/borg/srv-fichiers; a=$(borg list --short --last 1 $R); borg list --short "$R::$a"' > /tmp/contenu.txt
          grep -q 'srv/donnees/rh/contrats/contrat-dupont.txt' /tmp/contenu.txt && ! grep -q '\.tmp$' /tmp/contenu.txt && ! grep -q 'srv/donnees/cache/' /tmp/contenu.txt

  - id: script-retention
    title: Script de sauvegarde avec rétention
    cours: |
      Une sauvegarde automatique a besoin d'une **rétention**, sinon le dépôt grossit sans fin.

      - `borg prune` supprime les archives qui ne correspondent à aucune règle `--keep-daily`,
        `--keep-weekly`, `--keep-monthly`... (une archive par jour, semaine, mois) ;
      - `--glob-archives '<motif>'` limite la rétention aux archives d'un même préfixe ;
      - depuis Borg 1.2, l'espace n'est réellement libéré qu'après `borg compact`.

      Le script contient la phrase de passe : seul root doit pouvoir le lire (`chmod 700`). `set -e` évite de
      lancer prune si la sauvegarde a échoué.
    description: |
      Écris `/usr/local/bin/sauvegarde-borg.sh` (exécutable) sur srv-fichiers qui :
      1. définit `BORG_REPO` et `BORG_PASSPHRASE` (fichier lisible par root seul : droits `700`) ;
      2. crée une archive comme à l'exercice précédent ;
      3. applique la rétention `borg prune` : **7** journalières, **4** hebdomadaires, **6** mensuelles
         (`--glob-archives 'srv-fichiers-*'`) ;
      4. libère l'espace avec `borg compact`.
    hint: "borg prune --list --glob-archives 'srv-fichiers-*' --keep-daily 7 --keep-weekly 4 --keep-monthly 6 ; borg compact"
    checks:
      - desc: Le script est en 700
        run: test "$(ssh srv-fichiers stat -c %a /usr/local/bin/sauvegarde-borg.sh)" = 700
      - desc: Le script contient la rétention 7/4/6
        run: |
          ssh srv-fichiers cat /usr/local/bin/sauvegarde-borg.sh > /tmp/script.sh
          grep -q 'keep-daily[ =]7' /tmp/script.sh && grep -q 'keep-weekly[ =]4' /tmp/script.sh && grep -q 'keep-monthly[ =]6' /tmp/script.sh && grep -q 'compact' /tmp/script.sh
      - desc: Le script s'exécute sans erreur
        timeout: 120
        run: ssh srv-fichiers '/usr/local/bin/sauvegarde-borg.sh >/tmp/borg-run.log 2>&1'

  - id: restauration
    title: Restaurer un fichier supprimé
    cours: |
      `borg extract` recrée les fichiers **dans le dossier courant**, avec leur chemin enregistré sans le `/`
      initial. Pour restaurer à l'emplacement d'origine, on se place donc dans `/` ; pour restaurer à côté
      (et comparer avant d'écraser), dans un dossier de travail.

      - `borg list --short --last 1` donne le nom de la dernière archive ;
      - un chemin donné à `extract` limite la restauration à ce fichier ou dossier ;
      - `--dry-run` montre ce qui serait restauré.

      Vérifie toujours le contenu, le propriétaire et les droits du fichier restauré.
    description: |
      Ticket urgent : le contrat de Marie Dupont a été supprimé par erreur. Simule l'incident en supprimant
      `/srv/donnees/rh/contrats/contrat-dupont.txt` sur srv-fichiers, puis **restaure-le à son
      emplacement** depuis la dernière archive Borg (`borg extract` s'exécute dans le dossier courant et
      recrée le chemin sans le `/` initial : place-toi dans `/`).

      Vérifie le contenu et les droits du fichier restauré.
    hint: "cd / && borg extract ::<archive> srv/donnees/rh/contrats/contrat-dupont.txt"
    checks:
      - desc: Le contrat est restauré avec son contenu d'origine
        run: ssh srv-fichiers 'grep -qx "Contrat de travail - Dupont Marie - CDI - reference RH-2023-117" /srv/donnees/rh/contrats/contrat-dupont.txt'
      - desc: Le fichier n'a pas été restauré ailleurs par erreur
        run: "! ssh srv-fichiers 'test -e /root/srv/donnees/rh/contrats/contrat-dupont.txt'"

  - id: integrite-planification
    title: Contrôle d'intégrité et planification
    cours: |
      `borg check` vérifie la cohérence du dépôt (et, avec `--verify-data`, relit et déchiffre tous les blocs,
      plus long). `> fichier 2>&1` enregistre la sortie standard **et** les erreurs.

      Dans une crontab, chaque ligne a 5 champs de date puis la commande : minute, heure, jour du mois, mois,
      jour de la semaine. Les chemins doivent être absolus et les variables d'environnement nécessaires
      définies dans le script (cron fournit un environnement minimal).

      Fais tourner le script une première fois à la main avec la même commande que cron, puis vérifie le journal produit.
    description: |
      1. Vérifie l'intégrité du dépôt (`borg check`) et enregistre la sortie dans `/root/borg-check.log`.
      2. Planifie dans la crontab de root (srv-fichiers) : `sauvegarde-borg.sh` tous les jours à **1 h 00**
         et le miroir rsync distant tous les jours à **12 h 30**.
    hint: "borg check -v ... > /root/borg-check.log 2>&1 ; crontab -e  →  0 1 * * * /usr/local/bin/sauvegarde-borg.sh  et  30 12 * * * rsync -az --delete /srv/donnees/ miroir@srv-sauvegarde:/srv/rsync/srv-fichiers/"
    checks:
      - desc: borg check a été exécuté sans erreur
        run: ssh srv-fichiers 'test -s /root/borg-check.log && grep -qi "repository.*check\|archive.*check\|finished\|complete" /root/borg-check.log && ! grep -qi "error" /root/borg-check.log'
      - desc: Sauvegarde Borg planifiée à 1 h 00
        run: ssh srv-fichiers 'crontab -l' | grep -Eq '^ *0 +0?1 +\* +\* +\* +.*sauvegarde-borg\.sh'
      - desc: Miroir rsync planifié à 12 h 30
        run: ssh srv-fichiers 'crontab -l' | grep -Eq '^ *30 +12 +\* +\* +\* +.*rsync'

  - id: tar-incrementale
    title: Sauvegarde complète et incrémentale avec tar
    cours: |
      Avec `--listed-incremental=<fichier>`, tar tient un **fichier d'état** (« snapshot ») qui mémorise ce
      qui a été sauvegardé :

      - s'il n'existe pas, tar fait une sauvegarde **complète** (niveau 0) et le crée ;
      - s'il existe, tar ne sauvegarde que les fichiers nouveaux ou modifiés depuis, et met l'état à jour.

      Les dossiers apparaissent toujours dans l'archive incrémentale (tar y enregistre la liste de leur
      contenu, ce qui permet aussi de rejouer les suppressions à la restauration). Pour restaurer : la
      complète, puis chaque incrémentale dans l'ordre, avec `--listed-incremental=/dev/null`.
    description: |
      Sur un petit serveur sans Borg, on fait encore des sauvegardes **complètes** puis **incrémentales**
      avec tar. Sur srv-fichiers, dans `/backup/tar/` :
      1. crée la sauvegarde complète `complete.tar.gz` de `/srv/donnees`, avec le fichier d'état
         `/backup/tar/etat.snar` (`--listed-incremental`) ;
      2. crée ensuite le fichier `/srv/donnees/commun/compte-rendu.txt` (contenu libre) ;
      3. crée la sauvegarde incrémentale `incr1.tar.gz` avec le **même** fichier d'état : elle ne doit
         contenir que ce qui a changé.

      Compare `tar -tzf` des deux archives.
    hint: "mkdir -p /backup/tar ; tar -czf /backup/tar/complete.tar.gz --listed-incremental=/backup/tar/etat.snar /srv/donnees ; echo CR > /srv/donnees/commun/compte-rendu.txt ; tar -czf /backup/tar/incr1.tar.gz --listed-incremental=/backup/tar/etat.snar /srv/donnees"
    checks:
      - desc: La sauvegarde complète contient les contrats
        run: ssh srv-fichiers 'tar -tzf /backup/tar/complete.tar.gz' | grep -q 'srv/donnees/rh/contrats/contrat-martin.txt'
      - desc: L'incrémentale contient le nouveau fichier mais pas les fichiers inchangés
        run: |
          ssh srv-fichiers 'tar -tzf /backup/tar/incr1.tar.gz' > /tmp/incr1.txt
          grep -q 'srv/donnees/commun/compte-rendu.txt' /tmp/incr1.txt && ! grep -q 'contrat-martin.txt' /tmp/incr1.txt
      - desc: Le fichier d'état existe
        run: ssh srv-fichiers 'test -s /backup/tar/etat.snar'

  - id: rsync-instantanes
    title: Instantanés rsync avec liens physiques
    cours: |
      Un **lien physique** est un second nom pour le même fichier (même inode) : il ne prend pas de place
      supplémentaire.

      Avec `--link-dest=<dossier de la veille>`, rsync compare chaque fichier à celui de la veille : s'il est
      identique, il crée un lien physique au lieu de copier ; sinon, il copie la nouvelle version. Chaque
      instantané est un dossier complet, navigable et restaurable par simple copie, mais seuls les fichiers
      modifiés consomment de l'espace.

      `stat -c %i` ou `ls -li` affiche les inodes ; `du -sh` sur les deux dossiers ensemble montre le gain.
    description: |
      Technique très répandue (Time Machine, rsnapshot) : chaque jour, un dossier complet, mais les fichiers
      **inchangés** ne sont pas recopiés, ce sont des **liens physiques** vers la veille (`--link-dest`).

      Sur srv-fichiers :
      1. `rsync -a /srv/donnees/ /backup/instantanes/jour1/` ;
      2. modifie `/srv/donnees/commun/planning.txt` (ajoute une ligne) ;
      3. crée `/backup/instantanes/jour2/` avec `--link-dest=/backup/instantanes/jour1`.

      Dans jour2, le bilan (inchangé) doit avoir le **même inode** que dans jour1, et le planning (modifié)
      un inode différent. Vérifie avec `ls -li` et `du -sh /backup/instantanes/*`.
    hint: "rsync -a --link-dest=/backup/instantanes/jour1 /srv/donnees/ /backup/instantanes/jour2/"
    checks:
      - desc: jour1 et jour2 sont des copies complètes
        run: ssh srv-fichiers 'test -f /backup/instantanes/jour1/compta/bilan-2025.txt && test -f /backup/instantanes/jour2/compta/bilan-2025.txt'
      - desc: Le fichier inchangé est un lien physique vers la veille
        run: |
          ssh srv-fichiers 'test "$(stat -c %i /backup/instantanes/jour1/compta/bilan-2025.txt)" = "$(stat -c %i /backup/instantanes/jour2/compta/bilan-2025.txt)"'
      - desc: Le fichier modifié est une nouvelle copie, à jour
        run: |
          ssh srv-fichiers 'test "$(stat -c %i /backup/instantanes/jour1/commun/planning.txt)" != "$(stat -c %i /backup/instantanes/jour2/commun/planning.txt)" && cmp -s /srv/donnees/commun/planning.txt /backup/instantanes/jour2/commun/planning.txt'

  - id: borg-ancienne-version
    title: Récupérer une ancienne version
    cours: |
      Chaque archive Borg est une photo complète à une date : on peut donc récupérer n'importe quelle version
      conservée par la rétention.

      - `borg list` affiche les archives avec leur date de création ;
      - `borg diff ::<archive1> <archive2>` liste les fichiers ajoutés, supprimés ou modifiés entre deux
        archives ;
      - `borg extract` dans un **dossier de travail** restaure sans écraser le fichier actuel, pour que
        l'utilisateur compare et choisisse ;
      - `borg extract --stdout` envoie un fichier sur la sortie standard.

      C'est le cas le plus fréquent en support : « j'ai écrasé mon fichier hier ».
    description: |
      Un utilisateur a écrasé le contenu de `/srv/donnees/compta/factures-octobre.csv` et veut **comparer**
      avec la version d'origine, sans perdre la nouvelle.
      1. Simule l'incident : remplace le contenu du fichier par `fichier ecrase par erreur`, puis crée une
         nouvelle archive Borg (comme le ferait la sauvegarde de la nuit).
      2. Avec `borg list`, repère une archive **antérieure** à la modification, puis extrais-en le fichier
         dans `/root/restau/` (pas à son emplacement d'origine).

      `borg diff ::archive1 archive2` montre ce qui a changé entre deux archives.
    hint: "mkdir -p /root/restau && cd /root/restau && borg extract ::<archive-ancienne> srv/donnees/compta/factures-octobre.csv"
    checks:
      - desc: La version d'origine est restaurée dans /root/restau
        run: ssh srv-fichiers 'grep -qx "Factures fournisseurs octobre" /root/restau/srv/donnees/compta/factures-octobre.csv'
      - desc: Le fichier en production garde la nouvelle version
        run: ssh srv-fichiers 'grep -qx "fichier ecrase par erreur" /srv/donnees/compta/factures-octobre.csv'
      - desc: Une archive postérieure à la modification existe
        run: |
          ssh srv-fichiers 'export BORG_PASSPHRASE="Sauvegarde2024!" BORG_RSH="ssh -o BatchMode=yes"; R=ssh://borg@srv-sauvegarde/srv/borg/srv-fichiers; a=$(borg list --short --last 1 $R); cd /tmp && borg extract --stdout "$R::$a" srv/donnees/compta/factures-octobre.csv' | grep -qx 'fichier ecrase par erreur'
