title: Sauvegarde et restauration (rsync, BorgBackup)
level: intermediaire
order: 7
tags: [sauvegarde, restauration, rsync, borg, cron, pra]
summary: Miroir rsync local et distant, dépôt Borg chiffré via SSH à clé restreinte, exclusions, rétention, contrôle d'intégrité, restauration et planification.
compose: docker-compose.yml
service: admin
shell: bash
workdir: /root
description: |
  **Contexte.** Le serveur de fichiers d'*Ateliers Durand* n'est sauvegardé que par une copie manuelle sur
  disque USB. Tu mets en place une vraie politique : un **miroir rsync** pour reprendre vite, et des
  sauvegardes **versionnées, dédupliquées et chiffrées** avec **BorgBackup** sur un serveur dédié, avec
  une rétention et un test de restauration (une sauvegarde jamais restaurée n'est pas une sauvegarde).

  **Machines** (depuis admin : `ssh srv-fichiers`, `ssh srv-sauvegarde`, en root par clé) :

  | Machine          | Rôle                                              | Comptes                         |
  |------------------|---------------------------------------------------|---------------------------------|
  | `srv-fichiers`   | données dans `/srv/donnees`                       | root                            |
  | `srv-sauvegarde` | `/srv/rsync` (miroir) et `/srv/borg` (dépôts Borg) | `miroir` / `Miroir2024!`, `borg` / `Borg2024!` |

  Toutes les commandes de sauvegarde se lancent **depuis srv-fichiers** (en root).

  - Dépôt Borg : `ssh://borg@srv-sauvegarde/srv/borg/srv-fichiers`
  - Phrase de passe du dépôt : `Sauvegarde2024!` (dans la vraie vie : dans un coffre-fort de mots de passe
    **et** imprimée dans le classeur du PRA, avec la clé exportée par `borg key export`).
  - Astuce : `export BORG_REPO=ssh://borg@srv-sauvegarde/srv/borg/srv-fichiers BORG_PASSPHRASE='Sauvegarde2024!'`
cours: |
  ## Les questions avant les outils

  Une politique de sauvegarde répond d'abord à deux questions métier :

  - **RPO** (*Recovery Point Objective*) : combien de données peut-on perdre ? Une sauvegarde par nuit =
    jusqu'à 24 h de travail perdu.
  - **RTO** (*Recovery Time Objective*) : combien de temps peut-on rester arrêté ? Restaurer 2 To depuis
    un stockage distant peut prendre une journée.

  ## La règle 3-2-1

  ```
  3 copies des données       (production + 2 sauvegardes)
  2 supports différents      (disque local, serveur de sauvegarde, bande, cloud)
  1 copie hors site          (et idéalement 1 copie hors ligne ou immuable, contre les rançongiciels)
  ```

  Un miroir n'est **pas** une sauvegarde : une suppression ou un chiffrement par rançongiciel est répliqué
  dans la minute. Il faut des **versions** (historique) et une **rétention**.

  ## Types de sauvegardes

  | Type             | Contenu                                    | Restauration                        |
  |------------------|--------------------------------------------|-------------------------------------|
  | complète         | tout                                       | une seule archive                   |
  | incrémentale     | ce qui a changé depuis la **dernière** sauvegarde | complète + toutes les incrémentales |
  | différentielle   | ce qui a changé depuis la dernière **complète** | complète + dernière différentielle |
  | déduplication (Borg, Restic, Veeam) | blocs jamais vus | chaque archive paraît complète, seuls les nouveaux blocs sont stockés |

  ## rsync

  | Option             | Effet                                                         |
  |--------------------|---------------------------------------------------------------|
  | `-a`               | archive : récursif, droits, propriétaires, dates, liens       |
  | `-z`               | compression pendant le transfert                              |
  | `--delete`         | miroir exact (supprime ce qui a disparu de la source)          |
  | `-n` / `--dry-run` | simulation                                                    |
  | `-AX`              | ACL et attributs étendus                                      |
  | `--link-dest=DIR`  | fichiers inchangés = liens physiques vers DIR (instantanés)   |

  ## BorgBackup

  Borg découpe les fichiers en blocs, les **déduplique**, les **compresse** et les **chiffre** côté client
  avant de les envoyer : le serveur de sauvegarde ne voit jamais les données en clair.

  ```
  srv-fichiers ──SSH (clé restreinte à "borg serve")──▶ srv-sauvegarde:/srv/borg/srv-fichiers
     borg create ::srv-fichiers-2026-10-18_0100 /srv/donnees      (dépôt chiffré, repokey)
  ```

  | Besoin                     | Commande                                                      |
  |----------------------------|---------------------------------------------------------------|
  | Créer le dépôt             | `borg init --encryption=repokey ssh://borg@srv/srv/borg/x`    |
  | Sauvegarder                | `borg create --stats --compression zstd ::nom-{now} /srv`     |
  | Lister archives / contenu  | `borg list`, `borg list ::archive`                            |
  | Restaurer                  | `cd / && borg extract ::archive chemin/relatif`               |
  | Comparer deux archives     | `borg diff ::a1 a2`                                           |
  | Rétention                  | `borg prune --keep-daily 7 --keep-weekly 4 --keep-monthly 6`  |
  | Libérer l'espace           | `borg compact`                                                |
  | Vérifier                   | `borg check`                                                  |
  | Exporter la clé            | `borg key export` (à imprimer et ranger avec le PRA)          |

  Les variables `BORG_REPO`, `BORG_PASSPHRASE` et `BORG_RSH` évitent de tout répéter. Sans la clé **et**
  la phrase de passe, un dépôt `repokey` est définitivement illisible.

  ## tar en incrémental

  ```bash
  tar -czf complete.tar.gz --listed-incremental=etat.snar /srv/donnees    # niveau 0
  tar -czf incr1.tar.gz    --listed-incremental=etat.snar /srv/donnees    # seulement les changements
  ```

  ## Pièges courants

  - Sauvegarde jamais **restaurée** : on découvre le jour J que l'archive est vide ou illisible.
  - Phrase de passe ou clé de chiffrement perdue : sauvegarde inutilisable.
  - Serveur de sauvegarde accessible en écriture/suppression depuis le serveur sauvegardé : un attaquant
    efface tout. D'où la clé restreinte, le mode `append-only` et les copies hors ligne.
  - Bases de données copiées « à chaud » fichier par fichier : incohérentes. On sauvegarde un **dump**
    (`mysqldump`, `pg_dump`) ou on utilise les outils dédiés.
  - Oublier les **droits et ACL** : la restauration rend les fichiers inaccessibles ou trop ouverts.

  ## Bonnes pratiques en entreprise

  - Politique écrite : quoi, quand, rétention, où, qui vérifie ; journal et alerte sur chaque échec.
  - Test de restauration **planifié** (un fichier par mois, un serveur complet par an) et documenté.
  - Le PRA contient la procédure de restauration, les clés, et l'ordre de redémarrage des services.
