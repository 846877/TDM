title: Bastion SSH, durcissement et tunnels
level: intermediaire
order: 4
tags: [ssh, bastion, proxyjump, durcissement, tunnel, socks, sécurité]
summary: Durcir sshd sur un bastion, rebondir avec ProxyJump, tunnels local, dynamique (SOCKS) et inverse, clé restreinte.
compose: docker-compose.yml
service: admin
shell: bash
workdir: /root
description: |
  **Contexte.** Suite à un audit, *Ateliers Durand* isole ses serveurs dans un réseau **interne** que le
  réseau bureautique ne peut plus joindre directement. Le seul point d'entrée est un **bastion** SSH, qui
  doit être durci. Tu dois ensuite continuer à travailler sur les serveurs internes à travers lui.

  **Topologie.**

  ```
   bureau 10.50.1.0/24              interne 10.50.2.0/24
   admin 10.50.1.10 ── bastion ──┬── srv-interne 10.50.2.10 (intranet web)
                    .1.2    .2.2 └── srv-bdd     10.50.2.20 (console sur 127.0.0.1:8080)
  ```

  Compte `tech` / `Tech2024!` sur bastion, srv-interne et srv-bdd. Sur le **bastion**, `tech` a `sudo` sans
  mot de passe. Ton terminal est `root` sur admin, qui ne voit **pas** le réseau interne.

  ⚠️ Sur le bastion, sshd tourne en arrière-plan : avant chaque rechargement
  (`sudo kill -HUP $(cat /run/sshd.pid)`), **teste la configuration** avec `sudo sshd -t`. Une erreur
  arrêterait sshd et te couperait l'accès (il faudrait réinitialiser le lab) : c'est exactement ce qui
  arrive en production.
cours: |
  ## Le bastion : un seul point d'entrée

  Un **bastion** (ou *jump host*) est un serveur durci, seul autorisé à joindre le réseau d'administration.
  Les administrateurs s'y authentifient puis rebondissent vers les serveurs internes. Avantages : une seule
  porte à surveiller, des journaux centralisés de qui se connecte, et des serveurs internes invisibles
  depuis le réseau bureautique.

  ```
   admin ──ssh──▶ bastion ──ssh──▶ srv-interne
   (bureau)       (2 cartes)        (réseau interne, aucun accès direct)
  ```

  ## Durcir sshd

  | Directive                        | Valeur conseillée | Effet                                    |
  |----------------------------------|-------------------|------------------------------------------|
  | `PermitRootLogin`                | `no`              | root passe par un compte nominatif + sudo |
  | `PasswordAuthentication`         | `no`              | clés uniquement, force brute inutile     |
  | `KbdInteractiveAuthentication`   | `no`              | ferme l'autre voie « mot de passe »       |
  | `AllowUsers` / `AllowGroups`     | liste blanche     | comptes autorisés                        |
  | `MaxAuthTries`                   | `3`               | essais par connexion                     |
  | `LoginGraceTime`                 | `30`              | délai pour s'authentifier                |
  | `LogLevel`                       | `VERBOSE`         | journalise l'empreinte de la clé utilisée |
  | `Banner`                         | `/etc/issue.net`  | avertissement légal                      |

  Méthode sûre, à suivre **à chaque fois** :

  1. écrire dans `/etc/ssh/sshd_config.d/xx-nom.conf` (n'altère pas le fichier livré par le paquet) ;
  2. `sshd -t` : test de syntaxe ;
  3. recharger (`systemctl reload ssh`, ou `kill -HUP` sur le PID de sshd) : les sessions ouvertes restent ;
  4. tester une **nouvelle** connexion depuis un autre terminal avant de fermer la session de secours ;
  5. `sshd -T` affiche la configuration effective (toutes directives, en minuscules).

  ## Rebondir : ProxyJump

  ```
  # ~/.ssh/config
  Host bastion
      HostName 10.50.1.2
      User tech
  Host interne
      HostName srv-interne
      User tech
      ProxyJump bastion
  ```

  Avec `ProxyJump` (ou `ssh -J bastion srv-interne`), le client ouvre d'abord une connexion au bastion, puis
  une seconde connexion SSH **chiffrée de bout en bout** jusqu'au serveur interne, à travers la première. La
  clé privée reste sur le poste : rien n'est déposé sur le bastion (contrairement à l'*agent forwarding*,
  `-A`, à éviter).

  ## Les trois tunnels

  ```
  -L local     admin:9080 ──▶ (via bdd) ──▶ 127.0.0.1:8080 de srv-bdd
               « amène chez moi un service distant »
  -D dynamique admin:1080 = proxy SOCKS : chaque connexion est relayée par le serveur SSH
               « navigue comme si j'étais sur le bastion »
  -R inverse   bastion:9022 ──▶ (via srv-interne) ──▶ srv-interne:22
               « expose un service de chez moi sur le serveur distant »
  ```

  | Option | Syntaxe                                     | Exemple                                  |
  |--------|---------------------------------------------|------------------------------------------|
  | `-L`   | `port_local:hôte_cible:port_cible`           | `ssh -L 9080:127.0.0.1:8080 bdd`         |
  | `-D`   | `port_local`                                 | `ssh -D 1080 bastion`                    |
  | `-R`   | `port_distant:hôte_cible:port_cible`         | `ssh -R 9022:127.0.0.1:22 bastion`       |
  | `-f -N`| arrière-plan, sans commande                  | `ssh -f -N -L ...`                       |

  L'hôte cible est résolu **depuis le serveur SSH** : `127.0.0.1` dans un `-L` désigne le serveur distant
  lui-même, pas ton poste.

  ## Pièges courants

  - Recharger sshd avec une configuration invalide : le démon s'arrête et plus personne n'entre. Toujours
    `sshd -t` avant.
  - Désactiver les mots de passe avant d'avoir vérifié que la clé fonctionne.
  - `AllowTcpForwarding no` sur un bastion casse ProxyJump et les tunnels.
  - Un tunnel inverse ouvert par un utilisateur peut contourner la politique de pare-feu : sur les serveurs
    sensibles, on interdit `-R` (`AllowStreamLocalForwarding`, `PermitListen`).

  ## Bonnes pratiques en entreprise

  - Bastion dédié, mis à jour, avec journaux envoyés vers un serveur central ; idéalement authentification
    à deux facteurs.
  - Clés nominatives, inventoriées et révoquées au départ des personnes ; clés de service restreintes
    (`command=`, `from=`, `restrict`).
  - Des solutions dédiées (Teleport, Apache Guacamole, bastions commerciaux) ajoutent l'enregistrement
    des sessions et la gestion des accès temporaires.
