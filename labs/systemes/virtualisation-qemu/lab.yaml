    url: https://www.qemu.org/docs/master/
  - title: qemu-img(1) - gestion des images disque (Ubuntu 24.04)
    url: https://manpages.ubuntu.com/manpages/noble/man1/qemu-img.1.html
  - title: Wikipédia - Hyperviseur
    url: https://fr.wikipedia.org/wiki/Hyperviseur
exercises:
  - id: qemu-inspecter-image
    title: Inspecter l'image de base
    cours: |
      `qemu-img info <image>` affiche le **format** (`file format`), la **taille virtuelle** (`virtual size`,
      la taille du disque vue par la VM) et la **taille sur disque** (`disk size`, la place réellement
      occupée sur l'hôte).

      Avec un format à allocation dynamique comme qcow2, la taille sur disque est bien plus petite que la
      taille virtuelle : seuls les blocs écrits occupent de la place. `ls -lh` montre la taille du fichier.

      Pour convertir des octets en Mio : diviser par 1024 deux fois (`qemu-img info` indique souvent la valeur
      exacte en octets entre parenthèses).
    description: |
      Avant tout, examine l'image fournie avec `qemu-img info`. Quel est son **format** ? Quelle est
      sa **taille virtuelle** (taille du disque vu par la VM), à comparer avec la place réellement
      occupée sur l'hôte (`ls -lh`) ?

      Réponses : `format=` (en minuscules) et `taille_mio=` (taille virtuelle en Mio, nombre entier).
    hint: "qemu-img info /srv/images/cirros-0.6.2-x86_64-disk.img  (ligne virtual size)"
    checks:
      - desc: Format de l'image
        run: grep -Eqi '^format *= *qcow2 *$' /root/reponses.txt
      - desc: Taille virtuelle en Mio
        run: grep -Eq '^taille_mio *= *112 *$' /root/reponses.txt

  - id: qemu-overlay-vm1
    title: Disque système de vm1 en overlay
    cours: |
      `qemu-img create -f qcow2` crée un disque qcow2. Avec `-b <image de base>`, le nouveau disque devient
      un **overlay** : il lit les blocs non modifiés dans la base et n'écrit que dans son propre fichier.
      L'option `-F` indique le format de la base (obligatoire dans les versions récentes, par sécurité).

      `qemu-img resize <disque> <taille>` agrandit le disque virtuel ; dans la VM, il faudra ensuite agrandir
      la partition et le système de fichiers (CirrOS le fait au démarrage).

      `qemu-img info --backing-chain` affiche toute la chaîne overlay → base.
    description: |
      On ne modifie jamais l'image de base : chaque VM reçoit un **overlay** qcow2 qui n'enregistre que
      les différences. Crée `/srv/vms/vm1.qcow2`, dont le *backing file* est l'image CirrOS (format de
      l'image de base : qcow2), puis agrandis-le à **1 Gio**.

      Vérifie la chaîne avec `qemu-img info --backing-chain vm1.qcow2`.
    hint: "qemu-img create -f qcow2 -b /srv/images/cirros-0.6.2-x86_64-disk.img -F qcow2 vm1.qcow2 ; qemu-img resize vm1.qcow2 1G"
    checks:
      - desc: vm1.qcow2 est un qcow2
        run: |
          qemu-img info -U --output=json /srv/vms/vm1.qcow2 | grep -Eq '"format": *"qcow2"'
      - desc: Son backing file est l'image CirrOS
        run: qemu-img info -U --output=json /srv/vms/vm1.qcow2 | grep -q 'backing-filename.*cirros-0.6.2-x86_64-disk.img'
      - desc: Taille virtuelle de 1 Gio
        run: |
          qemu-img info -U --output=json /srv/vms/vm1.qcow2 | grep -Eq '"virtual-size": *1073741824,'

  - id: qemu-disque-donnees
    title: Disque de données
    cours: |
      Séparer **système** et **données** dans deux disques virtuels est une bonne pratique : on peut
      réinstaller ou remplacer le système sans toucher aux données, les sauvegarder différemment, ou déplacer
      le disque de données vers une autre VM.

      `qemu-img create -f qcow2 <fichier> <taille>` crée un disque vide (sans `-b`, il est autonome). Grâce à
      l'allocation à la demande, un disque de 2 Gio ne pèse que quelques centaines de Ko tant que rien n'y
      est écrit : c'est le *thin provisioning*, à surveiller car le stockage réel peut se remplir.
    description: |
      vm1 hébergera des données : crée un second disque **indépendant** (sans backing file)
      `/srv/vms/vm1-data.qcow2` de **2 Gio** au format qcow2. Constate avec `ls -lh` que le fichier
      ne pèse presque rien (allocation à la demande).
    hint: "qemu-img create -f qcow2 vm1-data.qcow2 2G"
    checks:
      - desc: vm1-data.qcow2 est un qcow2 de 2 Gio
        run: |
          qemu-img info -U --output=json /srv/vms/vm1-data.qcow2 | grep -Eq '"virtual-size": *2147483648,' && qemu-img info -U --output=json /srv/vms/vm1-data.qcow2 | grep -Eq '"format": *"qcow2"'
      - desc: Il n'a pas de backing file
        run: "! qemu-img info -U --output=json /srv/vms/vm1-data.qcow2 | grep -q backing-filename"

  - id: qemu-demarrer-vm1
    title: Démarrer vm1 en arrière-plan
    cours: |
      Une ligne de commande QEMU décrit la machine pièce par pièce :

      - `-drive file=...,if=virtio,format=qcow2` : un disque par option, dans l'ordre (`vda`, `vdb`...) ;
      - `-netdev <type>,id=<nom>` crée le côté hôte d'un réseau, `-device virtio-net-pci,netdev=<nom>` la carte
        dans la VM (`mac=` fixe son adresse MAC) ;
      - `hostfwd=tcp:<ip hôte>:<port>-:<port invité>` redirige un port de l'hôte vers la VM (mode user) ;
      - `-serial` et `-monitor` avec `unix:<chemin>,server,nowait` exposent la console et le moniteur sur des
        sockets ;
      - `-daemonize` passe en arrière-plan, `-pidfile` note le PID.

      Le démarrage en émulation prend du temps : suis-le sur la console série.
    description: |
      Démarre vm1 **en tâche de fond** (`-daemonize`, `-display none`) avec :

      - 256 Mio de RAM, accélération `tcg`, nom `vm1` ;
      - les deux disques en `virtio` (système puis données) ;
      - une carte réseau en mode *user* (NAT) qui redirige `127.0.0.1:2222` vers le port 22 de la VM ;
      - une **seconde carte** `virtio-net-pci` d'adresse MAC `52:54:00:00:01:02` reliée à un
        netdev `socket` qui **écoute** sur `127.0.0.1:4000` (elle servira à l'exercice 7) ;
      - la console série sur le socket unix `/srv/vms/vm1.console` et le moniteur sur
        `/srv/vms/vm1.monitor` (options `server,nowait`) ;
      - le PID dans `/srv/vms/vm1.pid`.

      Suis le démarrage avec `console-vm vm1` (Ctrl+C pour quitter), puis connecte-toi :
      `ssh -p 2222 cirros@127.0.0.1` (ou `ssh-vm 2222`).
    hint: |
      qemu-system-x86_64 -name vm1 -accel tcg -m 256 \
        -drive file=vm1.qcow2,if=virtio,format=qcow2 -drive file=vm1-data.qcow2,if=virtio,format=qcow2 \
        -netdev user,id=n0,hostfwd=tcp:127.0.0.1:2222-:22 -device virtio-net-pci,netdev=n0 \
        -netdev socket,id=n1,listen=127.0.0.1:4000 -device virtio-net-pci,netdev=n1,mac=52:54:00:00:01:02 \
        -serial unix:/srv/vms/vm1.console,server,nowait -monitor unix:/srv/vms/vm1.monitor,server,nowait \
        -display none -pidfile /srv/vms/vm1.pid -daemonize
    checks:
      - desc: Le processus QEMU de vm1 tourne (PID dans vm1.pid)
        run: test -s /srv/vms/vm1.pid && kill -0 "$(cat /srv/vms/vm1.pid)" && grep -q qemu /proc/"$(cat /srv/vms/vm1.pid)"/cmdline
      - desc: Les sockets console et moniteur existent
        run: test -S /srv/vms/vm1.console && test -S /srv/vms/vm1.monitor
      - desc: Le moniteur indique que la VM est en marche
        run: moniteur-vm vm1 info status | grep -q running
      - desc: La VM est joignable en SSH sur le port 2222 (attente jusqu'à 3 min)
        timeout: 200
        run: for i in $(seq 1 18); do ssh-vm 2222 true 2>/dev/null && exit 0; sleep 10; done; exit 1

  - id: qemu-disques-invites
    title: Vérifier le matériel vu par l'invité
    cours: |
      Dans la VM, plusieurs fichiers et commandes décrivent le matériel virtuel :

      - `/proc/partitions` liste les disques et partitions avec leur taille en blocs de 1 Kio ;
      - `ip -br link` liste les interfaces réseau (`lo` est l'interface de bouclage, pas une carte) ;
      - `free -m` affiche la mémoire.

      Les disques virtio s'appellent `vda`, `vdb`... dans l'ordre des options `-drive`. Côté hôte, le moniteur
      QEMU (`info block`, `info network`) donne la vision de l'hyperviseur : comparer les deux est un bon
      réflexe de dépannage.
    description: |
      Connecte-toi à vm1 et vérifie ce que voit le système invité : `cat /proc/partitions`,
      `ip link`, `free -m`. Le disque système `vda` doit faire 1 Gio et le disque de données `vdb`
      2 Gio. Côté hôte, compare avec `moniteur-vm vm1 "info block"` et `moniteur-vm vm1 "info network"`.

      Réponses : `nb_cartes=` (nombre d'interfaces réseau Ethernet de vm1, hors `lo`) et
      `disque_donnees=` (nom du périphérique du disque de données dans la VM).
    hint: "ssh-vm 2222 cat /proc/partitions ; ssh-vm 2222 ip -br link"
    checks:
      - desc: vda fait 1 Gio et vdb 2 Gio dans la VM
        run: |
          p=$(ssh-vm 2222 cat /proc/partitions) && echo "$p" | awk '$4=="vda"{a=$3} $4=="vdb"{b=$3} END{exit !(a==1048576 && b==2097152)}'
      - desc: Réponses sur le matériel
        run: grep -Eq '^nb_cartes *= *2 *$' /root/reponses.txt && grep -Eq '^disque_donnees *= *(/dev/)?vdb *$' /root/reponses.txt

  - id: qemu-snapshot
    title: Snapshot avant mise à jour
    cours: |
      Un **snapshot interne** qcow2 est stocké dans le fichier disque lui-même.

      - depuis le moniteur, `savevm <nom>` enregistre l'état complet de la VM **en marche** (disques + RAM +
        état des périphériques) ; `loadvm <nom>` y revient ; `info snapshots` les liste ;
      - hors ligne, `qemu-img snapshot -c/-l/-a/-d` crée, liste, applique ou supprime un snapshot de disque
        (`-U` permet de lire un disque utilisé par une VM en marche, sans le modifier).

      Un snapshot n'est pas une sauvegarde : il disparaît avec le disque.
    description: |
      Avant une intervention risquée, prends un **snapshot interne à chaud** de vm1 nommé
      `avant-maj` depuis le moniteur (il inclut l'état de la RAM). Crée ensuite dans la VM le fichier
      `/home/cirros/apres-snapshot` puis liste les snapshots (`info snapshots` dans le moniteur,
      `qemu-img snapshot -l -U vm1.qcow2` côté hôte).

      Pour la culture : `loadvm avant-maj` reviendrait à l'état d'avant (le fichier disparaîtrait).
      Ne le fais pas : les vérifications attendent le fichier.
    hint: "moniteur-vm vm1 savevm avant-maj ; ssh-vm 2222 touch apres-snapshot ; moniteur-vm vm1 info snapshots"
    checks:
      - desc: Le snapshot avant-maj existe dans vm1.qcow2
        run: qemu-img snapshot -l -U /srv/vms/vm1.qcow2 | grep -qw avant-maj
      - desc: Le moniteur le liste aussi
        run: moniteur-vm vm1 info snapshots | grep -qw avant-maj
      - desc: Le fichier apres-snapshot existe dans la VM
        run: ssh-vm 2222 test -f /home/cirros/apres-snapshot

  - id: qemu-reseau-entre-vm
    title: Deuxième VM et réseau privé entre VM
    cours: |
      Le backend réseau `socket` de QEMU relie directement les cartes de plusieurs VM, comme un câble :

      - une VM **écoute** (`listen=<ip>:<port>`), l'autre s'y **connecte** (`connect=<ip>:<port>`) ;
      - chaque carte doit avoir une adresse MAC différente.

      Dans les VM, la nouvelle interface (`eth1`) n'a pas d'adresse : `ip addr add <adresse>/<préfixe> dev
      eth1` et `ip link set eth1 up` (avec `sudo`). Les deux VM doivent être dans le même sous-réseau.
      En production, on utiliserait plutôt un bridge Linux (ou Open vSwitch) avec des interfaces tap.
    description: |
      Crée `/srv/vms/vm2.qcow2` (overlay de l'image CirrOS) et démarre **vm2** sur le même modèle que
      vm1, mais :

      - SSH redirigé sur `127.0.0.1:2223`, moniteur `/srv/vms/vm2.monitor`, console
        `/srv/vms/vm2.console`, PID `/srv/vms/vm2.pid`, pas de disque de données ;
      - sa seconde carte (MAC `52:54:00:00:02:02`) se **connecte** au socket `127.0.0.1:4000` de vm1.

      Dans les VM, configure la seconde interface (`eth1`) : `10.10.10.1/24` sur vm1 et
      `10.10.10.2/24` sur vm2 (`sudo ip addr add …`, `sudo ip link set eth1 up`), puis vérifie que les
      deux VM se pinguent par ce lien privé.
    hint: |
      qemu-img create -f qcow2 -b /srv/images/cirros-0.6.2-x86_64-disk.img -F qcow2 vm2.qcow2
      qemu-system-x86_64 -name vm2 -accel tcg -m 256 -drive file=vm2.qcow2,if=virtio,format=qcow2 \
        -netdev user,id=n0,hostfwd=tcp:127.0.0.1:2223-:22 -device virtio-net-pci,netdev=n0 \
        -netdev socket,id=n1,connect=127.0.0.1:4000 -device virtio-net-pci,netdev=n1,mac=52:54:00:00:02:02 \
        -serial unix:/srv/vms/vm2.console,server,nowait -monitor unix:/srv/vms/vm2.monitor,server,nowait \
        -display none -pidfile /srv/vms/vm2.pid -daemonize
      ssh-vm 2222 sudo ip addr add 10.10.10.1/24 dev eth1 ; ssh-vm 2222 sudo ip link set eth1 up   (idem sur 2223 avec .2)
    checks:
      - desc: vm2.qcow2 est un overlay de l'image CirrOS
        run: qemu-img info -U --output=json /srv/vms/vm2.qcow2 | grep -q 'backing-filename.*cirros-0.6.2-x86_64-disk.img'
      - desc: vm2 tourne et répond en SSH sur 2223 (attente jusqu'à 3 min)
        timeout: 200
        run: test -s /srv/vms/vm2.pid && kill -0 "$(cat /srv/vms/vm2.pid)" && for i in $(seq 1 18); do ssh-vm 2223 true 2>/dev/null && exit 0; sleep 10; done; exit 1
      - desc: vm1 a l'adresse 10.10.10.1 et vm2 10.10.10.2
        run: ssh-vm 2222 ip -4 addr show eth1 | grep -q 'inet 10\.10\.10\.1/24' && ssh-vm 2223 ip -4 addr show eth1 | grep -q 'inet 10\.10\.10\.2/24'
      - desc: vm1 pingue vm2 par le lien privé
        timeout: 60
        run: ssh-vm 2222 ping -c 3 -W 2 10.10.10.2

  - id: qemu-arret-export
    title: Arrêt propre et export de vm2
    cours: |
      Arrêter proprement une VM, c'est demander au système invité de s'éteindre : `system_powerdown` dans
      le moniteur simule l'appui sur le bouton d'alimentation (signal ACPI), ou `poweroff` dans la VM. Le
      processus QEMU se termine une fois l'invité éteint (surveille-le avec `ps` ou le fichier PID).

      `qemu-img convert -O <format> <source> <destination>` convertit un disque. Appliqué à un overlay, il
      produit une image **autonome** contenant aussi les blocs de la base. `-c` compresse une sortie qcow2.
      On ne convertit jamais le disque d'une VM en marche.
    description: |
      vm2 doit être livrée à une équipe qui utilise VMware. Arrête-la **proprement** (arrêt ACPI avec
      `system_powerdown` dans le moniteur, ou `sudo poweroff` dans la VM) et attends la fin du processus.
      Exporte ensuite son disque :

      - en **VMDK** dans `/srv/export/vm2.vmdk` ;
      - en qcow2 **autonome** (sans backing file, compressé avec `-c`) dans `/srv/export/vm2-autonome.qcow2`.

      vm1 doit continuer à tourner.
    hint: "moniteur-vm vm2 system_powerdown ; qemu-img convert -O vmdk vm2.qcow2 /srv/export/vm2.vmdk ; qemu-img convert -c -O qcow2 vm2.qcow2 /srv/export/vm2-autonome.qcow2"
    checks:
      - desc: vm2 est arrêtée et vm1 tourne toujours
        run: |
          p2=$(cat /srv/vms/vm2.pid 2>/dev/null); test -f /srv/vms/vm2.qcow2 && ! { [ -n "$p2" ] && kill -0 "$p2" 2>/dev/null; } && kill -0 "$(cat /srv/vms/vm1.pid)"
      - desc: Export VMDK valide
        run: |
          qemu-img info --output=json /srv/export/vm2.vmdk | grep -Eq '"format": *"vmdk"'
      - desc: Export qcow2 autonome (sans backing file)
        run: |
          qemu-img info --output=json /srv/export/vm2-autonome.qcow2 | grep -Eq '"format": *"qcow2"' && ! qemu-img info --output=json /srv/export/vm2-autonome.qcow2 | grep -q backing-filename
