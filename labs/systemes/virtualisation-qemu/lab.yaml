title: Virtualisation avec QEMU (images, disques, snapshots, réseau)
level: avance
order: 7
tags: [qemu, kvm, virtualisation, qcow2, snapshots, cirros, hyperviseur]
summary: Créer des disques qcow2 chaînés, démarrer des VM CirrOS en TCG, les piloter par le moniteur, prendre des snapshots, les relier en réseau et exporter.
build: .
shell: bash
workdir: /srv/vms
description: |
  **Contexte.** *Ateliers Durand* veut virtualiser ses petits serveurs. Avant d'acheter un hyperviseur,
  le responsable informatique te demande de maîtriser les briques de base que l'on retrouve partout
  (Proxmox, libvirt, OpenStack) : images disque **qcow2** et chaînes de *backing files*, lancement de VM,
  console série, moniteur, snapshots, réseau entre VM et export vers VMware.

  **Machine.** Un hyperviseur Ubuntu avec QEMU. Pas de KVM ici : les VM tournent en émulation
  logicielle **TCG** (`-accel tcg`), donc **un démarrage prend 1 à 3 minutes**. Sois patient.

  | Élément | Valeur |
  |---|---|
  | Image de base (lecture seule) | `/srv/images/cirros-0.6.2-x86_64-disk.img` |
  | Dossier des VM | `/srv/vms` (dossier courant) |
  | Dossier d'export | `/srv/export` |
  | Compte dans les VM CirrOS | `cirros` / `gocubsgo` (`sudo` sans mot de passe) |
  | SSH vers vm1 / vm2 | `127.0.0.1:2222` / `127.0.0.1:2223` (redirections QEMU) |
  | Lien entre VM | socket TCP QEMU `127.0.0.1:4000`, réseau `10.10.10.0/24` |

  Outils fournis : `qemu-img`, `qemu-system-x86_64`, `console-vm <vm>` (console série, Ctrl+C pour
  quitter), `moniteur-vm <vm> "<commande>"` (moniteur QEMU) et `ssh-vm <port> [commande]`
  (SSH vers une VM avec le mot de passe CirrOS).

  Réponses à écrire dans `/root/reponses.txt`, au format `cle=valeur`.
cours: |
  ## Virtualisation : les notions de base

  Un **hyperviseur** fait tourner plusieurs machines virtuelles (VM) sur un même serveur physique.

  | Type   | Principe                                    | Exemples                                  |
  |--------|---------------------------------------------|-------------------------------------------|
  | type 1 | directement sur le matériel                 | VMware ESXi, Hyper-V, Proxmox VE (KVM), Xen |
  | type 2 | application sur un système hôte             | VirtualBox, VMware Workstation            |

  Sous Linux, **KVM** (module du noyau) utilise les extensions matérielles du processeur (Intel VT-x,
  AMD-V) et **QEMU** émule le reste de la machine (disques, cartes réseau, BIOS). Proxmox, libvirt
  (virt-manager) et OpenStack pilotent tous QEMU/KVM. Sans KVM (comme ici), QEMU émule le processeur en
  logiciel (**TCG**) : ça marche, mais très lentement.

  ## Images disque

  | Format | Caractéristiques                                              |
  |--------|---------------------------------------------------------------|
  | raw    | octet pour octet, simple et rapide, pas de snapshot           |
  | qcow2  | allocation à la demande, snapshots, compression, backing file |
  | vmdk   | format VMware                                                 |
  | vhdx   | format Hyper-V                                                |

  ```
  cirros.img (base, lecture seule) ◀── vm1.qcow2 (overlay : seulement les blocs modifiés)
                                   ◀── vm2.qcow2
  ```

  Un **overlay** (backing file) permet de créer des dizaines de VM à partir d'une image de référence en
  quelques secondes et quelques Mo. La base ne doit **jamais** être modifiée, sinon tous les overlays sont
  corrompus.

  | Besoin                       | Commande                                                         |
  |------------------------------|------------------------------------------------------------------|
  | Informations                 | `qemu-img info [--backing-chain] disque.qcow2`                   |
  | Créer un disque vide         | `qemu-img create -f qcow2 data.qcow2 2G`                         |
  | Créer un overlay             | `qemu-img create -f qcow2 -b base.img -F qcow2 vm1.qcow2`        |
  | Agrandir                     | `qemu-img resize vm1.qcow2 1G` (puis agrandir la partition dans la VM) |
  | Convertir                    | `qemu-img convert -O vmdk vm.qcow2 vm.vmdk` (`-c` compresse)     |
  | Snapshots hors ligne         | `qemu-img snapshot -l/-c/-a/-d nom disque.qcow2`                 |
  | Vérifier                     | `qemu-img check disque.qcow2`                                    |

  ## Lancer une VM avec QEMU

  ```
  qemu-system-x86_64 -name vm1 -accel tcg -m 256 \
    -drive file=vm1.qcow2,if=virtio,format=qcow2 \            disque paravirtualisé
    -netdev user,id=n0,hostfwd=tcp:127.0.0.1:2222-:22 \       NAT + redirection de port
    -device virtio-net-pci,netdev=n0 \                        carte réseau
    -serial unix:/srv/vms/vm1.console,server,nowait \         console série
    -monitor unix:/srv/vms/vm1.monitor,server,nowait \        moniteur de contrôle
    -display none -daemonize -pidfile vm1.pid
  ```

  Les périphériques **virtio** sont paravirtualisés : l'invité sait qu'il est virtualisé et dialogue
  efficacement avec l'hyperviseur (sous Windows, il faut installer les pilotes virtio).

  ## Réseau des VM

  | Mode QEMU        | Équivalent courant          | Usage                                      |
  |------------------|-----------------------------|--------------------------------------------|
  | `user`           | NAT                         | sortie vers l'extérieur, entrée par redirection de port |
  | `tap` + bridge   | pont (bridge)               | VM directement sur le LAN, comme une machine physique |
  | `socket`         | réseau privé interne        | relier des VM entre elles                  |

  ## Le moniteur QEMU

  `info status`, `info block`, `info network`, `savevm <nom>` / `loadvm <nom>` (snapshot avec la RAM),
  `system_powerdown` (bouton d'arrêt ACPI), `quit` (arrachage de la prise).

  ## Snapshot ≠ sauvegarde

  Un snapshot vit **dans** le disque de la VM : si le disque ou le stockage est perdu, les snapshots le
  sont aussi. Il sert à revenir en arrière après une mise à jour ratée, et doit être supprimé ensuite (une
  chaîne de snapshots dégrade les performances et grossit sans fin).

  ## Pièges courants

  - Modifier ou déplacer une image de base utilisée par des overlays.
  - Agrandir le disque virtuel sans agrandir la partition et le système de fichiers dans la VM.
  - Arrêter une VM par `quit` ou `kill` : équivalent d'une coupure de courant.
  - Convertir une image pendant que la VM tourne : copie incohérente.

  ## Bonnes pratiques en entreprise

  - Modèles (templates) de VM à jour, déployés par clonage ; nommage et inventaire des VM.
  - Sauvegarde des VM par l'outil de l'hyperviseur (Proxmox Backup Server, Veeam), restauration testée.
  - Surveiller la sur-allocation (mémoire, disques à allocation dynamique qui remplissent le stockage).
