    url: https://keepalived.readthedocs.io/
  - title: keepalived.conf(5) - syntaxe (Ubuntu 24.04)
    url: https://manpages.ubuntu.com/manpages/noble/man5/keepalived.conf.5.html
  - title: Wikipédia - Virtual Router Redundancy Protocol
