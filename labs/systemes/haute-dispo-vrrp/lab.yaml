title: Haute disponibilité de la passerelle avec VRRP (keepalived)
level: avance
order: 6
tags: [vrrp, keepalived, haute disponibilité, passerelle, basculement]
summary: Passerelle virtuelle VRRP sur deux routeurs, groupe de synchronisation, test de bascule, script de surveillance, notifications et VRRP en unicast.
compose: docker-compose.yml
service: admin
shell: bash
workdir: /root
description: |
  **Contexte.** La passerelle du LAN d'*Ateliers Durand* est un point unique de défaillance : quand elle
  redémarre, plus personne ne travaille. Un second routeur a été installé. Avec **VRRP** (l'équivalent
  libre de HSRP chez Cisco), les deux routeurs partagent une **adresse IP virtuelle** portée par le
  routeur maître ; si celui-ci tombe, le secours la reprend en quelques secondes.

  **Topologie.**

  ```
   LAN 192.168.50.0/24                         SERVEURS 10.50.0.0/24
   pc .10 (passerelle .254) ──┬── r1 (.2 / .2) ──┬── srv .10 (passerelle .254, web)
                              └── r2 (.3 / .3) ──┘
           VIP 192.168.50.254                    VIP 10.50.0.254
  ```

  Interfaces des routeurs : `lan`, `serveurs` et `mgmt` (administration hors bande : `ssh r1`, `ssh r2`,
  `ssh pc`, `ssh srv` depuis admin). keepalived est installé sur r1 et r2 mais pas configuré
  (`/etc/keepalived/keepalived.conf`). Démarrage : `keepalived -D` ;
  arrêt : `pkill keepalived` ; journal : `grep Keepalived /var/log/syslog` (rsyslog est démarré).

  Pour l'instant, la passerelle `.254` n'existe pas : pc ne joint pas srv.
cours: |
  ## Le problème : la passerelle unique

  Tous les postes d'un LAN ont **une** passerelle par défaut configurée. Si ce routeur tombe, plus aucun
  poste ne sort du réseau, même si un second routeur est branché à côté : les postes ne savent pas qu'il
  existe.

  ## La solution : une adresse virtuelle

  ```
            pc (passerelle = 192.168.50.254)
                     │
         ┌───────────┴───────────┐
   r1 192.168.50.2          r2 192.168.50.3
   priorité 150             priorité 100
   MAÎTRE : porte la VIP    SECOURS : écoute les annonces
   192.168.50.254
         │  annonces VRRP toutes les secondes (multicast 224.0.0.18, protocole IP 112)
  ```

  - Les routeurs d'un même groupe (**VRID**) s'élisent un **maître** : la priorité la plus haute gagne.
  - Le maître porte l'**adresse IP virtuelle** (VIP) et une **adresse MAC virtuelle**
    (`00:00:5e:00:01:<VRID>`), et envoie des annonces.
  - Si le secours ne reçoit plus d'annonce pendant environ 3 intervalles, il prend la VIP et envoie un
    **ARP gratuit** pour que les commutateurs et les postes mettent à jour leurs tables.
  - **Préemption** : quand un routeur plus prioritaire revient, il reprend la main (désactivable avec
    `nopreempt`).

  Protocoles équivalents : **HSRP** (Cisco, propriétaire), **GLBP**, et CARP (BSD, pfSense).

  ## keepalived

  ```
  global_defs {
      script_user root
      enable_script_security
  }
  vrrp_script chk_maintenance {
      script "/usr/bin/test ! -e /etc/keepalived/maintenance"
      interval 2
      weight -60                 # priorité - 60 si le script échoue
  }
  vrrp_instance VI_LAN {
      state MASTER               # état de départ (BACKUP sur l'autre routeur)
      interface lan
      virtual_router_id 50       # identique sur les deux routeurs
      priority 150               # 100 sur le secours
      advert_int 1
      virtual_ipaddress { 192.168.50.254/24 }
      track_script { chk_maintenance }
  }
  vrrp_sync_group VG_DURAND {
      group { VI_LAN VI_SRV }    # basculent ensemble
      notify /etc/keepalived/notify.sh
  }
  ```

  | Besoin                    | Commande                                        |
  |---------------------------|-------------------------------------------------|
  | Qui porte la VIP ?        | `ip -br addr show lan`                          |
  | Voir les annonces         | `tcpdump -ni lan vrrp`                          |
  | Vérifier la configuration | `keepalived -t` (versions récentes)             |
  | Journal                   | `grep Keepalived /var/log/syslog`, `journalctl -u keepalived` |
  | Simuler une panne         | arrêter keepalived, couper l'interface, mode maintenance |

  ## Pourquoi un groupe de synchronisation

  Avec deux VIP (une par réseau), si seule celle du LAN basculait, les paquets aller passeraient par r2
  et les réponses par r1 : un pare-feu à états les rejetterait (routage **asymétrique**). Le
  `vrrp_sync_group` force les instances à changer d'état ensemble.

  ## Pièges courants

  - `virtual_router_id` différent entre les deux routeurs : chacun se croit seul, deux maîtres (*split
    brain*) et conflit d'adresse.
  - Multicast filtré par un commutateur ou un cloud : les deux deviennent maîtres. Solution : unicast.
  - Pare-feu local qui bloque le protocole VRRP (112).
  - Tester la haute disponibilité une fois à l'installation, puis plus jamais : la bascule doit être
    testée régulièrement, en heures creuses.

  ## Bonnes pratiques en entreprise

  - Redondance de bout en bout : deux routeurs, mais aussi deux alimentations, deux liens, deux
    commutateurs (sinon on a juste déplacé le point unique de défaillance).
  - Scripts de surveillance (lien amont, service) pour basculer quand le routeur est vivant mais inutile.
  - Notification et supervision des changements d'état, journal des bascules.
  - Mêmes principes pour d'autres services : un VIP keepalived devant deux HAProxy, deux serveurs DNS...
