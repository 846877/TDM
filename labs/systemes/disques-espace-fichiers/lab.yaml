title: Disques, espace et systèmes de fichiers
level: debutant
order: 5
tags: [linux, disque, df, du, partitions, ext4, swap, fstab, archives]
summary: Trouver ce qui remplit un disque, nettoyer, libérer un fichier supprimé encore ouvert, partitionner et formater des images disque, écrire un fstab et archiver.
build: .
shell: bash
workdir: /root
description: |
  **Contexte.** Le serveur de fichiers d'*Ateliers Durand* est presque plein et un nouveau serveur, avec
  des disques supplémentaires, doit être préparé. Tu dois comprendre où part l'espace, faire le ménage sans
  rien casser, puis t'entraîner à partitionner, formater et déclarer des disques. Pour ne prendre aucun
  risque, les « disques » sont ici des **fichiers image** : les commandes sont exactement celles d'un vrai
  disque (`/dev/sdb`).

  **Machine.** Serveur Ubuntu, terminal `root`. Le prestataire a laissé l'inventaire des disques du
  nouveau serveur dans `/root/inventaire-disques.txt`.

  Réponses à écrire dans `/root/reponses.txt`, au format `cle=valeur`.

  Outils : `df -h`, `du -sh`, `find -mtime`, `lsof +L1`, `truncate`, `sfdisk`, `mkfs.ext4`, `mkswap`,
  `blkid`, `findmnt`, `zip`, `tar -cJf`.
cours: |
  ## Du disque au fichier

  Avant de stocker un fichier, un disque passe par plusieurs couches :

  ```
  disque physique /dev/sdb  (ou /dev/nvme0n1, /dev/vdb dans une VM)
   └── table de partitions (GPT, ou MBR sur les vieux systèmes)
        ├── /dev/sdb1  ── système de fichiers ext4 ── monté sur /srv/donnees
        └── /dev/sdb2  ── espace d'échange (swap)
  ```

  | Couche                 | Outils                                   |
  |------------------------|------------------------------------------|
  | disques et partitions  | `lsblk`, `fdisk -l`, `sfdisk`, `parted`  |
  | système de fichiers    | `mkfs.ext4`, `mkfs.xfs`, `mkswap`, `blkid` |
  | montage                | `mount`, `umount`, `findmnt`, `/etc/fstab` |
  | occupation             | `df -h`, `du -sh`, `ncdu`                |

  Sous Linux, il n'y a pas de lettres de lecteur : chaque système de fichiers est **monté** dans un dossier
  de l'arborescence (le *point de montage*).

  ## GPT et MBR

  | Table | Limites                                          | Usage                         |
  |-------|--------------------------------------------------|-------------------------------|
  | MBR   | 4 partitions primaires, disques de 2 To maximum  | anciens systèmes, BIOS        |
  | GPT   | 128 partitions, disques de plusieurs Po          | standard actuel, UEFI         |

  `sfdisk` lit une description texte de la table, pratique pour l'automatiser :

  ```
  label: gpt
  size=256MiB, type=linux
  type=linux                 ← sans taille : tout le reste du disque
  ```

  ## Les systèmes de fichiers courants

  | Type   | Points forts                                      |
  |--------|---------------------------------------------------|
  | ext4   | standard Debian/Ubuntu, robuste, redimensionnable |
  | xfs    | standard Red Hat, gros fichiers et gros volumes   |
  | vfat / exfat | clés USB, partition EFI, échange avec Windows |
  | swap   | extension de la mémoire vive sur disque           |

  Chaque système de fichiers reçoit un **UUID** unique (et une étiquette facultative), affiché par `blkid`.

  ## /etc/fstab : les montages au démarrage

  ```
  # <source>                                 <point>          <type> <options>          <dump> <ordre>
  UUID=3f2b6c1e-8a4d-4f1e-9c2a-7d5e1b0a9f34  /srv/donnees     ext4   defaults,noatime   0      2
  UUID=9c1d2e3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f  none             swap   sw                 0      0
  ```

  On désigne les disques par **UUID** : les noms `/dev/sdb`, `/dev/sdc` peuvent changer d'un démarrage à
  l'autre (ajout d'un disque, clé USB). La dernière colonne fixe l'ordre de vérification (`1` pour `/`,
  `2` pour les autres, `0` jamais). L'option `nofail` laisse démarrer le serveur si le disque est absent.
  `findmnt --verify` et `mount -a` testent le fichier **avant** de redémarrer.

  ## Où est passé l'espace ?

  | Situation                                         | Commande                       |
  |---------------------------------------------------|--------------------------------|
  | Quel système de fichiers est plein ?              | `df -h`                        |
  | Quel dossier est gros ?                           | `du -sh /srv/* \| sort -h`     |
  | Quels fichiers sont vieux ou gros ?               | `find /srv -mtime +30`, `find / -xdev -size +100M` |
  | `df` dit plein mais `du` ne trouve rien           | `lsof +L1` (fichiers supprimés encore ouverts) |
  | Plus de place alors que `df -h` montre de l'espace | `df -i` (plus d'inodes libres) |

  ## Pièges courants

  - Se tromper de disque avec `mkfs` ou `sfdisk` : tout est effacé. Vérifier avec `lsblk` juste avant.
  - Une erreur dans `/etc/fstab` peut empêcher le serveur de démarrer : tester avec `findmnt --verify`.
  - Supprimer un journal ouvert par un service : l'espace n'est pas libéré.
  - Lancer `find ... -delete` sans avoir d'abord regardé la liste produite par le même `find`.

  ## Bonnes pratiques en entreprise

  - Séparer système et données (partitions ou disques différents), pour qu'un partage plein ne bloque
    pas le système.
  - Superviser l'occupation des disques avec des seuils d'alerte (80 %, 90 %).
  - Rotation des journaux et purge automatique des fichiers temporaires.
  - Documenter chaque disque (UUID, rôle, point de montage) dans le dossier du serveur.
