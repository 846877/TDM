  - title: Documentation Ansible - Introduction aux inventaires
    url: https://docs.ansible.com/ansible/latest/inventory_guide/intro_inventory.html
  - title: Documentation Ansible - Utiliser les playbooks
    url: https://docs.ansible.com/ansible/latest/playbook_guide/index.html
  - title: Documentation Ansible - Ansible Vault
    url: https://docs.ansible.com/ansible/latest/vault_guide/index.html
  - title: sudoers(5) - syntaxe de sudo (Ubuntu 24.04)
