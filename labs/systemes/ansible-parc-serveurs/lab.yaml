title: Automatiser un parc de serveurs avec Ansible
level: expert
order: 8
tags: [ansible, automatisation, playbook, idempotence, role, vault, ssh]
summary: Inventaire et ansible.cfg, commandes ad hoc, playbook de socle (compte d'exploitation, sudoers validé), idempotence, variables de groupe et modèles Jinja2, handlers, rôles et secrets chiffrés avec Ansible Vault.
compose: docker-compose.yml
service: admin
shell: bash
workdir: /root
description: |
  **Contexte.** Le parc d'*Ateliers Durand* grandit et les réglages faits à la main divergent d'un serveur
  à l'autre. Tu vas décrire l'état voulu des serveurs avec **Ansible**, depuis le poste d'administration,
  pour que la configuration soit reproductible, relue et rejouable sans risque.

  | Machine | Adresse | Rôle |
  |---|---|---|
  | `admin` | 10.178.0.5 | ton poste (`ansible-core` installé) — terminal du lab |
  | `srv1`, `srv2` | 10.178.0.11, 10.178.0.12 | serveurs **web** |
  | `srv3` | 10.178.0.13 | serveur de **base de données** |

  - `ssh srv1`, `ssh srv2`, `ssh srv3` : root par clé (c'est aussi ce qu'utilisera Ansible).
  - Les serveurs n'ont pas systemd et pas d'accès Internet : Python 3 est déjà installé, c'est tout ce
    qu'Ansible demande côté serveur.
  - Travaille dans le dossier **`/root/parc`** (un ancien playbook s'y trouve déjà).

  Réponses à écrire dans `/root/reponses.txt` d'admin, au format `cle=valeur`.
cours: |
  ## Pourquoi automatiser

  Configurer trois serveurs à la main, c'est trois occasions d'oublier une ligne. À trente serveurs, plus
  personne ne sait exactement ce qui tourne où. Les outils de **gestion de configuration** (Ansible,
  Puppet, Salt, Chef) inversent la logique : on **décrit l'état voulu** dans des fichiers texte, versionnés
  avec Git et relus comme du code, et l'outil fait converger les machines vers cet état.

  Ansible a deux atouts : il est **sans agent** (il se connecte en SSH et exécute de petits programmes
  Python sur la cible, puis les supprime) et ses fichiers sont en **YAML**, lisibles par un
  administrateur qui ne développe pas.

  ## Les pièces du puzzle

  ```
  /root/parc/
  ├── ansible.cfg          réglages (inventaire par défaut, fichier du mot de passe vault…)
  ├── inventaire.ini       QUELLES machines, rangées en groupes
  ├── group_vars/          variables par groupe (web.yml, bdd.yml, all.yml)
  ├── templates/motd.j2    modèles Jinja2
  ├── socle.yml            playbook : QUOI faire, sur quels groupes
  ├── site.yml             playbook principal qui applique les rôles
  └── roles/socle/         rôle réutilisable (tasks/, handlers/, defaults/, templates/…)
  ```

  - L'**inventaire** liste les hôtes et les groupes. Un groupe peut contenir d'autres groupes
    (`[parc:children]`). Le groupe `all` existe toujours.
  - Un **module** est une action unitaire : `ping`, `copy`, `file`, `user`, `lineinfile`, `template`,
    `service`… On l'appelle soit en **ad hoc** (`ansible web -m file -a "path=/srv state=directory"`),
    soit dans une **tâche** de playbook.
  - Un **playbook** est une liste de *plays* ; chaque play vise des hôtes (`hosts: web`) et enchaîne des
    tâches dans l'ordre.

  ```yaml
  - name: Socle commun
    hosts: parc
    tasks:
      - name: Compte d'exploitation
        ansible.builtin.user:
          name: exploit
          uid: 2000
          shell: /bin/bash
  ```

  ## Idempotence : la propriété essentielle

  Un module Ansible vérifie d'abord l'état présent et **n'agit que s'il faut** : il répond `ok` (rien à
  faire) ou `changed` (modification appliquée). Rejouer un playbook correct doit donc donner
  **`changed=0`** : c'est ce qui permet de le relancer chaque nuit pour corriger les dérives sans rien
  casser. Les modules `shell` et `command` ne savent pas si leur commande a déjà été faite : ils sont
  toujours `changed` et souvent dangereux à rejouer (un `echo … >>` ajoute une ligne à chaque passage).
  Préfère toujours le module dédié (`lineinfile`, `user`, `file`…) ; à défaut, utilise `creates:` ou
  `changed_when:`.

  Le récapitulatif `PLAY RECAP` résume chaque hôte : `ok`, `changed`, `unreachable`, `failed`. Avant
  d'appliquer, `--check --diff` montre ce qui **serait** modifié.

  ## Variables, modèles et faits

  Les variables viennent de plusieurs endroits : `group_vars/<groupe>.yml`, `host_vars/<hôte>.yml`,
  `vars:` dans le playbook, `defaults/main.yml` d'un rôle (priorité la plus faible). Ansible collecte aussi
  des **faits** sur chaque machine (`ansible srv1 -m setup`) : `ansible_hostname`, `ansible_distribution`…
  Un **modèle Jinja2** (`template`) produit un fichier différent par hôte : `{{ inventory_hostname }}`,
  `{{ role_serveur }}`, des boucles `{% for %}`.

  ## Handlers et validation

  Redémarrer un service à chaque exécution coupe les utilisateurs pour rien. Un **handler** n'est exécuté
  qu'à la fin du play, et **seulement si une tâche qui le notifie (`notify:`) a été `changed`**. Pour les
  fichiers critiques (sudoers, sshd_config), l'option **`validate:`** fait tester le fichier temporaire
  avant de le mettre en place (`visudo -cf %s`, `sshd -t -f %s`) : une erreur de syntaxe n'enferme plus
  dehors.

  ## Rôles et secrets

  Un **rôle** range tâches, handlers, modèles et valeurs par défaut dans une arborescence standard
  (`roles/socle/tasks/main.yml`…) pour les réutiliser d'un projet à l'autre : `roles: [socle]` dans le
  playbook suffit. Les **secrets** (mots de passe de base, clés d'API) ne doivent jamais être en clair dans
  le dépôt Git : **Ansible Vault** chiffre un fichier de variables en AES-256 (`ansible-vault create`,
  `encrypt`, `view`, `edit`). Le mot de passe vault reste hors du dépôt, dans un fichier lisible par root
  seul, référencé par `vault_password_file`. Pense aussi à `no_log: true` sur les tâches qui manipulent un
  secret, pour qu'il n'apparaisse pas dans la sortie.
