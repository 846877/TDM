# Parc d'« Ateliers Durand » géré avec Ansible : admin (ansible-core, terminal du lab), srv1 et srv2
# (serveurs web), srv3 (serveur de base de données). Accès root par clé depuis admin.
services:
  admin:
    build: {context: ., dockerfile: admin/Dockerfile}
    hostname: admin
    volumes: [cles:/lab-ssh]
    networks:
      lan: {ipv4_address: 10.178.0.5}
  srv1:
    build: {context: ., dockerfile: serveur/Dockerfile}
    hostname: srv1
    volumes: [cles:/lab-ssh]
    networks:
      lan: {ipv4_address: 10.178.0.11}
  srv2:
    build: {context: ., dockerfile: serveur/Dockerfile}
    hostname: srv2
    volumes: [cles:/lab-ssh]
    networks:
      lan: {ipv4_address: 10.178.0.12}
  srv3:
    build: {context: ., dockerfile: serveur/Dockerfile}
    hostname: srv3
    volumes: [cles:/lab-ssh]
    networks:
      lan: {ipv4_address: 10.178.0.13}
volumes:
  cles:
networks:
  lan:
    internal: true
    ipam:
      config: [{subnet: 10.178.0.0/24, ip_range: 10.178.0.128/28}]
