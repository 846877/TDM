title: Joindre des serveurs et postes Linux au domaine
level: avance
order: 2
tags: [active directory, samba, winbind, sssd, adcli, kerberos, smb, partage, sso]
summary: Joindre un serveur de fichiers Samba (winbind) et un poste Linux (SSSD) au domaine, partages SMB par groupe AD, contrôle d'accès et authentification unique Kerberos.
compose: docker-compose.yml
service: admin
shell: bash
workdir: /root
description: |
  **Contexte.** Le domaine `DURAND.LAN` est en service sur `dc1`. Il faut maintenant y raccorder le
  **serveur de fichiers** (les droits des partages seront donnés aux groupes AD) et un **poste Linux** du
  service informatique (ouverture de session avec les comptes du domaine).

  **Machines** (réseau `10.61.0.0/24`, DNS = 10.61.0.10 pour toutes ; `ssh <machine>` en root par clé) :

  | Machine        | Adresse    | Rôle                                                       |
  |----------------|------------|------------------------------------------------------------|
  | `admin`        | 10.61.0.5  | ton poste (`kinit`, `smbclient`, `sshpass`)                 |
  | `dc1`          | 10.61.0.10 | contrôleur de domaine Samba AD (déjà configuré)             |
  | `srv-fichiers` | 10.61.0.20 | serveur de fichiers : Samba + winbind installés, non configurés |
  | `poste01`      | 10.61.0.30 | poste Linux : SSSD + adcli installés, non configurés        |

  **Annuaire** (domaine NetBIOS `DURAND`, Administrator / `Durand@dmin2024`) :

  | Compte     | Mot de passe      | Groupe            |
  |------------|-------------------|-------------------|
  | `mdupont`  | `Compta!2024pass` | `GG_Compta`       |
  | `jmartin`  | `RhDurand!2024`   | `GG_RH`           |
  | `tbernard` | `Technicien!2024` | `GG_Informatique` |

  OU disponibles : `OU=Serveurs,OU=Durand` et `OU=Ordinateurs,OU=Durand`.
  Au premier démarrage, dc1 provisionne le domaine (environ une minute) : `ssh dc1 test -f /run/lab-pret`
  indique qu'il est prêt.

  Démarrage des services sans systemd : `winbindd`, `smbd` (après modification : `smbcontrol all reload-config`),
  `sssd -D` (après modification : `pkill sssd; sssd -D`).
cours: |
  ## Joindre Linux à Active Directory

  Un serveur ou un poste Linux joint au domaine utilise les comptes AD : un seul mot de passe pour
  l'utilisateur, une gestion centralisée pour le technicien. Deux outils dominent :

  | Outil              | Pour quoi                                                  | Jonction        |
  |--------------------|------------------------------------------------------------|-----------------|
  | **winbind** (Samba)| serveurs de fichiers SMB (droits par groupes AD, ACL Windows) | `net ads join` |
  | **SSSD**           | postes et serveurs sans partage SMB : connexion, sudo, cache hors ligne | `adcli join` / `realm join` |

  ## Ce que fait une jonction

  ```
  1. DNS          srv-fichiers trouve les DC (SRV _ldap._tcp.durand.lan)
  2. Kerberos     authentification de l'administrateur (kinit / -U)
  3. Compte machine créé dans l'OU choisie (CN=SRV-FICHIERS,OU=Serveurs,...)
  4. Secret       mot de passe machine stocké localement (secrets.tdb ou /etc/krb5.keytab)
  5. NSS / PAM    Linux apprend à résoudre et authentifier les comptes du domaine
  ```

  ## Des SID aux UID : l'idmap

  Windows identifie les comptes par des **SID** (`S-1-5-21-...-1105`), Linux par des **UID/GID**. Il faut
  une correspondance **stable** et, idéalement, **identique sur tous les serveurs** :

  | Backend idmap | Principe                                               | Usage                        |
  |---------------|--------------------------------------------------------|------------------------------|
  | `tdb`         | attribution au fil de l'eau, locale à la machine        | domaine `*` (comptes intégrés) |
  | `rid`         | UID = début de plage + RID (fin du SID) : calculé, identique partout | cas le plus courant |
  | `ad`          | lit `uidNumber`/`gidNumber` (RFC 2307) dans l'annuaire  | quand l'annuaire les gère    |

  ```ini
  [global]
     workgroup = DURAND
     realm = DURAND.LAN
     security = ADS
     idmap config * : backend = tdb
     idmap config * : range = 3000-7999
     idmap config DURAND : backend = rid
     idmap config DURAND : range = 10000-999999
  ```

  Les plages ne doivent **jamais** se chevaucher, ni avec les comptes locaux.

  ## NSS et PAM

  - **NSS** (`/etc/nsswitch.conf`) : *qui* existe. La ligne `passwd: files winbind` (ou `sss`) fait
    apparaître les comptes du domaine dans `getent passwd`, `id`, `ls -l`.
  - **PAM** (`/etc/pam.d/`, géré par `pam-auth-update` sur Ubuntu) : *comment* on s'authentifie et ce qu'on
    fait à l'ouverture de session (création du dossier personnel avec `mkhomedir`).

  ## SSSD

  ```ini
  # /etc/sssd/sssd.conf  (propriétaire root, droits 600, sinon sssd refuse de démarrer)
  [sssd]
  domains = durand.lan
  services = nss, pam
  [domain/durand.lan]
  id_provider = ad
  access_provider = simple
  simple_allow_groups = gg_informatique
  use_fully_qualified_names = False
  fallback_homedir = /home/%u
  default_shell = /bin/bash
  ```

  SSSD garde un **cache** : un portable peut ouvrir une session hors du réseau de l'entreprise. Après une
  modification dans l'annuaire, `sss_cache -E` vide ce cache.

  ## Mémo des commandes

  | Besoin                         | Commande                                       |
  |--------------------------------|------------------------------------------------|
  | Tester le DNS du domaine       | `host -t SRV _ldap._tcp.durand.lan`            |
  | Ticket Kerberos                | `kinit administrator`, `klist`                 |
  | Joindre (winbind)              | `net ads join -U administrator createcomputer=Durand/Serveurs` |
  | Tester la jonction             | `net ads testjoin`, `wbinfo -t`                |
  | Lister comptes / groupes AD    | `wbinfo -u`, `wbinfo -g`                       |
  | Joindre (SSSD)                 | `adcli join --domain=durand.lan --domain-ou=...` |
  | Clés de la machine             | `klist -k /etc/krb5.keytab`                    |
  | Identité d'un compte           | `id tbernard`, `getent passwd mdupont`         |

  ## Droits sur un partage : deux niveaux

  ```
  accès SMB  ──▶ niveau partage : valid users = @gg_compta, read only = no
             ──▶ niveau fichiers : dossier root:gg_compta 2770 (ou ACL)
  ```

  Les deux doivent autoriser l'utilisateur ; le plus restrictif l'emporte, comme les autorisations de
  partage et NTFS sous Windows.

  ## Pièges courants

  - DNS du serveur qui ne pointe pas vers les DC : la jonction échoue avec des erreurs obscures.
  - Horloge décalée de plus de 5 minutes : Kerberos refuse (« Clock skew too great »).
  - Nom d'hôte trop long (plus de 15 caractères pour NetBIOS) ou non résolu.
  - Changer de backend idmap après coup : tous les fichiers changent de propriétaire apparent.

  ## Bonnes pratiques en entreprise

  - Comptes ordinateurs créés dans les bonnes OU (serveurs, postes) pour les GPO et la délégation.
  - Accès aux serveurs limité par groupe AD (`simple_allow_groups`, `AllowGroups` dans sshd).
  - Droits sudo donnés à des groupes AD (`%gg_informatique ALL=(ALL) ALL`).
  - Supervision du canal sécurisé (`net ads testjoin`) et de la synchronisation horaire.
