# Domaine DURAND.LAN déjà en service (dc1, provisionné au premier démarrage, ~1 minute),
# un serveur de fichiers et un poste Linux à joindre au domaine.
x-membre: &membre
  build: {context: ., dockerfile: membre/Dockerfile}
  domainname: durand.lan
  dns: [10.61.0.10]
  volumes: [cles:/lab-ssh]
services:
  admin:
    build: {context: ., dockerfile: admin/Dockerfile}
    hostname: admin
    dns: [10.61.0.10]
    volumes: [cles:/lab-ssh]
    networks:
      lan: {ipv4_address: 10.61.0.5}
  dc1:
    build: {context: ., dockerfile: dc/Dockerfile}
    hostname: dc1
    privileged: true
    volumes: [cles:/lab-ssh]
    networks:
      lan: {ipv4_address: 10.61.0.10}
  srv-fichiers:
    <<: *membre
    hostname: srv-fichiers
    networks:
      lan: {ipv4_address: 10.61.0.20}
  poste01:
    <<: *membre
    hostname: poste01
    networks:
      lan: {ipv4_address: 10.61.0.30}
volumes:
  cles:
networks:
  lan:
    internal: true
    ipam:
      config: [{subnet: 10.61.0.0/24, ip_range: 10.61.0.128/26}]
