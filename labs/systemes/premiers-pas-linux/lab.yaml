title: Premiers pas sous Linux
level: debutant
order: 0
tags: [linux, terminal, fichiers, nano, grep, find, redirections]
summary: Se repérer dans l'arborescence, manipuler fichiers et dossiers, éditer, lire un journal, chercher, rediriger et enchaîner des commandes.
build: .
shell: bash
workdir: /root
description: |
  **Contexte.** Premier jour chez *Ateliers Durand* : ton responsable t'a ouvert un poste Linux et t'a
  laissé quelques fichiers. Avant de toucher aux serveurs, tu dois être à l'aise avec le **terminal** :
  te déplacer, créer et ranger des fichiers, en modifier un, lire un journal, retrouver une information
  et enchaîner des commandes.

  **Machine.** Poste Ubuntu, terminal `root`. Dossiers à explorer : `/srv/accueil`, `/srv/partage`,
  `/var/log/appli` et ton dossier personnel `/root`.

  Réponses à écrire dans `/root/reponses.txt`, au format `cle=valeur` (une réponse par ligne), par
  exemple avec `nano /root/reponses.txt`.

  Outils : `pwd`, `ls -la`, `cd`, `mkdir -p`, `cp`, `mv`, `rm -r`, `cat`, `less`, `head`, `tail`,
  `wc -l`, `nano`, `grep`, `find`, `sort`, `uniq`, `cut`, `>`, `>>`, `2>`, `|`.
cours: |
  ## Le terminal et l'interpréteur de commandes

  Le **terminal** affiche une invite (*prompt*) qui indique qui tu es, sur quelle machine et où :

  ```
  root@premiers-pas-linux:~#
  └─┬┘ └───────┬────────┘ │└─ # = administrateur (root), $ = utilisateur ordinaire
   compte    machine      └── dossier courant (~ = dossier personnel)
  ```

  Une commande s'écrit `commande [options] [arguments]` : `ls -l /srv`. Les options courtes se
  combinent (`ls -la` = `ls -l -a`). La touche **Tab** complète les noms (une fois) ou propose les choix
  (deux fois) ; **flèche haut** rappelle les commandes précédentes ; **Ctrl+C** interrompt ; `man ls` ou
  `ls --help` affichent l'aide.

  ## L'arborescence

  Sous Linux, tout part de la **racine** `/` : pas de lettres de lecteur comme sous Windows.

  ```
  /
  ├── etc/      configuration du système
  ├── home/     dossiers personnels des utilisateurs (/root pour l'administrateur)
  ├── srv/      données servies par la machine (partages, sites)
  ├── tmp/      fichiers temporaires
  ├── usr/      programmes installés
  └── var/      données variables : journaux (/var/log), files d'attente, bases
  ```

  Un chemin **absolu** commence par `/` (`/srv/accueil/modeles`). Un chemin **relatif** part du dossier
  courant (`modeles/courrier.txt`). Raccourcis : `.` dossier courant, `..` dossier parent, `~` dossier
  personnel, `cd -` dossier précédent. Les fichiers dont le nom commence par un point sont **cachés** :
  `ls -a` les affiche.

  ## Mémo des commandes de base

  | Besoin                         | Commande                                  |
  |--------------------------------|-------------------------------------------|
  | Où suis-je ? que contient-il ? | `pwd`, `ls -la`, `tree -a`                |
  | Créer des dossiers             | `mkdir -p a/b/c` (crée les parents)       |
  | Copier / déplacer / renommer   | `cp source dest`, `cp -r dossier dest`, `mv ancien nouveau` |
  | Supprimer                      | `rm fichier`, `rm -r dossier` (**sans corbeille**) |
  | Lire                           | `cat` (court), `less` (long, `q` pour quitter), `head -n 5`, `tail -n 5`, `tail -f` |
  | Compter                        | `wc -l` (lignes), `wc -w` (mots)          |
  | Chercher du texte              | `grep motif fichier`, `-i` (casse), `-c` (compter), `-r` (récursif), `-n` (numéros) |
  | Chercher des fichiers          | `find /srv -name '*.pdf'`, `-type f`, `-size +1M`, `-mtime +30` |
  | Type d'un fichier              | `file fichier`                            |

  ## Redirections et tubes

  Chaque commande a une **entrée** (clavier), une **sortie** (écran) et une **sortie d'erreur** (écran
  aussi). On peut les détourner :

  ```
  commande  > fichier     sortie dans un fichier (écrase son contenu)
  commande >> fichier     sortie ajoutée à la fin du fichier
  commande 2> fichier     erreurs dans un fichier
  commande1 | commande2   la sortie de commande1 devient l'entrée de commande2
  ```

  Les **tubes** (*pipes*) permettent de construire des traitements à partir de petites commandes :

  ```bash
  cut -d';' -f3 annuaire.csv | sort | uniq -c | sort -rn   # nombre de personnes par service
  ```

  ## L'éditeur nano

  `nano fichier` ouvre l'éditeur. On tape directement le texte ; les raccourcis sont affichés en bas
  (`^` = touche Ctrl) : **Ctrl+O** puis Entrée pour enregistrer, **Ctrl+X** pour quitter, **Ctrl+W** pour
  chercher, **Ctrl+K** pour couper une ligne. `vi` (ou `vim`) est présent sur tous les serveurs : `i` pour
  écrire, Échap puis `:wq` pour enregistrer et quitter, `:q!` pour quitter sans enregistrer.

  ## Pièges courants

  - `rm` ne passe pas par une corbeille : relis la commande, surtout avec `-r` et des jokers (`*`).
  - `>` écrase sans prévenir : `>>` pour ajouter.
  - Les espaces dans les noms de fichiers : mettre le nom entre guillemets (`"mon fichier.txt"`).
  - Linux distingue majuscules et minuscules : `Rapport.txt` et `rapport.txt` sont deux fichiers.
  - Un chemin relatif dépend du dossier courant : en cas de doute, `pwd` ou chemin absolu.

  ## Bonnes pratiques en entreprise

  - Sur un serveur, on travaille avec un compte personnel et `sudo`, pas directement en root.
  - Avant de modifier un fichier de configuration, on en garde une copie (`cp fichier fichier.bak`).
  - On vérifie ce qu'une commande va toucher avant de l'exécuter (`ls` avant `rm`, `find` avant
    `find -delete`).
  - On note dans le ticket les commandes passées : un collègue doit pouvoir refaire ou défaire.
