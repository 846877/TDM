title: Administrer des serveurs à distance avec SSH
level: debutant
order: 4
tags: [ssh, clés, scp, rsync, sudo, accès distant]
summary: Connexion par mot de passe puis par clé, fichier ~/.ssh/config, commandes distantes, scp, rsync et sudo à distance.
compose: docker-compose.yml
service: admin
shell: bash
workdir: /root
description: |
  **Contexte.** Les serveurs d'*Ateliers Durand* sont dans une baie au sous-sol : on les administre
  depuis le poste du service informatique, en **SSH**. Ton chef te demande de mettre en place un accès par
  clé, plus sûr et plus pratique que le mot de passe, puis de réaliser quelques opérations courantes.

  **Machines.**

  | Machine        | Rôle               | Compte SSH                   |
  |----------------|--------------------|------------------------------|
  | `admin`        | ton poste (root)   | -                            |
  | `srv-fichiers` | serveur de fichiers| `tech` / `Tech2024!` (sudo)  |
  | `srv-web`      | serveur intranet   | `tech` / `Tech2024!` (sudo)  |

  Sur ton poste : `/root/site/` (nouvelle version du site intranet) et `/root/outils/maj.sh`
  (script de maintenance).
cours: |
  ## SSH en deux mots

  **SSH** (port TCP 22) ouvre un canal **chiffré et authentifié** vers une machine distante : shell,
  commandes, copie de fichiers, tunnels. Il a remplacé Telnet et rsh qui faisaient passer les mots de passe
  en clair. Sous Linux, c'est **OpenSSH** : le client `ssh` et le serveur `sshd` ; Windows 10/11 et
  Windows Server l'intègrent aussi.

  ## Deux authentifications distinctes

  ```
  poste admin                                      srv-web
  ───────────                                      ───────
  1. Le SERVEUR prouve son identité  ◀──────────── clé d'hôte /etc/ssh/ssh_host_ed25519_key
     empreinte comparée à ~/.ssh/known_hosts
  2. L'UTILISATEUR prouve la sienne  ────────────▶ ~tech/.ssh/authorized_keys
     mot de passe, ou signature avec ~/.ssh/id_ed25519 (clé privée, ne quitte jamais le poste)
  ```

  1. **Le serveur** s'authentifie avec sa clé d'hôte. À la première connexion, le client affiche son
     empreinte et demande confirmation (*TOFU*, « trust on first use ») ; elle est ensuite mémorisée dans
     `known_hosts`. Si elle change, SSH refuse avec un gros avertissement : serveur réinstallé... ou
     attaque de l'homme du milieu. On ne supprime l'ancienne entrée (`ssh-keygen -R hôte`) qu'après avoir
     compris pourquoi.
  2. **L'utilisateur** s'authentifie par mot de passe ou par **clé** : le serveur vérifie une signature
     produite par la clé privée avec la clé publique listée dans `authorized_keys`. Aucun secret ne transite.

  ## Les fichiers à connaître

  | Fichier (côté)                         | Rôle                                                   |
  |----------------------------------------|--------------------------------------------------------|
  | `~/.ssh/id_ed25519` (client)           | clé privée, droits **600**                             |
  | `~/.ssh/id_ed25519.pub` (client)       | clé publique, à distribuer                             |
  | `~/.ssh/known_hosts` (client)          | empreintes des serveurs déjà vus                       |
  | `~/.ssh/config` (client)               | alias et options par hôte                              |
  | `~/.ssh/authorized_keys` (serveur)     | clés publiques autorisées pour ce compte (600, dossier 700) |
  | `/etc/ssh/sshd_config` (serveur)       | configuration du démon                                 |

  Exemple de `~/.ssh/config` :

  ```
  Host web
      HostName srv-web.durand.lan
      User tech
      Port 22
  Host *
      ServerAliveInterval 30
  ```

  Pour chaque option, **la première valeur trouvée gagne** : on écrit les blocs précis avant `Host *`.
  `ssh -G alias` affiche la configuration finale calculée, idéal pour vérifier.

  ## Mémo des commandes

  | Besoin                                | Commande                                            |
  |---------------------------------------|-----------------------------------------------------|
  | Se connecter                          | `ssh tech@srv-web`, `ssh -p 2222 ...`               |
  | Générer une clé                       | `ssh-keygen -t ed25519 -C "commentaire"`            |
  | Déployer sa clé publique              | `ssh-copy-id tech@srv-web`                          |
  | Empreinte d'une clé                   | `ssh-keygen -lf ~/.ssh/id_ed25519.pub`              |
  | Retrouver / oublier un hôte           | `ssh-keygen -F hôte` / `ssh-keygen -R hôte`         |
  | Commande distante                     | `ssh web 'df -h /'`                                  |
  | Commande distante avec sudo           | `ssh -t web 'sudo systemctl restart nginx'`         |
  | Copier                                | `scp fichier web:/tmp/`, `scp web:/var/log/x .`     |
  | Synchroniser                          | `rsync -avz --delete src/ web:/dest/`               |
  | Déboguer                              | `ssh -v` (puis `-vv`, `-vvv`)                        |

  ## rsync : la règle du slash final

  ```
  rsync -a site/  web:/var/www/site/    copie le CONTENU de site dans /var/www/site
  rsync -a site   web:/var/www/site/    copie le DOSSIER : crée /var/www/site/site
  ```

  `--delete` supprime à la destination ce qui n'existe plus à la source : toujours le précéder d'un
  `--dry-run` (`-n`). rsync ne transfère que les différences, ce qui le rend idéal pour publier ou
  sauvegarder.

  ## Pièges courants

  - Droits trop ouverts : sshd ignore `authorized_keys` si le dossier personnel, `~/.ssh` ou le fichier
    sont modifiables par d'autres. Le journal du serveur (`/var/log/auth.log`) le dit clairement.
  - Clé privée lisible par d'autres : le client refuse de l'utiliser (« UNPROTECTED PRIVATE KEY FILE »).
  - `sudo` à distance sans `-t` : pas de terminal pour taper le mot de passe.
  - Guillemets : `ssh web "echo $HOME"` est développé **localement**, `ssh web 'echo $HOME'` sur le serveur.

  ## Bonnes pratiques en entreprise

  - Clés **ed25519** protégées par une passphrase, chargées dans `ssh-agent` ; une clé par personne.
  - Côté serveur : `PermitRootLogin no`, `PasswordAuthentication no` une fois les clés en place,
    `AllowGroups` pour restreindre les comptes autorisés.
  - Révoquer l'accès d'un partant = retirer sa clé de tous les `authorized_keys` : d'où l'intérêt d'un
    inventaire des clés (ou d'une gestion centralisée par Ansible, un bastion ou des certificats SSH).
  - Vérifier l'empreinte d'un nouveau serveur par un autre canal (console, documentation).
