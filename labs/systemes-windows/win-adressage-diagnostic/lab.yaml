title: Adressage IP et diagnostic réseau sous Windows
level: debutant
order: 3
tags: [windows, windows 11, réseau, ipconfig, dns, ping, arp, route, pare-feu, powershell]
summary: Configurer la carte réseau d'un poste Windows 11 et diagnostiquer pas à pas - IP, DNS, ping, ports, ARP, routes et profil réseau.
vagrant: bundled
machine: pc01
description: |
  **Contexte.** Le poste `PC01` de l'accueil vient d'être réinstallé et n'a plus de réseau. Tu dois le
  reconfigurer, puis traiter une série de petits tickets réseau, avec les outils du technicien :
  `ipconfig`, `ping`, `tracert`, `nslookup`, `netstat`, `arp`, `route`... et leurs équivalents
  PowerShell.

  **Machines** (prévoir **8 Go de RAM libres**) :

  | VM | Système | Rôle | Adresse LAN |
  |----|---------|------|-------------|
  | `PC01` (terminal) | Windows 11 (3 Go) | poste à dépanner | **à configurer** |
  | `SRV01` | Windows Server 2022 (2 Go) | DNS de `durand.lan`, intranet (IIS) | 192.168.10.10 |

  Plan d'adressage du réseau `192.168.10.0/24` : passerelle `192.168.10.254`, DNS `192.168.10.10`,
  postes `.101` à `.199`. Le routeur n'existe pas dans le lab (et Internet n'y est pas nécessaire :
  Vagrant garde sa propre carte `NAT`, ne la modifie pas). La carte à configurer s'appelle **`LAN`**.

  Ton terminal est sur PC01. Les vérifications marquées « depuis SRV01 » s'exécutent sur le serveur.
cours: |
  ## La configuration IP d'un poste

  Pour communiquer, une carte réseau a besoin de quatre informations :

  | Paramètre | Exemple | Rôle |
  |-----------|---------|------|
  | Adresse IPv4 | 192.168.10.101 | identifie le poste sur le réseau |
  | Masque / préfixe | 255.255.255.0 = /24 | délimite le réseau local |
  | Passerelle par défaut | 192.168.10.254 | routeur pour sortir du réseau |
  | Serveurs DNS | 192.168.10.10 | traduisent les noms en adresses |

  Elle les reçoit d'un serveur **DHCP** ou on les fixe à la main (serveurs, imprimantes, et ici un
  poste de lab). Sans DHCP ni adresse fixe, Windows s'attribue une adresse **APIPA** `169.254.x.x` : le
  symptôme classique d'un « pas de réseau ».

  ## Outils : historique et PowerShell

  | Besoin | Commande historique | PowerShell |
  |--------|---------------------|------------|
  | Voir la configuration | `ipconfig /all` | `Get-NetIPConfiguration`, `Get-NetIPAddress` |
  | Fixer une adresse | `netsh interface ipv4 set address` | `New-NetIPAddress`, `Set-DnsClientServerAddress` |
  | Renouveler / vider le cache DNS | `ipconfig /renew`, `/flushdns` | `Clear-DnsClientCache` |
  | Tester la connectivité | `ping`, `tracert`, `pathping` | `Test-Connection`, `Test-NetConnection -TraceRoute` |
  | Tester un port TCP | `telnet hôte 80` | `Test-NetConnection hôte -Port 80` |
  | Interroger le DNS | `nslookup` | `Resolve-DnsName` |
  | Ports en écoute | `netstat -ano` | `Get-NetTCPConnection -State Listen` |
  | Cache ARP | `arp -a` | `Get-NetNeighbor` |
  | Table de routage | `route print` | `Get-NetRoute`, `New-NetRoute` |

  Les cartes se désignent par leur **alias** (`LAN`, `Ethernet`, `Wi-Fi`) ou leur **index**
  (`Get-NetAdapter`). Interface graphique : `ncpa.cpl` (Connexions réseau), puis *Propriétés* ›
  *Protocole Internet version 4*.

  ```powershell
  New-NetIPAddress -InterfaceAlias LAN -IPAddress 192.168.10.101 -PrefixLength 24 -DefaultGateway 192.168.10.254
  Set-DnsClientServerAddress -InterfaceAlias LAN -ServerAddresses 192.168.10.10
  Get-NetIPConfiguration -InterfaceAlias LAN
  ```

  ## Méthode de diagnostic : du bas vers le haut

  ```
  1. La carte est-elle connectée ?          Get-NetAdapter (Status Up)
  2. Ai-je une adresse correcte ?           ipconfig  (169.254 = pas de DHCP)
  3. Je joins ma passerelle / un voisin ?   ping 192.168.10.10
  4. Le DNS répond-il ?                     Resolve-DnsName intranet.durand.lan
  5. Le service répond-il ?                 Test-NetConnection intranet -Port 80
  ```

  On ne saute pas d'étape : un « Internet ne marche pas » est souvent un DNS mal saisi, et un « le
  serveur ne répond pas au ping » un simple pare-feu.

  ## DNS côté client

  Ordre de résolution d'un nom : cache DNS du poste (`Get-DnsClientCache`), fichier **hosts**
  (`C:\Windows\System32\drivers\etc\hosts`), serveurs DNS de la carte, puis LLMNR/NetBIOS pour les
  noms courts. Le **suffixe DNS** permet de taper `intranet` au lieu de `intranet.durand.lan`.
  Types d'enregistrements : **A** (nom → IPv4), **CNAME** (alias), **MX** (serveur de messagerie),
  **PTR** (adresse → nom, zone inverse).

  ## Pare-feu et profils réseau

  Le pare-feu Windows Defender applique des règles selon le **profil** de la connexion : *Domaine*,
  *Privé* ou *Public* (le plus fermé : pas de découverte réseau, pas de partage, pas de ping). Un
  réseau d'entreprise mal classé en *Public* explique bien des tickets. Par défaut, Windows ne répond
  **pas** au ping (ICMPv4 Echo Request entrant bloqué).

  ## Pièges courants

  - Ajouter une seconde adresse au lieu de remplacer l'ancienne (`New-NetIPAddress` sur une carte déjà
    configurée) : supprimer d'abord avec `Remove-NetIPAddress`, ou repasser en DHCP.
  - Oublier le DNS : le ping par adresse marche, mais rien ne fonctionne par nom.
  - Tester avec `ping` un serveur qui bloque ICMP et conclure à une panne : tester le **port** du service.
  - Modifier la mauvaise carte (ici `NAT`, celle de Vagrant : tu perdrais le terminal).
