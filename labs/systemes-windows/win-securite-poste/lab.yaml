title: Sécuriser un poste Windows 11
level: intermediaire
order: 9
tags: [windows 11, sécurité, defender, pare-feu, bitlocker, uac, audit, stratégie de mots de passe, durcissement]
summary: Remettre d'aplomb un poste compromis par de mauvaises pratiques - Defender, pare-feu et journalisation, mots de passe et verrouillage, audit, comptes intégrés, UAC, exécution automatique et chiffrement BitLocker.
vagrant: bundled
machine: pc01
description: |
  **Contexte.** Le portable `PC01` revient de chez un prestataire qui l'a « optimisé ». Avant de le rendre au
  commercial qui part en clientèle avec les contrats sur son disque `V:`, tu dois le **durcir** : chaque
  réglage dangereux laissé par le prestataire doit être retrouvé et corrigé, et les protections de base
  activées.

  **Machine.** `PC01`, Windows 11, hors domaine (les réglages se font en **stratégie locale**, comme sur un
  poste isolé ; en entreprise, on les déploierait par GPO). Terminal PowerShell administrateur. Le disque
  `V:` (« COFFRE », 1 Go) contient les contrats clients.
cours: |
  ## Défense en profondeur

  Aucun réglage ne protège seul. On empile des couches indépendantes, pour qu'une défaillance de l'une soit
  rattrapée par une autre :

  | Couche | Outil Windows | Protège contre |
  |--------|---------------|----------------|
  | Logiciels malveillants | **Microsoft Defender Antivirus** | fichiers et comportements malveillants connus |
  | Réseau | **Pare-feu Windows Defender** | connexions entrantes non sollicitées, mouvements latéraux |
  | Comptes | stratégie de mots de passe, verrouillage, comptes intégrés désactivés | devinette, force brute |
  | Privilèges | **UAC**, utilisateur standard au quotidien | élévation silencieuse d'un programme |
  | Données au repos | **BitLocker** | vol ou perte du portable, disque retiré |
  | Traçabilité | **stratégie d'audit**, journaux | attaques non détectées, enquêtes impossibles |
  | Surface d'attaque | exécution automatique coupée, services inutiles arrêtés | clé USB piégée |

  ## Microsoft Defender

  Intégré à Windows, il suffit largement à un poste bien tenu, à condition de rester **actif et à jour**.
  Points de contrôle : protection en temps réel, protection cloud, signatures récentes, protection contre
  les applications potentiellement indésirables (**PUA**), et surtout les **exclusions** : un dossier ou un
  processus exclu est un angle mort, que les logiciels malveillants adorent créer. Commandes :
  `Get-MpComputerStatus`, `Get-MpPreference`, `Update-MpSignature`, `Start-MpScan`, `Remove-MpPreference`.

  ## Pare-feu

  Trois **profils** : *Domaine* (réseau de l'entreprise détecté), *Privé* (réseau de confiance), *Public*
  (le reste : hôtel, gare, salon). Un portable passe sa vie en *Public* : ce profil doit être **actif** et
  bloquer l'entrant par défaut. Toute règle entrante doit avoir une raison documentée. La **journalisation**
  des paquets rejetés aide à diagnostiquer et à repérer un balayage de ports.

  ## Comptes et mots de passe

  Sur un poste hors domaine, la **stratégie de sécurité locale** (`secpol.msc`, ou `net accounts` et
  `secedit`) fixe la longueur minimale et le **verrouillage** après N échecs. Les comptes intégrés
  **Invité** (SID terminé par -501) et **Administrateur** (-500) sont des cibles connues de tous : on les
  désactive (l'administrateur intégré n'est pas soumis au verrouillage ni à l'UAC). Pour les comptes
  administrateurs locaux d'un parc, **Windows LAPS** génère un mot de passe unique par poste.

  ## Contrôle de compte d'utilisateur (UAC)

  Même un administrateur travaille avec un jeton **standard** ; l'élévation demande une confirmation sur le
  **bureau sécurisé** (l'écran assombri, inaccessible aux autres programmes). Régler l'UAC sur « ne jamais
  m'avertir » permet à n'importe quel programme lancé par l'utilisateur de devenir administrateur en
  silence. Clés : `EnableLUA`, `ConsentPromptBehaviorAdmin`, `PromptOnSecureDesktop` sous
  `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System`.

  ## Audit

  La **stratégie d'audit avancée** (`auditpol`) choisit les événements écrits dans le journal *Sécurité* :
  ouvertures de session réussies et échouées (4624, 4625), verrouillages (4740), gestion des comptes (4720
  création, 4732 ajout à un groupe local)... Sans audit, impossible de savoir qui a fait quoi après un
  incident. On n'active pas tout : un journal noyé est aussi inutile qu'un journal vide.

  ## BitLocker

  BitLocker chiffre un volume entier. Sur le disque système, il s'appuie sur la puce **TPM** (déverrouillage
  transparent si le démarrage n'a pas été modifié). Un volume de **données** peut être protégé par mot de
  passe, carte à puce ou déverrouillage automatique. Dans tous les cas, on sauvegarde la **clé de
  récupération** (48 chiffres) **ailleurs** que sur le disque chiffré : dans Active Directory ou Entra ID en
  entreprise, sinon dans un coffre-fort de mots de passe. Sans elle, une panne de TPM ou un mot de passe
  oublié signifie la perte définitive des données.

  ## Vérifier son travail

  `Get-MpComputerStatus`, `Get-NetFirewallProfile`, `secedit /export`, `auditpol /get /category:*`,
  `Get-LocalUser`, `Get-BitLockerVolume` et `manage-bde -status`. Les référentiels de durcissement (guides
  de l'ANSSI, références de sécurité Microsoft, CIS Benchmarks) listent des centaines de réglages : ceux de
  ce lab sont le socle.
