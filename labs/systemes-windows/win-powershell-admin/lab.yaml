title: PowerShell pour l'administrateur Windows
level: debutant
order: 8
tags: [windows, powershell, scripts, csv, comptes, module, registre, rapport, automatisation]
summary: Écrire de vrais scripts d'administration Windows - découverte, pipeline, fonctions et paramètres, import CSV de comptes, gestion d'erreurs, module, registre, rapport HTML.
vagrant: bundled
extra_commands: [Get-EspaceDisque]
description: |
  **Contexte.** Chez *Ateliers Durand*, le service RH envoie chaque mois un fichier des arrivées et la
  direction veut un rapport hebdomadaire sur les serveurs. Ton responsable te demande d'arrêter les
  clics répétitifs et d'**écrire des scripts PowerShell** propres, réutilisables et planifiés.

  **Machine.** Une VM Windows Server 2022 (2 Go de RAM), **Windows PowerShell 5.1**. Terminal en
  administrateur.

  | Chemin | Contenu |
  |--------|---------|
  | `C:\Scripts\Donnees\nouveaux.csv` | arrivées du mois (séparateur `;`, UTF-8, accents) |
  | `C:\Scripts\Donnees\serveurs.txt` | serveurs à tester (dont un qui n'existe pas) |
  | `C:\Scripts\Telecharge\outil.ps1` | script envoyé par un prestataire |
  | `C:\Scripts\Sortie` | tes résultats |

  Écris tes scripts dans `C:\Scripts`. Éditeur : `notepad`, ou **PowerShell ISE** (`powershell_ise`) par
  le Bureau à distance ; dans le terminal, `Set-Content` avec une chaîne `@' ... '@` fonctionne aussi.
cours: |
  ## Des objets, pas du texte

  PowerShell manipule des **objets .NET** : `Get-Service` renvoie des objets `ServiceController` avec des
  propriétés (`Status`, `StartType`) et des méthodes (`Stop()`). Le **pipeline** `|` passe ces objets
  d'une commande à l'autre, sans découpage de texte :

  ```powershell
  Get-Service | Where-Object { $_.StartType -eq 'Automatic' -and $_.Status -ne 'Running' } |
    Select-Object Name, DisplayName | Export-Csv C:\Scripts\Sortie\ko.csv -Delimiter ';' -NoTypeInformation
  ```

  Trois commandes pour tout découvrir seul : `Get-Command *LocalUser*` (quelles commandes ?),
  `Get-Help New-LocalUser -Examples` (comment ?), `Get-Service | Get-Member` (quels types, quelles
  propriétés ?). Les verbes sont normalisés (`Get-Verb`) : Get, Set, New, Remove, Add, Test, Start...

  ## Scripts, paramètres et fonctions

  ```powershell
  # C:\Scripts\New-Login.ps1
  param(
      [Parameter(Mandatory)][string]$Prenom,
      [Parameter(Mandatory)][string]$Nom
  )
  $texte = ($Prenom.Substring(0, 1) + $Nom).Normalize([Text.NormalizationForm]::FormD)
  ($texte -replace '\p{Mn}', '' -replace '[^a-zA-Z]', '').ToLower()
  ```

  Un script se lance par son chemin (`& C:\Scripts\New-Login.ps1 -Prenom Élodie -Nom 'Le Gall'`) ; une
  **fonction** (`function Get-EspaceDisque { param(...) ... }`) se définit dans un script ou un
  **module** (`.psm1`) rangé dans `C:\Program Files\WindowsPowerShell\Modules\<Nom>\` pour être chargé
  automatiquement. Une fonction **renvoie** tout ce qu'elle produit (pas besoin de `return`) : de
  préférence des objets (`[pscustomobject]@{ ... }`), que l'appelant formatera ou exportera.

  ## Stratégie d'exécution

  La **stratégie d'exécution** (`Get-ExecutionPolicy -List`) n'est pas une sécurité mais un garde-fou :
  `RemoteSigned` (défaut sur Windows Server) exécute les scripts locaux, mais exige une signature pour
  ceux qui viennent d'Internet — reconnus par le flux NTFS `Zone.Identifier` ajouté par le navigateur ou
  la messagerie. Après vérification du contenu, `Unblock-File` retire cette marque.

  ## Gestion d'erreurs

  - Erreur **non bloquante** (la plupart des cmdlets) : un message rouge, puis le script continue.
  - Erreur **bloquante** : le script s'arrête, sauf dans un `try { } catch { }`.
  - `-ErrorAction Stop` rend une erreur bloquante, donc attrapable ; `-ErrorAction SilentlyContinue`
    l'ignore (pratique pour tester une existence).

  ```powershell
  foreach ($nom in Get-Content C:\Scripts\Donnees\serveurs.txt) {
      try {
          $ok = Test-Connection $nom -Count 1 -Quiet -ErrorAction Stop
      } catch {
          Write-Warning "$nom : $($_.Exception.Message)" ; $ok = $false
      }
      [pscustomobject]@{ Nom = $nom; Joignable = $ok }
  }
  ```

  ## Fichiers : encodages et formats

  Windows PowerShell 5.1 écrit en UTF-16 avec `>` et `Out-File`, en ANSI avec `Set-Content`, et lit en
  ANSI les fichiers **sans BOM**. Toujours préciser `-Encoding UTF8`. `Import-Csv -Delimiter ';'` /
  `Export-Csv -Delimiter ';' -NoTypeInformation` pour les fichiers échangés avec Excel français,
  `ConvertTo-Html` pour un rapport lisible, `Export-Clixml` pour sauvegarder des objets à recharger.

  ## Pièges courants

  - Tester un script directement en production : utiliser `-WhatIf` et un jeu d'essai.
  - Ne pas rendre un script **idempotent** (le relancer doit être sans danger : vérifier l'existence avant
    de créer).
  - Afficher avec `Write-Host` ou `Format-Table` dans une fonction : on perd les objets.
  - Oublier les guillemets simples autour des chaînes contenant `$`.
