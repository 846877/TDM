    url: https://learn.microsoft.com/fr-fr/powershell/scripting/learn/ps101/00-introduction
  - title: À propos des stratégies d'exécution
    url: https://learn.microsoft.com/fr-fr/powershell/module/microsoft.powershell.core/about/about_execution_policies
