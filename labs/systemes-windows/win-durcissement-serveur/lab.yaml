title: Durcissement d'un serveur Windows
level: expert
order: 5
tags: [durcissement, sécurité, applocker, journalisation, powershell, lsa, wdigest, llmnr, smb, tls, audit, ntlm]
summary: Appliquer une base de sécurité à un serveur - AppLocker (exécutables et scripts), journalisation PowerShell, protection de la LSA, protocoles réseau hérités, TLS, audit avancé, NTLM et services inutiles.
vagrant: bundled
machine: srv01
description: |
  **Contexte.** Le nouveau serveur d'applications des *Ateliers Durand* doit passer l'audit de sécurité
  demandé par l'assureur cyber. Le rapport de l'auditeur liste une dizaine d'écarts par rapport aux
  recommandations (guides de l'ANSSI, base de sécurité Microsoft, CIS). Corrige-les un par un, en
  comprenant **quelle attaque** chaque réglage empêche.

  **Machine** : `SRV01` (terminal), Windows Server 2022 autonome (2 Go), adresse LAN 192.168.10.10.

  Sur un serveur du domaine, ces réglages seraient appliqués par GPO (et vérifiés par l'outil d'analyse
  de la base de sécurité) ; ici, on les règle localement pour bien voir chaque valeur. Plusieurs ne
  prennent effet qu'au **redémarrage** : redémarre à la fin du lab.
cours: |
  ## Réduire la surface d'attaque, augmenter la visibilité

  Durcir un serveur, c'est appliquer deux principes : **réduire ce qu'un attaquant peut faire** (services
  inutiles, protocoles hérités, exécution de programmes arbitraires, vol d'identifiants) et **voir ce qu'il
  fait** (audit, journalisation PowerShell, journaux assez grands). Les recommandations existent déjà :
  base de sécurité Microsoft (*Security Compliance Toolkit*), guides de l'ANSSI, CIS Benchmarks. On les
  applique par GPO, on documente les exceptions, et on vérifie régulièrement l'écart.

  ## Contrôler ce qui s'exécute : AppLocker

  **AppLocker** autorise ou refuse l'exécution par **règles** (chemin, éditeur signataire, empreinte),
  par type de fichier (exécutables, scripts, installateurs, DLL, applications empaquetées) et par
  utilisateur ou groupe. Les **règles par défaut** autorisent `%WINDIR%` et `%PROGRAMFILES%` pour tous
  (dossiers où un utilisateur ne peut pas écrire) et tout pour les administrateurs : un programme déposé
  dans `C:\Users\...` ou `C:\Users\Public` ne s'exécute plus. Chaque collection a un **mode** : *audit
  seulement* (journalise ce qui serait bloqué, pour préparer le déploiement) ou *appliquer*. Le service
  **Identité de l'application** (`AppIDSvc`) doit tourner pour que les règles soient appliquées. Quand les
  règles de scripts sont appliquées, PowerShell passe en mode de langage **restreint** pour les
  utilisateurs non autorisés. WDAC (*App Control for Business*) est l'alternative plus robuste, au niveau
  du noyau.

  ## Protéger les identifiants

  Les outils comme Mimikatz lisent les secrets dans la mémoire du processus **LSASS**. Deux réglages
  limitent les dégâts : **LSA protégée** (`RunAsPPL`), qui interdit aux processus non protégés de lire
  LSASS, et la désactivation du stockage en clair de **WDigest** (`UseLogonCredential` = 0). Côté réseau,
  **NTLMv1** et les condensats **LM** sont cassables en quelques secondes : niveau d'authentification
  LAN Manager à 5 (NTLMv2 uniquement) et pas de stockage LM.

  ## Couper les protocoles hérités

  **LLMNR** et **NetBIOS** répondent aux résolutions de noms ratées par diffusion : un attaquant sur le
  réseau local répond à la place du vrai serveur et récupère des condensats (Responder). **SMB** sans
  signature permet les attaques par relais ; SMBv1 est à bannir. **SSL 3.0** et **TLS 1.0** sont
  obsolètes ; les applications .NET doivent utiliser les protocoles du système (`SchUseStrongCrypto`).

  ## Voir : audit et journalisation

  La **stratégie d'audit avancée** (sous-catégories) enregistre les ouvertures de session (4624, 4625),
  la validation des identifiants (4776) et la création de processus (4688), avec la **ligne de commande**
  si on l'active. La **journalisation des blocs de script** (4104) enregistre le code PowerShell
  réellement exécuté, même obfusqué, et la **transcription** garde une copie texte des sessions. Encore
  faut-il un journal *Security* assez grand pour couvrir quelques jours, et une collecte centrale.

  ## Moins de services

  Chaque service est une surface d'attaque : le **spouleur d'impression** (PrintNightmare) n'a rien à faire
  démarré sur un serveur qui n'imprime pas, et encore moins sur un contrôleur de domaine.
