title: Routage et NAT avec RRAS
level: avance
order: 3
tags: [rras, routage, nat, remote access, netsh, route statique, redirection de port, réseau]
summary: Transformer un Windows Server en routeur NAT - rôle Accès à distance, routage, NAT entre LAN et Internet, passerelle des postes, route statique, redirection de port et sauvegarde de la configuration.
vagrant: bundled
machine: rtr01
description: |
  **Contexte.** L'atelier de Villeurbanne des *Ateliers Durand* ouvre avant l'arrivée de son routeur. En
  attendant, un Windows Server avec deux cartes réseau doit partager l'accès Internet : c'est le rôle
  **Routage et accès distant** (RRAS). Le poste `PC01` n'a pour l'instant **aucune** route vers Internet.

  **Machines** (prévoir **6 Go de RAM libres**) :

  | VM | Système | Cartes | Rôle |
  |----|---------|--------|------|
  | `SRV-RTR01` (terminal) | Windows Server 2022 (2 Go) | `LAN` 192.168.10.254/24, `NAT` (DHCP VirtualBox, accès Internet) | futur routeur NAT |
  | `PC01` | Windows 11 (3 Go) | `LAN` 192.168.10.101/24, sans passerelle | poste de l'atelier |

  Les machines sont en **groupe de travail**. SRV-RTR01 fait déjà confiance à PC01 pour WinRM : pour agir
  sur le poste, `$cred = Get-Credential PC01\vagrant` (mot de passe `vagrant`) puis
  `Invoke-Command -ComputerName 192.168.10.101 -Credential $cred { ... }`. La carte `NAT` de PC01 sert
  seulement à la gestion par Vagrant : sa route par défaut a été retirée.
cours: |
  ## Un serveur Windows peut-il être un routeur ?

  Oui : il suffit d'activer le **transfert IP** entre ses cartes. Le service **Routage et accès distant**
  (RRAS, rôle *Accès à distance*, service de rôle *Routage*) va plus loin : protocoles de routage, filtres de
  paquets, **NAT**, VPN. On ne remplace pas un vrai routeur ou pare-feu par un Windows Server en
  production, mais RRAS dépanne une petite structure, sert de passerelle de laboratoire, ou relie des
  réseaux virtuels. Comprendre RRAS, c'est surtout comprendre le routage IP lui-même.

  ## La table de routage

  Chaque machine IP choisit la sortie d'un paquet dans sa **table de routage** : la route la plus
  **spécifique** gagne (plus long préfixe), puis la plus faible **métrique**. La **route par défaut**
  `0.0.0.0/0` sert pour tout le reste ; sa passerelle doit être sur un réseau directement connecté. Un
  routeur doit connaître le chemin **retour** : soit les réseaux derrière lui sont directement connectés,
  soit on ajoute des **routes statiques** (ou un protocole de routage). Côté PowerShell : `Get-NetRoute`,
  `New-NetRoute`, `Find-NetRoute -RemoteIPAddress` (quelle route sera choisie ?).

  ## Le NAT

  Les adresses privées (RFC 1918 : 10/8, 172.16/12, 192.168/16) ne sont pas routées sur Internet. Le
  **NAT** (plus exactement NAPT, ou *masquerading*) remplace l'adresse source privée par l'adresse publique
  de l'interface Internet du routeur et mémorise la correspondance (adresse, port) pour renvoyer les
  réponses. Dans RRAS, chaque interface du NAT a un **mode** : *publique* connectée à Internet (`full`, avec
  traduction d'adresses) ou *privée* (le LAN). Pour qu'un serveur interne soit joignable de l'extérieur, on
  ajoute une **redirection de port** (*port mapping*) : port public de l'interface Internet → adresse et port
  internes.

  ## Outils

  - `Install-WindowsFeature Routing` puis `Install-RemoteAccess -VpnType RoutingOnly` : installe et active
    le routage ; la console `rrasmgmt.msc` offre un assistant pour le NAT.
  - `netsh routing ip nat ...` : configure le NAT en ligne de commande (le module PowerShell `RemoteAccess`
    gère surtout le VPN et DirectAccess) ; `netsh routing dump` exporte toute la configuration.
  - Sur le poste : `tracert -d` montre chaque routeur traversé, `Test-NetConnection -Port 443` teste une
    connexion TCP sans dépendre de l'ICMP, souvent filtré.

  Dans ce lab, l'« Internet » est la carte NAT de VirtualBox : le trafic de PC01 sera donc traduit deux
  fois (par RRAS puis par VirtualBox), exactement comme derrière une box Internet.
