title: Comptes et groupes locaux, UAC et stratégie locale
level: debutant
order: 1
tags: [windows, windows server, comptes, groupes, mots de passe, uac, stratégie locale, powershell]
summary: Créer les comptes et groupes locaux d'un serveur, appliquer la politique de mots de passe, régler l'UAC et traiter un départ.
vagrant: bundled
description: |
  **Contexte.** Tu es technicien systèmes et réseaux chez *Ateliers Durand* (35 salariés). Un serveur
  **Windows Server 2022** autonome (hors domaine), `SRV01`, vient d'être livré pour l'atelier : avant de
  le mettre en production, il faut y créer les comptes locaux, appliquer la politique de sécurité de
  l'entreprise et nettoyer ce que le prestataire a laissé (dont le compte d'un salarié parti).

  **Machine.** Une VM Windows Server 2022 (2 Go de RAM, ≈ 15 Go de disque pour la box). Le terminal
  ouvre **Windows PowerShell 5.1** en administrateur (`vagrant`). Interface graphique : bouton
  *Afficher* dans VirtualBox ou `mstsc /v:127.0.0.1:33389` (vagrant / vagrant), puis
  `lusrmgr.msc`, `secpol.msc`, `netplwiz`.

  Cmdlets utiles : `Get-LocalUser`, `New-LocalUser`, `Set-LocalUser`, `Disable-LocalUser`,
  `Get-LocalGroup`, `New-LocalGroup`, `Add-LocalGroupMember`, `Remove-LocalGroupMember`,
  `Get-LocalGroupMember`, et les commandes historiques `net user`, `net localgroup`, `net accounts`.

  ⚠️ Les VM sont en anglais : le groupe *Administrateurs* d'un Windows français s'appelle ici
  **Administrators** (SID `S-1-5-32-544`), *Utilisateurs* s'appelle **Users** (`S-1-5-32-545`).
cours: |
  ## Comptes locaux et comptes de domaine

  Chaque Windows possède sa propre base de comptes, la **SAM** (*Security Account Manager*), stockée
  dans le registre (`HKLM\SAM`). Un **compte local** n'existe que sur cette machine : `SRV01\mdupont`
  n'a rien à voir avec `PC01\mdupont`. Dans une entreprise avec Active Directory, les salariés utilisent
  des **comptes de domaine** (`DURAND\mdupont`) ; les comptes locaux restent pourtant indispensables :
  serveur hors domaine (DMZ, atelier), compte de secours, administrateur local des postes, comptes de
  service.

  ```
  SRV01 (SAM locale)                    Contrôleur de domaine (base AD)
  ├── Administrator  (SID ...-500)      ├── DURAND\mdupont
  ├── Guest          (SID ...-501)      └── DURAND\Admins du domaine
  ├── vagrant
  └── groupes : Administrators, Users, Remote Desktop Users...
  ```

  Windows ne raisonne pas avec les noms mais avec les **SID** (*Security Identifier*) : `S-1-5-21-…-1001`
  pour un compte créé, `S-1-5-32-544` pour le groupe intégré *Administrators* quelle que soit la langue.
  Renommer un compte ne change pas son SID ; supprimer puis recréer un compte du même nom donne un
  **nouveau** SID, qui perd tous les droits de l'ancien (NTFS, partages...). D'où la règle : on
  **désactive** d'abord un compte, on ne le supprime qu'après archivage.

  ## Outils

  | Tâche | Graphique | PowerShell | Historique |
  |-------|-----------|------------|------------|
  | Utilisateurs et groupes | `lusrmgr.msc` (Gestion de l'ordinateur) | `New-LocalUser`, `Add-LocalGroupMember` | `net user`, `net localgroup` |
  | Stratégie de mots de passe | `secpol.msc` › Stratégies de comptes | `secedit /export` (lecture) | `net accounts` |
  | UAC | Panneau de configuration › Comptes d'utilisateurs | registre `HKLM:\...\Policies\System` | |

  ```powershell
  $mdp = Read-Host 'Mot de passe' -AsSecureString
  New-LocalUser mdupont -FullName 'Marie Dupont' -Description 'Comptabilité' -Password $mdp
  Add-LocalGroupMember -Group Compta -Member mdupont
  Get-LocalGroupMember -SID S-1-5-32-544          # membres des Administrateurs
  ```

  Les mots de passe se manipulent en **SecureString** : `ConvertTo-SecureString 'xxx' -AsPlainText -Force`
  est pratique en lab mais laisse le mot de passe en clair dans l'historique (`Get-History`, fichier
  PSReadLine) : en production, `Read-Host -AsSecureString`.

  ## Groupes intégrés à connaître

  - **Administrators** : contrôle total de la machine. Le moins de membres possible.
  - **Users** : utilisateurs standard (ouvrir une session, lancer des programmes).
  - **Remote Desktop Users** : ouverture de session par le Bureau à distance.
  - **Remote Management Users** : accès WinRM / PowerShell Remoting sans être administrateur.
  - **Backup Operators**, **Event Log Readers**... : délégations ciblées.

  On applique le **principe du moindre privilège** : un salarié n'est jamais administrateur ; le
  technicien utilise un compte nominatif, distinct de son compte bureautique.

  ## Stratégie de mots de passe et verrouillage

  Dans `secpol.msc` › *Stratégies de comptes* (ou `net accounts`) : longueur minimale, durée de vie
  maximale, historique (interdit de réutiliser les N derniers), complexité, et **verrouillage** après N
  échecs pendant X minutes. L'ANSSI recommande des mots de passe longs (12 caractères et plus) plutôt
  que des changements trop fréquents. Sur un poste du domaine, ces réglages viennent de la GPO du
  domaine et écrasent la stratégie locale.

  ## Contrôle de compte d'utilisateur (UAC)

  Même membre d'*Administrators*, un utilisateur ouvre sa session avec un **jeton filtré** (droits
  standard). L'élévation (« Exécuter en tant qu'administrateur ») affiche une invite sur le **bureau
  sécurisé**. Réglages dans `HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System` :
  `EnableLUA` (1 = UAC actif, ne jamais le désactiver), `ConsentPromptBehaviorAdmin` (5 = par défaut,
  2 = toujours demander), `PromptOnSecureDesktop` (1 = bureau sécurisé).

  ## Pièges courants

  - Ouvrir PowerShell **sans** élévation : `Access denied` sur `New-LocalUser`.
  - Oublier que `Get-LocalGroupMember` affiche `SRV01\mdupont` (nom préfixé par la machine).
  - Cocher « le mot de passe n'expire jamais » pour les comptes humains.
  - Supprimer un compte au lieu de le désactiver, et perdre les droits associés.
  - Utiliser le compte *Administrator* intégré au quotidien : on le renomme, on lui donne un mot de passe
    fort et on travaille avec des comptes nominatifs.
