title: Stratégies de groupe (GPO) - les bases
level: intermediaire
order: 4
tags: [active directory, gpo, stratégie de groupe, gpmc, mots de passe, filtrage, héritage, préférences, gpresult]
summary: Configurer le parc par GPO - stratégie de mots de passe, restrictions utilisateur, fond d'écran, message légal, filtrage de sécurité, héritage, lecteur réseau, vérification et sauvegarde.
vagrant: bundled
machine: dc01
description: |
  **Contexte.** Chez *Ateliers Durand*, chaque poste est configuré à la main... et différemment. La direction
  veut des règles communes : mots de passe solides, poste verrouillé pour les postes partagés de l'atelier,
  fond d'écran de l'entreprise, message légal à l'ouverture de session, lecteur commun.

  **Machines** (prévoir **8 Go de RAM libres**) :

  | VM | Système | Adresse LAN | Rôle |
  |----|---------|-------------|------|
  | `SRV-DC01` (terminal) | Windows Server 2022 (2 Go) | 192.168.10.10 | contrôleur de domaine, console GPMC |
  | `PC01` | Windows 11 (3 Go) | 192.168.10.101 | poste joint au domaine, dans l'OU `Postes` |

  L'annuaire contient l'arborescence `Ateliers Durand` (`Utilisateurs\Direction|Compta|Atelier`, `Groupes`,
  `Postes`), les groupes `GG_Direction`, `GG_Compta`, `GG_Atelier` et quelques comptes (mot de passe
  `Bienvenue2024!`). Le module PowerShell `GroupPolicy` est disponible ; la console `gpmc.msc` aussi, en
  Bureau à distance sur SRV-DC01 (compte `DURAND\vagrant`, mot de passe `vagrant`). Pour agir sur PC01 :
  `Invoke-Command -ComputerName PC01 { ... }`.
cours: |
  ## Qu'est-ce qu'une GPO ?

  Un **objet de stratégie de groupe** est un ensemble de réglages stocké à deux endroits : un objet dans
  l'annuaire (`CN={GUID},CN=Policies,CN=System,DC=durand,DC=lan`, le *conteneur*) et un dossier dans
  `\\durand.lan\SYSVOL\durand.lan\Policies\{GUID}` (le *modèle* : fichiers `Registry.pol`, `GptTmpl.inf`,
  scripts, XML des préférences). Chaque GPO a deux parties :

  - **Configuration ordinateur** : appliquée au démarrage puis toutes les 90 minutes (± 30) au compte
    d'ordinateur, quel que soit l'utilisateur ;
  - **Configuration utilisateur** : appliquée à l'ouverture de session puis périodiquement, quel que soit le
    poste.

  Une GPO ne fait rien tant qu'elle n'est pas **liée** à un site, au domaine ou à une OU. Elle s'applique
  alors aux objets (utilisateurs ou ordinateurs) de ce conteneur et de ses sous-OU.

  ## Stratégies et préférences

  | | Stratégies (*Policies*) | Préférences (*Preferences*) |
  |---|---|---|
  | Contenu | modèles d'administration (registre), sécurité, scripts | lecteurs, imprimantes, raccourcis, registre, fichiers... |
  | Effet | **imposé**, grisé pour l'utilisateur | valeur **initiale**, modifiable par l'utilisateur (sauf option) |
  | Retrait de la GPO | le réglage disparaît | le réglage reste (« tatouage ») sauf option contraire |

  ## L'ordre d'application : LSDOU

  **L**ocal → **S**ite → **D**omaine → **O**U (de la plus haute à la plus profonde). En cas de conflit, la
  **dernière appliquée gagne** : une GPO liée à l'OU `Atelier` l'emporte sur une GPO du domaine. Deux
  mécanismes modifient cet ordre :

  - **Bloquer l'héritage** sur une OU : les GPO des niveaux supérieurs ne s'y appliquent plus ;
  - **Appliqué** (*Enforced*) sur un lien : la GPO passe même à travers un blocage et gagne les conflits.

  À utiliser avec parcimonie : ils rendent le résultat difficile à prévoir.

  ## Qui reçoit la GPO ? Le filtrage

  Par défaut, *Utilisateurs authentifiés* a les droits **Lire** et **Appliquer la stratégie de groupe**. Pour
  cibler un groupe, on retire *Appliquer* aux utilisateurs authentifiés (en **gardant la lecture**, exigée
  depuis le correctif MS16-072, sinon la GPO ne s'applique plus du tout) et on donne *Lire* + *Appliquer* au
  groupe voulu. Les filtres **WMI** (version de Windows, type de machine) existent aussi, mais ralentissent
  l'ouverture de session.

  ## Les cas particuliers à connaître

  - La **stratégie de mots de passe et de verrouillage** du domaine se règle dans la GPO **Default Domain
    Policy** liée à la racine du domaine. Une GPO de mots de passe liée à une OU n'a **aucun effet** sur les
    comptes du domaine. Pour des règles différentes par population, on utilise les **stratégies de mot de
    passe affinées** (PSO).
  - On ne modifie pas *Default Domain Controllers Policy* ou *Default Domain Policy* pour autre chose que
    leur rôle : on crée ses propres GPO, avec une convention de nommage (`U -` pour utilisateur, `C -`
    pour ordinateur).

  ## Vérifier et dépanner

  ```powershell
  gpupdate /force                                  # sur le poste : réapplique tout
  gpresult /r                                      # résumé : GPO appliquées et filtrées
  gpresult /h C:\Admin\rapport.html                # rapport détaillé
  Get-GPResultantSetOfPolicy -Computer PC01 -User DURAND\mdupont -ReportType Html -Path ...
  Get-GPOReport -Name '...' -ReportType Html -Path ...   # contenu d'une GPO
  Get-GPInheritance -Target 'OU=...'               # GPO liées et héritées d'une OU
  ```

  Un réglage utilisateur lié à une OU d'**ordinateurs** (ou l'inverse) ne fait rien : c'est l'erreur la plus
  fréquente, avec l'oubli du lien et le filtrage trop strict. Enfin, on **sauvegarde** les GPO
  (`Backup-GPO -All`) avant toute modification importante : la sauvegarde de l'état système du DC ne
  permet pas de restaurer une seule GPO simplement.
