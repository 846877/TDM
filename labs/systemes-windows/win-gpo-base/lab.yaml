exercises:
  - id: win-gpo-mdp
    title: Mots de passe et verrouillage du domaine
    description: |
      Dans la GPO **Default Domain Policy**, règle la stratégie de comptes :

      | Paramètre | Valeur |
      |-----------|--------|
      | Longueur minimale | 12 caractères |
      | Historique | 24 mots de passe |
      | Seuil de verrouillage | 10 tentatives |
      | Durée de verrouillage | 15 minutes |
      | Réinitialisation du compteur | 15 minutes |

      Applique ensuite la stratégie (`gpupdate /force` sur le DC) pour que le domaine prenne les valeurs.
    hint: gpmc.msc › Default Domain Policy › Configuration ordinateur › Stratégies › Paramètres Windows › Paramètres de sécurité › Stratégies de comptes ; ou édite le GptTmpl.inf de la GPO {31B2F340-...} et incrémente sa version
    cours: |
      Dans `gpmc.msc` : clic droit sur **Default Domain Policy** › *Modifier* › *Configuration ordinateur* ›
      *Stratégies* › *Paramètres Windows* › *Paramètres de sécurité* › *Stratégies de comptes*. Ces réglages
      sont écrits dans `GptTmpl.inf` (section `[System Access]` : `MinimumPasswordLength`,
      `PasswordHistorySize`, `LockoutBadCount`, `LockoutDuration`, `ResetLockoutCount`).

      ```powershell
      gpupdate /force
      Get-ADDefaultDomainPasswordPolicy
      ```

      Piège classique : `Set-ADDefaultDomainPasswordPolicy` modifie directement l'objet domaine, mais le DC
      **réapplique** ensuite la Default Domain Policy et écrase la valeur. La source de vérité est la GPO. Les
      recommandations actuelles (ANSSI, Microsoft) privilégient la **longueur** plutôt qu'une complexité
      tordue et des changements forcés fréquents, avec un verrouillage modéré contre la force brute.
    checks:
      - desc: La Default Domain Policy contient les valeurs demandées
        run: |
          $inf = "C:\Windows\SYSVOL\sysvol\durand.lan\Policies\{31B2F340-016D-11D2-945F-00C04FB984F9}\MACHINE\Microsoft\Windows NT\SecEdit\GptTmpl.inf"
          $t = Get-Content $inf -Raw
          ($t -match 'MinimumPasswordLength\s*=\s*12\b') -and ($t -match 'PasswordHistorySize\s*=\s*24\b') -and ($t -match 'LockoutBadCount\s*=\s*10\b') -and ($t -match 'LockoutDuration\s*=\s*15\b') -and ($t -match 'ResetLockoutCount\s*=\s*15\b')
      - desc: Le domaine applique une longueur minimale de 12 et un seuil de 10
        run: |
          $p = Get-ADDefaultDomainPasswordPolicy
          $p.MinPasswordLength -eq 12 -and $p.LockoutThreshold -eq 10 -and $p.PasswordHistoryCount -eq 24
    solution: |
      $id = '{31B2F340-016D-11D2-945F-00C04FB984F9}'
      $dossier = "C:\Windows\SYSVOL\sysvol\durand.lan\Policies\$id"
      $inf = "$dossier\MACHINE\Microsoft\Windows NT\SecEdit\GptTmpl.inf"
      $valeurs = @{ MinimumPasswordLength = 12; PasswordHistorySize = 24; LockoutBadCount = 10; LockoutDuration = 15; ResetLockoutCount = 15 }
      $lignes = [Collections.Generic.List[string]](Get-Content $inf)
      foreach ($cle in $valeurs.Keys) {
          $i = $lignes.FindIndex([Predicate[string]] { param($l) $l -match "^$cle\s*=" })
          if ($i -ge 0) { $lignes[$i] = "$cle = $($valeurs[$cle])" }
          else { $lignes.Insert($lignes.IndexOf('[System Access]') + 1, "$cle = $($valeurs[$cle])") }
      }
      Set-Content $inf $lignes -Encoding Unicode
      $dn = "CN=$id,CN=Policies,CN=System,DC=durand,DC=lan"
      $v = (Get-ADObject $dn -Properties versionNumber).versionNumber + 1
      Set-ADObject $dn -Replace @{ versionNumber = $v }
      (Get-Content "$dossier\GPT.INI") -replace 'Version=\d+', "Version=$v" | Set-Content "$dossier\GPT.INI" -Encoding Ascii
      gpupdate /force | Out-Null

  - id: win-gpo-creer
    title: Créer et lier une GPO utilisateur
    description: |
      Crée une GPO nommée `U - Restrictions Atelier` (commentaire : `Postes partagés de l'atelier`) et
      **lie-la** à l'OU `OU=Atelier,OU=Utilisateurs,OU=Ateliers Durand,DC=durand,DC=lan`.
    hint: New-GPO -Name 'U - Restrictions Atelier' -Comment "Postes partagés de l'atelier" | New-GPLink -Target 'OU=Atelier,OU=Utilisateurs,OU=Ateliers Durand,DC=durand,DC=lan'
    cours: |
      ```powershell
      New-GPO -Name 'U - Restrictions Atelier' -Comment "Postes partagés de l'atelier" |
          New-GPLink -Target 'OU=Atelier,OU=Utilisateurs,OU=Ateliers Durand,DC=durand,DC=lan'
      Get-GPInheritance -Target 'OU=Atelier,OU=Utilisateurs,OU=Ateliers Durand,DC=durand,DC=lan'
      ```

      Créer une GPO et la lier sont deux opérations distinctes : la même GPO peut être liée à plusieurs OU,
      et supprimer un lien ne supprime pas la GPO. Le préfixe `U -` indique qu'elle ne contient que des
      réglages **utilisateur** : on désactivera même sa partie ordinateur (`GpoStatus`) pour accélérer son
      traitement. Elle est liée à une OU d'**utilisateurs** : les comptes de l'atelier recevront ses réglages
      sur n'importe quel poste du domaine.
    checks:
      - desc: La GPO « U - Restrictions Atelier » existe avec son commentaire
        run: |
          (Get-GPO -Name 'U - Restrictions Atelier').Description -eq "Postes partagés de l'atelier"
      - desc: Elle est liée à l'OU Atelier et le lien est activé
        run: |
          $liens = (Get-GPInheritance -Target 'OU=Atelier,OU=Utilisateurs,OU=Ateliers Durand,DC=durand,DC=lan').GpoLinks
          [bool]($liens | Where-Object { $_.DisplayName -eq 'U - Restrictions Atelier' -and $_.Enabled })
    solution: |
      New-GPO -Name 'U - Restrictions Atelier' -Comment "Postes partagés de l'atelier" | New-GPLink -Target 'OU=Atelier,OU=Utilisateurs,OU=Ateliers Durand,DC=durand,DC=lan' | Out-Null

  - id: win-gpo-restrictions
    title: Verrouiller le poste partagé
    description: |
      Dans `U - Restrictions Atelier` :

      - **interdire l'accès au Panneau de configuration et aux Paramètres** ;
      - **désactiver l'invite de commandes**, en laissant les scripts de connexion fonctionner ;
      - désactiver la partie **ordinateur** de la GPO, inutile ici.
    hint: Set-GPRegistryValue -Name 'U - Restrictions Atelier' -Key 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer' -ValueName NoControlPanel -Type DWord -Value 1 ; ... 'HKCU\Software\Policies\Microsoft\Windows\System' DisableCMD 2 ; (Get-GPO ...).GpoStatus = 'ComputerSettingsDisabled'
    cours: |
      ```powershell
      $gpo = 'U - Restrictions Atelier'
      Set-GPRegistryValue -Name $gpo -Key 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer' `
          -ValueName NoControlPanel -Type DWord -Value 1
      Set-GPRegistryValue -Name $gpo -Key 'HKCU\Software\Policies\Microsoft\Windows\System' `
          -ValueName DisableCMD -Type DWord -Value 2
      (Get-GPO -Name $gpo).GpoStatus = 'ComputerSettingsDisabled'
      ```

      Les **modèles d'administration** ne sont que des valeurs de registre sous des clés `Policies` :
      *Configuration utilisateur* › *Modèles d'administration* › *Panneau de configuration* › « Interdire
      l'accès au Panneau de configuration et à l'application Paramètres du PC » correspond à `NoControlPanel`.
      Pour `DisableCMD`, la valeur 1 bloque aussi les scripts `.bat` de connexion, la valeur 2 seulement
      l'invite interactive. Le fichier ADMX de chaque réglage indique sa clé ; la console GPMC reste le moyen
      le plus sûr de trouver un réglage, PowerShell le moyen le plus reproductible.
    checks:
      - desc: NoControlPanel vaut 1 dans la GPO
        run: |
          (Get-GPRegistryValue -Name 'U - Restrictions Atelier' -Key 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer' -ValueName NoControlPanel).Value -eq 1
      - desc: DisableCMD vaut 2 (scripts autorisés)
        run: |
          (Get-GPRegistryValue -Name 'U - Restrictions Atelier' -Key 'HKCU\Software\Policies\Microsoft\Windows\System' -ValueName DisableCMD).Value -eq 2
      - desc: La partie ordinateur de la GPO est désactivée
        run: |
          (Get-GPO -Name 'U - Restrictions Atelier').GpoStatus -eq 'ComputerSettingsDisabled'
    solution: |
      $gpo = 'U - Restrictions Atelier'
      Set-GPRegistryValue -Name $gpo -Key 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer' -ValueName NoControlPanel -Type DWord -Value 1 | Out-Null
      Set-GPRegistryValue -Name $gpo -Key 'HKCU\Software\Policies\Microsoft\Windows\System' -ValueName DisableCMD -Type DWord -Value 2 | Out-Null
      (Get-GPO -Name $gpo).GpoStatus = 'ComputerSettingsDisabled'

  - id: win-gpo-fond
    title: Le fond d'écran de l'entreprise
    description: |
      Crée la GPO `U - Charte graphique`, liée à `OU=Utilisateurs,OU=Ateliers Durand,DC=durand,DC=lan`, qui
      impose le fond d'écran `\\durand.lan\NETLOGON\fond-durand.jpg` en mode **remplissage** (style `4`).
    hint: Set-GPRegistryValue -Name 'U - Charte graphique' -Key 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\System' -ValueName Wallpaper -Type String -Value '\\durand.lan\NETLOGON\fond-durand.jpg' ; idem WallpaperStyle '4'
    cours: |
      ```powershell
      $gpo = 'U - Charte graphique'
      New-GPO -Name $gpo | New-GPLink -Target 'OU=Utilisateurs,OU=Ateliers Durand,DC=durand,DC=lan'
      $cle = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\System'
      Set-GPRegistryValue -Name $gpo -Key $cle -ValueName Wallpaper -Type String -Value '\\durand.lan\NETLOGON\fond-durand.jpg'
      Set-GPRegistryValue -Name $gpo -Key $cle -ValueName WallpaperStyle -Type String -Value '4'
      ```

      Réglage d'origine : *Configuration utilisateur* › *Modèles d'administration* › *Bureau* › *Bureau* ›
      « Papier peint du Bureau ». Le fichier doit être lisible par tous les utilisateurs depuis tous les
      postes : `NETLOGON` (ou `SYSVOL`) est répliqué sur tous les DC et accessible en lecture aux utilisateurs
      authentifiés. Le chemin DFS `\\durand.lan\...` fonctionne avec n'importe quel DC. Les styles : 0
      centré, 2 étiré, 3 ajusté, 4 remplissage, 5 étendu.
    checks:
      - desc: La GPO U - Charte graphique est liée à l'OU Utilisateurs
        run: |
          [bool]((Get-GPInheritance -Target 'OU=Utilisateurs,OU=Ateliers Durand,DC=durand,DC=lan').GpoLinks | Where-Object DisplayName -eq 'U - Charte graphique')
      - desc: Elle impose le fond d'écran de NETLOGON en style 4
        run: |
          $cle = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\System'
          $w = (Get-GPRegistryValue -Name 'U - Charte graphique' -Key $cle -ValueName Wallpaper).Value
          $s = (Get-GPRegistryValue -Name 'U - Charte graphique' -Key $cle -ValueName WallpaperStyle).Value
          $w -like '\\durand.lan\NETLOGON\fond-durand.jpg*' -and $s -like '4*'
    solution: |
      $gpo = 'U - Charte graphique'
      New-GPO -Name $gpo | New-GPLink -Target 'OU=Utilisateurs,OU=Ateliers Durand,DC=durand,DC=lan' | Out-Null
      $cle = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\System'
      Set-GPRegistryValue -Name $gpo -Key $cle -ValueName Wallpaper -Type String -Value '\\durand.lan\NETLOGON\fond-durand.jpg' | Out-Null
      Set-GPRegistryValue -Name $gpo -Key $cle -ValueName WallpaperStyle -Type String -Value '4' | Out-Null

  - id: win-gpo-message
    title: Un message légal sur les postes
    description: |
      Crée la GPO `C - Postes securite`, liée à l'OU `Postes`, qui affiche avant l'ouverture de session un
      message dont le **titre** est `Ateliers Durand` et le **texte** `Accès réservé au personnel autorisé.
      Les connexions sont journalisées.` Désactive sa partie **utilisateur**.
    hint: Set-GPRegistryValue -Name 'C - Postes securite' -Key 'HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\System' -ValueName legalnoticecaption -Type String -Value 'Ateliers Durand' ; idem legalnoticetext
    cours: |
      ```powershell
      $gpo = 'C - Postes securite'
      New-GPO -Name $gpo | New-GPLink -Target 'OU=Postes,OU=Ateliers Durand,DC=durand,DC=lan'
      $cle = 'HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\System'
      Set-GPRegistryValue -Name $gpo -Key $cle -ValueName legalnoticecaption -Type String -Value 'Ateliers Durand'
      Set-GPRegistryValue -Name $gpo -Key $cle -ValueName legalnoticetext -Type String -Value 'Accès réservé...'
      (Get-GPO -Name $gpo).GpoStatus = 'UserSettingsDisabled'
      ```

      Dans la console : *Configuration ordinateur* › *Stratégies* › *Paramètres Windows* › *Paramètres de
      sécurité* › *Stratégies locales* › *Options de sécurité* › « Ouverture de session interactive : titre /
      texte du message ». Ce réglage concerne la **machine** : la GPO est donc liée à l'OU des **postes**. En
      France, ce message participe à l'information des salariés sur la journalisation (charte informatique).
    checks:
      - desc: La GPO C - Postes securite est liée à l'OU Postes, partie utilisateur désactivée
        run: |
          $lien = (Get-GPInheritance -Target 'OU=Postes,OU=Ateliers Durand,DC=durand,DC=lan').GpoLinks | Where-Object DisplayName -eq 'C - Postes securite'
          [bool]$lien -and (Get-GPO -Name 'C - Postes securite').GpoStatus -eq 'UserSettingsDisabled'
      - desc: Elle définit le titre et le texte du message
        run: |
          $cle = 'HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\System'
          $c = (Get-GPRegistryValue -Name 'C - Postes securite' -Key $cle -ValueName legalnoticecaption).Value
          $t = (Get-GPRegistryValue -Name 'C - Postes securite' -Key $cle -ValueName legalnoticetext).Value
          $c -like 'Ateliers Durand*' -and $t -like 'Accès réservé au personnel autorisé*journalisées*'
    solution: |
      $gpo = 'C - Postes securite'
      New-GPO -Name $gpo | New-GPLink -Target 'OU=Postes,OU=Ateliers Durand,DC=durand,DC=lan' | Out-Null
      $cle = 'HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\System'
      Set-GPRegistryValue -Name $gpo -Key $cle -ValueName legalnoticecaption -Type String -Value 'Ateliers Durand' | Out-Null
      Set-GPRegistryValue -Name $gpo -Key $cle -ValueName legalnoticetext -Type String -Value 'Accès réservé au personnel autorisé. Les connexions sont journalisées.' | Out-Null
      (Get-GPO -Name $gpo).GpoStatus = 'UserSettingsDisabled'

  - id: win-gpo-appliquer
    title: Appliquer et prouver
    description: |
      Force l'application des stratégies sur **PC01** puis produis, sur SRV-DC01, le rapport du jeu de
      stratégies résultant de l'ordinateur PC01 au format HTML dans `C:\Admin\rsop-pc01.html`. Le message
      légal doit être en place dans le registre du poste.
    hint: Invoke-Command -ComputerName PC01 { gpupdate /force } ; Get-GPResultantSetOfPolicy -Computer PC01 -ReportType Html -Path C:\Admin\rsop-pc01.html
    cours: |
      ```powershell
      Invoke-Command -ComputerName PC01 { gpupdate /target:computer /force }
      Invoke-Command -ComputerName PC01 { gpresult /scope computer /r }
      Get-GPResultantSetOfPolicy -Computer PC01 -ReportType Html -Path C:\Admin\rsop-pc01.html
      ```

      Sans `gpupdate`, le poste aurait appliqué la GPO de lui-même dans les 90 minutes, ou au prochain
      redémarrage. `gpresult /r` montre en quelques lignes les GPO **appliquées** et celles **filtrées**
      (avec la raison : refus d'accès, lien désactivé, vide). Le rapport RSoP en HTML détaille chaque
      réglage et la GPO **gagnante** en cas de conflit : c'est la pièce à joindre à un ticket. `Invoke-GPUpdate`
      existe aussi, mais il passe par une tâche planifiée distante qui exige des règles de pare-feu
      supplémentaires sur les postes.
    checks:
      - desc: Le registre de PC01 contient le message légal
        machine: pc01
        run: |
          (Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Policies\System).legalnoticecaption -eq 'Ateliers Durand'
      - desc: Le rapport C:\Admin\rsop-pc01.html cite la GPO C - Postes securite
        run: |
          (Test-Path C:\Admin\rsop-pc01.html) -and [bool](Select-String -Path C:\Admin\rsop-pc01.html -Pattern 'C - Postes securite' -SimpleMatch -Quiet)
    solution: |
      Invoke-Command -ComputerName PC01 { gpupdate /target:computer /force } | Out-Null
      Get-GPResultantSetOfPolicy -Computer PC01 -ReportType Html -Path C:\Admin\rsop-pc01.html | Out-Null

  - id: win-gpo-filtrage
    title: Le chef d'atelier n'est pas un poste partagé
    description: |
      Chloé Moreau (`cmoreau`, chef d'atelier) ne doit **pas** recevoir `U - Restrictions Atelier`. Crée le
      groupe global `GG_Exemptions_Atelier` (OU `Groupes`) avec `cmoreau` pour membre, et **refuse-lui**
      l'application de la GPO. Les autres comptes de l'atelier continuent de la recevoir, et *Utilisateurs
      authentifiés* garde au moins la **lecture**.
    hint: Set-GPPermission -Name 'U - Restrictions Atelier' -TargetName GG_Exemptions_Atelier -TargetType Group -PermissionLevel GpoRead ; puis refus « Appliquer » via l'ACL de la GPO (gpmc onglet Délégation › Avancé) ou ADSI
    cours: |
      Deux façons de cibler : **inclure** (retirer *Appliquer* à *Utilisateurs authentifiés*, le donner à un
      groupe) ou **exclure** (refuser *Appliquer* à un groupe). Ici l'exclusion d'une seule personne est plus
      simple. `Set-GPPermission` ne sait pas poser de **refus** : on passe par l'onglet *Délégation* ›
      *Avancé* de GPMC, ou par l'ACL de l'objet GPO dans l'annuaire :

      ```powershell
      $gpo = Get-GPO -Name 'U - Restrictions Atelier'
      $dn = "AD:CN={$($gpo.Id)},CN=Policies,CN=System,DC=durand,DC=lan"
      $sid = (Get-ADGroup GG_Exemptions_Atelier).SID
      $apply = [guid]'edacfd8f-ffb3-11d1-b41d-00a0c968f939'   # droit étendu « Apply Group Policy »
      $acl = Get-Acl $dn
      $acl.AddAccessRule((New-Object DirectoryServices.ActiveDirectoryAccessRule $sid, 'ExtendedRight', 'Deny', $apply))
      Set-Acl $dn $acl
      ```

      Un **refus** l'emporte toujours sur une autorisation. Utilisé à petite dose, il reste lisible dans
      l'onglet *Délégation*. Pense à le documenter dans le commentaire de la GPO.
    checks:
      - desc: GG_Exemptions_Atelier existe et contient cmoreau
        run: |
          (Get-ADGroupMember GG_Exemptions_Atelier).SamAccountName -contains 'cmoreau'
      - desc: Le groupe a un refus « Appliquer la stratégie de groupe » sur la GPO
        run: |
          Import-Module ActiveDirectory
          $gpo = Get-GPO -Name 'U - Restrictions Atelier'
          $acl = (Get-Acl "AD:CN={$($gpo.Id)},CN=Policies,CN=System,DC=durand,DC=lan").Access
          [bool]($acl | Where-Object { $_.IdentityReference -eq 'DURAND\GG_Exemptions_Atelier' -and $_.AccessControlType -eq 'Deny' -and $_.ObjectType -eq [guid]'edacfd8f-ffb3-11d1-b41d-00a0c968f939' })
      - desc: Utilisateurs authentifiés garde la lecture de la GPO
        run: |
          $p = Get-GPPermission -Name 'U - Restrictions Atelier' -All | Where-Object { $_.Trustee.Sid.Value -eq 'S-1-5-11' }
          $p.Permission -in 'GpoRead', 'GpoApply'
    solution: |
      New-ADGroup GG_Exemptions_Atelier -GroupScope Global -GroupCategory Security -Path 'OU=Groupes,OU=Ateliers Durand,DC=durand,DC=lan'
      Add-ADGroupMember GG_Exemptions_Atelier -Members cmoreau
      $gpo = Get-GPO -Name 'U - Restrictions Atelier'
      $dn = "AD:CN={$($gpo.Id)},CN=Policies,CN=System,DC=durand,DC=lan"
      $sid = (Get-ADGroup GG_Exemptions_Atelier).SID
      $acl = Get-Acl $dn
      $acl.AddAccessRule((New-Object DirectoryServices.ActiveDirectoryAccessRule $sid, 'ExtendedRight', 'Deny', ([guid]'edacfd8f-ffb3-11d1-b41d-00a0c968f939')))
      Set-Acl $dn $acl

  - id: win-gpo-heritage
    title: Blocage d'héritage et lien appliqué
    description: |
      La direction ne veut plus hériter des GPO des niveaux supérieurs : **bloque l'héritage** sur l'OU
      `Direction`. Mais la charte graphique est obligatoire pour tous : fais en sorte que le lien de
      `U - Charte graphique` sur l'OU `Utilisateurs` soit **appliqué** (*Enforced*), pour traverser le blocage.
    hint: Set-GPInheritance -Target 'OU=Direction,OU=Utilisateurs,...' -IsBlocked Yes ; Set-GPLink -Name 'U - Charte graphique' -Target 'OU=Utilisateurs,...' -Enforced Yes
    cours: |
      ```powershell
      $u = 'OU=Utilisateurs,OU=Ateliers Durand,DC=durand,DC=lan'
      Set-GPInheritance -Target "OU=Direction,$u" -IsBlocked Yes
      Set-GPLink -Name 'U - Charte graphique' -Target $u -Enforced Yes
      (Get-GPInheritance -Target "OU=Direction,$u").InheritedGpoLinks | Format-Table DisplayName, Enforced, Target
      ```

      `InheritedGpoLinks` liste les GPO qui s'appliqueront réellement à l'OU, dans l'ordre de priorité : après
      le blocage, seules les GPO **appliquées** des niveaux supérieurs et celles liées à l'OU elle-même y
      figurent. La *Default Domain Policy* disparaît de la liste... sauf pour ses réglages de mots de passe,
      qui concernent les comptes du domaine et ne dépendent pas de l'OU. Dans GPMC, une OU bloquée porte un
      point d'exclamation bleu, un lien appliqué un cadenas.
    checks:
      - desc: L'OU Direction bloque l'héritage
        run: |
          (Get-GPInheritance -Target 'OU=Direction,OU=Utilisateurs,OU=Ateliers Durand,DC=durand,DC=lan').GpoInheritanceBlocked
      - desc: Le lien U - Charte graphique est appliqué et atteint encore Direction
        run: |
          $h = (Get-GPInheritance -Target 'OU=Direction,OU=Utilisateurs,OU=Ateliers Durand,DC=durand,DC=lan').InheritedGpoLinks
          [bool]($h | Where-Object { $_.DisplayName -eq 'U - Charte graphique' -and $_.Enforced })
    solution: |
      $u = 'OU=Utilisateurs,OU=Ateliers Durand,DC=durand,DC=lan'
      Set-GPInheritance -Target "OU=Direction,$u" -IsBlocked Yes | Out-Null
      Set-GPLink -Name 'U - Charte graphique' -Target $u -Enforced Yes | Out-Null

  - id: win-gpo-lecteur
    title: Un lecteur réseau par les préférences
    description: |
      Crée la GPO `U - Lecteurs reseau`, liée à l'OU `Utilisateurs`, qui connecte pour tous le lecteur `S:`
      sur `\\SRV-DC01\Commun` (libellé `Commun`, action **Mettre à jour**), avec les **Préférences** de
      stratégie de groupe (*Configuration utilisateur* › *Préférences* › *Paramètres Windows* › *Mappages de
      lecteurs*). La console `gpmc.msc` est le plus simple (Bureau à distance sur SRV-DC01).
    hint: Dans gpmc.msc, Modifier la GPO › Configuration utilisateur › Préférences › Paramètres Windows › Mappages de lecteurs › Nouveau › Lecteur mappé ; le résultat est un fichier User\Preferences\Drives\Drives.xml dans SYSVOL
    cours: |
      Les **préférences** (GPP) couvrent ce que les modèles d'administration ne savent pas faire : lecteurs,
      imprimantes, raccourcis, fichiers, tâches planifiées. Chaque élément a une **action** : *Créer*,
      *Remplacer*, *Mettre à jour* (crée ou corrige, le choix habituel), *Supprimer*. Le **ciblage au niveau
      de l'élément** permet par exemple de ne connecter `T:` qu'aux membres de `GG_Compta`, sans multiplier
      les GPO.

      Il n'existe pas de cmdlet pour les mappages de lecteurs : GPMC écrit le fichier
      `User\Preferences\Drives\Drives.xml` dans le dossier SYSVOL de la GPO, ajoute l'extension côté client
      « Mappages de lecteurs » (`{5794DAFD-BE60-433F-88A2-1A31939AC01F}`) à l'attribut
      `gPCUserExtensionNames` de la GPO et incrémente sa version. Sans ces deux dernières étapes, les postes
      ignorent le fichier : c'est pourquoi on passe par la console. Vérification sur le poste, après
      ouverture de session d'un utilisateur : `net use`.
    checks:
      - desc: La GPO U - Lecteurs reseau est liée à l'OU Utilisateurs
        run: |
          [bool]((Get-GPInheritance -Target 'OU=Utilisateurs,OU=Ateliers Durand,DC=durand,DC=lan').GpoLinks | Where-Object DisplayName -eq 'U - Lecteurs reseau')
      - desc: Son Drives.xml connecte S sur \\SRV-DC01\Commun
        run: |
          $gpo = Get-GPO -Name 'U - Lecteurs reseau'
          [xml]$x = Get-Content "C:\Windows\SYSVOL\sysvol\durand.lan\Policies\{$($gpo.Id)}\User\Preferences\Drives\Drives.xml" -Raw
          [bool]($x.Drives.Drive | Where-Object { $_.Properties.letter -eq 'S' -and $_.Properties.path -eq '\\SRV-DC01\Commun' })
      - desc: L'extension Mappages de lecteurs est déclarée sur la GPO
        run: |
          $gpo = Get-GPO -Name 'U - Lecteurs reseau'
          (Get-ADObject "CN={$($gpo.Id)},CN=Policies,CN=System,DC=durand,DC=lan" -Properties gPCUserExtensionNames).gPCUserExtensionNames -match '5794DAFD-BE60-433F-88A2-1A31939AC01F'
    solution: |
      $gpo = New-GPO -Name 'U - Lecteurs reseau'
      $gpo | New-GPLink -Target 'OU=Utilisateurs,OU=Ateliers Durand,DC=durand,DC=lan' | Out-Null
      $dossier = "C:\Windows\SYSVOL\sysvol\durand.lan\Policies\{$($gpo.Id)}"
      New-Item "$dossier\User\Preferences\Drives" -ItemType Directory -Force | Out-Null
      $uid = [guid]::NewGuid().ToString('B').ToUpper()
      $date = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
      $xml = @"
      <?xml version="1.0" encoding="utf-8"?>
      <Drives clsid="{8FDDCC1A-0C3C-43cd-A6B4-71A6DF20DA8C}"><Drive clsid="{935D1B74-9CB8-4e3c-9914-7DD559B7A417}" name="S:" status="S:" image="2" changed="$date" uid="$uid"><Properties action="U" thisDrive="NOCHANGE" allDrives="NOCHANGE" userName="" path="\\SRV-DC01\Commun" label="Commun" persistent="0" useLetter="1" letter="S"/></Drive></Drives>
      "@
      Set-Content "$dossier\User\Preferences\Drives\Drives.xml" $xml -Encoding UTF8
      $dn = "CN={$($gpo.Id)},CN=Policies,CN=System,DC=durand,DC=lan"
      Set-ADObject $dn -Replace @{ gPCUserExtensionNames = '[{00000000-0000-0000-0000-000000000000}{2EA1A81B-48E5-45E9-8BB7-A6E3AC170006}][{5794DAFD-BE60-433F-88A2-1A31939AC01F}{2EA1A81B-48E5-45E9-8BB7-A6E3AC170006}]' }
      $v = (Get-ADObject $dn -Properties versionNumber).versionNumber + 65536
      Set-ADObject $dn -Replace @{ versionNumber = $v }
      Set-Content "$dossier\GPT.INI" "[General]`r`nVersion=$v" -Encoding Ascii

  - id: win-gpo-sauvegarde
    title: Sauvegarder les GPO et documenter
    description: |
      Avant de partir en vacances, sauvegarde **toutes** les GPO du domaine dans `C:\Admin\GPO-Sauvegardes`
      et produis le rapport HTML de `U - Restrictions Atelier` dans `C:\Admin\rapport-atelier.html`.
    hint: New-Item C:\Admin\GPO-Sauvegardes -ItemType Directory ; Backup-GPO -All -Path C:\Admin\GPO-Sauvegardes ; Get-GPOReport -Name 'U - Restrictions Atelier' -ReportType Html -Path C:\Admin\rapport-atelier.html
    cours: |
      ```powershell
      New-Item C:\Admin\GPO-Sauvegardes -ItemType Directory -Force
      Backup-GPO -All -Path C:\Admin\GPO-Sauvegardes -Comment "Avant congés $(Get-Date -Format d)"
      Get-GPOReport -Name 'U - Restrictions Atelier' -ReportType Html -Path C:\Admin\rapport-atelier.html
      # restaurer une GPO abîmée :
      Restore-GPO -Name 'U - Restrictions Atelier' -Path C:\Admin\GPO-Sauvegardes
      ```

      Chaque sauvegarde est un sous-dossier nommé par un GUID de sauvegarde, avec le contenu SYSVOL et les
      métadonnées de la GPO. `Restore-GPO` remet une GPO **existante** dans l'état sauvegardé ;
      `Import-GPO` copie les réglages d'une sauvegarde dans une autre GPO, même dans un autre domaine (un lab
      vers la production, par exemple). Les **liens** ne font pas partie de la sauvegarde : le rapport HTML
      (ou `Get-GPInheritance`) sert à les documenter. On stocke ces sauvegardes **hors** du DC.
    checks:
      - desc: Toutes les GPO du domaine sont sauvegardées dans C:\Admin\GPO-Sauvegardes
        run: |
          $sauv = @(Get-ChildItem C:\Admin\GPO-Sauvegardes -Directory | Where-Object Name -match '^\{[0-9A-Fa-f-]{36}\}$')
          $sauv.Count -ge @(Get-GPO -All).Count
      - desc: Le rapport HTML de U - Restrictions Atelier existe
        run: |
          (Test-Path C:\Admin\rapport-atelier.html) -and [bool](Select-String -Path C:\Admin\rapport-atelier.html -Pattern 'U - Restrictions Atelier' -SimpleMatch -Quiet)
    solution: |
      New-Item C:\Admin\GPO-Sauvegardes -ItemType Directory -Force | Out-Null
      Backup-GPO -All -Path C:\Admin\GPO-Sauvegardes | Out-Null
      Get-GPOReport -Name 'U - Restrictions Atelier' -ReportType Html -Path C:\Admin\rapport-atelier.html
