title: Utilisateurs, groupes et modèle AGDLP
level: intermediaire
order: 2
tags: [active directory, utilisateurs, groupes, ou, csv, agdlp, ntfs, délégation, powershell]
summary: Peupler l'annuaire de durand.lan proprement - OU, comptes unitaires et import CSV, groupes globaux et locaux selon AGDLP, départ d'un salarié, délégation au support.
vagrant: bundled
machine: dc01
description: |
  **Contexte.** Le domaine `durand.lan` vient d'être créé sur `SRV-DC01`. Le prestataire a déjà créé trois
  comptes « vite fait » dans le conteneur `Users`, les RH ont envoyé la liste des embauches
  (`C:\Admin\embauches.csv`), et la comptabilité attend ses droits sur `C:\Partages\Compta`.

  Ta mission : construire une organisation propre et **durable**. Chaque droit sera donné à un groupe, jamais
  à une personne, en suivant le modèle **AGDLP**.

  **Machine.** `SRV-DC01`, contrôleur de domaine déjà promu. Le terminal est ouvert en administrateur du
  domaine, le module `ActiveDirectory` est disponible. Mot de passe initial des comptes :
  `Bienvenue2024!`.
cours: |
  ## Les objets de l'annuaire

  Un **utilisateur** AD porte un identifiant d'ouverture de session (`sAMAccountName`, ex. `mdupont`, utilisé
  sous la forme `DURAND\mdupont`), un **UPN** au format courriel (`mdupont@durand.lan`), un nom affiché et de
  nombreux attributs utiles (service, fonction, téléphone, responsable). Chaque objet a un **nom unique**
  (*Distinguished Name*) qui décrit son emplacement :
  `CN=Marie Dupont,OU=Compta,OU=Utilisateurs,OU=Ateliers Durand,DC=durand,DC=lan`.

  Les **unités d'organisation** rangent les objets pour deux raisons : **lier des GPO** et **déléguer**
  l'administration. On conçoit donc l'arborescence en fonction de l'administration, pas de l'organigramme.

  ## Groupes : type et étendue

  | Type | Usage |
  |------|-------|
  | **Sécurité** | reçoit des droits (NTFS, partages, GPO, délégation) et peut servir de liste de diffusion |
  | **Distribution** | uniquement messagerie, ne reçoit aucun droit |

  | Étendue | Peut contenir | Utilisable pour des droits |
  |---------|---------------|----------------------------|
  | **Globale** | comptes et groupes globaux du **même domaine** | dans toute la forêt |
  | **Locale de domaine** | comptes et groupes globaux/universels de **toute la forêt** | dans **son** domaine |
  | **Universelle** | comptes et groupes de toute la forêt | dans toute la forêt (stockée au catalogue global) |

  ## Le modèle AGDLP

  **A**ccounts → **G**lobal groups → **D**omain **L**ocal groups → **P**ermissions.

  1. Les **comptes** sont membres de groupes **globaux** qui représentent des **personnes** : un service, une
     fonction (`GG_Compta`, `GG_Direction`).
  2. Les groupes **locaux de domaine** représentent un **accès à une ressource** : `DL_Compta_RW` (modifier),
     `DL_Compta_R` (lire).
  3. Les groupes globaux sont **membres** des groupes locaux de domaine : `GG_Compta` dans `DL_Compta_RW`,
     `GG_Direction` dans `DL_Compta_R`.
  4. Seuls les groupes locaux de domaine reçoivent des **permissions** (ACL NTFS, partages).

  L'avantage est immédiat : une embauche à la comptabilité, c'est **un** ajout dans `GG_Compta` ; un nouveau
  dossier accessible à la direction, c'est **une** imbrication. On lit l'ACL d'un dossier et on comprend qui
  y a accès sans avoir à traquer des comptes individuels. Une convention de nommage claire (préfixes `GG_`,
  `DL_`, suffixes `_R`, `_RW`) fait partie du modèle.

  Rappel : les appartenances aux groupes sont lues **à l'ouverture de session** (jeton Kerberos). Un
  utilisateur ajouté à un groupe doit se déconnecter et se reconnecter pour en profiter.

  ## Cycle de vie d'un compte

  - **Arrivée** : création dans la bonne OU, attributs renseignés, mot de passe provisoire à changer, groupes
    du service. On industrialise avec un **import CSV** : `Import-Csv | ForEach-Object { New-ADUser ... }`.
  - **Vie** : réinitialisation de mot de passe, déverrouillage, changement de service (déplacement d'OU et
    de groupes), date d'expiration pour les intérimaires.
  - **Départ** : on **désactive** d'abord (on ne supprime pas : la boîte mail, les fichiers et les audits
    peuvent encore servir), on retire les groupes, on range le compte dans une OU dédiée, on note la date.
    La suppression vient plus tard, selon la politique de l'entreprise.

  ## Délégation

  L'**Assistant Délégation de contrôle** (clic droit sur une OU) donne à un groupe un droit précis sur les
  objets de cette OU : réinitialiser les mots de passe, créer des comptes, modifier l'appartenance aux
  groupes. Le support n'a ainsi pas besoin d'être administrateur du domaine. En ligne de commande :
  `dsacls`, ou `Get-Acl`/`Set-Acl` sur le lecteur `AD:`.

  ## Outils PowerShell

  `New-ADOrganizationalUnit`, `New-ADUser`, `Set-ADUser`, `Move-ADObject`, `Disable-ADAccount`,
  `Set-ADAccountPassword`, `New-ADGroup`, `Add-ADGroupMember`, `Get-ADGroupMember -Recursive`,
  `Get-ADUser -Filter` / `-SearchBase` et `-Properties` pour lire les attributs non affichés par défaut.
