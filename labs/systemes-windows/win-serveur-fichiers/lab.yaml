title: Serveur de fichiers - FSRM, DFS et clichés instantanés
level: intermediaire
order: 7
tags: [windows server, partages, smb, fsrm, quotas, filtrage de fichiers, dfs, abe, clichés instantanés]
summary: Faire d'un Windows Server un vrai serveur de fichiers - énumération basée sur l'accès, quotas et filtrage FSRM, rapports, espace de noms DFS, durcissement SMB et clichés instantanés.
vagrant: bundled
machine: fic01
description: |
  **Contexte.** Le serveur `SRV-FIC01` d'*Ateliers Durand* est plein à craquer : vidéos personnelles, un
  chantier qui a stocké 300 Mo de vidéo de drone, des utilisateurs qui voient des dossiers auxquels ils
  n'ont pas accès, et un « j'ai écrasé mon fichier, tu peux le récupérer ? » par semaine. Tu vas mettre de
  l'ordre avec les outils intégrés à Windows Server.

  **Machine.** `SRV-FIC01`, Windows Server 2022 hors domaine. Arborescence `C:\Partages` :

  ```
  C:\Partages
  ├── Commun          (partagé, avec un sous-dossier Formation)
  ├── Direction       (partagé)
  ├── Projets         (Chantier-Lyon, Chantier-Grenoble)
  └── Utilisateurs    (un dossier par utilisateur)
  ```
cours: |
  ## Le serveur de fichiers Windows

  Un partage SMB combine deux couches de droits : les **autorisations de partage** (Lecture, Modifier,
  Contrôle total) et les **autorisations NTFS**. L'accès effectif est le plus restrictif des deux ; la
  pratique courante est de laisser le partage large (*Utilisateurs authentifiés* : Modifier ou Contrôle
  total) et de régler finement en NTFS. Au-delà de ces bases, Windows Server propose plusieurs services de
  rôle regroupés dans **Services de fichiers et de stockage**.

  ## Énumération basée sur l'accès (ABE)

  Sans ABE, un utilisateur voit **tous** les dossiers d'un partage, même ceux qu'il ne peut pas ouvrir :
  confusion, appels au support, et fuite d'information (les noms de dossiers parlent : « Licenciements
  2025 »). Avec ABE, l'Explorateur n'affiche que ce que l'utilisateur peut lire. C'est une option du
  partage (`FolderEnumerationMode AccessBased`).

  ## FSRM : le gestionnaire de ressources du serveur de fichiers

  | Fonction | Ce qu'elle fait |
  |----------|-----------------|
  | **Quotas** | limite la taille d'un **dossier** (strict : bloque ; souple : avertit), avec des seuils qui déclenchent courriel, événement, commande ou rapport |
  | **Modèles de quota** | des quotas réutilisables ; modifier le modèle met à jour les quotas qui en dérivent |
  | **Quotas automatiques** | appliquent un modèle à chaque sous-dossier, présent et futur (dossiers utilisateurs) |
  | **Filtrage de fichiers** | bloque des types de fichiers par **extension** (groupes de fichiers), avec exceptions |
  | **Rapports de stockage** | gros fichiers, doublons, fichiers anciens, par propriétaire, par groupe de fichiers |
  | **Classification** | étiquette les fichiers selon leur contenu ou leur emplacement |

  Les quotas NTFS classiques (`fsutil quota`) limitent par **utilisateur et par volume** ; FSRM limite par
  **dossier**, ce qui correspond mieux à « le chantier de Lyon a droit à 2 Go ». Le filtrage ne regarde que
  l'extension : un fichier renommé passe. Il sert à faire respecter la charte, pas à arrêter un attaquant.

  ## DFS : un espace de noms qui survit aux serveurs

  Un **espace de noms DFS** présente une arborescence virtuelle (`\\durand.lan\Ressources\Projets`) dont
  chaque dossier pointe vers un ou plusieurs partages réels. Les utilisateurs et les raccourcis ne
  connaissent que le chemin DFS : on peut déplacer un partage vers un nouveau serveur en changeant la cible,
  sans toucher aux postes. Un espace **autonome** (`\\SRV-FIC01\...`) fonctionne sans domaine ; un espace
  **de domaine** (`\\durand.lan\...`) est stocké dans AD et peut avoir plusieurs serveurs d'espace de noms.
  La **réplication DFS** (DFSR) synchronise le contenu de plusieurs cibles, utile entre sites.

  ## Clichés instantanés des dossiers partagés

  Le service **VSS** prend des instantanés du volume à intervalles réguliers (par défaut 7 h et 12 h en
  semaine). Les utilisateurs récupèrent eux-mêmes une version précédente d'un fichier : clic droit ›
  *Propriétés* › *Versions précédentes*. Ce n'est **pas** une sauvegarde : les clichés sont sur le même
  disque et disparaissent avec lui, et l'espace qui leur est réservé limite leur nombre (64 au maximum par
  volume).

  ## Durcir SMB

  - **SMB 1** est obsolète et dangereux (WannaCry, NotPetya) : désactivé, et la fonctionnalité `FS-SMB1`
    désinstallée.
  - Le **chiffrement SMB 3** protège les données en transit sur un partage sensible (`EncryptData`).
  - La **signature SMB** empêche les attaques par relais.
  - La mise en cache **hors connexion** se règle par partage (`CachingMode`) : on la désactive sur les
    partages applicatifs ou volumineux.

  ## Outils

  `New-SmbShare`, `Set-SmbShare`, `Get-SmbSession`, `Get-SmbOpenFile`, le module `FileServerResourceManager`
  (`New-FsrmQuotaTemplate`, `New-FsrmQuota`, `New-FsrmFileScreen`...), le module `DFSN`, `vssadmin`, et les
  consoles `fsrm.msc`, `dfsmgmt.msc` et *Gestion de l'ordinateur* › *Dossiers partagés*.
