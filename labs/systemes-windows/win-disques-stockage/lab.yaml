title: Disques, volumes et stockage
level: debutant
order: 6
tags: [windows, windows server, disques, partitions, volumes, ntfs, diskpart, quotas, stockage]
summary: Installer de nouveaux disques sur un serveur - initialisation GPT/MBR, volumes NTFS, extension, points de montage, compression, quotas et vérification.
vagrant: bundled
description: |
  **Contexte.** Le serveur `SRV01` d'*Ateliers Durand* manque de place. Le prestataire a ajouté trois
  disques : un de **2 Go** pour les données, un de **1,5 Go** pour les archives, et le disque des
  journaux (**1 Go**) dont le volume `L:` est plein alors que la moitié du disque est libre. À toi de
  les mettre en service proprement.

  **Machine.** Une VM Windows Server 2022 (2 Go de RAM). Les trois disques sont des **disques virtuels
  VHDX** (`C:\VHD`) branchés dans Windows : pour lui, ce sont des disques comme les autres (*Msft
  Virtual Disk*). Ne les détache pas.

  Outils : *Gestion des disques* (`diskmgmt.msc`), `diskpart`, et les cmdlets `Get-Disk`,
  `Initialize-Disk`, `New-Partition`, `Format-Volume`, `Resize-Partition`, `Get-Volume`.

  ⚠️ Identifie toujours un disque **par sa taille ou son numéro vérifié** avant d'agir : sur un vrai
  serveur, initialiser le mauvais disque efface des données.
cours: |
  ## Du disque au volume

  ```
  Disque physique (ou virtuel)   Get-Disk          diskmgmt.msc : « Disque 1 »
   └─ table de partitions         GPT ou MBR        Initialize-Disk
       └─ partition               New-Partition     taille, lettre, chemin d'accès
           └─ volume formaté      Format-Volume     NTFS / ReFS, nom, taille d'unité d'allocation
               └─ lettre (F:) ou dossier de montage (C:\Partages\Archives)
  ```

  Un disque neuf est **RAW** (non initialisé) : Windows ne peut rien y écrire. On l'**initialise** en
  choisissant le style de partitionnement :

  | | MBR | GPT |
  |---|---|---|
  | Taille maximale | 2 To | 18 Eo (en pratique, illimitée) |
  | Partitions | 4 principales (ou étendue + logiques) | 128 |
  | Démarrage | BIOS | UEFI |
  | Robustesse | une seule table | table en double + CRC |

  **GPT** est le choix par défaut aujourd'hui ; MBR reste pour la compatibilité (vieux systèmes, clés USB).

  ## PowerShell, diskpart et graphique

  ```powershell
  Get-Disk | Format-Table Number, FriendlyName, Size, PartitionStyle, OperationalStatus
  Initialize-Disk -Number 1 -PartitionStyle GPT
  New-Partition -DiskNumber 1 -UseMaximumSize -DriveLetter F |
    Format-Volume -FileSystem NTFS -NewFileSystemLabel DONNEES -Confirm:$false
  Resize-Partition -DriveLetter L -Size (Get-PartitionSupportedSize -DriveLetter L).SizeMax
  ```

  `diskpart` (interactif : `list disk`, `select disk 1`, `create partition primary`, `format fs=ntfs
  quick label=DONNEES`, `assign letter=F`, `extend`) reste indispensable en WinPE ou sur Server Core.
  Dans `diskmgmt.msc`, tout se fait au clic droit (Initialiser, Nouveau volume simple, Étendre...).

  ## Systèmes de fichiers

  - **NTFS** : droits (ACL), compression, chiffrement EFS, quotas, clichés instantanés. Le standard.
  - **ReFS** : résilient, pour les gros volumes de données (Hyper-V, sauvegardes) ; pas de compression
    NTFS ni de quotas NTFS, et pas de démarrage dessus.
  - **FAT32 / exFAT** : supports amovibles.

  La **taille d'unité d'allocation** (cluster) : 4 Ko par défaut ; 64 Ko pour les gros fichiers (bases
  SQL, vidéos, sauvegardes) — mais la compression NTFS n'est possible qu'avec des clusters ≤ 4 Ko.

  ## Étendre, monter, compresser, limiter

  - **Étendre** un volume n'est possible que vers de l'espace libre **contigu** situé **après** lui
    (sinon : déplacer des partitions avec un outil tiers, ou ajouter un disque).
  - Un **point de montage** (dossier vide NTFS) donne accès à un volume sans lettre :
    `Add-PartitionAccessPath -DriveLetter G -AccessPath C:\Partages\Archives`.
  - La **compression NTFS** (`compact /c /s`) économise de la place pour des données rarement lues, au prix
    d'un peu de CPU.
  - Les **quotas NTFS** limitent l'espace occupé **par utilisateur** sur un volume (`fsutil quota`,
    onglet *Quota* des propriétés). Sur un serveur de fichiers, on préfère les quotas **FSRM** par dossier
    (lab intermédiaire).

  ## Santé des volumes

  `Repair-Volume -DriveLetter F -Scan` (ou `chkdsk F:`) vérifie le système de fichiers en ligne ;
  `-SpotFix` corrige en quelques secondes ce que le scan a trouvé. `Get-PhysicalDisk` et
  `Get-StorageReliabilityCounter` donnent l'état SMART des vrais disques.

  ## Pièges courants

  - Initialiser ou formater le mauvais disque : vérifie `Number`, `Size` et `FriendlyName`.
  - Un disque *Offline* (stratégie SAN de Windows Server) : `Set-Disk -Number 1 -IsOffline $false`.
  - Oublier `-Confirm:$false` dans un script : `Format-Volume` attend une réponse.
  - Vouloir étendre `C:` alors qu'une partition de récupération est placée juste après.
