title: Rôles, fonctionnalités et préparation d'un serveur
level: debutant
order: 7
tags: [windows server, server manager, rôles, fonctionnalités, iis, windows update, ntp, sconfig]
summary: Préparer un Windows Server neuf - fiche d'identité, rôles et fonctionnalités, IIS, mises à jour, heure, Gestionnaire de serveur.
vagrant: bundled
description: |
  **Contexte.** Un nouveau Windows Server 2022, `SRV01`, doit devenir le serveur d'applications
  d'*Ateliers Durand* (intranet IIS). Avant la mise en production, tu suis la checklist de préparation :
  documenter, nettoyer, installer ce qu'il faut (et seulement ça), régler mises à jour et heure.

  **Machine.** Une VM Windows Server 2022 Standard *Desktop Experience* (2 Go de RAM). Terminal
  PowerShell en administrateur. Interface graphique (Bureau à distance ou console VirtualBox) : le
  **Gestionnaire de serveur** s'ouvre à la connexion.

  Cmdlets utiles : `Get-WindowsFeature`, `Install-WindowsFeature`, `Uninstall-WindowsFeature`,
  `Get-ComputerInfo`, `Get-HotFix`, `w32tm`, `sconfig`.
cours: |
  ## Rôles, services de rôle et fonctionnalités

  Windows Server n'installe presque rien par défaut : on ajoute ce dont le serveur a besoin.

  - Un **rôle** est une fonction principale du serveur : *Active Directory Domain Services*, *DNS
    Server*, *DHCP Server*, *File and Storage Services*, *Web Server (IIS)*, *Print and Document Services*,
    *Hyper-V*, *Remote Desktop Services*...
  - Un **service de rôle** est une brique d'un rôle (pour IIS : *Static Content*, *ASP.NET 4.8*,
    *Windows Authentication*...).
  - Une **fonctionnalité** est un outil d'appoint : *Windows Server Backup*, *Telnet Client*, *.NET
    Framework*, *Failover Clustering*, les outils d'administration **RSAT**...

  Les deux se gèrent de la même façon :

  ```powershell
  Get-WindowsFeature | Where-Object Installed                 # [X] dans la sortie
  Get-WindowsFeature *web*                                     # recherche par nom
  Install-WindowsFeature Web-Server -IncludeManagementTools    # + console IIS
  Uninstall-WindowsFeature TFTP-Client
  ```

  `-IncludeManagementTools` ajoute les consoles et modules PowerShell ; `-Restart` redémarre si
  nécessaire (`RestartNeeded` dans le résultat). Graphique : Gestionnaire de serveur › *Gérer* › *Ajouter
  des rôles et fonctionnalités*. En ligne de commande historique : `dism /online /enable-feature`.
  Sur Windows 10/11, l'équivalent est `Enable-WindowsOptionalFeature` et les **capacités** (`Get-WindowsCapability`,
  par exemple OpenSSH ou RSAT).

  ## Principe : surface d'attaque minimale

  Chaque rôle installé ajoute des services, des ports et des mises à jour à suivre. On n'installe que ce
  qui est utile, on retire ce qui traîne, et on documente. Pour les serveurs d'infrastructure, **Server
  Core** (sans interface graphique, administré à distance) est recommandé : moins de mises à jour, moins
  de redémarrages, moins de failles.

  ## Outils d'administration

  - **Gestionnaire de serveur** : tableau de bord, ajout de rôles, gestion de plusieurs serveurs.
  - **sconfig** : menu texte de Server Core (nom, domaine, réseau, Bureau à distance, mises à jour).
  - **Windows Admin Center** (WAC) : console web gratuite pour administrer serveurs et postes à distance,
    à installer sur une machine de gestion (pas sur un contrôleur de domaine).
  - **RSAT** sur le poste du technicien : les consoles (Utilisateurs et ordinateurs AD, DNS, DHCP, GPMC)
    sans ouvrir de session sur les serveurs.

  ## Checklist de préparation d'un serveur

  1. **Fiche d'identité** : nom, version et build, matériel, adresse IP, rôle prévu.
  2. Nom définitif et adressage fixe (avant l'installation des rôles : renommer un contrôleur de domaine
     ou un serveur de certificats est pénible).
  3. **Mises à jour** : appliquer le dernier cumulatif, choisir la politique (téléchargement automatique,
     installation manuelle pendant les fenêtres de maintenance, ou WSUS/Intune).
  4. **Heure** : les membres d'un domaine se synchronisent sur la hiérarchie AD ; un serveur autonome
     sur des serveurs NTP (`w32tm`). Kerberos tolère 5 minutes d'écart.
  5. Rôles nécessaires uniquement, puis sécurisation (pare-feu, comptes, antivirus) et sauvegarde.

  ## Windows Update côté serveur

  Les réglages se font par **stratégie** (GPO ou registre local) dans
  `HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU` : `AUOptions` (2 = notifier, 3 =
  télécharger et notifier, 4 = installer automatiquement), `NoAutoRebootWithLoggedOnUsers`... Sur un
  serveur, on évite les redémarrages surprises : téléchargement automatique, installation décidée.
  `Get-HotFix` liste les mises à jour installées.

  ## Pièges courants

  - Installer un rôle « pour voir » et l'oublier (services exposés non suivis).
  - Ne pas lire `RestartNeeded` : le rôle n'est pas fonctionnel avant le redémarrage.
  - Utiliser `Add-WindowsFeature` (ancien alias) ou des noms d'affichage : les cmdlets attendent le **nom
    court** (`Web-Server`, pas « Serveur Web (IIS) »).
