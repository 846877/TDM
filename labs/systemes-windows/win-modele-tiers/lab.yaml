title: Modèle d'administration en tiers
level: expert
order: 6
tags: [active directory, tiering, modèle en tiers, comptes privilégiés, protected users, silos d'authentification, kerberoasting, krbtgt, durcissement]
summary: Cloisonner l'administration d'Active Directory - OU d'administration par tier, comptes séparés, Admins du domaine nettoyés, Protected Users, interdictions de connexion par GPO, silo d'authentification, comptes de service à risque et réinitialisation de krbtgt.
vagrant: bundled
machine: dc01
description: |
  **Contexte.** Un audit de sécurité des *Ateliers Durand* a rendu un verdict sévère : le technicien Julien
  Roux lit ses courriels et navigue avec un compte **administrateur du domaine**, le directeur aussi « au
  cas où », le compte de service de la sauvegarde `svc-backup` (un SPN, un mot de passe de 2019 qui n'expire
  jamais) est lui aussi administrateur du domaine, et le mot de passe du compte `krbtgt` n'a jamais été
  changé. Il suffirait d'un poste compromis pour perdre tout le domaine. Ta mission : mettre en place le
  **modèle d'administration en tiers**.

  **Machines** (prévoir **8 Go de RAM libres**) :

  | VM | Système | Adresse LAN | Rôle |
  |----|---------|-------------|------|
  | `SRV-DC01` (terminal) | Windows Server 2022 (2 Go) | 192.168.10.10 | contrôleur de `durand.lan` (niveau fonctionnel 2016) |
  | `PC01` | Windows 11 (3 Go) | 192.168.10.101 | poste joint, dans l'OU `Postes` |

  L'annuaire contient `Ateliers Durand` (`Utilisateurs`, `Groupes`, `Postes`, `Serveurs`, `Services`), les
  comptes `hgirard`, `jroux`, `mdupont`, `cmoreau` (mot de passe `Bienvenue2024!`) et `svc-backup`. Le
  compte `DURAND\vagrant`, utilisé par la plateforme, reste administrateur du domaine : c'est le compte de
  secours du lab, ne le retire d'aucun groupe. Pour agir sur PC01 : `Invoke-Command -ComputerName PC01 { ... }`.
cours: |
  ## Pourquoi cloisonner l'administration

  Dans un domaine Active Directory, la plupart des compromissions totales suivent le même chemin : un poste
  est infecté (pièce jointe, navigateur), l'attaquant y récupère en mémoire les **empreintes** ou les
  **tickets Kerberos** des comptes qui s'y sont connectés, et rebondit de machine en machine jusqu'à tomber
  sur un compte d'administrateur du domaine. Si un administrateur du domaine ouvre une session, même une
  seule fois, sur un poste de travail, ce poste devient une porte d'entrée vers tout l'annuaire.

  ## Le modèle en tiers

  Le modèle d'administration en tiers (Microsoft parle aujourd'hui de *modèle d'accès entreprise*, avec
  des plans de contrôle, de gestion et d'accès, mais le principe est identique) range chaque ressource dans
  un **niveau de confiance** :

  | Tier | Contenu | Comptes d'administration |
  |------|---------|--------------------------|
  | 0 | contrôleurs de domaine, AD CS, ADFS, tout ce qui contrôle l'identité | `adm0-...`, très peu nombreux |
  | 1 | serveurs et applications métier | `adm1-...` |
  | 2 | postes de travail, imprimantes, terminaux | `adm2-...`, le support |

  Une seule règle, appliquée sans exception : **un compte d'un tier ne se connecte jamais à une machine
  d'un tier inférieur**, car il y exposerait ses secrets. Un compte tier 0 n'ouvre jamais de session sur un
  poste ; le support administre les postes avec son compte tier 2, qui n'a aucun droit sur les serveurs.
  Chaque administrateur a donc **plusieurs comptes** : un compte nominatif ordinaire pour la messagerie et
  la navigation, et un compte d'administration par tier où il intervient.

  ## Les outils de Windows Server

  - **OU d'administration** séparées, à héritage bloqué, pour que les comptes et groupes sensibles ne
    reçoivent ni les GPO ni les délégations des OU métier.
  - **Groupes d'administration minimaux** : *Admins du domaine* presque vide, *Admins de l'entreprise* et
    *Admins du schéma* vides en temps normal.
  - **Protected Users** : les membres n'utilisent plus NTLM, ni DES ou RC4, ni la délégation, et leurs
    identifiants ne sont plus mis en cache.
  - **Droits de connexion refusés par GPO** : *Interdire l'ouverture d'une session locale*, *par les
    services Bureau à distance*, *l'accès à cet ordinateur à partir du réseau*... pour les comptes tier 0
    sur les postes.
  - **Stratégies et silos d'authentification** : restreindre où un compte peut s'authentifier et raccourcir
    la durée de vie de ses tickets.
  - **Hygiène Kerberos** : comptes de service avec SPN et mot de passe faible (*kerberoasting*), rotation du
    mot de passe de `krbtgt`.

  Le modèle ne se déploie pas en un jour sur un parc réel : on commence par inventorier les comptes
  privilégiés, puis on crée les comptes séparés, on vide les groupes, et seulement ensuite on pose les
  interdictions de connexion, après avoir vérifié qu'aucun service ne tourne sous un compte tier 0.
