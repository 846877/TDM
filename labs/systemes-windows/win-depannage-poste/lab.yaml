title: Dépannage du poste utilisateur
level: debutant
order: 10
tags: [windows 11, support, dépannage, imprimante, proxy, hosts, disque, son, fuseau horaire, clavier, journaux]
summary: Une matinée de support de proximité - imprimante bloquée, Internet en panne, disque plein, pas de son, mauvaise heure, clavier, réseau, application qui plante.
vagrant: bundled
description: |
  **Contexte.** Le poste `PC01` de la comptabilité d'*Ateliers Durand* revient d'un salon et accumule les
  problèmes. La file des tickets de la matinée, tous sur ce poste :

  | Ticket | Utilisateur | Symptôme |
  |--------|-------------|----------|
  | 2101 | Marie (compta) | « Mes factures ne sortent pas de l'imprimante Compta-Laser » |
  | 2102 | Marie | « Le site des impôts a une drôle de tête » |
  | 2103 | Marie | « Plus d'Internet dans le navigateur, mais Teams marche » |
  | 2104 | Marie | « Disque plein, Windows me harcèle » |
  | 2105 | Marie | « Plus de son en visio » |
  | 2106 | Marie | « Mes rendez-vous Outlook sont décalés de 9 heures » |
  | 2107 | Marie | « Mon clavier tape des Q à la place des A » |
  | 2108 | Marie | « Le serveur de fichiers a disparu » |
  | 2109 | Marie | « ComptaPro plante au démarrage » |

  **Machine.** Une VM Windows 11 (3 Go de RAM). Terminal PowerShell en administrateur. Pour chaque ticket :
  diagnostiquer, corriger, et pouvoir expliquer la cause à l'utilisateur.
cours: |
  ## La méthode avant les commandes

  Un bon dépannage suit toujours les mêmes étapes :

  1. **Écouter et reformuler** : quoi exactement, depuis quand, pour qui (un utilisateur, un poste, tout
     le monde ?), qu'est-ce qui a changé (mise à jour, déplacement, nouveau logiciel) ?
  2. **Reproduire** et observer : message d'erreur exact, capture d'écran, journal.
  3. **Isoler** : poste ou réseau ? compte ou machine ? Un autre utilisateur sur le même poste, le même
     utilisateur sur un autre poste.
  4. **Corriger** la cause (pas seulement le symptôme), **vérifier** avec l'utilisateur.
  5. **Documenter** le ticket : cause, solution, temps passé. Le prochain technicien gagnera du temps.

  ## Boîte à outils du support

  | Problème | Où regarder | Commandes |
  |----------|-------------|-----------|
  | Impression | file d'attente, spouleur, pilote | `Get-PrintJob`, `Get-Printer`, `Restart-Service Spooler` |
  | Internet / sites | proxy, DNS, hosts | `netsh winhttp show proxy`, `Resolve-DnsName`, fichier hosts |
  | Espace disque | gros fichiers, temporaires, corbeille | `Get-ChildItem -Recurse | Sort-Object Length`, `cleanmgr` |
  | Matériel / son | services, pilotes | `Get-Service Audiosrv`, `devmgmt.msc` |
  | Heure | fuseau, synchronisation | `Get-TimeZone`, `Set-TimeZone`, `w32tm /resync` |
  | Clavier | langues et dispositions | `Get-WinUserLanguageList`, Win+Espace |
  | Réseau | état des cartes, IP | `Get-NetAdapter`, `ipconfig`, `Test-NetConnection` |
  | Plantages | journal Application, ID 1000/1001 | `Get-WinEvent`, Observateur d'événements, `perfmon /rel` |

  ## Impression : la file bloquée

  Une imprimante en **pause** ou un document corrompu en tête de file bloque tous les suivants. Ordre de
  dépannage : reprendre l'impression, supprimer les travaux (`Get-PrintJob -PrinterName X | Remove-PrintJob`),
  et si la file refuse de se vider, arrêter le spouleur, vider `C:\Windows\System32\spool\PRINTERS`,
  redémarrer le spouleur.

  ## Internet : proxy et hosts

  Deux réglages de proxy cohabitent : celui de l'**utilisateur** (*Paramètres* › *Réseau et Internet* ›
  *Proxy*, clé `HKCU:\...\Internet Settings`, utilisé par les navigateurs) et celui de **WinHTTP** (`netsh
  winhttp`, utilisé par des services système et certaines applications). Un proxy laissé par un autre
  réseau (salon, hôtel) explique bien des « Internet ne marche pas ». Le fichier **hosts**, consulté avant le
  DNS, est une cible des logiciels malveillants pour détourner des sites (banques, impôts) : toute entrée
  inconnue est suspecte.

  ## Espace disque

  Avant de supprimer quoi que ce soit, on **mesure** : les plus gros fichiers et dossiers, les dossiers
  temporaires, la corbeille, `C:\Windows\SoftwareDistribution\Download`, les anciennes installations de
  Windows. *Paramètres* › *Stockage* et l'**assistant de stockage** font le ménage automatique. On ne
  supprime jamais un fichier utilisateur sans son accord (ou sans l'avoir déplacé ailleurs).

  ## Langue, clavier, heure

  Le clavier dépend de la **liste des langues de l'utilisateur** : `Set-WinUserLanguageList` (ou *Paramètres*
  › *Heure et langue*). Win+Espace bascule entre dispositions : un raccourci souvent pressé par erreur.
  Le **fuseau horaire** décale l'affichage des heures (Outlook, journaux) : `Set-TimeZone -Id 'Romance
  Standard Time'` pour Paris.

  ## Journaux et fiabilité

  L'événement **1000** (*Application Error*) du journal Application décrit un plantage : application,
  **module défaillant**, code d'exception (`0xc0000005` = violation d'accès). Le **moniteur de fiabilité**
  (`perfmon /rel`) les affiche sur une frise chronologique, avec les installations récentes : idéal pour
  repérer « depuis la mise à jour de mardi ».

  ## Pièges courants

  - Réinstaller avant d'avoir compris : la panne reviendra.
  - Corriger le proxy dans le navigateur et oublier WinHTTP (ou l'inverse).
  - Supprimer des fichiers « gros donc inutiles » qui étaient les seules copies d'un utilisateur.
  - Fermer le ticket sans vérifier avec l'utilisateur.
