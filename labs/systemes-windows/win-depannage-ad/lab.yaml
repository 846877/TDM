title: Dépannage Active Directory - le lundi noir
level: expert
order: 1
tags: [active directory, dépannage, dns, srv, canal sécurisé, kerberos, w32time, gpo, agdlp, dcdiag, nltest]
summary: Remettre en marche un domaine et un poste où tout casse en même temps - localisateur de DC, redirecteur DNS, DNS du poste, canal sécurisé, heure, GPO filtrée, compte bloqué, chaîne AGDLP - avec méthode et preuves.
vagrant: bundled
machine: dc01
description: |
  **Contexte.** Lundi, 8 h 10, chez les *Ateliers Durand*. Le prestataire précédent est intervenu pendant le
  week-end « pour faire du ménage ». Depuis : plus d'Internet sur le serveur, le poste PC01 « n'est plus dans
  le domaine », le message légal a disparu des postes, Marie Dupont (comptabilité) ne peut plus se
  connecter et, quand elle le pourra, n'aura plus accès au partage `Compta`. À toi de tout remettre en
  ordre, **sans réinstaller ni rejoindre à nouveau le domaine**.

  **Machines** (prévoir **8 Go de RAM libres**) :

  | VM | Système | Adresse LAN | Rôle |
  |----|---------|-------------|------|
  | `SRV-DC01` (terminal) | Windows Server 2022 (2 Go) | 192.168.10.10 | contrôleur de `durand.lan`, DNS, partage `Compta` |
  | `PC01` | Windows 11 (3 Go) | 192.168.10.101 | poste du domaine, dans l'OU `Postes` |

  Comptes : `DURAND\vagrant` / `vagrant` (administrateur du domaine), `PC01\vagrant` / `vagrant`
  (administrateur local du poste), utilisateurs du domaine `Bienvenue2024!`. Si `Invoke-Command -ComputerName PC01`
  échoue (Kerberos), passe par le compte **local** : ajoute `192.168.10.101` aux *TrustedHosts* de SRV-DC01 puis
  `Invoke-Command -ComputerName 192.168.10.101 -Credential PC01\vagrant { ... }`.
cours: |
  ## Une méthode avant les commandes

  Face à plusieurs pannes simultanées, la tentation est de tout essayer en même temps. La méthode qui
  marche : **constater** (symptômes précis, messages exacts, depuis quand), **collecter** (journaux,
  `dcdiag`, `nltest`, `ipconfig /all`), **remonter les dépendances** et réparer **dans l'ordre** où les
  services dépendent les uns des autres, **vérifier** après chaque correction, **documenter**. Dans un
  domaine Active Directory, l'ordre est presque toujours le même :

  1. **le réseau et le DNS** : un poste trouve son contrôleur grâce aux enregistrements **SRV** du DNS
     (`_ldap._tcp.dc._msdcs.<domaine>`, `_kerberos._tcp...`), enregistrés par le service **Netlogon** du
     DC. Un poste qui utilise un DNS public ou inexistant ne trouve plus le domaine, quoi qu'on fasse
     ensuite ;
  2. **l'heure** : Kerberos refuse les tickets si l'écart dépasse **5 minutes**. Les membres se
     synchronisent sur un DC (hiérarchie `NT5DS`), le DC émulateur PDC sur une source externe ;
  3. **le canal sécurisé** : chaque ordinateur du domaine a un compte et un **mot de passe machine**,
     changé automatiquement tous les 30 jours. S'il diffère entre le poste et l'annuaire (restauration
     d'instantané, réinitialisation du compte), le poste ne peut plus authentifier personne :
     « la relation d'approbation entre cette station de travail et le domaine principal a échoué ». On
     répare sans quitter le domaine : `Test-ComputerSecureChannel -Repair` ;
  4. **les GPO** : lien, filtrage de sécurité (lecture **et** application), contenu ;
  5. **les comptes et les droits** : état du compte (activé, expiré, verrouillé, horaires), appartenance
     aux groupes (chaîne AGDLP), permissions de partage et NTFS.

  ## Les outils du diagnostic

  | Outil | Ce qu'il dit |
  |-------|--------------|
  | `dcdiag /v`, `dcdiag /test:dns` | santé du DC : services, annonces, DNS, réplication |
  | `nltest /dsgetdc:durand.lan` | le poste trouve-t-il un DC, lequel, avec quels indicateurs |
  | `nltest /sc_query:durand.lan`, `Test-ComputerSecureChannel` | état du canal sécurisé |
  | `Resolve-DnsName -Type SRV` | enregistrements du localisateur |
  | `w32tm /query /status`, `w32tm /stripchart` | source et écart de temps |
  | `gpresult /r`, `Get-GPPermission`, `Get-GPInheritance` | GPO appliquées ou filtrées, et pourquoi |
  | `Get-ADUser -Properties *`, `net user /domain` | état détaillé d'un compte |

  ## Le piège de l'accès au poste cassé

  Quand le canal sécurisé est rompu, l'authentification du domaine vers le poste ne fonctionne plus :
  WinRM en Kerberos échoue. Il reste le **compte local** (d'où l'importance de le connaître... et de le
  protéger avec LAPS), joint par son **adresse IP** en NTLM, ce qui exige de déclarer l'hôte dans les
  *TrustedHosts* du client. C'est aussi pourquoi on ne supprime jamais le dernier moyen d'administration
  local d'un poste.

  ## Documenter

  Un incident se termine par un compte rendu : chronologie, cause racine, actions, et mesures pour que
  cela ne se reproduise pas (ici : procédure de changement, revue des accès du prestataire, supervision
  des enregistrements SRV et de l'heure).
