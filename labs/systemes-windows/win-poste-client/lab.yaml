title: Configuration du poste client Windows 11
level: debutant
order: 9
tags: [windows 11, poste client, registre, winget, imprimantes, pilotes, comptes, restauration, énergie, mises à jour]
summary: Préparer le poste d'un nouveau salarié - fiche du poste, comptes locaux, énergie, registre, logiciels avec winget, imprimante réseau, pilotes, point de restauration.
vagrant: bundled
description: |
  **Contexte.** Un nouveau commercial arrive chez *Ateliers Durand* et récupère le poste `PC01`
  (Windows 11). Tu dois le préparer selon la fiche de procédure « mise en service d'un poste » : fiche
  d'inventaire, comptes, réglages, logiciels, imprimante, sauvegarde des pilotes et point de restauration.
  Le poste n'est pas (encore) dans un domaine.

  **Machine.** Une VM Windows 11 (3 Go de RAM). Terminal PowerShell en administrateur (`vagrant`).
  L'interface graphique (console VirtualBox ou `mstsc /v:127.0.0.1:33389`) est utile pour certains
  contrôles : *Paramètres*, *Panneau de configuration*, `regedit`, `printmanagement.msc`, `devmgmt.msc`.

  L'imprimante du rez-de-chaussée a l'adresse `192.168.10.50` (elle n'existe pas dans le lab : Windows
  crée quand même la file d'attente).
cours: |
  ## Le poste de travail, premier terrain du technicien

  En PME, l'essentiel des tickets concerne les **postes clients** : installation, réglages, imprimantes,
  logiciels, lenteurs. Une procédure écrite de mise en service garantit des postes homogènes et
  documentés (inventaire GLPI, numéro de série pour la garantie).

  ## Comptes : local, Microsoft, professionnel

  | Type | Exemple | Où vit-il ? |
  |------|---------|-------------|
  | Compte **local** | `PC01\accueil` | base SAM du poste |
  | Compte **Microsoft** | prenom@outlook.fr | cloud grand public (déconseillé en entreprise) |
  | Compte de **domaine** | `DURAND\mdupont` | Active Directory |
  | Compte **Entra ID** (professionnel) | m.dupont@durand.fr | Microsoft 365 / Intune |

  Sur un poste d'entreprise : un compte de domaine (ou Entra ID) pour l'utilisateur, **standard** (pas
  administrateur), et un compte **administrateur local** de secours géré par le service informatique
  (idéalement par **Windows LAPS**, qui change son mot de passe automatiquement).

  ## Le registre

  Base de configuration hiérarchique : **clés** (dossiers) et **valeurs** (nom, type, donnée).

  - `HKLM` (`HKEY_LOCAL_MACHINE`) : réglages de la machine, pour tous les utilisateurs (admin requis).
  - `HKCU` (`HKEY_CURRENT_USER`) : réglages de l'utilisateur connecté (son fichier `NTUSER.DAT`).
  - Types : `REG_SZ` (texte), `REG_DWORD` (nombre 32 bits), `REG_MULTI_SZ`, `REG_BINARY`...
  - Les clés `...\Policies\...` sont celles que remplissent les **stratégies de groupe**.

  ```powershell
  Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
  Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name HideFileExt -Value 0
  reg export "HKLM\SOFTWARE\Policies\Microsoft\Windows" C:\Admin\sauvegarde.reg /y
  ```

  Règle d'or : **exporter** une clé avant de la modifier (`reg export`, ou *Fichier › Exporter* dans
  `regedit`) ; un double-clic sur le `.reg` la restaure.

  ## Logiciels : winget

  **winget** (Gestionnaire de package Windows) installe, met à jour et désinstalle des logiciels depuis un
  dépôt :

  ```
  winget search 7zip
  winget install --id 7zip.7zip -e --silent --accept-package-agreements --accept-source-agreements
  winget upgrade --all
  winget list
  ```

  En entreprise, on déploie plutôt par GPO (MSI), Intune, PDQ ou un outil de télédistribution, mais winget
  est parfait pour un poste isolé ou un script de préparation.

  ## Imprimantes et pilotes

  Une imprimante réseau = un **port** (TCP/IP, l'adresse de l'imprimante, port 9100 « RAW » ou IPP), un
  **pilote** (le langage : PCL, PostScript, ou pilote du constructeur) et une **file d'attente** (le nom vu
  par l'utilisateur). Le **spouleur** (`Spooler`) gère le tout.

  ```powershell
  Add-PrinterPort -Name IP_192.168.10.50 -PrinterHostAddress 192.168.10.50
  Add-PrinterDriver -Name 'Generic / Text Only'
  Add-Printer -Name Imprimante-RDC -PortName IP_192.168.10.50 -DriverName 'Generic / Text Only'
  ```

  Avant une réinstallation, on **sauvegarde les pilotes** tiers (`Export-WindowsDriver -Online`) ; le
  Gestionnaire de périphériques (`devmgmt.msc`) et `pnputil /enum-drivers` les listent.

  ## Énergie, démarrage, restauration, mises à jour

  - `powercfg` règle les délais d'extinction de l'écran et de mise en veille (`/change monitor-timeout-ac 10`).
  - Les programmes lancés au démarrage : clés `Run` de `HKLM` et `HKCU`, dossier *Démarrage*, onglet
    *Démarrage* du Gestionnaire des tâches. Un démarrage lent ? On regarde là d'abord.
  - La **protection du système** crée des **points de restauration** (clichés des fichiers système et du
    registre) avant les installations : `Enable-ComputerRestore`, `Checkpoint-Computer`, `rstrui`.
    Ce n'est **pas** une sauvegarde des documents.
  - Windows Update : les **heures d'activité** évitent un redémarrage en pleine journée.

  ## Pièges courants

  - Modifier `HKCU` en tant qu'administrateur dans une autre session : on change le profil de
    l'administrateur, pas celui de l'utilisateur.
  - Donner les droits administrateur au salarié « pour qu'il installe ses logiciels ».
  - Oublier que winget et la protection du système dépendent du contexte (session, édition de Windows).
