exercises:
  - id: premier-pod
    title: Premier pod
    description: |
      Lance un pod `hello` (image `nginx:1.27`) dans le namespace `default`, avec le label `app=hello`.
    hint: "kubectl run hello --image=... --labels=app=hello"
    cours: |
      Un **pod** est la plus petite unité de Kubernetes : un ou plusieurs conteneurs qui partagent la même
      adresse IP et peuvent partager des volumes. La plupart du temps, un pod contient un seul conteneur.

      `kubectl run nom --image=...` crée un pod isolé, sans contrôleur : s'il est supprimé, rien ne le recrée.
      L'option `--labels` (ou `-l`) pose des étiquettes `clé=valeur`, que les autres objets utilisent pour
      retrouver les pods.

      `kubectl get pods --show-labels` affiche les étiquettes, `kubectl describe pod hello` les événements
      (téléchargement de l'image, démarrage). Le pod passe par les états `Pending`, `ContainerCreating`, puis
      `Running`.
    checks:
      - desc: Le pod hello tourne
        run: test "$(sudo kubectl get pod hello -o jsonpath='{.status.phase}')" = Running
      - desc: Il porte le label app=hello
        run: sudo kubectl get pods -l app=hello --no-headers | grep -q hello
  - id: manifeste
    title: Déploiement par manifeste
    description: |
      Écris `/home/vagrant/whoami.yaml` qui décrit un déploiement `whoami` (image `traefik/whoami:v1.10`,
      2 réplicas) et un service ClusterIP `whoami` sur le port 80. Applique-le.
    cours: |
      Un manifeste décrit un ou plusieurs objets en YAML, séparés par `---`. Chaque objet a quatre parties :
      `apiVersion`, `kind`, `metadata` (nom, labels) et `spec` (l'état désiré).

      Pour un **Deployment** : `replicas`, `selector.matchLabels` et `template` (le modèle de pod, dont les
      labels doivent correspondre au sélecteur). Pour un **Service** : `selector` (les labels des pods visés) et
      `ports` (`port` exposé par le service, `targetPort` du conteneur). Le type par défaut, `ClusterIP`, rend le
      service joignable uniquement dans le cluster.

      `kubectl apply -f` crée ou met à jour les objets ; `kubectl get endpoints whoami` vérifie que le service a
      trouvé ses pods.
    checks:
      - desc: Le manifeste existe
        run: |
          grep -q 'kind: Deployment' /home/vagrant/whoami.yaml && grep -q 'kind: Service' /home/vagrant/whoami.yaml
      - desc: 2 réplicas disponibles
        run: test "$(sudo kubectl get deploy whoami -o jsonpath='{.status.availableReplicas}')" = 2
      - desc: Le service répond
        run: curl -fsS --max-time 5 "http://$(sudo kubectl get svc whoami -o jsonpath='{.spec.clusterIP}')" | grep -q Hostname
  - id: mise-a-jour
    title: Mise à jour progressive
    description: |
      Passe le déploiement `whoami` en image `traefik/whoami:v1.11` puis monte-le à 4 réplicas.
      L'historique doit contenir au moins 2 révisions.
    hint: "kubectl set image, kubectl scale, kubectl rollout history"
    cours: |
      Modifier le modèle de pod d'un Deployment (l'image par exemple) déclenche une **mise à jour progressive**
      (*rolling update*) : un nouveau ReplicaSet est créé et monte en charge pendant que l'ancien descend, sans
      interruption de service. `maxSurge` et `maxUnavailable` règlent le rythme.

      `kubectl set image deploy/NOM CONTENEUR=IMAGE` change l'image ; le nom du conteneur est celui du
      manifeste. `kubectl scale` change seulement le nombre de réplicas, ce qui ne crée **pas** de révision.

      `kubectl rollout status` suit la progression, `rollout history` liste les révisions et `rollout undo`
      revient à la précédente.
    checks:
      - desc: Image v1.11
        run: sudo kubectl get deploy whoami -o jsonpath='{.spec.template.spec.containers[0].image}' | grep -q 'v1.11'
      - desc: 4 réplicas disponibles
        run: test "$(sudo kubectl get deploy whoami -o jsonpath='{.status.availableReplicas}')" = 4
      - desc: Au moins 2 révisions
        run: test "$(sudo kubectl rollout history deploy/whoami | grep -cE '^[0-9]+')" -ge 2
  - id: sondes
    title: Sondes de santé
    description: |
      Ajoute au déploiement `whoami` une `readinessProbe` et une `livenessProbe` HTTP sur le chemin `/health`
      (port 80) : Kubernetes n'envoie du trafic qu'aux pods prêts et redémarre ceux qui ne répondent plus.
    hint: "readinessProbe: httpGet: path: /health, port: 80 — à ajouter dans whoami.yaml puis kubectl apply -f"
    cours: |
      Kubernetes ne sait pas si ton application fonctionne vraiment : un processus vivant peut être bloqué. Les
      **sondes** le lui disent :
      - la **readinessProbe** indique si le pod est prêt à recevoir du trafic ; tant qu'elle échoue, le pod est
        retiré des endpoints du Service ;
      - la **livenessProbe** indique s'il est vivant ; en cas d'échecs répétés, le conteneur est redémarré ;
      - la **startupProbe** laisse du temps aux applications lentes à démarrer.

      Une sonde peut être `httpGet` (chemin et port), `tcpSocket` ou `exec`. Paramètres : `initialDelaySeconds`,
      `periodSeconds`, `failureThreshold`. Les sondes font partie du conteneur, dans le template du Deployment.
    checks:
      - desc: readinessProbe sur /health
        run: sudo kubectl get deploy whoami -o jsonpath='{.spec.template.spec.containers[0].readinessProbe.httpGet.path}' | grep -qx /health
      - desc: livenessProbe sur /health
        run: sudo kubectl get deploy whoami -o jsonpath='{.spec.template.spec.containers[0].livenessProbe.httpGet.path}' | grep -qx /health
      - desc: 4 réplicas toujours disponibles
        run: test "$(sudo kubectl get deploy whoami -o jsonpath='{.status.availableReplicas}')" = 4
  - id: quotas
    title: Namespace, quota et valeurs par défaut
    description: |
      Prépare un espace pour une équipe :
      1. Crée le namespace `equipe`.
      2. Ajoute un ResourceQuota `quota` : au plus **4 pods**, `requests.cpu` 1 et `requests.memory` 1Gi.
      3. Ajoute un LimitRange `defauts` qui donne aux conteneurs sans ressources une requête par défaut de
         `100m` CPU et `128Mi` de mémoire (et une limite par défaut de `256Mi`).

      Teste : un 5ᵉ pod doit être refusé.
    hint: "kubectl create quota quota -n equipe --hard=pods=4,requests.cpu=1,requests.memory=1Gi ; le LimitRange s'écrit en YAML (type: Container, defaultRequest, default)"
    cours: |
      Un **namespace** isole les objets d'une équipe ou d'un environnement : les noms n'ont besoin d'être uniques
      qu'à l'intérieur d'un namespace.

      Un **ResourceQuota** plafonne la consommation totale du namespace : nombre d'objets (`pods`) et somme des
      ressources demandées (`requests.cpu`, `requests.memory`). Dès qu'un quota porte sur les ressources, chaque
      pod **doit** déclarer ses requêtes, sinon il est refusé.

      C'est là qu'intervient le **LimitRange** : il fournit des valeurs par défaut aux conteneurs qui n'en ont pas
      (`defaultRequest` pour les requêtes, `default` pour les limites), et peut imposer des minimums et maximums.
      `kubectl describe quota -n equipe` montre la consommation actuelle.
    checks:
      - desc: Le quota limite à 4 pods
        run: test "$(sudo kubectl -n equipe get resourcequota quota -o jsonpath='{.spec.hard.pods}')" = 4
      - desc: Un pod sans ressources reçoit 100m CPU par défaut
        run: |
          test "$(sudo kubectl -n equipe run test-defauts --image=nginx:1.27 --dry-run=server -o jsonpath='{.spec.containers[0].resources.requests.cpu}')" = 100m
      - desc: Et une limite mémoire de 256Mi
        run: |
          test "$(sudo kubectl -n equipe run test-defauts --image=nginx:1.27 --dry-run=server -o jsonpath='{.spec.containers[0].resources.limits.memory}')" = 256Mi
  - id: cronjob
    title: Tâches planifiées (CronJob)
    description: |
      Crée le CronJob `horodatage` (namespace `default`) qui lance **chaque minute** un conteneur `busybox:1.36`
      exécutant `date`, en ne gardant que les **2** derniers jobs réussis. Attends qu'un job se termine et lis son
      log (`kubectl logs job/<nom>`).
    hint: "kubectl create cronjob horodatage --image=busybox:1.36 --schedule='*/1 * * * *' -- date ; puis successfulJobsHistoryLimit: 2"
    cours: |
      Un **Job** lance un ou plusieurs pods jusqu'à ce qu'ils se terminent avec succès (avec des nouvelles
      tentatives en cas d'échec). Un **CronJob** crée des Jobs selon un calendrier au format cron
      (`*/5 * * * *`).

      Champs utiles du CronJob : `schedule`, `jobTemplate` (le modèle de Job, qui contient lui-même un modèle de
      pod avec `restartPolicy: OnFailure` ou `Never`), `successfulJobsHistoryLimit` et
      `failedJobsHistoryLimit` (nombre de Jobs terminés conservés), `concurrencyPolicy`.

      `kubectl create cronjob` génère la structure ; `kubectl get jobs --watch` montre les exécutions, et
      `kubectl logs job/NOM` le résultat.
    checks:
      - desc: Le CronJob tourne chaque minute
        run: sudo kubectl get cronjob horodatage -o jsonpath='{.spec.schedule}' | grep -Eqx '\*(/1)? \* \* \* \*'
      - desc: Historique limité à 2 jobs réussis
        run: test "$(sudo kubectl get cronjob horodatage -o jsonpath='{.spec.successfulJobsHistoryLimit}')" = 2
      - desc: Au moins un job s'est terminé avec succès
        run: |
          sudo kubectl get jobs -o jsonpath='{range .items[*]}{.metadata.ownerReferences[0].name} {.status.succeeded}{"\n"}{end}' | grep -q '^horodatage 1$'
  - id: depannage
    title: Dépanner une application
    description: |
      Applique ce manifeste (enregistre-le dans `/home/vagrant/depannage.yaml`) : l'application ne démarre pas
      et le service ne répond pas. Trouve et corrige les **deux** erreurs avec `kubectl get`, `describe`,
      `get endpoints`… jusqu'à ce que le service réponde.

      ```yaml
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: depannage
      spec:
        replicas: 2
        selector:
          matchLabels: {app: depannage}
        template:
          metadata:
            labels: {app: depannage}
          spec:
            containers:
              - name: web
                image: nginx:1.27-alpinne
                ports: [{containerPort: 80}]
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: depannage
      spec:
        selector: {app: depanage}
        ports: [{port: 80, targetPort: 80}]
      ```
    hint: "ImagePullBackOff indique un problème d'image ; un service sans endpoints a souvent un sélecteur qui ne correspond à aucun pod"
    cours: |
      La démarche de diagnostic Kubernetes :
      1. `kubectl get pods` : l'état (`ErrImagePull`, `ImagePullBackOff`, `CrashLoopBackOff`, `Pending`) ;
      2. `kubectl describe pod NOM` : la section **Events** en bas donne la cause (image introuvable, ressources
         insuffisantes, sonde en échec) ;
      3. `kubectl logs NOM` : les erreurs de l'application ;
      4. pour un Service : `kubectl get endpoints NOM`. Une liste vide signifie que le **sélecteur** ne
         correspond aux labels d'aucun pod prêt.

      Compare caractère par caractère : une faute de frappe dans une image ou un label suffit. Corrige le
      manifeste puis réapplique-le.
    checks:
      - desc: 2 réplicas disponibles
        run: test "$(sudo kubectl get deploy depannage -o jsonpath='{.status.availableReplicas}')" = 2
      - desc: Le service a des endpoints
        run: sudo kubectl get endpoints depannage -o jsonpath='{.subsets[*].addresses[*].ip}' | grep -q .
      - desc: Le service répond
        run: curl -fsS --max-time 5 "http://$(sudo kubectl get svc depannage -o jsonpath='{.spec.clusterIP}')" | grep -qi nginx
