title: Kubernetes avec Minikube
level: intermediaire
order: 5
tags: [kubernetes, minikube, kubectl, vagrant]
summary: Un Kubernetes mono-nœud dans une VM pour débuter avec kubectl.
vagrant: minikube/minikube_ubuntu22
description: |
  Lab Vagrant de ta formation : une VM Ubuntu 22.04 avec Minikube (driver `none`, Kubernetes 1.32).
  `kubectl` s'utilise en root : `sudo -i` ou `sudo kubectl ...`. Prévois 4 Go de RAM libres.
cours: |
  ## Kubernetes : orchestrer des conteneurs

  Docker lance des conteneurs sur une machine. **Kubernetes** (K8s) les orchestre sur un cluster : il
  décide où les placer, les redémarre, les met à l'échelle, les expose et les met à jour sans interruption.
  **Minikube** fournit un cluster d'un seul nœud pour apprendre et développer.

  ### Le modèle déclaratif

  On ne dit pas à Kubernetes « lance trois conteneurs », on lui décrit un **état désiré** (« je veux trois
  réplicas de cette image ») dans un manifeste YAML. Des **contrôleurs** comparent en permanence l'état
  désiré et l'état réel, et agissent pour les faire converger : c'est la **boucle de réconciliation**.

  ### Architecture

  ```
   kubectl ──▶ ┌───────────── plan de contrôle ─────────────┐
               │ kube-apiserver ◀──▶ etcd (état du cluster) │
               │ scheduler   controller-manager             │
               └───────────────────┬────────────────────────┘
                       ┌───────────┴───────────┐
                  ┌────▼────┐             ┌────▼────┐
                  │ nœud    │ kubelet     │ nœud    │ kubelet, kube-proxy,
                  │ [pod]   │ kube-proxy  │ [pod]   │ runtime (containerd)
                  └─────────┘             └─────────┘
  ```

  ### Les objets essentiels

  | Objet | Rôle |
  |---|---|
  | **Pod** | un ou plusieurs conteneurs partageant réseau et volumes ; unité de base, éphémère |
  | **Deployment** | maintient N réplicas d'un pod via un ReplicaSet ; mises à jour progressives |
  | **Service** | adresse et nom DNS stables devant un groupe de pods (sélection par labels) |
  | **ConfigMap / Secret** | configuration et données sensibles injectées dans les pods |
  | **Namespace** | espace de noms pour séparer équipes ou environnements |
  | **Job / CronJob** | tâches ponctuelles ou planifiées |
  | **ResourceQuota / LimitRange** | limites de consommation par namespace |

  Les **labels** (`app: whoami`) sont la colle de Kubernetes : un Service ou un Deployment trouve ses pods
  grâce à un **sélecteur** de labels, jamais par leur nom.

  ### Un manifeste

  ```yaml
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: whoami
  spec:
    replicas: 2
    selector:
      matchLabels: { app: whoami }
    template:
      metadata:
        labels: { app: whoami }      # doit correspondre au sélecteur
      spec:
        containers:
          - name: whoami
            image: traefik/whoami:v1.10
            ports: [{ containerPort: 80 }]
  ```

  ### Mémo kubectl

  ```bash
  kubectl get pods,deploy,svc -o wide ; kubectl get all -n equipe
  kubectl describe pod NOM            # événements : le premier réflexe de diagnostic
  kubectl logs NOM [-c conteneur] [-f] [--previous]
  kubectl apply -f fichier.yaml ; kubectl delete -f fichier.yaml
  kubectl set image deploy/whoami whoami=traefik/whoami:v1.11
  kubectl rollout status|history|undo deploy/whoami
  kubectl scale deploy/whoami --replicas=4
  kubectl explain deployment.spec.template.spec.containers
  kubectl run test --image=busybox:1.36 --rm -it -- sh
  ```

  ### Pièges courants

  - Labels du template différents du sélecteur : le Deployment est refusé, ou le Service n'a aucun endpoint.
  - `ImagePullBackOff` : nom ou tag d'image erroné.
  - `CrashLoopBackOff` : le conteneur démarre puis plante ; lis `kubectl logs --previous`.
  - `Pending` : pas assez de ressources ou contrainte de placement impossible (`describe` l'explique).
  - Modifier un pod à la main : il sera remplacé par le Deployment avec la définition d'origine.

  ### Bonnes pratiques

  Manifestes versionnés et appliqués avec `kubectl apply`, images taguées précisément, sondes de santé,
  requêtes et limites de ressources, un namespace par équipe ou environnement, et jamais de secrets en clair
  dans le dépôt.
docs:
  - title: Documentation Kubernetes (français)
    url: https://kubernetes.io/fr/docs/home/
  - title: Concepts Kubernetes
    url: https://kubernetes.io/fr/docs/concepts/
  - title: Aide-mémoire kubectl
