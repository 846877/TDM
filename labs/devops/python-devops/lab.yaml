title: Python pour le DevOps
level: debutant
order: 4
tags: [python, venv, pip, api, flask, pytest, automatisation]
summary: Environnements virtuels, scripts d'automatisation, API, sonde, tests et paquet installable.
image: python:3.12-slim
ports: ["5001:5000"]
shell: bash
workdir: /root
setup: |
  mkdir -p /root/projet && printf '{"serveurs": [{"nom": "web1", "cpu": 82}, {"nom": "web2", "cpu": 35}, {"nom": "db1", "cpu": 91}]}\n' > /root/projet/metrics.json
  python3 - <<'EOF'
  ips = ["10.0.0.1"] * 40 + ["10.0.0.2"] * 25 + ["192.168.1.7"] * 18 + ["172.16.0.9"] * 12 + ["10.0.0.3"] * 5
  pages = ["/", "/login", "/api/serveurs", "/static/app.css", "/admin"]
  codes = ["200"] * 7 + ["404", "500", "301"]
  with open("/root/projet/access.log", "w") as f:
      for i in range(100):
          ip = ips[(i * 37) % 100]
          f.write(f'{ip} - - [18/Oct/2026:10:{i // 60:02d}:{i % 60:02d} +0000] "GET {pages[i % 5]} HTTP/1.1" {codes[i % 10]} {500 + i * 7}\n')
  EOF
description: |
  Le lab Vagrant `python` de ta formation est une VM de bureau avec PyCharm. Ici, on se concentre sur
  l'usage de Python en ops, dans un conteneur Python 3.12. Pour l'apprentissage du langage, il y a
  la catégorie **Python** de la plateforme.

  Travaille dans `/root/projet`. Le port 5000 du conteneur est publié sur **http://localhost:5001**.

  Le parcours : environnement virtuel, scripts d'automatisation (alertes, analyse de logs, sauvegarde avec
  rotation), petite API, sonde de supervision, tests automatisés et enfin un outil installable avec `pip`.
cours: |
  ## Python, le couteau suisse de l'ops

  Quand un script Bash dépasse quelques dizaines de lignes, qu'il faut manipuler du JSON, appeler une API ou
  écrire des tests, Python prend le relais. Ansible, de nombreux outils cloud (AWS CLI, Azure CLI), les
  exporters Prometheus ou les scripts de migration sont écrits en Python.

  ### Isoler les dépendances

  Le Python du système appartient au système : on n'y installe rien. Chaque projet a son **environnement
  virtuel**, un dossier qui contient un interpréteur et ses propres paquets.

  ```
  projet/
  ├── .venv/             ← python -m venv .venv (jamais commité)
  ├── requirements.txt   ← dépendances figées (pip freeze)
  ├── pyproject.toml     ← métadonnées du projet, commandes
  ├── alerte.py
  └── tests/
      └── test_alerte.py
  ```

  On peut « activer » le venv (`source .venv/bin/activate`) ou appeler directement `.venv/bin/python` et
  `.venv/bin/pip`, ce qui est plus sûr dans les scripts et la CI.

  ### Un script d'ops bien élevé

  Un script destiné à être lancé par d'autres outils (cron, CI, supervision) respecte un contrat :

  | Élément | Outil Python |
  |---|---|
  | Arguments et aide | `argparse` (ou `sys.argv`) |
  | Code de sortie | `sys.exit(0)` succès, autre valeur = échec |
  | Messages d'erreur | `print(..., file=sys.stderr)` |
  | Données structurées | `json.load` / `json.dumps` |
  | Fichiers et chemins | `pathlib.Path` |
  | Commandes externes | `subprocess.run([...], check=True)` |
  | HTTP | `urllib.request` ou `requests` |

  Le code de sortie est essentiel : c'est lui que lisent le shell (`&&`, `||`), les pipelines de CI et les
  sondes de supervision (convention Nagios : 0 OK, 1 WARNING, 2 CRITICAL).

  ```python
  import argparse, json, sys

  def main() -> int:
      parser = argparse.ArgumentParser(description="Alerte CPU")
      parser.add_argument("seuil", type=int)
      args = parser.parse_args()
      ...
      return 1 if alertes else 0

  if __name__ == "__main__":
      sys.exit(main())
  ```

  Le bloc `if __name__ == "__main__"` permet d'importer le module (dans des tests, depuis une commande
  installée) sans lancer le script.

  ### Tester

  `pytest` découvre les fichiers `test_*.py` et les fonctions `test_*`, et utilise de simples `assert`.
  Pour tester un script en boîte noire, on le lance avec `subprocess.run(..., capture_output=True,
  text=True)` puis on vérifie `returncode` et `stdout`.

  ### Distribuer un outil

  `pyproject.toml` décrit le projet (nom, version, dépendances) et peut déclarer des **commandes** dans
  `[project.scripts]`. `pip install -e .` installe le projet en mode *éditable* : les modifications du code
  sont prises en compte immédiatement.

  ### Pièges courants

  - `pip install` hors venv (avec `sudo` en prime) : conflits avec les paquets du système.
  - Oublier `requirements.txt` : la CI n'a pas les mêmes versions que toi.
  - Un `except: pass` qui avale toutes les erreurs : le script « réussit » alors qu'il a échoué.
  - Pas de délai (`timeout`) sur les appels réseau : la sonde reste bloquée indéfiniment.
  - Comparer des nombres lus dans un fichier sans les convertir (`"9" > "80"` est vrai en texte !).

  ### Bonnes pratiques

  Des fonctions petites et testables, la bibliothèque standard d'abord, des dépendances épinglées, un
  formateur et un linter (`ruff`, `black`) dans la CI.

  ### Pour réviser

  - Pourquoi ne jamais installer de paquets avec `pip` dans le Python du système ?
  - Que lit un outil de supervision dans le résultat d'une sonde ?
  - Pourquoi le bloc `if __name__ == "__main__"` est-il utile pour les tests ?
  - Qu'apporte `pip install -e .` par rapport à un `pip install .` classique ?
