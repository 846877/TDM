    url: https://docs.k3s.io/
  - title: Service Kubernetes
    url: https://kubernetes.io/fr/docs/concepts/services-networking/service/
  - title: Déploiements Kubernetes
    url: https://kubernetes.io/fr/docs/concepts/workloads/controllers/deployment/
  - title: Déboguer une application
