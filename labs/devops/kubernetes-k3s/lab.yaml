title: Kubernetes avec k3s
level: avance
order: 5
tags: [kubernetes, k3s, kubectl, déploiement, stockage]
summary: Un vrai cluster k3s sans VM - déploiements, services, ConfigMap, sondes, stockage, rollback, jobs et dépannage.
compose: docker-compose.yml
service: ops
shell: bash
workdir: /root
description: |
  Un cluster **k3s** (Kubernetes certifié CNCF, en version légère) tourne dans le conteneur `k3s`.
  Ton terminal est sur **ops**, avec `kubectl` (alias `k`, complétion activée) déjà configuré.
  Le cluster met une trentaine de secondes à démarrer : attends que `kubectl get nodes` affiche `Ready`.

  Les NodePort sont joignables depuis ops à l'adresse `http://k3s:<port>`, et le port **30080** est publié sur
  **http://localhost:30880** de ta machine.

  Le parcours : explorer le cluster, déployer et exposer une application, la configurer, la rendre robuste,
  lui donner du stockage persistant, la mettre à jour (et revenir en arrière), lancer des tâches, puis dépanner
  une application cassée. Travaille dans le namespace **`tdm`**.
cours: |
  ## Kubernetes au quotidien avec k3s

  **k3s** est une distribution Kubernetes certifiée, empaquetée en un seul binaire léger (moins de 100 Mo),
  conçue pour l'edge, l'IoT, la CI et l'apprentissage. Elle embarque tout le nécessaire : containerd, un
  réseau (Flannel), CoreDNS, un stockage local (`local-path`) et un répartiteur de services. Les objets et
  `kubectl` sont exactement ceux de Kubernetes.

  ### Le chemin d'une requête

  ```
   navigateur ─▶ localhost:30880 ─▶ k3s:30080 (NodePort) ─▶ Service web-externe
                                                              │ sélecteur app=web
                                     ┌────────────────────────┼────────────────────────┐
                                     ▼                        ▼                        ▼
                                pod web-xxx              pod web-yyy              pod web-zzz
                                (readiness OK)           (readiness OK)           (readiness OK)
                                     └─ volume ConfigMap web-contenu → /usr/share/nginx/html
  ```

  Un **Service** donne une IP virtuelle et un nom DNS stables (`web.tdm.svc.cluster.local`, ou simplement
  `web` dans le même namespace) à un ensemble de pods choisis par **labels**. Ses **endpoints** sont les
  adresses des pods prêts.

  | Type de Service | Accès |
  |---|---|
  | `ClusterIP` | interne au cluster (par défaut) |
  | `NodePort` | port 30000-32767 ouvert sur chaque nœud |
  | `LoadBalancer` | IP externe fournie par le cloud (ou ServiceLB dans k3s) |
  | Ingress | routage HTTP par nom et chemin devant plusieurs services |

  ### Déploiements et révisions

  ```
  Deployment web ──▶ ReplicaSet web-6d4f (révision 2, nginx:1.27.3) ──▶ 3 pods
                 └─▶ ReplicaSet web-5b7c (révision 1, nginx:1.27)   ──▶ 0 pod (gardé pour rollback)
  ```

  Chaque modification du modèle de pod crée un ReplicaSet ; le Deployment bascule progressivement de l'un à
  l'autre. `kubectl rollout undo` réactive l'ancien.

  ### Configuration et stockage

  - **ConfigMap** et **Secret** : en variables d'environnement ou montés en fichiers.
  - **PVC** : demande de stockage ; la StorageClass `local-path` crée le volume à la demande (dans un dossier
    du nœud).
  - **Job** et **CronJob** : tâches qui se terminent, ponctuelles ou planifiées.

  ### Mémo

  ```bash
  kubectl config set-context --current --namespace=tdm
  kubectl create deployment web --image=nginx:1.27-alpine --replicas=3
  kubectl expose deployment web --port=80 [--type=NodePort]
  kubectl create configmap web-contenu --from-literal=index.html='...'
  kubectl set resources deploy web --requests=cpu=50m,memory=32Mi --limits=memory=64Mi
  kubectl edit deploy web ; kubectl patch ... ; kubectl get deploy web -o yaml
  kubectl rollout status|history|undo deploy/web
  kubectl get pods -o wide --show-labels ; kubectl get endpoints
  kubectl describe pod NOM ; kubectl logs NOM --previous
  kubectl get events --sort-by=.lastTimestamp
  kubectl create deployment x --image=y --dry-run=client -o yaml > x.yaml
  ```

  ### Lire les états d'un pod

  | État | Cause probable |
  |---|---|
  | `Pending` | pas de nœud adapté, PVC non liée, ressources insuffisantes |
  | `ErrImagePull` / `ImagePullBackOff` | image ou tag inexistant, registre inaccessible |
  | `CrashLoopBackOff` | le conteneur démarre puis plante (voir les logs) |
  | `Running` mais `0/1 READY` | la readinessProbe échoue |
  | `OOMKilled` | limite mémoire dépassée |

  ### Pièges courants

  - Un sélecteur de Service qui ne correspond à aucun label : service sans endpoints.
  - `targetPort` différent du port réellement écouté par le conteneur.
  - Monter une ConfigMap sur un dossier masque tout son contenu d'origine.
  - Oublier `-n` et chercher ses objets dans le mauvais namespace.

  ### Bonnes pratiques

  Générer les squelettes avec `--dry-run=client -o yaml` puis les versionner, toujours des sondes et des
  ressources, des images taguées, et un diagnostic méthodique : `get` → `describe` → `logs` → `endpoints`.
docs:
