# Un cluster Kubernetes léger (k3s) dans un conteneur, et un poste « ops » avec kubectl et helm.
services:
  k3s:
    image: rancher/k3s:v1.30.6-k3s1
    hostname: k3s
    privileged: true
    command: ["server", "--disable", "traefik", "--disable", "metrics-server", "--tls-san", "k3s", "--write-kubeconfig-mode", "644"]
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
    tmpfs: [/run, /var/run]
    volumes:
      - k3s-config:/output
      - k3s-data:/var/lib/rancher/k3s
    ports: ["30880:30080"]
  ops:
    build: ./ops
    hostname: ops
    volumes:
      - k3s-config:/k3s:ro
volumes:
  k3s-config:
  k3s-data:
