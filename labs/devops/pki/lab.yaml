exercises:
  - id: ca
    title: Autorité de certification racine
    description: |
      Dans `/pki/ca`, crée la clé privée `ca.key` (RSA 4096) et le certificat **auto-signé** `ca.crt`
      valable 10 ans, avec le CN `TDM Root CA`. Le certificat doit être marqué comme CA
      (`basicConstraints=critical,CA:TRUE`).
    hint: "openssl req -x509 -new -newkey rsa:4096 -nodes -keyout ca.key -out ca.crt -days 3650 -subj '/CN=TDM Root CA' -addext 'basicConstraints=critical,CA:TRUE'"
    cours: |
      Une **autorité racine** est un certificat **auto-signé** : l'émetteur et le sujet sont identiques, et sa
      signature est faite avec sa propre clé. Il tire sa légitimité du fait que les clients l'ont installé dans
      leur magasin de confiance.

      `openssl req -x509` produit directement un certificat (au lieu d'une demande). Options à connaître :
      `-new`, `-key` (clé existante) ou `-newkey rsa:4096 -nodes -keyout`, `-days`, `-subj "/CN=..."`, `-sha256`.
      `-addext` ajoute une extension X.509 : la CA doit porter `basicConstraints=critical,CA:TRUE`, sinon les
      clients refuseront les certificats qu'elle signe.

      Vérifie avec `openssl x509 -in ca.crt -noout -text` : cherche `Issuer`, `Subject`, `Not After` et `CA:TRUE`.
    checks:
      - desc: ca.key est une clé RSA 4096 bits
        run: openssl rsa -in /pki/ca/ca.key -noout -text 2>/dev/null | grep -q "4096 bit"
      - desc: ca.crt est auto-signé avec le CN TDM Root CA
        run: openssl x509 -in /pki/ca/ca.crt -noout -subject -issuer | grep -c "CN *= *TDM Root CA" | grep -qx 2
      - desc: C'est bien une CA
        run: openssl x509 -in /pki/ca/ca.crt -noout -text | grep -q "CA:TRUE"
  - id: certificat
    title: Certificat du serveur
    description: |
      Dans `/pki/webserver`, crée la clé `server.key` et une demande `server.csr` pour le CN `webserver`,
      puis **signe-la avec ta CA** pour obtenir `server.crt` (1 an), avec les noms alternatifs (SAN)
      `DNS:webserver` et `DNS:localhost`.
    hint: "echo 'subjectAltName=DNS:webserver,DNS:localhost' > san.ext ; openssl x509 -req -in server.csr -CA ../ca/ca.crt -CAkey ../ca/ca.key -CAcreateserial -out server.crt -days 365 -extfile san.ext"
    cours: |
      Le serveur génère sa clé privée et une **CSR** (`openssl req -new`), qu'il transmet à la CA : la clé privée
      ne quitte jamais le serveur. La CA signe ensuite la CSR avec `openssl x509 -req -CA ca.crt -CAkey ca.key`.
      `-CAcreateserial` crée le fichier de numéros de série la première fois.

      Les extensions ne sont pas copiées depuis la CSR par défaut : on les fournit à la signature avec
      `-extfile fichier` (une ligne `subjectAltName=DNS:a,DNS:b`) ou `-copy_extensions copy` (OpenSSL 3).

      Le **SAN** est indispensable : les clients modernes ignorent le CN et vérifient que le nom demandé figure
      dans `subjectAltName`. `openssl verify -CAfile ca.crt server.crt` doit répondre `OK`.
    checks:
      - desc: server.crt est signé par la CA
        run: |
          openssl verify -CAfile /pki/ca/ca.crt /pki/webserver/server.crt | grep -q ': OK'
      - desc: La clé correspond au certificat
        run: test "$(openssl x509 -in /pki/webserver/server.crt -noout -pubkey | openssl sha256)" = "$(openssl pkey -in /pki/webserver/server.key -pubout | openssl sha256)"
      - desc: SAN webserver et localhost
        run: openssl x509 -in /pki/webserver/server.crt -noout -text | grep -A1 "Subject Alternative Name" | grep -q "DNS:webserver" && openssl x509 -in /pki/webserver/server.crt -noout -text | grep -A1 "Subject Alternative Name" | grep -q "DNS:localhost"
  - id: https
    title: Site en HTTPS
    description: |
      Configure nginx pour servir HTTPS sur le port 443 avec `server.crt` / `server.key`
      (fichier `/etc/nginx/conf.d/tls.conf`), puis recharge-le (`nginx -s reload`).
      `curl --cacert /pki/ca/ca.crt https://localhost` doit fonctionner **sans** `-k`.
    hint: "server { listen 443 ssl; ssl_certificate /pki/webserver/server.crt; ssl_certificate_key /pki/webserver/server.key; root /usr/share/nginx/html; }"
    cours: |
      Dans nginx, un serveur HTTPS combine trois directives : `listen 443 ssl;`, `ssl_certificate` (le
      certificat, éventuellement suivi des intermédiaires) et `ssl_certificate_key` (la clé privée).

      Avant de recharger, `nginx -t` vérifie aussi que le certificat et la clé correspondent.

      Côté client, `--cacert` indique à curl quelle CA faire confiance. Si la vérification échoue, curl explique
      pourquoi : CA inconnue (*unable to get local issuer certificate*), nom absent du SAN (*no alternative
      certificate subject name matches*), certificat expiré… `curl -v` affiche la poignée de main TLS et le
      certificat reçu. L'option `-k` désactive toute vérification : elle masque les problèmes au lieu de les
      résoudre.
    checks:
      - desc: nginx accepte la configuration
        run: nginx -t
      - desc: HTTPS validé par ta CA
        run: curl -fsS --cacert /pki/ca/ca.crt https://localhost/ >/dev/null
  - id: durcissement
    title: Durcissement
    description: |
      Restreins nginx à **TLS 1.2 et 1.3** uniquement (`ssl_protocols`) et ajoute l'en-tête
      `Strict-Transport-Security` (HSTS). Les droits de `server.key` doivent être `600`.
    cours: |
      Les anciennes versions du protocole (SSL 3, TLS 1.0 et 1.1) ont des faiblesses connues et sont
      abandonnées. `ssl_protocols TLSv1.2 TLSv1.3;` restreint les versions acceptées ; on peut tester une version
      précise avec `openssl s_client -tls1_1` (refusée) ou `curl --tlsv1.2 --tls-max 1.2`.

      **HSTS** (`Strict-Transport-Security: max-age=31536000`) demande au navigateur de n'utiliser que HTTPS
      pour ce domaine pendant la durée indiquée, ce qui empêche les attaques par rétrogradation vers HTTP.
      L'en-tête s'ajoute avec `add_header` (pense à `always`).

      La clé privée est le secret du serveur : seul son propriétaire doit pouvoir la lire (`chmod 600`).
    checks:
      - desc: TLS 1.1 refusé
        run: "! curl -s --cacert /pki/ca/ca.crt --tls-max 1.1 https://localhost/ >/dev/null 2>&1"
      - desc: En-tête HSTS présent
        run: curl -fsSI --cacert /pki/ca/ca.crt https://localhost/ | grep -qi "strict-transport-security"
      - desc: server.key en 600
        run: test "$(stat -c %a /pki/webserver/server.key)" = 600
  - id: inspection
    title: Inspecter un certificat distant
    description: |
      Comme lors d'un diagnostic en production, interroge le serveur HTTPS **par le réseau** (pas en lisant
      le fichier) avec `openssl s_client -connect localhost:443` et extrais du certificat présenté :
      - son **empreinte SHA-256** dans `/pki/empreinte.txt`, au format `AB:CD:...` (sans le préfixe
        `sha256 Fingerprint=`) ;
      - son **numéro de série** dans `/pki/serie.txt` (juste la valeur hexadécimale, sans `serial=`).
    hint: "echo | openssl s_client -connect localhost:443 2>/dev/null | openssl x509 -noout -fingerprint -sha256 (puis cut -d= -f2)"
    cours: |
      En production, on vérifie ce que le serveur **présente réellement**, pas le fichier qu'on croit avoir
      déployé. `openssl s_client -connect hote:443 -servername nom` établit une connexion TLS et affiche la
      chaîne reçue ; ajoute `</dev/null` pour qu'il rende la main aussitôt.

      Sa sortie contient le certificat au format PEM, que l'on peut **enchaîner** dans
      `openssl x509 -noout ...` : `-fingerprint -sha256` donne l'empreinte, `-serial` le numéro de série,
      `-dates` la validité, `-subject` et `-issuer` les noms.

      Ces commandes affichent un préfixe (`sha256 Fingerprint=`, `serial=`) que `cut -d= -f2` ou `sed` retire.
      L'empreinte sert à épingler un certificat ou à comparer deux déploiements.
    checks:
      - desc: L'empreinte SHA-256 est exacte
        run: |
          test -s /pki/empreinte.txt && test "$(tr -d '[:space:]' < /pki/empreinte.txt | tr a-f A-F)" = "$(echo | openssl s_client -connect localhost:443 2>/dev/null | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr a-f A-F)"
      - desc: Le numéro de série est exact
        run: |
          test -s /pki/serie.txt && test "$(tr -d '[:space:]' < /pki/serie.txt | tr a-f A-F)" = "$(echo | openssl s_client -connect localhost:443 2>/dev/null | openssl x509 -noout -serial | cut -d= -f2 | tr a-f A-F)"
  - id: intermediaire
    title: Autorité intermédiaire et chaîne de certification
    description: |
      En production, la CA racine reste hors ligne et une **CA intermédiaire** signe les certificats.
      1. Crée `/pki/ca/intermediate.key` et `/pki/ca/intermediate.crt` (CN `TDM Intermediate CA`), **signé par
         la racine**, avec `basicConstraints=critical,CA:TRUE,pathlen:0` et `keyUsage=critical,keyCertSign,cRLSign`.
      2. Avec l'intermédiaire, signe un certificat `/pki/webserver/app.crt` (clé `app.key`) pour le CN
         `app.tdm.local` (SAN `DNS:app.tdm.local`).
      3. Configure nginx pour servir `app.tdm.local` en HTTPS avec la **chaîne complète**
         (`app.crt` suivi de `intermediate.crt` dans `/pki/webserver/app-fullchain.crt`).

      `curl --cacert /pki/ca/ca.crt --resolve app.tdm.local:443:127.0.0.1 https://app.tdm.local/` doit fonctionner :
      le client ne connaît que la racine, c'est le serveur qui fournit l'intermédiaire.
    hint: "Les extensions se passent à openssl x509 -req avec -extfile (un fichier contenant basicConstraints=… et keyUsage=…) ; server { listen 443 ssl; server_name app.tdm.local; ssl_certificate /pki/webserver/app-fullchain.crt; … }"
    cours: |
      La clé de la racine est si précieuse qu'on la garde **hors ligne**. Une **CA intermédiaire**, signée par la
      racine, signe les certificats du quotidien ; si elle est compromise, on la révoque sans toucher à la racine
      installée chez tous les clients.

      L'intermédiaire est une CA : `basicConstraints=critical,CA:TRUE,pathlen:0` (`pathlen:0` interdit qu'elle
      crée d'autres CA en dessous) et `keyUsage=critical,keyCertSign,cRLSign`.

      Le client ne connaît que la racine : le serveur doit donc envoyer **son certificat suivi de
      l'intermédiaire** (*fullchain*), dans cet ordre. `openssl verify -CAfile ca.crt -untrusted intermediate.crt app.crt`
      simule cette vérification. `curl --resolve nom:443:127.0.0.1` force la résolution d'un nom sans DNS.
    checks:
      - desc: L'intermédiaire est signé par la racine
        run: |
          openssl verify -CAfile /pki/ca/ca.crt /pki/ca/intermediate.crt | grep -q ': OK' && openssl x509 -in /pki/ca/intermediate.crt -noout -subject | grep -q 'TDM Intermediate CA'
      - desc: C'est une CA limitée (pathlen:0)
        run: openssl x509 -in /pki/ca/intermediate.crt -noout -text | grep -q 'CA:TRUE, pathlen:0'
      - desc: app.crt est signé par l'intermédiaire
        run: |
          openssl verify -CAfile /pki/ca/ca.crt -untrusted /pki/ca/intermediate.crt /pki/webserver/app.crt | grep -q ': OK' && ! openssl verify -CAfile /pki/ca/ca.crt /pki/webserver/app.crt >/dev/null 2>&1
      - desc: Le serveur présente la chaîne complète
        run: curl -fsS --cacert /pki/ca/ca.crt --resolve app.tdm.local:443:127.0.0.1 https://app.tdm.local/ >/dev/null
  - id: mtls
    title: Authentification par certificat client (mTLS)
    description: |
      Réserve un espace aux clients qui présentent un **certificat signé par ta CA** :
      1. Crée un certificat client `/pki/client/client.crt` (clé `client.key`) pour le CN `eleve`, signé par la
         racine, avec `extendedKeyUsage=clientAuth`.
      2. Ajoute un serveur nginx sur le port **9443** (certificat `server.crt`) qui exige un certificat client
         (`ssl_client_certificate /pki/ca/ca.crt;` et `ssl_verify_client on;`).

      `curl --cacert /pki/ca/ca.crt https://localhost:9443/` doit être refusé, et accepté avec
      `--cert /pki/client/client.crt --key /pki/client/client.key`.
    cours: |
      En **TLS mutuel** (mTLS), le serveur demande lui aussi un certificat au client et le vérifie avec une CA
      de confiance. C'est une authentification forte, sans mot de passe, utilisée entre services ou pour des
      accès d'administration.

      Côté nginx : `ssl_client_certificate` (la CA qui signe les certificats clients) et
      `ssl_verify_client on;` (certificat obligatoire ; `optional` laisse l'application décider). La variable
      `$ssl_client_s_dn` contient le sujet du client authentifié.

      Le certificat client porte l'usage étendu `extendedKeyUsage=clientAuth`. curl le présente avec `--cert` et
      `--key`. Sans certificat, nginx répond 400 (*No required SSL certificate was sent*) ou la poignée de main
      échoue.
    checks:
      - desc: client.crt est un certificat client signé par la CA
        run: |
          openssl verify -CAfile /pki/ca/ca.crt /pki/client/client.crt | grep -q ': OK' && openssl x509 -in /pki/client/client.crt -noout -text | grep -q 'TLS Web Client Authentication'
      - desc: Sans certificat client, l'accès est refusé
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --cacert /pki/ca/ca.crt https://localhost:9443/); test "$code" = 400
      - desc: Avec le certificat client, l'accès est accepté
        run: curl -fsS --cacert /pki/ca/ca.crt --cert /pki/client/client.crt --key /pki/client/client.key https://localhost:9443/ >/dev/null
  - id: revocation
    title: Révoquer un certificat (CRL)
    description: |
      Un certificat a fuité : il faut le **révoquer**. Monte une petite CA gérée par `openssl ca` dans `/pki/ca`
      (fichier de configuration avec `database = index.txt`, `serial`, `certificate = ca.crt`,
      `private_key = ca.key`, `default_md = sha256`, `default_crl_days = 30`).
      1. Crée et signe un certificat `/pki/ca/revoque.crt` pour le CN `fuite`.
      2. Révoque-le (`openssl ca -revoke`), puis publie la liste de révocation `/pki/ca/crl.pem` (`openssl ca -gencrl`).

      Vérifie : `openssl verify -crl_check` doit refuser `revoque.crt` mais toujours accepter `server.crt`.
    hint: "touch index.txt ; echo 1000 > serial ; openssl ca -config ca.cnf -revoke revoque.crt ; openssl ca -config ca.cnf -gencrl -out crl.pem"
    cours: |
      `openssl ca` est une mini-CA qui tient un **registre** de ce qu'elle signe : `index.txt` (une ligne par
      certificat, état `V` valide ou `R` révoqué), `serial` (prochain numéro) et un dossier pour les certificats
      émis. Sa configuration se lit avec `-config fichier` ; la section `[ca]` désigne la section par défaut
      (`default_ca`), qui contient les chemins et une `policy`.

      `openssl ca -revoke cert.crt` marque le certificat comme révoqué ; `openssl ca -gencrl -out crl.pem` publie
      la **CRL**, liste signée des numéros révoqués, que les clients téléchargent.

      Pour vérifier avec la CRL : `openssl verify -crl_check -CAfile` doit recevoir la CA **et** la CRL (fichier
      concaténé ou option `-CRLfile`).
    checks:
      - desc: crl.pem est une CRL émise par TDM Root CA
        run: openssl crl -in /pki/ca/crl.pem -noout -issuer | grep -q 'TDM Root CA'
      - desc: revoque.crt est refusé (révoqué)
        run: |
          cat /pki/ca/ca.crt /pki/ca/crl.pem > /tmp/ca-crl.pem && openssl verify -crl_check -CAfile /tmp/ca-crl.pem /pki/ca/revoque.crt 2>&1 | grep -q 'certificate revoked'
      - desc: server.crt reste valide avec la CRL
        run: |
          cat /pki/ca/ca.crt /pki/ca/crl.pem > /tmp/ca-crl.pem && openssl verify -crl_check -CAfile /tmp/ca-crl.pem /pki/webserver/server.crt | grep -q ': OK'
