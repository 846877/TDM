title: PKI et certificats TLS
level: intermediaire
order: 5
tags: [pki, tls, openssl, nginx, mtls, crl]
summary: CA racine et intermédiaire, HTTPS, durcissement, mTLS et révocation de certificats.
compose: docker-compose.yml
service: webserver
shell: sh
workdir: /pki
description: |
  Le lab Vagrant `pki` de ta formation fournit deux machines vierges, `ca` et `webserver`.
  Ici, ton terminal est sur **webserver** (nginx + openssl) et le dossier `/pki` est partagé avec la
  machine `ca`. Pour la rigueur, tu peux travailler la partie CA dans `/pki/ca` et la partie serveur
  dans `/pki/webserver`.

  Le port 443 est publié sur **https://localhost:8443**.
cours: |
  ## PKI : la confiance sur le réseau

  TLS (le « S » de HTTPS) apporte trois garanties : la **confidentialité** (chiffrement), l'**intégrité**
  (rien n'a été modifié) et l'**authentification** (le serveur est bien celui qu'il prétend être). Cette
  dernière repose sur une **infrastructure à clés publiques** (PKI) : des autorités de certification (CA)
  signent des certificats qui lient une clé publique à une identité.

  ### Clés et certificats

  - Une **paire de clés** asymétriques : la clé **privée** reste secrète (droits `600`), la clé **publique**
    se distribue. Ce qui est signé avec la privée se vérifie avec la publique.
  - Une **CSR** (*Certificate Signing Request*) contient la clé publique et l'identité demandée ; elle est
    envoyée à la CA.
  - Un **certificat X.509** est la CSR signée par la CA : sujet (`CN`), émetteur, numéro de série, dates de
    validité, extensions (SAN, usages, contraintes) et signature.

  ### La chaîne de confiance

  ```
   ┌────────────────────┐  auto-signée, hors ligne, dans le magasin de confiance des clients
   │ CA racine          │
   └─────────┬──────────┘ signe
   ┌─────────▼──────────┐  CA:TRUE, pathlen:0
   │ CA intermédiaire   │
   └─────────┬──────────┘ signe
   ┌─────────▼──────────┐  CN=app.tdm.local, SAN=DNS:app.tdm.local, serverAuth
   │ certificat serveur │  ← le serveur envoie : serveur + intermédiaire (fullchain)
   └────────────────────┘
  ```

  Le client vérifie chaque signature jusqu'à une racine qu'il connaît déjà (magasin du système ou
  `--cacert`), puis contrôle les dates, l'usage et que le nom demandé figure dans le **SAN** (le CN n'est
  plus utilisé par les navigateurs).

  ### Extensions importantes

  | Extension | Rôle |
  |---|---|
  | `basicConstraints=CA:TRUE,pathlen:0` | ce certificat peut signer (CA), sans sous-CA en dessous |
  | `keyUsage` | `keyCertSign`, `cRLSign` pour une CA ; `digitalSignature` pour un serveur |
  | `extendedKeyUsage` | `serverAuth` (serveur), `clientAuth` (client mTLS) |
  | `subjectAltName` | `DNS:nom`, `IP:adresse` : les noms couverts |

  ### Mémo OpenSSL

  ```bash
  openssl genrsa -out ca.key 4096
  openssl req -x509 -new -key ca.key -sha256 -days 3650 -subj "/CN=TDM Root CA" \
      -addext "basicConstraints=critical,CA:TRUE" -out ca.crt
  openssl req -new -newkey rsa:2048 -nodes -keyout server.key -subj "/CN=webserver" -out server.csr
  openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 365 \
      -extfile ext.cnf -out server.crt
  openssl x509 -in server.crt -noout -text        # lire un certificat
  openssl verify -CAfile ca.crt server.crt        # vérifier la chaîne
  openssl s_client -connect hote:443 -servername hote </dev/null   # voir ce que présente un serveur
  ```

  ### Révocation

  Un certificat compromis doit être **révoqué** avant son expiration : la CA publie une **CRL** (liste des
  numéros de série révoqués) ou répond en ligne via **OCSP**. D'où l'intérêt des certificats courts
  (90 jours chez Let's Encrypt) renouvelés automatiquement (protocole ACME).

  ### mTLS

  Dans le TLS mutuel, le **client** présente aussi un certificat : le serveur l'authentifie sans mot de
  passe. C'est courant entre microservices (*service mesh*) et pour les API sensibles.

  ### Pièges courants

  - Oublier le SAN : « certificate is not valid for name ».
  - Servir le certificat sans l'intermédiaire : ça marche dans un navigateur qui le connaît, pas avec curl.
  - Clé privée lisible par tous, ou commitée dans Git.
  - `-k` / `verify=False` laissés en production : plus aucune authentification.
  - Laisser expirer un certificat : supervise les dates d'expiration.

  ### Bonnes pratiques

  Racine hors ligne, intermédiaire pour signer, certificats courts et automatisés, TLS 1.2 minimum, HSTS,
  supervision de l'expiration.
