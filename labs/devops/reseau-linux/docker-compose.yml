# Un petit réseau d'entreprise à diagnostiquer depuis le « poste ».
# LAN 10.89.10.0/24 : poste, web, dns, routeur.
# « DMZ » 10.89.20.0/24 : adressée sur le même segment, seul le routeur (10.89.20.254) y a une patte ;
# la base db (10.89.20.10) n'est donc joignable qu'en passant par lui.
# (Docker refuse le routage direct entre deux de ses réseaux bridge, d'où ce montage.)
services:
  poste:
    build: ./poste
    hostname: poste
    cap_add: [NET_ADMIN, NET_RAW]
    networks:
      lan: {ipv4_address: 10.89.10.10}
  web:
    build: ./web
    hostname: web
    networks:
      lan: {ipv4_address: 10.89.10.80}
  dns:
    build: ./dns
    hostname: dns
    networks:
      lan: {ipv4_address: 10.89.10.53}
  routeur:
    image: alpine:3.20
    hostname: routeur
    cap_add: [NET_ADMIN]
    command: ["sh", "-c", "ip addr add 10.89.20.254/24 dev eth0 && exec sleep infinity"]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.send_redirects: "0"
    networks:
      lan: {ipv4_address: 10.89.10.254}
  db:
    build: ./db
    hostname: db
    cap_add: [NET_ADMIN]
    networks:
      lan: {ipv4_address: 10.89.10.20}
networks:
  lan:
    ipam:
      config: [{subnet: 10.89.10.0/24}]
