title: Helm et Kustomize
level: expert
order: 3
tags: [kubernetes, helm, kustomize, k3s, gitops, packaging]
summary: Industrialiser ses déploiements Kubernetes - base et overlays Kustomize, chart Helm, valeurs par environnement, templates conditionnels, rollback et dépôt de charts.
compose: docker-compose.yml
service: ops
shell: bash
workdir: /root
description: |
  Un cluster **k3s** tourne dans le conteneur `k3s` ; ton terminal est sur **ops** avec `kubectl`
  (Kustomize est intégré : `kubectl kustomize` et `kubectl apply -k`) et `helm`.
  Attends que `kubectl get nodes` affiche `Ready` (une trentaine de secondes).

  Deux façons de ne plus copier-coller des manifestes d'un environnement à l'autre :

  - **Kustomize** : une *base* commune et des *overlays* (dev, prod) qui la modifient par patchs ;
  - **Helm** : un *chart* paramétré par des valeurs, versionné, installé sous forme de *release*.

  Les manifestes de départ sont dans `/root/kustomize/base/`. Le port NodePort **30090** est publié sur
  **http://localhost:30890** de ta machine.
exercises:
  - id: kustomize-base
    title: Une base Kustomize
    description: |
      Dans `/root/kustomize/base/`, écris le fichier `kustomization.yaml` qui :
      - référence `deployment.yaml` et `service.yaml` ;
      - ajoute à toutes les ressources (et aux sélecteurs) l'étiquette `app.kubernetes.io/part-of: boutique`.

      Vérifie le rendu avec `kubectl kustomize /root/kustomize/base`.
    hint: "Champs resources: [...] et labels: avec pairs: et includeSelectors: true (ou l'ancien commonLabels:)"
    checks:
      - desc: La base se construit et contient un Deployment et un Service
        run: test "$(kubectl kustomize /root/kustomize/base | grep -cE '^kind. (Deployment|Service)$')" = 2
      - desc: L'étiquette part-of est ajoutée
        run: kubectl kustomize /root/kustomize/base | grep -q 'app.kubernetes.io/part-of. boutique'
  - id: overlay-dev
    title: L'overlay de développement
    description: |
      Le déploiement attend une ConfigMap `api-config` (voir `envFrom`). Crée l'overlay
      `/root/kustomize/overlays/dev` qui part de la base et :
      - place tout dans le namespace `dev` avec le préfixe de nom `dev-` ;
      - ramène le déploiement à **1 réplica** ;
      - **génère** la ConfigMap `api-config` avec `ENV=dev` (`configMapGenerator`).

      Crée le namespace puis applique : `kubectl apply -k /root/kustomize/overlays/dev`.
      Remarque le suffixe de hachage ajouté au nom de la ConfigMap, et la référence mise à jour dans le déploiement.
    hint: "resources: [../../base] ; namespace: dev ; namePrefix: dev- ; replicas: [{name: api, count: 1}] ; configMapGenerator: [{name: api-config, literals: [ENV=dev]}]"
    checks:
      - desc: dev-api tourne avec 1 réplica dans dev
        run: test "$(kubectl -n dev get deploy dev-api -o jsonpath='{.spec.replicas}/{.status.availableReplicas}')" = 1/1
      - desc: La ConfigMap est générée (nom haché) et référencée
        run: |
          cm=$(kubectl -n dev get deploy dev-api -o jsonpath='{.spec.template.spec.containers[0].envFrom[0].configMapRef.name}')
          case "$cm" in dev-api-config-?*) ;; *) exit 1 ;; esac
          test "$(kubectl -n dev get cm "$cm" -o jsonpath='{.data.ENV}')" = dev
      - desc: Le conteneur voit ENV=dev
        run: test "$(kubectl -n dev exec deploy/dev-api -- printenv ENV)" = dev
  - id: overlay-prod
    title: L'overlay de production
    description: |
      Crée l'overlay `/root/kustomize/overlays/prod` (namespace `prod`, **sans** préfixe) qui :
      - passe à **3 réplicas** ;
      - utilise l'image `nginx:1.27.3-alpine` grâce au champ `images` (sans toucher à la base) ;
      - ajoute par un **patch** une limite mémoire de `128Mi` au conteneur `api` ;
      - génère `api-config` avec `ENV=prod`.

      Applique-le dans le namespace `prod`.
    hint: "images: [{name: nginx, newTag: 1.27.3-alpine}] ; patches: avec un patch stratégique (path: limites.yaml) ciblant le Deployment api"
    checks:
      - desc: api tourne avec 3 réplicas dans prod
        run: test "$(kubectl -n prod get deploy api -o jsonpath='{.status.availableReplicas}')" = 3
      - desc: Image surchargée en nginx:1.27.3-alpine
        run: test "$(kubectl -n prod get deploy api -o jsonpath='{.spec.template.spec.containers[0].image}')" = nginx:1.27.3-alpine
      - desc: Limite mémoire de 128Mi
        run: test "$(kubectl -n prod get deploy api -o jsonpath='{.spec.template.spec.containers[0].resources.limits.memory}')" = 128Mi
      - desc: ENV=prod et étiquette part-of héritée de la base
        run: test "$(kubectl -n prod exec deploy/api -- printenv ENV)" = prod && kubectl -n prod get deploy api --show-labels | grep -q 'app.kubernetes.io/part-of=boutique'
  - id: helm-chart
    title: Créer et installer un chart Helm
    description: |
      1. Génère un chart : `helm create /root/charts/vitrine`. Explore `Chart.yaml`, `values.yaml` et `templates/`.
      2. Dans `values.yaml`, fixe l'étiquette d'image à `1.27-alpine` (le dépôt reste `nginx`).
      3. Installe le chart sous le nom de release **`vitrine`** dans le namespace **`web`** (à créer par Helm).

      `helm list -n web` doit afficher la release au statut `deployed`.
    hint: "helm install vitrine /root/charts/vitrine -n web --create-namespace ; helm template permet de voir le rendu sans installer"
    checks:
      - desc: Le chart existe
        run: test -f /root/charts/vitrine/Chart.yaml && test -d /root/charts/vitrine/templates
      - desc: La release vitrine est déployée dans web
        run: test "$(helm -n web status vitrine -o json | jq -r .info.status)" = deployed
      - desc: Le déploiement utilise nginx:1.27-alpine et est disponible
        run: test "$(kubectl -n web get deploy vitrine -o jsonpath='{.spec.template.spec.containers[0].image}')" = nginx:1.27-alpine && test "$(kubectl -n web get deploy vitrine -o jsonpath='{.status.availableReplicas}')" -ge 1
  - id: valeurs-prod
    title: Des valeurs par environnement
    description: |
      Crée `/root/charts/vitrine/values-prod.yaml` qui demande **2 réplicas** et un service **NodePort** sur le
      port **30090**. Problème : le template `templates/service.yaml` généré ne sait pas fixer le `nodePort`.
      Modifie-le pour qu'il utilise `service.nodePort` **quand la valeur est définie**.

      Mets à jour la release avec ce fichier de valeurs, puis ouvre http://localhost:30890.
    hint: "Dans service.yaml, sous le port : {{- if .Values.service.nodePort }} nodePort: {{ .Values.service.nodePort }} {{- end }} ; puis helm upgrade vitrine /root/charts/vitrine -n web -f /root/charts/vitrine/values-prod.yaml"
    checks:
      - desc: Le service est un NodePort sur 30090
        run: test "$(kubectl -n web get svc vitrine -o jsonpath='{.spec.type}/{.spec.ports[0].nodePort}')" = NodePort/30090
      - desc: 2 réplicas prêts
        run: test "$(kubectl -n web get deploy vitrine -o jsonpath='{.status.readyReplicas}')" = 2
      - desc: Les valeurs de la release viennent de values-prod.yaml
        run: test -s /root/charts/vitrine/values-prod.yaml && helm -n web get values vitrine -o json | jq -e '.replicaCount == 2 and .service.nodePort == 30090' >/dev/null
      - desc: L'application répond sur k3s:30090
        run: curl -fsS --max-time 5 http://k3s:30090/ >/dev/null
  - id: template-conditionnel
    title: Logique de template
    description: |
      Ajoute au chart le template `templates/message.yaml` : une ConfigMap nommée
      `<nom complet>-message` (utilise le helper `vitrine.fullname`) avec une clé `message`, **créée seulement si**
      la valeur `message` est non vide.

      - Dans `values.yaml` : `message: ""` (rien n'est créé par défaut) ;
      - dans `values-prod.yaml` : `message: Bienvenue en production`.

      Vérifie avec `helm template` et `helm lint`, puis mets à jour la release avec les valeurs de prod.
    hint: "{{- if .Values.message }} ... {{- end }} autour de la ConfigMap ; name: {{ include \"vitrine.fullname\" . }}-message ; message: {{ .Values.message | quote }}"
    checks:
      - desc: Le chart passe helm lint
        run: helm lint /root/charts/vitrine >/dev/null
      - desc: La ConfigMap n'est rendue que si message est défini
        run: |
          helm template vitrine /root/charts/vitrine --set message=essai | grep -q 'name. vitrine-message' &&
          ! helm template vitrine /root/charts/vitrine | grep -q 'name. vitrine-message'
      - desc: La ConfigMap de prod existe dans le cluster
        run: test "$(kubectl -n web get cm vitrine-message -o jsonpath='{.data.message}')" = 'Bienvenue en production'
  - id: rollback
    title: Mise à jour ratée et rollback
    description: |
      Simule une mise en production ratée : mets à jour `vitrine` (avec les valeurs de prod) en forçant
      `image.tag=9.9.9-inexistant`. Constate les pods en `ImagePullBackOff`, puis consulte `helm history` et
      **reviens à la dernière révision saine** avec `helm rollback`.
    hint: "helm upgrade vitrine /root/charts/vitrine -n web -f /root/charts/vitrine/values-prod.yaml --set image.tag=9.9.9-inexistant ; helm history vitrine -n web ; helm rollback vitrine <révision> -n web"
    checks:
      - desc: Une révision avec l'image inexistante a été déployée
        run: |
          for r in $(helm -n web history vitrine -o json | jq -r '.[].revision'); do
            if helm -n web get values vitrine --revision "$r" -o json | jq -e '.image.tag == "9.9.9-inexistant"' >/dev/null; then exit 0; fi
          done
          exit 1
      - desc: Un rollback apparaît dans l'historique
        run: helm -n web history vitrine -o json | jq -e 'any(.[]; .description | startswith("Rollback to"))' >/dev/null
      - desc: La release est revenue sur nginx:1.27-alpine et elle est saine
        run: test "$(kubectl -n web get deploy vitrine -o jsonpath='{.spec.template.spec.containers[0].image}')" = nginx:1.27-alpine && kubectl -n web rollout status deploy/vitrine --timeout=30s
        timeout: 45
  - id: depot
    title: Publier le chart dans un dépôt
    description: |
      1. Passe la version du chart à **0.2.0** (`Chart.yaml`), puis empaquette-le dans `/root/depot/`.
      2. Génère l'index du dépôt (`helm repo index`).
      3. Sers le dossier en HTTP sur le port **8879** (en arrière-plan) avec `python3 -m http.server`.
      4. Ajoute ce dépôt à Helm sous le nom **`local`** et retrouve ton chart avec `helm search repo`.
    hint: "helm package /root/charts/vitrine -d /root/depot ; helm repo index /root/depot --url http://localhost:8879 ; nohup python3 -m http.server 8879 -d /root/depot >/dev/null 2>&1 & ; helm repo add local http://localhost:8879"
    checks:
      - desc: L'archive vitrine-0.2.0.tgz et l'index existent
        run: test -f /root/depot/vitrine-0.2.0.tgz && grep -q 'version. 0.2.0' /root/depot/index.yaml
      - desc: Le dépôt est servi sur le port 8879
        run: curl -fsS --max-time 5 http://localhost:8879/index.yaml | grep -q vitrine
      - desc: Le dépôt local est connu de Helm et propose vitrine 0.2.0
        run: |
          helm repo update local >/dev/null 2>&1
          helm search repo local/vitrine --version 0.2.0 -o json | jq -e 'length == 1' >/dev/null
