  - title: Gérer les nœuds Jenkins
    url: https://www.jenkins.io/doc/book/managing/nodes/
  - title: Builds distribués (architecture)
    url: https://www.jenkins.io/doc/book/scaling/architecting-for-scale/
  - title: Syntaxe des pipelines Jenkins
    url: https://www.jenkins.io/doc/book/pipeline/syntax/
exercises:
  - id: agents
    title: Raccorder les agents
    description: |
      Récupère le secret de chaque nœud dans Jenkins (page du nœud, ou
      `http://jenkins-master:8080/computer/agent1/jenkins-agent.jnlp`) et complète le
      `docker-compose.yml` avec `JENKINS_URL`, `JENKINS_AGENT_NAME`, `JENKINS_SECRET` et
      `JENKINS_WEB_SOCKET=true` pour que les deux agents se connectent.
    hint: "Le service maître s'appelle jenkins-master sur le réseau jenkins"
    cours: |
      Un **agent entrant** se connecte lui-même au contrôleur : il a besoin de l'URL de Jenkins, du **nom** du
      nœud tel que déclaré côté contrôleur et du **secret** associé à ce nœud (une longue chaîne hexadécimale
      affichée sur la page du nœud). Le secret prouve que le conteneur a le droit de se présenter sous ce nom.

      Avec `JENKINS_WEB_SOCKET=true`, la connexion passe par le port HTTP (8080) en WebSocket, sans ouvrir le port
      TCP dédié aux agents (50000).

      Dans un réseau Compose, le contrôleur est joignable par son nom de service. Après modification du
      `docker-compose.yml`, `docker compose up -d` recrée les agents ; leurs journaux indiquent `Connected`.
    checks:
      - desc: agent1 est connecté
        run: |
          cd /home/vagrant/jenkins-docker && docker compose logs agent1 2>&1 | grep -q 'INFO: Connected'
      - desc: agent2 est connecté
        run: |
          cd /home/vagrant/jenkins-docker && docker compose logs agent2 2>&1 | grep -q 'INFO: Connected'
  - id: labels
    title: Labels et pipeline réparti
    description: |
      Donne le label `linux` aux deux agents, passe le nombre d'exécuteurs du maître à **0**, puis crée
      un job pipeline `reparti` dont les étapes s'exécutent sur `agent { label 'linux' }`. Lance-le avec
      succès.
    cours: |
      Un **label** est une étiquette posée sur un nœud pour décrire ce qu'il sait faire. Les jobs demandent un
      label plutôt qu'un nœud précis : Jenkins choisit n'importe quel agent libre qui le porte, ce qui permet
      d'ajouter ou retirer des agents sans toucher aux jobs.

      Le nombre d'**exécuteurs** d'un nœud est le nombre de builds qu'il peut mener en parallèle. Le régler à 0
      sur le contrôleur (Manage Jenkins > Nodes > Built-In Node) garantit qu'aucun build ne s'y exécute : bonne
      pratique de sécurité et de stabilité.

      Dans un pipeline déclaratif, `agent { label 'linux' }` sélectionne les agents. La console du build indique
      sur quel nœud il a tourné (`Running on agent1`).
    checks:
      - desc: Le maître n'a plus d'exécuteur
        run: cd /home/vagrant/jenkins-docker && docker compose exec -T jenkins-master grep -q '<numExecutors>0</numExecutors>' /var/jenkins_home/config.xml
      - desc: Les agents ont le label linux
        run: cd /home/vagrant/jenkins-docker && docker compose exec -T jenkins-master sh -c "grep -l '<label>.*linux' /var/jenkins_home/nodes/*/config.xml | wc -l" | grep -q 2
      - desc: Le job reparti a réussi sur un agent
        run: |
          cd /home/vagrant/jenkins-docker && docker compose exec -T jenkins-master sh -c '
            f=$(ls -d /var/jenkins_home/jobs/reparti/builds/[0-9]* | sort -n -t/ -k7 | tail -1)/log
            grep -q "Finished: SUCCESS" "$f" && grep -q "Running on agent" "$f"'
  - id: restriction
    title: Job attaché à un agent précis
    description: |
      Crée un job **freestyle** `sur-agent2` restreint au nœud `agent2` (*Restrict where this project can be run*,
      expression `agent2`) avec une étape shell `hostname && java -version`. Lance-le avec succès.
    cours: |
      Un job freestyle peut être **restreint** à certains nœuds via l'option *Restrict where this project can be
      run*, qui accepte une **expression de labels** : un nom de nœud, un label, ou une combinaison
      (`linux && !windows`, `agent1 || agent2`).

      Le nom d'un nœud fonctionne comme un label implicite : `agent2` cible ce seul nœud. C'est utile quand une
      machine possède un équipement ou un accès particulier, mais cela crée une dépendance : si `agent2` est hors
      ligne, le job attend.

      `hostname` dans le script permet de vérifier dans la console où le build a réellement été exécuté.
    checks:
      - desc: Le job est restreint à agent2
        run: cd /home/vagrant/jenkins-docker && docker compose exec -T jenkins-master grep -q '<assignedNode>agent2</assignedNode>' /var/jenkins_home/jobs/sur-agent2/config.xml
      - desc: Le dernier build a réussi sur agent2
        run: |
          cd /home/vagrant/jenkins-docker && docker compose exec -T jenkins-master sh -c '
            d=/var/jenkins_home/jobs/sur-agent2/builds; n=$(sed -n "s/^lastSuccessfulBuild //p" $d/permalinks)
            test -n "$n" && test "$n" -gt 0 && grep -q "on agent2" $d/$n/log'
  - id: parallele
    title: Étapes parallèles sur les deux agents
    description: |
      Crée un job pipeline `parallele` dont l'étape `Tests` lance **en parallèle** deux branches :
      `Unitaires` sur `agent { label 'agent1' }` et `Integration` sur `agent { label 'agent2' }`
      (le nom d'un nœud sert aussi de label). Lance-le avec succès : la durée totale doit être celle de la
      branche la plus longue.
    cours: |
      La directive `parallel` à l'intérieur d'un `stage` contient plusieurs `stage` exécutés **en même temps**.
      Chacun peut déclarer son propre `agent` : les branches tournent alors sur des machines différentes, ce qui
      réduit la durée totale à celle de la branche la plus longue.

      Si le pipeline a un agent global, chaque branche le réutilise ; avec `agent none` en tête, chaque étape
      doit choisir le sien. `failFast true` arrête les autres branches dès qu'une échoue.

      La vue *Pipeline Graph* (ou *Stage View*) montre les branches côte à côte et leur durée. Un `sleep` dans
      chaque branche rend le parallélisme visible.
    checks:
      - desc: Le dernier build a réussi en utilisant les deux agents
        run: |
          cd /home/vagrant/jenkins-docker && docker compose exec -T jenkins-master sh -c '
            d=/var/jenkins_home/jobs/parallele/builds; n=$(sed -n "s/^lastSuccessfulBuild //p" $d/permalinks)
            test -n "$n" && test "$n" -gt 0 && grep -q "\[Pipeline\] parallel" $d/$n/log && grep -q "Running on agent1" $d/$n/log && grep -q "Running on agent2" $d/$n/log'
  - id: transfert
    title: Transférer des fichiers entre agents (stash)
    description: |
      Crée un job pipeline `transfert` :
      1. une étape `Build` sur `agent1` crée `dist/app.txt` puis le met de côté avec `stash name: 'livrable', includes: 'dist/**'` ;
      2. une étape `Deploy` sur `agent2` le récupère avec `unstash 'livrable'` et affiche son contenu.

      Chaque agent a son propre espace de travail : sans `stash`, le fichier n'existerait pas sur agent2.
    cours: |
      Chaque agent a son propre **espace de travail** (*workspace*) sur son disque. Un fichier créé sur agent1
      n'existe pas sur agent2.

      `stash name: 'nom', includes: 'motif'` envoie des fichiers de l'espace de travail courant vers le
      contrôleur, où ils sont gardés le temps du build. `unstash 'nom'` les restitue dans l'espace de travail
      d'un autre agent (ou du même, dans une étape ultérieure).

      Le stash est fait pour de petits fichiers échangés pendant un build. Pour des livrables à conserver ou
      volumineux, on préfère `archiveArtifacts` ou un dépôt d'artefacts (Nexus, registre d'images).
    checks:
      - desc: Le dernier build a réussi avec stash puis unstash sur deux agents
        run: |
          cd /home/vagrant/jenkins-docker && docker compose exec -T jenkins-master sh -c '
            d=/var/jenkins_home/jobs/transfert/builds; n=$(sed -n "s/^lastSuccessfulBuild //p" $d/permalinks)
            test -n "$n" && test "$n" -gt 0 && grep -q "\[Pipeline\] stash" $d/$n/log && grep -q "\[Pipeline\] unstash" $d/$n/log && grep -q "Running on agent2" $d/$n/log'
  - id: sauvegarde
    title: Sauvegarder la configuration Jenkins
    description: |
      Sauvegarde la configuration du maître (sans l'historique des builds) dans
      `/home/vagrant/jenkins-backup.tar.gz` : `config.xml`, les `config.xml` de tous les jobs et le dossier `nodes`.
      L'archive doit être créée **sur la VM** (pas dans le conteneur).
    hint: "docker compose exec -T jenkins-master tar czf - -C /var/jenkins_home config.xml nodes $(...) > ~/jenkins-backup.tar.gz ; ou find jobs -maxdepth 2 -name config.xml"
    cours: |
      Toute la configuration de Jenkins est faite de fichiers XML dans `JENKINS_HOME` : `config.xml` (global),
      `jobs/<nom>/config.xml` (chaque job), `nodes/<nom>/config.xml` (chaque agent). L'historique des builds
      (`jobs/*/builds/`) est volumineux et souvent exclu des sauvegardes de configuration.

      Ici, `JENKINS_HOME` est à l'intérieur du conteneur (ou d'un volume) : `docker compose exec` permet d'y lancer
      `tar`, et `docker compose cp` (ou une redirection de la sortie de `tar` vers un fichier de la VM) de
      récupérer l'archive. `tar` accepte plusieurs chemins et des motifs ; `-C` fixe le dossier de départ.

      Teste toujours une sauvegarde en listant son contenu (`tar -tzf`).
    checks:
      - desc: L'archive contient config.xml et nodes/
        run: tar -tzf /home/vagrant/jenkins-backup.tar.gz | sed 's#^\./##' | grep -qx 'config.xml' && tar -tzf /home/vagrant/jenkins-backup.tar.gz | sed 's#^\./##' | grep -q '^nodes/agent1/config.xml'
      - desc: Elle contient la configuration des jobs
        run: tar -tzf /home/vagrant/jenkins-backup.tar.gz | sed 's#^\./##' | grep -q '^jobs/reparti/config.xml'
      - desc: Elle ne contient pas l'historique des builds
        run: "! tar -tzf /home/vagrant/jenkins-backup.tar.gz | grep -q '/builds/'"
