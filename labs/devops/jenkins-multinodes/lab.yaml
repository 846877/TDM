title: Jenkins maître + agents
level: avance
order: 3
tags: [jenkins, ci, agents, docker, vagrant]
summary: Raccorder des agents Jenkins et répartir les builds.
vagrant: Jenkins_multinodes/jenkins_multinodes_ubuntu22
description: |
  Lab Vagrant de ta formation : une VM (192.168.99.10) qui lance avec docker compose un maître
  Jenkins (http://192.168.99.10:8080) et deux conteneurs agents `agent1` et `agent2` dans
  `/home/vagrant/jenkins-docker`.

  Les nœuds `agent1` et `agent2` sont créés côté maître, mais les conteneurs agents ne reçoivent ni
  URL ni secret : **ils ne se connectent pas tout seuls**. Le premier exercice consiste à les raccorder.
  Le mot de passe initial : `docker compose exec jenkins-master cat /var/jenkins_home/secrets/initialAdminPassword`.
cours: |
  ## Jenkins distribué : un contrôleur, des agents

  Un Jenkins seul atteint vite ses limites : builds concurrents, outils différents selon les projets
  (Java 17, Node, Docker…), risque de sécurité si les builds tournent sur la machine qui détient tous les
  secrets. La réponse est l'architecture **contrôleur / agents** : le contrôleur orchestre, les agents
  exécutent.

  ### Architecture

  ```
                   ┌────────────── contrôleur (jenkins-master) ──────────────┐
                   │ interface web, configuration, file d'attente, historique │
                   │ exécuteurs : 0  (aucun build ici)                        │
                   └───────────────┬───────────────────────┬─────────────────┘
               WebSocket ou TCP    │ (l'agent se connecte) │
                   ┌───────────────▼─────┐         ┌───────▼─────────────┐
                   │ agent1  label linux │         │ agent2  label linux │
                   │ workspace /home/... │         │ workspace /home/... │
                   └─────────────────────┘         └─────────────────────┘
  ```

  ### Modes de connexion des agents

  | Mode | Principe |
  |---|---|
  | **Agent entrant** (JNLP / WebSocket) | l'agent démarre et se connecte au contrôleur avec un **secret** propre au nœud ; pratique derrière un pare-feu ou dans un conteneur |
  | **SSH** | le contrôleur se connecte à la machine et lance l'agent |
  | **Cloud** (Docker, Kubernetes) | des agents éphémères créés à la demande pour un build puis détruits |

  L'image `jenkins/inbound-agent` lit les variables `JENKINS_URL`, `JENKINS_AGENT_NAME`, `JENKINS_SECRET` et
  `JENKINS_WEB_SOCKET` pour se connecter.

  ### Choisir où s'exécute un build

  - Les **labels** décrivent les capacités d'un agent (`linux`, `docker`, `jdk17`). Le nom d'un nœud est
    aussi un label.
  - Dans un pipeline : `agent { label 'linux' }` globalement ou par étape, `agent none` en tête pour forcer
    chaque étape à choisir.
  - Dans un job freestyle : *Restrict where this project can be run* avec une expression (`linux && docker`).

  ```groovy
  pipeline {
      agent none
      stages {
          stage('Build') {
              agent { label 'agent1' }
              steps {
                  sh 'mkdir -p dist && echo v1 > dist/app.txt'
                  stash name: 'livrable', includes: 'dist/**'
              }
          }
          stage('Tests') {
              parallel {
                  stage('Unitaires')   { agent { label 'agent1' }; steps { sh 'sleep 5' } }
                  stage('Integration') { agent { label 'agent2' }; steps { sh 'sleep 5' } }
              }
          }
          stage('Deploy') {
              agent { label 'agent2' }
              steps { unstash 'livrable'; sh 'cat dist/app.txt' }
          }
      }
  }
  ```

  Chaque agent a son propre **espace de travail** : les fichiers ne voyagent d'un agent à l'autre que par
  `stash`/`unstash` (petits fichiers, durée d'un build) ou par des artefacts.

  ### Sauvegarde

  Tout l'état de Jenkins est dans `JENKINS_HOME`. Le minimum à sauvegarder : `config.xml`,
  `jobs/*/config.xml`, `nodes/`, `users/`, `credentials.xml` et `secrets/` (sans lesquels les identifiants
  ne peuvent pas être déchiffrés), `plugins` (ou la liste des plugins).

  ### Mémo

  ```bash
  docker compose ps ; docker compose logs -f agent1
  docker compose exec jenkins-master bash
  curl -u admin:JETON http://192.168.99.10:8080/computer/api/json?pretty=true
  ```

  ### Pièges courants

  - Un agent « hors ligne » : mauvaise URL, secret erroné, ou WebSocket non activé.
  - Laisser des exécuteurs sur le contrôleur : un build malveillant accède à toute la configuration.
  - Supposer qu'un fichier créé sur un agent existe sur un autre.
  - Une étiquette sans aucun agent correspondant : le build attend indéfiniment dans la file.

  ### Bonnes pratiques

  Zéro exécuteur sur le contrôleur, des agents éphémères et identiques (images versionnées), des labels qui
  décrivent des capacités et non des machines, la configuration en code (JCasC) et des sauvegardes testées.
