title: Gestion des secrets avec Vault
level: expert
order: 5
tags: [vault, secrets, sécurité, postgresql, approle, chiffrement, audit]
summary: Mettre en service HashiCorp Vault et l'utiliser comme en production - init et descellement, KV v2, politiques, AppRole, identifiants dynamiques PostgreSQL, chiffrement transit et audit.
compose: docker-compose.yml
service: ops
shell: bash
workdir: /root
description: |
  Fini les mots de passe dans les fichiers de configuration ! Un serveur **HashiCorp Vault** vient d'être
  installé (stockage fichier, conteneur `vault`) mais il n'est **ni initialisé ni descellé**. Une base
  **PostgreSQL** (`db:5432`, base `boutique`, administrateur `postgres` / `tdm-admin`) attend d'être protégée.

  Ton terminal est sur **ops** : la CLI `vault` y est installée et `VAULT_ADDR=http://vault:8200` est déjà défini.
  L'interface web est sur **http://localhost:8210**. `jq` et `psql` sont disponibles.

  > Ce lab manipule des clés de descellement et un jeton root : en production, on les distribue à plusieurs
  > personnes et on révoque le jeton root après la mise en service.
exercises:
  - id: init
    title: Initialiser Vault
    description: |
      Initialise Vault avec **5 parts** de clé de descellement, dont **3** nécessaires (Shamir), et enregistre la
      sortie **JSON** dans `/root/init.json` (elle contient les parts et le jeton root : ne la perds pas !).

      Observe `vault status` avant et après.
    hint: "vault operator init -key-shares=5 -key-threshold=3 -format=json > /root/init.json"
    checks:
      - desc: Vault est initialisé
        run: curl -fsS http://vault:8200/v1/sys/init | jq -e '.initialized == true' >/dev/null
      - desc: /root/init.json contient 5 parts, seuil 3, et le jeton root
        run: jq -e '(.unseal_keys_b64 | length) == 5 and .unseal_threshold == 3 and (.root_token | length) > 0' /root/init.json >/dev/null
  - id: descellement
    title: Desceller et se connecter
    description: |
      Vault démarre toujours **scellé** : il ne peut pas déchiffrer ses données. Descelle-le avec 3 des 5 parts,
      puis connecte-toi avec le jeton root (`vault login`, qui l'enregistre dans `~/.vault-token`).
    hint: "vault operator unseal $(jq -r '.unseal_keys_b64[0]' /root/init.json), puis [1] et [2] ; vault login $(jq -r .root_token /root/init.json)"
    checks:
      - desc: Vault est descellé
        run: curl -fsS http://vault:8200/v1/sys/seal-status | jq -e '.sealed == false' >/dev/null
      - desc: Le jeton enregistré est valide (politique root)
        run: vault token lookup -format=json | jq -e '.data.policies | index("root")' >/dev/null
  - id: kv
    title: Stocker des secrets versionnés (KV v2)
    description: |
      1. Active le moteur **KV version 2** sur le chemin `secret/`.
      2. Écris le secret `secret/boutique/config` avec `api_key=sk-live-0001` et `mode=prod`.
      3. La clé a fuité : remplace-la par `sk-live-0002` **sans perdre** `mode` (une nouvelle version est créée).

      Retrouve l'ancienne version avec `vault kv get -version=1`.
    hint: "vault secrets enable -path=secret -version=2 kv ; vault kv put ... ; vault kv patch secret/boutique/config api_key=sk-live-0002"
    checks:
      - desc: secret/ est un moteur KV version 2
        run: vault secrets list -format=json | jq -e '."secret/".type == "kv" and ."secret/".options.version == "2"' >/dev/null
      - desc: La version courante contient la nouvelle clé et mode=prod
        run: vault kv get -format=json secret/boutique/config | jq -e '.data.data.api_key == "sk-live-0002" and .data.data.mode == "prod"' >/dev/null
      - desc: L'ancienne version est conservée
        run: vault kv get -format=json -version=1 secret/boutique/config | jq -e '.data.data.api_key == "sk-live-0001"' >/dev/null
  - id: politiques
    title: Le moindre privilège avec les politiques
    description: |
      L'application ne doit pas utiliser le jeton root. Écris la politique **`boutique-lecture`** qui autorise
      uniquement la **lecture** des secrets sous `secret/boutique/` (attention au préfixe `data/` de KV v2).
      Crée un jeton portant cette politique et enregistre-le dans `/root/token-app`.

      Teste : avec ce jeton, la lecture fonctionne mais l'écriture est refusée.
    hint: "path \"secret/data/boutique/*\" { capabilities = [\"read\"] } ; vault policy write boutique-lecture fichier.hcl ; vault token create -policy=boutique-lecture -field=token > /root/token-app"
    checks:
      - desc: La politique boutique-lecture existe
        run: vault policy read boutique-lecture >/dev/null
      - desc: Le jeton applicatif porte la politique et lit le secret
        run: |
          export VAULT_TOKEN="$(cat /root/token-app)"
          vault token lookup -format=json | jq -e '.data.policies | index("boutique-lecture")' >/dev/null &&
          vault kv get secret/boutique/config >/dev/null
      - desc: Le jeton applicatif ne peut ni écrire ni lire ailleurs
        run: |
          export VAULT_TOKEN="$(cat /root/token-app)"
          test -n "$VAULT_TOKEN" && ! vault kv put secret/boutique/intrusion x=1 >/dev/null 2>&1 &&
          ! vault secrets list >/dev/null 2>&1
  - id: approle
    title: Authentifier une application (AppRole)
    description: |
      Un jeton créé à la main finit toujours dans un fichier oublié. Les applications s'authentifient plutôt
      avec **AppRole** :
      1. active la méthode `approle` ;
      2. crée le rôle `boutique` qui délivre des jetons portant `boutique-lecture`, valables **1 heure** ;
      3. enregistre son **role_id** dans `/root/approle/role_id` et un **secret_id** dans `/root/approle/secret_id`.

      Connecte-toi avec ce couple (`vault write auth/approle/login …`) comme le ferait l'application.
    hint: "vault auth enable approle ; vault write auth/approle/role/boutique token_policies=boutique-lecture token_ttl=1h ; vault read -field=role_id auth/approle/role/boutique/role-id ; vault write -f -field=secret_id auth/approle/role/boutique/secret-id"
    checks:
      - desc: Le rôle boutique délivre boutique-lecture pour 1 h
        run: vault read -format=json auth/approle/role/boutique | jq -e '(.data.token_policies | index("boutique-lecture")) and .data.token_ttl == 3600' >/dev/null
      - desc: Le couple role_id / secret_id permet de se connecter
        run: |
          vault write -format=json auth/approle/login role_id="$(cat /root/approle/role_id)" secret_id="$(cat /root/approle/secret_id)" |
            jq -e '.auth.policies | index("boutique-lecture")' >/dev/null
  - id: base-dynamique
    title: Des identifiants de base de données éphémères
    description: |
      Plutôt qu'un mot de passe PostgreSQL partagé et éternel, Vault peut créer **à la demande** un utilisateur
      temporaire. Active le moteur `database`, puis :
      1. configure la connexion `boutique` (plugin `postgresql-database-plugin`, `db:5432`, base `boutique`,
         compte `postgres` / `tdm-admin`, rôle autorisé `lecteur`) ;
      2. crée le rôle **`lecteur`** : il crée un utilisateur qui peut lire **toutes les tables** de `public`,
         valable 1 heure.

      Demande des identifiants (`vault read database/creds/lecteur`) et connecte-toi avec `psql` pour lire la table `produits`.
    hint: "connection_url=\"postgresql://{{username}}:{{password}}@db:5432/boutique?sslmode=disable\" ; creation_statements=\"CREATE ROLE \\\"{{name}}\\\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}'; GRANT SELECT ON ALL TABLES IN SCHEMA public TO \\\"{{name}}\\\";\""
    checks:
      - desc: La connexion boutique est configurée
        run: vault read -format=json database/config/boutique | jq -e '.data.plugin_name == "postgresql-database-plugin"' >/dev/null
      - desc: Des identifiants dynamiques permettent de lire produits
        run: |
          c=$(vault read -format=json database/creds/lecteur) || exit 1
          u=$(echo "$c" | jq -r .data.username); p=$(echo "$c" | jq -r .data.password)
          test "$(PGPASSWORD="$p" psql -h db -U "$u" -d boutique -tAc 'SELECT count(*) FROM produits')" = 3
        timeout: 30
      - desc: Le rôle lecteur expire au bout d'une heure
        run: vault read -format=json database/roles/lecteur | jq -e '.data.default_ttl == 3600' >/dev/null
  - id: transit
    title: Chiffrement en tant que service (transit)
    description: |
      L'équipe paiement veut chiffrer des numéros de carte **sans jamais manipuler de clé**. Active le moteur
      `transit` et crée la clé **`paiement`**.
      1. Chiffre `4111-1111-1111-1111` et enregistre le texte chiffré (`vault:v1:…`) dans `/root/carte.chiffre`.
      2. Fais **tourner** la clé (rotation) : les anciens textes chiffrés doivent rester déchiffrables.
    hint: "vault write -field=ciphertext transit/encrypt/paiement plaintext=$(printf %s 4111-1111-1111-1111 | base64) > /root/carte.chiffre ; vault write -f transit/keys/paiement/rotate"
    checks:
      - desc: /root/carte.chiffre se déchiffre en 4111-1111-1111-1111
        run: |
          ct=$(tr -d '[:space:]' < /root/carte.chiffre)
          case "$ct" in vault:v*) ;; *) exit 1 ;; esac
          test "$(vault write -field=plaintext transit/decrypt/paiement ciphertext="$ct" | base64 -d)" = 4111-1111-1111-1111
      - desc: La clé paiement a été tournée
        run: vault read -format=json transit/keys/paiement | jq -e '.data.latest_version >= 2' >/dev/null
  - id: audit
    title: Tracer tous les accès (audit)
    description: |
      Qui a lu quel secret, et quand ? Active un **périphérique d'audit** de type `file` qui écrit dans
      `/vault/logs/audit.log` (sur le conteneur vault) avec le mode `0644`, afin de pouvoir le lire depuis ops dans
      `/vault-logs/audit.log`. Relis ensuite `secret/boutique/config`, puis retrouve cet accès dans le journal.

      Remarque : les valeurs sensibles y sont **hachées** (HMAC), jamais en clair.
    hint: "vault audit enable file file_path=/vault/logs/audit.log mode=0644 ; jq 'select(.request.path == \"secret/data/boutique/config\")' /vault-logs/audit.log"
    checks:
      - desc: Un périphérique d'audit file est actif
        run: vault audit list -format=json | jq -e 'to_entries | any(.value.type == "file")' >/dev/null
      - desc: La lecture de secret/boutique/config est tracée
        run: grep -q '"path":"secret/data/boutique/config"' /vault-logs/audit.log
      - desc: La clé d'API n'apparaît pas en clair dans le journal
        run: test -s /vault-logs/audit.log && ! grep -q 'sk-live-000' /vault-logs/audit.log
