title: Scripting Bash
level: debutant
order: 5
tags: [bash, shell, scripts, automatisation, shellcheck]
summary: Arguments, conditions, boucles, codes de retour, traitement de texte, getopts, scripts robustes et shellcheck.
user: eleve
workdir: /home/eleve/scripts
description: |
  Un conteneur Ubuntu (utilisateur `eleve`, `sudo` sans mot de passe) avec `bash` et `shellcheck`.
  Tous tes scripts vont dans **`~/scripts`** et doivent être **exécutables** (`chmod +x`) avec la ligne
  `#!/bin/bash` en tête : les vérifications les lancent directement (`~/scripts/bonjour.sh Alice`).

  Le parcours va du premier script avec un argument jusqu'aux réflexes d'un script de production :
  codes de retour, messages d'erreur sur la sortie d'erreur, options avec `getopts`, `set -euo pipefail`,
  nettoyage avec `trap`, et un code propre validé par `shellcheck`.

  Des données d'exemple sont dans `~/donnees` (`access.log` : journal d'un serveur web).
cours: |
  ## Bash : automatiser ce que tu tapes déjà

  Un script Bash est une suite de commandes enregistrée dans un fichier. C'est l'outil d'automatisation le
  plus universel : il est présent sur chaque serveur, dans chaque conteneur et dans chaque étape de CI.

  ### Anatomie d'un script

  ```bash
  #!/bin/bash
  set -euo pipefail            # arrêt à la première erreur

  usage() { echo "Usage : $0 SOURCE DEST" >&2; exit 1; }
  [ $# -eq 2 ] || usage

  source_dir="$1"
  dest="$2"

  if [ ! -d "$source_dir" ]; then
      echo "Erreur : $source_dir n'est pas un dossier" >&2
      exit 2
  fi

  for f in "$source_dir"/*; do
      [ -f "$f" ] && echo "$(basename "$f")"
  done
  ```

  ### Variables et arguments

  | Variable | Contenu |
  |---|---|
  | `$0` | nom du script |
  | `$1` … `$9` | arguments positionnels |
  | `$#` | nombre d'arguments |
  | `$@` | tous les arguments (à mettre entre guillemets : `"$@"`) |
  | `$?` | code de sortie de la dernière commande |
  | `${VAR:-défaut}` | valeur par défaut si vide |
  | `$(commande)` | substitution : la sortie de la commande |

  **Toujours** mettre les variables entre guillemets doubles : `"$fichier"`. Sans guillemets, un nom avec
  des espaces se coupe en plusieurs mots et un `*` est développé.

  ### Codes de retour et tests

  Toute commande renvoie un code : `0` = succès, autre chose = échec. `if`, `&&` et `||` s'appuient dessus.
  `[ ... ]` (ou `[[ ... ]]` en Bash) est une commande de test :

  - fichiers : `-f` fichier ordinaire, `-d` dossier, `-e` existe, `-x` exécutable, `-s` non vide ;
  - chaînes : `=`, `!=`, `-z` (vide), `-n` (non vide) ;
  - nombres : `-eq`, `-ne`, `-lt`, `-le`, `-gt`, `-ge` (pas `<` ni `>` qui sont des redirections !).

  L'arithmétique se fait avec `$(( a + b ))` ou `(( a > b ))`.

  ### Les deux sorties

  Les résultats vont sur la sortie standard (1), les messages d'erreur sur la sortie d'erreur (2) avec
  `>&2`. Ainsi, `script > resultat.txt` ne mélange pas erreurs et données.

  ### Robustesse

  - `set -e` : arrêt si une commande échoue ; `set -u` : erreur sur une variable non définie ;
    `set -o pipefail` : un tube échoue si l'une de ses commandes échoue.
  - `trap 'commande' EXIT` : exécute un nettoyage à la sortie du script, quelle qu'en soit la raison.
  - `mktemp` crée un fichier ou dossier temporaire au nom unique.
  - `getopts` analyse les options courtes (`-d DOSSIER -r`).

  ### Pièges courants

  - Espaces : `a=1` (correct) contre `a = 1` (lance la commande `a`) ; `[ "$a" = 1 ]` exige des espaces.
  - `for f in $(ls)` casse sur les espaces : utilise `for f in dossier/*`.
  - `cd dossier` sans vérifier qu'il a réussi, suivi d'un `rm` : utilise `cd dossier || exit`.
  - Fins de ligne Windows (`\r\n`) dans un script : `bad interpreter`.
  - `set -e` ne s'applique pas dans une condition (`if cmd`) ni à gauche d'un `||`.

  ### Bonnes pratiques

  Un en-tête `#!/bin/bash` et `set -euo pipefail`, des fonctions, des variables en minuscules (les
  majuscules sont réservées à l'environnement), un message d'utilisation, des codes de sortie documentés,
  et **shellcheck** dans la CI. Au-delà de 100 lignes ou de structures de données complexes, passe à Python.
docs:
  - title: Manuel de référence GNU Bash
    url: https://www.gnu.org/software/bash/manual/bash.html
  - title: ShellCheck, analyse statique des scripts
    url: https://www.shellcheck.net/
  - title: Guide de style Shell de Google
    url: https://google.github.io/styleguide/shellguide.html
exercises:
  - id: premier-script
    title: Premier script avec un argument
    description: |
      Écris `~/scripts/bonjour.sh` :
      - `bonjour.sh Alice` affiche `Bonjour Alice` ;
      - sans argument, il affiche `Bonjour inconnu`.
    hint: "La variable $1 contient le premier argument ; ${1:-inconnu} donne une valeur par défaut"
    cours: |
      Un script commence par le **shebang** `#!/bin/bash`, qui indique au noyau quel interpréteur utiliser,
      et doit être rendu exécutable (`chmod +x`).

      Les arguments passés au script sont accessibles dans `$1`, `$2`… et leur nombre dans `$#`. Pour fournir
      une valeur par défaut quand un argument est absent, Bash propose l'expansion `${1:-valeur}`, ou bien un
      test `if [ -z "$1" ]` (`-z` = chaîne vide).

      Pense aux guillemets : `echo "Bonjour $1"` conserve les espaces si l'argument en contient
      (`bonjour.sh "Jean Pierre"`).
    checks:
      - desc: "Le script est exécutable et commence par #!/bin/bash"
        run: test -x /home/eleve/scripts/bonjour.sh && head -1 /home/eleve/scripts/bonjour.sh | grep -q '^#!.*bash'
      - desc: bonjour.sh Alice affiche « Bonjour Alice »
        run: test "$(/home/eleve/scripts/bonjour.sh Alice)" = "Bonjour Alice"
      - desc: Sans argument, il affiche « Bonjour inconnu »
        run: test "$(/home/eleve/scripts/bonjour.sh)" = "Bonjour inconnu"
  - id: conditions
    title: Conditions et codes de retour
    description: |
      Écris `~/scripts/type-fichier.sh CHEMIN` qui affiche :
      - `fichier` si le chemin est un fichier ordinaire (code de sortie `0`) ;
      - `dossier` si c'est un dossier (code `0`) ;
      - `absent` s'il n'existe pas (code de sortie **`1`**).

      Le code de sortie permet d'enchaîner : `type-fichier.sh /etc && echo existe`.
    hint: "if [ -f \"$1\" ]; then … elif [ -d \"$1\" ]; then … else …; exit 1; fi"
    cours: |
      `if [ condition ]; then ... elif ...; else ...; fi` choisit une branche selon le **code de retour** de la
      commande de test. Les opérateurs de fichiers sont `-f` (fichier ordinaire), `-d` (dossier) et `-e`
      (existe, quel que soit le type). Les espaces autour de `[` et `]` sont obligatoires : `[` est une commande.

      `exit N` termine le script avec le code `N` ; sans `exit`, le code est celui de la dernière commande.
      Le code de retour permet de chaîner des commandes : `a && b` lance `b` seulement si `a` réussit,
      `a || b` seulement s'il échoue. Vérifie avec `echo $?`.
    checks:
      - desc: Un fichier est reconnu
        run: test "$(/home/eleve/scripts/type-fichier.sh /etc/passwd)" = fichier
      - desc: Un dossier est reconnu
        run: test "$(/home/eleve/scripts/type-fichier.sh /etc)" = dossier
      - desc: Un chemin absent donne « absent » et le code 1
        run: out=$(/home/eleve/scripts/type-fichier.sh /nexiste/pas); test $? -eq 1 && test "$out" = absent
      - desc: Les chemins avec des espaces fonctionnent
        run: mkdir -p "/tmp/un dossier" && test "$(/home/eleve/scripts/type-fichier.sh '/tmp/un dossier')" = dossier
  - id: boucles
    title: Boucler sur des fichiers
    description: |
      Écris `~/scripts/inventaire.sh DOSSIER` qui affiche, pour chaque **fichier ordinaire** directement dans
      `DOSSIER` (pas les sous-dossiers), une ligne `nom nombre_de_lignes`, triée par nom. Exemple :

      ```
      a.txt 3
      b.log 1
      ```
    hint: "for f in \"$1\"/*; do [ -f \"$f\" ] || continue; echo \"$(basename \"$f\") $(wc -l < \"$f\")\"; done"
    cours: |
      `for f in "$dossier"/*; do ... done` parcourt les entrées d'un dossier grâce au **glob** `*`, qui est
      développé par le shell, trié par ordre alphabétique, et qui gère correctement les noms avec espaces (à
      condition de mettre `"$f"` entre guillemets).

      Le glob renvoie aussi les sous-dossiers : filtre avec `[ -f "$f" ]`. Pour afficher seulement le nom,
      `basename "$f"` (ou `${f##*/}`) retire le chemin.

      `wc -l < fichier` compte les lignes sans afficher le nom du fichier, contrairement à `wc -l fichier`.
      Attention : si le dossier est vide, le motif `*` reste tel quel ; teste l'existence avant de traiter.
    checks:
      - desc: L'inventaire est exact et ignore les dossiers
        run: |
          rm -rf /tmp/inv && mkdir -p /tmp/inv/sous && printf '1\n2\n3\n' > /tmp/inv/a.txt && printf 'x\n' > /tmp/inv/b.log && printf 'y\n' > /tmp/inv/sous/c.txt && test "$(/home/eleve/scripts/inventaire.sh /tmp/inv | tr -s ' ')" = "$(printf 'a.txt 3\nb.log 1')"
      - desc: Les noms de fichiers avec espaces fonctionnent
        run: |
          rm -rf /tmp/inv2 && mkdir -p /tmp/inv2 && printf '1\n2\n' > '/tmp/inv2/mon fichier.txt' && test "$(/home/eleve/scripts/inventaire.sh /tmp/inv2 | tr -s ' ')" = "mon fichier.txt 2"
  - id: sauvegarde
    title: Script de sauvegarde avec gestion d'erreurs
    description: |
      Écris `~/scripts/sauvegarde.sh SOURCE DESTINATION` qui crée l'archive
      `DESTINATION/<nom de SOURCE>-AAAA-MM-JJ.tar.gz` (date du jour) et affiche son chemin. Il doit :
      - sans les deux arguments : afficher un message d'utilisation sur la **sortie d'erreur** et quitter avec le code `1` ;
      - si `SOURCE` n'est pas un dossier : afficher une erreur sur la sortie d'erreur et quitter avec le code `2` ;
      - créer `DESTINATION` si elle n'existe pas.
    hint: "echo \"Usage : $0 SOURCE DEST\" >&2 ; exit 1 — et la date : $(date +%F)"
    cours: |
      Un script de production vérifie ses entrées **avant** d'agir et distingue ses cas d'échec par des codes
      de sortie différents (1 = mauvaise utilisation, 2 = source invalide…), que l'appelant peut tester.

      - `$#` donne le nombre d'arguments ; `>&2` envoie un message sur la sortie d'erreur.
      - `date +%F` produit la date au format `AAAA-MM-JJ`.
      - `basename "$source"` extrait le nom du dossier.
      - `mkdir -p` crée la destination sans erreur si elle existe.
      - `tar -czf archive -C parent nom` archive un dossier avec des chemins relatifs.

      Attention à un `SOURCE` donné avec une barre finale (`/data/`) : `basename` gère ce cas, mais pas toutes
      les autres méthodes.
    checks:
      - desc: L'archive est créée avec le bon nom
        run: |
          rm -rf /tmp/sv && mkdir -p /tmp/sv/projet && echo ok > /tmp/sv/projet/f.txt && /home/eleve/scripts/sauvegarde.sh /tmp/sv/projet /tmp/sv/archives >/dev/null && tar -tzf "/tmp/sv/archives/projet-$(date +%F).tar.gz" | grep -q 'f.txt'
      - desc: Sans argument, code 1 et message sur la sortie d'erreur
        run: |
          test -x /home/eleve/scripts/sauvegarde.sh || exit 1; out=$(/home/eleve/scripts/sauvegarde.sh 2>/tmp/sv-err); test $? -eq 1 && test -z "$out" && test -s /tmp/sv-err
      - desc: Source absente, code 2
        run: |
          test -x /home/eleve/scripts/sauvegarde.sh || exit 1; /home/eleve/scripts/sauvegarde.sh /nexiste/pas /tmp/sv/archives 2>/dev/null >/dev/null; test $? -eq 2
  - id: traitement-texte
    title: Analyser un journal web
    description: |
      Écris `~/scripts/top-ip.sh FICHIER N` qui affiche les **N adresses IP** les plus fréquentes du journal
      (1ʳᵉ colonne), de la plus fréquente à la moins fréquente, au format `nombre ip` :

      ```
      61 10.0.0.1
      43 10.0.0.2
      ```

      Teste-le sur `~/donnees/access.log`. Bonus : un second script `codes.sh FICHIER` qui compte les codes HTTP.
    hint: "awk '{print $1}' | sort | uniq -c | sort -rn | head -n \"$2\" (puis awk pour retirer les espaces de uniq -c)"
    cours: |
      Les filtres Unix s'enchaînent pour répondre à « qui apparaît le plus ? » :
      1. extraire la colonne voulue (`awk '{print $1}'` ou `cut -d' ' -f1`) ;
      2. `sort` pour regrouper les valeurs identiques ;
      3. `uniq -c` pour compter chaque groupe (il préfixe le nombre) ;
      4. `sort -rn` pour trier numériquement, du plus grand au plus petit ;
      5. `head -n N` pour garder les N premiers.

      `uniq -c` aligne ses nombres avec des espaces en tête : vérifie que ton format final correspond exactement
      à celui demandé (`awk '{print $1, $2}'` normalise les espaces). Le nombre de lignes à garder vient d'un
      argument : `head -n "$2"`.
    checks:
      - desc: top-ip.sh access.log 3 est exact
        run: |
          test "$(/home/eleve/scripts/top-ip.sh /home/eleve/donnees/access.log 3 | awk '{print $1" "$2}')" = "$(awk '{print $1}' /home/eleve/donnees/access.log | sort | uniq -c | sort -rn | head -n 3 | awk '{print $1" "$2}')"
      - desc: N est bien respecté
        run: test "$(/home/eleve/scripts/top-ip.sh /home/eleve/donnees/access.log 5 | wc -l)" = 5
  - id: robustesse
    title: Script robuste avec set -euo pipefail et trap
    description: |
      Écris `~/scripts/deploie.sh` qui illustre les bonnes pratiques :
      - `set -euo pipefail` en tête : le script s'arrête à la première erreur ;
      - il crée un dossier temporaire avec `mktemp -d /tmp/deploie.XXXXXX` et **affiche son chemin en première ligne** ;
      - un `trap` sur `EXIT` supprime ce dossier **dans tous les cas**, même en cas d'erreur ;
      - si le premier argument vaut `echec`, il exécute la commande `false` (qui doit faire échouer le script).

      `deploie.sh ok` se termine avec le code 0, `deploie.sh echec` avec un code non nul, et aucun dossier
      `/tmp/deploie.*` ne doit rester.
    hint: "tmp=$(mktemp -d /tmp/deploie.XXXXXX); trap 'rm -rf \"$tmp\"' EXIT; echo \"$tmp\""
    cours: |
      Par défaut, Bash continue après une erreur, ce qui peut transformer un petit échec en catastrophe.
      `set -euo pipefail` change ce comportement :
      - `-e` : quitter dès qu'une commande échoue ;
      - `-u` : erreur si on lit une variable non définie (attention à `$1` absent : `${1:-}`) ;
      - `-o pipefail` : le code d'un tube est celui de la première commande qui échoue.

      `trap 'commande' EXIT` enregistre une commande exécutée à la sortie du script, que celle-ci soit normale
      ou provoquée par une erreur : c'est l'endroit idéal pour supprimer les fichiers temporaires.
      `mktemp -d modele.XXXXXX` crée un dossier au nom unique et affiche son chemin, que tu récupères avec
      `$(...)`.
    checks:
      - desc: Le script utilise set -euo pipefail et trap
        run: grep -q 'set -euo pipefail' /home/eleve/scripts/deploie.sh && grep -q 'trap' /home/eleve/scripts/deploie.sh
      - desc: En cas de succès, code 0 et dossier supprimé
        run: |
          out=$(/home/eleve/scripts/deploie.sh ok); r=$?; d=$(echo "$out" | head -1); test $r -eq 0 && case "$d" in /tmp/deploie.*) ! test -e "$d" ;; *) false ;; esac
      - desc: En cas d'échec, code non nul et dossier supprimé quand même
        run: |
          out=$(/home/eleve/scripts/deploie.sh echec); r=$?; d=$(echo "$out" | head -1); test $r -ne 0 && case "$d" in /tmp/deploie.*) ! test -e "$d" ;; *) false ;; esac
  - id: options
    title: Options en ligne de commande avec getopts
    description: |
      Écris `~/scripts/chercher.sh` qui accepte des **options** :
      - `-d DOSSIER` (obligatoire) et `-e EXTENSION` (obligatoire, sans le point, par exemple `log`) ;
      - `-r` : recherche **récursive** (sinon, seulement le premier niveau) ;
      - `-h` : affiche l'aide et quitte avec le code 0 ; une option inconnue ou une option obligatoire manquante
        affiche l'aide sur la sortie d'erreur et quitte avec le code 1.

      Il affiche les chemins des fichiers trouvés, **triés**.
    hint: "while getopts 'd:e:rh' opt; do case $opt in d) dossier=$OPTARG;; … esac; done ; puis find \"$dossier\" -maxdepth 1 -name \"*.$ext\""
    cours: |
      `getopts` analyse les options courtes dans une boucle `while getopts "d:e:rh" opt; do case $opt in ... esac; done`.
      Dans la chaîne d'options, une lettre suivie de `:` attend une valeur, disponible dans `$OPTARG`. Une option
      inconnue donne `?` dans la variable.

      Après la boucle, vérifie que les options obligatoires ont été fournies. Une fonction `usage` évite de
      répéter le texte d'aide ; elle peut écrire sur la sortie standard (`-h`, code 0) ou sur la sortie
      d'erreur (erreur, code 1).

      Pour la recherche, `find` sait limiter la profondeur avec `-maxdepth 1`. N'oublie pas de trier le résultat.
    checks:
      - desc: Recherche au premier niveau
        run: |
          rm -rf /tmp/ch && mkdir -p /tmp/ch/sous && touch /tmp/ch/a.log /tmp/ch/b.txt /tmp/ch/sous/c.log && test "$(/home/eleve/scripts/chercher.sh -d /tmp/ch -e log)" = "/tmp/ch/a.log"
      - desc: Recherche récursive avec -r
        run: |
          rm -rf /tmp/ch && mkdir -p /tmp/ch/sous && touch /tmp/ch/a.log /tmp/ch/b.txt /tmp/ch/sous/c.log && test "$(/home/eleve/scripts/chercher.sh -r -d /tmp/ch -e log | tr '\n' ' ')" = "/tmp/ch/a.log /tmp/ch/sous/c.log "
      - desc: -h affiche l'aide (code 0)
        run: /home/eleve/scripts/chercher.sh -h | grep -q .
      - desc: Option inconnue ou -d manquant, code 1
        run: |
          test -x /home/eleve/scripts/chercher.sh && { /home/eleve/scripts/chercher.sh -z >/dev/null 2>&1; test $? -eq 1; } && { /home/eleve/scripts/chercher.sh -e log >/dev/null 2>&1; test $? -eq 1; }
  - id: supervision
    title: Script de supervision du disque
    description: |
      Écris `~/scripts/surveille-disque.sh SEUIL` qui lit le taux d'occupation de la partition `/`
      (colonne `Use%` de `df -P /`) et :
      - affiche `ALERTE <taux>%` et quitte avec le code **1** si le taux est supérieur ou égal au seuil ;
      - affiche `OK <taux>%` et quitte avec le code **0** sinon.

      Un tel script se branche facilement sur cron ou sur un outil de supervision.
    hint: "taux=$(df -P / | awk 'NR==2 {gsub(\"%\",\"\",$5); print $5}') puis if [ \"$taux\" -ge \"$1\" ]"
    cours: |
      `df -P /` affiche l'occupation du système de fichiers racine au format POSIX : une ligne d'en-tête puis
      une ligne de données, où la cinquième colonne vaut par exemple `42%`.

      Il faut donc : sauter l'en-tête (`tail -n 1` ou `awk 'NR==2'`), extraire la colonne (`awk '{print $5}'`)
      et retirer le `%` (`tr -d '%'` ou `${taux%\%}`) pour obtenir un nombre comparable.

      La comparaison numérique se fait avec `-ge` dans `[ ]` ou avec `(( taux >= seuil ))`. Le code de sortie
      est ce qui compte pour l'outil qui appelle le script (cron, Nagios, Zabbix…).
    checks:
      - desc: Seuil 0 → ALERTE avec le bon taux, code 1
        run: |
          t=$(df -P / | awk 'NR==2 {gsub("%","",$5); print $5}'); out=$(/home/eleve/scripts/surveille-disque.sh 0); test $? -eq 1 && test "$out" = "ALERTE ${t}%"
      - desc: Seuil 101 → OK, code 0
        run: |
          t=$(df -P / | awk 'NR==2 {gsub("%","",$5); print $5}'); out=$(/home/eleve/scripts/surveille-disque.sh 101); test $? -eq 0 && test "$out" = "OK ${t}%"
  - id: shellcheck
    title: Un code propre validé par shellcheck
    description: |
      `shellcheck` repère les pièges classiques du shell (variables non protégées par des guillemets,
      `cd` sans vérification, syntaxe obsolète…). Corrige tes scripts jusqu'à ce que
      `shellcheck ~/scripts/*.sh` n'affiche **plus aucun avertissement**.
      Il faut au moins les 8 scripts des exercices précédents.
    hint: "Chaque avertissement a un code (SC2086…) documenté sur https://www.shellcheck.net/wiki/"
    cours: |
      `shellcheck` analyse un script sans l'exécuter et signale les erreurs probables, chacune avec un code
      (`SC2086`…) documenté sur le site du projet. Les plus fréquents :
      - **SC2086** : variable non protégée par des guillemets → `"$var"` ;
      - **SC2164** : `cd` sans gestion d'échec → `cd "$d" || exit 1` ;
      - **SC2006** : ancienne syntaxe `` `cmd` `` → `$(cmd)` ;
      - **SC2045** : boucle sur la sortie de `ls` → utilise un glob.

      Corrige plutôt que de désactiver ; si un avertissement est vraiment injustifié, une directive
      `# shellcheck disable=SCxxxx` juste au-dessus de la ligne le documente. En CI, shellcheck renvoie un code
      non nul tant qu'il reste des avertissements.
    checks:
      - desc: Au moins 8 scripts dans ~/scripts
        run: test "$(ls /home/eleve/scripts/*.sh 2>/dev/null | wc -l)" -ge 8
      - desc: shellcheck ne signale rien
        run: shellcheck /home/eleve/scripts/*.sh
  - id: bs-fonctions
    title: Une bibliothèque de fonctions
    description: |
      Écris `~/scripts/outils.sh`, une **bibliothèque** destinée à être chargée avec `source` par d'autres
      scripts. Elle définit trois fonctions :
      - `majuscules TEXTE` : affiche le texte en majuscules (`majuscules abc` → `ABC`) ;
      - `est_entier VALEUR` : n'affiche rien et renvoie le code `0` si la valeur est un entier positif ou nul,
        `1` sinon ;
      - `log NIVEAU MESSAGE` : écrit `[NIVEAU] MESSAGE` sur la **sortie d'erreur**.

      Le fichier reste exécutable avec un shebang (pour shellcheck), mais ne fait rien quand on le charge à part
      définir les fonctions.
    hint: "majuscules() { echo \"$1\" | tr '[:lower:]' '[:upper:]'; } ; est_entier() { [[ $1 =~ ^[0-9]+$ ]]; } ; log() { echo \"[$1] $2\" >&2; }"
    cours: |
      Une **fonction** Bash se déclare avec `nom() { ...; }`. Elle reçoit ses propres arguments dans `$1`,
      `$2`, `$@` (ceux du script sont masqués pendant son exécution) et déclare ses variables avec `local` pour
      ne pas polluer le reste du script.

      Une fonction ne « renvoie » pas de valeur comme dans d'autres langages :
      - le **résultat** est ce qu'elle affiche, récupéré avec `$(fonction ...)` ;
      - le **code de retour** (`return N`, ou celui de la dernière commande) sert aux tests :
        `if est_entier "$x"; then ...`.

      `source fichier` (ou `.`) exécute un fichier **dans le shell courant** : ses fonctions et variables y
      restent disponibles. C'est ainsi qu'on partage du code entre scripts. Pour la validation, `[[ $1 =~ regex ]]`
      teste une expression régulière ; `tr '[:lower:]' '[:upper:]'` ou `${1^^}` passent en majuscules.
    checks:
      - desc: majuscules fonctionne
        run: bash -c 'source /home/eleve/scripts/outils.sh && test "$(majuscules abc)" = ABC && test "$(majuscules "Bonjour tdm")" = "BONJOUR TDM"'
      - desc: est_entier distingue les entiers
        run: bash -c 'source /home/eleve/scripts/outils.sh && est_entier 42 && est_entier 0 && ! est_entier abc && ! est_entier -3 && ! est_entier 4.2 && test -z "$(est_entier 7)"'
      - desc: log écrit sur la sortie d'erreur
        run: bash -c 'source /home/eleve/scripts/outils.sh && test -z "$(log INFO test 2>/dev/null)" && test "$(log INFO test 2>&1)" = "[INFO] test"'
      - desc: Le chargement seul n'affiche rien
        run: test -x /home/eleve/scripts/outils.sh && test -z "$(bash -c 'source /home/eleve/scripts/outils.sh' 2>&1)"
  - id: bs-tableaux
    title: Tableaux et arithmétique
    description: |
      Écris `~/scripts/stats.sh N1 N2 ...` qui reçoit une liste d'entiers et affiche sur une ligne
      `min=<min> max=<max> moyenne=<moyenne>` (moyenne **entière**, arrondie vers le bas).

      `stats.sh 4 8 15 16 23 42` affiche `min=4 max=42 moyenne=18`. Sans argument, le script écrit un message
      d'utilisation sur la sortie d'erreur et quitte avec le code `1`.
    hint: "nombres=(\"$@\") ; for n in \"${nombres[@]}\" ; (( n < min )) && min=$n ; moyenne=$(( somme / ${#nombres[@]} ))"
    cours: |
      Bash propose des **tableaux** indexés :
      - création : `tab=(a b c)` ou `tab=("$@")` pour copier les arguments ;
      - accès : `${tab[0]}`, tous les éléments `"${tab[@]}"`, nombre d'éléments `${#tab[@]}` ;
      - ajout : `tab+=(d)`.

      L'**arithmétique entière** se fait avec `$(( expression ))` pour obtenir une valeur, et `(( condition ))`
      pour tester (code 0 si vrai) : `(( a > b ))`, `(( total += n ))`. À l'intérieur, les variables n'ont pas
      besoin de `$`. La division est entière : `7 / 2` vaut 3. Pour des décimaux, il faut `bc` ou `awk`.

      Pour un minimum et un maximum, initialise les deux avec le premier élément, puis parcours le tableau.
      `declare -A` crée un tableau **associatif** (clé → valeur), pratique pour compter des occurrences.
    checks:
      - desc: Exemple de l'énoncé
        run: test "$(/home/eleve/scripts/stats.sh 4 8 15 16 23 42)" = "min=4 max=42 moyenne=18"
      - desc: Un seul nombre, ordre quelconque
        run: test "$(/home/eleve/scripts/stats.sh 7)" = "min=7 max=7 moyenne=7" && test "$(/home/eleve/scripts/stats.sh 10 3 5)" = "min=3 max=10 moyenne=6"
      - desc: Sans argument → code 1 et message d'erreur
        run: test -x /home/eleve/scripts/stats.sh && /home/eleve/scripts/stats.sh >/tmp/o 2>/tmp/e; test $? -eq 1 && test -s /tmp/e && ! test -s /tmp/o
  - id: bs-case
    title: Un script de service avec case
    description: |
      Écris `~/scripts/service.sh ACTION` qui simule un service, son état étant stocké dans `~/.service.etat` :
      - `start` : écrit `actif` dans le fichier d'état et affiche `demarre` ;
      - `stop` : écrit `inactif` et affiche `arrete` ;
      - `status` : affiche `actif` ou `inactif` (`inactif` si le fichier n'existe pas) et quitte avec le code
        `0` si actif, **`3`** si inactif (convention des scripts d'init) ;
      - toute autre action : message `Usage : service.sh {start|stop|status}` sur la sortie d'erreur, code `1`.
    hint: "case \"$1\" in start) ... ;; stop) ... ;; status) ... ;; *) echo 'Usage ...' >&2; exit 1 ;; esac"
    cours: |
      `case` compare une valeur à une série de **motifs**, plus lisiblement qu'une cascade de `if/elif` :

      ```
      case "$1" in
          start|demarrer) ... ;;
          stop)           ... ;;
          *)              ... ;;   # tout le reste
      esac
      ```

      Chaque branche se termine par `;;`. Les motifs acceptent les jokers du shell (`*`, `?`, `[abc]`) et
      l'alternative `|`. `*)` en dernier attrape les valeurs inattendues : c'est là qu'on affiche l'aide.

      C'est la structure classique des scripts de démarrage (`/etc/init.d/`) et de nombreux outils en ligne de
      commande. Les codes de sortie de `status` suivent la convention LSB : 0 = en marche, 3 = arrêté. Un fichier
      d'état se lit avec `$(cat fichier 2>/dev/null)` ou `$(< fichier)`.
    checks:
      - desc: start puis status → actif, code 0
        run: rm -f /home/eleve/.service.etat && test "$(/home/eleve/scripts/service.sh start)" = demarre && test "$(/home/eleve/scripts/service.sh status)" = actif
      - desc: stop puis status → inactif, code 3
        run: test "$(/home/eleve/scripts/service.sh stop)" = arrete && /home/eleve/scripts/service.sh status > /tmp/s; test $? -eq 3 && test "$(cat /tmp/s)" = inactif
      - desc: Sans fichier d'état → inactif
        run: rm -f /home/eleve/.service.etat && /home/eleve/scripts/service.sh status > /tmp/s; test $? -eq 3 && test "$(cat /tmp/s)" = inactif
      - desc: Action inconnue → code 1, aide sur la sortie d'erreur
        run: test -x /home/eleve/scripts/service.sh && /home/eleve/scripts/service.sh redemarrer >/tmp/o 2>/tmp/e; test $? -eq 1 && grep -q 'Usage' /tmp/e && ! test -s /tmp/o
