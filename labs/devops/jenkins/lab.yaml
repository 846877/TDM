title: Jenkins, intégration continue
level: intermediaire
order: 3
tags: [jenkins, ci/cd, pipeline, git, junit, api]
summary: Installer Jenkins, jobs, pipelines déclaratifs, Jenkinsfile dans Git, tests, artefacts et API.
image: jenkins/jenkins:lts-jdk17
command: []
ports: ["8081:8080"]
shell: bash
workdir: /var/jenkins_home
description: |
  Le conteneur Jenkins officiel, comme dans le lab Vagrant `jenkins` de ta formation (qui le lance avec
  docker compose). L'interface web est sur **http://localhost:8081** une fois le lab démarré
  (Jenkins met environ une minute à démarrer).

  Ton terminal est dans le conteneur (utilisateur `jenkins`, dossier `/var/jenkins_home`).

  Le parcours : installation, job freestyle, pipeline déclaratif, paramètres et déclencheurs, Jenkinsfile
  versionné dans Git, rapports de tests et artefacts, pipeline robuste et parallèle, puis pilotage par l'API.
cours: |
  ## Jenkins et l'intégration continue

  L'**intégration continue** (CI) consiste à construire et tester automatiquement le code à chaque
  modification. La **livraison continue** (CD) prolonge la chaîne jusqu'au déploiement. Objectif : détecter
  les problèmes tôt, livrer souvent, en petits incréments, de façon reproductible.

  ```
  git push ──▶ déclencheur ──▶ Checkout ──▶ Build ──▶ Tests ──▶ Analyse ──▶ Artefact ──▶ Déploiement
                  (webhook,                  │          │                    │
                   cron, SCM)                ▼          ▼                    ▼
                                         journaux   rapport JUnit     archive / registre
  ```

  Jenkins est le serveur de CI open source historique, extensible par plus de 1800 plugins.

  ### Architecture

  - Le **contrôleur** (anciennement *master*) héberge l'interface web, la configuration, l'historique et
    planifie les builds.
  - Les **agents** exécutent les builds (machines, conteneurs, pods Kubernetes). Chaque agent offre des
    **exécuteurs** (des emplacements de build) et porte des **étiquettes** (`linux`, `docker`).
  - Tout est stocké dans `JENKINS_HOME` : `jobs/<nom>/config.xml`, `jobs/<nom>/builds/<n>/`, plugins,
    secrets. Sauvegarder Jenkins, c'est sauvegarder ce dossier.

  ### Types de jobs

  | Type | Usage |
  |---|---|
  | Freestyle | configuration par formulaire, étapes simples |
  | Pipeline | pipeline décrit en code (Groovy) dans le job ou dans un `Jenkinsfile` |
  | Multibranch | un pipeline par branche du dépôt, découvert automatiquement |

  ### Le pipeline déclaratif

  ```groovy
  pipeline {
      agent any
      options { timeout(time: 10, unit: 'MINUTES') }
      parameters { string(name: 'ENV', defaultValue: 'dev') }
      environment { APP = 'tdm' }
      triggers { cron('H/15 * * * *') }
      stages {
          stage('Build') { steps { sh 'make build' } }
          stage('Tests') {
              parallel {
                  stage('Unitaires') { steps { sh 'make test' } }
                  stage('Lint')      { steps { sh 'make lint' } }
              }
          }
          stage('Deploy') {
              when { branch 'main' }
              steps { echo "Déploiement sur ${params.ENV}" }
          }
      }
      post {
          always  { junit 'rapports/*.xml' }
          failure { echo 'Échec !' }
      }
  }
  ```

  Le pipeline **as code** vit dans le dépôt (fichier `Jenkinsfile`) : il est versionné, relu et testé comme
  le reste du code.

  ### Mémo

  - Variables : `env.BUILD_NUMBER`, `env.JOB_NAME`, `env.WORKSPACE`, `params.X`.
  - Étapes : `sh`, `echo`, `writeFile`, `readFile`, `archiveArtifacts`, `junit`, `retry`, `timeout`,
    `input`, `withCredentials`, `stash`/`unstash`.
  - Guillemets Groovy : `'simples'` = littéral, `"doubles"` = interpolation `${...}`.
  - `H` dans un cron répartit la charge (`H/15` = toutes les 15 minutes à une minute choisie par Jenkins).
  - API : ajouter `/api/json` à n'importe quelle URL ; jeton d'API au lieu du mot de passe.

  ### Pièges courants

  - Exécuter les builds sur le contrôleur : en production, on met 0 exécuteur sur le contrôleur.
  - Des secrets dans le Jenkinsfile : utilise le magasin d'identifiants (*Credentials*).
  - Interpoler un secret dans `sh "..."` avec des guillemets doubles : il peut fuiter dans les journaux.
  - Des plugins jamais mis à jour : principale source de failles de Jenkins.
  - Un pipeline qui ne se termine jamais faute de `timeout`.

  ### Bonnes pratiques

  Un Jenkinsfile par dépôt, des étapes courtes et rapides, des rapports de tests publiés, des artefacts
  versionnés, des agents éphémères (conteneurs), Jenkins configuré en code (*Configuration as Code*) et
  sauvegardé.
docs:
  - title: Documentation Jenkins
    url: https://www.jenkins.io/doc/
  - title: Syntaxe des pipelines Jenkins
    url: https://www.jenkins.io/doc/book/pipeline/syntax/
  - title: Utiliser un Jenkinsfile
    url: https://www.jenkins.io/doc/book/pipeline/jenkinsfile/
exercises:
  - id: installation
    title: Terminer l'installation
    description: |
      Récupère le mot de passe initial (`cat /var/jenkins_home/secrets/initialAdminPassword`), ouvre
      http://localhost:8081, installe les **plugins suggérés** et crée l'utilisateur administrateur `admin`.
    cours: |
      Au premier démarrage, Jenkins génère un mot de passe administrateur aléatoire, stocké dans
      `JENKINS_HOME/secrets/initialAdminPassword` et affiché dans les journaux. Il ne sert qu'une fois, pour
      l'assistant d'installation.

      L'assistant propose ensuite d'installer les **plugins suggérés** : Git, Pipeline, Credentials, JUnit,
      Timestamper… Presque toutes les fonctionnalités de Jenkins sont des plugins, y compris les pipelines.

      Enfin, tu crées le premier compte administrateur. Jenkins stocke sa configuration et ses utilisateurs dans
      `JENKINS_HOME` (ici `/var/jenkins_home`, un volume dans l'installation officielle avec Docker) : un
      redémarrage du conteneur ne perd rien tant que ce dossier est conservé.
    checks:
      - desc: L'assistant d'installation est terminé
        run: test -f /var/jenkins_home/jenkins.install.InstallUtil.lastExecVersion
      - desc: L'utilisateur admin existe
        run: ls /var/jenkins_home/users/ | grep -q '^admin_'
      - desc: Le plugin Pipeline est installé
        run: test -d /var/jenkins_home/plugins/workflow-aggregator
  - id: freestyle
    title: Premier job
    description: |
      Crée un job **freestyle** nommé `hello-tdm` avec une étape « Exécuter un script shell » qui lance
      `echo "Bonjour depuis Jenkins" && uname -a`, puis lance un build qui réussit.
    cours: |
      Un job **freestyle** se configure entièrement par formulaire : source (Git), déclencheurs, étapes de
      build (script shell, Maven…) et actions après le build. C'est simple, mais la configuration vit dans
      Jenkins (`config.xml`) et non dans le dépôt de l'application.

      Une étape « Exécuter un script shell » lance le script avec `sh -xe` : chaque commande est affichée, et la
      première commande en échec fait échouer le build. Le résultat dépend donc du **code de sortie**.

      Chaque exécution est un **build** numéroté, avec sa *console output* (journal complet) et son statut :
      succès (bleu ou vert), échec (rouge), instable (jaune, tests en échec).
    checks:
      - desc: Le job hello-tdm existe
        run: test -f /var/jenkins_home/jobs/hello-tdm/config.xml
      - desc: Il exécute un script shell
        run: grep -q "hudson.tasks.Shell" /var/jenkins_home/jobs/hello-tdm/config.xml
      - desc: Un build a réussi
        run: grep -Eq "lastSuccessfulBuild [1-9]" /var/jenkins_home/jobs/hello-tdm/builds/permalinks
  - id: pipeline
    title: Pipeline déclaratif
    description: |
      Crée un job de type **Pipeline** nommé `pipeline-tdm` dont le script contient trois étapes
      (`stages`) : `Build`, `Test` et `Deploy`, chacune affichant un message avec `echo`. Lance-le avec succès.
    hint: "pipeline { agent any; stages { stage('Build') { steps { echo 'build' } } ... } }"
    cours: |
      Un job **Pipeline** décrit le processus en code. La syntaxe **déclarative** impose une structure :
      `pipeline { agent any; stages { stage('Nom') { steps { ... } } } }`.

      - `agent` indique où exécuter (`any` = n'importe quel exécuteur disponible) ;
      - chaque `stage` est une étape logique visible dans l'interface ;
      - `steps` contient les actions : `echo`, `sh`, etc.

      Le bouton *Pipeline Syntax* (générateur d'extraits) et la page *Declarative Directive Generator* aident à
      écrire la syntaxe. Une erreur de syntaxe fait échouer le build dès le début, avant toute étape : lis le
      début de la console.
    checks:
      - desc: C'est un job Pipeline
        run: grep -q "flow-definition" /var/jenkins_home/jobs/pipeline-tdm/config.xml
      - desc: Les étapes Build, Test et Deploy sont définies
        run: for s in Build Test Deploy; do grep -q "stage(&apos;$s&apos;)\|stage(\"$s\")\|stage('$s')" /var/jenkins_home/jobs/pipeline-tdm/config.xml || exit 1; done
      - desc: Un build a réussi
        run: grep -Eq "lastSuccessfulBuild [1-9]" /var/jenkins_home/jobs/pipeline-tdm/builds/permalinks
  - id: parametres
    title: Paramètres et déclencheur
    description: |
      Ajoute à `pipeline-tdm` un paramètre texte `ENV` (valeur par défaut `dev`) affiché dans l'étape Deploy
      (`echo "Déploiement sur ${params.ENV}"`), et un déclencheur périodique **toutes les 15 minutes**
      (`triggers { cron('H/15 * * * *') }`). Lance un build avec `ENV=prod`.
    cours: |
      La directive `parameters { string(name: 'ENV', defaultValue: 'dev', description: '...') }` ajoute un
      paramètre au job. Il se lit avec `params.ENV`, et doit être interpolé dans une chaîne entre **guillemets
      doubles** (`"... ${params.ENV}"`) : entre guillemets simples, Groovy ne remplace rien.

      `triggers { cron('...') }` déclenche le job périodiquement, avec la syntaxe cron (minute, heure, jour,
      mois, jour de semaine). Le symbole `H` répartit les jobs dans le temps pour éviter qu'ils partent tous à
      la même minute.

      Particularité : les paramètres et déclencheurs déclarés dans le script ne sont enregistrés qu'**après un
      premier build**. Ensuite seulement apparaît « Lancer un build avec des paramètres ».
    checks:
      - desc: Paramètre ENV défini
        run: grep -q "<name>ENV</name>" /var/jenkins_home/jobs/pipeline-tdm/config.xml
      - desc: Déclencheur cron toutes les 15 minutes
        run: grep -q "H/15" /var/jenkins_home/jobs/pipeline-tdm/config.xml
      - desc: Un build a été lancé avec ENV=prod
        run: grep -lq "Déploiement sur prod\|Deploiement sur prod" /var/jenkins_home/jobs/pipeline-tdm/builds/*/log
  - id: scm
    title: Jenkinsfile versionné dans Git
    description: |
      En entreprise, le pipeline vit **dans le dépôt** de l'application (fichier `Jenkinsfile`).
      1. Crée le dépôt `/var/jenkins_home/depots/app` (branche `main`) contenant un `Jenkinsfile` déclaratif
         avec les étapes `Build` et `Test`, et commite-le.
      2. Jenkins refuse de cloner un chemin local : publie le dossier avec le démon Git
         `git daemon --reuseaddr --base-path=/var/jenkins_home/depots --export-all --detach`
         (le dépôt est alors joignable à l'adresse `git://localhost/app`).
      3. Crée un job **Pipeline** `app-scm` de type *Pipeline script from SCM* (Git, URL `git://localhost/app`,
         branche `*/main`, chemin `Jenkinsfile`) et lance-le avec succès.
    hint: "git init -b main /var/jenkins_home/depots/app ; git config --global user.email/user.name si git le demande"
    cours: |
      Le **pipeline as code** : le fichier `Jenkinsfile`, à la racine du dépôt, contient le pipeline. Il évolue
      avec le code, passe en revue de code, et chaque branche peut avoir le sien.

      Pour que Jenkins le récupère, le job est configuré en *Pipeline script from SCM* : URL du dépôt, branche
      (`*/main`) et chemin du script. Jenkins clone le dépôt, lit le Jenkinsfile puis l'exécute.

      Pour des raisons de sécurité, le plugin Git refuse les URL locales (`file://`). Le **démon Git**
      (`git daemon`) publie des dépôts en lecture seule via le protocole `git://` (port 9418) ; l'option
      `--export-all` évite de créer un fichier `git-daemon-export-ok` dans chaque dépôt.
    checks:
      - desc: Le job lit son pipeline depuis Git
        run: grep -q 'CpsScmFlowDefinition' /var/jenkins_home/jobs/app-scm/config.xml && grep -q 'git://localhost/app' /var/jenkins_home/jobs/app-scm/config.xml
      - desc: Le dépôt contient un Jenkinsfile commité sur main
        run: git -C /var/jenkins_home/depots/app cat-file -e main:Jenkinsfile
      - desc: Un build a réussi en lisant le Jenkinsfile
        run: |
          d=/var/jenkins_home/jobs/app-scm/builds; n=$(sed -n 's/^lastSuccessfulBuild //p' $d/permalinks); test -n "$n" && test "$n" -gt 0 && grep -q 'Obtained Jenkinsfile from' "$d/$n/log"
  - id: qualite
    title: Rapports de tests et artefacts
    description: |
      Crée un job **Pipeline** `qualite` dont le script :
      1. produit un fichier `dist/app-${BUILD_NUMBER}.txt` (le « livrable ») et l'**archive**
         (`archiveArtifacts artifacts: 'dist/*.txt'`) ;
      2. écrit un rapport de tests au format **JUnit** dans `rapports/tests.xml` (au moins deux cas de test
         réussis, écrits avec `sh` ou `writeFile`) et le publie avec l'étape `junit 'rapports/*.xml'`.

      Lance-le : la page du build affiche les artefacts et le résultat des tests.
    hint: |
      writeFile file: 'rapports/tests.xml', text: '<testsuite name="tdm" tests="2"><testcase classname="tdm" name="a"/><testcase classname="tdm" name="b"/></testsuite>'
    cours: |
      Un pipeline produit deux choses utiles à garder :
      - des **artefacts** : le livrable (binaire, archive, paquet). `archiveArtifacts` les copie depuis l'espace
        de travail vers le build, téléchargeables depuis sa page ;
      - des **rapports de tests** : l'étape `junit` lit des fichiers XML au format JUnit, suit l'évolution des
        tests de build en build et marque le build *instable* si des tests échouent.

      Le format JUnit est simple : un élément `<testsuite>` contenant des `<testcase name="..." classname="..."/>`,
      avec éventuellement un `<failure>`. Presque tous les outils de test savent le produire.

      `writeFile file: 'chemin', text: '...'` écrit un fichier ; `${BUILD_NUMBER}` (variable d'environnement)
      rend chaque livrable unique.
    checks:
      - desc: Le dernier build réussi a archivé un livrable
        run: |
          d=/var/jenkins_home/jobs/qualite/builds; n=$(sed -n 's/^lastSuccessfulBuild //p' $d/permalinks); test -n "$n" && test "$n" -gt 0 && ls $d/$n/archive/dist/*.txt >/dev/null
      - desc: Un rapport JUnit a été publié
        run: |
          d=/var/jenkins_home/jobs/qualite/builds; n=$(sed -n 's/^lastSuccessfulBuild //p' $d/permalinks); test -n "$n" && test "$n" -gt 0 && test -f $d/$n/junitResult.xml && test "$(grep -c '<case>' $d/$n/junitResult.xml)" -ge 2
  - id: robuste
    title: Pipeline robuste et parallèle
    description: |
      Crée un job **Pipeline** `robuste` qui utilise les mécanismes d'un pipeline de production :
      - `options { timeout(time: 10, unit: 'MINUTES') }` pour ne jamais rester bloqué ;
      - un bloc `environment` qui définit `APP = 'tdm'` ;
      - une étape `Vérifications` qui lance **en parallèle** (`parallel`) deux branches `Lint` et `Tests` ;
      - une commande réessayée jusqu'à 3 fois (`retry(3) { ... }`) ;
      - une section `post` avec `always { echo 'Nettoyage termine' }`.

      Lance-le avec succès et observe la vue *Pipeline Graph* ou *Stage View*.
    cours: |
      Un pipeline de production doit être borné et lisible :
      - `options { timeout(...) }` : abandonne le build s'il dure trop (un test bloqué ne doit pas occuper un
        exécuteur indéfiniment) ;
      - `environment { NOM = 'valeur' }` : des variables accessibles dans toutes les étapes (`$APP` dans `sh`,
        `env.APP` en Groovy) ;
      - `parallel { stage('A') {...} stage('B') {...} }` à l'intérieur d'un `stage` : des branches exécutées en
        même temps, pour raccourcir le pipeline ;
      - `retry(N) { ... }` : réessaie un bloc instable (téléchargement, réseau) ;
      - `post { always / success / failure { ... } }` : actions finales, comme le nettoyage ou les
        notifications.
    checks:
      - desc: timeout, parallel, retry et post sont utilisés
        run: |
          f=/var/jenkins_home/jobs/robuste/config.xml; grep -q 'timeout(' $f && grep -q 'parallel' $f && grep -q 'retry(' $f && grep -q 'post' $f && grep -q 'environment' $f
      - desc: Le dernier build a réussi et lancé les branches en parallèle
        run: |
          d=/var/jenkins_home/jobs/robuste/builds; n=$(sed -n 's/^lastSuccessfulBuild //p' $d/permalinks); test -n "$n" && test "$n" -gt 0 && grep -q '\[Pipeline\] parallel' $d/$n/log && grep -q 'Nettoyage termine' $d/$n/log
  - id: api
    title: Piloter Jenkins par son API
    description: |
      Automatise Jenkins sans l'interface web :
      1. Dans ton profil (`admin` > *Security*), génère un **jeton d'API** et enregistre-le sous la forme
         `admin:<jeton>` dans `/var/jenkins_home/api-token.txt`, avec les droits `600`.
      2. Déclenche un build du job `hello-tdm` **avec curl** :
         `curl -X POST -u "$(cat /var/jenkins_home/api-token.txt)" http://localhost:8080/job/hello-tdm/build`
      3. Récupère le résultat du dernier build en JSON : `.../job/hello-tdm/lastBuild/api/json`.
    hint: "Avec un jeton d'API, Jenkins n'exige pas de jeton CSRF (crumb) pour les requêtes POST"
    cours: |
      Presque chaque page de Jenkins a son équivalent machine : ajoute `/api/json` à l'URL d'un job ou d'un build
      (`/job/X/lastBuild/api/json`). On déclenche un build avec une requête **POST** sur `/job/X/build`
      (ou `/buildWithParameters?ENV=prod`).

      Pour s'authentifier, on utilise un **jeton d'API** propre à l'utilisateur plutôt que son mot de passe : il
      est révocable, et une requête authentifiée par jeton n'a pas besoin du jeton anti-CSRF (*crumb*).
      `curl -u utilisateur:jeton` envoie une authentification HTTP basique.

      Le jeton est un secret : stocke-le dans un fichier lisible par toi seul. Le champ `result` du JSON vaut
      `SUCCESS`, `FAILURE` ou `null` tant que le build tourne.
    checks:
      - desc: Le jeton est protégé (600)
        run: test "$(stat -c %a /var/jenkins_home/api-token.txt)" = 600
      - desc: Le jeton permet de s'authentifier en tant qu'admin
        run: |
          curl -fsS -u "$(cat /var/jenkins_home/api-token.txt)" http://localhost:8080/me/api/json | grep -q '"id":"admin"'
      - desc: hello-tdm a été construit au moins deux fois
        run: test "$(cat /var/jenkins_home/jobs/hello-tdm/nextBuildNumber)" -ge 3
  - id: jk-credentials
    title: Utiliser un secret sans l'exposer
    description: |
      1. Dans **Administrer Jenkins > Credentials**, ajoute dans le domaine global un identifiant de type
         **Secret text** avec l'ID **`api-cle`** (valeur de ton choix, au moins 8 caractères).
      2. Crée un job **Pipeline** `secrets` qui utilise ce secret avec `withCredentials` :
         `withCredentials([string(credentialsId: 'api-cle', variable: 'CLE')]) { sh 'test -n "$CLE" && echo "cle chargee"' }`.
      3. Lance-le avec succès. Ajoute ensuite `sh 'echo $CLE'` et constate que la valeur est **masquée** (`****`) dans le journal.
    hint: "Credentials > System > Global credentials > Add Credentials > Kind : Secret text, ID : api-cle"
    cours: |
      Un pipeline ne doit jamais contenir de secret en clair : il est versionné, affiché, copié. Jenkins
      fournit un **magasin d'identifiants** (*Credentials*) : mots de passe, jetons (*Secret text*), couples
      utilisateur/mot de passe, clés SSH, fichiers, certificats. Ils sont chiffrés sur disque
      (`credentials.xml`, avec les clés de `secrets/`) et désignés par un **ID**.

      `withCredentials([...]) { ... }` expose le secret dans une variable d'environnement **seulement** pendant
      le bloc, et Jenkins remplace toute occurrence de sa valeur par `****` dans le journal. Dans un pipeline
      déclaratif, `environment { CLE = credentials('api-cle') }` fait de même pour tout le pipeline.

      Piège classique : interpoler le secret par Groovy (`sh "echo ${CLE}"` entre guillemets doubles) le place
      dans la ligne de commande, ce qui peut le divulguer. Utilise des guillemets **simples** pour que ce soit
      le shell qui lise la variable.
    checks:
      - desc: L'identifiant api-cle existe et son secret est chiffré
        run: grep -q '<id>api-cle</id>' /var/jenkins_home/credentials.xml && grep -q '<secret>{' /var/jenkins_home/credentials.xml
      - desc: Le job secrets utilise withCredentials avec api-cle
        run: grep -q 'withCredentials' /var/jenkins_home/jobs/secrets/config.xml && grep -q 'api-cle' /var/jenkins_home/jobs/secrets/config.xml
      - desc: Un build a réussi
        run: grep -Eq "lastSuccessfulBuild [1-9]" /var/jenkins_home/jobs/secrets/builds/permalinks
  - id: jk-conditions
    title: Étapes conditionnelles (when)
    description: |
      Crée un job **Pipeline** `conditions` avec :
      - un paramètre booléen `DEPLOYER` (valeur par défaut `false`) ;
      - une étape `Build` qui affiche `Build ok` ;
      - une étape `Deploy` qui affiche `Deploiement effectue` et ne s'exécute **que si** `DEPLOYER` est vrai
        (directive `when`).

      Lance un build avec `DEPLOYER=false` (l'étape Deploy est sautée), puis un build avec `DEPLOYER=true`.
    hint: "parameters { booleanParam(name: 'DEPLOYER', defaultValue: false) } ; stage('Deploy') { when { expression { params.DEPLOYER } } steps { echo 'Deploiement effectue' } }"
    cours: |
      La directive `when` d'une étape décide si elle s'exécute. Conditions courantes :
      - `branch 'main'` : seulement sur cette branche (pipelines multibranches) ;
      - `tag 'v*'` : seulement pour un tag ;
      - `environment name: 'ENV', value: 'prod'` ;
      - `expression { params.DEPLOYER }` : n'importe quelle expression Groovy ;
      - `changeset 'docs/**'` : seulement si certains fichiers ont changé ;
      - combinaisons avec `allOf`, `anyOf`, `not`.

      Une étape sautée apparaît grisée dans la vue du pipeline et le journal indique
      `Stage "Deploy" skipped due to when conditional`. C'est le moyen de n'avoir qu'**un** pipeline pour tous
      les cas, plutôt que des jobs dupliqués.

      `booleanParam` crée une case à cocher. Rappel : les paramètres déclarés dans le script n'apparaissent
      qu'après un premier build.
    checks:
      - desc: Le job déclare le paramètre booléen DEPLOYER et une condition when
        run: f=/var/jenkins_home/jobs/conditions/config.xml; grep -q 'BooleanParameterDefinition' $f && grep -q '<name>DEPLOYER</name>' $f && grep -q 'when' $f
      - desc: Un build a sauté l'étape Deploy
        run: grep -lq 'Stage "Deploy" skipped due to when conditional' /var/jenkins_home/jobs/conditions/builds/*/log
      - desc: Un build a exécuté le déploiement
        run: |
          for f in /var/jenkins_home/jobs/conditions/builds/*/log; do grep -q 'Deploiement effectue' "$f" && grep -q 'Finished: SUCCESS' "$f" && exit 0; done; exit 1
