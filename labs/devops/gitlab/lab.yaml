title: GitLab et GitLab CI
level: avance
order: 2
tags: [gitlab, git, ci/cd, runner, api]
summary: Héberger ses dépôts, pipelines GitLab CI, runner, variables, artefacts, règles et merge requests.
image: gitlab/gitlab-ce:latest
command: []
ports: ["8929:80", "2224:22"]
shell: bash
workdir: /root
description: |
  GitLab CE dans un conteneur (le lab Vagrant `gitlab` de ta formation l'installe avec Ansible et Docker
  dans une VM de 8 Go). **Prévois au moins 4 Go de RAM libres** : le premier démarrage prend 3 à 5 minutes.
  Suis l'avancement avec `gitlab-ctl status`.

  Interface web : **http://localhost:8929** (utilisateur `root`).
exercises:
  - id: connexion
    title: Première connexion
    description: |
      Récupère le mot de passe initial de `root` dans `/etc/gitlab/initial_root_password`, connecte-toi
      sur http://localhost:8929 et **change le mot de passe**. Écris ensuite `ok` dans `/root/connexion.txt`.
    checks:
      - desc: GitLab répond
        run: curl -fsS -o /dev/null http://localhost/users/sign_in
      - desc: Le mot de passe root a été changé
        run: |
          gitlab-rails runner 'u = User.find_by_username("root"); exit(u.password_changed_at && u.password_changed_at > u.created_at + 60 ? 0 : 1)'
        timeout: 240
  - id: projet
    title: Créer un projet et pousser du code
    description: |
      Crée un projet **public** `tdm-demo` (sous l'utilisateur root), puis depuis le terminal du lab :
      clone-le (`git clone http://root:<mot de passe>@localhost/root/tdm-demo.git`), ajoute un
      `README.md` et pousse le commit sur `main`.
    checks:
      - desc: Le projet root/tdm-demo existe et est public
        run: curl -fsS http://localhost/api/v4/projects/root%2Ftdm-demo | grep -q '"visibility":"public"'
      - desc: README.md est présent sur main
        run: curl -fsS "http://localhost/api/v4/projects/root%2Ftdm-demo/repository/files/README.md?ref=main" >/dev/null
  - id: ci
    title: Premier pipeline
    description: |
      Ajoute un fichier `.gitlab-ci.yml` avec deux étapes (`stages`) `build` et `test`, chacune avec un job
      qui affiche un message. Pousse-le : un pipeline doit apparaître dans **Build > Pipelines**
      (il restera en attente tant qu'aucun runner n'est enregistré, c'est l'exercice suivant).
    checks:
      - desc: .gitlab-ci.yml est présent sur main
        run: curl -fsS "http://localhost/api/v4/projects/root%2Ftdm-demo/repository/files/.gitlab-ci.yml?ref=main" >/dev/null
      - desc: Un pipeline a été créé
        run: curl -fsS http://localhost/api/v4/projects/root%2Ftdm-demo/pipelines | grep -q '"id"'
  - id: runner
    title: Enregistrer un runner
    description: |
      Installe `gitlab-runner` **dans ce conteneur** (exécuteur `shell`), enregistre-le sur ton instance
      avec un jeton créé dans **Admin > CI/CD > Runners**, puis relance le pipeline : il doit réussir.
    hint: "curl -L https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.deb.sh | bash && apt-get install -y gitlab-runner"
    checks:
      - desc: Un runner est en ligne
        run: |
          gitlab-rails runner 'exit(Ci::Runner.online.any? ? 0 : 1)'
        timeout: 240
      - desc: Le dernier pipeline de tdm-demo a réussi
        run: curl -fsS "http://localhost/api/v4/projects/root%2Ftdm-demo/pipelines?per_page=1" | grep -q '"status":"success"'
  - id: jeton
    title: Jeton d'accès pour l'API
    description: |
      Pour automatiser GitLab (scripts, outils), on utilise un **jeton d'accès personnel**.
      Dans **Preferences > Access tokens** de `root`, crée un jeton avec le droit `api` et enregistre-le dans
      `/root/gitlab-token` (droits `600`). Teste-le :
      `curl -H "PRIVATE-TOKEN: $(cat /root/gitlab-token)" http://localhost/api/v4/user`.

      Les exercices suivants utilisent ce jeton pour vérifier ton travail.
    checks:
      - desc: Le fichier du jeton est protégé (600)
        run: test "$(stat -c %a /root/gitlab-token)" = 600
      - desc: Le jeton authentifie root sur l'API
        run: |
          curl -fsS -H "PRIVATE-TOKEN: $(tr -d '[:space:]' < /root/gitlab-token)" http://localhost/api/v4/user | grep -q '"username":"root"'
  - id: variables
    title: Variables CI/CD et secrets masqués
    description: |
      Dans **Settings > CI/CD > Variables** du projet `tdm-demo`, crée :
      - `DEPLOY_ENV` = `production` ;
      - `API_SECRET` (au moins 8 caractères) **masquée** : sa valeur n'apparaîtra jamais dans les logs.

      Ajoute au `.gitlab-ci.yml` un job `info` qui affiche `Environnement : $DEPLOY_ENV` et tente
      `echo $API_SECRET` (le log doit montrer `[MASKED]`). Pousse et vérifie le log du job.
    checks:
      - desc: DEPLOY_ENV vaut production
        run: |
          curl -fsS -H "PRIVATE-TOKEN: $(tr -d '[:space:]' < /root/gitlab-token)" http://localhost/api/v4/projects/root%2Ftdm-demo/variables/DEPLOY_ENV | grep -q '"value":"production"'
      - desc: API_SECRET est masquée
        run: |
          curl -fsS -H "PRIVATE-TOKEN: $(tr -d '[:space:]' < /root/gitlab-token)" http://localhost/api/v4/projects/root%2Ftdm-demo/variables/API_SECRET | grep -q '"masked":true'
      - desc: Un job réussi a affiché l'environnement
        run: |
          T=$(tr -d '[:space:]' < /root/gitlab-token); P=root%2Ftdm-demo
          for id in $(curl -fsS -H "PRIVATE-TOKEN: $T" "http://localhost/api/v4/projects/$P/jobs?scope=success&per_page=50" | /opt/gitlab/embedded/bin/ruby -rjson -e 'JSON.parse(STDIN.read).each { |j| puts j["id"] }'); do
            curl -fsS -H "PRIVATE-TOKEN: $T" "http://localhost/api/v4/projects/$P/jobs/$id/trace"
          done | grep -q 'Environnement : production'
        timeout: 120
  - id: artefacts
    title: Artefacts entre les étapes
    description: |
      Fais circuler un livrable dans le pipeline :
      - le job `build` (stage `build`) crée `dist/app.txt` contenant `version-$CI_COMMIT_SHORT_SHA` et le
        déclare comme **artefact** (`artifacts: paths: [dist/]`, `expire_in: 1 week`) ;
      - le job `test` (stage `test`) affiche le contenu de `dist/app.txt` (il récupère automatiquement les
        artefacts des étapes précédentes).
    checks:
      - desc: Un job build réussi a produit un artefact
        run: |
          T=$(tr -d '[:space:]' < /root/gitlab-token)
          curl -fsS -H "PRIVATE-TOKEN: $T" "http://localhost/api/v4/projects/root%2Ftdm-demo/jobs?scope=success&per_page=50" | /opt/gitlab/embedded/bin/ruby -rjson -e 'exit(JSON.parse(STDIN.read).any? { |j| j["name"] == "build" && j["artifacts_file"] } ? 0 : 1)'
      - desc: Un job test réussi a lu le livrable
        run: |
          T=$(tr -d '[:space:]' < /root/gitlab-token); P=root%2Ftdm-demo
          for id in $(curl -fsS -H "PRIVATE-TOKEN: $T" "http://localhost/api/v4/projects/$P/jobs?scope=success&per_page=50" | /opt/gitlab/embedded/bin/ruby -rjson -e 'JSON.parse(STDIN.read).each { |j| puts j["id"] if j["name"] == "test" }'); do
            curl -fsS -H "PRIVATE-TOKEN: $T" "http://localhost/api/v4/projects/$P/jobs/$id/trace"
          done | grep -q 'version-[0-9a-f]'
        timeout: 120
  - id: regles
    title: Déployer uniquement sur un tag
    description: |
      Ajoute un stage `deploy` avec un job `deploy` qui ne s'exécute **que pour les tags**
      (`rules: - if: $CI_COMMIT_TAG`). Pousse un commit sur `main` (pas de job deploy), puis crée et pousse le tag
      `v1.0` : son pipeline doit contenir le job `deploy` et réussir.
    hint: "git tag v1.0 && git push origin v1.0"
    checks:
      - desc: Le pipeline du tag v1.0 a réussi avec le job deploy
        run: |
          T=$(tr -d '[:space:]' < /root/gitlab-token); P=root%2Ftdm-demo
          id=$(curl -fsS -H "PRIVATE-TOKEN: $T" "http://localhost/api/v4/projects/$P/pipelines?ref=v1.0&status=success&per_page=1" | /opt/gitlab/embedded/bin/ruby -rjson -e 'p = JSON.parse(STDIN.read); puts p[0]["id"] if p[0]')
          test -n "$id" && curl -fsS -H "PRIVATE-TOKEN: $T" "http://localhost/api/v4/projects/$P/pipelines/$id/jobs" | grep -q '"name":"deploy"'
      - desc: Le dernier pipeline de main n'a pas de job deploy
        run: |
          T=$(tr -d '[:space:]' < /root/gitlab-token); P=root%2Ftdm-demo
          id=$(curl -fsS -H "PRIVATE-TOKEN: $T" "http://localhost/api/v4/projects/$P/pipelines?ref=main&per_page=1" | /opt/gitlab/embedded/bin/ruby -rjson -e 'p = JSON.parse(STDIN.read); puts p[0]["id"] if p[0]')
          test -n "$id" && ! curl -fsS -H "PRIVATE-TOKEN: $T" "http://localhost/api/v4/projects/$P/pipelines/$id/jobs" | grep -q '"name":"deploy"'
  - id: merge-request
    title: Merge request protégée par le pipeline
    description: |
      Travaille comme en équipe :
      1. Dans **Settings > Merge requests**, coche **Pipelines must succeed**.
      2. Crée une branche `feature/doc`, modifie `README.md`, pousse la branche et ouvre une **merge request**
         vers `main`.
      3. Une fois le pipeline vert, fusionne-la.
    hint: "git push -o merge_request.create -o merge_request.target=main origin feature/doc crée la MR en ligne de commande"
    checks:
      - desc: Les pipelines doivent réussir avant fusion
        run: |
          curl -fsS -H "PRIVATE-TOKEN: $(tr -d '[:space:]' < /root/gitlab-token)" http://localhost/api/v4/projects/root%2Ftdm-demo | grep -q '"only_allow_merge_if_pipeline_succeeds":true'
      - desc: La merge request de feature/doc est fusionnée
        run: |
          curl -fsS -H "PRIVATE-TOKEN: $(tr -d '[:space:]' < /root/gitlab-token)" "http://localhost/api/v4/projects/root%2Ftdm-demo/merge_requests?state=merged&source_branch=feature/doc" | grep -q '"state":"merged"'
