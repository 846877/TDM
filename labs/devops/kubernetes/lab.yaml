title: Kubernetes multi-nœuds (kubeadm)
level: avance
order: 1
tags: [kubernetes, kubeadm, kubectl, vagrant]
summary: Un vrai cluster master + worker en VM, pour s'entraîner comme à la certification.
vagrant: kubernetes/kubernetes_ubuntu22
machine: master
description: |
  Lab Vagrant de ta formation : deux VM Ubuntu 22.04 (`master` 192.168.99.10 et `worker1`
  192.168.99.11) avec Kubernetes 1.31 installé par kubeadm. Le premier démarrage prend du temps
  (installation via Ansible).

  Le terminal s'ouvre sur `master`. `kubectl` s'utilise en root : `sudo -i` ou `sudo kubectl ...`.
  Il faut environ 4 Go de RAM libres pour les deux VM.
exercises:
  - id: cluster
    title: État du cluster
    description: |
      Vérifie que les deux nœuds sont `Ready`, puis ajoute le label `role=worker` au nœud worker.
    hint: "kubectl get nodes -o wide, kubectl label node <nom> role=worker"
    checks:
      - desc: Deux nœuds Ready
        run: test "$(sudo kubectl get nodes --no-headers | grep -c ' Ready')" -ge 2
      - desc: Un nœud porte le label role=worker
        run: sudo kubectl get nodes -l role=worker --no-headers | grep -q .
  - id: deployment
    title: Déploiement et service
    description: |
      Crée le namespace `web`, puis un déploiement `nginx` (image `nginx:1.27`, 3 réplicas) exposé par
      un service NodePort `nginx` sur le port **30080**.
    hint: "kubectl create deployment ... --replicas=3, kubectl expose ... --type=NodePort, puis kubectl edit svc pour fixer nodePort"
    checks:
      - desc: 3 réplicas disponibles dans le namespace web
        run: test "$(sudo kubectl -n web get deploy nginx -o jsonpath='{.status.availableReplicas}')" = 3
      - desc: Le service est en NodePort 30080
        run: test "$(sudo kubectl -n web get svc nginx -o jsonpath='{.spec.ports[0].nodePort}')" = 30080
      - desc: nginx répond sur le NodePort
        run: curl -fsS --max-time 5 http://192.168.99.10:30080 | grep -qi nginx
  - id: config
    title: ConfigMap et Secret
    description: |
      Dans `web`, crée une ConfigMap `app-config` avec `MODE=production` et un Secret `app-secret`
      avec `DB_PASSWORD=s3cret`. Lance un pod `app` (image `busybox:1.36`, commande `sleep 3600`) qui
      reçoit les deux en variables d'environnement.
    hint: "envFrom: configMapRef / secretRef"
    checks:
      - desc: Le pod app tourne
        run: test "$(sudo kubectl -n web get pod app -o jsonpath='{.status.phase}')" = Running
      - desc: MODE vaut production dans le pod
        run: test "$(sudo kubectl -n web exec app -- printenv MODE)" = production
      - desc: DB_PASSWORD vient du secret
        run: test "$(sudo kubectl -n web exec app -- printenv DB_PASSWORD)" = s3cret
  - id: scheduling
    title: Placement et ressources
    description: |
      Crée un déploiement `api` (image `nginx:1.27`, 2 réplicas) dans `web` dont les pods ne tournent
      **que** sur le nœud `role=worker`, avec une requête de 100m CPU / 64Mi et une limite de 128Mi.
    hint: "nodeSelector, resources.requests / resources.limits"
    checks:
      - desc: 2 réplicas disponibles
        run: test "$(sudo kubectl -n web get deploy api -o jsonpath='{.status.availableReplicas}')" = 2
      - desc: Tous les pods api sont sur le worker
        run: |
          w=$(sudo kubectl get nodes -l role=worker -o jsonpath='{.items[0].metadata.name}')
          test -n "$w" && test -z "$(sudo kubectl -n web get pods -l app=api -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}' | grep -v "^$w$")"
      - desc: Requêtes et limites définies
        run: |
          sudo kubectl -n web get deploy api -o jsonpath='{.spec.template.spec.containers[0].resources}' | grep -q '"memory":"128Mi"' &&
          sudo kubectl -n web get deploy api -o jsonpath='{.spec.template.spec.containers[0].resources.requests.cpu}' | grep -q '100m'
  - id: drain
    title: Maintenance d'un nœud
    description: |
      Simule une maintenance : vide (`drain`) le worker puis remets-le en service. À la fin, le worker
      doit être planifiable et une annotation `maintenance=faite` doit être posée dessus.
    hint: "kubectl drain --ignore-daemonsets --delete-emptydir-data, kubectl uncordon, kubectl annotate"
    checks:
      - desc: Le worker est planifiable
        run: test -z "$(sudo kubectl get nodes -l role=worker -o jsonpath='{.items[0].spec.unschedulable}')"
      - desc: L'annotation maintenance=faite est posée
        run: test "$(sudo kubectl get nodes -l role=worker -o jsonpath='{.items[0].metadata.annotations.maintenance}')" = faite
  - id: sondes
    title: Sondes de santé
    description: |
      Rends le déploiement `nginx` du namespace `web` **auto-réparant** :
      - une `readinessProbe` HTTP sur `/` port 80 (le pod ne reçoit du trafic qu'une fois prêt) ;
      - une `livenessProbe` HTTP sur `/` port 80, avec `initialDelaySeconds: 5` (le conteneur est redémarré s'il ne répond plus).

      Après le déploiement progressif, les 3 réplicas doivent être de nouveau disponibles.
    hint: "kubectl -n web edit deploy nginx, ou kubectl patch ; vérifie avec kubectl -n web describe pod"
    checks:
      - desc: readinessProbe HTTP définie
        run: sudo kubectl -n web get deploy nginx -o jsonpath='{.spec.template.spec.containers[0].readinessProbe.httpGet.port}' | grep -q 80
      - desc: livenessProbe HTTP définie
        run: sudo kubectl -n web get deploy nginx -o jsonpath='{.spec.template.spec.containers[0].livenessProbe.httpGet.port}' | grep -q 80
      - desc: 3 réplicas disponibles
        run: test "$(sudo kubectl -n web get deploy nginx -o jsonpath='{.status.availableReplicas}')" = 3
  - id: rbac
    title: Droits d'accès avec RBAC
    description: |
      Une application de supervision doit pouvoir **lire** les pods du namespace `web`, et rien d'autre.
      Crée dans `web` :
      - le ServiceAccount `lecteur` ;
      - le Role `lecture-pods` (verbes `get`, `list`, `watch` sur les `pods`) ;
      - le RoleBinding `lecteur-pods` qui lie les deux.

      Vérifie avec `kubectl auth can-i ... --as=system:serviceaccount:web:lecteur`.
    hint: "kubectl -n web create role lecture-pods --verb=get,list,watch --resource=pods ; kubectl -n web create rolebinding lecteur-pods --role=lecture-pods --serviceaccount=web:lecteur"
    checks:
      - desc: lecteur peut lister les pods de web
        run: test "$(sudo kubectl auth can-i list pods -n web --as=system:serviceaccount:web:lecteur)" = yes
      - desc: lecteur ne peut pas supprimer de pods
        run: test "$(sudo kubectl auth can-i delete pods -n web --as=system:serviceaccount:web:lecteur)" = no
      - desc: lecteur ne peut pas lire les secrets
        run: test "$(sudo kubectl auth can-i get secrets -n web --as=system:serviceaccount:web:lecteur)" = no
      - desc: lecteur n'a aucun droit dans default
        run: test "$(sudo kubectl auth can-i list pods -n default --as=system:serviceaccount:web:lecteur)" = no
  - id: stockage
    title: Stockage persistant (PV et PVC)
    description: |
      1. Crée un PersistentVolume `pv-donnees` de 1Gi, `storageClassName: manual`, mode `ReadWriteOnce`,
         de type `hostPath` sur `/data/tdm` (avec `type: DirectoryOrCreate`).
      2. Dans `web`, crée la PersistentVolumeClaim `donnees` (500Mi, classe `manual`) : elle doit se lier au PV.
      3. Lance le pod `stockage` (image `busybox:1.36`, commande `sleep 3600`) qui monte la claim sur `/data`, puis
         écris `persistant` dans `/data/test.txt` depuis le pod.
    hint: "kubectl -n web exec stockage -- sh -c 'echo persistant > /data/test.txt'"
    checks:
      - desc: La claim donnees est liée à pv-donnees
        run: test "$(sudo kubectl -n web get pvc donnees -o jsonpath='{.status.phase}/{.spec.volumeName}')" = Bound/pv-donnees
      - desc: Le pod stockage monte la claim sur /data
        run: sudo kubectl -n web get pod stockage -o jsonpath='{.spec.volumes[*].persistentVolumeClaim.claimName}' | grep -qw donnees
      - desc: Le fichier est écrit sur le volume
        run: test "$(sudo kubectl -n web exec stockage -- cat /data/test.txt)" = persistant
  - id: etcd
    title: Sauvegarder etcd
    description: |
      Geste classique de la certification CKA : **sauvegarder la base etcd** du cluster.
      Fais un instantané avec `etcdctl snapshot save` (depuis le pod etcd ou avec `etcdctl` installé sur le
      master, en utilisant les certificats de `/etc/kubernetes/pki/etcd/`), puis place-le dans
      `/home/vagrant/etcd-snapshot.db`, lisible par l'utilisateur `vagrant`.
    hint: |
      sudo kubectl -n kube-system exec etcd-master -- etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key snapshot save /var/lib/etcd/snapshot.db
      (le dossier /var/lib/etcd du pod est celui du master), puis sudo cp et sudo chown
    checks:
      - desc: L'instantané existe et pèse plus de 1 Mo
        run: test -r /home/vagrant/etcd-snapshot.db && test "$(stat -c %s /home/vagrant/etcd-snapshot.db)" -gt 1000000
      - desc: C'est bien une base etcd (bbolt)
        run: od -A n -t x4 -j 16 -N 4 /home/vagrant/etcd-snapshot.db | grep -q 'ed0cdaed'
