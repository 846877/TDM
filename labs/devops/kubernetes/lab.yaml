title: Kubernetes multi-nœuds (kubeadm)
level: avance
order: 1
tags: [kubernetes, kubeadm, kubectl, vagrant]
summary: Un vrai cluster master + worker en VM, pour s'entraîner comme à la certification.
vagrant: kubernetes/kubernetes_ubuntu22
machine: master
description: |
  Lab Vagrant de ta formation : deux VM Ubuntu 22.04 (`master` 192.168.99.10 et `worker1`
  192.168.99.11) avec Kubernetes 1.31 installé par kubeadm. Le premier démarrage prend du temps
  (installation via Ansible).

  Le terminal s'ouvre sur `master`. `kubectl` s'utilise en root : `sudo -i` ou `sudo kubectl ...`.
  Il faut environ 4 Go de RAM libres pour les deux VM.
cours: |
  ## Kubernetes multi-nœuds avec kubeadm

  **kubeadm** est l'outil officiel pour installer un cluster Kubernetes « à la main » : il initialise le plan
  de contrôle, génère les certificats et fait rejoindre les nœuds. Ce lab correspond à ce que l'on manipule
  pour les certifications CKA/CKAD : plusieurs nœuds, placement, maintenance, RBAC, stockage, sauvegarde
  d'etcd.

  ### Ce que kubeadm installe

  ```
   master (plan de contrôle)                        worker1
   ┌──────────────────────────────────┐            ┌──────────────────────┐
   │ pods statiques (/etc/kubernetes/ │            │ kubelet (systemd)    │
   │   manifests) :                   │            │ kube-proxy (DaemonSet)│
   │   kube-apiserver  etcd           │◀──6443────▶│ CNI (réseau des pods)│
   │   scheduler  controller-manager  │            │ containerd           │
   │ kubelet (systemd), containerd    │            │  [pods applicatifs]  │
   └──────────────────────────────────┘            └──────────────────────┘
   /etc/kubernetes/pki : CA du cluster, certificats ; /etc/kubernetes/admin.conf : kubeconfig admin
  ```

  Le master porte un **taint** `node-role.kubernetes.io/control-plane:NoSchedule` : les pods applicatifs
  vont sur les workers. Le réseau des pods est fourni par un plugin **CNI** (Calico, Flannel, Cilium…).

  ### Placer les pods

  | Mécanisme | Effet |
  |---|---|
  | `nodeSelector` | le pod ne va que sur les nœuds ayant ces labels |
  | affinité / anti-affinité | règles plus riches (préférences, répartition entre nœuds) |
  | taints et tolérations | un nœud repousse les pods qui ne tolèrent pas sa taint |
  | `resources.requests` | ce que le scheduler réserve ; un nœud plein n'accepte plus de pods |
  | `resources.limits` | plafond appliqué à l'exécution (OOM kill pour la mémoire) |

  ### Sécurité : RBAC

  Toute requête à l'API est authentifiée (certificat, jeton de ServiceAccount) puis **autorisée** par RBAC :

  ```
  ServiceAccount lecteur ──RoleBinding──▶ Role lecture-pods (get, list, watch sur pods)
                                           portée : namespace web
  ClusterRole + ClusterRoleBinding        portée : tout le cluster
  ```

  ### Stockage

  Un **PersistentVolume** (PV) est un morceau de stockage du cluster ; une **PersistentVolumeClaim** (PVC)
  est la demande d'un pod. Kubernetes lie une PVC à un PV compatible (classe, taille, mode d'accès). Avec une
  **StorageClass** dynamique, les PV sont créés à la demande.

  ### etcd

  etcd contient **tout** l'état du cluster. Sa sauvegarde régulière (`etcdctl snapshot save`) est la base
  de tout plan de reprise.

  ### Mémo

  ```bash
  kubectl get nodes -o wide ; kubectl describe node worker1
  kubectl label node worker1 role=worker ; kubectl annotate node worker1 cle=valeur
  kubectl cordon|uncordon NOEUD
  kubectl drain NOEUD --ignore-daemonsets --delete-emptydir-data
  kubectl create configmap app-config --from-literal=MODE=production
  kubectl create secret generic app-secret --from-literal=DB_PASSWORD=s3cret
  kubectl auth can-i list pods -n web --as=system:serviceaccount:web:lecteur
  kubectl get pv,pvc -A
  ETCDCTL_API=3 etcdctl --endpoints=https://127.0.0.1:2379 --cacert=... --cert=... --key=... snapshot save f.db
  ```

  ### Pièges courants

  - Un Secret n'est qu'encodé en base64, pas chiffré : protège l'accès à l'API et active le chiffrement
    d'etcd.
  - `drain` refuse de continuer à cause des DaemonSets ou des volumes `emptyDir` : options dédiées.
  - Une PVC reste `Pending` : aucune StorageClass ou aucun PV compatible.
  - Un pod `Pending` avec « Insufficient cpu » : requêtes trop élevées pour les nœuds.
  - Donner `cluster-admin` à une application « pour que ça marche ».

  ### Bonnes pratiques

  Plusieurs masters derrière un répartiteur en production, sauvegardes etcd automatisées et testées, RBAC au
  moindre privilège, requêtes et limites partout, mises à jour du cluster version par version
  (`kubeadm upgrade`).
