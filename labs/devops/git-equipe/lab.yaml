title: Git en équipe
level: debutant
order: 9
tags: [git, collaboration, branches, rebase, tags, hooks]
summary: Travailler à plusieurs sur un dépôt partagé - clones, branches suivies, relecture, pull --rebase, force-with-lease, fusion, release, miroir et hook serveur.
build: .
shell: bash
user: eleve
workdir: /home/eleve
description: |
  Un poste Ubuntu (utilisateur `eleve`) avec Git. Le **dépôt partagé** de l'équipe est
  **`/srv/git/boutique.git`** (un dépôt nu, comme sur un serveur GitLab ou GitHub) ; il contient déjà
  quelques commits de **Charlie**, un collègue.

  Tu vas jouer tour à tour **Alice** et **Bob**, chacun avec son propre clone :
  `~/alice/boutique` et `~/bob/boutique`. Le script **`~/outils/charlie-pousse.sh`** simule Charlie qui
  pousse une correction pendant que tu travailles.

  Ce lab suppose les bases de Git (lab « Git au quotidien ») : commit, branche, fusion. Il se concentre
  sur ce qui change quand on n'est plus seul : synchronisation, historique partagé, relecture, versions
  publiées et règles imposées par le serveur. Les messages de commit suivent la convention
  **Conventional Commits** (`feat: ...`, `fix: ...`, `docs: ...`, `test: ...`, `chore: ...`).
cours: |
  ## Git à plusieurs : un historique partagé

  Git est **distribué** : chaque clone contient tout l'historique. Pour travailler en équipe, on désigne
  un dépôt de référence, souvent un dépôt **nu** (*bare*, sans copie de travail) hébergé sur un serveur,
  que tout le monde clone et vers lequel chacun pousse.

  ```
                  /srv/git/boutique.git  (dépôt nu « origin »)
                 ▲  push     │ fetch / pull     ▲
                 │           ▼                  │
     ~/alice/boutique   ~/bob/boutique   /srv/charlie/boutique
     main, feature/…    main, feature/…  main
     origin/main …      origin/main …    origin/main …
  ```

  Dans chaque clone, les **branches de suivi** (`origin/main`, `origin/feature/panier`) sont la photo du
  serveur au dernier `fetch`. Elles ne bougent que quand tu interroges le serveur.

  ### Les commandes de synchronisation

  | Commande | Effet |
  |---|---|
  | `git fetch` | met à jour les `origin/*`, sans toucher à tes branches |
  | `git pull` | `fetch` puis fusion (ou rebase) de la branche suivie |
  | `git pull --rebase` | rejoue tes commits locaux au-dessus de ceux du serveur |
  | `git push -u origin br` | publie `br` et en fait la branche suivie |
  | `git push --force-with-lease` | réécrit une branche distante **si** personne n'a poussé entre-temps |
  | `git push --delete origin br` | supprime une branche distante |
  | `git push origin --tags` | publie les tags |

  ### Le refus « non-fast-forward »

  Si quelqu'un a poussé depuis ton dernier `fetch`, ton `push` est refusé : le serveur n'accepte qu'une
  avance rapide (*fast-forward*), c'est-à-dire un historique qui prolonge le sien. Il faut d'abord
  intégrer son travail : `git pull --rebase` (historique linéaire) ou `git pull` (commit de fusion).

  ```
  serveur : A─B─C (Charlie)        toi : A─B─D        après pull --rebase : A─B─C─D'
  ```

  ### Un flux de travail courant

  1. Partir de `main` à jour, créer une branche `feature/...`.
  2. Committer par petites étapes, pousser la branche (`push -u`).
  3. Ouvrir une demande de fusion (*merge request*, *pull request*) : relecture, tests de la CI.
  4. Fusionner dans `main`, supprimer la branche.
  5. Taguer les versions publiées (`v1.0.0`, versionnage sémantique).

  ### Pièges

  - `git push --force` sur une branche partagée écrase le travail des autres : préfère
    `--force-with-lease`, et ne réécris jamais `main`.
  - Rebaser des commits déjà récupérés par d'autres les oblige à tout réaligner : on rebase son travail
    **local** ou sa propre branche.
  - Oublier `git fetch` : `origin/main` est alors périmé, et tes comparaisons sont fausses.
  - Une configuration `user.name` globale partagée : chaque clone peut avoir sa configuration locale.

  ### Bonnes pratiques

  Des commits petits et bien nommés, une branche par sujet, `main` toujours déployable, des tags
  annotés pour les versions, et des règles appliquées **par le serveur** (branches protégées, hooks,
  CI obligatoire) plutôt que par la bonne volonté de chacun. Synchronise-toi souvent (`git fetch`,
  `git pull --rebase`) : plus on attend, plus les conflits sont gros et difficiles à résoudre.

  ### Pour réviser

  1. Quelle différence entre `git fetch` et `git pull` ?
  2. Pourquoi un `push` est-il refusé en « non-fast-forward » ?
  3. Que vérifie `--force-with-lease` de plus que `--force` ?
  4. Où s'exécute un hook `pre-receive` ?
