title: HAProxy et Squid
level: intermediaire
order: 4
tags: [haproxy, load balancing, proxy, squid, tls]
summary: Répartition de charge, routage, statistiques, proxy sortant, persistance, TLS, limitation de débit et API runtime.
compose: docker-compose.yml
service: haproxy
shell: bash
workdir: /usr/local/etc/haproxy
description: |
  Reprend le lab Vagrant `haproxy-squid` : un répartiteur **haproxy** et des backends sur le même réseau :
  `red:8080` et `blue:8080` (application colorée), `site1:80` et `site2:80`, plus un proxy **squid:3128**.

  Ton terminal est sur haproxy, dans `/usr/local/etc/haproxy`. HAProxy n'est pas encore démarré :
  - tester la configuration : `haproxy -c -f haproxy.cfg`
  - démarrer : `haproxy -D -f haproxy.cfg -p /run/haproxy.pid`
  - recharger après une modification : `haproxy -D -f haproxy.cfg -p /run/haproxy.pid -sf $(cat /run/haproxy.pid)`

  Le port 80 est publié sur **http://localhost:8090** et les statistiques sur **http://localhost:8404**.
cours: |
  ## HAProxy : répartition de charge et haute disponibilité

  HAProxy est un répartiteur de charge (*load balancer*) et reverse proxy TCP/HTTP réputé pour ses
  performances et sa fiabilité. Il répartit les requêtes entre plusieurs serveurs, retire automatiquement
  ceux qui tombent en panne, termine le TLS et protège les applications (limitation de débit, ACL).
  **Squid**, à l'inverse, est un proxy **sortant** : il relaie les requêtes des clients vers Internet
  (filtrage, cache).

  ```
                           ┌────────── HAProxy ──────────┐
  client ─▶ :80/:443 ─▶    │ frontend web                │
                           │   ACL path_beg /site1 ──────┼──▶ backend site1 ─▶ site1:80
                           │   ACL path_beg /site2 ──────┼──▶ backend site2 ─▶ site2:80
                           │   défaut ───────────────────┼──▶ backend couleurs ─▶ red:8080 ✔
                           │                             │                     └▶ blue:8080 ✔
                           └── stats :8404 ── socket admin ┘   (health checks)
  ```

  ### Structure de `haproxy.cfg`

  ```
  global                      # réglages du processus (journaux, socket, utilisateur)
      stats socket /run/haproxy/admin.sock mode 600 level admin
  defaults                    # valeurs héritées par les sections suivantes
      mode http
      timeout connect 5s
      timeout client  30s
      timeout server  30s
  frontend web                # ce qui écoute
      bind *:80
      acl est_api path_beg /api
      use_backend api if est_api
      default_backend couleurs
  backend couleurs            # vers qui on envoie
      balance roundrobin
      option httpchk GET /
      server red  red:8080  check
      server blue blue:8080 check
  ```

  ### Algorithmes de répartition

  | `balance` | Principe |
  |---|---|
  | `roundrobin` | chacun son tour (pondérable avec `weight`) |
  | `leastconn` | le serveur qui a le moins de connexions (requêtes longues) |
  | `source` | hachage de l'IP client : toujours le même serveur |
  | `uri` | hachage de l'URI (caches) |

  ### Santé et persistance

  - `check` active la surveillance d'un serveur ; `option httpchk` en fait un test HTTP plutôt qu'une simple
    connexion TCP. `inter`, `fall` et `rise` règlent la fréquence et les seuils.
  - La **persistance** (*stickiness*) renvoie un client vers le même serveur : par cookie (`cookie SERVERID
    insert`), par IP (`balance source`) ou par *stick-table*.

  ### Mode TCP ou HTTP

  En `mode tcp` (couche 4), HAProxy relaie des octets : bases de données, TLS de bout en bout. En `mode
  http` (couche 7), il comprend les requêtes : ACL sur le chemin ou les en-têtes, réécriture, cookies.

  ### Mémo

  ```bash
  haproxy -c -f haproxy.cfg                                   # valider
  haproxy -D -f haproxy.cfg -p /run/haproxy.pid               # démarrer
  haproxy -D -f haproxy.cfg -p /run/haproxy.pid -sf $(cat /run/haproxy.pid)   # recharger
  echo "show stat" | socat stdio /run/haproxy/admin.sock
  echo "disable server couleurs/blue" | socat stdio /run/haproxy/admin.sock
  curl -x http://squid:3128 -I http://site1/                  # via le proxy sortant
  ```

  ### Pièges courants

  - Oublier les `timeout` : HAProxy avertit, et des connexions peuvent rester ouvertes indéfiniment.
  - Un serveur sans `check` reste dans la rotation même s'il est en panne.
  - L'ordre des `use_backend` : le premier qui correspond gagne.
  - Le fichier PEM pour TLS doit contenir le certificat **et** la clé.
  - Un health check sur `/` qui renvoie une redirection 301 peut être considéré comme valide… ou non selon
    la configuration : vérifie avec `http-check expect status 200`.

  ### Bonnes pratiques

  Valider avant chaque rechargement, rechargements sans coupure (`-sf`), page de stats protégée, journaux
  HTTP détaillés, deux HAProxy en haute disponibilité (VRRP avec keepalived) pour ne pas créer de point
  unique de défaillance.
docs:
  - title: Documentation HAProxy
    url: https://docs.haproxy.org/
  - title: Blog et guides HAProxy
    url: https://www.haproxy.com/blog
  - title: Documentation Squid
    url: https://wiki.squid-cache.org/
exercises:
  - id: round-robin
    title: Répartition de charge
    description: |
      Crée un `frontend` qui écoute sur le port **80** et envoie le trafic vers un `backend` `couleurs`
      contenant `red:8080` et `blue:8080` en **roundrobin**. Démarre HAProxy : en rafraîchissant
      http://localhost:8090, la couleur doit alterner.
    cours: |
      Une configuration HAProxy relie un **frontend** (ce qui écoute : `bind *:80`) à un ou plusieurs
      **backends** (les serveurs réels). `default_backend` indique où envoyer le trafic qui ne correspond à
      aucune règle particulière.

      Dans le backend, `balance roundrobin` répartit les requêtes à tour de rôle et chaque ligne
      `server nom adresse:port` déclare un serveur. Le nom est libre ; il apparaît dans les statistiques et les
      commandes d'administration.

      Pense au mode (`mode http` dans `defaults` ou dans les sections) et aux `timeout`. Valide toujours avec
      `haproxy -c -f haproxy.cfg` avant de démarrer : le message d'erreur indique la ligne fautive.
    checks:
      - desc: La configuration est valide
        run: haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
      - desc: HAProxy tourne
        run: test -f /run/haproxy.pid && kill -0 "$(cat /run/haproxy.pid)"
      - desc: Les deux backends répondent à tour de rôle
        run: for i in 1 2 3 4; do curl -fsS http://localhost/ 2>/dev/null || wget -qO- http://localhost/; done | grep -o 'red\|blue' | sort -u | wc -l | grep -qx 2
  - id: health
    title: Vérifications de santé
    description: |
      Active les **health checks** (`check`) sur les serveurs du backend `couleurs`, avec une vérification
      HTTP (`option httpchk GET /`). Recharge HAProxy.
    cours: |
      Sans surveillance, HAProxy continue d'envoyer du trafic à un serveur en panne. Le mot-clé `check` sur une
      ligne `server` active des **vérifications périodiques** ; par défaut, une simple connexion TCP.

      `option httpchk GET /` (dans le backend) transforme le test en requête HTTP : un code 2xx ou 3xx signifie
      « en bonne santé ». Paramètres utiles : `inter 2s` (intervalle), `fall 3` (échecs avant de retirer le
      serveur), `rise 2` (succès avant de le réintégrer).

      L'état de chaque serveur (`UP`, `DOWN`) apparaît dans les journaux et la page de statistiques. Teste en
      arrêtant un backend : HAProxy doit le retirer de la rotation.
    checks:
      - desc: option httpchk dans la configuration
        run: grep -Eq '^\s*option\s+httpchk' /usr/local/etc/haproxy/haproxy.cfg
      - desc: Les serveurs ont le mot-clé check
        run: test "$(grep -Ec '^\s*server\s+.*(red|blue):8080.*\scheck' /usr/local/etc/haproxy/haproxy.cfg)" -ge 2
  - id: acl
    title: Routage par chemin
    description: |
      Avec des **ACL**, envoie `/site1` vers le backend `site1` (`site1:80`) et `/site2` vers `site2`
      (`site2:80`), le reste allant toujours vers `couleurs`. Pense à retirer le préfixe du chemin
      (`http-request replace-path /site[12](.*) /\1`) ou à servir `/` côté backend.
    cours: |
      Une **ACL** est une condition nommée, évaluée sur la requête : `acl est_site1 path_beg /site1`. Les
      critères courants : `path_beg` (début du chemin), `path`, `hdr(host)`, `src` (IP du client),
      `method`. `use_backend nom if condition` route la requête quand la condition est vraie ; plusieurs ACL
      se combinent (espace = ET, `||` = OU, `!` = NON).

      Le backend reçoit le chemin tel quel : `/site1/page`. Si le serveur ne connaît que `/page`, il faut
      réécrire le chemin avant de le transmettre (`http-request replace-path` avec une expression régulière, dans
      le backend concerné).

      Les règles `use_backend` sont évaluées dans l'ordre ; `default_backend` sert en dernier recours.
    checks:
      - desc: /site1 renvoie le site 1
        run: (curl -fsS http://localhost/site1 2>/dev/null || wget -qO- http://localhost/site1) | grep -q "Site 1"
      - desc: /site2 renvoie le site 2
        run: (curl -fsS http://localhost/site2 2>/dev/null || wget -qO- http://localhost/site2) | grep -q "Site 2"
  - id: stats
    title: Page de statistiques
    description: |
      Expose la page de statistiques sur le port **8404** à l'adresse `/stats` (`stats enable`,
      `stats uri /stats`), protégée par l'utilisateur `admin` / `tdm`.
    cours: |
      HAProxy fournit une **page de statistiques** HTML : état de chaque serveur, sessions, octets, erreurs,
      temps de réponse. C'est le premier outil de diagnostic d'un répartiteur.

      On la sert généralement sur un frontend dédié (`frontend stats` avec `bind *:8404`), en `mode http`, avec
      les directives `stats enable`, `stats uri /stats`, `stats refresh 10s` et `stats auth utilisateur:mdp`
      pour la protéger. `stats admin if TRUE` permettrait même d'agir sur les serveurs depuis la page.

      La même information existe au format CSV (`/stats;csv`), pratique pour les scripts et pour un exporter
      Prometheus (HAProxy intègre aussi un point `/metrics`).
    checks:
      - desc: /stats est protégé par mot de passe
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8404/stats)" = 401
      - desc: admin/tdm donne accès aux statistiques
        run: curl -fsS -u admin:tdm http://localhost:8404/stats | grep -qi "statistics report"
  - id: squid
    title: Proxy sortant Squid
    description: |
      Vérifie depuis haproxy que le proxy Squid fonctionne :
      `curl -x http://squid:3128 -I http://site1/`. Ensuite, écris dans `/root/squid.txt` le
      **code HTTP** obtenu (juste le nombre).
    cours: |
      Un **proxy sortant** (*forward proxy*) relaie les requêtes des clients vers l'extérieur : contrôle
      d'accès, filtrage, cache, journalisation centralisée. C'est l'inverse d'un reverse proxy, qui se place
      devant des serveurs.

      Le client doit être configuré pour l'utiliser : variable `http_proxy`, réglage du navigateur, ou option
      `-x` de curl. Le port par défaut de Squid est **3128**.

      `curl -I` affiche les en-têtes de réponse : la première ligne contient le code HTTP. Les en-têtes `Via` et
      `X-Cache` ajoutés par Squid confirment que la requête est passée par lui. Pour ne garder que le code dans
      un fichier, `curl -s -o /dev/null -w '%{http_code}'` est plus fiable que de découper la sortie.
    checks:
      - desc: Squid relaie bien vers site1
        run: curl -fsS -x http://squid:3128 http://site1/ | grep -q "Site 1"
      - desc: Le code noté est correct
        run: test "$(tr -d '[:space:]' < /root/squid.txt)" = "$(curl -s -o /dev/null -w '%{http_code}' -x http://squid:3128 http://site1/)"
  - id: persistance
    title: Persistance de session par cookie
    description: |
      Certaines applications gardent la session en mémoire : un utilisateur doit toujours retomber sur le
      **même** serveur. Active la persistance par cookie sur le backend `couleurs` :
      HAProxy insère un cookie `SERVERID` qui désigne le serveur (`cookie SERVERID insert indirect nocache`,
      et `cookie red` / `cookie blue` sur chaque ligne `server`).

      Teste avec `curl -c /tmp/c -b /tmp/c http://localhost/` plusieurs fois : la couleur ne change plus.
    hint: "Dans le backend : cookie SERVERID insert indirect nocache ; server red red:8080 check cookie red"
    cours: |
      Une application qui garde ses sessions en mémoire (panier, connexion) casse si le client change de serveur
      à chaque requête. La **persistance** garantit qu'un client retombe sur le même serveur.

      Avec `cookie SERVERID insert indirect nocache` dans le backend, HAProxy ajoute à la première réponse un
      cookie dont la valeur désigne le serveur choisi (`cookie red` sur la ligne `server`). Aux requêtes
      suivantes, il lit ce cookie et route en conséquence ; `indirect` évite de transmettre le cookie au serveur,
      `nocache` empêche les caches de le partager.

      curl ne garde pas les cookies : `-c fichier` les enregistre, `-b fichier` les renvoie. Si le serveur désigné
      tombe, HAProxy en choisit un autre.
    checks:
      - desc: HAProxy pose le cookie SERVERID
        run: |
          curl -s -o /dev/null -D - http://localhost/ | grep -qi '^set-cookie: SERVERID='
      - desc: Avec le cookie, on reste sur le même serveur
        run: |
          c=$(curl -s -o /dev/null -D - http://localhost/ | sed -n 's/^[Ss]et-[Cc]ookie: *\(SERVERID=[^;]*\).*/\1/p' | tr -d '\r'); test -n "$c" && for i in 1 2 3 4 5 6; do curl -s -b "$c" http://localhost/; done | grep -o 'red\|blue' | sort -u | wc -l | grep -qx 1
  - id: tls
    title: Terminaison TLS
    description: |
      HAProxy doit aussi servir le site en **HTTPS** sur le port 443 (`openssl` est installé) :
      1. Génère un certificat auto-signé pour le CN `tdm.local` et regroupe certificat **et** clé dans
         `/usr/local/etc/haproxy/certs/tdm.pem` (c'est le format attendu par HAProxy).
      2. Ajoute à ton frontend `bind *:443 ssl crt /usr/local/etc/haproxy/certs/tdm.pem` et recharge.

      `curl -k https://localhost/` doit renvoyer une couleur.
    hint: "openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/k.pem -out /tmp/c.pem -days 365 -subj '/CN=tdm.local' ; cat /tmp/c.pem /tmp/k.pem > certs/tdm.pem"
    cours: |
      La **terminaison TLS** consiste à déchiffrer le HTTPS sur le répartiteur : les backends reçoivent du HTTP
      simple, et les certificats sont gérés à un seul endroit.

      `openssl req -x509 -newkey rsa:2048 -nodes -keyout cle.pem -out cert.pem -days 365 -subj "/CN=tdm.local"`
      produit un certificat auto-signé et sa clé. HAProxy attend un **seul fichier PEM** qui contient le
      certificat suivi de la clé privée (une simple concaténation avec `cat`). Le dossier `crt` peut aussi
      contenir plusieurs PEM, choisis selon le nom demandé (SNI).

      Le certificat étant auto-signé, curl le refuse sauf avec `-k`. En production, on utilise une autorité
      reconnue (Let's Encrypt) et on redirige le port 80 vers 443.
    checks:
      - desc: Le site répond en HTTPS
        run: curl -sk https://localhost/ | grep -q 'red\|blue'
      - desc: Le certificat présenté est celui de tdm.local
        run: echo | openssl s_client -connect localhost:443 2>/dev/null | openssl x509 -noout -subject | grep -q 'CN *= *tdm.local'
      - desc: Le HTTP reste disponible
        run: curl -fsS http://localhost/ | grep -q 'red\|blue'
  - id: limitation
    title: Limiter le débit d'une API
    description: |
      Protège le chemin `/api` contre les abus : au-delà de **10 requêtes en 10 secondes** par adresse IP,
      HAProxy doit répondre `429 Too Many Requests`. Le reste du site ne doit **pas** être limité.

      Utilise une *stick-table* : `stick-table type ip size 100k expire 30s store http_req_rate(10s)` dans le
      frontend, `http-request track-sc0 src if { path_beg /api }` puis
      `http-request deny deny_status 429 if { path_beg /api } { sc_http_req_rate(0) gt 10 }`.
    hint: "for i in $(seq 1 15); do curl -s -o /dev/null -w '%{http_code}\\n' http://localhost/api; done"
    cours: |
      Une **stick-table** est une table en mémoire indexée par une clé (souvent l'IP source) qui stocke des
      compteurs : nombre de connexions, débit de requêtes (`http_req_rate(10s)`), erreurs…

      Trois directives travaillent ensemble dans le frontend :
      1. `stick-table` déclare la table, sa taille, sa durée de rétention et ce qu'elle mesure ;
      2. `http-request track-sc0 src` fait suivre la requête par le compteur 0 ; une condition `if` limite le
         suivi à certains chemins ;
      3. `http-request deny deny_status 429 if ...` refuse quand `sc_http_req_rate(0)` dépasse le seuil.

      Le code **429 Too Many Requests** est le code standard. Pour tester, enchaîne une quinzaine de requêtes
      rapides dans une boucle et observe les codes.
    checks:
      - desc: Une rafale sur /api finit en 429 (après une première réponse normale)
        run: |
          sleep 11; r=$(for i in $(seq 1 25); do curl -s -o /dev/null -w '%{http_code}\n' http://localhost/api; done); echo "$r" | head -1 | grep -qv 429 && echo "$r" | grep -q 429
        timeout: 90
      - desc: Le reste du site n'est pas limité
        run: for i in $(seq 1 15); do curl -fsS -o /dev/null http://localhost/ || exit 1; done
  - id: runtime
    title: Maintenance à chaud avec l'API runtime
    description: |
      Ajoute dans la section `global` un socket d'administration :
      `stats socket /run/haproxy/admin.sock mode 600 level admin`, puis redémarre HAProxy.

      Les commandes ci-dessous supposent que tes serveurs s'appellent `red` et `blue` dans le backend
      `couleurs` (`server red red:8080 check`) : renomme-les si besoin.

      Sans recharger la configuration, avec `socat` :
      1. mets `blue` en maintenance (`echo "disable server couleurs/blue" | socat stdio /run/haproxy/admin.sock`)
         et constate que seul `red` répond ;
      2. remets `blue` en service (`enable server`) ;
      3. limite le serveur `red` à **100 connexions simultanées** (`set maxconn server couleurs/red 100`).

      Observe l'état avec `echo "show servers state couleurs" | socat stdio /run/haproxy/admin.sock`.
    hint: "Si le socket n'apparaît pas, HAProxy n'a pas été redémarré : un rechargement avec -sf relit bien la section global"
    cours: |
      L'**API runtime** de HAProxy, exposée par un socket Unix (`stats socket ... level admin` dans `global`),
      permet d'agir à chaud, sans recharger la configuration : mettre un serveur en maintenance avant une mise à
      jour, changer son poids, ses limites, consulter les stick-tables…

      `socat stdio /run/haproxy/admin.sock` envoie une commande et affiche la réponse. Commandes utiles :
      `show stat`, `show servers state`, `disable server backend/serveur`, `enable server`,
      `set server backend/serveur weight 50`, `set maxconn server ...`, `show table`.

      Ces changements vivent en mémoire : ils sont perdus au redémarrage. C'est l'outil des déploiements
      progressifs (vider un serveur, le mettre à jour, le réintégrer).
    checks:
      - desc: Le socket d'administration existe
        run: test -S /run/haproxy/admin.sock && echo "show info" | socat stdio /run/haproxy/admin.sock | grep -q '^Name. HAProxy'
      - desc: red est limité à 100 connexions
        run: |
          echo "show stat" | socat stdio /run/haproxy/admin.sock | awk -F, '$1=="couleurs" && $2=="red" {print $7}' | grep -qx 100
      - desc: blue est de nouveau en service
        run: |
          echo "show servers state couleurs" | socat stdio /run/haproxy/admin.sock | awk '$4=="blue" && $6==2 && $7==0' | grep -q blue
  - id: hp-entetes
    title: En-têtes de proxy et de diagnostic
    description: |
      Les backends ne voient que l'adresse de HAProxy. Corrige cela et facilite le diagnostic :
      1. transmets l'adresse du client dans l'en-tête `X-Forwarded-For` (`option forwardfor`) pour le trafic HTTP ;
      2. ajoute à chaque réponse du backend `couleurs` l'en-tête **`X-Servi-Par`** contenant le **nom du serveur**
         qui a répondu (`red` ou `blue`).

      Recharge HAProxy, puis observe : `curl -sI http://localhost/` plusieurs fois.
    hint: "option forwardfor dans defaults ou dans le backend ; http-response set-header X-Servi-Par %s dans le backend couleurs"
    cours: |
      Derrière un reverse proxy, l'application voit toutes les connexions venir de l'adresse du proxy. Les
      en-têtes de proxy rétablissent l'information :
      - `X-Forwarded-For` : l'adresse du client (ajoutée par `option forwardfor`), complétée à chaque proxy
        traversé ;
      - `X-Forwarded-Proto` : `http` ou `https`, à poser soi-même (`http-request set-header`) quand HAProxy
        termine le TLS ;
      - l'en-tête standard `Forwarded` (RFC 7239) regroupe ces informations.

      `http-request` agit sur la requête avant de l'envoyer au backend, `http-response` sur la réponse avant de
      la renvoyer au client : `set-header`, `add-header`, `del-header`, `replace-header`… Les valeurs peuvent
      utiliser le format de journalisation de HAProxy : `%s` est le nom du serveur, `%b` celui du backend,
      `%ci` l'IP du client.

      Un en-tête de diagnostic est précieux pour savoir quel serveur a répondu ; en production, on évite d'y
      exposer des noms internes.
    checks:
      - desc: option forwardfor est active
        run: grep -Eq '^\s*option\s+forwardfor' /usr/local/etc/haproxy/haproxy.cfg && haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg >/dev/null
      - desc: Les réponses portent X-Servi-Par avec red et blue
        run: for i in 1 2 3 4; do curl -s -o /dev/null -D - http://localhost/; done | tr -d '\r' | grep -i '^x-servi-par:' | grep -Eio 'red|blue' | sort -u | wc -l | grep -qx 2
  - id: hp-maintenance
    title: Page de maintenance personnalisée
    description: |
      Quand un backend n'a plus aucun serveur disponible, HAProxy renvoie une page 503 austère. Personnalise-la :
      1. crée `/usr/local/etc/haproxy/errors/503.http` : une **réponse HTTP complète** (ligne de statut
         `HTTP/1.0 503 Service Unavailable`, en-têtes, ligne vide, corps) dont le corps contient
         `Maintenance en cours` ;
      2. déclare un backend `maintenance` **sans aucun serveur**, qui utilise ce fichier (`errorfile 503 ...`) ;
      3. envoie le chemin `/maintenance` vers ce backend.

      `curl -i http://localhost/maintenance` doit renvoyer le code `503` et ta page.
    hint: "printf 'HTTP/1.0 503 Service Unavailable\\r\\nContent-Type: text/html\\r\\nCache-Control: no-cache\\r\\nConnection: close\\r\\n\\r\\n<h1>Maintenance en cours</h1>\\n' > errors/503.http"
    cours: |
      `errorfile CODE fichier` remplace la page d'erreur que HAProxy génère lui-même (400, 403, 408, 500, 502,
      503, 504). Le fichier n'est pas une simple page HTML : c'est une **réponse HTTP brute**, envoyée telle
      quelle, avec la ligne de statut, les en-têtes, une ligne vide (`\r\n\r\n`) puis le corps. Il est chargé au
      démarrage : sa taille est limitée et il faut recharger HAProxy après une modification.

      Un backend sans serveur (ou dont tous les serveurs sont `DOWN` ou en maintenance) répond **503**. C'est ce
      qui permet une page de maintenance propre pendant une intervention : on met les serveurs en maintenance
      avec l'API runtime, et les clients voient un message clair au lieu d'une erreur technique.

      `errorfile` se déclare dans `defaults`, `frontend` ou `backend` ; `http-error status 503 content-type
      text/html file ...` est une syntaxe plus récente.
    checks:
      - desc: Le fichier d'erreur est une réponse HTTP 503
        run: head -1 /usr/local/etc/haproxy/errors/503.http | grep -q '^HTTP/1\.[01] 503' && grep -q 'Maintenance en cours' /usr/local/etc/haproxy/errors/503.http
      - desc: /maintenance renvoie 503 et la page personnalisée
        run: test "$(curl -s -o /tmp/m -w '%{http_code}' http://localhost/maintenance)" = 503 && grep -q 'Maintenance en cours' /tmp/m
      - desc: Le reste du site fonctionne toujours
        run: curl -fsS http://localhost/ | grep -q 'red\|blue'
