# Répartiteur HAProxy + backends, comme dans le lab Vagrant `haproxy-squid` de la formation.
services:
  haproxy:
    build: ./lb
    hostname: haproxy
    ports:
      - "8090:80"
      - "8404:8404"
  red:
    build:
      context: ./couleur
      args: {COULEUR: red}
  blue:
    build:
      context: ./couleur
      args: {COULEUR: blue}
  site1:
    build: ./site1
  site2:
    build: ./site2
  squid:
    image: ubuntu/squid:6.6-24.04_edge
    hostname: squid
