title: Cluster Docker Swarm
level: avance
order: 1
tags: [docker, swarm, orchestration, secrets]
summary: Cluster, services répliqués et globaux, stacks, secrets, rollback, placement et maintenance.
compose: docker-compose.yml
service: manager
shell: sh
workdir: /root
description: |
  Trois hôtes Docker : `manager`, `worker1` et `worker2` (équivalent conteneur des labs Vagrant
  `docker-swarm` et `docker-ee` de ta formation). Ton terminal est sur **manager**.

  Les workers sont pilotables à distance : `docker -H tcp://worker1:2375 <commande>`.

  Le parcours : former le cluster, services répliqués, mise à l'échelle, stacks, services globaux,
  secrets et réseau overlay, retour arrière automatique, placement par étiquettes et maintenance d'un nœud.
cours: |
  ## Docker Swarm : orchestrer avec les outils Docker

  **Swarm** est l'orchestrateur intégré au moteur Docker. Plus simple que Kubernetes, il reprend les mêmes
  idées : un cluster de nœuds, des services décrits par un état désiré, des réplicas répartis, des mises à
  jour progressives, des secrets et un réseau qui s'étend sur tous les nœuds. Il se pilote avec les commandes
  Docker habituelles et le format Compose.

  ### Architecture

  ```
           ┌──────────── managers (Raft) ────────────┐
           │ manager : API, planification, état      │  nombre impair : 1, 3 ou 5
           └───────────┬──────────────┬──────────────┘
                 TLS mutuel (2377)    │
           ┌───────────▼──┐     ┌─────▼────────┐
           │ worker1      │     │ worker2      │   exécutent les tâches
           │ web.1 web.3  │     │ web.2 agent  │
           └──────────────┘     └──────────────┘
                 réseau overlay (VXLAN, port 4789/udp) + routing mesh
  ```

  - Les **managers** maintiennent l'état du cluster avec l'algorithme de consensus **Raft** : avec 3
    managers, le cluster tolère la perte d'un seul (il faut une majorité, le *quorum*).
  - Les **workers** exécutent les tâches.
  - Un **service** décrit l'état désiré ; il est découpé en **tâches**, chacune correspondant à un conteneur
    placé sur un nœud.

  ### Modes et réseau

  - Mode **répliqué** : N tâches réparties. Mode **global** : une tâche par nœud (agents de supervision,
    collecteurs de logs).
  - Le **routing mesh** publie le port d'un service sur **tous** les nœuds : une requête reçue par n'importe
    quel nœud est routée vers une tâche saine.
  - Un réseau **overlay** relie les conteneurs de nœuds différents ; chaque service y a un nom DNS et une IP
    virtuelle répartie.

  ### Mémo

  ```bash
  docker swarm init ; docker swarm join-token -q worker
  docker node ls ; docker node update --availability drain|active NOEUD
  docker node update --label-add zone=a NOEUD
  docker service create --name web --replicas 3 -p 8080:80 nginx:alpine
  docker service ls ; docker service ps web ; docker service logs web
  docker service scale web=5
  docker service update --image nginx:1.27-alpine --update-parallelism 1 --update-delay 5s web
  docker service rollback web
  docker stack deploy -c stack.yml demo ; docker stack services demo
  printf 'S3cret' | docker secret create db_password -
  ```

  ### Stack : Compose en production

  ```yaml
  services:
    web:
      image: nginx:1.27-alpine
      ports: ["8080:80"]
      deploy:
        replicas: 3
        placement:
          constraints: [node.role == worker]
        update_config: { parallelism: 1, failure_action: rollback }
        resources:
          limits: { memory: 128M }
      secrets: [db_password]
  secrets:
    db_password:
      external: true
  ```

  Dans une stack, la clé `build` est ignorée : les images doivent exister dans un registre accessible à
  tous les nœuds.

  ### Pièges courants

  - Un seul manager : sa perte rend le cluster ingérable (les conteneurs continuent de tourner).
  - Un nombre pair de managers n'améliore pas la tolérance aux pannes.
  - Une image locale à un seul nœud : les tâches placées ailleurs échouent.
  - Oublier les ports à ouvrir entre nœuds : 2377/tcp, 7946/tcp+udp, 4789/udp.
  - Une contrainte de placement impossible laisse les tâches en `Pending`.

  ### Bonnes pratiques

  Trois managers dédiés, des images dans un registre et taguées précisément, des mises à jour avec retour
  arrière automatique, des healthchecks, des secrets Swarm plutôt que des variables d'environnement, et des
  limites de ressources sur chaque service.
docs:
  - title: Docker Swarm, vue d'ensemble
    url: https://docs.docker.com/engine/swarm/
  - title: Tutoriel Swarm
    url: https://docs.docker.com/engine/swarm/swarm-tutorial/
  - title: Déployer une stack
    url: https://docs.docker.com/engine/swarm/stack-deploy/
  - title: Secrets Docker
    url: https://docs.docker.com/engine/swarm/secrets/
exercises:
  - id: init
    title: Initialiser le cluster
    description: |
      Initialise Swarm sur le manager, puis fais rejoindre **worker1** et **worker2** en tant que workers.
      Récupère le jeton avec `docker swarm join-token -q worker`, puis lance sur chaque worker :
      `docker -H tcp://worker1:2375 swarm join --token <jeton> manager:2377`.
    hint: "docker swarm init --advertise-addr $(hostname -i)"
    cours: |
      `docker swarm init` transforme le moteur Docker en **manager** d'un nouveau cluster : il crée une autorité
      de certification interne (les nœuds communiquent en TLS mutuel) et les jetons d'adhésion.

      Il existe deux jetons : l'un pour rejoindre en tant que **worker**, l'autre en tant que **manager**.
      `docker swarm join-token -q worker` affiche le premier. Un nœud rejoint avec
      `docker swarm join --token JETON adresse_manager:2377`.

      Ici, les workers sont pilotés à distance par leur API Docker (`-H tcp://worker1:2375`), sans avoir à ouvrir
      de terminal sur eux. `docker node ls`, sur le manager, liste les membres, leur rôle et leur disponibilité.
    checks:
      - desc: Le manager est en mode Swarm
        run: test "$(docker info -f '{{.Swarm.LocalNodeState}}')" = active
      - desc: Le cluster compte 3 nœuds prêts
        run: test "$(docker node ls -f role=worker --format '{{.Status}}' | grep -c Ready)" -ge 2
  - id: service
    title: Déployer un service répliqué
    description: |
      Déploie le service `web` (image `nginx:alpine`) avec **3 réplicas**, publié sur le port **8080**.
      Observe la répartition avec `docker service ps web`.
    hint: "docker service create --name web --replicas 3 -p 8080:80 nginx:alpine"
    cours: |
      Un **service** est la description d'un état désiré : une image, un nombre de réplicas, des ports, des
      réseaux. Swarm crée les **tâches** correspondantes (un conteneur chacune) et les répartit entre les nœuds
      disponibles. Si une tâche meurt ou qu'un nœud disparaît, il en recrée une ailleurs.

      `docker service create --name ... --replicas N -p HOTE:CONTENEUR image`. Grâce au **routing mesh**, le
      port publié l'est sur **chaque** nœud du cluster, même ceux qui n'hébergent aucune tâche.

      `docker service ls` donne l'état global (`3/3`), `docker service ps web` le détail des tâches et leur nœud.
    checks:
      - desc: Le service web existe avec 3 réplicas demandés
        run: test "$(docker service inspect web -f '{{.Spec.Mode.Replicated.Replicas}}')" = 3
      - desc: Les 3 réplicas tournent
        run: test "$(docker service ps web -f desired-state=running --format '{{.CurrentState}}' | grep -c Running)" = 3
        timeout: 90
      - desc: Le port 8080 est publié
        run: docker service inspect web -f '{{json .Endpoint.Ports}}' | grep -q '"PublishedPort":8080'
  - id: scale-update
    title: Mise à l'échelle et mise à jour progressive
    description: |
      Passe `web` à **5 réplicas**, puis mets-le à jour vers l'image `nginx:1.27-alpine`
      en **rolling update**, un conteneur à la fois (`--update-parallelism 1`).
    cours: |
      `docker service scale web=5` (ou `docker service update --replicas 5`) ajuste le nombre de tâches.

      `docker service update --image ...` lance une **mise à jour progressive** : les tâches sont remplacées par
      lots. `--update-parallelism` fixe la taille du lot, `--update-delay` la pause entre deux lots,
      `--update-order start-first` démarre la nouvelle tâche avant d'arrêter l'ancienne.

      `docker service ps web` montre l'historique : les anciennes tâches apparaissent à l'état `Shutdown`.
      `docker service inspect --pretty web` résume la configuration, dont les paramètres de mise à jour.
    checks:
      - desc: 5 réplicas
        run: test "$(docker service inspect web -f '{{.Spec.Mode.Replicated.Replicas}}')" = 5
      - desc: Image nginx:1.27-alpine
        run: docker service inspect web -f '{{.Spec.TaskTemplate.ContainerSpec.Image}}' | grep -q '^nginx:1.27-alpine'
      - desc: Parallélisme de mise à jour à 1
        run: test "$(docker service inspect web -f '{{.Spec.UpdateConfig.Parallelism}}')" = 1
  - id: stack
    title: Déployer une stack
    description: |
      Écris `/root/stack.yml` (format compose) avec un service `redis` (`redis:alpine`, 1 réplica) et un
      service `viz` (`nginx:alpine`, 2 réplicas, **placés uniquement sur les workers** :
      `deploy.placement.constraints: [node.role == worker]`). Déploie-le sous le nom `demo`.
    hint: "docker stack deploy -c /root/stack.yml demo"
    cours: |
      Une **stack** déploie un ensemble de services décrits dans un fichier au format Compose, avec une section
      `deploy:` propre à Swarm : `replicas`, `placement.constraints`, `update_config`, `resources`,
      `restart_policy`.

      Les **contraintes de placement** limitent les nœuds éligibles : `node.role == worker`,
      `node.hostname == worker1`, `node.labels.zone == a`.

      `docker stack deploy -c fichier.yml NOM` crée ou met à jour la stack ; les services sont préfixés
      (`demo_redis`). `docker stack services` et `docker stack ps` montrent l'état, `docker stack rm` supprime
      tout. Relancer `deploy` après une modification applique la différence.
    checks:
      - desc: La stack demo existe
        run: docker stack ls --format '{{.Name}}' | grep -qx demo
      - desc: viz n'est placé que sur les workers
        run: docker service inspect demo_viz -f '{{json .Spec.TaskTemplate.Placement.Constraints}}' | grep -q 'node.role *== *worker'
      - desc: viz a 2 réplicas
        run: test "$(docker service inspect demo_viz -f '{{.Spec.Mode.Replicated.Replicas}}')" = 2
  - id: global
    title: Service global
    description: |
      Certains services doivent tourner **sur chaque nœud** (agent de supervision, collecteur de logs).
      Déploie le service `agent` en mode **global** (image `alpine:3.20`, commande `sleep infinity`) :
      Swarm place exactement une tâche par nœud, y compris sur ceux qui rejoindraient plus tard le cluster.
    hint: "docker service create --name agent --mode global alpine:3.20 sleep infinity"
    cours: |
      Un service en mode **global** (`--mode global`) exécute exactement **une tâche sur chaque nœud**
      disponible, sans nombre de réplicas. Quand un nœud rejoint le cluster, Swarm y démarre automatiquement une
      tâche ; quand il part, la tâche disparaît.

      C'est le mode adapté aux agents d'infrastructure : collecteur de journaux, node-exporter Prometheus,
      antivirus, agent de sauvegarde. (Kubernetes propose l'équivalent avec les **DaemonSets**.)

      Les contraintes de placement restent utilisables : un service global contraint à `node.role == worker` ne
      tourne que sur les workers. `docker service ps agent` montre une tâche par nœud.
    checks:
      - desc: agent est un service global
        run: docker service inspect agent -f '{{json .Spec.Mode}}' | grep -q '"Global"'
      - desc: Une tâche tourne sur chaque nœud actif
        run: |
          a=$(docker node ls --format '{{.Availability}}' | grep -c Active); test "$a" -ge 2 && test "$(docker service ps agent -f desired-state=running --format '{{.Node}} {{.CurrentState}}' | grep Running | cut -d' ' -f1 | sort -u | wc -l)" -ge "$a"
        timeout: 90
  - id: secrets
    title: Secrets et réseau overlay
    description: |
      1. Crée le secret Swarm `db_password` (par exemple `printf 'S3cret' | docker secret create db_password -`).
      2. Crée un réseau **overlay** `backend` (`--attachable`).
      3. Déploie le service `app` (image `alpine:3.20`) relié à `backend`, qui reçoit le secret, avec la commande :
         `sh -c 'test -s /run/secrets/db_password && echo secret ok; sleep infinity'`.

      Le secret n'apparaît ni dans `docker service inspect` ni dans les variables d'environnement : il est monté
      en mémoire dans `/run/secrets/` du seul conteneur autorisé.
    hint: "docker service create --name app --secret db_password --network backend alpine:3.20 sh -c '…'"
    cours: |
      Un **secret Swarm** est stocké chiffré dans l'état Raft des managers et n'est envoyé qu'aux nœuds qui
      exécutent un service autorisé. Dans le conteneur, il apparaît comme un fichier en mémoire
      (`/run/secrets/<nom>`), jamais dans les variables d'environnement ni dans `docker inspect`.
      `docker secret create nom -` lit la valeur sur l'entrée standard (`printf` évite le retour à la ligne).

      Un réseau **overlay** s'étend sur tous les nœuds : des conteneurs de nœuds différents s'y parlent comme
      sur un même réseau local. `--attachable` autorise aussi des conteneurs lancés avec `docker run`.

      `docker service create --secret db_password --network backend ...` combine les deux.
    checks:
      - desc: Le secret db_password existe
        run: docker secret inspect db_password >/dev/null
      - desc: backend est un réseau overlay
        run: test "$(docker network inspect backend -f '{{.Driver}}')" = overlay
      - desc: app reçoit le secret et est sur backend
        run: |
          docker service inspect app -f '{{range .Spec.TaskTemplate.ContainerSpec.Secrets}}{{.SecretName}} {{end}}' | grep -qw db_password && test "$(docker service inspect app -f '{{range .Spec.TaskTemplate.Networks}}{{.Target}}{{end}}')" = "$(docker network inspect backend -f '{{.Id}}')"
      - desc: Le conteneur lit bien le secret
        run: docker service logs --raw app 2>/dev/null | grep -q 'secret ok'
        timeout: 90
  - id: rollback
    title: Mise à jour ratée et retour arrière automatique
    description: |
      Une mise à jour de `web` vers une image qui n'existe pas doit **revenir automatiquement** à la version
      précédente. Configure le service pour qu'un échec de mise à jour déclenche un retour arrière
      (`--update-failure-action rollback`, surveillance de 10 s avec `--update-monitor 10s`), puis lance la mise à
      jour vers `nginx:version-inexistante-tdm` et observe `docker service ps web`.
    hint: "docker service update --update-failure-action rollback --update-monitor 10s --image nginx:version-inexistante-tdm web"
    cours: |
      Une mise à jour peut échouer : image inexistante, conteneur qui plante au démarrage. Swarm surveille chaque
      lot pendant `--update-monitor` ; si les tâches échouent au-delà de `--update-max-failure-ratio`, il applique
      l'action `--update-failure-action` : `pause` (par défaut), `continue` ou **`rollback`**, qui restaure
      automatiquement la spécification précédente.

      Les réglages du retour arrière lui-même se configurent avec les options `--rollback-*`. On peut aussi
      revenir manuellement en arrière avec `docker service rollback web`.

      Après l'incident, `docker service inspect web` montre la spécification courante (`Spec`) et la précédente
      (`PreviousSpec`), et `UpdateStatus` indique ce qui s'est passé.
    checks:
      - desc: Une tâche a tenté l'image inexistante
        run: docker service ps web --format '{{.Image}}' | grep -q 'version-inexistante-tdm'
      - desc: Le retour arrière s'est terminé
        run: test "$(docker service inspect web -f '{{.UpdateStatus.State}}')" = rollback_completed
        timeout: 90
      - desc: web est revenu sur nginx:1.27-alpine
        run: docker service inspect web -f '{{.Spec.TaskTemplate.ContainerSpec.Image}}' | grep -q '^nginx:1.27-alpine'
  - id: placement
    title: Placement par étiquettes de nœuds
    description: |
      Simule deux zones de disponibilité : pose l'étiquette `zone=a` sur **worker1** et `zone=b` sur **worker2**
      (`docker node update --label-add`). Déploie ensuite le service `zoned` (image `nginx:1.27-alpine`,
      2 réplicas) contraint à la zone `a`.
    hint: "docker service create --name zoned --replicas 2 --constraint node.labels.zone==a nginx:1.27-alpine"
    cours: |
      Les **labels de nœuds** sont des métadonnées libres posées par l'administrateur :
      `docker node update --label-add zone=a worker1`. Ils décrivent le matériel (SSD, GPU), la localisation
      (zone, salle) ou le rôle.

      Un service les utilise dans ses contraintes : `--constraint node.labels.zone==a`. Toutes les tâches sont
      alors placées sur les nœuds correspondants ; si aucun ne convient, elles restent en attente (`Pending`).
      Pour répartir plutôt que restreindre, il existe les préférences : `--placement-pref spread=node.labels.zone`.

      `docker node inspect --pretty worker1` affiche les labels d'un nœud.
    checks:
      - desc: Les étiquettes zone=a et zone=b sont posées
        run: |
          test "$(docker node inspect worker1 -f '{{index .Spec.Labels "zone"}}')" = a && test "$(docker node inspect worker2 -f '{{index .Spec.Labels "zone"}}')" = b
      - desc: Les 2 tâches de zoned tournent sur worker1 uniquement
        run: |
          test "$(docker service ps zoned -f desired-state=running --format '{{.Node}} {{.CurrentState}}' | grep -c '^worker1 Running')" = 2 && test -z "$(docker service ps zoned -f desired-state=running --format '{{.Node}}' | grep -v '^worker1$')"
        timeout: 90
  - id: drain
    title: Maintenance d'un nœud
    description: |
      **worker2** doit partir en maintenance. Passe-le en disponibilité `drain` : Swarm déplace ses tâches vers les
      autres nœuds (observe `docker service ps` avant et après). Le nœud reste membre du cluster.
    hint: "docker node update --availability drain worker2"
    cours: |
      La **disponibilité** d'un nœud contrôle la planification :
      - `active` : il reçoit de nouvelles tâches ;
      - `pause` : il garde ses tâches mais n'en reçoit plus ;
      - `drain` : ses tâches sont arrêtées et replanifiées sur les autres nœuds ; il n'en reçoit plus.

      `docker node update --availability drain worker2` prépare une maintenance (mise à jour du système,
      redémarrage) sans perte de service, à condition que les autres nœuds aient la capacité suffisante.
      Les services globaux ne tournent plus sur un nœud drainé.

      Après la maintenance, on le repasse en `active`. Attention : Swarm ne rééquilibre pas automatiquement les
      tâches existantes vers ce nœud.
    checks:
      - desc: worker2 est en drain
        run: test "$(docker node inspect worker2 -f '{{.Spec.Availability}}')" = drain
      - desc: Plus aucune tâche ne tourne sur worker2
        run: docker node inspect worker2 >/dev/null && test -z "$(docker node ps worker2 -f desired-state=running -q)"
        timeout: 90
      - desc: Les services répliqués ont gardé leurs réplicas
        run: test "$(docker service ps web -f desired-state=running --format '{{.CurrentState}}' | grep -c Running)" = 5
        timeout: 90
