title: zip, enumerate, any, all et compagnie
level: intermediaire
order: 48
tags: [fonctions intégrées, zip, itérateurs]
summary: Remplacer des boucles d'indices par les fonctions intégrées.
description: |
  Écris chaque fonction **sans** utiliser `range(len(...))`, en t'appuyant sur `zip`,
  `enumerate`, `any`, `all`, `sum`, `min`, `max`, `sorted`, `reversed`, `map` ou `filter`.

  1. `associer(noms, ips)` : dictionnaire `{nom: ip}` ; si les deux listes n'ont pas la même
     longueur, lève `ValueError`.
  2. `numeroter(lignes, debut=1)` : liste de chaînes `"<numéro>: <ligne>"`.
  3. `ecarts(valeurs)` : liste des différences entre chaque valeur et la précédente
     (`[3, 5, 4]` → `[2, -1]`).
  4. `tous_joignables(resultats)` : `True` si tous les pings ont réussi ; `resultats` est un
     dictionnaire `{hote: bool}`. Un dictionnaire vide renvoie `True`.
  5. `premier_en_panne(resultats)` : le premier hôte (dans l'ordre du dictionnaire) dont le
     ping a échoué, ou `None`. Utilise `next()` avec une valeur par défaut.
  6. `transposer(lignes)` : transforme une liste de lignes (listes de même longueur) en liste
     de colonnes (listes).
  7. `produit_scalaire(a, b)` : `a[0]*b[0] + a[1]*b[1] + …`.

  ```python
  associer(["web", "db"], ["10.0.0.1", "10.0.0.2"])   # {"web": "10.0.0.1", "db": "10.0.0.2"}
  numeroter(["a", "b"])                               # ["1: a", "2: b"]
  premier_en_panne({"a": True, "b": False, "c": False})   # "b"
  transposer([[1, 2, 3], [4, 5, 6]])                  # [[1, 4], [2, 5], [3, 6]]
  ```
