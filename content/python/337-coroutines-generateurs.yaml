title: Coroutines à base de générateurs
level: expert
order: 37
tags: [générateurs, coroutines, send, décorateurs]
summary: Piloter des générateurs avec send, throw et close pour construire des pipelines poussés.
description: |
  Les générateurs ne font pas que produire des valeurs : `send`, `throw` et `close` permettent
  de leur en **envoyer**.

  1. `amorcer(fonction_generatrice)` : décorateur qui renvoie une fonction créant le
     générateur **et** l'avançant jusqu'à son premier `yield` (inutile alors d'appeler
     `next` avant le premier `send`). Il conserve le nom de la fonction (`functools.wraps`).
  2. `surveillance(seuil)` (décorée par `@amorcer`) reçoit des mesures par `send` et répond :
     - `"ALERTE <mesure>"` si la mesure dépasse strictement `seuil`, sinon `None` ;
     - si on lui injecte une `ValueError` avec `throw`, elle remet ses compteurs à zéro et
       répond `"RAZ"` ; toute autre exception se propage ;
     - si on lui envoie `None`, elle se termine en **renvoyant** (`return`) le bilan
       `{"mesures": n, "alertes": k}` depuis la dernière remise à zéro (l'appelant le récupère
       dans `StopIteration.value`).
  3. Un pipeline **poussé** : chaque étape est une coroutine amorcée qui reçoit des éléments et
     les transmet à sa `cible` ; quand on la ferme (`close`), elle ferme sa cible à son tour.
     - `filtre(predicat, cible)` ne transmet que les éléments qui satisfont `predicat` ;
     - `transforme(fonction, cible)` transmet `fonction(element)` ;
     - `collecte(liste)` ajoute chaque élément reçu à `liste` et, à sa fermeture, y ajoute la
       chaîne `"FIN"` ;
     - `diffuser(iterable, cible)` (fonction ordinaire) envoie tous les éléments puis ferme la
       cible.

  ```python
  s = surveillance(80)
  s.send(75)        # None
  s.send(91.5)      # "ALERTE 91.5"
  sortie = []
  diffuser(range(10), filtre(lambda x: x % 2, transforme(lambda x: x * 10, collecte(sortie))))
  sortie            # [10, 30, 50, 70, 90, "FIN"]
  ```
starter: |
  import functools


  def amorcer(fonction_generatrice):
      pass


  def surveillance(seuil):
      pass


  def filtre(predicat, cible):
      pass


  def transforme(fonction, cible):
      pass


  def collecte(liste):
      pass


  def diffuser(iterable, cible):
