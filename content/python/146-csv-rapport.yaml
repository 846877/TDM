title: Rapport CSV avec le module csv
level: intermediaire
order: 46
tags: [csv, fichiers, dictionnaires, io]
summary: Lire un export CSV, agréger par catégorie et écrire un rapport CSV.
description: |
  Un export d'inventaire au format CSV (séparateur `;`, comme dans les tableurs français)
  ressemble à ceci :

  ```
  machine;site;type;ram_go
  pc-001;Lyon;poste;16
  srv-db;Paris;serveur;128
  "pc-002; compta";Lyon;poste;8
  ```

  Utilise le module `csv` (les valeurs entre guillemets peuvent contenir le séparateur).

  1. `lire(texte)` renvoie la liste des lignes sous forme de dictionnaires (`csv.DictReader`
     sur un `io.StringIO`), avec `ram_go` converti en `int`.
  2. `ram_par_site(lignes)` renvoie un dictionnaire `{site: total de RAM}`.
  3. `compter(lignes, colonne)` renvoie un dictionnaire `{valeur: nombre de lignes}` pour la
     colonne donnée.
  4. `rapport(lignes)` renvoie un **texte CSV** (séparateur `;`, lignes terminées par `\n`)
     avec l'en-tête `site;machines;ram_totale_go;ram_moyenne_go` puis une ligne par site,
     triée par nom de site ; la moyenne est arrondie à 1 décimale.

  ```python
  lignes = lire(TEXTE)
  ram_par_site(lignes)          # {"Lyon": 24, "Paris": 128}
  compter(lignes, "type")       # {"poste": 2, "serveur": 1}
  print(rapport(lignes))
  # site;machines;ram_totale_go;ram_moyenne_go
  # Lyon;2;24;12.0
  # Paris;1;128;128.0
  ```
