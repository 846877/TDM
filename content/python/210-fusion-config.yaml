title: Fusion de configurations
level: avance
order: 10
tags: [dictionnaires, récursivité, json]
summary: Fusionner des dictionnaires imbriqués.
description: |
  Écris `fusionner(base, surcharge)` qui renvoie un **nouveau** dictionnaire :

  - les clés de `surcharge` remplacent celles de `base`,
  - si les deux valeurs sont des dictionnaires, on les fusionne **récursivement**,
  - `base` et `surcharge` ne doivent pas être modifiés.

  ```python
  fusionner({"db": {"host": "localhost", "port": 5432}, "debug": False},
            {"db": {"host": "prod.local"}, "debug": True})
  # {"db": {"host": "prod.local", "port": 5432}, "debug": True}
  ```
starter: |
  def fusionner(base, surcharge):
      pass
tests: |
  import copy

  def test_exemple():
      "Exemple de l'énoncé"
      base = {"db": {"host": "localhost", "port": 5432}, "debug": False}
      sur = {"db": {"host": "prod.local"}, "debug": True}
      assert solution.fusionner(base, sur) == {"db": {"host": "prod.local", "port": 5432}, "debug": True}

  def test_profond():
      "Fusion sur 3 niveaux"
      assert solution.fusionner({"a": {"b": {"c": 1, "d": 2}}}, {"a": {"b": {"d": 3}}}) == {"a": {"b": {"c": 1, "d": 3}}}

  def test_immuable():
      "Les entrées ne sont pas modifiées"
      base = {"a": {"x": 1}}
      sur = {"a": {"y": 2}}
      copie_base, copie_sur = copy.deepcopy(base), copy.deepcopy(sur)
      resultat = solution.fusionner(base, sur)
      resultat["a"]["z"] = 3
      assert base == copie_base and sur == copie_sur

  def test_remplacement_type():
      "Un dict peut être remplacé par une valeur simple"
      assert solution.fusionner({"a": {"x": 1}}, {"a": None}) == {"a": None}
solution: |
  import copy


  def fusionner(base, surcharge):
      resultat = copy.deepcopy(base)
      for cle, valeur in surcharge.items():
          if isinstance(valeur, dict) and isinstance(resultat.get(cle), dict):
              resultat[cle] = fusionner(resultat[cle], valeur)
          else:
              resultat[cle] = copy.deepcopy(valeur)
      return resultat
cours: |
  ## Le besoin

  Les applications chargent souvent une configuration **par défaut**, puis la surchargent
  avec un fichier spécifique à l'environnement (dev, prod), puis avec des variables
  d'environnement. Docker Compose, Ansible ou Helm fusionnent ainsi des fichiers YAML.

  ## Fusion superficielle

  ```python
  base = {"a": 1, "b": {"x": 1}}
  surcharge = {"b": {"y": 2}}
  {**base, **surcharge}        # {"a": 1, "b": {"y": 2}}  : "x" a disparu
  base | surcharge             # même résultat (Python 3.9+)
  ```

  Le déballage `**` et l'opérateur `|` remplacent la valeur de `"b"` entière : ils ne
  descendent pas dans les sous-dictionnaires. Pour une fusion **profonde**, il faut de la
  récursion.

  ## La récursion sur des dictionnaires

  Pour chaque clé de la surcharge :

  - si la clé existe des deux côtés **et** que les deux valeurs sont des dictionnaires, on
    fusionne récursivement ces deux sous-dictionnaires ;
  - sinon, la valeur de la surcharge gagne.

  Le cas de base est implicite : quand les valeurs ne sont pas des dictionnaires, on ne
  descend plus.

  ## Ne pas modifier les entrées : copies et aliasing

  `dict(base)` ou `base.copy()` font une copie **superficielle** : les sous-dictionnaires
  sont partagés entre l'original et la copie. Modifier `copie["b"]["x"]` modifie aussi
  `base["b"]["x"]`. Pour garantir l'indépendance, soit on reconstruit chaque niveau, soit on
  utilise `copy.deepcopy`, qui copie récursivement toute la structure.

  Un test classique : fusionner, puis modifier le résultat, et vérifier que `base` et
  `surcharge` n'ont pas bougé. Le résultat ne doit partager **aucun** sous-dictionnaire
  mutable avec les entrées.

  ## Alternative : `ChainMap`

  `collections.ChainMap(surcharge, base)` cherche une clé dans plusieurs dictionnaires
  successivement sans rien copier. Pratique pour des couches de configuration, mais elle
  aussi reste superficielle.
