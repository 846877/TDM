title: Parcours de graphes BFS et DFS
level: avance
order: 23
tags: [graphes, algorithmes, deque, piles]
summary: Largeur, profondeur, plus court chemin et composantes connexes.
description: |
  Un graphe est représenté par un dictionnaire de listes d'adjacence :
  `{"A": ["B", "C"], "B": ["D"], "C": [], "D": []}`. Tous les sommets sont des clés du dictionnaire,
  et les voisins sont toujours examinés **dans l'ordre de la liste**.

  1. `bfs(graphe, depart)` : liste des sommets dans l'ordre d'un **parcours en largeur**
     (utilise `collections.deque`).
  2. `dfs(graphe, depart)` : liste des sommets dans l'ordre d'un **parcours en profondeur** préfixe —
     le même ordre que la version récursive classique. **Sans récursion** : la moulinette utilise une
     chaîne de 20 000 sommets, bien au-delà de la limite de récursion de Python. Utilise une pile
     explicite (attention à l'ordre dans lequel tu empiles les voisins).
  3. `plus_court_chemin(graphe, a, b)` : liste des sommets d'un plus court chemin (en nombre d'arcs)
     de `a` à `b`, ou `None` s'il n'y en a pas. Si plusieurs chemins sont aussi courts, renvoie celui
     que trouve le BFS (premier découvert). `plus_court_chemin(g, a, a) == [a]`.
  4. `composantes(graphe)` : nombre de composantes connexes d'un graphe **non orienté**
     (chaque arête apparaît dans les deux sens).

  ```python
  g = {"A": ["B", "C"], "B": ["D"], "C": ["D"], "D": []}
  bfs(g, "A")                       # ["A", "B", "C", "D"]
  dfs(g, "A")                       # ["A", "B", "D", "C"]
  plus_court_chemin(g, "A", "D")    # ["A", "B", "D"]
  ```
