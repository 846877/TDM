tests: |
  G = {"A": ["B", "C"], "B": ["D"], "C": ["D"], "D": []}
  ARBRE = {1: [2, 3], 2: [4, 5], 3: [6], 4: [], 5: [], 6: []}
  CYCLE = {"a": ["b"], "b": ["c"], "c": ["a", "d"], "d": []}

  def test_bfs():
      "Parcours en largeur"
      assert solution.bfs(G, "A") == ["A", "B", "C", "D"]
      assert solution.bfs(ARBRE, 1) == [1, 2, 3, 4, 5, 6]
      assert solution.bfs(CYCLE, "b") == ["b", "c", "a", "d"]

  def test_dfs():
      "Parcours en profondeur préfixe"
      assert solution.dfs(G, "A") == ["A", "B", "D", "C"]
      assert solution.dfs(ARBRE, 1) == [1, 2, 4, 5, 3, 6], f"obtenu {solution.dfs(ARBRE, 1)}"
      assert solution.dfs(CYCLE, "a") == ["a", "b", "c", "d"]

  def test_dfs_ordre_recursif():
      "DFS identique à la version récursive"
      g = {0: [1, 2, 3], 1: [3, 2], 2: [0], 3: [2], 4: [0]}
      vus = []
      def rec(s):
          vus.append(s)
          for v in g[s]:
              if v not in vus:
                  rec(v)
      rec(0)
      assert solution.dfs(g, 0) == vus, f"obtenu {solution.dfs(g, 0)}, attendu {vus}"

  def test_longue_chaine():
      "Chaîne de 20 000 sommets (pas de récursion)"
      n = 20_000
      g = {i: [i + 1] for i in range(n)}
      g[n] = []
      assert solution.dfs(g, 0) == list(range(n + 1))
      assert len(solution.bfs(g, 0)) == n + 1

  def test_chemin():
      "Plus court chemin"
      assert solution.plus_court_chemin(G, "A", "D") == ["A", "B", "D"]
      assert solution.plus_court_chemin(CYCLE, "b", "a") == ["b", "c", "a"]
      assert solution.plus_court_chemin(G, "C", "C") == ["C"]

  def test_pas_de_chemin():
      "Aucun chemin"
      assert solution.plus_court_chemin(G, "D", "A") is None

  def test_composantes():
      "Composantes connexes"
      g = {1: [2], 2: [1], 3: [], 4: [5], 5: [4, 6], 6: [5]}
      assert solution.composantes(g) == 3
      assert solution.composantes({}) == 0
      assert solution.composantes({"x": []}) == 1
solution: |
  from collections import deque


  def bfs(graphe, depart):
      vus = {depart}
      ordre = []
      file = deque([depart])
      while file:
          sommet = file.popleft()
          ordre.append(sommet)
          for voisin in graphe[sommet]:
              if voisin not in vus:
                  vus.add(voisin)
                  file.append(voisin)
      return ordre


  def dfs(graphe, depart):
      vus = set()
      ordre = []
      pile = [depart]
      while pile:
          sommet = pile.pop()
          if sommet in vus:
              continue
          vus.add(sommet)
          ordre.append(sommet)
          for voisin in reversed(graphe[sommet]):
              if voisin not in vus:
                  pile.append(voisin)
      return ordre


  def plus_court_chemin(graphe, a, b):
      parents = {a: None}
      file = deque([a])
      while file:
          sommet = file.popleft()
          if sommet == b:
              chemin = []
              while sommet is not None:
                  chemin.append(sommet)
                  sommet = parents[sommet]
              return chemin[::-1]
          for voisin in graphe[sommet]:
              if voisin not in parents:
                  parents[voisin] = sommet
                  file.append(voisin)
      return None


  def composantes(graphe):
      vus = set()
      nombre = 0
      for sommet in graphe:
          if sommet not in vus:
              nombre += 1
              vus.update(bfs(graphe, sommet))
      return nombre
