title: Rendu de monnaie
level: debutant
order: 15
tags: [input, division entière, boucles]
summary: Décomposer une somme en billets et pièces.
mode: stdio
description: |
  Un distributeur doit rendre une somme **entière** en euros avec le moins de billets et de
  pièces possible. Les valeurs disponibles sont : `50, 20, 10, 5, 2, 1`.

  Lis la somme avec `input()` puis affiche, **dans l'ordre décroissant**, une ligne par valeur
  utilisée (les valeurs non utilisées ne sont pas affichées). Pour `127` :

  ```
  2 x 50
  1 x 20
  1 x 5
  1 x 2
  ```

  Si la somme vaut `0`, affiche `Rien à rendre`.

  Astuce : la division entière `//` et le modulo `%`.
starter: |
  somme = int(input())
cases:
  - name: "127 €"
    input: "127\n"
    output: |
      2 x 50
      1 x 20
      1 x 5
      1 x 2
  - name: "88 €"
    input: "88\n"
    output: |
      1 x 50
      1 x 20
      1 x 10
      1 x 5
      1 x 2
      1 x 1
  - name: "4 €"
    input: "4\n"
    output: "2 x 2"
  - name: "Rien à rendre"
    input: "0\n"
    output: "Rien à rendre"
solution: |
  somme = int(input())
  if somme == 0:
      print("Rien à rendre")
  for valeur in (50, 20, 10, 5, 2, 1):
      nombre = somme // valeur
      if nombre > 0:
          print(f"{nombre} x {valeur}")
      somme = somme % valeur
cours: |
  ## Division entière et reste

  ```python
  17 // 5    # 3  : combien de fois 5 entre dans 17
  17 % 5     # 2  : ce qui reste
  divmod(17, 5)   # (3, 2) : les deux d'un coup
  ```

  Exemple concret : convertir 130 minutes en heures et minutes.

  ```python
  heures, minutes = divmod(130, 60)   # 2, 10
  ```

  ## Boucler sur des valeurs prédéfinies

  On range les valeurs dans une liste (ou un tuple) et on la parcourt :

  ```python
  poids = [1000, 100, 10, 1]
  reste = 2345
  for p in poids:
      nombre, reste = divmod(reste, p)
      print(p, nombre)
  ```

  À chaque tour, on prend « autant que possible » de la valeur courante, puis on continue avec
  ce qui reste. L'ordre de la liste (décroissant) est essentiel.

  ## L'algorithme glouton

  Prendre à chaque étape le choix qui paraît le meilleur immédiatement s'appelle un
  algorithme **glouton**. Pour le système euro (50, 20, 10, 5, 2, 1), le glouton donne
  toujours le nombre minimal de pièces. Mais ce n'est pas vrai pour tous les systèmes :
  avec des pièces de 1, 3 et 4, rendre 6 de façon gloutonne donne 4 + 1 + 1 (3 pièces) alors
  que 3 + 3 (2 pièces) est meilleur. Tu verras au niveau avancé la **programmation
  dynamique**, qui résout le cas général.

  ## Afficher sous condition

  Ne pas afficher une ligne se fait avec un simple `if` autour du `print`. Et n'oublie pas le
  cas particulier de la somme nulle : il doit être traité **avant** la boucle (ou après, si
  rien n'a été affiché), avec le message exact demandé.
