tests: |
  CLIGNOTANT = [".....", "..#..", "..#..", "..#..", "....."]
  HORIZONTAL = [".....", ".....", ".###.", ".....", "....."]

  def test_voisins():
      "voisins"
      assert solution.voisins(CLIGNOTANT, 2, 2) == 2
      assert solution.voisins(CLIGNOTANT, 2, 1) == 3
      assert solution.voisins(CLIGNOTANT, 0, 0) == 0
      assert solution.voisins(["##", "##"], 0, 0) == 3, "coin : attention aux bords"
      assert solution.voisins(["###", "###", "###"], 1, 1) == 8

  def test_generation():
      "generation du clignotant"
      r = solution.generation(CLIGNOTANT)
      assert r == HORIZONTAL, "obtenu :\n" + "\n".join(r)
      assert solution.generation(HORIZONTAL) == CLIGNOTANT

  def test_non_modifiee():
      "La grille d'origine n'est pas modifiée"
      g = list(CLIGNOTANT)
      solution.generation(g)
      assert g == CLIGNOTANT

  def test_bloc_stable():
      "Un bloc 2x2 est stable"
      bloc = ["....", ".##.", ".##.", "...."]
      assert solution.generation(bloc) == bloc

  def test_planeur():
      "Le planeur se déplace d'une case en diagonale en 4 générations"
      g = [".#....", "..#...", "###...", "......", "......", "......"]
      att = ["......", "..#...", "...#..", ".###..", "......", "......"]
      r = solution.evoluer(g, 4)
      assert r == att, "obtenu :\n" + "\n".join(r)
      assert solution.evoluer(g, 0) == g

  def test_population():
      "population"
      assert solution.population(CLIGNOTANT) == 3
      assert solution.population(["...", "..."]) == 0
solution: |
  def voisins(grille, ligne, colonne):
      total = 0
      for dl in (-1, 0, 1):
          for dc in (-1, 0, 1):
              if dl == 0 and dc == 0:
                  continue
              l, c = ligne + dl, colonne + dc
              if 0 <= l < len(grille) and 0 <= c < len(grille[0]) and grille[l][c] == "#":
                  total += 1
      return total


  def generation(grille):
      nouvelle = []
      for l, rangee in enumerate(grille):
          cases = []
          for c, case in enumerate(rangee):
              n = voisins(grille, l, c)
              vivante = n == 3 or (case == "#" and n == 2)
              cases.append("#" if vivante else ".")
          nouvelle.append("".join(cases))
      return nouvelle


  def evoluer(grille, n):
      for _ in range(n):
          grille = generation(grille)
      return list(grille)


  def population(grille):
      return sum(rangee.count("#") for rangee in grille)
cours: |
  ## Une grille en Python

  Une grille 2D se représente par une liste de lignes ; chaque ligne est une chaîne (non
  modifiable) ou une liste (modifiable). L'accès à une case se fait en deux temps :
  `grille[ligne][colonne]`.

  ```python
  grille = ["#..", ".#.", "..#"]
  grille[1][1]        # "#"
  len(grille)         # nombre de lignes
  len(grille[0])      # nombre de colonnes
  ```

  ## Parcourir les voisins

  Les 8 voisins d'une case sont obtenus par des décalages `dl` et `dc` dans `{-1, 0, 1}`, en
  excluant `(0, 0)` (la case elle-même) :

  ```python
  for dl in (-1, 0, 1):
      for dc in (-1, 0, 1):
          if (dl, dc) != (0, 0):
              ...
  ```

  ## Le piège des bords

  Avant d'accéder à `grille[l][c]`, il faut vérifier `0 <= l < nb_lignes` et
  `0 <= c < nb_colonnes`. **Attention** : en Python, un indice `-1` ne provoque pas
  d'erreur, il désigne la **dernière** ligne ! Sans test explicite, la grille se comporterait
  comme si ses bords étaient reliés (un tore), ce qui fausserait le calcul.

  ## Mise à jour simultanée

  Toutes les cases évoluent **en même temps** à partir de l'état précédent. Si on modifiait
  la grille pendant qu'on la parcourt, les cases déjà mises à jour fausseraient le compte de
  leurs voisines. On construit donc une **nouvelle** grille à partir de l'ancienne, qui reste
  intacte. Ce principe (double tampon) est universel : simulations, rendu graphique,
  traitement d'images.

  ## Traduire des règles en une condition

  Les règles se résument en une seule expression booléenne : « vivante au tour suivant » =
  exactement 3 voisines, **ou** vivante maintenant avec 2 voisines. Simplifier des règles
  avant de coder évite des `if` imbriqués.

  ## Complexité

  Une génération coûte O(L × C × 8). Pour de très grandes grilles, on ne stocke que les
  cellules vivantes dans un `set` de coordonnées.

  ## Culture

  Avec ces deux règles simples apparaissent des structures stables, des oscillateurs, des
  « planeurs » qui se déplacent, et même des ordinateurs complets : le jeu de la vie est
  Turing-complet.
