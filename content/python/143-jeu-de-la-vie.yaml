title: Le jeu de la vie
level: intermediaire
order: 43
tags: [listes, grilles, matrices, algorithmes]
summary: Manipuler une grille 2D, compter des voisins et faire évoluer un automate.
description: |
  Le jeu de la vie de Conway est un automate cellulaire. La grille est une liste de chaînes
  de même longueur, où `#` est une cellule **vivante** et `.` une cellule **morte**. Les bords
  ne bouclent pas (au-delà de la grille, tout est mort).

  1. `voisins(grille, ligne, colonne)` : nombre de cellules vivantes parmi les **8** voisines
     de la case.
  2. `generation(grille)` : renvoie la grille suivante (nouvelle liste de chaînes) selon les
     règles, appliquées **simultanément** à toutes les cases :
     - une cellule vivante avec 2 ou 3 voisines vivantes survit, sinon elle meurt ;
     - une cellule morte avec exactement 3 voisines vivantes naît.
  3. `evoluer(grille, n)` : la grille après `n` générations.
  4. `population(grille)` : nombre de cellules vivantes.

  ```python
  clignotant = [".....",
                "..#..",
                "..#..",
                "..#..",
                "....."]
  generation(clignotant)
  # [".....",
  #  ".....",
  #  ".###.",
  #  ".....",
  #  "....."]
  ```

  La grille reçue ne doit pas être modifiée.
