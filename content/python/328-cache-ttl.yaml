title: Cache LRU avec expiration
level: expert
order: 28
tags: [cache, structures de données, décorateurs, temps]
summary: Durée de vie des entrées, éviction LRU et décorateur de mémoïsation.
description: |
  Combine deux politiques de cache : une **durée de vie** (TTL, *time to live*) par entrée et une
  éviction **LRU** quand le cache est plein. Comme pour le limiteur de débit, l'heure vient d'une
  **horloge injectée** (fonction sans argument, en secondes).

  **`CacheTTL(capacite, ttl, horloge=time.monotonic)`**

  - `put(cle, valeur, ttl=None)` : ajoute ou remplace une entrée, qui expire `ttl` secondes plus tard
    (le `ttl` du cache par défaut). Une entrée est expirée dès que `horloge() >= instant_d_expiration` ;
  - `get(cle, defaut=None)` : valeur si l'entrée existe et n'a pas expiré (elle devient alors la plus
    **récemment utilisée**), sinon `defaut` ; une entrée expirée rencontrée est supprimée ;
  - `cle in cache` : même test, sans changer l'ordre LRU ;
  - `len(cache)` : nombre d'entrées **non expirées** ;
  - quand on ajoute une **nouvelle** clé alors que le cache est plein, on supprime d'abord les entrées
    expirées ; s'il est toujours plein, on évince la moins récemment utilisée ;
  - `purger()` : supprime les entrées expirées et renvoie leur nombre.

  **`memoiser_ttl(ttl, capacite=128, horloge=time.monotonic)`** : décorateur paramétré qui met en cache
  les résultats d'une fonction (clé : arguments positionnels **et** nommés, ces derniers dans
  n'importe quel ordre) dans un `CacheTTL`. La fonction décorée expose `statistiques`, un dictionnaire
  `{"succes": ..., "echecs": ...}` (nombre d'appels servis par le cache / calculés).
  Attention : une fonction peut légitimement renvoyer `None` !
