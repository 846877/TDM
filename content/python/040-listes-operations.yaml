title: Manipuler une liste
level: debutant
order: 40
tags: [listes, enumerate, méthodes]
summary: Ajouter, retirer, rechercher et compter dans une liste.
description: |
  1. `positions(elements, valeur)` renvoie la liste des **indices** où `valeur` apparaît.
  2. `sans_valeur(elements, valeur)` renvoie une **nouvelle** liste sans aucune occurrence de
     `valeur` (la liste d'origine n'est pas modifiée).
  3. `deuxieme_plus_grand(nombres)` renvoie la deuxième plus grande valeur **distincte**, ou
     `None` s'il n'y en a pas.
  4. `inserer_trie(nombres, x)` insère `x` **dans la liste reçue** (déjà triée) à la bonne
     place pour qu'elle reste triée, et ne renvoie rien. Utilise `liste.insert(indice, x)`.

  ```python
  positions(["ok", "ko", "ok"], "ok")      # [0, 2]
  sans_valeur([1, 2, 1, 3], 1)             # [2, 3]
  deuxieme_plus_grand([4, 9, 9, 2])        # 4
  l = [1, 3, 8]
  inserer_trie(l, 5)                       # l vaut maintenant [1, 3, 5, 8]
  ```

  N'utilise pas `sorted()` ni `.sort()`.
