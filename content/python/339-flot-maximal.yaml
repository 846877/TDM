title: Flot maximal et coupe minimale
level: expert
order: 39
tags: [graphes, algorithmes, réseau, bfs]
summary: Calculer le débit maximal entre deux routeurs avec Edmonds-Karp et trouver les liens critiques.
description: |
  Un réseau est décrit par un dictionnaire `capacites` `{(u, v): capacité}` : le lien orienté
  de `u` vers `v` peut transporter au plus `capacité` (entier ≥ 0, par exemple en Gbit/s).
  Les deux sens d'un même lien peuvent figurer séparément, avec des capacités différentes.

  1. `flot_maximal(capacites, source, puits)` renvoie `(valeur, flots)` : `valeur` est le
     débit maximal de `source` vers `puits` et `flots` un dictionnaire `{(u, v): flux}`
     ne contenant que les arcs de `capacites` de flux **strictement positif**. Les flux doivent
     respecter les capacités et la **conservation** (en chaque nœud autre que la source et le
     puits, ce qui entre égale ce qui sort) ; pour deux arcs opposés, au plus un des deux porte
     du flux. Utilise l'algorithme d'**Edmonds-Karp** (chemins augmentants trouvés en largeur).
     `source == puits` lève `ValueError` ; un puits inaccessible donne `(0, {})`.
  2. `coupe_minimale(capacites, source, puits)` renvoie `(valeur, liens)` : `liens` est la
     liste triée des arcs d'une coupe minimale (les arcs de capacité > 0 qui vont de
     l'ensemble des nœuds encore accessibles depuis la source dans le graphe résiduel vers les
     autres). La somme de leurs capacités vaut le flot maximal : ce sont les liens qui
     limitent le débit.

  ```python
  c = {("s", "a"): 10, ("s", "b"): 5, ("a", "b"): 15, ("a", "t"): 5, ("b", "t"): 10}
  flot_maximal(c, "s", "t")[0]        # 15
  coupe_minimale(c, "s", "t")         # (15, [("s", "a"), ("s", "b")])
  ```
