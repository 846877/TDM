title: Analyser une configuration de routeur
level: expert
order: 33
tags: [parsing, réseau, arbres, sysadmin]
summary: Transformer une configuration indentée façon Cisco IOS en arbre, l'interroger et la comparer.
description: |
  Les équipements réseau exportent leur configuration sous forme de texte **indenté** :

  ```
  hostname R1
  !
  interface GigabitEthernet0/0
   description LAN
   ip address 192.168.1.1 255.255.255.0
  !
  router ospf 1
   network 10.0.0.0 0.0.0.255 area 0
  ```

  1. `analyser(texte)` renvoie l'arbre de la configuration : une liste de nœuds
     `{"ligne": texte_sans_indentation, "enfants": [...]}`. Une ligne est enfant de la ligne
     précédente moins indentée. Les lignes vides et les lignes `!` (seules, indentées ou non)
     sont ignorées. La profondeur est quelconque. Tous les enfants directs d'un même nœud
     doivent avoir **la même** indentation, sinon `ValueError` (avec le numéro de ligne,
     compté à partir de 1, dans le message). Les espaces en fin de ligne sont retirés.
  2. `chercher(arbre, motif)` renvoie les nœuds de **premier niveau** dont la ligne
     correspond à l'expression régulière `motif` depuis le début (`re.match`).
  3. `interfaces(texte)` renvoie `{nom: {"description": ..., "ip": ..., "actif": ...}}` pour
     chaque bloc `interface <nom>` : `description` (texte après `description `, ou `None`),
     `ip` en notation CIDR (`"192.168.1.1/24"`, à partir de `ip address <ip> <masque>`, ou
     `None`), `actif` vaut `False` si le bloc contient la ligne `shutdown`, `True` sinon.
  4. `differences(ancien, nouveau)` compare deux configurations (textes) et renvoie
     `(ajouts, suppressions)` : deux listes triées de **chemins**, un chemin étant les lignes
     depuis la racine jointes par `" > "`. Seuls les nœuds les plus hauts ajoutés ou supprimés
     sont listés (pas leurs descendants).

  ```python
  differences("interface G0\n ip address 10.0.0.1 255.0.0.0\n",
              "interface G0\n ip address 10.0.0.2 255.0.0.0\n shutdown\n")
  # (["interface G0 > ip address 10.0.0.2 255.0.0.0", "interface G0 > shutdown"],
  #  ["interface G0 > ip address 10.0.0.1 255.0.0.0"])
  ```
