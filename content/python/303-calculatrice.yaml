title: Évaluateur d'expressions
level: expert
order: 3
tags: [parsing, récursivité, algorithmes]
summary: Écrire un mini-interpréteur sans eval().
description: |
  Écris `calculer(expression)` qui évalue une expression arithmétique contenant des nombres
  (entiers ou décimaux), `+ - * /`, des parenthèses, des espaces et le **moins unaire** (`-3`, `-(2+1)`).
  Les priorités habituelles s'appliquent.

  ```python
  calculer("2 + 3 * 4")        # 14
  calculer("(2 + 3) * -4")     # -20
  calculer("10 / 4")           # 2.5
  ```

  `eval`, `exec` et `compile` sont **interdits**. Lève `ValueError` pour une expression invalide.
  Indice : un analyseur à descente récursive (expression → terme → facteur).
starter: |
  def calculer(expression):
      pass
tests: |
  import inspect

  def test_priorites():
      "Priorité des opérateurs"
      assert solution.calculer("2 + 3 * 4") == 14
      assert solution.calculer("2 * 3 + 4") == 10

  def test_parentheses():
      "Parenthèses et moins unaire"
      assert solution.calculer("(2 + 3) * -4") == -20
      assert solution.calculer("-(1 + 2) * 2") == -6

  def test_division():
      "Division décimale et associativité à gauche"
      assert solution.calculer("10 / 4") == 2.5
      assert solution.calculer("8 - 3 - 2") == 3
      assert solution.calculer("16 / 4 / 2") == 2

  def test_decimaux():
      "Nombres décimaux"
      assert abs(solution.calculer("1.5 * 2 + .5") - 3.5) < 1e-9

  def test_invalide():
      "Expression invalide"
      for expr in ("2 +", "(1 + 2", "3 $ 4", ""):
          try:
              solution.calculer(expr)
          except ValueError:
              continue
          raise AssertionError(f"{expr!r} aurait dû lever ValueError")

  def test_sans_eval():
      "eval/exec ne sont pas utilisés"
      source = inspect.getsource(solution)
      assert "eval(" not in source and "exec(" not in source and "compile(" not in source
solution: |
  import re


  def calculer(expression):
      jetons = re.findall(r"\d+\.?\d*|\.\d+|[-+*/()]|\S", expression)
      position = 0

      def voir():
          return jetons[position] if position < len(jetons) else None

      def prendre():
          nonlocal position
          jeton = voir()
          if jeton is None:
              raise ValueError("expression incomplète")
          position += 1
          return jeton

      def expr():
          valeur = terme()
          while voir() in ("+", "-"):
              if prendre() == "+":
                  valeur += terme()
              else:
                  valeur -= terme()
          return valeur

      def terme():
          valeur = facteur()
          while voir() in ("*", "/"):
              if prendre() == "*":
                  valeur *= facteur()
              else:
                  valeur /= facteur()
          return valeur

      def facteur():
          jeton = prendre()
          if jeton == "-":
              return -facteur()
          if jeton == "+":
              return facteur()
          if jeton == "(":
              valeur = expr()
              if prendre() != ")":
                  raise ValueError("parenthèse manquante")
              return valeur
          try:
              return float(jeton) if "." in jeton else int(jeton)
          except ValueError:
              raise ValueError(f"jeton invalide : {jeton}") from None

      if not jetons:
          raise ValueError("expression vide")
      resultat = expr()
      if position != len(jetons):
          raise ValueError("jetons en trop")
      return resultat
