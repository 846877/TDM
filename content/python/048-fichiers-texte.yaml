title: Lire et écrire un fichier texte
level: debutant
order: 48
tags: [fichiers, with, open]
summary: Ouvrir un fichier avec with open() pour lire et écrire.
description: |
  Les fonctions reçoivent un **chemin** de fichier (une chaîne).

  1. `ecrire_lignes(chemin, lignes)` écrit chaque élément de la liste `lignes` dans le
     fichier, **une par ligne** (chaque ligne se termine par `\n`). Le fichier est créé ou
     remplacé.
  2. `lire_lignes(chemin)` renvoie la liste des lignes du fichier, **sans** le `\n` final et
     sans les espaces autour, en ignorant les lignes vides.
  3. `ajouter_ligne(chemin, texte)` ajoute une ligne **à la fin** du fichier sans effacer son
     contenu.
  4. `compter(chemin, mot)` renvoie le nombre de lignes qui contiennent `mot`. Si le fichier
     n'existe pas, renvoie `0` (intercepte `FileNotFoundError`).

  ```python
  ecrire_lignes("hotes.txt", ["web01", "db01"])
  ajouter_ligne("hotes.txt", "web02")
  lire_lignes("hotes.txt")        # ["web01", "db01", "web02"]
  compter("hotes.txt", "web")     # 2
  ```

  Ouvre toujours les fichiers avec `with open(..., encoding="utf-8")`.
