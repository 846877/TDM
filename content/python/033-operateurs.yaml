title: Les opérateurs arithmétiques
level: debutant
order: 33
tags: [calculs, opérateurs, tuples]
summary: Maîtriser + - * / // % ** et leurs priorités.
description: |
  1. Écris `calculs(a, b)` qui renvoie un **tuple** de six valeurs, dans cet ordre :
     somme, différence (`a - b`), produit, quotient réel, quotient entier, reste.

     ```python
     calculs(17, 5)   # (22, 12, 85, 3.4, 3, 2)
     ```

     Si `b` vaut `0`, les trois dernières valeurs sont remplacées par `None`
     (la division par zéro est impossible) :

     ```python
     calculs(4, 0)    # (4, 4, 0, None, None, None)
     ```

  2. Écris `prix_ttc(prix_ht, taux_tva)` qui renvoie le prix TTC arrondi à 2 décimales.
     Le taux est donné en pourcentage : `prix_ttc(100, 20)` vaut `120.0`.

  3. Écris `volume_sphere(rayon)` qui renvoie `4/3 × π × rayon³` arrondi à 2 décimales,
     avec `π = 3.14159`.
