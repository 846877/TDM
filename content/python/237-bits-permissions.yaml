title: Opérations bit à bit et droits Unix
level: avance
order: 37
tags: [bits, sysadmin, permissions, octal]
summary: Manipuler des bits avec & | ^ ~ << >> pour décoder et modifier des droits chmod.
description: |
  Utilise les opérateurs bit à bit (`&`, `|`, `^`, `~`, `<<`, `>>`). `bin(...).count` et le
  module `stat` sont interdits pour les deux premières fonctions.

  1. `compter_bits(n)` : nombre de bits à 1 d'un entier `n ≥ 0`.
  2. `est_puissance_de_deux(n)` : `True` si `n` est une puissance de deux (1, 2, 4, …),
     `False` pour 0 et les négatifs. En temps constant.
  3. `mode_vers_texte(mode)` : convertit un mode (entier, par exemple `0o755`) en chaîne de 9
     caractères à la `ls -l` : `"rwxr-xr-x"`. Bits spéciaux : setuid (`0o4000`) remplace le
     `x` du propriétaire par `s` (ou `S` si `x` est absent), setgid (`0o2000`) fait de même
     pour le groupe, le sticky bit (`0o1000`) remplace le `x` des autres par `t` (ou `T`).
  4. `texte_vers_mode(texte)` : l'inverse (`"rwsr-x--T"` → `0o5750`). Un caractère invalide
     ou une longueur différente de 9 lève `ValueError`.
  5. `chmod(mode, expression)` applique une expression symbolique et renvoie le nouveau mode :
     - clauses séparées par des virgules : `"u+x,go-w"` ;
     - chaque clause : qui (`u`, `g`, `o`, `a`, combinables ; **vide** = `a`), un opérateur
       (`+` ajoute, `-` retire, `=` remplace exactement les droits des catégories citées) et
       des droits parmi `r`, `w`, `x` (éventuellement aucun : `"o="` retire tout aux autres) ;
     - les bits spéciaux du mode sont conservés ; une clause invalide lève `ValueError`.

  ```python
  mode_vers_texte(0o640)           # "rw-r-----"
  oct(chmod(0o644, "u+x,go-r"))    # "0o700"
  oct(chmod(0o777, "go=r"))        # "0o744"
  ```
