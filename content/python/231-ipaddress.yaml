title: Sous-réseaux avec ipaddress
level: avance
order: 31
tags: [réseau, ipaddress, subnetting]
summary: Découper, agréger et interroger des réseaux IPv4/IPv6 avec ipaddress.
description: |
  Utilise le module `ipaddress`. Les réseaux sont donnés en notation CIDR (`"10.0.0.0/24"`).

  1. `infos(reseau)` renvoie un dictionnaire avec les clés `"reseau"`, `"masque"`,
     `"broadcast"`, `"premier"`, `"dernier"` (premier et dernier hôte utilisable) et
     `"hotes"` (nombre d'hôtes utilisables) — valeurs en chaînes, sauf `"hotes"` (entier).
     Un réseau dont des bits d'hôte sont à 1 (`"10.0.0.5/24"`) est accepté et ramené à son
     adresse réseau (`strict=False`). Pour un `/31`, les deux adresses sont utilisables ; pour
     un `/32`, l'unique adresse.
  2. `decouper(reseau, nouveau_prefixe)` renvoie la liste des sous-réseaux (chaînes CIDR).
     Un préfixe plus petit que celui du réseau lève `ValueError`.
  3. `appartient(ip, reseaux)` renvoie la liste des réseaux (chaînes, dans l'ordre reçu) qui
     contiennent l'adresse (IPv4 ou IPv6 ; un réseau d'une autre version ne la contient pas).
  4. `agreger(reseaux)` résume une liste de réseaux en la plus petite liste équivalente
     (`collapse_addresses`), triée, en chaînes.
  5. `prochain_libre(reseau, prefixe, utilises)` renvoie le **premier** sous-réseau de taille
     `prefixe` du réseau qui ne chevauche aucun des réseaux `utilises`, ou `None`.

  ```python
  infos("192.168.1.0/26")["broadcast"]          # "192.168.1.63"
  decouper("10.0.0.0/24", 26)                   # ["10.0.0.0/26", "10.0.0.64/26", "10.0.0.128/26", "10.0.0.192/26"]
  agreger(["10.0.0.0/25", "10.0.0.128/25"])     # ["10.0.0.0/24"]
  prochain_libre("10.0.0.0/24", 26, ["10.0.0.0/25"])   # "10.0.0.128/26"
  ```
