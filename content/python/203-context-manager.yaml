title: Gestionnaire de contexte
level: avance
order: 3
tags: [with, context manager, exceptions]
summary: Implémenter __enter__ et __exit__.
description: |
  Recrée `contextlib.suppress` à la main : une classe `Ignorer(*exceptions)` utilisable avec `with`
  qui **avale** les exceptions des types donnés et laisse passer les autres.

  Elle mémorise aussi l'exception ignorée dans l'attribut `erreur` (ou `None`).

  ```python
  with Ignorer(KeyError) as ctx:
      {}["x"]
  print(ctx.erreur)   # KeyError('x')
  ```
starter: |
  class Ignorer:
      def __init__(self, *exceptions):
          pass
tests: |
  def test_ignore():
      "L'exception demandée est ignorée"
      with solution.Ignorer(KeyError) as ctx:
          {}["x"]
      assert isinstance(ctx.erreur, KeyError)

  def test_plusieurs():
      "Plusieurs types d'exceptions"
      with solution.Ignorer(KeyError, ZeroDivisionError):
          1 / 0

  def test_laisse_passer():
      "Les autres exceptions remontent"
      try:
          with solution.Ignorer(KeyError):
              raise ValueError("boom")
      except ValueError:
          pass
      else:
          raise AssertionError("ValueError aurait dû remonter")

  def test_sans_erreur():
      "Sans erreur, erreur vaut None"
      with solution.Ignorer(KeyError) as ctx:
          pass
      assert ctx.erreur is None

  def test_sous_classes():
      "Les sous-classes sont aussi ignorées"
      with solution.Ignorer(LookupError):
          [][1]
solution: |
  class Ignorer:
      def __init__(self, *exceptions):
          self.exceptions = exceptions
          self.erreur = None

      def __enter__(self):
          return self

      def __exit__(self, type_exc, valeur, trace):
          if type_exc is not None and issubclass(type_exc, self.exceptions):
              self.erreur = valeur
              return True
          return False
cours: |
  ## Le protocole des gestionnaires de contexte

  `with expr as x:` fonctionne avec tout objet qui définit deux méthodes :

  - `__enter__(self)` : appelée à l'entrée ; sa valeur de retour est liée à `x` ;
  - `__exit__(self, exc_type, exc_value, traceback)` : appelée à la sortie, **toujours**,
    même si une exception a été levée dans le bloc.

  ```python
  class Chrono:
      def __enter__(self):
          import time
          self.debut = time.perf_counter()
          return self

      def __exit__(self, exc_type, exc, tb):
          import time
          self.duree = time.perf_counter() - self.debut
          return False      # ne pas avaler d'exception

  with Chrono() as c:
      sum(range(10**6))
  print(c.duree)
  ```

  ## Les arguments de `__exit__`

  Si le bloc s'est terminé normalement, les trois arguments valent `None`. Sinon ils
  décrivent l'exception : `exc_type` est sa classe, `exc_value` l'instance.

  ## Avaler ou propager

  La **valeur de retour** de `__exit__` décide du sort de l'exception :

  - valeur fausse (`None`, `False`) : l'exception continue de se propager ;
  - valeur vraie : l'exception est **supprimée** et l'exécution reprend après le `with`.

  Pour tester si l'exception est d'un des types voulus (sous-classes comprises), on utilise
  `issubclass(exc_type, (TypeA, TypeB))` — en se méfiant du cas `exc_type is None`.

  ## Paramètres variables

  `def __init__(self, *exceptions)` récupère tous les arguments positionnels dans un tuple,
  ce qui tombe bien : `issubclass` accepte un tuple de classes.

  ## Usages réels

  Fichiers, verrous (`threading.Lock`), connexions, transactions de base de données,
  changement temporaire de répertoire (`contextlib.chdir`)… Le gestionnaire garantit le
  nettoyage. `contextlib.contextmanager` permet aussi d'écrire un gestionnaire avec un
  générateur (code avant `yield` = entrée, après = sortie, dans un `try/finally`).
