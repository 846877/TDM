title: La boîte à outils itertools
level: avance
order: 13
tags: [itertools, itérateurs, générateurs]
summary: Fenêtres glissantes, entrelacement et combinaisons.
description: |
  Le module `itertools` (et `collections.deque`) permet d'écrire en quelques lignes des traitements
  qui fonctionnent sur **n'importe quel itérable**, y compris un générateur qu'on ne peut lire qu'une fois.

  1. `fenetres(iterable, n)` : générateur des fenêtres glissantes de taille `n`, sous forme de tuples.
     Rien n'est produit si l'itérable contient moins de `n` éléments ; `ValueError` si `n < 1`.
  2. `maximums_courants(nombres)` : liste des maximums successifs (`itertools.accumulate`).
  3. `entrelacer(*iterables)` : générateur qui prend un élément de chaque itérable à tour de rôle,
     en continuant avec les autres quand l'un est épuisé. Attention : `None` peut être une vraie valeur !
  4. `combinaisons_somme(nombres, cible)` : liste de toutes les combinaisons (de 1 à `len(nombres)`
     éléments, tailles croissantes, dans l'ordre de `itertools.combinations`) dont la somme vaut `cible`.

  ```python
  list(fenetres([1, 2, 3, 4], 3))         # [(1, 2, 3), (2, 3, 4)]
  maximums_courants([3, 1, 4, 1, 5])      # [3, 3, 4, 4, 5]
  list(entrelacer("abc", [1], "xy"))      # ["a", 1, "x", "b", "y", "c"]
  combinaisons_somme([1, 2, 3, 4], 5)     # [(1, 4), (2, 3)]
  ```
