tests: |
  import itertools

  def test_fenetres():
      "Fenêtres glissantes"
      assert list(solution.fenetres([1, 2, 3, 4], 3)) == [(1, 2, 3), (2, 3, 4)]
      assert list(solution.fenetres("ab", 1)) == [("a",), ("b",)]

  def test_fenetres_courtes():
      "Pas de fenêtre si l'itérable est trop court"
      assert list(solution.fenetres([1, 2], 3)) == []
      assert list(solution.fenetres([], 1)) == []

  def test_fenetres_generateur():
      "Fenêtres sur un générateur infini (paresseux)"
      fen = solution.fenetres(itertools.count(), 2)
      assert list(itertools.islice(fen, 3)) == [(0, 1), (1, 2), (2, 3)]

  def test_fenetres_invalide():
      "n < 1 refusé"
      try:
          list(solution.fenetres([1], 0))
      except ValueError:
          pass
      else:
          raise AssertionError("ValueError attendue")

  def test_maximums():
      "Maximums courants"
      assert solution.maximums_courants([3, 1, 4, 1, 5]) == [3, 3, 4, 4, 5]
      assert solution.maximums_courants([]) == []
      assert solution.maximums_courants(iter([-2, -5, -1])) == [-2, -2, -1]

  def test_entrelacer():
      "Entrelacement de longueurs différentes"
      assert list(solution.entrelacer("abc", [1], "xy")) == ["a", 1, "x", "b", "y", "c"]
      assert list(solution.entrelacer()) == []

  def test_entrelacer_none():
      "None est une valeur comme une autre"
      r = list(solution.entrelacer([None, None], [0]))
      assert r == [None, 0, None], f"obtenu {r}"

  def test_combinaisons():
      "Combinaisons de somme donnée"
      assert solution.combinaisons_somme([1, 2, 3, 4], 5) == [(1, 4), (2, 3)]
      assert solution.combinaisons_somme([1, 2, 3, 4], 6) == [(2, 4), (1, 2, 3)]
      assert solution.combinaisons_somme([5], 5) == [(5,)]
      assert solution.combinaisons_somme([1, 2], 10) == []
solution: |
  import itertools
  from collections import deque


  def fenetres(iterable, n):
      if n < 1:
          raise ValueError("n doit valoir au moins 1")
      iterateur = iter(iterable)
      fenetre = deque(itertools.islice(iterateur, n), maxlen=n)
      if len(fenetre) == n:
          yield tuple(fenetre)
      for element in iterateur:
          fenetre.append(element)
          yield tuple(fenetre)


  def maximums_courants(nombres):
      return list(itertools.accumulate(nombres, max))


  _FIN = object()


  def entrelacer(*iterables):
      for groupe in itertools.zip_longest(*iterables, fillvalue=_FIN):
          for element in groupe:
              if element is not _FIN:
                  yield element


  def combinaisons_somme(nombres, cible):
      return [
          combi
          for taille in range(1, len(nombres) + 1)
          for combi in itertools.combinations(nombres, taille)
          if sum(combi) == cible
      ]
