title: Programmation dynamique en trois problèmes
level: avance
order: 39
tags: [programmation dynamique, algorithmes, complexité]
summary: Chemins dans une grille, sous-tableau maximal et plus longue sous-suite croissante.
description: |
  Trois problèmes classiques, à résoudre efficacement.

  1. `chemins(grille)` : `grille` est une liste de chaînes où `"."` est libre et `"#"` un
     obstacle. En partant du coin haut-gauche et en ne se déplaçant que vers la **droite** ou
     vers le **bas**, combien de chemins mènent au coin bas-droit ? (0 si le départ ou
     l'arrivée est un obstacle.) En O(lignes × colonnes) : une grille 100 × 100 doit être
     instantanée.
  2. `pic_de_trafic(mesures)` : `mesures` est une liste d'entiers (variation de trafic par
     minute, positive ou négative). Renvoie un tuple `(somme, debut, fin)` du sous-tableau
     **contigu non vide** de somme maximale, `debut` et `fin` inclus. En cas d'égalité, garde
     celui qui commence le plus tôt, puis le plus court. En O(n) (algorithme de Kadane).
  3. `plus_longue_croissante(valeurs)` : longueur de la plus longue sous-suite (pas forcément
     contiguë) **strictement** croissante. En O(n log n) : 100 000 valeurs en moins d'une
     seconde. Utilise `bisect`.

  ```python
  chemins(["...", ".#.", "..."])                 # 2
  pic_de_trafic([-2, 1, -3, 4, -1, 2, 1, -5, 4])  # (6, 3, 6)
  plus_longue_croissante([10, 9, 2, 5, 3, 7, 101, 18])   # 4  (2, 3, 7, 18)
  ```
