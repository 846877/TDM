title: lambda, sorted, min et max
level: intermediaire
order: 33
tags: [lambda, tri, fonctions, key]
summary: Trier et sélectionner avec une fonction clé.
description: |
  Des fichiers sont décrits par des dictionnaires :

  ```python
  FICHIERS = [
      {"nom": "app.log", "taille": 5200, "modifie": "2026-10-18"},
      {"nom": "backup.tar.gz", "taille": 980000, "modifie": "2026-10-01"},
      {"nom": "README", "taille": 1200, "modifie": "2026-09-30"},
      {"nom": "db.sqlite", "taille": 980000, "modifie": "2026-10-19"},
  ]
  ```

  Écris, en utilisant `sorted`, `min`, `max` et le paramètre `key` (pas de boucle de tri) :

  1. `par_taille(fichiers)` : la liste des **noms**, du plus gros au plus petit ; à taille
     égale, par nom croissant.
  2. `plus_recent(fichiers)` : le **nom** du fichier modifié le plus récemment (les dates
     `AAAA-MM-JJ` se comparent comme des chaînes). `None` si la liste est vide.
  3. `extension(nom)` : l'extension après le **dernier** point, en minuscules (`""` s'il n'y
     en a pas ; `"backup.tar.gz"` → `"gz"`).
  4. `trier_par_extension(noms)` : les noms triés par extension, puis par nom **sans tenir
     compte de la casse**.
  5. `top(fichiers, n)` : les `n` plus gros fichiers (les dictionnaires complets), dans
     l'ordre décroissant de taille.

  ```python
  par_taille(FICHIERS)    # ["backup.tar.gz", "db.sqlite", "app.log", "README"]
  plus_recent(FICHIERS)   # "db.sqlite"
  trier_par_extension(["b.txt", "A.txt", "notes", "x.csv"])   # ["notes", "x.csv", "A.txt", "b.txt"]
  ```
