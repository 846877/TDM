title: Dates sans datetime
level: intermediaire
order: 29
tags: [chaînes, exceptions, algorithmes]
summary: Parser, valider et comparer des dates à la main.
description: |
  Sans utiliser le module `datetime` :

  1. `lire_date(texte)` : lit une date au format `JJ/MM/AAAA` et renvoie le tuple
     `(annee, mois, jour)` d'entiers. Lève `ValueError` si le format est incorrect
     (séparateurs, parties non numériques) ou si la date n'existe pas (31/04, 29/02 d'une année
     non bissextile…). Les espaces autour sont tolérés.
  2. `jour_de_l_annee(texte)` : numéro du jour dans l'année (1 pour le 1er janvier).
  3. `ecart_jours(debut, fin)` : nombre de jours entre deux dates (négatif si `fin` est avant
     `debut`).

  ```python
  lire_date("18/10/2026")                     # (2026, 10, 18)
  jour_de_l_annee("01/03/2024")               # 61
  ecart_jours("25/12/2025", "01/01/2026")     # 7
  ```

  Indice pour l'écart : compte le nombre de jours depuis une date de référence (par exemple
  le 01/01/0001) pour chaque date, puis fais la différence.
