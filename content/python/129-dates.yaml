tests: |
  import datetime

  def doit_echouer(texte):
      try:
          r = solution.lire_date(texte)
      except ValueError:
          return
      raise AssertionError(f"lire_date({texte!r}) aurait dû lever ValueError (obtenu {r!r})")

  def test_lire():
      "Lecture d'une date valide"
      r = solution.lire_date("18/10/2026")
      assert r == (2026, 10, 18), f"obtenu {r!r}"
      assert solution.lire_date(" 01/02/0999 ") == (999, 2, 1)

  def test_format_invalide():
      "Formats incorrects"
      for texte in ("18-10-2026", "18/10", "aa/10/2026", "", "18/10/2026/1", "1 8/10/2026"):
          doit_echouer(texte)

  def test_date_inexistante():
      "Dates qui n'existent pas"
      for texte in ("31/04/2026", "29/02/2025", "29/02/1900", "00/01/2026", "15/13/2026", "32/01/2026"):
          doit_echouer(texte)
      assert solution.lire_date("29/02/2000") == (2000, 2, 29), "le 29/02/2000 existe"

  def test_jour_annee():
      "Numéro du jour dans l'année"
      assert solution.jour_de_l_annee("01/01/2026") == 1
      assert solution.jour_de_l_annee("01/03/2024") == 61, "2024 est bissextile"
      assert solution.jour_de_l_annee("01/03/2023") == 60
      assert solution.jour_de_l_annee("31/12/2024") == 366

  def test_ecart():
      "Écart entre deux dates"
      assert solution.ecart_jours("25/12/2025", "01/01/2026") == 7
      assert solution.ecart_jours("01/01/2026", "25/12/2025") == -7
      assert solution.ecart_jours("14/07/1789", "14/07/1789") == 0

  def test_ecart_long():
      "Écart sur plusieurs siècles (vérifié avec datetime)"
      paires = [("01/01/1900", "18/10/2026"), ("28/02/2000", "01/03/2100"), ("15/06/0012", "31/12/9999")]
      for a, b in paires:
          ja, ma, aa = map(int, a.split("/"))
          jb, mb, ab = map(int, b.split("/"))
          attendu = (datetime.date(ab, mb, jb) - datetime.date(aa, ma, ja)).days
          r = solution.ecart_jours(a, b)
          assert r == attendu, f"ecart_jours({a!r}, {b!r}) : attendu {attendu}, obtenu {r!r}"
solution: |
  JOURS = (31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31)


  def bissextile(annee):
      return annee % 4 == 0 and (annee % 100 != 0 or annee % 400 == 0)


  def jours_mois(mois, annee):
      return 29 if mois == 2 and bissextile(annee) else JOURS[mois - 1]


  def lire_date(texte):
      parties = texte.strip().split("/")
      if len(parties) != 3 or not all(p.isdigit() for p in parties):
          raise ValueError(f"format invalide : {texte!r}")
      jour, mois, annee = (int(p) for p in parties)
      if annee < 1 or not 1 <= mois <= 12 or not 1 <= jour <= jours_mois(mois, annee):
          raise ValueError(f"date inexistante : {texte!r}")
      return annee, mois, jour


  def jour_de_l_annee(texte):
      annee, mois, jour = lire_date(texte)
      return sum(jours_mois(m, annee) for m in range(1, mois)) + jour


  def _jours_depuis_origine(texte):
      annee, _, _ = lire_date(texte)
      a = annee - 1
      return a * 365 + a // 4 - a // 100 + a // 400 + jour_de_l_annee(texte)


  def ecart_jours(debut, fin):
      return _jours_depuis_origine(fin) - _jours_depuis_origine(debut)
cours: |
  ## Analyser un format strict

  Pour lire `JJ/MM/AAAA`, on découpe sur `/` et on vérifie :

  1. qu'il y a exactement **trois** parties ;
  2. que chacune est numérique (`str.isdigit()`) — sinon `int()` lèverait lui-même une
     `ValueError`, ce qui est acceptable, mais un contrôle explicite permet un message clair ;
  3. que les valeurs sont **plausibles** (mois de 1 à 12, jour de 1 au nombre de jours du
     mois, en tenant compte des années bissextiles).

  Le déballage `j, m, a = texte.split("/")` lève déjà `ValueError` s'il n'y a pas trois
  morceaux : un comportement qui tombe bien.

  ## Valider avec des exceptions

  Une fonction de lecture qui rencontre une donnée invalide **lève** une exception plutôt
  que de renvoyer `None` : l'appelant ne peut pas l'ignorer par mégarde.

  ```python
  def lire_port(texte):
      port = int(texte)            # ValueError si non numérique
      if not 1 <= port <= 65535:
          raise ValueError(f"port hors limites : {port}")
      return port
  ```

  ## Calculer avec des dates : un nombre de jours absolu

  Calculer directement la différence entre deux dates (jours, mois, années) est un
  cauchemar de cas particuliers. L'astuce : convertir chaque date en **nombre de jours
  depuis une origine fixe** (années complètes + mois complets + jours). La différence de deux
  dates devient une simple soustraction. C'est le principe du « numéro de jour julien » et
  du *timestamp* Unix (secondes depuis le 1er janvier 1970).

  Le nombre d'années bissextiles avant l'année `a` se calcule sans boucle :
  `(a - 1) // 4 - (a - 1) // 100 + (a - 1) // 400`.

  ## En vrai

  `datetime.date(2026, 10, 18).toordinal()` fait exactement cela, et
  `datetime.strptime(texte, "%d/%m/%Y")` analyse le texte. Réimplémenter une fois permet de
  comprendre les pièges (et de ne plus jamais les sous-estimer) : fuseaux horaires et heures
  d'été compliquent encore les choses.
