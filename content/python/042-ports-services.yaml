title: Annuaire des ports réseau
level: debutant
order: 42
tags: [dictionnaires, réseau, boucles]
summary: Chercher, parcourir et inverser un dictionnaire de services.
description: |
  Un dictionnaire associe des noms de services à leur numéro de port, par exemple :

  ```python
  PORTS = {"ssh": 22, "http": 80, "https": 443, "dns": 53, "rdp": 3389, "smtp": 25}
  ```

  1. `port_de(ports, service)` renvoie le port du service (la recherche ignore la casse :
     `"SSH"` fonctionne), ou `None` s'il est inconnu. Les noms dans le dictionnaire sont
     toujours en minuscules.
  2. `service_de(ports, port)` renvoie le nom du service qui utilise ce port, ou
     `"inconnu"`.
  3. `ports_systeme(ports)` renvoie la **liste triée des noms** des services dont le port
     est inférieur à 1024.
  4. `ajouter_service(ports, service, port)` ajoute le service au dictionnaire reçu et renvoie
     `True`, **sauf** si le nom ou le port est déjà utilisé : dans ce cas, le dictionnaire
     n'est pas modifié et la fonction renvoie `False`.

  ```python
  port_de(PORTS, "SSH")          # 22
  service_de(PORTS, 443)         # "https"
  ports_systeme({"ssh": 22, "rdp": 3389, "dns": 53})   # ["dns", "ssh"]
  ```
starter: |
  def port_de(ports, service):
      pass


  def service_de(ports, port):
      pass


  def ports_systeme(ports):
      pass


