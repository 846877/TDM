solution: |
  from collections import deque

  lignes, colonnes = map(int, input().split())
  grille = [input() for _ in range(lignes)]

  depart = next((l, c) for l in range(lignes) for c in range(colonnes) if grille[l][c] == "S")
  distances = {depart: 0}
  file = deque([depart])
  while file:
      l, c = file.popleft()
      for dl, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
          nl, nc = l + dl, c + dc
          if 0 <= nl < lignes and 0 <= nc < colonnes and grille[nl][nc] != "#" and (nl, nc) not in distances:
              distances[(nl, nc)] = distances[(l, c)] + 1
              file.append((nl, nc))

  arrivee = next(((l, c) for l in range(lignes) for c in range(colonnes) if grille[l][c] == "E"), None)
  print(f"distance: {distances[arrivee] if arrivee in distances else 'impossible'}")
  print(f"accessibles: {len(distances)}")
