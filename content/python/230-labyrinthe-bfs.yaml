title: Sortir du labyrinthe
level: avance
order: 30
tags: [graphes, bfs, grilles, stdin]
summary: Parcours en largeur sur une grille lue au clavier.
mode: stdio
description: |
  Ton programme lit un labyrinthe sur l'entrée standard :

  - première ligne : le nombre de lignes `L` et de colonnes `C` ;
  - puis `L` lignes de `C` caractères : `S` (départ, toujours présent), `E` (sortie, éventuellement
    absente), `#` (mur) et `.` (case libre).

  On se déplace d'une case à la fois, en haut, en bas, à gauche ou à droite, sans traverser les murs
  ni sortir de la grille. Affiche :

  ```
  distance: <nombre minimal de déplacements de S à E, ou impossible>
  accessibles: <nombre de cases atteignables depuis S, S compris>
  ```

  Exemple :

  ```
  5 7
  S.#....
  ..#.##.
  .##..#.
  ....#E.
  #......
  ```

  donne `distance: 10` et `accessibles: 26`.

  Un parcours en **largeur** (BFS, avec `collections.deque`) trouve toujours le plus court chemin dans
  une grille où chaque déplacement coûte 1. La moulinette teste aussi une grille de 60 × 80.
starter: |
  from collections import deque

  lignes, colonnes = map(int, input().split())
  grille = [input() for _ in range(lignes)]
cases:
  - name: Exemple de l'énoncé
    input: |
      5 7
      S.#....
      ..#.##.
      .##..#.
      ....#E.
      #......
    output: |
      distance: 10
      accessibles: 26
  - name: Sortie inaccessible
    input: |
      3 5
      S.#..
      ..#.E
      ..#..
    output: |
      distance: impossible
      accessibles: 6
  - name: Sortie juste à côté
    input: |
      1 2
      SE
    output: |
      distance: 1
      accessibles: 2
  - name: Sans sortie
    input: |
      2 3
      .S#
      ##.
    output: |
      distance: impossible
      accessibles: 2
