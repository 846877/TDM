title: Plus court chemin (Dijkstra)
level: expert
order: 2
tags: [graphes, algorithmes, heapq]
summary: Router des paquets comme OSPF.
description: |
  Un réseau est décrit par un graphe pondéré : `{"A": {"B": 4, "C": 1}, "C": {"B": 2}, ...}`
  (les liens sont **orientés**, le poids est le coût).

  Écris `plus_court_chemin(graphe, depart, arrivee)` qui renvoie un tuple `(cout, chemin)`
  où `chemin` est la liste des nœuds traversés. S'il n'existe pas de chemin, renvoie `(None, [])`.

  C'est l'algorithme utilisé par **OSPF** ! Indice : `heapq`.
starter: |
  import heapq


  def plus_court_chemin(graphe, depart, arrivee):
      pass
tests: |
  G = {
      "A": {"B": 4, "C": 1},
      "B": {"D": 1},
      "C": {"B": 2, "D": 5},
      "D": {"E": 3},
      "E": {},
  }

  def test_simple():
      "A vers D passe par C puis B"
      assert solution.plus_court_chemin(G, "A", "D") == (4, ["A", "C", "B", "D"])

  def test_meme_noeud():
      "Départ = arrivée"
      assert solution.plus_court_chemin(G, "A", "A") == (0, ["A"])

  def test_inaccessible():
      "Aucun chemin"
      assert solution.plus_court_chemin(G, "E", "A") == (None, [])

  def test_grand_graphe():
      "Grand graphe en grille"
      n = 60
      g = {}
      for i in range(n):
          for j in range(n):
              voisins = {}
              if i + 1 < n: voisins[(i + 1, j)] = 1
              if j + 1 < n: voisins[(i, j + 1)] = 1
              g[(i, j)] = voisins
      cout, chemin = solution.plus_court_chemin(g, (0, 0), (n - 1, n - 1))
      assert cout == 2 * (n - 1) and len(chemin) == 2 * n - 1
solution: |
  import heapq


  def plus_court_chemin(graphe, depart, arrivee):
      file = [(0, 0, depart)]
      distances = {depart: 0}
      precedent = {}
      compteur = 0
      while file:
          cout, _, noeud = heapq.heappop(file)
          if noeud == arrivee:
              chemin = [noeud]
              while chemin[-1] != depart:
                  chemin.append(precedent[chemin[-1]])
              return cout, chemin[::-1]
          if cout > distances.get(noeud, float("inf")):
              continue
          for voisin, poids in graphe.get(noeud, {}).items():
              nouveau = cout + poids
              if nouveau < distances.get(voisin, float("inf")):
                  distances[voisin] = nouveau
                  precedent[voisin] = noeud
                  compteur += 1
                  heapq.heappush(file, (nouveau, compteur, voisin))
      return None, []
cours: |
  ## Le problème

  Dans un graphe pondéré (poids **positifs**), trouver le chemin de coût total minimal
  entre deux sommets. Les protocoles de routage à état de liens (OSPF, IS-IS) calculent
  ainsi leur table de routage : chaque routeur connaît la topologie et le coût des liens, et
  exécute Dijkstra depuis lui-même.

  ## L'idée

  On maintient pour chaque sommet la meilleure distance **connue** depuis le départ. On
  extrait toujours le sommet non finalisé de plus petite distance : comme tous les poids
  sont positifs, aucun autre chemin ne pourra faire mieux, sa distance est **définitive**.
  On **relâche** alors ses arcs : pour chaque voisin, si passer par ce sommet améliore la
  distance du voisin, on la met à jour et on note le prédécesseur.

  ## Avec un tas

  ```python
  import heapq
  tas = [(0, depart)]
  distances = {depart: 0}
  while tas:
      d, sommet = heapq.heappop(tas)
      if d > distances.get(sommet, float("inf")):
          continue          # entrée périmée : on a déjà trouvé mieux
      ...
  ```

  `heapq` n'a pas d'opération « diminuer une priorité » : on **réinsère** le sommet avec sa
  nouvelle distance et on ignore les entrées périmées à l'extraction (technique de la
  suppression paresseuse). On peut aussi s'arrêter dès que l'arrivée est extraite.

  ## Reconstruire le chemin

  Un dictionnaire `precedent[v] = u` mémorise d'où l'on vient. On remonte depuis l'arrivée
  jusqu'au départ, puis on inverse la liste.

  ## Pièges

  - un sommet peut n'apparaître que comme voisin, jamais comme clé : utilise
    `graphe.get(sommet, {})` ;
  - départ = arrivée : coût 0, chemin d'un seul sommet ;
  - poids négatifs : Dijkstra donne un résultat faux (voir Bellman-Ford).

  ## Complexité

  **O((V + E) log V)** avec un tas binaire, contre O(V²) pour la version naïve qui cherche
  le minimum par parcours linéaire.
