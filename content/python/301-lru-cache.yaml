title: Cache LRU
level: expert
order: 1
tags: [structures de données, classes, complexité]
summary: Un cache à capacité limitée en O(1).
description: |
  Implémente une classe `CacheLRU(capacite)` (*Least Recently Used*) :

  - `get(cle)` renvoie la valeur ou `None` ; une lecture rend la clé « récemment utilisée » ;
  - `put(cle, valeur)` ajoute ou met à jour ; si la capacité est dépassée, on supprime la clé
    **la moins récemment utilisée** ;
  - `len(cache)` donne le nombre d'éléments.

  Les deux opérations doivent être en **O(1)** (la moulinette fait 200 000 opérations).
  Indice : `collections.OrderedDict` ou dict + liste doublement chaînée.
starter: |
  class CacheLRU:
      def __init__(self, capacite):
          pass
tests: |
  def test_base():
      "Ajout et lecture"
      c = solution.CacheLRU(2)
      c.put("a", 1)
      c.put("b", 2)
      assert c.get("a") == 1
      assert c.get("z") is None

  def test_eviction():
      "La clé la moins récemment utilisée est supprimée"
      c = solution.CacheLRU(2)
      c.put("a", 1); c.put("b", 2)
      c.get("a")
      c.put("c", 3)
      assert c.get("b") is None
      assert c.get("a") == 1 and c.get("c") == 3
      assert len(c) == 2

  def test_mise_a_jour():
      "Mettre à jour rafraîchit la clé"
      c = solution.CacheLRU(2)
      c.put("a", 1); c.put("b", 2); c.put("a", 10); c.put("c", 3)
      assert c.get("a") == 10 and c.get("b") is None

  def test_performance():
      "200 000 opérations rapidement"
      c = solution.CacheLRU(1000)
      for i in range(100000):
          c.put(i, i)
          c.get(i // 2)
      assert len(c) == 1000
solution: |
  from collections import OrderedDict


  class CacheLRU:
      def __init__(self, capacite):
          self.capacite = capacite
          self.donnees = OrderedDict()

      def get(self, cle):
          if cle not in self.donnees:
              return None
          self.donnees.move_to_end(cle)
          return self.donnees[cle]

      def put(self, cle, valeur):
          self.donnees[cle] = valeur
          self.donnees.move_to_end(cle)
          if len(self.donnees) > self.capacite:
              self.donnees.popitem(last=False)

      def __len__(self):
          return len(self.donnees)
cours: |
  ## Politique d'éviction LRU

  Un cache a une capacité limitée. Quand il est plein, il faut choisir qui sortir. LRU
  (*Least Recently Used*) évince l'élément utilisé **le moins récemment** : on parie que ce
  qui a servi récemment resservira bientôt (localité temporelle). C'est la politique des
  caches de processeurs, des caches disque, de `functools.lru_cache`, de Redis
  (`allkeys-lru`)…

  ## Les opérations et leur coût

  Il faut à la fois :

  - retrouver une clé en O(1) → un **dictionnaire** ;
  - connaître l'ordre d'utilisation et déplacer un élément en tête en O(1) → une structure
    **ordonnée** modifiable n'importe où.

  Une liste Python ne convient pas pour l'ordre : retirer un élément au milieu
  (`liste.remove(cle)`) coûte O(n). Avec 200 000 opérations, cela devient quadratique.

  ## `OrderedDict`

  `OrderedDict` combine un dictionnaire et une liste doublement chaînée interne :

  ```python
  from collections import OrderedDict
  od = OrderedDict()
  od["a"] = 1; od["b"] = 2; od["c"] = 3
  od.move_to_end("a")       # a devient le dernier : b, c, a
  od.popitem(last=False)    # retire le PREMIER : ("b", 2)
  ```

  `move_to_end` et `popitem` sont en O(1). Il suffit de choisir une convention (par exemple :
  la fin = le plus récent) et de s'y tenir. Un `dict` ordinaire conserve aussi l'ordre
  d'insertion, et on peut « déplacer » une clé en la supprimant puis en la réinsérant.

  ## La version « à la main »

  En entretien, on demande souvent l'implémentation avec un dictionnaire `clé → nœud` et une
  liste doublement chaînée avec deux nœuds sentinelles (tête et queue), qui évitent tous les
  cas particuliers de liste vide.

  ## Détails à ne pas oublier

  - un `get` réussi rend la clé récente ; un `get` raté ne change rien ;
  - un `put` sur une clé existante met à jour la valeur **et** la rend récente, sans
    éviction ;
  - l'éviction se fait seulement quand la taille **dépasse** la capacité.
