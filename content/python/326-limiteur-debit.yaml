title: Limiteur de débit (token bucket)
level: expert
order: 26
tags: [algorithmes, temps, conception, tests]
summary: Le seau à jetons des API, testable grâce à une horloge injectée.
description: |
  Les API limitent le nombre de requêtes avec l'algorithme du **seau à jetons** : un seau contient au plus
  `capacite` jetons et se remplit **en continu** de `debit` jetons par seconde ; chaque requête consomme
  des jetons, et elle est refusée s'il n'y en a pas assez.

  Pour pouvoir tester sans attendre réellement, l'heure est fournie par une **horloge injectée** :
  une fonction sans argument qui renvoie un temps en secondes (par défaut `time.monotonic`).

  1. `LimiteurDebit(capacite, debit, horloge=time.monotonic)` — le seau est **plein** à la création.
     - `autoriser(cout=1)` : si le seau contient au moins `cout` jetons, les retire et renvoie `True` ;
       sinon renvoie `False` sans rien retirer ;
     - `attente(cout=1)` : nombre de secondes à attendre pour que `autoriser(cout)` réussisse
       (`0` si c'est déjà possible) ; ne consomme rien ;
     - propriété `jetons` : nombre (décimal) de jetons disponibles maintenant ;
     - `cout > capacite` → `ValueError` (la requête ne pourrait jamais passer) ;
       `capacite <= 0` ou `debit <= 0` → `ValueError`.

  2. `LimiteurParCle(capacite, debit, horloge=time.monotonic)` — un seau **indépendant par client** :
     `autoriser(cle, cout=1)`. Les seaux sont créés à la demande (pleins).

  Conseil : ne recalcule le remplissage qu'au moment d'un appel :
  `jetons = min(capacite, jetons + (maintenant - dernier_instant) * debit)`.

  ```python
  temps = [0.0]
  lim = LimiteurDebit(capacite=2, debit=1, horloge=lambda: temps[0])
  lim.autoriser(), lim.autoriser(), lim.autoriser()   # (True, True, False)
  lim.attente()                                       # 1.0
  temps[0] = 1.0
  lim.autoriser()                                     # True
  ```
starter: |
  import time


  class LimiteurDebit:
      def __init__(self, capacite, debit, horloge=time.monotonic):
          pass


  class LimiteurParCle:
