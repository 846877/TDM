title: Table de multiplication
level: debutant
order: 8
tags: [boucles, input, print]
summary: Afficher une table de multiplication ligne par ligne.
mode: stdio
description: |
  Lis un entier `n` au clavier puis affiche sa table de 1 à 10, au format :

  ```
  3 x 1 = 3
  3 x 2 = 6
  ...
  3 x 10 = 30
  ```

  Pense à convertir la saisie : `int(input())`.
starter: |
  n = int(input())
cases:
  - name: Table de 3
    input: "3\n"
    output: |
      3 x 1 = 3
      3 x 2 = 6
      3 x 3 = 9
      3 x 4 = 12
      3 x 5 = 15
      3 x 6 = 18
      3 x 7 = 21
      3 x 8 = 24
      3 x 9 = 27
      3 x 10 = 30
  - name: Table de 7
    input: "7\n"
    output: |
      7 x 1 = 7
      7 x 2 = 14
      7 x 3 = 21
      7 x 4 = 28
      7 x 5 = 35
      7 x 6 = 42
      7 x 7 = 49
      7 x 8 = 56
      7 x 9 = 63
      7 x 10 = 70
solution: |
  n = int(input())
  for i in range(1, 11):
      print(f"{n} x {i} = {n * i}")
cours: |
  ## Convertir la saisie

  `input()` renvoie toujours du texte. Pour calculer, il faut convertir :

  ```python
  texte = input()      # "7"
  n = int(texte)       # 7 (int)
  n = int(input())     # en une seule ligne
  ```

  `"7" * 3` donne `"777"` (répétition de chaîne) alors que `7 * 3` donne `21` : oublier la
  conversion produit des résultats surprenants plutôt qu'une erreur. `int("abc")` lève une
  `ValueError`, `int(" 12 ")` tolère les espaces autour.

  ## Afficher proprement à chaque tour

  Dans une boucle, chaque `print` produit une nouvelle ligne. Les f-strings permettent de
  construire la ligne exacte demandée :

  ```python
  prix = 4
  for quantite in range(1, 4):
      print(f"{quantite} article(s) : {quantite * prix} €")
  # 1 article(s) : 4 €
  # 2 article(s) : 8 €
  # 3 article(s) : 12 €
  ```

  ## Sortie exacte

  Une moulinette en mode « entrée/sortie » compare ton affichage **caractère par
  caractère** (les espaces en fin de ligne sont tolérés ici). Vérifie :

  - les espaces autour des symboles (`x`, `=`) ;
  - le nombre de lignes (de 1 à 10 **inclus** : pense à la borne exclue de `range`) ;
  - l'absence de texte en trop (pas de `input("Nombre ? ")`, qui afficherait la question).

  ## Alternatives d'affichage

  `print(a, "x", b)` sépare les arguments par une espace ; `sep=""` supprime ce séparateur.
  Les f-strings restent la façon la plus lisible et la plus utilisée aujourd'hui.
