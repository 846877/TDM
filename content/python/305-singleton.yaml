title: Métaclasse et registre
level: expert
order: 5
tags: [métaclasses, POO avancée]
summary: Contrôler la création des classes.
description: |
  Écris une **métaclasse** `RegistrePlugins` :

  1. Chaque classe créée avec cette métaclasse est enregistrée dans le dictionnaire
     `RegistrePlugins.plugins` sous la clé de son attribut `nom` (s'il existe ; sinon elle n'est pas enregistrée).
  2. Deux classes avec le même `nom` → `TypeError` à la création.
  3. Chaque classe enregistrée doit définir une méthode `executer`, sinon `TypeError`.

  Ajoute une classe de base `Plugin(metaclass=RegistrePlugins)` (sans `nom`, donc non enregistrée).

  ```python
  class Bonjour(Plugin):
      nom = "bonjour"
      def executer(self):
          return "Bonjour !"

  RegistrePlugins.plugins["bonjour"]().executer()  # "Bonjour !"
  ```
starter: |
  class RegistrePlugins(type):
      plugins = {}


  class Plugin(metaclass=RegistrePlugins):
      pass
tests: |
  def test_enregistrement():
      "Les plugins sont enregistrés"
      class Bonjour(solution.Plugin):
          nom = "bonjour-test"
          def executer(self):
              return "Bonjour !"
      assert solution.RegistrePlugins.plugins["bonjour-test"] is Bonjour
      assert "Plugin" not in solution.RegistrePlugins.plugins

  def test_doublon():
      "Un nom en double est refusé"
      class A(solution.Plugin):
          nom = "doublon"
          def executer(self): pass
      try:
          class B(solution.Plugin):
              nom = "doublon"
              def executer(self): pass
      except TypeError:
          pass
      else:
          raise AssertionError("TypeError attendu pour un nom en double")

  def test_executer_obligatoire():
      "executer est obligatoire"
      try:
          class C(solution.Plugin):
              nom = "sans-executer"
      except TypeError:
          pass
      else:
          raise AssertionError("TypeError attendu sans méthode executer")

  def test_metaclasse():
      "Plugin utilise bien la métaclasse"
      assert type(solution.Plugin) is solution.RegistrePlugins
solution: |
  class RegistrePlugins(type):
      plugins = {}

      def __new__(mcs, nom_classe, bases, attributs):
          cls = super().__new__(mcs, nom_classe, bases, attributs)
          nom = attributs.get("nom")
          if nom is not None:
              if nom in mcs.plugins:
                  raise TypeError(f"plugin déjà enregistré : {nom}")
              if not callable(getattr(cls, "executer", None)):
                  raise TypeError(f"{nom_classe} doit définir executer()")
              mcs.plugins[nom] = cls
          return cls


  class Plugin(metaclass=RegistrePlugins):
      pass
cours: |
  ## Les classes sont des objets

  En Python, une classe est elle-même un objet, instance de sa **métaclasse**. Par défaut,
  la métaclasse est `type` :

  ```python
  class A: pass
  type(A)              # <class 'type'>
  B = type("B", (A,), {"x": 1})   # crée une classe dynamiquement
  ```

  Quand Python exécute une instruction `class`, il collecte le corps dans un dictionnaire
  puis appelle `metaclasse(nom, bases, dictionnaire)`.

  ## Écrire une métaclasse

  On hérite de `type` et on redéfinit `__new__` (création) ou `__init__` (initialisation) :

  ```python
  class Tracee(type):
      classes = []

      def __new__(mcs, nom, bases, ns):
          cls = super().__new__(mcs, nom, bases, ns)
          mcs.classes.append(nom)
          return cls

  class Base(metaclass=Tracee): pass
  class Fille(Base): pass          # hérite aussi de la métaclasse
  Tracee.classes                    # ['Base', 'Fille']
  ```

  Le code s'exécute **à la définition de la classe**, pas à l'instanciation : c'est le bon
  moment pour enregistrer une classe dans un registre ou vérifier qu'elle respecte un
  contrat. Une erreur levée là empêche la classe d'exister.

  ## Vérifier un contrat

  - `ns` (le dictionnaire du corps) contient ce qui est défini **directement** dans la
    classe ; `hasattr(cls, "x")` / `getattr` voient aussi ce qui est **hérité**. Choisis selon
    ce que tu veux vérifier.
  - `callable(getattr(cls, "executer", None))` teste la présence d'une méthode.

  ## Le registre de plugins

  C'est un patron très courant : chaque sous-classe s'inscrit automatiquement, et le
  programme principal découvre les plugins disponibles sans les lister à la main (pytest,
  Django, outils CLI).

  ## Plus simple : `__init_subclass__`

  Depuis Python 3.6, `__init_subclass__` (défini dans la classe de base) est appelé à chaque
  création de sous-classe et suffit pour la plupart des registres. Règle d'or : n'utiliser
  une métaclasse que si rien de plus simple ne convient.
