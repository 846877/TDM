title: Recherche dichotomique
level: avance
order: 8
tags: [algorithmes, complexité]
summary: Chercher en O(log n).
description: |
  Écris `recherche_binaire(liste_triee, cible)` qui renvoie l'indice de `cible` dans la liste triée,
  ou `-1` si elle n'y est pas. Ta fonction doit être en **O(log n)** : la moulinette compte les
  accès à la liste.

  Interdit : `in`, `.index()`, le module `bisect`.
starter: |
  def recherche_binaire(liste_triee, cible):
      pass
tests: |
  class ListeEspion(list):
      def __init__(self, *a):
          super().__init__(*a)
          self.acces = 0
      def __getitem__(self, i):
          self.acces += 1
          return super().__getitem__(i)

  def test_trouve():
      "Élément présent"
      assert solution.recherche_binaire([1, 3, 5, 7, 9], 7) == 3

  def test_absent():
      "Élément absent"
      assert solution.recherche_binaire([1, 3, 5, 7, 9], 4) == -1

  def test_bords():
      "Premier, dernier, liste vide"
      assert solution.recherche_binaire([1, 2, 3], 1) == 0
      assert solution.recherche_binaire([1, 2, 3], 3) == 2
      assert solution.recherche_binaire([], 3) == -1

  def test_logarithmique():
      "Au plus ~40 accès sur un million d'éléments"
      liste = ListeEspion(range(0, 2_000_000, 2))
      assert solution.recherche_binaire(liste, 1_234_566) == 617_283
      assert liste.acces <= 40, f"{liste.acces} accès : ce n'est pas une recherche dichotomique"
solution: |
  def recherche_binaire(liste_triee, cible):
      bas, haut = 0, len(liste_triee) - 1
      while bas <= haut:
          milieu = (bas + haut) // 2
          valeur = liste_triee[milieu]
          if valeur == cible:
              return milieu
          if valeur < cible:
              bas = milieu + 1
          else:
              haut = milieu - 1
      return -1
