title: Tailles lisibles par un humain
level: intermediaire
order: 44
tags: [chaînes, conversions, formatage, sysadmin]
summary: Convertir des octets en « 1.5 Gio » et inversement, comme df -h.
description: |
  1. `lisible(octets, binaire=True)` convertit un nombre d'octets en texte lisible :
     - en mode binaire, on divise par 1024 et les unités sont `o`, `Kio`, `Mio`, `Gio`,
       `Tio`, `Pio` ; en mode décimal (`binaire=False`), on divise par 1000 avec `o`, `Ko`,
       `Mo`, `Go`, `To`, `Po` ;
     - on choisit la plus grande unité pour laquelle la valeur est **≥ 1** (sans dépasser
       `Pio`/`Po`) ;
     - les octets s'affichent sans décimale (`"512 o"`), les autres unités avec **une**
       décimale (`"1.5 Kio"`).
  2. `analyser(texte)` fait l'inverse : il accepte un nombre (entier ou décimal, point ou
     virgule) suivi éventuellement d'espaces et d'une unité parmi `o`, `K`, `M`, `G`, `T`,
     `P` (ces lettres seules valent les puissances de **1024**), `Ko`/`Mo`/… (puissances de
     1000) et `Kio`/`Mio`/… (puissances de 1024). La casse de l'unité est ignorée. Sans
     unité : des octets. Renvoie un **entier** (arrondi avec `round`). Un texte invalide lève
     `ValueError`.

  ```python
  lisible(1536)                    # "1.5 Kio"
  lisible(1_500_000, binaire=False)  # "1.5 Mo"
  lisible(512)                     # "512 o"
  analyser("2G")                   # 2147483648
  analyser("1,5 Mo")               # 1500000
  analyser("10 kio")               # 10240
  ```
