title: Arbre de Fenwick
level: expert
order: 22
tags: [structures de données, complexité, bits]
summary: Sommes de préfixes et mises à jour en O(log n), puis comptage d'inversions.
description: |
  Un **arbre de Fenwick** (*Binary Indexed Tree*) stocke un tableau de nombres et permet en
  `O(log n)` à la fois de modifier un élément et de calculer la somme d'un préfixe — là où une liste
  simple ou un tableau de sommes cumulées est lent pour l'une des deux opérations.

  Crée la classe `ArbreFenwick(valeurs)` (indices **0-based** pour l'utilisateur ; en interne, la version
  classique est 1-based et utilise `i & -i`, le bit de poids faible) :

  | Méthode | Rôle |
  |---------|------|
  | `ArbreFenwick(valeurs)` | construit à partir d'une liste de nombres (ou `ArbreFenwick([0] * n)`) |
  | `len(arbre)` | nombre d'éléments |
  | `ajouter(i, delta)` | ajoute `delta` à l'élément `i` |
  | `somme_prefixe(i)` | somme des éléments d'indices `0` à `i - 1` (`somme_prefixe(0) == 0`) |
  | `somme(debut, fin)` | somme des éléments d'indices `debut` à `fin - 1` |
  | `arbre[i]` / `arbre[i] = v` | lit / remplace la valeur de l'élément `i` |

  Un indice hors limites lève `IndexError` (pour `somme_prefixe`, `i` va de `0` à `len`).

  Écris ensuite `compter_inversions(liste)` : le nombre de couples `(i, j)` avec `i < j` et
  `liste[i] > liste[j]`. Parcours la liste en comptant, avec un Fenwick indexé par le **rang** des valeurs
  (compression des valeurs : elles peuvent être grandes, négatives ou répétées), combien d'éléments
  déjà vus sont plus grands que l'élément courant.

  La moulinette effectue 100 000 opérations sur un arbre de 50 000 éléments.
