title: Énumérations avec enum
level: intermediaire
order: 41
tags: [enum, classes, constantes]
summary: Remplacer des chaînes magiques par des énumérations.
description: |
  Utilise le module `enum`.

  1. Crée `Niveau(IntEnum)` avec, dans cet ordre, `DEBUG = 10`, `INFO = 20`,
     `WARNING = 30`, `ERROR = 40`, `CRITICAL = 50` (les valeurs de `logging`).
  2. `niveau_depuis_texte(texte)` renvoie le membre correspondant au nom (insensible à la
     casse et aux espaces autour) : `" warning "` → `Niveau.WARNING`. Un nom inconnu lève
     `ValueError`.
  3. `filtrer(messages, minimum)` reçoit une liste de couples `(Niveau, texte)` et renvoie
     les textes dont le niveau est **supérieur ou égal** à `minimum`, dans l'ordre.
  4. Crée `EtatService(Enum)` avec `ARRETE`, `DEMARRAGE`, `ACTIF`, `ERREUR` (valeurs
     `"arrêté"`, `"démarrage"`, `"actif"`, `"erreur"`).
  5. `transition(etat, evenement)` renvoie le nouvel état selon ces règles (sinon
     `ValueError`) :

     | état | événement | nouvel état |
     |------|-----------|-------------|
     | ARRETE | `"start"` | DEMARRAGE |
     | DEMARRAGE | `"ok"` | ACTIF |
     | DEMARRAGE | `"echec"` | ERREUR |
     | ACTIF | `"stop"` | ARRETE |
     | ACTIF | `"echec"` | ERREUR |
     | ERREUR | `"reset"` | ARRETE |

  ```python
  Niveau.ERROR > Niveau.INFO                              # True
  transition(EtatService.ARRETE, "start")                 # EtatService.DEMARRAGE
  EtatService.ACTIF.value                                 # "actif"
  ```
starter: |
