solution: |
  import sys

  donnees = sys.stdin.read().split()
  capacite, n = int(donnees[0]), int(donnees[1])
  objets = [(donnees[2 + 3 * i], int(donnees[3 + 3 * i]), int(donnees[4 + 3 * i])) for i in range(n)]

  # meilleur[c] = (valeur maximale, -poids minimal) pour un poids total <= c
  meilleur = [(0, 0)] * (capacite + 1)
  for _, poids, valeur in objets:
      for c in range(capacite, poids - 1, -1):
          v, moins_p = meilleur[c - poids]
          candidat = (v + valeur, moins_p - poids)
          if candidat > meilleur[c]:
              meilleur[c] = candidat

  valeur, moins_poids = meilleur[capacite]
  print(f"valeur max: {valeur}")
  print(f"poids utilise: {-moins_poids}")
