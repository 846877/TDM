title: Le problème du sac à dos
level: expert
order: 21
tags: [programmation dynamique, algorithmes, optimisation, stdin]
summary: Sac à dos 0/1 par programmation dynamique, avec critère de départage.
mode: stdio
description: |
  Tu pars en randonnée avec un sac de capacité limitée. Chaque objet a un poids et une valeur ; tu peux
  le prendre **une fois** ou pas du tout. Ton programme lit sur l'entrée standard :

  - une ligne `capacite n` ;
  - `n` lignes `nom poids valeur` (entiers positifs, nom sans espace).

  Il affiche la valeur totale maximale qu'on peut emporter sans dépasser la capacité, puis, parmi les
  choix qui atteignent cette valeur, le **poids total le plus petit** :

  ```
  valeur max: 90
  poids utilise: 7
  ```

  - Un algorithme glouton (trier par valeur/poids) ne donne pas toujours l'optimum.
  - Tester toutes les combinaisons coûte `2^n` : impossible avec 60 objets.
  - Programmation dynamique : `meilleur[c]` = meilleur résultat avec une capacité `c`, en traitant
    les objets un par un et en parcourant `c` **de la capacité vers 0** (pour ne pas prendre deux
    fois le même objet). Astuce : comparer des couples `(valeur, -poids)` gère le départage
    automatiquement.
starter: |
  import sys

  donnees = sys.stdin.read().split()
