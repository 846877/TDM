title: Points et tuples
level: debutant
order: 41
tags: [tuples, déballage, fonctions]
summary: Représenter des coordonnées avec des tuples et les déballer.
description: |
  Un point du plan est représenté par un tuple `(x, y)`.

  1. `distance(a, b)` renvoie la distance entre deux points, arrondie à 2 décimales
     (`√((xb − xa)² + (yb − ya)²)` ; la racine carrée s'obtient avec `** 0.5`).
  2. `milieu(a, b)` renvoie le tuple du point milieu.
  3. `deplacer(point, dx, dy)` renvoie un **nouveau** tuple déplacé.
  4. `plus_proche(origine, points)` renvoie le point de la liste le plus proche de `origine`
     (le premier en cas d'égalité), ou `None` si la liste est vide.

  ```python
  distance((0, 0), (3, 4))                 # 5.0
  milieu((0, 0), (4, 2))                   # (2.0, 1.0)
  deplacer((1, 1), 2, -3)                  # (3, -2)
  plus_proche((0, 0), [(5, 5), (1, 2), (-1, -2)])   # (1, 2)
  ```
