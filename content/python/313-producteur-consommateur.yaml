title: Producteur / consommateurs avec asyncio.Queue
level: expert
order: 13
tags: [asyncio, Queue, concurrence, travailleurs]
summary: Un pool de travailleurs asynchrones qui s'arrêtent proprement.
description: |
  Écris une coroutine `traiter(elements, traitement, nb_travailleurs)` qui traite une liste d'éléments
  avec un **pool de travailleurs** :

  - une tâche **productrice** dépose les éléments (avec leur indice) dans une `asyncio.Queue`
    **bornée** (`maxsize=nb_travailleurs`) ;
  - `nb_travailleurs` tâches **consommatrices** retirent les éléments et appellent
    `await traitement(element)` ;
  - le résultat est un couple `(resultats, erreurs)` :
    - `resultats` : liste des valeurs renvoyées, **dans l'ordre des éléments** (`None` à la place
      d'un élément dont le traitement a échoué) ;
    - `erreurs` : liste triée de couples `(indice, exception)` pour les traitements qui ont levé
      une exception (une erreur ne doit **pas** arrêter les autres traitements) ;
  - `nb_travailleurs < 1` → `ValueError` ;
  - à la fin, **aucune tâche ne doit rester en vie** : arrête les travailleurs proprement
    (valeur sentinelle, ou `queue.join()` puis annulation).

  ```python
  async def doubler(x):
      await asyncio.sleep(0.01)
      return 2 * x

  await traiter([1, 2, 3], doubler, 2)    # ([2, 4, 6], [])
  ```
starter: |
  import asyncio


  async def traiter(elements, traitement, nb_travailleurs):
      pass
tests: |
  import asyncio

  def suivi_traitement(echecs=()):
      suivi = {"actifs": 0, "max": 0, "vus": []}
      async def traitement(x):
          suivi["actifs"] += 1
          suivi["max"] = max(suivi["max"], suivi["actifs"])
          try:
              await asyncio.sleep(0.005)
              if x in echecs:
                  raise ValueError(f"mauvais {x}")
              suivi["vus"].append(x)
              return x * x
          finally:
              suivi["actifs"] -= 1
      return traitement, suivi

  def test_resultats():
      "Résultats dans l'ordre"
      t, _ = suivi_traitement()
      assert asyncio.run(solution.traiter(list(range(10)), t, 3)) == ([x * x for x in range(10)], [])

  def test_concurrence():
      "Exactement nb_travailleurs traitements en parallèle"
      t, suivi = suivi_traitement()
      asyncio.run(solution.traiter(list(range(30)), t, 4))
      assert suivi["max"] == 4, f"{suivi['max']} traitements simultanés (attendu 4)"
      assert sorted(suivi["vus"]) == list(range(30)), "chaque élément doit être traité une fois"

  def test_erreurs():
      "Les erreurs sont collectées sans tout arrêter"
      t, _ = suivi_traitement(echecs={2, 5})
      resultats, erreurs = asyncio.run(solution.traiter(list(range(7)), t, 2))
      assert resultats == [0, 1, None, 9, 16, None, 36], f"résultats : {resultats}"
      assert [i for i, _ in erreurs] == [2, 5]
      assert all(isinstance(e, ValueError) for _, e in erreurs)

  def test_aucune_tache_restante():
      "Aucune tâche ne reste en vie"
      t, _ = suivi_traitement()
      async def scenario():
          await solution.traiter(list(range(8)), t, 3)
          await asyncio.sleep(0)
          restantes = [x for x in asyncio.all_tasks() if x is not asyncio.current_task() and not x.done()]
          return len(restantes)
      n = asyncio.run(scenario())
      assert n == 0, f"{n} tâche(s) encore en vie après traiter()"

  def test_vide():
      "Liste vide"
      t, _ = suivi_traitement()
      assert asyncio.run(solution.traiter([], t, 3)) == ([], [])

  def test_plus_de_travailleurs():
      "Plus de travailleurs que d'éléments"
      t, _ = suivi_traitement()
      assert asyncio.run(solution.traiter([3], t, 10)) == ([9], [])

  def test_invalide():
      "nb_travailleurs < 1"
      t, _ = suivi_traitement()
      try:
          asyncio.run(solution.traiter([1], t, 0))
      except ValueError:
          pass
      else:
          raise AssertionError("ValueError attendue")
solution: |
  import asyncio

  _FIN = object()


  async def traiter(elements, traitement, nb_travailleurs):
      if nb_travailleurs < 1:
          raise ValueError("il faut au moins un travailleur")
      file = asyncio.Queue(maxsize=nb_travailleurs)
      resultats = [None] * len(elements)
      erreurs = []

      async def producteur():
          for indice, element in enumerate(elements):
              await file.put((indice, element))
          for _ in range(nb_travailleurs):
              await file.put(_FIN)

      async def travailleur():
          while True:
              tache = await file.get()
              if tache is _FIN:
                  return
              indice, element = tache
              try:
                  resultats[indice] = await traitement(element)
              except Exception as exc:
                  erreurs.append((indice, exc))

      await asyncio.gather(producteur(), *(travailleur() for _ in range(nb_travailleurs)))
      erreurs.sort(key=lambda e: e[0])
      return resultats, erreurs
cours: |
  ## Le patron producteur / consommateurs

  Un producteur dépose du travail dans une **file**, plusieurs consommateurs (travailleurs)
  le retirent et le traitent. La file découple les deux côtés : chacun avance à son rythme.
  C'est l'architecture des files de messages (RabbitMQ, Celery), des serveurs web et des
  outils de scan parallèle.

  ## `asyncio.Queue`

  ```python
  file = asyncio.Queue(maxsize=10)
  await file.put(element)      # attend s'il n'y a plus de place
  element = await file.get()   # attend s'il n'y a rien
  file.task_done()             # signale qu'un élément est traité
  await file.join()            # attend que tous les éléments soient traités
  ```

  Une file **bornée** applique une *contre-pression* (*backpressure*) : un producteur trop
  rapide est ralenti au lieu de remplir la mémoire.

  ## Arrêter les travailleurs proprement

  Un travailleur est typiquement une boucle infinie `while True: ... await file.get()`.
  Deux façons de l'arrêter :

  1. **Sentinelle** : le producteur dépose, après le travail, un marqueur spécial par
     travailleur (`None` ou un `object()` unique) ; un travailleur qui le reçoit sort de sa
     boucle.
  2. **Annulation** : après `await file.join()`, appeler `tache.cancel()` sur chaque
     travailleur, puis attendre leur fin (`gather(..., return_exceptions=True)`).

  Dans tous les cas, aucune tâche ne doit rester « orpheline » : une tâche non attendue peut
  masquer des exceptions et produire des avertissements.

  ## Isoler les erreurs

  Une exception dans `traitement` ne doit pas tuer le travailleur : un `try / except
  Exception` dans la boucle enregistre l'erreur et passe à l'élément suivant. Un `finally`
  qui appelle `task_done()` garantit que `join()` ne restera pas bloqué.

  ## Conserver l'ordre

  Les travailleurs terminent dans un ordre imprévisible. En transportant l'**indice** avec
  chaque élément, on range chaque résultat à sa place dans une liste pré-allouée
  (`[None] * n`).

  ## `nb_travailleurs`

  Plus de travailleurs = plus de parallélisme d'E/S, jusqu'à saturer la ressource distante.
  Valide le paramètre avant de lancer quoi que ce soit.
