tests: |
  DEPS = {"app": ["lib", "config"], "lib": ["base"], "config": ["base"]}

  def verifier_cycle(deps, cycle):
      assert len(cycle) >= 2 and cycle[0] == cycle[-1], f"cycle mal formé : {cycle}"
      for t, suivant in zip(cycle, cycle[1:]):
          assert suivant in deps.get(t, []), f"{suivant} n'est pas un prérequis de {t} (cycle {cycle})"

  def test_ordre():
      "Ordre avec préférence alphabétique"
      assert solution.ordre(DEPS) == ["base", "config", "lib", "app"]

  def test_prerequis_non_cles():
      "Prérequis absents des clés"
      assert solution.ordre({"b": ["a"], "c": []}) == ["a", "b", "c"]
      assert solution.ordre({}) == []

  def test_ordre_unique():
      "Toujours la plus petite tâche disponible"
      deps = {"z": [], "y": ["z"], "a": ["y"], "m": []}
      assert solution.ordre(deps) == ["m", "z", "y", "a"], f"obtenu {solution.ordre(deps)}"

  def test_etapes():
      "Étapes parallèles"
      assert solution.etapes(DEPS) == [["base"], ["config", "lib"], ["app"]]
      assert solution.etapes({"d": ["a", "c"], "c": ["b"], "e": []}) == [["a", "b", "e"], ["c"], ["d"]]

  def test_cycle():
      "Cycle détecté et décrit"
      deps = {"a": ["b"], "b": ["c"], "c": ["a"], "x": []}
      for fonction in (solution.ordre, solution.etapes):
          try:
              fonction(deps)
          except solution.CycleError as exc:
              assert isinstance(exc, ValueError), "CycleError doit hériter de ValueError"
              verifier_cycle(deps, exc.cycle)
          else:
              raise AssertionError(f"{fonction.__name__} : CycleError attendue")

  def test_cycle_partiel():
      "Cycle au milieu d'un graphe plus grand"
      deps = {"app": ["web"], "web": ["auth", "db"], "auth": ["session"], "session": ["auth"], "db": []}
      try:
          solution.ordre(deps)
      except solution.CycleError as exc:
          verifier_cycle(deps, exc.cycle)
          assert set(exc.cycle) == {"auth", "session"}, f"cycle {exc.cycle}"
      else:
          raise AssertionError("CycleError attendue")

  def test_auto_dependance():
      "Une tâche qui dépend d'elle-même"
      try:
          solution.ordre({"a": ["a"]})
      except solution.CycleError as exc:
          assert exc.cycle == ["a", "a"]
      else:
          raise AssertionError("CycleError attendue")

  def test_grand():
      "Chaîne de 5 000 tâches"
      n = 5000
      deps = {f"t{i:05d}": [f"t{i - 1:05d}"] for i in range(1, n)}
      r = solution.ordre(deps)
      assert r == [f"t{i:05d}" for i in range(n)]
      assert len(solution.etapes(deps)) == n
solution: |
  import heapq


  class CycleError(ValueError):
      def __init__(self, cycle):
          super().__init__("dépendance circulaire : " + " -> ".join(map(str, cycle)))
          self.cycle = cycle


  def _graphe(dependances):
      taches = set(dependances)
      for prerequis in dependances.values():
          taches.update(prerequis)
      restants = {t: len(set(dependances.get(t, []))) for t in taches}
      dependants = {t: [] for t in taches}
      for t, prerequis in dependances.items():
          for p in set(prerequis):
              dependants[p].append(t)
      return restants, dependants


  def _trouver_cycle(dependances, bloquees):
      # on suit les prérequis bloqués jusqu'à retomber sur un sommet déjà vu
      depart = min(bloquees)
      chemin, position = [], {}
      t = depart
      while t not in position:
          position[t] = len(chemin)
          chemin.append(t)
          t = min(p for p in dependances.get(t, []) if p in bloquees)
      return chemin[position[t]:] + [t]


  def ordre(dependances):
      restants, dependants = _graphe(dependances)
      tas = [t for t, n in restants.items() if n == 0]
      heapq.heapify(tas)
      resultat = []
      while tas:
          t = heapq.heappop(tas)
          resultat.append(t)
          for d in dependants[t]:
              restants[d] -= 1
              if restants[d] == 0:
                  heapq.heappush(tas, d)
      if len(resultat) < len(restants):
          bloquees = {t for t, n in restants.items() if n > 0}
          raise CycleError(_trouver_cycle(dependances, bloquees))
      return resultat


  def etapes(dependances):
      restants, dependants = _graphe(dependances)
      courante = sorted(t for t, n in restants.items() if n == 0)
      resultat, traitees = [], 0
      while courante:
          resultat.append(courante)
          traitees += len(courante)
          suivante = []
          for t in courante:
              for d in dependants[t]:
                  restants[d] -= 1
                  if restants[d] == 0:
                      suivante.append(d)
          courante = sorted(suivante)
      if traitees < len(restants):
          bloquees = {t for t, n in restants.items() if n > 0}
          raise CycleError(_trouver_cycle(dependances, bloquees))
      return resultat
cours: |
  ## Ordonner des dépendances

  Un graphe orienté **acyclique** (DAG) de dépendances admet un ordre où chaque tâche vient
  après ses prérequis : un **tri topologique**. `apt`, `pip`, `make`, systemd (`After=`),
  Terraform ou Ansible le calculent en permanence.

  ## Algorithme de Kahn

  1. Calculer le **degré entrant** de chaque tâche (son nombre de prérequis non satisfaits).
  2. Mettre dans une structure « disponibles » toutes les tâches de degré 0.
  3. Tant qu'il y a des disponibles : en retirer une, l'ajouter au résultat, et décrémenter
     le degré de chaque tâche qui en dépend ; celles qui tombent à 0 deviennent disponibles.

  Il faut donc le graphe **inverse** : pour chaque prérequis, la liste des tâches qui en
  dépendent (`defaultdict(list)`). Pense à inclure les prérequis qui ne sont pas des clés.

  ## Un résultat déterministe

  Plusieurs ordres sont souvent valides. Pour toujours choisir la plus petite tâche
  disponible, la structure « disponibles » est un **tas** (`heapq`) : O(log n) par opération.

  ## Par étapes (niveaux)

  Pour paralléliser, on traite les disponibles **par vagues** : toutes les tâches de degré 0
  forment l'étape 1 ; en les retirant, celles qui tombent à 0 forment l'étape 2, etc. C'est un
  BFS par niveaux sur le graphe.

  ## Détecter les cycles

  S'il reste des tâches non traitées quand plus aucune n'est disponible, elles font partie
  d'un cycle (ou en dépendent) : aucune ne pourra jamais atteindre le degré 0. On lève alors
  une exception dédiée, idéalement avec les tâches concernées.

  ```python
  class ErreurConfig(Exception):
      """Erreur métier, sous-classe d'une exception existante si pertinent."""
  ```

  ## La bibliothèque standard

  `graphlib.TopologicalSorter` (Python 3.9+) implémente tout cela, y compris le mode
  parallèle (`get_ready` / `done`) et `CycleError`. Complexité de Kahn : O(V + E), ou
  O((V + E) log V) avec le tas.
