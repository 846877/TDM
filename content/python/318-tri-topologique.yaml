title: Tri topologique et dépendances
level: expert
order: 18
tags: [graphes, algorithmes, heapq, dépendances]
summary: Ordonner des tâches, les regrouper par étapes et expliquer les cycles.
description: |
  Un gestionnaire de paquets ou un outil de build doit installer chaque élément **après** ses
  dépendances. Les dépendances sont données par un dictionnaire `{tache: [prerequis, ...]}` ;
  un prérequis peut ne pas être lui-même une clé (il n'a alors aucune dépendance).

  1. `ordre(dependances)` : liste de toutes les tâches, chaque prérequis avant les tâches qui en
     dépendent. Quand plusieurs tâches sont disponibles en même temps, prends toujours la **plus
     petite** (ordre alphabétique) : le résultat est ainsi unique. (Algorithme de Kahn + `heapq`.)

  2. `etapes(dependances)` : liste d'étapes pouvant s'exécuter **en parallèle** : la première contient
     les tâches sans prérequis, la suivante celles dont tous les prérequis sont dans les étapes
     précédentes, etc. Chaque étape est triée.

  3. En cas de dépendance circulaire, les deux fonctions lèvent `CycleError` (à définir, sous-classe
     de `ValueError`) dont l'attribut `cycle` contient un cycle sous la forme
     `[t0, t1, ..., t0]` où chaque `t(i+1)` est un **prérequis** de `t(i)`.

  ```python
  deps = {"app": ["lib", "config"], "lib": ["base"], "config": ["base"]}
  ordre(deps)    # ["base", "config", "lib", "app"]
  etapes(deps)   # [["base"], ["config", "lib"], ["app"]]

  ordre({"a": ["b"], "b": ["c"], "c": ["a"]})   # CycleError, cycle == ["a", "b", "c", "a"] par exemple
  ```
starter: |
  import heapq


  class CycleError(ValueError):
      pass


  def ordre(dependances):
      pass


  def etapes(dependances):
