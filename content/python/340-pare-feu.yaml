title: Moteur de règles de pare-feu
level: expert
order: 40
tags: [réseau, sécurité, ipaddress, parsing]
summary: Analyser des règles, filtrer des paquets au premier match et détecter les règles masquées.
description: |
  Une règle s'écrit `action proto source destination ports` :

  - `action` : `allow` ou `deny` ;
  - `proto` : `tcp`, `udp`, `icmp` ou `any` ;
  - `source`, `destination` : un réseau CIDR, une adresse seule (équivaut à un `/32` ou un
    `/128`) ou `any` ;
  - `ports` : `any`, ou une liste séparée par des virgules de ports (`22`) et de plages
    (`1024-2048`), entre 1 et 65535. Pour `icmp`, `ports` doit être `any`.

  Utilise `ipaddress`.

  1. `analyser_regle(texte)` renvoie un dictionnaire avec les clés `"action"`, `"proto"`,
     `"source"`, `"destination"` (objets réseau `ipaddress`, `any` étant
     `ip_network("0.0.0.0/0")`) et `"ports"` (`None` pour `any`, sinon la liste triée des
     plages `(debut, fin)` fusionnées si elles se chevauchent ou se touchent). Toute erreur
     (nombre de champs, valeur inconnue, réseau invalide, port hors limites, plage
     décroissante, ports avec icmp) lève `ValueError`. On ne traite que l'IPv4.
  2. `evaluer(regles, paquet, defaut="deny")` : `regles` est une liste de textes, `paquet` un
     dictionnaire `{"proto": ..., "src": ..., "dst": ..., "port": ...}` (`port` vaut `None`
     pour l'ICMP). La **première** règle qui correspond décide. Renvoie `(action, indice)`,
     ou `(defaut, None)` si aucune ne correspond. Une règle avec des ports ne correspond qu'à
     un paquet dont le port est dans l'une des plages.
  3. `regles_masquees(regles)` détecte les règles qui ne peuvent **jamais** s'appliquer parce
     qu'**une seule** règle précédente couvre tout ce qu'elles couvrent (protocole, source,
     destination et ports). Renvoie une liste de tuples `(indice, indice_masquant, nature)`
     où `nature` vaut `"redondante"` (même action) ou `"conflit"` (action opposée) ; pour
     chaque règle masquée, l'indice masquant est le plus petit possible.

  ```python
  regles = ["allow tcp 10.0.0.0/8 any 22",
            "deny any any any any"]
  evaluer(regles, {"proto": "tcp", "src": "10.1.2.3", "dst": "192.168.0.1", "port": 22})
  # ("allow", 0)
  regles_masquees(["allow tcp any any 1-1024", "deny tcp 10.0.0.0/8 any 80,443"])
  # [(1, 0, "conflit")]
  ```
