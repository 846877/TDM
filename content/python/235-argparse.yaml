title: Une vraie ligne de commande avec argparse
level: avance
order: 35
tags: [argparse, cli, sysadmin]
summary: Construire l'interface d'un outil en ligne de commande avec sous-commandes.
description: |
  On construit l'interface de l'outil `netcheck`. Écris `construire_parser()` qui renvoie un
  `argparse.ArgumentParser` (avec `prog="netcheck"`) acceptant :

  - option globale `-v` / `--verbose`, **cumulable** (`-vv` → 2), par défaut 0 ;
  - sous-commande `ping` (attribut `commande` = `"ping"`) :
    - un ou plusieurs `hotes` (positionnels) ;
    - `-c` / `--count` : entier, défaut 4 ;
    - `--timeout` : décimal, défaut 1.0 ;
  - sous-commande `scan` :
    - `hote` (un seul, positionnel) ;
    - `-p` / `--ports` : texte converti par la fonction `ports(texte)` (à écrire, voir
      ci-dessous), défaut `"1-1024"` (converti lui aussi) ;
    - `--proto` : `"tcp"` ou `"udp"` uniquement (`choices`), défaut `"tcp"` ;
  - sous-commande **obligatoire** : sans sous-commande, le parser signale une erreur.

  `ports(texte)` convertit `"22,80,8000-8002"` en liste triée sans doublon
  `[22, 80, 8000, 8001, 8002]`. Chaque port doit être entre 1 et 65535 et chaque plage
  croissante, sinon lève `argparse.ArgumentTypeError` (argparse transformera cette erreur en
  message propre).

  Enfin, `executer(args)` (où `args` est le résultat de `parse_args`) renvoie une chaîne :
  `"ping 2 hôte(s) x4"` pour un ping (nombre d'hôtes et count), `"scan srv (tcp) : 3 port(s)"`
  pour un scan.

  ```python
  p = construire_parser()
  a = p.parse_args(["-vv", "scan", "srv", "-p", "22,80,443", "--proto", "udp"])
  a.verbose, a.commande, a.ports, a.proto    # (2, "scan", [22, 80, 443], "udp")
  executer(a)                                # "scan srv (udp) : 3 port(s)"
  ```

  (Rappel : quand argparse rencontre une erreur, il affiche un message et lève `SystemExit`.)
