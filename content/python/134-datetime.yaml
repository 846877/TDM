title: Dates et durées avec datetime
level: intermediaire
order: 34
tags: [datetime, dates, chaînes]
summary: Analyser, calculer et formater des dates avec le module datetime.
description: |
  Utilise le module `datetime` (`date`, `datetime`, `timedelta`).

  1. `jour_semaine(texte)` reçoit une date `AAAA-MM-JJ` et renvoie le nom du jour en
     français, en minuscules (`"lundi"` … `"dimanche"`).
  2. `jours_restants(aujourdhui, echeance)` : nombre de jours entre deux dates `AAAA-MM-JJ`
     (négatif si l'échéance est passée).
  3. `expiration(texte, jours)` : la date `JJ/MM/AAAA` obtenue en ajoutant `jours` jours à la
     date `AAAA-MM-JJ` (pratique pour un certificat ou un mot de passe qui expire).
  4. `duree_session(debut, fin)` reçoit deux horodatages `AAAA-MM-JJ HH:MM:SS` et renvoie la
     durée au format `"Xh YYmin"` (minutes sur deux chiffres, secondes ignorées).
  5. `est_ouvre(texte)` : `True` si la date `AAAA-MM-JJ` tombe du lundi au vendredi.

  ```python
  jour_semaine("2026-10-19")                     # "lundi"
  jours_restants("2026-10-19", "2026-12-25")     # 67
  expiration("2026-10-19", 90)                   # "17/01/2027"
  duree_session("2026-10-19 08:15:00", "2026-10-19 17:42:30")   # "9h 27min"
  ```

  Une date invalide (`"2026-02-30"`) doit lever `ValueError` (c'est le comportement
  naturel de `datetime`).
