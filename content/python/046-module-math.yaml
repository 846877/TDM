title: Importer un module
level: debutant
order: 46
tags: [modules, import, math]
summary: Utiliser la bibliothèque standard avec import (math).
description: |
  Utilise le module `math` (avec `import math` en haut du fichier).

  1. `aire_disque(rayon)` renvoie l'aire `π × r²` arrondie à 2 décimales (utilise `math.pi`).
  2. `hypotenuse(a, b)` renvoie la longueur de l'hypoténuse d'un triangle rectangle, arrondie
     à 2 décimales (`math.sqrt` ou `math.hypot`).
  3. `nb_disques(donnees_go, capacite_go)` renvoie le **nombre de disques** nécessaires pour
     stocker les données : on arrondit toujours **au-dessus** (`math.ceil`). 0 Go de données
     nécessite 0 disque.
  4. `bits_necessaires(n)` renvoie le nombre de bits nécessaires pour numéroter `n` éléments
     différents (`n ≥ 1`), c'est-à-dire le plus petit `b` tel que `2 ** b >= n`
     (`math.log2` puis `math.ceil`). Par exemple, 200 hôtes → 8 bits.

  ```python
  aire_disque(2)           # 12.57
  hypotenuse(3, 4)         # 5.0
  nb_disques(2500, 1000)   # 3
  bits_necessaires(200)    # 8
  bits_necessaires(1)      # 0
  ```
starter: |
