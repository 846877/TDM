title: Comparaisons et booléens
level: debutant
order: 34
tags: [booléens, comparaisons, conditions]
summary: Écrire des tests qui renvoient True ou False.
description: |
  Écris ces **prédicats** (fonctions qui renvoient `True` ou `False`). Chacun peut tenir en
  une seule ligne `return ...` !

  1. `est_port_valide(port)` : vrai si `port` est entre 1 et 65535 inclus.
  2. `est_port_systeme(port)` : vrai si le port est valide **et** strictement inférieur à 1024.
  3. `meme_signe(a, b)` : vrai si `a` et `b` sont tous deux strictement positifs, ou tous
     deux strictement négatifs (0 n'a pas de signe : `meme_signe(0, 5)` est faux).
  4. `peut_se_connecter(utilisateur, mot_de_passe_ok, bloque)` : vrai si le mot de passe est
     correct et que le compte n'est pas bloqué, **ou** si l'utilisateur est `"root"`
     (qui passe toujours).

  ```python
  est_port_valide(22)                        # True
  est_port_systeme(8080)                     # False
  meme_signe(-3, -8)                         # True
  peut_se_connecter("alice", True, True)     # False
  peut_se_connecter("root", False, True)     # True
  ```
starter: |
