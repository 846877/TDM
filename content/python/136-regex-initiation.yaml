title: Premières expressions régulières
level: intermediaire
order: 36
tags: [regex, re, chaînes]
summary: Chercher, valider et remplacer du texte avec le module re.
description: |
  Utilise le module `re`.

  1. `extraire_nombres(texte)` : la liste des entiers (positifs, sans signe) présents dans le
     texte, convertis en `int`.
  2. `est_mac(texte)` : `True` si le texte **entier** est une adresse MAC de la forme
     `aa:bb:cc:dd:ee:ff` (6 paires de chiffres hexadécimaux, majuscules ou minuscules,
     séparées par `:` **ou** toutes par `-`, sans mélange).
  3. `normaliser_espaces(texte)` : remplace toute suite d'espaces/tabulations/retours à la
     ligne par **une** espace et retire les espaces au début et à la fin.
  4. `masquer_mots_de_passe(ligne)` : remplace la valeur après `password=` ou `pwd=` (jusqu'à
     la prochaine espace ou `&`, ou la fin) par `***`. La casse du mot-clé est ignorée et
     conservée.
  5. `codes_erreur(texte)` : la liste des codes HTTP d'erreur (nombres de 3 chiffres
     commençant par 4 ou 5, isolés : pas au milieu d'un nombre plus long), en chaînes.

  ```python
  extraire_nombres("3 serveurs, 12 VM et 256 Go")    # [3, 12, 256]
  est_mac("00:1A:2b:3C:4d:5E")                        # True
  est_mac("00:1A-2b:3C:4d:5E")                        # False
  normaliser_espaces("  trop   d'\t espaces \n")      # "trop d' espaces"
  masquer_mots_de_passe("user=bob&password=s3cr3t&x=1")   # "user=bob&password=***&x=1"
  codes_erreur("200 404 500 1404 301 503")            # ["404", "500", "503"]
  ```
