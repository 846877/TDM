title: Masquer et formater
level: debutant
order: 22
tags: [chaînes, slicing]
summary: Extraire des morceaux de chaîne avec le slicing.
description: |
  Le **slicing** permet d'extraire une partie d'une chaîne : `texte[debut:fin:pas]`.

  1. Écris `masquer_carte(numero)` qui remplace tous les chiffres d'un numéro de carte par des
     `*`, **sauf les 4 derniers**.
  2. Écris `formater_telephone(numero)` qui découpe un numéro de 10 chiffres en paires séparées
     par des espaces.

  ```python
  masquer_carte("1234567812345678")    # "************5678"
  masquer_carte("1234")                # "1234"
  formater_telephone("0612345678")     # "06 12 34 56 78"
  ```

  Astuces : `numero[-4:]` donne les 4 derniers caractères, `range(0, 10, 2)` avance de 2 en 2.
starter: |
  def masquer_carte(numero):
      pass


  def formater_telephone(numero):
      pass
tests: |
  def test_carte():
      "Carte à 16 chiffres"
      r = solution.masquer_carte("1234567812345678")
      assert r == "************5678", f"obtenu {r!r}"

  def test_carte_courte():
      "Numéro de 4 chiffres ou moins : rien à masquer"
      assert solution.masquer_carte("1234") == "1234"
      assert solution.masquer_carte("12") == "12"

  def test_carte_longueur():
      "La longueur est conservée"
      r = solution.masquer_carte("9876543210")
      assert r == "******3210", f"obtenu {r!r}"

  def test_telephone():
      "0612345678 -> 06 12 34 56 78"
      r = solution.formater_telephone("0612345678")
      assert r == "06 12 34 56 78", f"obtenu {r!r}"

  def test_telephone_sans_espace_final():
      "Pas d'espace en trop au début ni à la fin"
      r = solution.formater_telephone("0102030405")
      assert r == "01 02 03 04 05", f"obtenu {r!r}"
solution: |
  def masquer_carte(numero):
      cache = max(len(numero) - 4, 0)
      return "*" * cache + numero[cache:]


  def formater_telephone(numero):
      paires = []
      for i in range(0, len(numero), 2):
          paires.append(numero[i:i + 2])
      return " ".join(paires)
cours: |
  ## Rappels sur le slicing

  ```python
  s = "ABCDEFGH"
  s[:3]      # "ABC"     les 3 premiers
  s[3:]      # "DEFGH"   tout sauf les 3 premiers
  s[-3:]     # "FGH"     les 3 derniers
  s[:-3]     # "ABCDE"   tout sauf les 3 derniers
  s[2:4]     # "CD"
  ```

  Le slicing est **tolérant** : `s[:100]` ne lève pas d'erreur, il renvoie simplement toute
  la chaîne. Et `s[-100:]` aussi. C'est différent de l'indexation simple (`s[100]` lève
  `IndexError`).

  ## Construire une chaîne de longueur calculée

  Pour produire un nombre de caractères dépendant d'une longueur, on combine `len()` et la
  répétition :

  ```python
  mot_de_passe = "secret"
  print("•" * len(mot_de_passe))   # ••••••
  ```

  Pense au cas où la chaîne est plus courte que la partie à conserver : le nombre de
  caractères masqués ne doit jamais être négatif (`"x" * -2` donne `""`, ce qui aide).

  ## Découper par blocs réguliers

  `range(debut, fin, pas)` génère les positions de début de chaque bloc :

  ```python
  adresse_mac = "001A2B3C4D5E"
  blocs = []
  for i in range(0, len(adresse_mac), 2):
      blocs.append(adresse_mac[i:i + 2])
  print(":".join(blocs))   # 00:1A:2B:3C:4D:5E
  ```

  Ce motif (tranche `[i:i + taille]` dans une boucle à pas fixe) sert partout : formater des
  numéros, découper des trames réseau, afficher de l'hexadécimal par octets…

  ## Sécurité

  Masquer un numéro à l'affichage (logs, tickets, captures) est une bonne pratique de
  confidentialité : on ne garde que ce qui permet d'identifier sans exposer. Mais masquer à
  l'affichage ne protège pas la donnée stockée : ce n'est pas du chiffrement.
