title: Intégrité de fichiers avec hashlib
level: avance
order: 40
tags: [hashlib, fichiers, sécurité, sysadmin]
summary: Calculer des empreintes par blocs, vérifier un SHA256SUMS et trouver les doublons.
description: |
  Utilise `hashlib` et `pathlib`.

  1. `empreinte(chemin, algo="sha256", bloc=65536)` renvoie l'empreinte hexadécimale d'un
     fichier, lu **par blocs** de `bloc` octets (jamais en entier en mémoire). `algo` est un
     nom accepté par `hashlib.new` ; un nom inconnu lève `ValueError`.
  2. `verifier(fichier_sommes)` lit un fichier au format de `sha256sum` : chaque ligne
     contient `<empreinte>  <nom>` (deux espaces), les noms étant relatifs au dossier du
     fichier de sommes ; les lignes vides et celles qui commencent par `#` sont ignorées.
     Renvoie un dictionnaire `{nom: statut}` où statut vaut `"OK"`, `"ÉCHEC"` (empreinte
     différente, comparaison insensible à la casse) ou `"ABSENT"`.
  3. `doublons(dossier)` cherche récursivement les fichiers au contenu identique. Pour aller
     vite, on ne calcule l'empreinte que des fichiers qui partagent la même **taille**.
     Renvoie une liste de groupes ; chaque groupe est la liste triée des chemins **relatifs**
     au dossier (avec `/`), d'au moins deux fichiers ; les groupes sont triés. Les fichiers
     vides sont ignorés.

  ```python
  empreinte("iso/debian.iso")          # "3b4c..." (64 caractères hexadécimaux)
  verifier("iso/SHA256SUMS")           # {"debian.iso": "OK", "ubuntu.iso": "ABSENT"}
  doublons("photos")                   # [["2023/a.jpg", "copie/a.jpg"]]
  ```
