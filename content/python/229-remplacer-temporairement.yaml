title: Remplacer temporairement un attribut
level: avance
order: 29
tags: [with, context manager, décorateurs, introspection]
summary: Recréer une version simplifiée de unittest.mock.patch.
description: |
  Pour tester du code, on a souvent besoin de remplacer **temporairement** une fonction ou une
  configuration, puis de tout remettre en place. Crée une classe `remplacer(cible, nom, valeur)` :

  1. **Gestionnaire de contexte** (`__enter__` / `__exit__`) :
     - à l'entrée, `cible.<nom>` prend la valeur `valeur`, et `with ... as v` donne `valeur` ;
     - à la sortie, l'ancienne valeur est **restaurée**, même si une exception a été levée
       (l'exception continue de se propager) ;
     - si l'attribut n'existait pas avant, il est **supprimé** à la sortie ;
     - les remplacements peuvent être **imbriqués** sur le même attribut ;
     - un même objet `remplacer` peut être réutilisé dans plusieurs `with` successifs.

  2. **Décorateur** : `@remplacer(cible, nom, valeur)` appliqué à une fonction active le remplacement
     pendant chaque appel de la fonction (pense à `functools.wraps`).

  3. **Dictionnaires** : si `cible` est un `dict`, c'est la **clé** `nom` qui est remplacée
     (et retirée à la sortie si elle n'existait pas).

  ```python
  import math
  with remplacer(math, "pi", 3):
      math.pi          # 3
  math.pi              # 3.141592653589793

  @remplacer(config, "DEBUG", True)
  def test_mode_debug(): ...
  ```
starter: |
  import functools


  class remplacer:
      def __init__(self, cible, nom, valeur):
          pass
tests: |
  import types

  def test_simple():
      "Remplacement puis restauration"
      obj = types.SimpleNamespace(x=1)
      with solution.remplacer(obj, "x", 2) as v:
          assert obj.x == 2 and v == 2
      assert obj.x == 1

  def test_exception():
      "Restauration même en cas d'exception, qui se propage"
      obj = types.SimpleNamespace(x=1)
      try:
          with solution.remplacer(obj, "x", 2):
              raise KeyError("boum")
      except KeyError:
          pass
      else:
          raise AssertionError("l'exception ne doit pas être avalée")
      assert obj.x == 1

  def test_absent():
      "Attribut inexistant supprimé à la sortie"
      obj = types.SimpleNamespace()
      with solution.remplacer(obj, "nouveau", 5):
          assert obj.nouveau == 5
      assert not hasattr(obj, "nouveau")

  def test_imbrique():
      "Remplacements imbriqués"
      obj = types.SimpleNamespace(x="a")
      with solution.remplacer(obj, "x", "b"):
          with solution.remplacer(obj, "x", "c"):
              assert obj.x == "c"
          assert obj.x == "b"
      assert obj.x == "a"

  def test_reutilisable():
      "Un même objet utilisé deux fois"
      obj = types.SimpleNamespace(x=1)
      r = solution.remplacer(obj, "x", 9)
      with r:
          pass
      obj.x = 2
      with r:
          assert obj.x == 9
      assert obj.x == 2, "il faut mémoriser l'ancienne valeur à chaque entrée"

  def test_module():
      "Sur un module de la bibliothèque standard"
      import math
      with solution.remplacer(math, "sqrt", lambda x: -1):
          assert math.sqrt(4) == -1
      assert math.sqrt(4) == 2

  def test_decorateur():
      "Utilisation comme décorateur"
      obj = types.SimpleNamespace(mode="prod")
      @solution.remplacer(obj, "mode", "test")
      def lire():
          "doc"
          return obj.mode
      assert obj.mode == "prod"
      assert lire() == "test" and lire() == "test"
      assert obj.mode == "prod"
      assert lire.__name__ == "lire" and lire.__doc__ == "doc"

  def test_dict():
      "Sur un dictionnaire"
      config = {"debug": False}
      with solution.remplacer(config, "debug", True):
          assert config == {"debug": True}
      assert config == {"debug": False}
      with solution.remplacer(config, "niveau", 3):
          assert config["niveau"] == 3
      assert config == {"debug": False}
solution: |
  import functools

  _ABSENT = object()


  class remplacer:
      def __init__(self, cible, nom, valeur):
          self.cible, self.nom, self.valeur = cible, nom, valeur
          self._anciennes = []          # une pile : permet de réutiliser l'objet

      def _lire(self):
          if isinstance(self.cible, dict):
              return self.cible.get(self.nom, _ABSENT)
          return getattr(self.cible, self.nom, _ABSENT)

      def _ecrire(self, valeur):
          if isinstance(self.cible, dict):
              if valeur is _ABSENT:
                  del self.cible[self.nom]
              else:
                  self.cible[self.nom] = valeur
          elif valeur is _ABSENT:
              delattr(self.cible, self.nom)
          else:
              setattr(self.cible, self.nom, valeur)

      def __enter__(self):
          self._anciennes.append(self._lire())
          self._ecrire(self.valeur)
          return self.valeur

      def __exit__(self, type_exc, exc, tb):
          self._ecrire(self._anciennes.pop())
          return False

      def __call__(self, fonction):
          @functools.wraps(fonction)
          def enveloppe(*args, **kwargs):
              with self:
                  return fonction(*args, **kwargs)
          return enveloppe
