title: Retour sur trace (backtracking)
level: avance
order: 38
tags: [récursivité, backtracking, algorithmes]
summary: Explorer un espace de solutions en construisant, testant et défaisant des choix.
description: |
  Écris trois fonctions par **retour sur trace** (sans `itertools`).

  1. `parentheses(n)` renvoie la liste **triée** de toutes les chaînes de `n` paires de
     parenthèses bien équilibrées. `parentheses(2)` → `["(())", "()()"]`, `parentheses(0)` →
     `[""]`.
  2. `remplir(fichiers, capacite)` : `fichiers` est un dictionnaire `{nom: taille}` (tailles
     entières > 0). Renvoie la liste de toutes les combinaisons de fichiers (chaque fichier au
     plus une fois) dont la taille totale vaut **exactement** `capacite`. Chaque combinaison
     est une liste de noms **triée** ; la liste des combinaisons est triée. Elle doit rester
     rapide pour une vingtaine de fichiers : élague les branches qui dépassent la capacité.
  3. `chercher_mot(grille, mot)` : `grille` est une liste de chaînes de même longueur. Renvoie
     `True` si `mot` peut s'écrire en partant d'une case et en se déplaçant d'une case à une
     case **voisine** (haut, bas, gauche, droite), sans réutiliser une case. Un mot vide est
     toujours trouvé.

  ```python
  remplir({"a": 3, "b": 5, "c": 2, "d": 8}, 10)   # [["a", "b", "c"], ["c", "d"]]
  chercher_mot(["ABCE", "SFCS", "ADEE"], "ABCCED")  # True
  chercher_mot(["ABCE", "SFCS", "ADEE"], "ABCB")    # False (B réutilisé)
  ```
