title: Année bissextile
level: debutant
order: 13
tags: [conditions, booléens]
summary: Combiner des conditions avec and / or.
description: |
  Écris `est_bissextile(annee)` qui renvoie `True` si l'année est bissextile, `False` sinon.

  Une année est bissextile si elle est divisible par 4, **sauf** si elle est divisible par 100,
  **sauf** si elle est divisible par 400.
starter: |
  def est_bissextile(annee):
      pass
tests: |
  def test_2024():
      "2024 est bissextile"
      assert solution.est_bissextile(2024) is True

  def test_2023():
      "2023 ne l'est pas"
      assert solution.est_bissextile(2023) is False

  def test_1900():
      "1900 ne l'est pas (divisible par 100)"
      assert solution.est_bissextile(1900) is False

  def test_2000():
      "2000 l'est (divisible par 400)"
      assert solution.est_bissextile(2000) is True
solution: |
  def est_bissextile(annee):
      return annee % 4 == 0 and (annee % 100 != 0 or annee % 400 == 0)
cours: |
  ## Le type booléen

  `bool` n'a que deux valeurs : `True` et `False` (avec une majuscule). Toute comparaison
  produit un booléen :

  ```python
  est_majeur = age >= 18     # True ou False
  print(type(est_majeur))    # <class 'bool'>
  ```

  Une fonction qui renvoie un booléen s'appelle un **prédicat** ; on lui donne souvent un nom
  en `est_...` ou `a_...`.

  ## Renvoyer directement la condition

  Ce code fonctionne mais est verbeux :

  ```python
  def est_positif(n):
      if n > 0:
          return True
      else:
          return False
  ```

  Comme `n > 0` **est déjà** un booléen, on peut écrire `return n > 0`.

  ## Combiner : `and`, `or`, `not`

  Les règles « sauf si… sauf si… » se traduisent en combinant les opérateurs. Priorités :
  `not` > `and` > `or`. En cas de doute, mets des **parenthèses** : elles rendent
  l'intention explicite.

  ```python
  acces = (role == "admin") or (role == "user" and not bloque)
  ```

  Les opérateurs sont **paresseux** (évaluation en court-circuit) : dans `a and b`, si `a`
  est faux, `b` n'est même pas évalué.

  ## Méthode : construire une table de cas

  Avant de coder, écris quelques exemples et le résultat attendu, en choisissant des valeurs
  qui touchent chaque règle : une année quelconque, une divisible par 4, une divisible par
  100, une divisible par 400. Ce sont exactement les cas que la moulinette testera
  (pense à 1900 et à 2000).

  En vrai projet, on utiliserait `calendar.isleap(annee)` de la bibliothèque standard.
