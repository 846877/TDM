title: Prochaine exécution d'une tâche cron
level: expert
order: 36
tags: [datetime, parsing, sysadmin, cron]
summary: Analyser une expression crontab et calculer ses prochaines dates d'exécution.
description: |
  Une expression cron a 5 champs séparés par des espaces : minute (0-59), heure (0-23), jour
  du mois (1-31), mois (1-12), jour de la semaine (0-7, où 0 et 7 désignent le dimanche).
  Chaque champ est une liste séparée par des virgules d'éléments de la forme `*`, `a`, `a-b`,
  éventuellement suivis de `/pas` (`*/15`, `10-20/5`, et `5/20` qui signifie « de 5 au
  maximum, de 20 en 20 »).

  1. `analyser_champ(champ, mini, maxi)` renvoie l'**ensemble** des valeurs désignées. Une
     valeur hors de `[mini, maxi]`, une plage décroissante, un pas nul ou un texte invalide
     lèvent `ValueError`.
  2. `analyser(expression)` renvoie un dictionnaire avec les clés `"minute"`, `"heure"`,
     `"jour"`, `"mois"`, `"jour_semaine"` (ensembles ; dans le dernier, 7 est converti en 0).
     Un nombre de champs différent de 5 lève `ValueError`.
  3. `prochaine(expression, apres)` renvoie le premier `datetime` **strictement postérieur**
     à `apres` (secondes et microsecondes à 0) qui correspond à l'expression. Règle
     historique de cron : si les champs jour du mois **et** jour de la semaine sont tous deux
     restreints (ne commencent pas par `*`), une date convient si **l'un ou l'autre**
     correspond ; sinon, les deux doivent correspondre. Si rien ne correspond dans les 5 ans,
     lève `ValueError` (par exemple `"0 0 30 2 *"`). Ne teste pas minute par minute :
     avance jour par jour, puis choisis directement l'heure et la minute.
  4. `prochaines(expression, apres, n)` renvoie la liste des `n` prochaines dates.

  ```python
  prochaine("*/15 9-17 * * 1-5", datetime(2024, 3, 8, 17, 50))   # lundi 11 mars 2024, 9 h 00
  prochaine("0 0 29 2 *", datetime(2024, 3, 1))                  # 29 février 2028, 0 h 00
  ```
