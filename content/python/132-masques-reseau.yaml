title: Masques et calcul de sous-réseau
level: intermediaire
order: 32
tags: [réseau, bits, opérateurs binaires]
summary: Calculer réseau, broadcast et nombre d'hôtes avec les opérateurs de bits.
description: |
  Sans le module `ipaddress`, en utilisant les opérateurs de bits (`&`, `|`, `~`, `<<`, `>>`).
  Les adresses sont des chaînes décimales pointées valides.

  1. `cidr_vers_masque(prefixe)` : `24` → `"255.255.255.0"` (`0 ≤ prefixe ≤ 32`, sinon
     `ValueError`).
  2. `masque_vers_cidr(masque)` : `"255.255.240.0"` → `20`. Un masque non contigu
     (`"255.0.255.0"`) lève `ValueError`.
  3. `adresse_reseau(ip, prefixe)` : `("192.168.1.130", 25)` → `"192.168.1.128"`.
  4. `broadcast(ip, prefixe)` : `("192.168.1.130", 25)` → `"192.168.1.255"`.
  5. `nb_hotes(prefixe)` : nombre d'adresses utilisables pour des hôtes : `2^(32−préfixe) − 2`,
     sauf `/31` (2 adresses, liaison point à point) et `/32` (1 adresse).
  6. `meme_reseau(ip1, ip2, prefixe)` : `True` si les deux adresses sont dans le même
     sous-réseau.

  ```python
  cidr_vers_masque(20)                         # "255.255.240.0"
  adresse_reseau("10.20.30.40", 12)            # "10.16.0.0"
  nb_hotes(24)                                 # 254
  meme_reseau("192.168.1.10", "192.168.1.200", 24)   # True
  ```

  Astuce : écris deux petites fonctions de conversion texte ↔ entier 32 bits.
