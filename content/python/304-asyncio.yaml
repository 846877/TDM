title: Concurrence avec asyncio
level: expert
order: 4
tags: [asyncio, concurrence]
summary: Lancer des tâches en parallèle avec une limite.
description: |
  Écris une coroutine `executer(fonctions, limite)` :

  - `fonctions` est une liste de **fonctions asynchrones sans argument** (`async def f(): ...`) ;
  - elles doivent être exécutées en parallèle, mais **jamais plus de `limite` à la fois** ;
  - le résultat est la liste des valeurs renvoyées, **dans l'ordre de la liste d'entrée**.

  Indices : `asyncio.Semaphore`, `asyncio.gather`.
starter: |
  import asyncio


  async def executer(fonctions, limite):
      pass
tests: |
  import asyncio, time

  def fabriquer(n, duree, suivi):
      async def tache():
          suivi["en_cours"] += 1
          suivi["max"] = max(suivi["max"], suivi["en_cours"])
          await asyncio.sleep(duree)
          suivi["en_cours"] -= 1
          return n
      return tache

  def test_ordre():
      "Résultats dans l'ordre"
      suivi = {"en_cours": 0, "max": 0}
      taches = [fabriquer(i, 0.05 * (5 - i), suivi) for i in range(5)]
      assert asyncio.run(solution.executer(taches, 5)) == [0, 1, 2, 3, 4]

  def test_limite():
      "La limite de concurrence est respectée"
      suivi = {"en_cours": 0, "max": 0}
      taches = [fabriquer(i, 0.02, suivi) for i in range(20)]
      asyncio.run(solution.executer(taches, 3))
      assert suivi["max"] == 3, f"{suivi['max']} tâches simultanées au maximum (attendu 3)"

  def test_parallele():
      "Les tâches tournent vraiment en parallèle"
      suivi = {"en_cours": 0, "max": 0}
      taches = [fabriquer(i, 0.2, suivi) for i in range(10)]
      debut = time.perf_counter()
      asyncio.run(solution.executer(taches, 10))
      assert time.perf_counter() - debut < 1, "trop lent : les tâches sont exécutées l'une après l'autre"
solution: |
  import asyncio


  async def executer(fonctions, limite):
      semaphore = asyncio.Semaphore(limite)

      async def lancer(fonction):
          async with semaphore:
              return await fonction()

      return list(await asyncio.gather(*(lancer(f) for f in fonctions)))
