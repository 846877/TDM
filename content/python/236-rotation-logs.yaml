title: Rotation de journaux avec gzip
level: avance
order: 36
tags: [fichiers, pathlib, gzip, sysadmin]
summary: Réimplémenter le principe de logrotate - décaler, compresser, purger.
description: |
  On réécrit en Python le cœur de `logrotate`. Pour un journal `app.log`, les archives se
  nomment `app.log.1.gz` (la plus récente), `app.log.2.gz`, etc. Utilise `pathlib` et `gzip`.
  Les chemins reçus sont des chaînes ou des `Path`.

  1. `archives(chemin)` renvoie la liste des **noms** (pas des chemins complets) des archives
     existantes de ce journal, triées par numéro **croissant numériquement** (`app.log.10.gz`
     vient après `app.log.9.gz`). Ignore les fichiers qui ne suivent pas exactement le motif
     `<nom>.<entier>.gz`.
  2. `rotater(chemin, garder=3)` :
     - si le journal n'existe pas ou est vide, ne fait rien et renvoie `False` ;
     - sinon supprime les archives de numéro ≥ `garder`, décale les autres
       (`.2.gz` → `.3.gz`, puis `.1.gz` → `.2.gz`, en commençant par la plus ancienne),
       compresse le journal courant en `.1.gz`, puis **vide** le journal (le fichier existe
       toujours, avec une taille de 0) ; renvoie `True`.

     Après la rotation, il reste donc au plus `garder` archives.
  3. `lire_archive(chemin_archive)` renvoie le contenu texte (UTF-8) d'une archive gzip.

  ```python
  rotater("/var/log/app.log", garder=2)
  archives("/var/log/app.log")      # ["app.log.1.gz", "app.log.2.gz"]
  ```
starter: |
