title: Compression de Huffman
level: expert
order: 35
tags: [heapq, arbres, compression, bits]
summary: Construire un code préfixe optimal avec un tas, encoder, décoder et empaqueter en octets.
description: |
  Implémente le codage de Huffman avec `heapq`.

  1. `codes(texte)` renvoie un dictionnaire `{caractère: code}` où chaque code est une chaîne
     de `"0"` et `"1"`. Les codes doivent former un **code préfixe** (aucun code n'est le
     début d'un autre) **optimal** : la longueur totale `Σ fréquence × len(code)` est minimale.
     Cas particuliers : texte vide → `{}` ; un seul caractère distinct → son code est `"0"`.
  2. `encoder(texte)` renvoie le tuple `(bits, table)` où `table = codes(texte)` et `bits` la
     concaténation des codes.
  3. `decoder(bits, table)` reconstruit le texte. Si `bits` contient autre chose que `0`/`1`
     ou se termine au milieu d'un code, lève `ValueError`. En O(longueur de `bits`).
  4. `vers_octets(bits)` empaquette la chaîne de bits en `bytes` (8 bits par octet, le premier
     bit est le bit de poids fort du premier octet, le dernier octet complété par des `0`) et
     renvoie `(donnees, remplissage)` ; `depuis_octets(donnees, remplissage)` fait l'inverse.

  ```python
  bits, table = encoder("abracadabra")
  len(bits)                       # 23 (contre 88 bits en ASCII)
  decoder(bits, table)            # "abracadabra"
  vers_octets("101")              # (b"\xa0", 5)
  ```
