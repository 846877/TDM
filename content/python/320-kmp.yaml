title: Recherche de motif KMP
level: expert
order: 20
tags: [chaînes, algorithmes, complexité]
summary: Knuth-Morris-Pratt, la fonction préfixe et ses applications.
description: |
  La recherche naïve d'un motif de longueur `m` dans un texte de longueur `n` coûte `O(n × m)` dans
  le pire cas. L'algorithme de **Knuth-Morris-Pratt** descend à `O(n + m)` grâce à la
  **fonction préfixe**.

  1. `fonction_prefixe(s)` renvoie la liste `pi` où `pi[i]` est la longueur du plus long **préfixe
     propre** de `s[:i + 1]` qui en est aussi un **suffixe**.

     ```python
     fonction_prefixe("abacaba")   # [0, 0, 1, 0, 1, 2, 3]
     fonction_prefixe("aaaa")      # [0, 1, 2, 3]
     ```

  2. `occurrences(texte, motif)` renvoie la liste des positions de toutes les occurrences du motif,
     **chevauchements compris** : `occurrences("aaaa", "aa") == [0, 1, 2]`.
     Un motif vide lève `ValueError`. Interdit : `str.find`, `str.index`, `in`, `re` — c'est à toi
     d'écrire la recherche avec la fonction préfixe.

  3. `periode(s)` renvoie la longueur de la plus petite chaîne `p` telle que `s` soit `p` répétée
     un nombre entier de fois : `periode("abcabcabc") == 3`, `periode("abcab") == 5`.
     Astuce : avec `k = len(s) - pi[-1]`, la réponse est `k` si `k` divise `len(s)`, sinon `len(s)`.

  La moulinette utilise des textes de 200 000 caractères construits pour piéger la recherche naïve.
