tests: |
  import random

  def naif(texte, motif):
      return [i for i in range(len(texte) - len(motif) + 1) if texte[i:i + len(motif)] == motif]

  def test_prefixe():
      "Fonction préfixe"
      assert solution.fonction_prefixe("abacaba") == [0, 0, 1, 0, 1, 2, 3]
      assert solution.fonction_prefixe("aaaa") == [0, 1, 2, 3]
      assert solution.fonction_prefixe("abcd") == [0, 0, 0, 0]
      assert solution.fonction_prefixe("aabaaab") == [0, 1, 0, 1, 2, 2, 3]
      assert solution.fonction_prefixe("") == []

  def test_occurrences():
      "Occurrences avec chevauchement"
      assert solution.occurrences("aaaa", "aa") == [0, 1, 2]
      assert solution.occurrences("abracadabra", "abra") == [0, 7]
      assert solution.occurrences("abc", "d") == []
      assert solution.occurrences("ab", "abc") == []

  def test_motif_vide():
      "Motif vide refusé"
      try:
          solution.occurrences("abc", "")
      except ValueError:
          pass
      else:
          raise AssertionError("ValueError attendue")

  def test_aleatoire():
      "Comparaison avec la recherche naïve"
      rng = random.Random(20)
      for _ in range(200):
          texte = "".join(rng.choice("ab") for _ in range(rng.randint(0, 40)))
          motif = "".join(rng.choice("ab") for _ in range(rng.randint(1, 5)))
          assert solution.occurrences(texte, motif) == naif(texte, motif), f"texte {texte!r}, motif {motif!r}"

  def test_sans_find():
      "La recherche n'utilise pas str.find / index"
      class Chaine(str):
          def find(self, *a):
              raise AssertionError("str.find est interdit")
          index = rfind = count = find
          def __contains__(self, x):
              raise AssertionError("l'opérateur in sur la chaîne est interdit")
      assert solution.occurrences(Chaine("xabxab"), Chaine("ab")) == [1, 4]

  def test_grand_texte():
      "200 000 caractères piégeux"
      texte = "a" * 200_000
      motif = "a" * 999 + "b"
      assert solution.occurrences(texte, motif) == []
      assert len(solution.occurrences(texte + "b", motif)) == 1

  def test_periode():
      "Période d'une chaîne"
      assert solution.periode("abcabcabc") == 3
      assert solution.periode("abcab") == 5
      assert solution.periode("aaaa") == 1
      assert solution.periode("abab" * 1000) == 2
      assert solution.periode("x") == 1
solution: |
  def fonction_prefixe(s):
      pi = [0] * len(s)
      k = 0
      for i in range(1, len(s)):
          while k and s[i] != s[k]:
              k = pi[k - 1]
          if s[i] == s[k]:
              k += 1
          pi[i] = k
      return pi


  def occurrences(texte, motif):
      if not motif:
          raise ValueError("motif vide")
      pi = fonction_prefixe(motif)
      resultat = []
      k = 0
      for i, caractere in enumerate(texte):
          while k and caractere != motif[k]:
              k = pi[k - 1]
          if caractere == motif[k]:
              k += 1
          if k == len(motif):
              resultat.append(i - k + 1)
              k = pi[k - 1]
      return resultat


  def periode(s):
      k = len(s) - fonction_prefixe(s)[-1]
      return k if len(s) % k == 0 else len(s)
