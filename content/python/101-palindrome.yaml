title: Palindrome
level: intermediaire
order: 1
tags: [chaînes]
summary: Nettoyer une chaîne avant de la comparer.
description: |
  Écris `est_palindrome(texte)` qui renvoie `True` si le texte se lit pareil dans les deux sens,
  en **ignorant la casse, les espaces et la ponctuation** (on ne garde que lettres et chiffres).

  ```python
  est_palindrome("Esope reste ici et se repose")  # True
  est_palindrome("Python")                        # False
  ```

  Indice : `str.isalnum()` et `str.lower()`.
starter: |
  def est_palindrome(texte):
      pass
tests: |
  def test_simple():
      "kayak est un palindrome"
      assert solution.est_palindrome("kayak") is True

  def test_phrase():
      "Phrase avec espaces et majuscules"
      assert solution.est_palindrome("Esope reste ici et se repose") is True

  def test_ponctuation():
      "La ponctuation est ignorée"
      assert solution.est_palindrome("Engage le jeu, que je le gagne !") is True

  def test_faux():
      "Python n'en est pas un"
      assert solution.est_palindrome("Python") is False
solution: |
  def est_palindrome(texte):
      propre = [c.lower() for c in texte if c.isalnum()]
      return propre == propre[::-1]
cours: |
  ## Normaliser avant de comparer

  Beaucoup de problèmes de texte se résolvent en deux temps : **nettoyer** la donnée, puis
  appliquer un test simple. Pour filtrer les caractères d'une chaîne, on construit une
  nouvelle chaîne avec seulement ceux qu'on garde :

  ```python
  brut = "Tél : 06-12-34"
  chiffres = "".join(c for c in brut if c.isdigit())   # "061234"
  ```

  `c for c in brut if ...` est une **expression génératrice** : elle produit les caractères
  retenus un par un, et `"".join` les recolle. `str.isalnum()` est vrai pour les lettres
  (accents compris) et les chiffres. Pour ignorer la casse, `lower()` (ou `casefold()`,
  plus agressif, qui transforme par exemple `ß` en `ss`).

  ## Comparer une séquence avec elle-même

  Deux stratégies classiques :

  1. **Construire la version inversée** (slicing avec un pas négatif) et comparer. Simple,
     mais crée une copie : O(n) en mémoire.
  2. **Deux pointeurs** : un indice `i` part du début, un indice `j` de la fin ; on compare
     `s[i]` et `s[j]`, puis on rapproche les indices jusqu'à ce qu'ils se croisent. On
     s'arrête au premier désaccord : O(1) mémoire supplémentaire.

  ```python
  i, j = 0, len(s) - 1
  while i < j:
      ...
      i += 1
      j -= 1
  ```

  La technique des deux pointeurs revient très souvent (somme de deux nombres dans une
  liste triée, fusion, inversion sur place…).

  ## Cas limites

  - La chaîne vide et une chaîne sans aucun caractère alphanumérique sont des palindromes
    (rien ne contredit la symétrie).
  - Les accents : `"é"` et `"e"` sont différents. Pour les assimiler, il faudrait le module
    `unicodedata` (décomposition NFD), ce que l'exercice ne demande pas.
