title: Lire un CSV à la main
level: intermediaire
order: 13
tags: [chaînes, dictionnaires, fichiers]
summary: Transformer du texte tabulaire en données.
description: |
  Écris `lire_csv(texte, separateur=",")` qui transforme un texte CSV en **liste de dictionnaires**.
  La première ligne contient les noms de colonnes. Les espaces autour des valeurs sont retirés et
  les lignes vides ignorées.

  ```python
  lire_csv("nom,age\nAlice, 30\nBob,25\n")
  # [{"nom": "Alice", "age": "30"}, {"nom": "Bob", "age": "25"}]
  ```

  (Pas besoin de gérer les guillemets. Dans la vraie vie, on utilise le module `csv` !)
starter: |
  def lire_csv(texte, separateur=","):
      pass
tests: |
  def test_simple():
      "Exemple de l'énoncé"
      assert solution.lire_csv("nom,age\nAlice, 30\nBob,25\n") == [
          {"nom": "Alice", "age": "30"}, {"nom": "Bob", "age": "25"}]

  def test_separateur():
      "Autre séparateur"
      assert solution.lire_csv("a;b\n1;2", separateur=";") == [{"a": "1", "b": "2"}]

  def test_lignes_vides():
      "Lignes vides ignorées"
      assert solution.lire_csv("x\n\n1\n\n") == [{"x": "1"}]
solution: |
  def lire_csv(texte, separateur=","):
      lignes = [l for l in texte.splitlines() if l.strip()]
      if not lignes:
          return []
      entetes = [h.strip() for h in lignes[0].split(separateur)]
      return [dict(zip(entetes, (v.strip() for v in l.split(separateur)))) for l in lignes[1:]]
cours: |
  ## Le format CSV

  *Comma-Separated Values* : une ligne par enregistrement, des valeurs séparées par une
  virgule (ou un point-virgule dans les tableurs français, où la virgule est le séparateur
  décimal). La première ligne contient généralement les noms de colonnes.

  ## Découper en lignes

  `texte.splitlines()` découpe sur les fins de ligne (`\n`, `\r\n`…) **sans** produire
  d'élément vide final, contrairement à `texte.split("\n")` :

  ```python
  "a\nb\n".split("\n")     # ['a', 'b', '']
  "a\nb\n".splitlines()    # ['a', 'b']
  ```

  Les lignes vides au milieu restent présentes : filtre-les (`if ligne.strip()`).

  ## Associer en-têtes et valeurs : `zip`

  `zip` parcourt plusieurs séquences en parallèle :

  ```python
  colonnes = ["hote", "ip"]
  valeurs = ["srv1", "10.0.0.1"]
  list(zip(colonnes, valeurs))   # [("hote", "srv1"), ("ip", "10.0.0.1")]
  dict(zip(colonnes, valeurs))   # {"hote": "srv1", "ip": "10.0.0.1"}
  ```

  `dict(zip(...))` est l'idiome pour construire un dictionnaire à partir de deux listes.
  `zip` s'arrête à la plus courte (depuis Python 3.10, `zip(..., strict=True)` lève une
  erreur si les longueurs diffèrent).

  ## Nettoyer chaque champ

  Une compréhension applique `strip()` à chaque valeur :
  `[v.strip() for v in ligne.split(sep)]`.

  ## Pourquoi utiliser le module `csv` en vrai ?

  Le CSV réel est plein de pièges : valeurs entre guillemets contenant le séparateur
  (`"Dupont, Jean"`), guillemets échappés, retours à la ligne dans une cellule, encodages…
  `csv.DictReader` gère tout cela et produit justement des dictionnaires. Écrire le parseur
  à la main une fois permet de comprendre ce qu'il fait ; ensuite, on utilise la bibliothèque.
