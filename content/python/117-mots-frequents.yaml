title: Mots les plus fréquents
level: intermediaire
order: 17
tags: [collections, Counter, tri, input]
summary: Compter avec collections.Counter et départager les égalités.
mode: stdio
description: |
  La première ligne contient un entier `k`, le reste de l'entrée est un texte (sur une ou
  plusieurs lignes). Affiche les `k` mots les plus fréquents, un par ligne, au format
  `mot : nombre`.

  Règles :
  - les mots sont comparés **en minuscules** ;
  - un mot est une suite de lettres (les apostrophes et la ponctuation séparent les mots :
    `l'eau` donne `l` et `eau`) ;
  - en cas d'égalité, l'ordre **alphabétique** départage ;
  - s'il y a moins de `k` mots différents, affiche-les tous.

  Entrée :

  ```
  2
  Le chat voit le chien. Le chien dort.
  ```

  Sortie :

  ```
  le : 3
  chien : 2
  ```

  Astuces : `collections.Counter`, `re.findall(r"[^\W\d_]+", texte)` pour extraire les mots,
  et `sorted(compteur.items(), key=lambda p: (-p[1], p[0]))`.
starter: |
  import sys

  k = int(input())
  texte = sys.stdin.read()
cases:
  - name: "Exemple de l'énoncé"
    input: "2\nLe chat voit le chien. Le chien dort.\n"
    output: |
      le : 3
      chien : 2
  - name: "Égalités départagées par l'alphabet"
    input: "3\nbanane pomme Cerise pomme cerise banane kiwi\n"
    output: |
      banane : 2
      cerise : 2
      pomme : 2
  - name: "Plusieurs lignes et apostrophes"
    input: "2\nL'eau, l'air\net l'eau encore !\n"
    output: |
      l : 3
      eau : 2
  - name: "k plus grand que le nombre de mots"
    input: "10\nun deux un\n"
    output: |
      un : 2
      deux : 1
solution: |
  import re
  import sys
  from collections import Counter

  k = int(input())
  texte = sys.stdin.read().lower()
  compteur = Counter(re.findall(r"[^\W\d_]+", texte))
  classement = sorted(compteur.items(), key=lambda p: (-p[1], p[0]))
  for mot, nombre in classement[:k]:
      print(f"{mot} : {nombre}")
cours: |
  ## `collections.Counter`

  Un `Counter` est un dictionnaire spécialisé pour compter :

  ```python
  from collections import Counter
  c = Counter(["GET", "POST", "GET", "GET"])
  c["GET"]            # 3
  c["DELETE"]         # 0 (pas de KeyError)
  c.most_common(1)    # [("GET", 3)]
  c.update(["POST"])  # ajoute des occurrences
  ```

  Deux compteurs s'additionnent (`c1 + c2`) et se soustraient.

  ## `most_common` et les égalités

  `most_common(k)` trie par fréquence décroissante, mais en cas d'égalité il garde l'ordre
  de **première apparition**, pas l'ordre alphabétique. Quand l'énoncé impose un
  départage, trie toi-même avec une clé tuple : le **signe moins** sur le compte inverse
  l'ordre de ce seul critère, tandis que le mot reste trié en ordre croissant.

  Ensuite, une tranche `[:k]` garde les `k` premiers ; elle fonctionne même si la liste est
  plus courte.

  ## Extraire des mots avec une regex

  `re.findall(motif, texte)` renvoie toutes les correspondances. Dans `[^\W\d_]+` :

  - `\w` = caractère de mot (lettre, chiffre, `_`), Unicode par défaut en Python 3 ;
  - `[^\W\d_]` = « ni non-mot, ni chiffre, ni underscore » = une **lettre**, accents
    compris ;
  - `+` = une ou plusieurs fois.

  C'est plus robuste que `split()` : la ponctuation et les apostrophes deviennent des
  séparateurs naturellement.

  ## Lire la première ligne à part

  `sys.stdin.readline()` lit une seule ligne ; `sys.stdin.read()` lit ensuite **tout le
  reste**. Pense à mettre le texte en minuscules avant de compter.

  ## Cas d'usage

  C'est exactement ce qu'on fait pour trouver les IP les plus actives dans un log, les URL
  les plus demandées ou les erreurs les plus fréquentes : extraire, normaliser, compter,
  trier.
