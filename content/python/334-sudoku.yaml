title: Solveur de Sudoku par contraintes
level: expert
order: 34
tags: [backtracking, bits, contraintes, optimisation]
summary: Résoudre les grilles les plus difficiles avec masques de bits et heuristique MRV.
description: |
  Une grille est une liste de 9 listes de 9 entiers, `0` pour une case vide.

  1. `lire(texte)` convertit une chaîne de 81 caractères (chiffres, `.` ou `0` pour les
     cases vides ; les espaces et retours à la ligne sont ignorés) en grille. Une autre
     longueur ou un autre caractère lève `ValueError`.
  2. `valide(grille)` : `True` si la grille est **complète** et respecte les règles (chaque
     ligne, colonne et bloc 3×3 contient 1 à 9 exactement une fois).
  3. `resoudre(grille)` renvoie une **nouvelle** grille résolue (sans modifier l'originale),
     ou `None` si la grille n'a pas de solution (y compris si elle contient déjà une
     contradiction). Elle doit résoudre les grilles « les plus difficiles du monde » en bien
     moins d'une seconde : représente les candidats de chaque ligne, colonne et bloc par des
     **masques de bits** et choisis toujours la case vide qui a **le moins de candidats**.
  4. `compter_solutions(grille, limite=2)` renvoie le nombre de solutions, en s'arrêtant dès
     que `limite` est atteint (utile pour vérifier qu'une grille a une solution **unique**).

  ```python
  g = lire("53..7....6..195....98....6.8...6...34..8.3..17...2...6.6....28....419..5....8..79")
  valide(resoudre(g))      # True
  compter_solutions(g)     # 1
  ```
