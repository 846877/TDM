title: Compter les mots
level: intermediaire
order: 2
tags: [dictionnaires, chaînes]
summary: Construire un dictionnaire de fréquences.
description: |
  Écris `compter_mots(texte)` qui renvoie un dictionnaire `{mot: nombre d'occurrences}`.

  - les mots sont séparés par des espaces,
  - on compare en **minuscules**,
  - on retire la ponctuation `.,;:!?` collée aux mots.

  ```python
  compter_mots("Le chat et le chien.")  # {"le": 2, "chat": 1, "et": 1, "chien": 1}
  ```
starter: |
  def compter_mots(texte):
      compteur = {}
      return compteur
tests: |
  def test_simple():
      "Exemple de l'énoncé"
      assert solution.compter_mots("Le chat et le chien.") == {"le": 2, "chat": 1, "et": 1, "chien": 1}

  def test_vide():
      "Texte vide"
      assert solution.compter_mots("") == {}

  def test_ponctuation():
      "Ponctuation retirée"
      assert solution.compter_mots("Oui ! oui, OUI ?") == {"oui": 3}
solution: |
  def compter_mots(texte):
      compteur = {}
      for mot in texte.lower().split():
          mot = mot.strip(".,;:!?")
          if mot:
              compteur[mot] = compteur.get(mot, 0) + 1
      return compteur
cours: |
  ## Le dictionnaire comme compteur

  Compter des occurrences est l'usage le plus courant d'un dictionnaire : la clé est
  l'élément, la valeur son nombre d'apparitions.

  ```python
  codes = ["200", "404", "200", "500", "200"]
  compte = {}
  for code in codes:
      compte[code] = compte.get(code, 0) + 1
  # {"200": 3, "404": 1, "500": 1}
  ```

  `get(cle, 0)` évite la `KeyError` la première fois qu'on voit une clé. Variante :
  `if code in compte: ... else: ...`. La bibliothèque standard propose aussi
  `collections.Counter`, que tu verras dans un prochain exercice ; ici, l'objectif est de
  comprendre le mécanisme.

  ## Nettoyer les mots

  `strip()` sans argument retire les espaces aux extrémités ; **avec** un argument, il retire
  tous les caractères listés, dans n'importe quel ordre, aux deux bouts :

  ```python
  "...Bonjour !?".strip(".!? ")   # "Bonjour"
  "l'école,".strip(",")           # "l'école"
  ```

  Il ne touche pas l'intérieur du mot. `lstrip` et `rstrip` n'agissent que d'un côté.

  ## Mots vides

  Après nettoyage, un « mot » composé uniquement de ponctuation (par exemple un `!` isolé
  entre deux espaces) devient une chaîne vide. Il ne doit pas être compté : pense à le
  filtrer.

  ## Ordre de traitement

  Le pipeline est : découper (`split`) → normaliser chaque morceau (`lower`, `strip`) →
  filtrer → compter. Chaque étape est simple ; c'est leur enchaînement qui fait le travail.
  Cette approche par étapes est celle des outils Unix
  (`tr | sort | uniq -c`), et tu la retrouveras dans le traitement de logs.

  **Complexité** : O(n) pour n mots, grâce à l'accès en temps constant du dictionnaire.
