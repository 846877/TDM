title: Penser récursif
level: intermediaire
order: 24
tags: [récursivité, algorithmes]
summary: Résoudre des problèmes en les découpant en sous-problèmes.
description: |
  Écris ces fonctions **récursivement** (sans boucle `for`/`while` pour les deux premières) :

  1. `puissance(x, n)` : calcule `x ** n` pour `n ≥ 0` sans utiliser `**` ni `pow`, en
     exploitant `x^n = (x^(n/2))²` quand `n` est pair (exponentiation rapide).
  2. `somme_imbriquee(donnees)` : additionne tous les nombres d'une structure faite de listes
     **et** de dictionnaires imbriqués (pour un dictionnaire, on additionne ses valeurs).
  3. `permutations(texte)` : renvoie la liste **triée et sans doublons** de toutes les
     permutations d'une chaîne (sans `itertools`).

  ```python
  puissance(2, 10)                             # 1024
  somme_imbriquee([1, {"a": 2, "b": [3, 4]}])  # 10
  permutations("aba")                          # ["aab", "aba", "baa"]
  ```
