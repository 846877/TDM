title: La taille des dossiers (du)
level: intermediaire
order: 49
tags: [récursivité, dictionnaires, arbres, sysadmin]
summary: Parcourir récursivement une arborescence pour calculer des tailles.
description: |
  Une arborescence est représentée par des dictionnaires imbriqués : une clé est un nom ;
  sa valeur est un **entier** (un fichier et sa taille en octets) ou un **dictionnaire**
  (un dossier).

  ```python
  ARBRE = {
      "etc": {"hosts": 220, "ssh": {"sshd_config": 3300, "moduli": 550000}},
      "var": {"log": {"syslog": 1200000, "auth.log": 80000}, "tmp": {}},
      "README": 500,
  }
  ```

  Écris ces fonctions **récursives** :

  1. `taille(arbre)` : taille totale (octets) de tous les fichiers. Un fichier seul (un
     entier) a sa propre taille.
  2. `nb_fichiers(arbre)` : nombre de fichiers.
  3. `chemins(arbre, prefixe="")` : liste **triée** des chemins complets de tous les fichiers,
     séparés par `/` (par exemple `"etc/ssh/moduli"`).
  4. `du(arbre)` : liste de couples `(chemin_du_dossier, taille)` pour **chaque dossier** (y
     compris les dossiers vides), triée par taille décroissante puis chemin croissant.
  5. `profondeur(arbre)` : nombre maximal de niveaux de dossiers (un dictionnaire sans
     sous-dossier a une profondeur de 1 ; ici `ARBRE` a une profondeur de 3).

  ```python
  taille(ARBRE)          # 1834020
  nb_fichiers(ARBRE)     # 6
  du(ARBRE)[:2]          # [("var", 1280000), ("var/log", 1280000)]
  ```
