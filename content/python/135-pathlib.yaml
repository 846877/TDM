title: Explorer des dossiers avec pathlib
level: intermediaire
order: 35
tags: [fichiers, pathlib, dictionnaires]
summary: Manipuler chemins et arborescences avec pathlib.Path.
description: |
  Utilise `pathlib.Path`. Les fonctions reçoivent des chemins sous forme de chaînes ou de
  `Path`.

  1. `decomposer(chemin)` renvoie le tuple `(dossier_parent, nom, nom_sans_extension,
     extension)` sous forme de chaînes ; l'extension inclut le point (`".log"`), ou `""`.
     Le dossier parent s'écrit toujours avec des `/`, même sous Windows (méthode `as_posix()`).
     `decomposer("/var/log/nginx/access.log")` → `("/var/log/nginx", "access.log", "access", ".log")`.
  2. `changer_extension(chemin, ext)` renvoie le chemin (chaîne) avec la nouvelle extension :
     `changer_extension("rapport.txt", ".csv")` → `"rapport.csv"`.
  3. `inventaire(dossier)` parcourt **récursivement** le dossier et renvoie un dictionnaire
     `{extension: nombre de fichiers}` (extension en minuscules, `""` pour les fichiers sans
     extension). Les dossiers eux-mêmes ne comptent pas.
  4. `plus_gros(dossier, n)` renvoie la liste des `n` plus gros fichiers (récursivement),
     sous forme de couples `(chemin relatif au dossier avec des "/", taille en octets)`, du
     plus gros au plus petit ; à taille égale, par chemin croissant.
  5. `creer_arborescence(racine, chemins)` crée tous les fichiers (vides) de la liste de
     chemins relatifs, en créant les dossiers intermédiaires, puis renvoie le nombre de
     fichiers créés.

  ```python
  creer_arborescence("projet", ["src/main.py", "src/utils.py", "docs/README"])   # 3
  inventaire("projet")    # {".py": 2, "": 1}
  ```
