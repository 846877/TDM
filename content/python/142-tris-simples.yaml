title: Tri à bulles, par sélection et par insertion
level: intermediaire
order: 42
tags: [algorithmes, tri, complexité]
summary: Implémenter les tris quadratiques et compter leurs opérations.
description: |
  Implémente trois tris **sans** utiliser `sorted()` ni `.sort()`. Chaque fonction reçoit une
  liste de nombres, **ne la modifie pas**, et renvoie un tuple `(liste_triée, nb_comparaisons)`
  où `nb_comparaisons` est le nombre de comparaisons **entre deux éléments** effectuées.

  1. `tri_bulles(liste)` : on parcourt la liste en échangeant les voisins mal ordonnés ; après
     chaque passage, le plus grand élément restant est à sa place. **Optimisation
     obligatoire** : si un passage ne fait aucun échange, on s'arrête. Le passage `k`
     (à partir de 0) compare les paires d'indices `(0,1)`, `(1,2)`, …, `(n-2-k, n-1-k)`.
  2. `tri_selection(liste)` : pour chaque position `i`, on cherche le minimum de la partie
     `i..n-1` (en comparant chaque élément au minimum provisoire) et on l'échange avec
     l'élément `i`.
  3. `tri_insertion(liste)` : on insère chaque élément `i` (à partir de 1) dans la partie
     déjà triée à sa gauche, en le comparant aux éléments précédents de droite à gauche
     jusqu'à trouver un élément **inférieur ou égal** (ou le début).

  ```python
  tri_bulles([1, 2, 3, 4])        # ([1, 2, 3, 4], 3)   un seul passage, aucun échange
  tri_selection([1, 2, 3, 4])     # ([1, 2, 3, 4], 6)   toujours n(n-1)/2
  tri_insertion([4, 3, 2, 1])     # ([1, 2, 3, 4], 6)
  tri_insertion([1, 2, 3, 4])     # ([1, 2, 3, 4], 3)
  ```
