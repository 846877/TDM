title: Composantes fortement connexes (Tarjan itératif)
level: expert
order: 38
tags: [graphes, algorithmes, pile, dépendances]
summary: Trouver les cycles de dépendances d'un très grand graphe sans récursion.
description: |
  Un graphe orienté est un dictionnaire `{noeud: [successeurs]}` ; un nœud peut n'apparaître
  que comme successeur. Deux nœuds sont dans la même **composante fortement connexe** (CFC)
  si chacun peut atteindre l'autre.

  1. `composantes(graphe)` renvoie la liste des CFC. Chaque composante est une liste
     **triée** de nœuds et la liste des composantes est triée (les nœuds sont comparables).
     En O(V + E), **sans récursion** : un graphe en chaîne de 200 000 nœuds doit fonctionner
     (la récursion Python s'arrête vers 1000 niveaux).
  2. `cycles_de_dependances(graphe)` : on modélise des services (`{"web": ["db", "cache"]}`
     signifie que `web` dépend de `db` et `cache`). Renvoie les composantes qui forment un
     cycle : celles de plus d'un nœud et celles d'un seul nœud qui dépend de lui-même. Même
     format que `composantes`.
  3. `condenser(graphe)` renvoie le **graphe des composantes** : un dictionnaire
     `{composante: successeurs}` où chaque composante est représentée par un `tuple` trié de
     ses nœuds, et ses successeurs par un ensemble de tels tuples (sans boucle sur
     elle-même). Ce graphe est toujours acyclique.

  ```python
  g = {"a": ["b"], "b": ["c"], "c": ["a", "d"], "d": ["e"], "e": ["d"], "f": []}
  composantes(g)        # [["a", "b", "c"], ["d", "e"], ["f"]]
  condenser(g)[("a", "b", "c")]   # {("d", "e")}
  ```
