title: Journaliser avec logging
level: avance
order: 34
tags: [logging, sysadmin, configuration]
summary: Configurer loggers, handlers, formats et niveaux comme dans un vrai script.
description: |
  Utilise le module `logging`.

  1. `creer_logger(nom, flux, niveau="INFO")` crée (ou reconfigure) le logger `nom` :
     - son niveau est `niveau` (nom en texte, insensible à la casse) ;
     - il écrit dans `flux` (un objet fichier, par exemple `io.StringIO`) via un
       `StreamHandler`, au format `"%(levelname)s %(name)s: %(message)s"` ;
     - il ne propage pas ses messages au logger racine (`propagate = False`) ;
     - appelé deux fois avec le même nom, il ne doit **pas** dupliquer les handlers (supprime
       les anciens) ;
     - il renvoie le logger.
  2. `sauvegarder(fichiers, logger)` simule une sauvegarde : `fichiers` est un dictionnaire
     `{nom: taille_en_octets}`. Pour chaque fichier, dans l'ordre :
     - taille négative → `logger.error("taille invalide pour %s", nom)` ;
     - taille 0 → `logger.warning("%s est vide", nom)` ;
     - sinon → `logger.debug("copie de %s (%d octets)", nom, taille)`.

     À la fin : `logger.info("%d fichier(s) sauvegardé(s), %d erreur(s)", ok, erreurs)` où
     `ok` compte les fichiers de taille ≥ 0. Renvoie `ok`.
  3. `compter_niveaux(texte)` reçoit le texte produit (une ligne par message au format
     ci-dessus) et renvoie un dictionnaire `{niveau: nombre}`.

  Utilise le formatage paresseux (`logger.info("... %s", valeur)`), pas des f-strings, dans
  les appels de journalisation.

  ```python
  flux = io.StringIO()
  log = creer_logger("backup", flux, "debug")
  sauvegarder({"a.txt": 10, "vide.txt": 0}, log)
  print(flux.getvalue())
  # DEBUG backup: copie de a.txt (10 octets)
  # WARNING backup: vide.txt est vide
  # INFO backup: 2 fichier(s) sauvegardé(s), 0 erreur(s)
  ```
