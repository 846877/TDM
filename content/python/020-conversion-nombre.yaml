title: Du texte au nombre
level: debutant
order: 20
tags: [types, conversions, chaînes]
summary: Convertir une saisie en int ou en float.
description: |
  Les saisies arrivent toujours sous forme de **texte** (`str`). Écris `en_nombre(texte)` qui
  convertit une chaîne en nombre :

  - les espaces autour sont ignorés ;
  - la virgule française est acceptée comme séparateur décimal ;
  - s'il y a une partie décimale, renvoie un `float`, sinon un `int`.

  ```python
  en_nombre("12")      # 12      (int)
  en_nombre(" 3,5 ")   # 3.5     (float)
  en_nombre("-4")      # -4      (int)
  en_nombre("2.0")     # 2.0     (float)
  ```

  Astuces : `strip()`, `replace()`, `int()`, `float()` et `type(x)` pour vérifier.
starter: |
  def en_nombre(texte):
      pass
tests: |
  def verifier(texte, attendu):
      r = solution.en_nombre(texte)
      assert r == attendu and type(r) is type(attendu), (
          f"en_nombre({texte!r}) : attendu {attendu!r} ({type(attendu).__name__}), "
          f"obtenu {r!r} ({type(r).__name__})")

  def test_entier():
      "\"12\" donne 12 (int)"
      verifier("12", 12)

  def test_virgule():
      "\" 3,5 \" donne 3.5 (float)"
      verifier(" 3,5 ", 3.5)

  def test_point():
      "\"0.25\" donne 0.25 (float)"
      verifier("0.25", 0.25)

  def test_negatif():
      "\"-4\" donne -4 (int)"
      verifier("-4", -4)

  def test_float_rond():
      "\"2.0\" reste un float"
      verifier("2.0", 2.0)
solution: |
  def en_nombre(texte):
      texte = texte.strip().replace(",", ".")
      if "." in texte:
          return float(texte)
      return int(texte)
cours: |
  ## Les types de base

  Toute valeur a un **type**, qu'on obtient avec `type()` :

  ```python
  type(42)        # <class 'int'>
  type(4.2)       # <class 'float'>
  type("42")      # <class 'str'>
  type(True)      # <class 'bool'>
  ```

  `isinstance(x, int)` teste le type de façon plus souple (et gère l'héritage).

  ## Conversions explicites

  | Appel | Résultat |
  |-------|----------|
  | `int("12")` | `12` |
  | `int("12.5")` | `ValueError` ! |
  | `int(12.9)` | `12` (troncature, pas arrondi) |
  | `float("12.5")` | `12.5` |
  | `float("12")` | `12.0` |
  | `str(3.5)` | `"3.5"` |

  `int()` sur une chaîne n'accepte que des chiffres (avec éventuellement un signe et des
  espaces autour). `float()` n'accepte que le **point** comme séparateur décimal : la
  virgule française provoque une `ValueError`.

  ## Nettoyer avant de convertir

  Les méthodes de chaîne renvoient une nouvelle chaîne :

  ```python
  "  bonjour \n".strip()       # "bonjour"
  "1 000".replace(" ", "")     # "1000"
  "a-b-c".replace("-", "+")    # "a+b+c"
  ```

  Elles se **chaînent** : `texte.strip().lower()`.

  ## Décider du type

  Pour choisir entre `int` et `float`, il faut une règle observable sur le texte, par
  exemple la présence d'un séparateur décimal (`"." in texte`). Attention : `"2.0"` doit
  rester un `float` même si sa valeur est entière. C'est le **texte** qui décide, pas la
  valeur.

  Les tests vérifient aussi le type renvoyé (`type(resultat) is int`), pas seulement la
  valeur, car `2 == 2.0` vaut `True` en Python.
