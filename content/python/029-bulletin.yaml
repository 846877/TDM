title: Bulletin de classe
level: debutant
order: 29
tags: [input, listes, boucles, f-string]
summary: Lire plusieurs lignes et produire un petit rapport.
mode: stdio
description: |
  La première ligne contient le nombre d'élèves `n`. Les `n` lignes suivantes contiennent un
  prénom et une note entière séparés par un espace.

  Affiche ensuite trois lignes :

  ```
  Moyenne : 12.33
  Meilleur : Bob (17)
  Admis : 2/3
  ```

  - la moyenne est affichée avec **2 décimales** (`{moyenne:.2f}`) ;
  - le meilleur est le premier élève ayant la note la plus haute ;
  - un élève est admis si sa note est ≥ 10.

  (exemple pour `Alice 12`, `Bob 17`, `Chloé 8`).
starter: |
  n = int(input())
cases:
  - name: "Trois élèves"
    input: "3\nAlice 12\nBob 17\nChloé 8\n"
    output: |
      Moyenne : 12.33
      Meilleur : Bob (17)
      Admis : 2/3
  - name: "Égalité : le premier gagne"
    input: "4\nDan 15\nEve 15\nFlo 10\nGus 9\n"
    output: |
      Moyenne : 12.25
      Meilleur : Dan (15)
      Admis : 3/4
  - name: "Un seul élève"
    input: "1\nZoé 20\n"
    output: |
      Moyenne : 20.00
      Meilleur : Zoé (20)
      Admis : 1/1
solution: |
  n = int(input())
  total = 0
  admis = 0
  meilleur_nom = None
  meilleure_note = -1
  for _ in range(n):
      nom, note = input().split()
      note = int(note)
      total += note
      if note >= 10:
          admis += 1
      if note > meilleure_note:
          meilleur_nom, meilleure_note = nom, note
  print(f"Moyenne : {total / n:.2f}")
  print(f"Meilleur : {meilleur_nom} ({meilleure_note})")
  print(f"Admis : {admis}/{n}")
cours: |
  ## Stocker des enregistrements

  Chaque ligne décrit un élève (un prénom, une note). On peut les stocker dans une liste de
  **tuples** :

  ```python
  eleves = []
  eleves.append(("Alice", 12))
  nom, note = eleves[0]
  ```

  ou traiter les statistiques **au fil de la lecture**, sans tout stocker : somme courante,
  meilleur provisoire, compteur d'admis. La seconde approche consomme moins de mémoire,
  utile sur de gros fichiers.

  ## Le premier meilleur

  « Le premier élève ayant la note la plus haute » : avec le motif du champion provisoire, on
  ne remplace le champion que si la nouvelle note est **strictement** supérieure. Avec `>=`,
  c'est le **dernier** ex-aequo qui gagnerait.

  `max()` accepte un paramètre `key` qui indique sur quoi comparer, et renvoie le premier
  maximum rencontré :

  ```python
  serveurs = [("web1", 40), ("db1", 85), ("web2", 85)]
  max(serveurs, key=lambda s: s[1])   # ("db1", 85)
  ```

  (`lambda` crée une petite fonction anonyme ; on la reverra en détail.)

  ## Compter ceux qui vérifient une condition

  Une variable `admis` incrémentée dans un `if`. En une ligne :
  `sum(1 for nom, note in eleves if note >= 10)`.

  ## Formater les décimales

  `f"{x:.2f}"` affiche **exactement** deux décimales (`12.333…` → `12.33`, `12` →
  `12.00`). C'est un formatage d'affichage : la valeur réelle n'est pas modifiée,
  contrairement à `round`.

  ## Lire `prenom note`

  `prenom, note = input().split()` puis `note = int(note)`. Attention : une note reste du
  texte tant que tu ne l'as pas convertie, et `"9" > "17"` est vrai en comparaison de
  chaînes !
