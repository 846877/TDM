title: Bellman-Ford et cycles négatifs
level: expert
order: 17
tags: [graphes, algorithmes, plus court chemin]
summary: Plus courts chemins avec poids négatifs, et détection d'arbitrage de devises.
description: |
  Dijkstra ne fonctionne pas avec des poids négatifs ; **Bellman-Ford** si, et il sait détecter les
  **cycles de poids négatif**.

  1. `bellman_ford(n, aretes, source)` : sommets numérotés de `0` à `n - 1`, `aretes` est une liste de
     triplets `(u, v, poids)` (arcs **orientés**). Renvoie un couple `(distances, predecesseurs)` :
     - `distances[v]` : distance minimale depuis `source`, ou `math.inf` si `v` est inaccessible ;
     - `predecesseurs[v]` : sommet précédent sur un plus court chemin (`None` pour la source et les
       sommets inaccessibles).

     Si un cycle négatif est **accessible depuis la source**, lève `ValueError` (un cycle négatif
     inaccessible ne gêne pas).

  2. `chemin(predecesseurs, source, cible)` : liste des sommets de `source` à `cible`, ou `None`.

  3. `arbitrage_possible(taux)` : `taux[i][j]` est le nombre d'unités de la devise `j` obtenues pour
     une unité de `i`. Renvoie `True` s'il existe une suite de conversions qui fait gagner de l'argent
     (produit des taux le long d'un cycle `> 1`). Astuce : avec des poids `-log(taux)`, un cycle
     rentable devient un cycle **négatif**. Prévois une tolérance de `1e-9` sur les flottants.

  Rappel : on relâche toutes les arêtes `n - 1` fois ; si une `n`-ième passe améliore encore une
  distance, il y a un cycle négatif.
