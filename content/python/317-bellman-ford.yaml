tests: |
  import math

  ARETES = [(0, 1, 4), (0, 2, 5), (1, 2, -3), (2, 3, 4), (3, 1, 2), (4, 3, 1)]

  def test_distances():
      "Distances avec poids négatifs"
      d, _ = solution.bellman_ford(5, ARETES, 0)
      assert d[:4] == [0, 4, 1, 5], f"distances {d}"
      assert d[4] == math.inf, "le sommet 4 est inaccessible depuis 0"

  def test_predecesseurs():
      "Prédécesseurs et chemin"
      _, p = solution.bellman_ford(5, ARETES, 0)
      assert p[0] is None and p[4] is None
      assert solution.chemin(p, 0, 3) == [0, 1, 2, 3]
      assert solution.chemin(p, 0, 0) == [0]
      assert solution.chemin(p, 0, 4) is None

  def test_cycle_negatif():
      "Cycle négatif accessible : ValueError"
      aretes = [(0, 1, 1), (1, 2, -2), (2, 1, 1), (2, 3, 1)]
      try:
          solution.bellman_ford(4, aretes, 0)
      except ValueError:
          pass
      else:
          raise AssertionError("cycle 1 → 2 → 1 de poids -1 non détecté")

  def test_cycle_inaccessible():
      "Cycle négatif inaccessible : pas d'erreur"
      aretes = [(0, 1, 2), (2, 3, -5), (3, 2, 1)]
      d, _ = solution.bellman_ford(4, aretes, 0)
      assert d[:2] == [0, 2] and d[2] == math.inf and d[3] == math.inf

  def test_sans_arete():
      "Graphe sans arête"
      d, p = solution.bellman_ford(3, [], 1)
      assert d == [math.inf, 0, math.inf] and p == [None, None, None]

  def test_comparaison_dijkstra():
      "Mêmes résultats que Dijkstra sur des poids positifs"
      import heapq, random
      rng = random.Random(4)
      n = 60
      aretes = [(rng.randrange(n), rng.randrange(n), rng.randint(1, 50)) for _ in range(400)]
      dist = [math.inf] * n; dist[0] = 0; tas = [(0, 0)]
      while tas:
          du, u = heapq.heappop(tas)
          if du > dist[u]:
              continue
          for a, b, w in aretes:
              if a == u and du + w < dist[b]:
                  dist[b] = du + w
                  heapq.heappush(tas, (dist[b], b))
      d, p = solution.bellman_ford(n, aretes, 0)
      assert d == dist
      poids = {}
      for a, b, w in aretes:
          poids[(a, b)] = min(w, poids.get((a, b), math.inf))
      for v in range(n):
          c = solution.chemin(p, 0, v)
          if dist[v] < math.inf:
              assert sum(poids[(a, b)] for a, b in zip(c, c[1:])) == dist[v], f"chemin vers {v} incohérent"

  def test_arbitrage():
      "Arbitrage de devises"
      sans = [[1, 0.9, 0.8], [1 / 0.9, 1, 0.8 / 0.9], [1 / 0.8, 0.9 / 0.8, 1]]
      assert solution.arbitrage_possible(sans) is False, "taux cohérents : pas d'arbitrage"
      avec = [[1, 0.9, 0.8], [1.12, 1, 0.9], [1.3, 1.1, 1]]
      assert solution.arbitrage_possible(avec) is True
      assert solution.arbitrage_possible([[1]]) is False
solution: |
  import math


  def bellman_ford(n, aretes, source):
      distances = [math.inf] * n
      predecesseurs = [None] * n
      distances[source] = 0
      for _ in range(n - 1):
          modifie = False
          for u, v, poids in aretes:
              if distances[u] + poids < distances[v]:
                  distances[v] = distances[u] + poids
                  predecesseurs[v] = u
                  modifie = True
          if not modifie:
              break
      for u, v, poids in aretes:
          if distances[u] + poids < distances[v]:
              raise ValueError("cycle de poids négatif accessible depuis la source")
      return distances, predecesseurs


  def chemin(predecesseurs, source, cible):
      resultat = [cible]
      while resultat[-1] != source:
          precedent = predecesseurs[resultat[-1]]
          if precedent is None:
              return None
          resultat.append(precedent)
      return resultat[::-1]


  def arbitrage_possible(taux):
      n = len(taux)
      aretes = [(i, j, -math.log(taux[i][j])) for i in range(n) for j in range(n) if i != j]
      # un sommet virtuel relié à tous permet de détecter n'importe quel cycle
      distances = [0.0] * n
      for _ in range(n):
          for u, v, w in aretes:
              if distances[u] + w < distances[v] - 1e-9:
                  distances[v] = distances[u] + w
      return any(distances[u] + w < distances[v] - 1e-9 for u, v, w in aretes)
cours: |
  ## Pourquoi pas Dijkstra ?

  Dijkstra suppose qu'un sommet extrait a sa distance définitive. Avec un arc négatif, un
  chemin passant par un sommet « lointain » peut finalement être moins cher : l'hypothèse
  tombe. Bellman-Ford ne fait aucune hypothèse de ce genre.

  ## L'algorithme

  On initialise `dist[source] = 0` et l'infini ailleurs, puis on **relâche toutes les
  arêtes**, n − 1 fois :

  ```python
  for _ in range(n - 1):
      for u, v, w in aretes:
          if dist[u] + w < dist[v]:
              dist[v] = dist[u] + w
              pred[v] = u
  ```

  Pourquoi n − 1 ? Un plus court chemin sans cycle a au plus n − 1 arêtes, et après le
  passage k, toutes les distances des chemins d'au plus k arêtes sont correctes. On peut
  s'arrêter plus tôt si un passage ne change rien.

  `math.inf + w` vaut toujours `inf` : les sommets inaccessibles restent à l'infini, mais
  teste quand même `dist[u] != inf` pour éviter de propager des prédécesseurs absurdes.

  ## Détecter un cycle négatif

  Après n − 1 passages, si une arête peut **encore** être relâchée, il existe un cycle de
  poids négatif accessible depuis la source : les distances pourraient diminuer à l'infini.

  ## Arbitrage de devises

  Avec des taux de change, un cycle profitable vérifie `t1 × t2 × … × tk > 1`. Le logarithme
  transforme les produits en sommes : `log(t1) + … + log(tk) > 0`, soit
  `Σ −log(ti) < 0`. Avec des poids `−log(taux)`, un arbitrage est donc un **cycle
  négatif** ! Pour détecter un cycle n'importe où (pas seulement depuis une source), on part
  de toutes les distances à 0 (comme une source virtuelle reliée à tous les sommets). Une
  petite tolérance (`1e-12`) évite les faux positifs dus aux flottants.

  ## Complexité et usage

  O(V × E), plus lent que Dijkstra. Le protocole de routage **RIP** (à vecteur de distance)
  repose sur la version distribuée de Bellman-Ford, et son problème du « comptage à
  l'infini » en est une conséquence directe.
