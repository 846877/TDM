title: Configuration JSON
level: intermediaire
order: 37
tags: [json, dictionnaires, exceptions]
summary: Lire, compléter, valider et écrire une configuration JSON.
description: |
  Utilise le module `json`.

  1. `charger(texte)` analyse un texte JSON qui doit représenter un **objet** et renvoie un
     dictionnaire où les valeurs manquantes sont complétées par celles de
     `DEFAUTS = {"port": 8080, "debug": False, "hotes": []}` (à définir dans ton code).
     Si le JSON est mal formé **ou** n'est pas un objet, lève `ValueError`.
     Le dictionnaire `DEFAUTS` ne doit jamais être modifié (attention à la liste !).
  2. `serveurs_actifs(texte)` reçoit un JSON de la forme
     `{"serveurs": [{"nom": ..., "actif": true/false, "ip": ...}, ...]}` et renvoie la liste
     triée des noms des serveurs actifs. Une clé `actif` absente vaut `true`.
  3. `exporter(config)` renvoie le texte JSON de la configuration, indenté de 2 espaces,
     clés triées, et **avec les accents tels quels** (pas de `é`).

  ```python
  charger('{"port": 443}')
  # {"port": 443, "debug": False, "hotes": []}
  serveurs_actifs('{"serveurs": [{"nom": "web2"}, {"nom": "db", "actif": false}, {"nom": "web1", "actif": true}]}')
  # ["web1", "web2"]
  print(exporter({"nom": "équipe", "port": 22}))
  # {
  #   "nom": "équipe",
  #   "port": 22
  # }
  ```
