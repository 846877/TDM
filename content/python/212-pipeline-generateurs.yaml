title: Pipeline de générateurs
level: avance
order: 12
tags: [générateurs, yield from, itérateurs]
summary: Enchaîner des traitements paresseux sur un flux de données.
description: |
  Les générateurs permettent de traiter des flux énormes (voire infinis) sans tout charger en mémoire.
  Écris les **fonctions génératrices** suivantes ; aucune ne doit construire de liste complète
  de son entrée.

  | Fonction | Rôle |
  |----------|------|
  | `nettoyer(lignes)` | produit chaque ligne sans les espaces de début/fin, en sautant les lignes vides et celles qui commencent par `#` |
  | `decouper(lignes, sep=";")` | produit la liste des champs de chaque ligne (champs nettoyés de leurs espaces) |
  | `par_paquets(iterable, taille)` | produit des listes de `taille` éléments (la dernière peut être plus courte) ; `ValueError` si `taille < 1` |
  | `enchainer(*iterables)` | produit les éléments de chaque itérable à la suite, avec `yield from` |
  | `pipeline(source, *etapes)` | applique les étapes dans l'ordre : `etape3(etape2(etape1(source)))` |

  ```python
  lignes = ["# entête", "a ; 1", "", "b;2"]
  list(pipeline(lignes, nettoyer, decouper))      # [["a", "1"], ["b", "2"]]
  list(par_paquets(range(5), 2))                  # [[0, 1], [2, 3], [4]]
  ```

  La moulinette vérifie que tout reste **paresseux** en branchant une source infinie.
