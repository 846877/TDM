tests: |
  import itertools

  def test_nettoyer():
      "nettoyer saute vides et commentaires"
      r = list(solution.nettoyer(["  a  ", "", "   ", "# x", "  # y", "b"]))
      assert r == ["a", "b"], f"obtenu {r}"

  def test_decouper():
      "decouper sépare et nettoie les champs"
      assert list(solution.decouper(["a ; b;c", "x"])) == [["a", "b", "c"], ["x"]]
      assert list(solution.decouper(["1,2"], sep=",")) == [["1", "2"]]

  def test_paquets():
      "par_paquets regroupe par taille"
      assert list(solution.par_paquets(range(5), 2)) == [[0, 1], [2, 3], [4]]
      assert list(solution.par_paquets([], 3)) == []
      assert list(solution.par_paquets("abc", 3)) == [["a", "b", "c"]]

  def test_paquets_invalide():
      "par_paquets refuse une taille < 1"
      try:
          list(solution.par_paquets([1, 2], 0))
      except ValueError:
          pass
      else:
          raise AssertionError("ValueError attendue")

  def test_enchainer():
      "enchainer met les itérables bout à bout"
      assert list(solution.enchainer([1, 2], (3,), "ab", iter([4]))) == [1, 2, 3, "a", "b", 4]
      assert list(solution.enchainer()) == []

  def test_pipeline():
      "pipeline applique les étapes dans l'ordre"
      lignes = ["# entête", "a ; 1", "", "b;2"]
      assert list(solution.pipeline(lignes, solution.nettoyer, solution.decouper)) == [["a", "1"], ["b", "2"]]
      assert list(solution.pipeline([1, 2, 3])) == [1, 2, 3]

  def test_paresseux():
      "Tout reste paresseux sur une source infinie"
      consommes = []
      def source():
          for i in range(100_000):    # « presque » infinie
              consommes.append(i)
              yield f"l{i};{i}" if i % 3 else "# commentaire"
      paquets = lambda it: solution.par_paquets(it, 2)
      flux = solution.pipeline(source(), solution.nettoyer, solution.decouper, paquets)
      premier = next(iter(flux))
      assert premier == [["l1", "1"], ["l2", "2"]], f"premier paquet : {premier}"
      assert len(consommes) <= 6, f"{len(consommes)} lignes lues pour un seul paquet : pas assez paresseux"

  def test_generateurs():
      "Les fonctions sont des générateurs"
      import inspect
      for nom in ("nettoyer", "decouper", "par_paquets", "enchainer"):
          assert inspect.isgeneratorfunction(getattr(solution, nom)), f"{nom} doit utiliser yield"
solution: |
  def nettoyer(lignes):
      for ligne in lignes:
          ligne = ligne.strip()
          if ligne and not ligne.startswith("#"):
              yield ligne


  def decouper(lignes, sep=";"):
      for ligne in lignes:
          yield [champ.strip() for champ in ligne.split(sep)]


  def par_paquets(iterable, taille):
      if taille < 1:
          raise ValueError("taille doit valoir au moins 1")
      paquet = []
      for element in iterable:
          paquet.append(element)
          if len(paquet) == taille:
              yield paquet
              paquet = []
      if paquet:
          yield paquet


  def enchainer(*iterables):
      for iterable in iterables:
          yield from iterable


  def pipeline(source, *etapes):
      flux = source
      for etape in etapes:
          flux = etape(flux)
      return flux
