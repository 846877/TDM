title: Supprimer les doublons
level: intermediaire
order: 7
tags: [listes, ensembles]
summary: Garder l'ordre d'apparition.
description: |
  Écris `dedoublonner(elements)` qui renvoie une nouvelle liste sans doublons, **en conservant
  l'ordre de la première apparition**.

  ```python
  dedoublonner([3, 1, 3, 2, 1])  # [3, 1, 2]
  ```

  Attention : `list(set(...))` ne garde pas l'ordre !
starter: |
  def dedoublonner(elements):
      pass
tests: |
  def test_ordre():
      "L'ordre est conservé"
      assert solution.dedoublonner([3, 1, 3, 2, 1]) == [3, 1, 2]

  def test_chaines():
      "Avec des chaînes"
      assert solution.dedoublonner(["b", "a", "b"]) == ["b", "a"]

  def test_original_intact():
      "La liste d'origine n'est pas modifiée"
      original = [1, 1, 2]
      solution.dedoublonner(original)
      assert original == [1, 1, 2]

  def test_performance():
      "Rapide sur 200 000 éléments"
      assert len(solution.dedoublonner(list(range(100000)) * 2)) == 100000
solution: |
  def dedoublonner(elements):
      vus = set()
      resultat = []
      for e in elements:
          if e not in vus:
              vus.add(e)
              resultat.append(e)
      return resultat
cours: |
  ## Les ensembles (`set`)

  Un `set` est une collection **sans doublons** et **sans ordre garanti** :

  ```python
  s = {3, 1, 3, 2}      # {1, 2, 3}
  s.add(5)
  2 in s                # True, en temps constant
  vide = set()          # attention : {} crée un dict vide !
  ```

  Le test d'appartenance `in` sur un set est en **O(1)** en moyenne, contre **O(n)** sur
  une liste (qui doit être parcourue). C'est la raison principale d'utiliser un set.

  ## Garder l'ordre

  `list(set(elements))` supprime bien les doublons mais l'ordre du résultat est
  imprévisible. Pour conserver l'ordre de première apparition, on parcourt la liste en
  retenant ce qu'on a **déjà vu** :

  - si l'élément n'a pas encore été vu, on l'ajoute au résultat et on le marque comme vu ;
  - sinon, on l'ignore.

  Utiliser une **liste** pour « déjà vu » donne un algorithme en O(n²) (chaque `in`
  parcourt la liste) ; utiliser un **set** donne O(n). Sur 100 000 éléments, la différence
  se compte en secondes.

  ## L'astuce des dictionnaires

  Depuis Python 3.7, les dictionnaires conservent l'ordre d'insertion et leurs clés sont
  uniques :

  ```python
  list(dict.fromkeys(["b", "a", "b"]))   # ["b", "a"]
  ```

  C'est idiomatique et rapide, mais comprends d'abord la version explicite.

  ## Hachabilité

  Sets et clés de dict exigent des éléments **hachables** (immuables) : nombres, chaînes,
  tuples. Une liste ne peut pas être mise dans un set (`TypeError: unhashable type`). Pour
  dédoublonner des listes, on les convertit en tuples.
