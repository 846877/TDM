title: contextlib en pratique
level: avance
order: 33
tags: [with, contextlib, context manager, générateurs]
summary: Écrire des gestionnaires de contexte avec @contextmanager et ExitStack.
description: |
  Utilise le module `contextlib`.

  1. `dossier_courant(chemin)` : gestionnaire de contexte (avec `@contextmanager`) qui se
     place dans le dossier `chemin` (`os.chdir`) et revient au dossier précédent à la sortie,
     **même en cas d'exception**. `with ... as p` donne le chemin du dossier (chaîne).
  2. `variable_env(nom, valeur)` : définit temporairement une variable d'environnement
     (`os.environ`) ; à la sortie, restaure l'ancienne valeur ou supprime la variable si elle
     n'existait pas. Si `valeur` vaut `None`, la variable est supprimée pendant le bloc.
  3. `chronometre(journal)` : mesure la durée du bloc avec `time.perf_counter()` ; `as`
     renvoie un dictionnaire dont la clé `"duree"` (secondes, float) est remplie à la sortie
     (y compris en cas d'exception) ; à la sortie, la fonction ajoute aussi ce dictionnaire à
     la liste `journal`.
  4. `ouvrir_tous(chemins)` : ouvre tous les fichiers de la liste en lecture (UTF-8) avec un
     `ExitStack` et renvoie la liste de leurs contenus. Si l'ouverture d'un fichier échoue,
     tous les fichiers **déjà ouverts** doivent être fermés avant que l'exception se propage.
     Pour le vérifier, la fonction ouvre les fichiers avec `ouvrir(chemin)` — une fonction
     module-level que tu définis comme `open(chemin, encoding="utf-8")` (la moulinette la
     remplace pour espionner les fermetures).

  ```python
  with dossier_courant("/tmp") as d:
      print(os.getcwd())     # /tmp
  with variable_env("LANG", "C"):
      ...
  ```
