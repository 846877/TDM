title: Échanger deux valeurs
level: debutant
order: 14
tags: [variables, tuples]
summary: Découvrir l'affectation multiple et les tuples.
description: |
  En Python, une fonction peut renvoyer **plusieurs valeurs** à la fois : elles sont regroupées
  dans un **tuple**.

  1. Écris `echanger(a, b)` qui renvoie le tuple `(b, a)`.
  2. Écris `min_max(a, b)` qui renvoie le tuple `(plus_petit, plus_grand)`.

  ```python
  echanger(1, "x")   # ("x", 1)
  min_max(8, 3)      # (3, 8)
  ```

  Astuce : `a, b = b, a` échange deux variables en une seule ligne.
starter: |
  def echanger(a, b):
      pass


  def min_max(a, b):
      pass
tests: |
  def test_echanger():
      "echanger(1, 2) vaut (2, 1)"
      r = solution.echanger(1, 2)
      assert r == (2, 1), f"attendu (2, 1), obtenu {r!r}"

  def test_echanger_types():
      "Fonctionne avec des types différents"
      r = solution.echanger(1, "x")
      assert r == ("x", 1), f"attendu ('x', 1), obtenu {r!r}"

  def test_tuple():
      "Le résultat est bien un tuple"
      r = solution.echanger(3, 4)
      assert isinstance(r, tuple), f"il faut renvoyer un tuple, pas un {type(r).__name__}"

  def test_min_max():
      "min_max(8, 3) vaut (3, 8)"
      assert solution.min_max(8, 3) == (3, 8)
      assert solution.min_max(3, 8) == (3, 8), "l'ordre des arguments ne doit pas compter"

  def test_min_max_egaux():
      "Deux valeurs égales"
      assert solution.min_max(5, 5) == (5, 5)
solution: |
  def echanger(a, b):
      return b, a


  def min_max(a, b):
      if a <= b:
          return a, b
      return b, a
cours: |
  ## Les tuples

  Un tuple est une séquence **non modifiable**, écrite avec des virgules (les parenthèses
  sont souvent facultatives) :

  ```python
  point = (3, 4)
  point[0]          # 3
  couleur = 255, 128, 0     # aussi un tuple
  singleton = (5,)          # la virgule est obligatoire pour un seul élément
  ```

  `point[0] = 7` lève une `TypeError` : un tuple ne se modifie pas. On les utilise pour
  regrouper des valeurs qui vont ensemble (coordonnées, résultat multiple…).

  ## Déballage (unpacking)

  On peut affecter les éléments d'un tuple à plusieurs variables d'un coup :

  ```python
  x, y = point          # x = 3, y = 4
  nom, age = "Ada", 36
  ```

  Le nombre de variables doit correspondre au nombre d'éléments, sinon `ValueError`.

  ## Renvoyer plusieurs valeurs

  Une fonction qui écrit `return a, b` renvoie en réalité **un seul** objet : un tuple.
  L'appelant peut le déballer :

  ```python
  def division(a, b):
      return a // b, a % b

  quotient, reste = division(17, 5)   # 3, 2
  ```

  La fonction intégrée `divmod` fait exactement cela.

  ## L'échange de variables

  Dans beaucoup de langages, échanger deux variables demande une variable temporaire.
  En Python, le côté droit d'une affectation est entièrement évalué (sous forme de tuple)
  **avant** d'être déballé à gauche, ce qui rend l'échange en une ligne possible et sûr.

  ## Comparer des valeurs

  Pour ordonner deux valeurs, une condition `if a <= b` suffit ; tu peux aussi utiliser
  `min()` et `max()`. Pense au cas d'égalité : le résultat doit rester cohérent.
