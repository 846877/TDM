title: Nombres premiers
level: intermediaire
order: 3
tags: [boucles, algorithmes]
summary: Lister les nombres premiers jusqu'à n.
description: |
  Écris `premiers(n)` qui renvoie la liste croissante des nombres premiers **inférieurs ou égaux** à `n`.

  ```python
  premiers(20)  # [2, 3, 5, 7, 11, 13, 17, 19]
  ```

  Bonus : regarde le *crible d'Ératosthène*, la moulinette teste aussi `premiers(100000)` en temps limité.
starter: |
  def premiers(n):
      pass
tests: |
  def test_vingt():
      "premiers(20)"
      assert solution.premiers(20) == [2, 3, 5, 7, 11, 13, 17, 19]

  def test_petits():
      "premiers(1) et premiers(2)"
      assert solution.premiers(1) == []
      assert solution.premiers(2) == [2]

  def test_rapide():
      "Il y a 9592 nombres premiers sous 100 000"
      assert len(solution.premiers(100000)) == 9592
solution: |
  def premiers(n):
      if n < 2:
          return []
      crible = [True] * (n + 1)
      crible[0] = crible[1] = False
      for i in range(2, int(n ** 0.5) + 1):
          if crible[i]:
              crible[i * i::i] = [False] * len(crible[i * i::i])
      return [i for i, ok in enumerate(crible) if ok]
cours: |
  ## Tester un nombre

  Un nombre premier est un entier ≥ 2 divisible uniquement par 1 et par lui-même. Méthode
  naïve : essayer tous les diviseurs de 2 à n − 1. Amélioration décisive : si `n = a × b`
  avec `a ≤ b`, alors `a ≤ √n`. Il suffit donc de tester les diviseurs jusqu'à **√n**.

  ```python
  import math
  math.isqrt(50)   # 7 : racine carrée entière, sans flottants
  ```

  Tester chaque nombre jusqu'à n de cette façon coûte environ O(n √n) : trop lent pour
  n = 100 000 dans une moulinette avec limite de temps.

  ## Le crible d'Ératosthène

  Plutôt que de tester chaque nombre, on **raye les multiples** :

  1. on crée un tableau de booléens `est_premier[0..n]`, initialisé à `True` (sauf 0 et 1) ;
  2. pour chaque nombre `p` encore marqué premier, on raye ses multiples ;
  3. à la fin, les cases restées à `True` sont les nombres premiers.

  Deux optimisations : on peut commencer à rayer à partir de `p * p` (les multiples plus
  petits ont déjà été rayés par un facteur plus petit), et on peut s'arrêter dès que
  `p * p > n`.

  ```python
  marques = [True] * 11          # liste de 11 booléens
  for k in range(4, 11, 2):      # rayer les multiples de 2 à partir de 4
      marques[k] = False
  ```

  Complexité : **O(n log log n)**, quasiment linéaire. C'est l'un des plus vieux algorithmes
  connus (IIIᵉ siècle av. J.-C.) et toujours l'un des meilleurs pour cette tâche.

  ## Échanger mémoire contre temps

  Le crible utilise O(n) mémoire pour gagner énormément de temps : c'est un compromis
  classique en algorithmique. Pour des n gigantesques, on utilise des cribles segmentés.

  **Cas limites** : n < 2 doit renvoyer une liste vide.
