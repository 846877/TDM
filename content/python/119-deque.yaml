title: Fenêtre glissante avec deque
level: intermediaire
order: 19
tags: [collections, deque, algorithmes]
summary: Utiliser une file à double extrémité.
description: |
  `collections.deque` est une liste optimisée pour ajouter et retirer aux **deux bouts**.
  `deque(maxlen=k)` oublie automatiquement les éléments les plus anciens.

  1. `moyennes_glissantes(valeurs, k)` : renvoie la liste des moyennes de chaque fenêtre de `k`
     valeurs consécutives, arrondies à 2 décimales. Si `k` est plus grand que la liste, renvoie
     `[]`. Si `k <= 0`, lève `ValueError`.
  2. `tourner(liste, n)` : renvoie une **nouvelle liste** décalée de `n` positions vers la droite
     (`n` négatif = vers la gauche). Astuce : `deque.rotate(n)`.
  3. `derniers(iterable, n)` : renvoie la liste des `n` derniers éléments d'un itérable
     quelconque (même un générateur).

  ```python
  moyennes_glissantes([1, 2, 3, 4, 5], 3)   # [2.0, 3.0, 4.0]
  tourner([1, 2, 3, 4], 1)                  # [4, 1, 2, 3]
  derniers(range(10), 3)                    # [7, 8, 9]
  ```
