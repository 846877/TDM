tests: |
  def test_moyennes():
      "Fenêtres de 3"
      r = solution.moyennes_glissantes([1, 2, 3, 4, 5], 3)
      assert r == [2.0, 3.0, 4.0], f"obtenu {r!r}"

  def test_moyennes_arrondi():
      "Arrondi à 2 décimales"
      r = solution.moyennes_glissantes([1, 2, 2, 5], 3)
      assert r == [1.67, 3.0], f"obtenu {r!r}"

  def test_moyennes_trop_grand():
      "k plus grand que la liste"
      assert solution.moyennes_glissantes([1, 2], 3) == []

  def test_moyennes_k_invalide():
      "k <= 0 -> ValueError"
      try:
          solution.moyennes_glissantes([1, 2], 0)
      except ValueError:
          return
      raise AssertionError("k = 0 aurait dû lever ValueError")

  def test_tourner():
      "Rotation à droite et à gauche"
      assert solution.tourner([1, 2, 3, 4], 1) == [4, 1, 2, 3]
      assert solution.tourner([1, 2, 3, 4], -1) == [2, 3, 4, 1]
      assert solution.tourner([1, 2, 3], 4) == [3, 1, 2], "une rotation plus grande que la liste boucle"

  def test_tourner_copie():
      "tourner renvoie une nouvelle liste"
      l = [1, 2, 3]
      r = solution.tourner(l, 1)
      assert l == [1, 2, 3], "la liste d'origine ne doit pas être modifiée"
      assert isinstance(r, list), f"attendu une list, obtenu {type(r).__name__}"

  def test_derniers():
      "Derniers éléments d'un générateur"
      r = solution.derniers((x * x for x in range(6)), 2)
      assert r == [16, 25], f"obtenu {r!r}"
      assert solution.derniers([1], 5) == [1]
solution: |
  from collections import deque


  def moyennes_glissantes(valeurs, k):
      if k <= 0:
          raise ValueError("k doit être positif")
      fenetre = deque(maxlen=k)
      resultat = []
      for v in valeurs:
          fenetre.append(v)
          if len(fenetre) == k:
              resultat.append(round(sum(fenetre) / k, 2))
      return resultat


  def tourner(liste, n):
      d = deque(liste)
      d.rotate(n)
      return list(d)


  def derniers(iterable, n):
      return list(deque(iterable, maxlen=n))
cours: |
  ## Une file à deux bouts

  `deque` (*double-ended queue*) ajoute et retire en **O(1)** aux deux extrémités, là où une
  liste est en O(n) pour `insert(0, x)` ou `pop(0)` (tous les éléments sont décalés).

  ```python
  from collections import deque
  d = deque([1, 2, 3])
  d.append(4)        # à droite
  d.appendleft(0)    # à gauche
  d.pop()            # 4
  d.popleft()        # 0
  d.rotate(1)        # deque([3, 1, 2])
  ```

  C'est la structure idéale pour une **file d'attente** (FIFO) : `append` pour entrer,
  `popleft` pour sortir. Par contre, l'accès par indice au milieu est en O(n).

  ## Taille maximale

  Avec `maxlen`, une deque pleine éjecte automatiquement l'élément du côté opposé :

  ```python
  historique = deque(maxlen=3)
  for cmd in ["ls", "cd", "pwd", "top"]:
      historique.append(cmd)
  historique   # deque(['cd', 'pwd', 'top'], maxlen=3)
  ```

  C'est exactement ce que fait `tail -n 3` sur un fichier : garder les N dernières lignes
  sans tout charger en mémoire, quelle que soit la taille de l'entrée (fonctionne donc avec
  un générateur infini… tant qu'il finit par s'arrêter).

  ## Fenêtre glissante

  Une fenêtre de taille `k` qui avance d'un cran : un élément entre, le plus ancien sort.
  Recalculer la somme de toute la fenêtre à chaque pas coûte O(k) par pas. Astuce : garder
  une **somme courante**, à laquelle on ajoute l'entrant et retire le sortant : O(1) par pas,
  O(n) au total. Le premier résultat n'est disponible qu'une fois la fenêtre remplie.

  ## Valider les paramètres

  Une taille de fenêtre nulle ou négative n'a pas de sens : lever `ValueError` tout de suite
  est préférable à un résultat absurde ou à une division par zéro plus loin.

  `rotate(n)` décale vers la droite pour `n > 0`, vers la gauche pour `n < 0`.
