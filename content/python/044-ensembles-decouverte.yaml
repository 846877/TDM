title: Découvrir les ensembles
level: debutant
order: 44
tags: [ensembles, set, chaînes]
summary: Utiliser set pour éliminer les doublons et comparer des collections.
description: |
  Les ensembles (`set`) ne contiennent jamais de doublon et testent l'appartenance très
  rapidement.

  1. `nb_distincts(elements)` renvoie le nombre de valeurs différentes.
  2. `a_des_doublons(elements)` renvoie `True` si une valeur apparaît plusieurs fois.
  3. `lettres_communes(mot1, mot2)` renvoie la **chaîne** des lettres présentes dans les deux
     mots, sans doublon, **triées** par ordre alphabétique (en minuscules).
  4. `machines_a_installer(inventaire, installees)` reçoit deux listes de noms de machines et
     renvoie la liste **triée** des machines de l'inventaire qui ne sont pas encore
     installées.

  ```python
  nb_distincts([3, 1, 3, 2, 1])                 # 3
  a_des_doublons(["a", "b", "a"])               # True
  lettres_communes("Réseau", "serveur")         # "ersu"
  machines_a_installer(["pc1", "pc2", "pc3"], ["pc2"])   # ["pc1", "pc3"]
  ```
