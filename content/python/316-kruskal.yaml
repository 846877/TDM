title: Arbre couvrant minimal (Kruskal)
level: expert
order: 16
tags: [graphes, algorithmes, union-find, stdin]
summary: Relier toutes les villes au moindre coût.
mode: stdio
description: |
  On veut relier `n` villes (numérotées de 1 à `n`) par un réseau de câbles de coût total minimal.
  Ton programme lit sur l'entrée standard :

  - une ligne `n m` (nombre de villes, nombre de liaisons possibles) ;
  - `m` lignes `u v w` : une liaison possible entre `u` et `v` de coût `w` (entier, éventuellement
    négatif : une subvention !). Il peut y avoir plusieurs liaisons entre deux villes, et même des
    boucles `u u w` (inutiles).

  Si toutes les villes peuvent être reliées, affiche :

  ```
  poids total: <coût de l'arbre couvrant minimal>
  aretes: <nombre de liaisons utilisées, soit n - 1>
  ```

  sinon affiche `impossible: <k> composantes`, où `k` est le nombre de groupes de villes reliables.

  **Algorithme de Kruskal** : trier les liaisons par coût croissant, puis les prendre une à une en
  ignorant celles qui créeraient un cycle. Pour détecter les cycles efficacement, utilise une
  structure **Union-Find** (voir l'exercice précédent). La moulinette teste un graphe de 300 villes
  et environ 1 800 liaisons.

  Astuce : `sys.stdin.read().split()` lit toute l'entrée d'un coup.
starter: |
  import sys

  donnees = sys.stdin.read().split()
cases:
  - name: Petit graphe
    input: |
      4 5
      1 2 1
      2 3 4
      1 3 3
      3 4 2
      2 4 5
    output: |
      poids total: 6
      aretes: 3
  - name: Graphe non connexe
    input: |
      5 2
      1 2 3
      4 5 1
    output: |
      impossible: 3 composantes
  - name: Une seule ville
    input: |
      1 0
    output: |
      poids total: 0
      aretes: 0
  - name: Coûts négatifs et boucle
    input: |
      3 4
      1 2 -5
      2 3 2
      1 3 -1
      1 1 -100
    output: |
      poids total: -6
      aretes: 2
  - name: Liaisons multiples
    input: |
      3 3
      1 2 7
      1 2 3
      2 3 4
    output: |
      poids total: 7
      aretes: 2
