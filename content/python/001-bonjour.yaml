cours: |
  ## La fonction `print()`

  `print()` affiche ses arguments sur la sortie standard, suivis d'un retour à la ligne.

  ```python
  print("Salut")            # Salut
  print("a", "b", sep="-")  # a-b
  print("sans retour", end="")
  ```

  - Une **chaîne de caractères** (`str`) s'écrit entre guillemets simples ou doubles.
  - `sep` choisit le séparateur entre les arguments (une espace par défaut), `end` ce qui est écrit à la fin.
