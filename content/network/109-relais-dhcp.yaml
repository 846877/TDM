title: Relais DHCP
level: intermediaire
order: 9
device: router
hostname: R-SITE
tags: [dhcp, ip helper-address, inter-vlan]
summary: Faire parvenir les requêtes DHCP à un serveur centralisé.
description: |
  Une requête DHCP est un **broadcast** : elle ne traverse pas les routeurs. Le serveur DHCP
  de l'entreprise (`10.10.10.5`) est au datacenter, pas dans les VLAN des utilisateurs.

  Le routeur doit **relayer** les requêtes avec `ip helper-address` sur les interfaces côté clients :

  - `G0/0.10` (VLAN 10, utilisateurs) et `G0/0.20` (VLAN 20, Wi-Fi) → relais vers `10.10.10.5` ;
  - **pas** sur `G0/0.99` : le VLAN de gestion est en adressage statique.
initial: |
  interface g0/0
  no shutdown
  interface g0/0.10
  encapsulation dot1Q 10
  ip address 192.168.10.1 255.255.255.0
  interface g0/0.20
  encapsulation dot1Q 20
  ip address 192.168.20.1 255.255.255.0
  interface g0/0.99
  encapsulation dot1Q 99
  ip address 192.168.99.1 255.255.255.0
  interface g0/1
  ip address 10.0.0.2 255.255.255.252
  no shutdown
checks:
  - desc: Relais DHCP sur G0/0.10
    expr: '"10.10.10.5" in intf("g0/0.10").helper_addresses'
    hint: "interface g0/0.10 puis ip helper-address 10.10.10.5"
  - desc: Relais DHCP sur G0/0.20
    expr: '"10.10.10.5" in intf("g0/0.20").helper_addresses'
  - desc: Pas de relais sur le VLAN de gestion
    expr: not intf("g0/0.99").helper_addresses
solution: |
  configure terminal
  interface g0/0.10
  ip helper-address 10.10.10.5
  interface g0/0.20
  ip helper-address 10.10.10.5
  end
cours: |
  ## Le problème du broadcast

  Un client DHCP qui démarre n'a pas d'adresse : il envoie un **DHCP Discover** en broadcast
  (`255.255.255.255`). Or un routeur **ne transmet pas** les broadcasts d'un réseau à l'autre.
  Si le serveur DHCP est centralisé dans la salle serveurs, les clients des autres VLAN ne
  l'atteignent jamais.

  ### Le relais DHCP

  Sur l'interface (ou la sous-interface, ou la SVI) qui sert de passerelle aux clients, on
  configure l'adresse du serveur :

  ```
  R1(config)# interface gi0/1.40
  R1(config-subif)# ip helper-address 172.16.100.25
  R1(config-subif)# interface gi0/1.50
  R1(config-subif)# ip helper-address 172.16.100.25
  R1# show ip interface gi0/1.40 | include Helper
    Helper address is 172.16.100.25
  ```

  Le routeur :

  1. reçoit le broadcast DHCP du client ;
  2. le retransmet en **unicast** au serveur, en indiquant son adresse dans le champ `giaddr`
     (adresse de la passerelle du client) ;
  3. le serveur choisit le **pool** correspondant à ce `giaddr` et répond au relais, qui
     renvoie la réponse au client.

  ### À configurer côté serveur

  - un pool (une étendue) **par réseau** relayé, avec la bonne passerelle ;
  - une **route retour** vers chaque réseau de clients.

  ### Ce que relaie ip helper-address

  Par défaut, `ip helper-address` relaie aussi d'autres broadcasts UDP (TFTP 69, DNS 53, TACACS
  49, NetBIOS 137/138...). `no ip forward-protocol udp <port>` restreint si nécessaire.

  ### Pièges fréquents

  - Mettre le relais sur l'interface **côté serveur** au lieu du côté clients.
  - Relayer un VLAN qui ne doit pas recevoir de DHCP (gestion en adresses fixes).
  - Oublier le pool correspondant sur le serveur : le client reste en APIPA (169.254.x.x).

  ### Pour le CCNA

  Le fonctionnement du relais DHCP et la commande `ip helper-address` sont au programme des
  services IP.
