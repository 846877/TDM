title: Documenter les interfaces
level: debutant
order: 7
device: switch
hostname: SW-ACCUEIL
tags: [interface, description, documentation]
summary: Décrire chaque port pour s'y retrouver lors d'un dépannage.
description: |
  Un technicien doit pouvoir savoir **ce qui est branché** sur un port sans descendre au local
  informatique. On utilise pour cela la commande `description` en mode interface.

  Documente les ports du switch de l'accueil :

  | Port     | Description          |
  |----------|----------------------|
  | `Fa0/1`  | `PC-ACCUEIL-1`       |
  | `Fa0/2`  | `PC-ACCUEIL-2`       |
  | `Fa0/10` | `IMPRIMANTE-ACCUEIL` |
  | `Gi0/1`  | `UPLINK-SW-DIST`     |

  ```
  interface fa0/1
   description PC-ACCUEIL-1
  ```

  Vérifie avec `show interfaces description` (la colonne *Description*).
checks:
  - desc: Fa0/1 décrit « PC-ACCUEIL-1 »
    expr: intf("fa0/1").description == "PC-ACCUEIL-1"
    hint: "interface fa0/1 puis description PC-ACCUEIL-1"
  - desc: Fa0/2 décrit « PC-ACCUEIL-2 »
    expr: intf("fa0/2").description == "PC-ACCUEIL-2"
  - desc: Fa0/10 décrit « IMPRIMANTE-ACCUEIL »
    expr: intf("fa0/10").description == "IMPRIMANTE-ACCUEIL"
  - desc: Gi0/1 décrit « UPLINK-SW-DIST »
    expr: intf("g0/1").description == "UPLINK-SW-DIST"
    hint: "Le port Gigabit s'abrège g0/1 : interface g0/1"
solution: |
  configure terminal
  interface fa0/1
  description PC-ACCUEIL-1
  interface fa0/2
  description PC-ACCUEIL-2
  interface fa0/10
  description IMPRIMANTE-ACCUEIL
  interface g0/1
  description UPLINK-SW-DIST
  end
