title: Router-on-a-stick
level: intermediaire
order: 4
device: router
hostname: R1
tags: [inter-vlan, sous-interfaces, 802.1q]
summary: Router entre VLAN avec des sous-interfaces.
description: |
  Le port `G0/0` du routeur est relié au trunk d'un switch. Configure le routage inter-VLAN :

  | Sous-interface | VLAN | Adresse          |
  |----------------|------|------------------|
  | `G0/0.10`      | 10   | 192.168.10.1/24  |
  | `G0/0.20`      | 20   | 192.168.20.1/24  |
  | `G0/0.99`      | 99   | 192.168.99.1/24  |

  ```
  interface g0/0.10
   encapsulation dot1Q 10
   ip address 192.168.10.1 255.255.255.0
  ```

  N'oublie pas d'activer l'interface **physique** `G0/0`.
checks:
  - desc: G0/0 activée
    expr: not intf("g0/0").shutdown
  - desc: G0/0.10 en VLAN 10 avec 192.168.10.1/24
    expr: intf("g0/0.10").encapsulation_vlan == 10 and intf("g0/0.10").ip == "192.168.10.1" and prefix(intf("g0/0.10").mask) == 24
  - desc: G0/0.20 en VLAN 20 avec 192.168.20.1/24
    expr: intf("g0/0.20").encapsulation_vlan == 20 and intf("g0/0.20").ip == "192.168.20.1" and prefix(intf("g0/0.20").mask) == 24
  - desc: G0/0.99 en VLAN 99 avec 192.168.99.1/24
    expr: intf("g0/0.99").encapsulation_vlan == 99 and intf("g0/0.99").ip == "192.168.99.1" and prefix(intf("g0/0.99").mask) == 24
solution: |
  configure terminal
  interface g0/0
  no shutdown
  interface g0/0.10
  encapsulation dot1Q 10
  ip address 192.168.10.1 255.255.255.0
  interface g0/0.20
  encapsulation dot1Q 20
  ip address 192.168.20.1 255.255.255.0
  interface g0/0.99
  encapsulation dot1Q 99
  ip address 192.168.99.1 255.255.255.0
  end
cours: |
  ## Router entre VLAN avec une seule interface

  Les VLAN sont isolés : pour qu'un poste du VLAN 40 parle à un serveur du VLAN 50, il faut un
  routeur. Plutôt que d'utiliser une interface physique par VLAN, on relie le routeur au switch
  par **un trunk** et on crée une **sous-interface** par VLAN : c'est le *router-on-a-stick*.

  Chaque sous-interface :

  - reçoit et émet les trames **étiquetées** d'un VLAN (`encapsulation dot1Q <vlan>`) ;
  - porte l'adresse IP qui sert de **passerelle** aux hôtes de ce VLAN.

  ### Configuration (autres valeurs)

  ```
  R1(config)# interface gi0/1
  R1(config-if)# no shutdown
  R1(config-if)# interface gi0/1.40
  R1(config-subif)# encapsulation dot1Q 40
  R1(config-subif)# ip address 172.16.40.1 255.255.255.0
  R1(config-subif)# interface gi0/1.50
  R1(config-subif)# encapsulation dot1Q 50
  R1(config-subif)# ip address 172.16.50.1 255.255.255.0
  R1# show ip interface brief | include Gig
  R1# show interfaces gi0/1.40
  ```

  Côté switch, le port vers le routeur est un **trunk** qui autorise ces VLAN.

  ### Points clés

  - le numéro de sous-interface (`.40`) est libre, mais le faire correspondre au VLAN évite les
    erreurs ;
  - c'est l'`encapsulation dot1Q` qui associe le VLAN, **pas** le numéro ;
  - `no shutdown` se fait sur l'interface **physique** : les sous-interfaces suivent son état ;
  - pour le VLAN natif : `encapsulation dot1Q 99 native`.

  ### Limites

  Tout le trafic inter-VLAN passe deux fois sur le même lien (aller vers le routeur, retour vers
  le switch) : le lien devient un goulot d'étranglement. Dans un réseau d'entreprise, on préfère
  un **switch de niveau 3** avec des SVI.

  ### Pièges fréquents

  - Oublier `encapsulation dot1Q` : impossible de mettre une adresse IP.
  - Port du switch en mode access au lieu de trunk.
  - Passerelle des PC différente de l'adresse de la sous-interface.

  ### Pour le CCNA

  Le router-on-a-stick et le routage inter-VLAN par SVI sont tous deux au programme.
