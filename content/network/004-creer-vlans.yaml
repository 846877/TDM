title: Créer des VLAN
level: debutant
order: 4
device: switch
tags: [vlan]
summary: Segmenter le réseau en VLAN nommés.
description: |
  L'entreprise veut séparer ses services. Crée les VLAN suivants :

  | ID | Nom      |
  |----|----------|
  | 10 | ADMIN    |
  | 20 | COMPTA   |
  | 30 | INVITES  |

  ```
  vlan 10
   name ADMIN
  ```

  Contrôle avec `show vlan brief`.
checks:
  - desc: VLAN 10 nommé ADMIN
    expr: vlan(10) == "ADMIN"
  - desc: VLAN 20 nommé COMPTA
    expr: vlan(20) == "COMPTA"
  - desc: VLAN 30 nommé INVITES
    expr: vlan(30) == "INVITES"
solution: |
  configure terminal
  vlan 10
  name ADMIN
  vlan 20
  name COMPTA
  vlan 30
  name INVITES
  end
cours: |
  ## Pourquoi des VLAN ?

  Sans VLAN, tous les ports d'un switch forment un seul **domaine de diffusion** : un broadcast
  (ARP, DHCP) atteint tous les postes, et tout le monde peut communiquer directement avec tout le
  monde. Un **VLAN** (*Virtual LAN*) découpe le switch en plusieurs réseaux logiques isolés :

  - **sécurité** : la comptabilité n'est pas sur le même réseau que les invités ;
  - **performance** : les broadcasts restent dans leur VLAN ;
  - **souplesse** : un utilisateur change de bureau, on change son VLAN, pas le câblage.

  Pour passer d'un VLAN à l'autre, il faut un **routeur** (ou un switch de niveau 3) : chaque VLAN
  correspond en général à un sous-réseau IP.

  ### Plages de numéros

  | Plage       | Usage                                                  |
  |-------------|--------------------------------------------------------|
  | 1           | VLAN par défaut (ne peut pas être supprimé)            |
  | 2-1001      | plage normale                                          |
  | 1002-1005   | réservés (anciennes technologies Token Ring/FDDI)      |
  | 1006-4094   | plage étendue (VTP transparent ou version 3)           |

  ### Créer et nommer (autres valeurs)

  ```
  SW1(config)# vlan 40
  SW1(config-vlan)# name PRODUCTION
  SW1(config-vlan)# vlan 50
  SW1(config-vlan)# name LABO
  SW1(config-vlan)# end
  SW1# show vlan brief
  VLAN Name                 Status    Ports
  1    default              active    Fa0/1, Fa0/2, ...
  40   PRODUCTION           active
  50   LABO                 active
  ```

  Les VLAN sont enregistrés dans le fichier `vlan.dat` (flash), pas seulement dans la
  configuration courante. Un nom clair facilite le dépannage ; il doit être identique sur tous
  les switchs.

  ### Pièges fréquents

  - Créer un VLAN ne lui affecte **aucun port** : c'est l'étape suivante (`switchport access
    vlan`).
  - Supprimer un VLAN qui contient des ports : ils deviennent inactifs.
  - Utiliser le VLAN 1 pour les utilisateurs ou la gestion : déconseillé (il sert aussi aux
    protocoles de contrôle).

  ### Pour le CCNA

  Créer, nommer et vérifier des VLAN fait partie des bases du domaine « accès réseau ».
