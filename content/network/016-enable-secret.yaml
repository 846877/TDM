title: enable password ou enable secret ?
level: debutant
order: 16
device: router
hostname: R-ACCUEIL
tags: [mots de passe, enable secret, sécurité]
summary: Remplacer un mot de passe privilégié stocké en clair par un secret haché.
description: |
  Sur `R-ACCUEIL`, le mode privilégié est protégé par un `enable password` : affiche
  `show running-config | include enable` et constate qu'il apparaît **en clair**.

  1. configure à la place un **secret haché** : `enable secret Acc3ss!Priv` ;
  2. supprime l'ancien mot de passe : `no enable password` ;
  3. le mot de passe de la console est lui aussi en clair : chiffre les mots de passe
     restants avec `service password-encryption`.

  Vérifie à nouveau avec `show running-config | include enable|password`.
initial: |
  enable password cisco123
  line console 0
  password cisco
  login
checks:
  - desc: enable secret configuré à « Acc3ss!Priv »
    expr: d.enable_secret == "Acc3ss!Priv"
  - desc: L'ancien enable password est supprimé
    expr: d.enable_password is None and d.enable_secret is not None
    hint: "no enable password"
  - desc: Les mots de passe en clair restants sont chiffrés
    expr: d.password_encryption
    hint: "service password-encryption"
solution: |
  configure terminal
  enable secret Acc3ss!Priv
  no enable password
  service password-encryption
  end
cours: |
  ## Protéger le mode privilégié

  Le mode privilégié (`R1#`) donne accès à **toute** la configuration : c'est la première chose
  à protéger. IOS propose deux commandes historiques :

  | Commande          | Stockage dans la configuration                         | À utiliser ? |
  |-------------------|--------------------------------------------------------|--------------|
  | `enable password` | en clair, ou « type 7 » avec `service password-encryption` | non        |
  | `enable secret`   | haché (type 5 MD5, ou 8/9 sur les IOS récents)          | **oui**      |

  Le **type 7** n'est qu'un brouillage réversible : des sites web le décodent en une seconde.
  Il sert seulement à empêcher la lecture « par-dessus l'épaule ». Un **hachage** (type 5, 8 ou 9)
  ne se déchiffre pas : on ne peut que tenter de deviner le mot de passe.

  Si les deux commandes sont présentes, IOS utilise `enable secret` et ignore `enable password`.
  Laisser l'ancien mot de passe en place est donc inutile... et dangereux : il apparaît dans
  chaque sauvegarde de configuration.

  ### Syntaxe

  ```
  R1(config)# enable secret M0nS3cret!
  R1(config)# no enable password
  R1(config)# service password-encryption
  R1(config)# do show running-config | include enable
  enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
  ```

  `service password-encryption` chiffre (en type 7) les mots de passe qui restent en clair :
  lignes console et VTY, `username ... password`. Ce n'est qu'une protection légère, mais elle
  évite qu'un mot de passe s'affiche à l'écran lors d'une démonstration.

  Sur les IOS récents, on peut choisir un algorithme plus robuste :
  `enable algorithm-type scrypt secret M0nS3cret!` (type 9).

  ### Pièges fréquents

  - Taper `enable secret` puis le **même** mot de passe que l'`enable password` : IOS l'accepte
    mais l'audit le signale.
  - Oublier que `no service password-encryption` ne « déchiffre » pas les mots de passe déjà
    chiffrés : il cesse seulement de chiffrer les suivants.
  - Perdre le secret : il faut alors une procédure de récupération de mot de passe (registre
    de configuration `0x2142`), avec un accès physique à l'équipement.

  ### Pour le CCNA

  Retiens la hiérarchie : **type 0** (clair) < **type 7** (réversible) < **type 5** (MD5)
  < **type 8/9** (PBKDF2/scrypt). L'examen demande de savoir pourquoi `enable secret` est
  préféré et ce que fait réellement `service password-encryption`.
