title: Routage par politique (PBR) pour le Wi-Fi invités
level: avance
order: 21
device: router
hostname: R-SITE
tags: [pbr, route-map, acl, double accès internet]
summary: Envoyer le trafic Internet des invités vers un second accès, sans toucher au reste.
description: |
  `R-SITE` a deux accès Internet : la fibre principale (`203.0.113.1`, route par défaut) et une
  ligne secondaire bon marché (`198.51.100.1` sur `G0/2`). La direction veut que les **invités**
  (`192.168.30.0/24`, sous-interface `G0/0.30`) sortent **par la ligne secondaire**, sans
  modifier la table de routage.

  1. ACL étendue numérotée `120` :
     - `deny` des invités vers `192.168.0.0/16` (le trafic interne garde le routage normal) ;
     - `permit` des invités vers tout le reste ;
  2. route-map `PBR-INVITES` séquence `10` : correspondance sur l'ACL `120`, saut suivant
     `198.51.100.1` ;
  3. applique la politique **en entrée** de `G0/0.30` uniquement.

  Contrôle avec `show route-map` et `show ip policy`.
initial: |
  interface g0/0
  no shutdown
  interface g0/0.10
  encapsulation dot1Q 10
  ip address 192.168.10.1 255.255.255.0
  interface g0/0.30
  encapsulation dot1Q 30
  ip address 192.168.30.1 255.255.255.0
  interface g0/1
  ip address 203.0.113.2 255.255.255.252
  no shutdown
  interface g0/2
  ip address 198.51.100.2 255.255.255.252
  no shutdown
  ip route 0.0.0.0 0.0.0.0 203.0.113.1
checks:
  - desc: ACL 120 (deny interne, permit le reste)
    expr: acl(120) == ["deny ip 192.168.30.0 0.0.0.255 192.168.0.0 0.0.255.255", "permit ip 192.168.30.0 0.0.0.255 any"]
  - desc: Route-map PBR-INVITES 10 sur l'ACL 120
    expr: rmap("PBR-INVITES", 10).action == "permit" and rmap("PBR-INVITES", 10).matches == ["ip address 120"]
  - desc: Saut suivant 198.51.100.1
    expr: rmap("PBR-INVITES", 10).sets == ["ip next-hop 198.51.100.1"]
  - desc: Politique appliquée sur G0/0.30 seulement, route par défaut inchangée
    expr: intf("g0/0.30").policy_route_map == "PBR-INVITES" and intf("g0/0.10").policy_route_map is None and route("0.0.0.0", "0.0.0.0", "203.0.113.1")
solution: |
  configure terminal
  access-list 120 deny ip 192.168.30.0 0.0.0.255 192.168.0.0 0.0.255.255
  access-list 120 permit ip 192.168.30.0 0.0.0.255 any
  route-map PBR-INVITES permit 10
  match ip address 120
  set ip next-hop 198.51.100.1
  exit
  interface g0/0.30
  ip policy route-map PBR-INVITES
  end
cours: |
  ## Router selon autre chose que la destination

  Le routage classique ne regarde que l'**adresse de destination** et la table de routage. Le
  **PBR** (*Policy-Based Routing*) permet de choisir le chemin selon d'autres critères : adresse
  source, protocole, port, taille du paquet... Cas d'usage typiques :

  - faire sortir un réseau (invités, sauvegardes) par un lien différent ;
  - envoyer le trafic web vers un proxy ou un pare-feu particulier ;
  - marquer ou rediriger un flux pour une analyse.

  ### Les trois éléments

  1. une **ACL** qui sélectionne le trafic concerné ;
  2. une **route-map** : `match ip address <acl>` + `set ip next-hop <adresse>` (ou
     `set interface`, `set ip default next-hop`) ;
  3. l'application **en entrée** de l'interface où arrive le trafic :
     `ip policy route-map <nom>`. Pour le trafic généré par le routeur lui-même :
     `ip local policy route-map <nom>`.

  ```
  R1(config)# access-list 150 permit tcp 10.40.0.0 0.0.255.255 any eq 873
  R1(config)# route-map SAUVEGARDES permit 10
  R1(config-route-map)# match ip address 150
  R1(config-route-map)# set ip next-hop 10.99.0.2
  R1(config)# interface gi0/0.40
  R1(config-if)# ip policy route-map SAUVEGARDES
  R1# show ip policy
  Interface      Route map
  Gi0/0.40       SAUVEGARDES
  R1# show route-map SAUVEGARDES
  route-map SAUVEGARDES, permit, sequence 10
    Match clauses: ip address (access-lists): 150
    Set clauses: ip next-hop 10.99.0.2
    Policy routing matches: 1532 packets, 1904221 bytes
  ```

  ### Que devient le trafic qui ne correspond pas ?

  - paquet **refusé par l'ACL** (ou séquence `deny` de la route-map) → **routage normal** : c'est
    ainsi que l'on garde le trafic interne sur son chemin habituel ;
  - le PBR ne jette jamais un paquet ; si le saut suivant n'est pas joignable (interface tombée),
    le paquet suit la table de routage.

  `set ip next-hop verify-availability` (avec IP SLA) permet de vérifier que le saut suivant
  répond vraiment.

  ### Pièges fréquents

  - Appliquer `ip policy` en **sortie** : cela n'existe pas, la politique est toujours en entrée.
  - Oublier de laisser le trafic interne en routage normal : les invités ne joignent plus leur
    passerelle DNS interne ou l'imprimante.
  - Oublier le NAT sur le second accès : les paquets sortent avec une adresse privée.

  ### Pour le CCNP ENCOR

  Le PBR fait partie des outils de manipulation du chemin étudiés dans ENCOR, avec les
  route-maps et la redistribution.
