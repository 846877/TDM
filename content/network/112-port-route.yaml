title: Port routé vers le cœur de réseau
level: intermediaire
order: 12
device: switch
hostname: SW-ETG2
tags: [no switchport, niveau 3, routage]
summary: Transformer un port de switch en interface de routeur.
description: |
  Entre un switch de distribution et le cœur de réseau, on préfère un **lien routé** à un trunk :
  pas de spanning tree, convergence rapide. Sur un switch multicouche, `no switchport`
  transforme un port de niveau 2 en port **routé**, qui accepte une adresse IP.

  1. Active le routage : `ip routing` ;
  2. sur `Gi0/1` :
     - description `LIEN-CORE`,
     - `no switchport`,
     - adresse `10.0.0.2/30` ;
  3. route par défaut vers le cœur : `10.0.0.1`.
checks:
  - desc: Routage IPv4 activé
    expr: d.ip_routing
  - desc: Gi0/1 est un port routé
    expr: not intf("g0/1").is_switchport
    hint: "interface g0/1 puis no switchport"
  - desc: Gi0/1 en 10.0.0.2/30 avec la description LIEN-CORE
    expr: intf("g0/1").ip == "10.0.0.2" and prefix(intf("g0/1").mask) == 30 and intf("g0/1").description == "LIEN-CORE"
    hint: "L'adresse IP n'est acceptée qu'après no switchport."
  - desc: Route par défaut vers 10.0.0.1
    expr: route("0.0.0.0", "0.0.0.0", "10.0.0.1")
solution: |
  configure terminal
  ip routing
  interface g0/1
  description LIEN-CORE
  no switchport
  ip address 10.0.0.2 255.255.255.252
  exit
  ip route 0.0.0.0 0.0.0.0 10.0.0.1
  end
cours: |
  ## Port de switch ou interface de routeur ?

  Sur un switch multicouche, chaque port physique peut être :

  - un **port de commutation** (`switchport`) : access ou trunk, appartient à des VLAN ;
  - un **port routé** (`no switchport`) : il devient une interface de routeur, avec sa propre
    adresse IP, sans VLAN ni spanning tree.

  Le port routé est idéal pour les **liens point à point** entre switchs de distribution et de
  cœur : chaque lien est un petit réseau /30 (ou /31), le protocole de routage choisit les
  chemins, et aucun VLAN ne s'étend entre les bâtiments.

  ### Configuration (autres valeurs)

  ```
  SW-DIST(config)# ip routing
  SW-DIST(config)# interface gi1/0/48
  SW-DIST(config-if)# description VERS-CORE2-Gi1/0/3
  SW-DIST(config-if)# no switchport
  SW-DIST(config-if)# ip address 10.255.1.6 255.255.255.252
  SW-DIST(config-if)# exit
  SW-DIST(config)# ip route 0.0.0.0 0.0.0.0 10.255.1.5
  SW-DIST# show interfaces gi1/0/48 switchport
  Switchport: Disabled
  SW-DIST# show ip interface brief | include 1/0/48
  ```

  `no switchport` efface la configuration de commutation du port (VLAN, trunk) ; l'inverse
  (`switchport`) efface son adresse IP.

  ### SVI ou port routé ?

  | SVI (`interface vlan`)                  | Port routé                           |
  |-----------------------------------------|--------------------------------------|
  | passerelle d'un VLAN de plusieurs ports | lien vers **un** équipement          |
  | dépend de l'état des ports du VLAN      | dépend de l'état du port seulement   |
  | STP actif dans le VLAN                  | pas de STP sur le lien               |

  Un port routé tombe dès que le câble est coupé : le protocole de routage converge
  immédiatement, sans attendre de timers STP.

  ### Pièges fréquents

  - Oublier `ip routing` : le switch ne route pas.
  - Configurer l'IP sur un port encore en `switchport` : `% Invalid input`.
  - Les switchs d'accès (2960) ne supportent pas `no switchport` : il faut un modèle de
    niveau 3.

  ### Pour le CCNA / CCNP ENCOR

  La différence entre SVI et ports routés, et les conceptions « routées jusqu'à la
  distribution », sont étudiées dans les deux examens.
