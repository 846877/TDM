title: Routage statique IPv6
level: avance
order: 9
device: router
hostname: R-V6
tags: [ipv6, routage, static]
summary: Activer le routage IPv6 et écrire des routes statiques.
description: |
  Les interfaces IPv6 de `R-V6` sont configurées, mais le routeur ne route pas encore.

  1. active le routage IPv6 ;
  2. route vers le réseau du labo `2001:db8:acad:30::/64` via le routeur `2001:db8:acad:ff::2` ;
  3. route vers le réseau des serveurs `2001:db8:acad:40::/64` via ce même routeur ;
  4. route par défaut IPv6 (`::/0`) vers le FAI `2001:db8:feed::1`.

  ```
  ipv6 route 2001:db8:acad:30::/64 2001:db8:acad:ff::2
  ```

  Contrôle avec `show ipv6 route`.
initial: |
  interface g0/0
  ipv6 address 2001:db8:acad:10::1/64
  no shutdown
  interface g0/1
  ipv6 address 2001:db8:acad:ff::1/64
  no shutdown
  interface g0/2
  ipv6 address 2001:db8:feed::2/64
  no shutdown
checks:
  - desc: Routage IPv6 activé
    expr: d.ipv6_routing
    hint: "ipv6 unicast-routing"
  - desc: Route vers 2001:db8:acad:30::/64 via 2001:db8:acad:ff::2
    expr: route6("2001:db8:acad:30::/64", "2001:db8:acad:ff::2")
  - desc: Route vers 2001:db8:acad:40::/64 via 2001:db8:acad:ff::2
    expr: route6("2001:db8:acad:40::/64", "2001:db8:acad:ff::2")
  - desc: Route par défaut IPv6 vers 2001:db8:feed::1
    expr: route6("::/0", "2001:db8:feed::1")
    hint: "ipv6 route ::/0 2001:db8:feed::1"
solution: |
  configure terminal
  ipv6 unicast-routing
  ipv6 route 2001:db8:acad:30::/64 2001:db8:acad:ff::2
  ipv6 route 2001:db8:acad:40::/64 2001:db8:acad:ff::2
  ipv6 route ::/0 2001:db8:feed::1
  end
cours: |
  ## Le routage IPv6 sur IOS

  Par défaut, un routeur Cisco traite IPv6 comme un simple **hôte** : il peut avoir des adresses
  IPv6 mais ne transmet pas les paquets entre interfaces. `ipv6 unicast-routing` active le
  routage IPv6 **et** l'envoi des annonces de routeur (RA) qui permettent aux postes de trouver
  leur passerelle.

  Les routes statiques IPv6 suivent la même logique qu'en IPv4, avec la notation
  **préfixe/longueur** :

  ```
  ipv6 route <préfixe/longueur> {saut-suivant | interface [link-local]} [distance]
  ```

  ### Exemple (autres valeurs)

  ```
  R1(config)# ipv6 unicast-routing
  R1(config)# ipv6 route 2001:db8:beef:50::/64 2001:db8:beef:ff::6
  R1(config)# ipv6 route 2001:db8:beef:60::/64 2001:db8:beef:ff::6
  R1(config)# ipv6 route ::/0 2001:db8:f00d::1
  R1# show ipv6 route static
  S   ::/0 [1/0]
       via 2001:DB8:F00D::1
  S   2001:DB8:BEEF:50::/64 [1/0]
       via 2001:DB8:BEEF:FF::6
  R1# ping 2001:db8:beef:50::10
  R1# traceroute 2001:db8:beef:50::10
  ```

  - `::/0` est la route par défaut IPv6 (équivalent de `0.0.0.0/0`) ;
  - le saut suivant peut être une adresse **globale** du voisin, ou son adresse **link-local**
    accompagnée de l'interface de sortie (obligatoire, car une link-local n'est unique que sur
    un lien) ;
  - la correspondance la plus longue et la distance administrative fonctionnent comme en IPv4.

  ### Vérifier

  - `show ipv6 interface brief` : interfaces et adresses ;
  - `show ipv6 route` : codes `C` (connecté), `L` (adresse locale /128), `S` (statique) ;
  - `show ipv6 neighbors` : l'équivalent IPv6 de la table ARP (protocole NDP).

  ### Pièges fréquents

  - Oublier `ipv6 unicast-routing` : les routes sont acceptées mais rien n'est transmis.
  - Saut suivant link-local sans interface : refusé.
  - Oublier la route retour sur le routeur voisin.

  ### Pour le CCNA

  La configuration et la vérification des routes statiques IPv6 sont au programme, au même titre
  qu'en IPv4.
