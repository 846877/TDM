title: Sécuriser les accès
level: debutant
order: 2
device: switch
tags: [mots de passe, sécurité]
summary: Mot de passe privilégié, console et chiffrement.
description: |
  Un switch sans mot de passe, c'est une porte ouverte. Configure :

  1. le mot de passe du mode privilégié **chiffré** : `class` (`enable secret`) ;
  2. la **ligne console** : mot de passe `cisco` et demande d'authentification (`login`) ;
  3. le **chiffrement** de tous les mots de passe en clair (`service password-encryption`).

  Vérifie le résultat avec `show running-config`.
checks:
  - desc: enable secret configuré à « class »
    expr: d.enable_secret == "class"
  - desc: Mot de passe console « cisco »
    expr: line("console").password == "cisco"
  - desc: Authentification demandée sur la console
    expr: line("console").login == "login"
    hint: "Dans line console 0, tape login"
  - desc: Mots de passe chiffrés
    expr: d.password_encryption
solution: |
  configure terminal
  enable secret class
  line console 0
  password cisco
  login
  exit
  service password-encryption
  end
cours: |
  ## Protéger chaque porte d'entrée

  Un équipement neuf n'a aucun mot de passe : quiconque branche un câble console obtient le
  contrôle total. On protège trois accès :

  1. le passage au **mode privilégié** (`enable`) ;
  2. la **ligne console** (accès physique) ;
  3. les **lignes VTY** (accès à distance, voir les exercices Telnet/SSH).

  ### enable secret ou enable password ?

  | Commande          | Stockage                                  |
  |-------------------|-------------------------------------------|
  | `enable password` | en clair (ou chiffrement faible type 7)   |
  | `enable secret`   | **haché** (MD5 type 5, ou scrypt type 9 sur IOS récents) |

  Si les deux existent, `enable secret` l'emporte. On n'utilise que `enable secret`.

  ### Configuration (autres valeurs)

  ```
  SW1(config)# enable secret Pr1v-Atelier
  SW1(config)# line console 0
  SW1(config-line)# password C0ns0le!
  SW1(config-line)# login
  SW1(config-line)# exit
  SW1(config)# service password-encryption
  SW1# show running-config | section line con
  line con 0
   password 7 0822455D0A165445415F59
   login
  ```

  - `password` définit le mot de passe de la ligne, **`login`** demande de le saisir : sans
    `login`, le mot de passe n'est jamais demandé ;
  - `service password-encryption` chiffre (type 7) les mots de passe affichés en clair dans la
    configuration : cela évite la lecture par-dessus l'épaule, mais le type 7 se déchiffre en
    quelques secondes avec des outils publics. Ce n'est pas une vraie protection.

  ### Vérifier

  Ressors avec `exit` jusqu'à `Press RETURN to get started` : la console doit demander le mot de
  passe, puis `enable` doit demander le secret.

  ### Pièges fréquents

  - `password` sans `login` (ou l'inverse : `login` sans mot de passe → `% Login disabled on
    line`, plus d'accès console).
  - Utiliser le même mot de passe partout.
  - Croire que le type 7 est sûr : préférer des comptes locaux avec `secret` (exercice
    « comptes utilisateurs locaux »).

  ### Pour le CCNA

  La sécurisation de base (enable secret, console, chiffrement des mots de passe) est au
  programme du domaine « sécurité ».
