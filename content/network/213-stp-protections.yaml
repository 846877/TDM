title: Protéger le spanning tree
level: avance
order: 13
device: switch
hostname: SW-DIST
tags: [stp, root guard, bpdu guard, portfast]
summary: Fixer le pont racine et empêcher qu'on le détrône.
description: |
  `SW-DIST` doit rester le **pont racine** des VLAN utilisateurs, quoi qu'on branche ailleurs.

  1. passe en Rapid PVST+ ;
  2. pont racine **primaire** des VLAN `10` et `20` (`spanning-tree vlan 10,20 root primary`) et
     **secondaire** du VLAN `30` (le switch voisin est racine du 30) ;
  3. active PortFast et BPDU Guard **par défaut** sur tous les ports d'accès :
     `spanning-tree portfast default` et `spanning-tree portfast bpduguard default` ;
  4. `Fa0/23` et `Fa0/24` vont vers des switchs gérés par un prestataire : active le **Root Guard**
     (`spanning-tree guard root`) pour qu'ils ne puissent jamais devenir racine.

  Contrôle avec `show spanning-tree summary`.
initial: |
  vlan 10
  vlan 20
  vlan 30
checks:
  - desc: Mode rapid-pvst
    expr: d.stp_mode == "rapid-pvst"
  - desc: Racine primaire des VLAN 10 et 20 (priorité 24576 ou moins)
    expr: d.stp_priority.get(10, 32768) <= 24576 and d.stp_priority.get(20, 32768) <= 24576
  - desc: Racine secondaire du VLAN 30 (priorité 28672)
    expr: d.stp_priority.get(30) == 28672
    hint: "spanning-tree vlan 30 root secondary"
  - desc: PortFast et BPDU Guard activés par défaut
    expr: d.stp_portfast_default and d.stp_bpduguard_default
  - desc: Root Guard sur Fa0/23 et Fa0/24 uniquement
    expr: all(i.stp_guard == "root" for i in ports("fa0/23-24")) and not any(i.stp_guard for i in ports("fa0/1-22"))
solution: |
  configure terminal
  spanning-tree mode rapid-pvst
  spanning-tree vlan 10,20 root primary
  spanning-tree vlan 30 root secondary
  spanning-tree portfast default
  spanning-tree portfast bpduguard default
  interface range fa0/23 - 24
  spanning-tree guard root
  end
cours: |
  ## Protéger la topologie STP

  Le spanning tree fait confiance à tous les BPDU qu'il reçoit. Un switch branché sur une prise
  murale avec une priorité basse peut devenir **pont racine** : tout le trafic de l'étage
  passerait alors par ce petit switch, voire par un attaquant. Plusieurs protections existent :

  | Fonction                       | Où l'activer                 | Effet                                  |
  |--------------------------------|------------------------------|----------------------------------------|
  | PortFast                       | ports d'accès                | passage immédiat en forwarding         |
  | **BPDU Guard**                 | ports d'accès (PortFast)     | BPDU reçu → port err-disabled          |
  | **Root Guard**                 | ports vers les switchs en aval | BPDU supérieur reçu → port bloqué (root-inconsistent) |
  | Loop Guard                     | ports bloqués / racine       | perte de BPDU → port bloqué plutôt que forwarding |

  ### Configuration (autres valeurs)

  ```
  SW-DIST(config)# spanning-tree mode rapid-pvst
  SW-DIST(config)# spanning-tree vlan 40,50 root primary
  SW-DIST(config)# spanning-tree vlan 60 root secondary
  SW-ACC(config)# spanning-tree portfast default
  SW-ACC(config)# spanning-tree portfast bpduguard default
  SW-DIST(config)# interface range gi1/0/10 - 12
  SW-DIST(config-if-range)# spanning-tree guard root
  SW-DIST# show spanning-tree inconsistentports
  SW-ACC# show spanning-tree summary
  ```

  - `portfast default` active PortFast sur **tous les ports d'accès** (pas sur les trunks) ;
  - `portfast bpduguard default` active BPDU Guard sur tous les ports PortFast ;
  - `root primary` / `root secondary` : racine et racine de secours (priorités 24576 et 28672) ;
  - Root Guard sur les ports qui mènent vers les switchs d'accès : ils ne pourront jamais devenir
    chemin vers la racine. Le port se rétablit seul quand les BPDU supérieurs cessent.

  ### Pièges fréquents

  - Root Guard sur le port **vers** la racine : il bloque le chemin légitime.
  - PortFast sur un port qui relie un switch.
  - Oublier la racine de secours : à la panne de la racine, l'élection redevient aléatoire.

  ### Pour le CCNA

  PortFast, BPDU Guard et le choix du pont racine sont au programme ; Root Guard et Loop Guard
  sont détaillés dans ENCOR.
