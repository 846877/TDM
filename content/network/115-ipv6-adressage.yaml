title: Adressage IPv6 d'un routeur
level: intermediaire
order: 15
device: router
hostname: R-V6
tags: [ipv6, adressage, link-local]
summary: Configurer des adresses globales et link-local.
description: |
  L'entreprise a obtenu le préfixe `2001:db8:acad::/48`. Prépare le routeur du siège :

  1. active le routage IPv6 : `ipv6 unicast-routing` (sans cela le routeur se comporte comme un hôte) ;
  2. adresses globales :

  | Interface | Adresse globale            | Link-local |
  |-----------|----------------------------|------------|
  | `G0/0`    | `2001:db8:acad:10::1/64`   | `fe80::1`  |
  | `G0/1`    | `2001:db8:acad:20::1/64`   | `fe80::1`  |

  3. une adresse link-local fixe et facile à retenir : `ipv6 address fe80::1 link-local` ;
  4. active les deux interfaces.

  ```
  interface g0/0
   ipv6 address 2001:db8:acad:10::1/64
   ipv6 address fe80::1 link-local
  ```

  Vérifie avec `show ipv6 interface brief`.
checks:
  - desc: Routage IPv6 activé
    expr: d.ipv6_routing
  - desc: G0/0 en 2001:db8:acad:10::1/64
    expr: ipv6("g0/0", "2001:db8:acad:10::1/64")
  - desc: G0/1 en 2001:db8:acad:20::1/64
    expr: ipv6("g0/1", "2001:db8:acad:20::1/64")
  - desc: Link-local fe80::1 sur les deux interfaces
    expr: intf("g0/0").ipv6_link_local == "fe80::1" and intf("g0/1").ipv6_link_local == "fe80::1"
    hint: "ipv6 address fe80::1 link-local"
  - desc: Les deux interfaces sont activées
    expr: not intf("g0/0").shutdown and not intf("g0/1").shutdown
solution: |
  configure terminal
  ipv6 unicast-routing
  interface g0/0
  ipv6 address 2001:db8:acad:10::1/64
  ipv6 address fe80::1 link-local
  no shutdown
  interface g0/1
  ipv6 address 2001:db8:acad:20::1/64
  ipv6 address fe80::1 link-local
  no shutdown
  end
