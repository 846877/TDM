title: Faire évoluer un trunk
level: intermediaire
order: 6
device: switch
hostname: SW-ET1
tags: [trunk, vlan natif, dtp, sécurité]
summary: Ajouter un VLAN sans tout casser et sécuriser le VLAN natif.
description: |
  Le trunk `Gi0/1` vers le switch de distribution transporte déjà les VLAN `10`, `20` et `99`.
  La direction déploie la visioconférence sur un nouveau VLAN.

  1. Crée le VLAN `30` nommé `VISIO` ;
  2. **ajoute** le VLAN 30 au trunk **sans retaper la liste** :
     `switchport trunk allowed vlan add 30`
     (taper `switchport trunk allowed vlan 30` remplacerait toute la liste et couperait les autres VLAN !) ;
  3. bonne pratique de sécurité contre le *VLAN hopping* : crée le VLAN `999` nommé `NATIF`,
     inutilisé, et fais-en le **VLAN natif** du trunk ;
  4. désactive la négociation DTP sur le trunk : `switchport nonegotiate`.

  Contrôle avec `show interfaces trunk`.
initial: |
  vlan 10
  name ADMIN
  vlan 20
  name COMPTA
  vlan 99
  name MGMT
  interface g0/1
  switchport mode trunk
  switchport trunk allowed vlan 10,20,99
checks:
  - desc: VLAN 30 nommé VISIO
    expr: vlan(30) == "VISIO"
  - desc: Le trunk autorise exactement 10, 20, 30 et 99
    expr: intf("g0/1").allowed_vlans() == {10, 20, 30, 99}
    hint: "switchport trunk allowed vlan add 30 (sans add, la liste est remplacée)"
  - desc: VLAN 999 NATIF créé et utilisé comme VLAN natif
    expr: vlan(999) == "NATIF" and intf("g0/1").native_vlan == 999
  - desc: DTP désactivé sur le trunk
    expr: intf("g0/1").nonegotiate and intf("g0/1").mode == "trunk"
solution: |
  configure terminal
  vlan 30
  name VISIO
  vlan 999
  name NATIF
  interface g0/1
  switchport trunk allowed vlan add 30
  switchport trunk native vlan 999
  switchport nonegotiate
  end
cours: |
  ## Ajouter un VLAN à un trunk en production

  La commande `switchport trunk allowed vlan <liste>` **remplace** entièrement la liste. Sur un
  trunk qui transporte déjà 10, 20 et 99, taper `allowed vlan 30` coupe instantanément les VLAN
  10, 20 et 99 de tout un étage. Pour modifier la liste sans la retaper :

  | Commande                                  | Effet                         |
  |-------------------------------------------|-------------------------------|
  | `switchport trunk allowed vlan add 45`    | ajoute le 45                  |
  | `switchport trunk allowed vlan remove 45` | retire le 45                  |
  | `switchport trunk allowed vlan except 1`  | tous sauf le 1                |
  | `switchport trunk allowed vlan all`       | revient à tous                |

  Le VLAN doit aussi **exister** sur les deux switchs.

  ### Sécuriser le VLAN natif

  Le VLAN natif circule **sans étiquette**. Laissé sur le VLAN 1 (qui contient souvent des
  ports d'utilisateurs), il permet l'attaque de **double étiquetage** (*VLAN hopping*) : un
  attaquant envoie une trame avec deux étiquettes ; le premier switch retire l'étiquette du
  natif et transmet la trame, qui arrive dans le VLAN de la seconde étiquette. Parade :

  - un VLAN natif **dédié et inutilisé** (aucun port d'accès dedans) ;
  - le même VLAN natif aux deux extrémités ;
  - désactiver DTP (`switchport nonegotiate`) pour empêcher un poste de négocier un trunk.

  ### Exemple (autres valeurs)

  ```
  SW1(config)# vlan 45
  SW1(config-vlan)# name IMPRESSION
  SW1(config)# vlan 990
  SW1(config-vlan)# name NATIF-NON-UTILISE
  SW1(config)# interface gi0/2
  SW1(config-if)# switchport trunk allowed vlan add 45
  SW1(config-if)# switchport trunk native vlan 990
  SW1(config-if)# switchport nonegotiate
  SW1# show interfaces gi0/2 trunk
  ```

  Si le VLAN natif est modifié d'un seul côté, CDP signale `NATIVE_VLAN_MISMATCH` jusqu'à ce que
  l'autre côté soit aligné.

  ### Pièges fréquents

  - Oublier `add` (coupure).
  - Changer le natif d'un côté seulement.
  - Mettre `nonegotiate` sur un port en `dynamic` : refusé, il faut d'abord forcer le mode.

  ### Pour le CCNA

  La sécurité des trunks (VLAN natif, DTP) fait partie du domaine « sécurité » de l'examen.
