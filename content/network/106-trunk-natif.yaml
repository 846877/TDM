title: Faire évoluer un trunk
level: intermediaire
order: 6
device: switch
hostname: SW-ET1
tags: [trunk, vlan natif, dtp, sécurité]
summary: Ajouter un VLAN sans tout casser et sécuriser le VLAN natif.
description: |
  Le trunk `Gi0/1` vers le switch de distribution transporte déjà les VLAN `10`, `20` et `99`.
  La direction déploie la visioconférence sur un nouveau VLAN.

  1. Crée le VLAN `30` nommé `VISIO` ;
  2. **ajoute** le VLAN 30 au trunk **sans retaper la liste** :
     `switchport trunk allowed vlan add 30`
     (taper `switchport trunk allowed vlan 30` remplacerait toute la liste et couperait les autres VLAN !) ;
  3. bonne pratique de sécurité contre le *VLAN hopping* : crée le VLAN `999` nommé `NATIF`,
     inutilisé, et fais-en le **VLAN natif** du trunk ;
  4. désactive la négociation DTP sur le trunk : `switchport nonegotiate`.

  Contrôle avec `show interfaces trunk`.
initial: |
  vlan 10
  name ADMIN
  vlan 20
  name COMPTA
  vlan 99
  name MGMT
  interface g0/1
  switchport mode trunk
  switchport trunk allowed vlan 10,20,99
checks:
  - desc: VLAN 30 nommé VISIO
    expr: vlan(30) == "VISIO"
  - desc: Le trunk autorise exactement 10, 20, 30 et 99
    expr: intf("g0/1").allowed_vlans() == {10, 20, 30, 99}
    hint: "switchport trunk allowed vlan add 30 (sans add, la liste est remplacée)"
  - desc: VLAN 999 NATIF créé et utilisé comme VLAN natif
    expr: vlan(999) == "NATIF" and intf("g0/1").native_vlan == 999
  - desc: DTP désactivé sur le trunk
    expr: intf("g0/1").nonegotiate and intf("g0/1").mode == "trunk"
solution: |
  configure terminal
  vlan 30
  name VISIO
  vlan 999
  name NATIF
  interface g0/1
  switchport trunk allowed vlan add 30
  switchport trunk native vlan 999
  switchport nonegotiate
  end
