title: Éteindre les ports inutilisés
level: debutant
order: 8
device: switch
hostname: SW-ATELIER
tags: [shutdown, interface range, sécurité]
summary: Désactiver en une fois tous les ports qui ne servent pas.
description: |
  Sur un switch, tous les ports sont **actifs par défaut** : n'importe qui peut brancher un PC
  sur une prise libre. Bonne pratique : éteindre les ports non utilisés.

  À l'atelier, seuls `Fa0/1` à `Fa0/10` et l'uplink `Gi0/1` sont câblés.

  1. Sélectionne `Fa0/11` à `Fa0/24` avec `interface range fa0/11 - 24` ;
  2. donne-leur la description `NON-UTILISE` ;
  3. désactive-les avec `shutdown` ;
  4. fais de même pour `Gi0/2`.

  Les ports utilisés doivent rester actifs. Contrôle avec `show interfaces status`
  (les ports éteints apparaissent en *disabled*).
checks:
  - desc: Fa0/11 à Fa0/24 sont éteints
    expr: all(i.shutdown for i in ports("fa0/11-24"))
    hint: "interface range fa0/11 - 24 puis shutdown"
  - desc: Gi0/2 est éteint
    expr: intf("g0/2").shutdown
  - desc: Les ports éteints portent la description NON-UTILISE
    expr: all(i.description == "NON-UTILISE" for i in ports("fa0/11-24")) and intf("g0/2").description == "NON-UTILISE"
  - desc: Fa0/1 à Fa0/10 et Gi0/1 restent actifs
    expr: not any(i.shutdown for i in ports("fa0/1-10")) and not intf("g0/1").shutdown
    hint: "Attention à la plage : seuls les ports 11 à 24 doivent être éteints."
solution: |
  configure terminal
  interface range fa0/11 - 24
  description NON-UTILISE
  shutdown
  interface g0/2
  description NON-UTILISE
  shutdown
  end
cours: |
  ## Un port libre est une porte ouverte

  Sur un switch, tous les ports sont **actifs** par défaut et placés dans le VLAN 1. Une prise
  murale inutilisée mais brassée permet à n'importe qui de se brancher sur le réseau interne :
  visiteur, prestataire, appareil personnel. Éteindre les ports inutilisés est l'une des
  premières mesures de durcissement d'un switch d'accès.

  ### Configuration (autres valeurs)

  ```
  SW1(config)# interface range fa0/30 - 48 , gi0/4
  SW1(config-if-range)# description LIBRE
  SW1(config-if-range)# switchport mode access
  SW1(config-if-range)# switchport access vlan 998
  SW1(config-if-range)# shutdown
  SW1# show interfaces status | include disabled
  Fa0/30   LIBRE    disabled 998   auto   auto 10/100BaseTX
  ```

  Bonnes pratiques complémentaires :

  - placer ces ports dans un VLAN « parking » **sans routage** (999, nommé `PARKING` ou
    `INUTILISE`) : si quelqu'un réactive le port par erreur, il n'atteint rien ;
  - forcer le mode `access` pour qu'aucun trunk ne puisse être négocié ;
  - une description explicite pour que le collègue comprenne pourquoi le port est éteint.

  ### États d'un port

  | `show interfaces status` | Signification                       |
  |--------------------------|-------------------------------------|
  | `connected`              | actif, un équipement est branché     |
  | `notconnect`             | actif, rien de branché              |
  | `disabled`               | `shutdown` (administratively down)  |
  | `err-disabled`           | coupé par une protection (BPDU Guard, port-security...) |

  Pour remettre en service un port : `no shutdown` (et son VLAN normal).

  ### Pièges fréquents

  - Éteindre l'uplink ou le port sur lequel on est connecté : on perd la main sur le switch.
  - Se tromper de plage dans `interface range`.
  - Oublier les ports gigabit en plus des ports FastEthernet.

  ### Pour le CCNA

  La désactivation des ports inutilisés et le VLAN parking sont cités parmi les bonnes pratiques
  de sécurité des switchs.
