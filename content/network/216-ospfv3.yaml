title: OSPFv3 multizone pour IPv6
level: avance
order: 16
device: router
hostname: R-ABR10
tags: [ospfv3, ipv6, multizone, stub, abr]
summary: Déployer OSPFv3 sur un routeur de bordure de zone, avec une zone stub.
description: |
  `R-ABR10` relie la zone de backbone (`G0/1`) à la zone `10` d'un bâtiment (`G0/0` : LAN des
  utilisateurs, `G0/2` : lien vers le routeur d'étage). Les adresses IPv6 sont en place, mais le
  routage IPv6 n'est pas activé.

  1. active le routage IPv6 ;
  2. processus OSPFv3 `1`, router-id `10.10.10.1` ;
  3. `G0/1` dans la zone `0`, `G0/0` et `G0/2` dans la zone `10` (configuration **par
     interface** : `ipv6 ospf 1 area ...`) ;
  4. la zone `10` est une zone **stub** ;
  5. aucun message OSPF sur le LAN des utilisateurs : `G0/0` passive.

  Contrôle avec `show ipv6 ospf interface brief` et `show ipv6 protocols`.
initial: |
  interface g0/0
  ipv6 address 2001:db8:10:1::1/64
  no shutdown
  interface g0/1
  ipv6 address 2001:db8:0:12::1/64
  no shutdown
  interface g0/2
  ipv6 address 2001:db8:10:2::1/64
  no shutdown
checks:
  - desc: Routage IPv6 actif et router-id 10.10.10.1
    expr: d.ipv6_routing and d.ospfv3[1].router_id == "10.10.10.1"
  - desc: G0/1 en zone 0, G0/0 et G0/2 en zone 10
    expr: intf("g0/1").ospfv3_area == (1, "0") and intf("g0/0").ospfv3_area == (1, "10") and intf("g0/2").ospfv3_area == (1, "10")
  - desc: Zone 10 stub
    expr: d.ospfv3[1].area_types.get("10") == "stub"
  - desc: G0/0 passive, G0/1 et G0/2 actives
    expr: d.ospfv3[1].is_passive("g0/0") and not d.ospfv3[1].is_passive("g0/1") and not d.ospfv3[1].is_passive("g0/2")
solution: |
  configure terminal
  ipv6 unicast-routing
  ipv6 router ospf 1
  router-id 10.10.10.1
  area 10 stub
  passive-interface g0/0
  exit
  interface g0/1
  ipv6 ospf 1 area 0
  interface g0/0
  ipv6 ospf 1 area 10
  interface g0/2
  ipv6 ospf 1 area 10
  end
cours: |
  ## OSPFv3 : le même OSPF, adapté à IPv6

  OSPFv3 (RFC 5340) reprend les concepts d'OSPFv2 : états de liens, algorithme SPF de Dijkstra,
  zones, DR/BDR, coût fondé sur la bande passante. Les différences pratiques :

  | OSPFv2 (IPv4)                       | OSPFv3 (IPv6)                                      |
  |-------------------------------------|----------------------------------------------------|
  | `network ... area ...` sous le processus | `ipv6 ospf <pid> area <zone>` **sur l'interface** |
  | voisins identifiés par l'adresse IP | voisins joints par leur adresse **link-local**     |
  | multicast 224.0.0.5 / .6            | `FF02::5` / `FF02::6`                              |
  | authentification intégrée           | s'appuie sur IPsec (ou la trailer d'authentification RFC 7166) |
  | router-id = plus haute IPv4         | router-id **toujours sur 32 bits** : à fixer à la main sur un routeur 100 % IPv6 |

  ### Configuration (autres valeurs)

  ```
  R1(config)# ipv6 unicast-routing
  R1(config)# ipv6 router ospf 5
  R1(config-rtr)# router-id 5.5.5.5
  R1(config-rtr)# area 51 stub no-summary
  R1(config-rtr)# passive-interface gi0/3
  R1(config)# interface gi0/0
  R1(config-if)# ipv6 ospf 5 area 0
  R1(config)# interface gi0/3
  R1(config-if)# ipv6 ospf 5 area 51
  R1# show ipv6 ospf neighbor
  Neighbor ID     Pri   State           Dead Time   Interface ID    Interface
  6.6.6.6           1   FULL/DR         00:00:35    3               GigabitEthernet0/0
  R1# show ipv6 route ospf
  OI  2001:DB8:51:4::/64 [110/2] via FE80::6, GigabitEthernet0/0
  ```

  Sans router-id et sans aucune adresse IPv4, le processus refuse de démarrer
  (`%OSPFv3-4-NORTRID`).

  ### Les zones stub

  Un **ABR** (routeur entre le backbone et une autre zone) peut filtrer ce qu'il envoie dans une
  zone sans issue :

  - `stub` : pas de routes externes (LSA de type 5) ; une route par défaut les remplace ;
  - `stub no-summary` (*totally stubby*, à configurer sur l'ABR) : ni externes ni inter-zones,
    seulement la route par défaut ;
  - `nssa` : zone stub qui contient pourtant un ASBR.

  **Tous** les routeurs de la zone doivent déclarer `area X stub`, sinon l'adjacence ne se forme
  pas (le drapeau stub figure dans les hellos).

  ### Pièges fréquents

  - Oublier `ipv6 unicast-routing` : le processus OSPFv3 refuse de démarrer.
  - Activer OSPFv3 sur l'interface sans créer le processus avec un router-id.
  - Déclarer la zone stub sur un seul côté du lien.

  ### Pour le CCNP ENCOR

  ENCOR couvre OSPFv2 et OSPFv3 : configuration par interface, types de zones, LSA et
  vérification des adjacences.
