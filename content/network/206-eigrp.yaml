title: Routage EIGRP
level: avance
order: 6
device: router
hostname: R-NANTES
tags: [eigrp, routage dynamique, wildcard]
summary: Rejoindre le système autonome EIGRP 100 de l'entreprise.
description: |
  Le réseau étendu de l'entreprise tourne en **EIGRP**, système autonome `100`.
  Raccorde le site de Nantes :

  1. `router eigrp 100` ;
  2. identifiant : `eigrp router-id 2.2.2.2` ;
  3. annonce **précisément** chaque réseau avec un masque générique :
     - LAN `192.168.20.0/24`,
     - lien vers le siège `10.0.12.0/30` (`G0/1`),
     - lien vers Rennes `10.0.23.0/30` (`S0/0/0`) ;
  4. `no auto-summary` ;
  5. LAN `G0/0` passive.

  Le numéro d'AS doit être **identique** sur tous les routeurs, sinon ils ne deviennent pas voisins.
initial: |
  interface g0/0
  ip address 192.168.20.1 255.255.255.0
  no shutdown
  interface g0/1
  ip address 10.0.12.2 255.255.255.252
  no shutdown
  interface s0/0/0
  ip address 10.0.23.1 255.255.255.252
  no shutdown
checks:
  - desc: EIGRP AS 100 avec router-id 2.2.2.2
    expr: 100 in d.eigrp and d.eigrp[100].router_id == "2.2.2.2"
    hint: "router eigrp 100 puis eigrp router-id 2.2.2.2"
  - desc: LAN 192.168.20.0/24 annoncé avec son wildcard
    expr: eigrp_net(100, "192.168.20.0", "0.0.0.255")
  - desc: Liens WAN 10.0.12.0/30 et 10.0.23.0/30 annoncés avec leur wildcard
    expr: eigrp_net(100, "10.0.12.0", "0.0.0.3") and eigrp_net(100, "10.0.23.0", "0.0.0.3")
    hint: "Un /30 correspond au wildcard 0.0.0.3"
  - desc: Résumé automatique désactivé
    expr: 100 in d.eigrp and not d.eigrp[100].auto_summary
  - desc: G0/0 passive
    expr: 100 in d.eigrp and d.eigrp[100].is_passive("g0/0")
solution: |
  configure terminal
  router eigrp 100
  eigrp router-id 2.2.2.2
  network 192.168.20.0 0.0.0.255
  network 10.0.12.0 0.0.0.3
  network 10.0.23.0 0.0.0.3
  no auto-summary
  passive-interface g0/0
  end
