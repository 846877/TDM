title: Corriger la configuration d'un collègue
level: debutant
order: 15
device: switch
tags: [dépannage, vlan, sauvegarde]
summary: Repérer les erreurs avec les commandes show, corriger, puis sauvegarder.
description: |
  Un collègue a préparé le switch de la comptabilité mais a laissé des erreurs.
  Commence par observer : `show running-config`, `show vlan brief`.

  Le cahier des charges demandait :

  - nom d'hôte `SW-COMPTA` ;
  - tous les ports `Fa0/1` à `Fa0/8` dans le VLAN `20 COMPTA` ;
  - **aucun** VLAN de test sur le switch de production.

  Corrige les erreurs (`no vlan ...` supprime un VLAN), puis **sauvegarde** la configuration
  (`copy running-config startup-config`).
initial: |
  hostname SW-COMPTE
  vlan 20
  name COMPTA
  vlan 30
  name TEST
  interface range fa0/1 - 8
  switchport mode access
  switchport access vlan 20
  interface fa0/5
  switchport access vlan 30
checks:
  - desc: Le switch s'appelle SW-COMPTA
    expr: d.hostname == "SW-COMPTA"
  - desc: Fa0/1 à Fa0/8 sont tous dans le VLAN 20
    expr: all(i.mode == "access" and i.access_vlan == 20 for i in ports("fa0/1-8"))
    hint: "show vlan brief : un port n'est pas dans le bon VLAN."
  - desc: Le VLAN de test 30 est supprimé
    expr: 30 not in d.vlans
    hint: "no vlan 30"
  - desc: Configuration sauvegardée après les corrections
    expr: d.saved
solution: |
  configure terminal
  hostname SW-COMPTA
  interface fa0/5
  switchport access vlan 20
  exit
  no vlan 30
  end
  copy running-config startup-config
cours: |
  ## Lire avant de modifier

  Reprendre la configuration d'un collègue commence toujours par l'**observation** : on ne
  corrige que ce qu'on a compris. Les commandes `show` sont sans risque et s'utilisent en mode
  privilégié (ou avec `do` depuis la configuration).

  | Question                         | Commande                                  |
  |----------------------------------|-------------------------------------------|
  | quel est le nom, la config complète ? | `show running-config`                |
  | quels VLAN existent, quels ports ? | `show vlan brief`                       |
  | état et VLAN de chaque port      | `show interfaces status`                  |
  | détail d'un port                 | `show running-config interface fa0/9`     |
  | différence avec la sauvegarde    | `show startup-config`                     |

  ### Filtrer les sorties

  ```
  SW1# show running-config | include hostname|vlan
  SW1# show running-config | section interface FastEthernet0/9
  SW1# show interfaces status | exclude notconnect
  SW1# show vlan brief | begin 30
  ```

  `include`, `exclude`, `begin` et `section` évitent de faire défiler des pages entières.

  ### Corriger (exemple avec d'autres valeurs)

  ```
  SW1(config)# hostname SW-ATELIER
  SW-ATELIER(config)# interface fa0/9
  SW-ATELIER(config-if)# switchport access vlan 40
  SW-ATELIER(config-if)# exit
  SW-ATELIER(config)# no vlan 60
  SW-ATELIER(config)# end
  SW-ATELIER# copy running-config startup-config
  ```

  - une nouvelle valeur **remplace** l'ancienne (`hostname`, `switchport access vlan`) ;
  - `no` supprime un élément (`no vlan 60`) ;
  - tant qu'on n'a pas sauvegardé, le prochain redémarrage ramène l'ancienne configuration.

  ### Méthode

  1. lire la demande et la configuration actuelle ;
  2. lister les écarts ;
  3. corriger un écart à la fois, vérifier avec `show` ;
  4. sauvegarder et noter ce qui a été fait.

  ### Pièges fréquents

  - Supprimer un VLAN qui contient encore des ports : ils deviennent inactifs.
  - Corriger sans sauvegarder.
  - Modifier « au feeling » sans vérifier l'effet.

  ### Pour le CCNA

  Interpréter les sorties `show` pour repérer une erreur est au cœur des questions de dépannage.
