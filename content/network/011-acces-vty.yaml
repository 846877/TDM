title: Accès à distance par Telnet
level: debutant
order: 11
device: switch
hostname: SW-LABO
tags: [vty, telnet, mots de passe]
summary: Configurer les lignes virtuelles pour administrer le switch à distance.
description: |
  Au laboratoire de tests, on administre les switchs à distance via les **lignes VTY**
  (les sessions Telnet/SSH). Sans mot de passe sur les VTY, IOS refuse toute connexion.

  1. Mot de passe du mode privilégié chiffré : `enable secret Lab0Secret` ;
  2. lignes `vty 0 15` : mot de passe `Labo2024`, `login`, et `transport input telnet` ;
  3. chiffre les mots de passe en clair avec `service password-encryption`.

  ⚠️ Telnet fait circuler les mots de passe **en clair** : on ne l'utilise que dans un labo isolé.
  Tu passeras à SSH au niveau intermédiaire.
checks:
  - desc: enable secret configuré
    expr: d.enable_secret == "Lab0Secret"
  - desc: Mot de passe Labo2024 sur les VTY
    expr: line("vty").password == "Labo2024"
    hint: "line vty 0 15 puis password Labo2024"
  - desc: Authentification demandée sur les VTY
    expr: line("vty").login == "login"
  - desc: Telnet autorisé sur les VTY
    expr: line("vty").transport_input == "telnet"
  - desc: Mots de passe chiffrés dans la configuration
    expr: d.password_encryption
solution: |
  configure terminal
  enable secret Lab0Secret
  line vty 0 15
  password Labo2024
  login
  transport input telnet
  exit
  service password-encryption
  end
cours: |
  ## Les lignes virtuelles (VTY)

  Pour administrer un équipement sans être devant, on s'y connecte à distance par **Telnet** ou
  **SSH**. Chaque session distante occupe une **ligne virtuelle** (*Virtual TeletYpe*). Un switch
  Cisco en propose 16 (`vty 0 15`), certains routeurs 5 (`vty 0 4`) : c'est le nombre de sessions
  simultanées possibles.

  Par défaut, les VTY n'ont pas de mot de passe et **refusent** toute connexion
  (`Password required, but none set`). Il faut aussi un **enable secret**, sinon on ne peut pas
  passer en mode privilégié à distance (`% No password set`).

  ### Configuration (autres valeurs)

  ```
  SW1(config)# enable secret Ena-Distant9
  SW1(config)# line vty 0 15
  SW1(config-line)# password Vty-Labo7
  SW1(config-line)# login
  SW1(config-line)# transport input telnet
  SW1(config-line)# exit
  SW1(config)# service password-encryption
  SW1# show line summary
  SW1# show users
      Line       User       Host(s)              Idle       Location
  *  0 con 0                idle                 00:00:00
   1 vty 0                  idle                 00:00:12 192.168.99.50
  ```

  - `login` : demander le mot de passe de la ligne ;
  - `transport input` : protocoles acceptés (`telnet`, `ssh`, `all`, `none`) ;
  - prérequis : une adresse IP joignable sur l'équipement (SVI de gestion ou interface de
    routeur).

  ### Pourquoi Telnet est déconseillé

  Telnet (TCP 23) transmet **tout en clair**, mot de passe compris : une simple capture
  Wireshark suffit à le lire. Il n'est acceptable qu'en laboratoire isolé. En production, on
  utilise **SSH** (exercice « accès SSH sécurisé »), qui chiffre la session.

  ### Pièges fréquents

  - Configurer `vty 0 4` seulement sur un switch : les lignes 5 à 15 restent dans leur état
    précédent.
  - Oublier l'enable secret : connexion possible mais bloquée au mode utilisateur.
  - `login` sans `password` : la ligne refuse toute connexion.

  ### Pour le CCNA

  Configurer les VTY, connaître la différence Telnet/SSH et ses conséquences de sécurité sont au
  programme.
