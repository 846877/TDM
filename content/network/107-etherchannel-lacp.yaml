title: EtherChannel LACP
level: intermediaire
order: 7
device: switch
hostname: SW-DIST1
tags: [etherchannel, lacp, trunk, port-channel]
summary: Agréger deux liens pour doubler le débit et survivre à une coupure.
description: |
  `SW-DIST1` est relié au cœur de réseau par **deux** câbles (`Gi0/1` et `Gi0/2`). Sans agrégation,
  le spanning tree bloque l'un des deux liens. Avec un **EtherChannel**, les deux liens forment
  un seul lien logique, l'interface `Port-channel 1`.

  1. Sur `Gi0/1` et `Gi0/2` : `channel-group 1 mode active` (LACP, norme IEEE 802.3ad) ;
  2. configure ensuite l'interface logique `interface port-channel 1` :
     - mode trunk,
     - VLAN natif `99`,
     - VLAN autorisés `10`, `20` et `99`.

  Vérifie avec `show etherchannel summary` puis `show interfaces trunk`.

  Rappel des modes : `active`/`passive` = LACP, `desirable`/`auto` = PAgP (Cisco), `on` = statique.
initial: |
  vlan 10
  name ADMIN
  vlan 20
  name COMPTA
  vlan 99
  name MGMT
checks:
  - desc: Gi0/1 et Gi0/2 dans le groupe 1 en mode LACP active
    expr: all(i.channel_group == 1 and i.channel_mode == "active" for i in ports("g0/1-2"))
    hint: "interface range g0/1 - 2 puis channel-group 1 mode active"
  - desc: Le Port-channel 1 regroupe exactement Gi0/1 et Gi0/2
    expr: members(1) == ["Gi0/1", "Gi0/2"]
  - desc: Port-channel 1 en trunk
    expr: intf("po1").mode == "trunk"
    hint: "La configuration du trunk se fait sur interface port-channel 1"
  - desc: VLAN natif 99 et VLAN autorisés 10, 20, 99 sur le Port-channel
    expr: intf("po1").native_vlan == 99 and intf("po1").allowed_vlans() == {10, 20, 99}
solution: |
  configure terminal
  interface range g0/1 - 2
  channel-group 1 mode active
  interface port-channel 1
  switchport mode trunk
  switchport trunk native vlan 99
  switchport trunk allowed vlan 10,20,99
  end
cours: |
  ## Pourquoi agréger des liens ?

  Deux câbles entre deux switchs : sans précaution, le spanning tree en **bloque** un pour éviter
  une boucle, et la moitié de la capacité est perdue. Un **EtherChannel** regroupe jusqu'à 8
  liens en une interface logique (`Port-channel`) : STP ne voit qu'un lien, le trafic est réparti
  sur tous les câbles et la coupure de l'un d'eux est transparente.

  ### Les protocoles de négociation

  | Protocole | Norme          | Modes                         |
  |-----------|----------------|-------------------------------|
  | **LACP**  | IEEE 802.3ad / 802.1AX | `active` / `passive`  |
  | PAgP      | Cisco          | `desirable` / `auto`          |
  | aucun     | —              | `on` (forcé)                  |

  LACP est le choix par défaut : standard, interopérable avec les serveurs et les autres
  constructeurs. `active` des deux côtés est la configuration la plus robuste ; deux côtés
  `passive` ne forment jamais le canal.

  ### Configuration (autres valeurs)

  ```
  SW1(config)# interface range gi1/0/47 - 48
  SW1(config-if-range)# channel-group 4 mode active
  Creating a port-channel interface Port-channel 4
  SW1(config-if-range)# interface port-channel 4
  SW1(config-if)# switchport mode trunk
  SW1(config-if)# switchport trunk native vlan 990
  SW1(config-if)# switchport trunk allowed vlan 40,50,990
  SW1# show etherchannel summary
  Flags:  D - down   P - bundled in port-channel   S - Layer2   U - in use
  Group  Port-channel  Protocol    Ports
  4      Po4(SU)       LACP        Gi1/0/47(P) Gi1/0/48(P)
  ```

  La configuration de trunk se fait sur le **port-channel** ; elle est recopiée sur les membres.

  ### Conditions de compatibilité

  Tous les membres doivent avoir la même vitesse, le même duplex, le même mode (access/trunk),
  les mêmes VLAN autorisés et natif. Un membre différent est suspendu (drapeau `s`).

  ### Répartition de charge

  Un flux suit toujours le même lien (hachage des adresses MAC ou IP) : deux liens à 1 Gbit/s ne
  donnent pas 2 Gbit/s à un seul transfert, mais à l'ensemble des flux.

  ### Pièges fréquents

  - Configurer les membres différemment (ports suspendus).
  - `passive` des deux côtés.
  - Mode `on` d'un côté et LACP de l'autre : boucle possible.

  ### Pour le CCNA

  EtherChannel (LACP, PAgP, statique) et sa vérification sont au programme.
