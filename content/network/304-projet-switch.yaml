title: "Projet : déployer un switch d'accès"
level: expert
order: 4
device: switch
tags: [projet, vlan, trunk, ssh, sécurité]
summary: Tout mettre bout à bout comme en entreprise.
description: |
  Tu reçois un switch neuf à installer à l'étage 2. Cahier des charges :

  **Identité et sécurité**
  - hostname `SW-ET2`, domaine `tdm.local`, `enable secret` à `Et2@dmin`
  - utilisateur `netadmin` privilège 15 (secret au choix), SSH v2 uniquement sur les VTY (clés ≥ 2048 bits)
  - chiffrement des mots de passe, `no ip domain-lookup`

  **VLAN**
  - `10 ADMIN`, `20 COMPTA`, `99 MGMT`, `999 PARKING`
  - `Fa0/1-12` → VLAN 10, `Fa0/13-20` → VLAN 20 (access + PortFast)
  - `Fa0/21-24` → VLAN 999, éteints

  **Uplink et gestion**
  - `Gi0/1` trunk, natif 99, VLAN autorisés 10,20,99
  - `interface vlan 99` en `192.168.99.12/24`, passerelle `192.168.99.1`

  **Pour finir** : sauvegarde la configuration.
checks:
  - desc: Identité (hostname, domaine, enable secret)
    expr: d.hostname == "SW-ET2" and d.domain_name == "tdm.local" and d.enable_secret == "Et2@dmin"
  - desc: SSH v2 avec utilisateur netadmin privilège 15
    expr: d.users.get("netadmin", {}).get("privilege") == 15 and d.ssh_version == 2 and (d.rsa_modulus or 0) >= 2048 and line("vty").login == "local" and line("vty").transport_input == "ssh"
  - desc: Mots de passe chiffrés et pas de résolution DNS
    expr: d.password_encryption and not d.domain_lookup
  - desc: VLAN créés et nommés
    expr: vlan(10) == "ADMIN" and vlan(20) == "COMPTA" and vlan(99) == "MGMT" and vlan(999) == "PARKING"
  - desc: Ports utilisateurs affectés avec PortFast
    expr: all(i.mode == "access" and i.access_vlan == 10 and i.portfast for i in ports("fa0/1-12")) and all(i.mode == "access" and i.access_vlan == 20 and i.portfast for i in ports("fa0/13-20"))
  - desc: Ports inutilisés parqués et éteints
    expr: all(i.access_vlan == 999 and i.shutdown for i in ports("fa0/21-24"))
  - desc: Uplink trunk Gi0/1
    expr: intf("g0/1").mode == "trunk" and intf("g0/1").native_vlan == 99 and intf("g0/1").allowed_vlans() == {10, 20, 99}
  - desc: Gestion sur le VLAN 99
    expr: intf("vlan99").ip == "192.168.99.12" and not intf("vlan99").shutdown and d.default_gateway == "192.168.99.1"
  - desc: Configuration sauvegardée
    expr: d.saved
solution: |
  configure terminal
  hostname SW-ET2
  no ip domain-lookup
  ip domain-name tdm.local
  enable secret Et2@dmin
  service password-encryption
  username netadmin privilege 15 secret N3t@dmin
  crypto key generate rsa general-keys modulus 2048
  ip ssh version 2
  line vty 0 15
  login local
  transport input ssh
  exit
  vlan 10
  name ADMIN
  vlan 20
  name COMPTA
  vlan 99
  name MGMT
  vlan 999
  name PARKING
  interface range fa0/1 - 12
  switchport mode access
  switchport access vlan 10
  spanning-tree portfast
  interface range fa0/13 - 20
  switchport mode access
  switchport access vlan 20
  spanning-tree portfast
  interface range fa0/21 - 24
  switchport mode access
  switchport access vlan 999
  shutdown
  interface g0/1
  switchport mode trunk
  switchport trunk native vlan 99
  switchport trunk allowed vlan 10,20,99
  interface vlan 99
  ip address 192.168.99.12 255.255.255.0
  no shutdown
  exit
  ip default-gateway 192.168.99.1
  end
  write memory
cours: |
  ## Déployer un switch d'accès de A à Z

  En entreprise, un nouveau switch se configure selon une **liste de contrôle** toujours dans le
  même ordre. Le suivre évite d'oublier une étape et de se retrouver sans accès.

  ### 1. Identité et sécurité de base

  ```
  hostname SW-ET4-02
  no ip domain-lookup
  ip domain-name exemple.lan
  enable secret <secret>
  service password-encryption
  username ops privilege 15 secret <secret>
  ```

  ### 2. Accès distant sécurisé

  ```
  crypto key generate rsa general-keys modulus 2048
  ip ssh version 2
  line vty 0 15
   login local
   transport input ssh
  ```

  ### 3. VLAN et ports

  ```
  vlan 40
   name BUREAUX
  vlan 199
   name GESTION
  vlan 998
   name PARKING
  interface range fa0/1 - 20
   switchport mode access
   switchport access vlan 40
   spanning-tree portfast
  interface range fa0/21 - 24
   switchport mode access
   switchport access vlan 998
   shutdown
  ```

  ### 4. Uplink et gestion

  ```
  interface gi0/1
   switchport mode trunk
   switchport trunk native vlan 990
   switchport trunk allowed vlan 40,199,990
  interface vlan 199
   ip address 10.199.0.42 255.255.255.0
   no shutdown
  ip default-gateway 10.199.0.254
  ```

  ### 5. Vérifier puis sauvegarder

  `show vlan brief`, `show interfaces trunk`, `show ip interface brief`, `show ip ssh`, test de
  connexion SSH depuis le poste d'administration, puis `copy running-config startup-config`.

  ### Bonnes pratiques

  - préparer la configuration dans un fichier texte (modèle) et la coller par la console ;
  - configurer l'accès SSH **avant** de quitter la console, et le tester ;
  - documenter les ports (`description`) ;
  - sauvegarder une copie hors de l'équipement (TFTP, outil de gestion).

  ### Pièges fréquents

  - Changer le VLAN natif d'un seul côté du trunk.
  - Oublier la passerelle par défaut : le switch n'est joignable que depuis son propre réseau.
  - Ne pas sauvegarder : tout est perdu au premier redémarrage.

  ### Pour le CCNA

  Ce projet récapitule les bases attendues : sécurité de l'accès, VLAN, trunk, gestion et SSH.
